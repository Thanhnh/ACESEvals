[project]
name = "aces-evals"
version = "0.1.0"
description = "Agent Capability Evaluation Suite (ACES) — security agent benchmarks. SABER is the internal Microsoft codename for this project."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "MSEC AI Benchmarking Team", email = "kyledeprow@microsoft.com"}
]
keywords = [
    "cybersecurity",
    "security",
    "agent-evaluation",
    "benchmarking",
    "penetration-testing",
    "incident-response",
    "mcp",
    "inspect-ai"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "saber",
    "inspect-ai",
    "openai>=2.26.0",
    "huggingface-hub",
]

[project.optional-dependencies]
copilot = [
    # GitHub Copilot agent support (requires Node.js 22+ and Copilot CLI)
    "github-copilot-sdk>=0.1.16",
]
claude-code = [
    # Claude Code agent support (requires Anthropic API key)
    "claude-code-sdk>=0.0.25",
]
analysis = [
    "scipy>=1.11.0",
    "seaborn>=0.13.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
# GitHub (external):
Homepage = "https://github.com/microsoft/ACESEvals"
Documentation = "https://github.com/microsoft/ACESEvals"
Repository = "https://github.com/microsoft/ACESEvals"
Issues = "https://github.com/microsoft/ACESEvals/issues"
# Azure DevOps (Microsoft internal):
# Homepage = "https://dev.azure.com/MSECAIModels/Benchmarking/_git/oss_saber"
# Repository = "https://dev.azure.com/MSECAIModels/Benchmarking/_git/oss_saber"

[tool.uv]
package = false

[tool.uv.sources]
# === Source Configuration ===
# Choose ONE saber source based on your repository:
#
# GitHub (external — default for ACESEvals repo):
saber = { git = "https://github.com/microsoft/ACES.git", branch = "main" }
# Azure DevOps (Microsoft internal — default for oss_saber repo):
# saber = { git = "https://MSECAIModels@dev.azure.com/MSECAIModels/Benchmarking/_git/SABER", branch = "main" }
# Local editable (for development against a local checkout):
# saber = { path = "./external/saber", editable = true }
#
# NOTE: The saber dependency uses branch = "main" for convenience, but uv.lock
# pins the exact commit hash for reproducibility. After pushing changes to the
# ACES/SABER library repo, you MUST update the lock in this repo:
#
#   uv lock --upgrade-package saber && uv sync --all-extras
#
# Then commit the updated uv.lock. Without this step, evals will continue
# using the old saber version even though the branch has moved forward.

# inspect-ai: ADO fork required for tool_call limit functionality not yet merged upstream.
# Uncomment the GitHub or local lines below if/when upstream merges the feature.
#
# Azure DevOps (Microsoft internal — for oss_saber repo):
inspect-ai = { git = "https://MSECAIModels@dev.azure.com/MSECAIModels/Benchmarking/_git/inspect_ai", branch = "dev/aces_integration" }
# GitHub (external — default for ACESEvals repo):
# inspect-ai = { git = "https://github.com/microsoft/ACESEvals.git", branch = "inspect-ai/dev/aces_integration" }
# Local editable (for development against a local checkout):
# inspect-ai = { path = "./external/inspect_ai", editable = true }

[dependency-groups]
dev = [
    "pytest-asyncio>=1.2.0",
]
