services:
  default:
    image: saber/cti_realm/sandbox:latest
    x-local: true
    working_dir: /workspace
    command: "tail -f /dev/null"
    init: true
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
      - KUSTO_CLUSTER_URL=http://saber-cti-kusto-emulator:8080
      - KUSTO_DATABASE=NetDefaultDB
      - MITRE_SERVICE_URL=http://saber-cti-mitre-service:8081
      - QUERY_TIMEOUT=60
      - MAX_QUERY_ROWS=10000
    networks:
      - cti-realm-database
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://saber-cti-kusto-emulator:8080/v1/rest/mgmt -H 'Content-Type: application/json' -d '{\"db\":\"NetDefaultDB\",\"csl\":\".show version\"}' > /dev/null && curl -sf http://saber-cti-mitre-service:8081/health > /dev/null && test -f /opt/cti_realm/data/cti_reports/reports.jsonl && test -f /opt/cti_realm/data/sigma_rules.json",
        ]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 256

networks:
  cti-realm-database:
    external: true
    name: ${SABER_PROJECT}_cti-realm-database
