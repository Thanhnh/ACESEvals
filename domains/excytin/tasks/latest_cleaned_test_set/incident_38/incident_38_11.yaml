tasks:
- task_id: incident_38_latest_cleaned_test_set_task_11
  title: incident_38_latest_cleaned_test_set_task_11
  description: 'In the related process injection alert, what remote URL was contacted by the affected process?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a suspicious application window discovery technique was detected on a device, where `powershell.exe` (Process ID 7472, created at 2024-06-26T15:49:15.786Z) was used to gather information about the target device or network. Shortly after, at 2024-07-04 22:35:01 UTC, a related alert was raised for suspicious process injection, where a process abnormally injected code into another process — a technique often used to hide malicious code execution within a trusted process, which may then connect to a command and control server.'
    question: 'In the related process injection alert, what remote URL was contacted by the affected process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with AadUserId `12185914-91dd-4fb9-94f9-3252203b0426` was used to run a known tool or technique for suspicious application window discovery on the device, gathering information for later attacks.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the discovery activity, a process abnormally injected code into another process, and the injected code reached out to the URL `https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
