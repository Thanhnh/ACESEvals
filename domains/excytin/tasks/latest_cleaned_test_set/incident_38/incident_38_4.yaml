tasks:
- task_id: incident_38_latest_cleaned_test_set_task_4
  title: incident_38_latest_cleaned_test_set_task_4
  description: 'A closely related alert on the same activity reports suspicious process injection, where a process abnormally injected code into another process and the target process then reached out to an external resource. What is the full URL that was contacted in that process injection alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired for "Unexpected behavior observed by a process ran with no command line arguments" — the legitimate process by that name does not normally behave this way, which can indicate injected code or a malicious executable masquerading as a legitimate one. This activity was associated with the IP address `202.183.149.174`.'
    question: 'A closely related alert on the same activity reports suspicious process injection, where a process abnormally injected code into another process and the target process then reached out to an external resource. What is the full URL that was contacted in that process injection alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process named `notepad.exe` (ExtractedFileName: `notepad.exe`) was run with no command line arguments and exhibited unexpected behavior, indicating possible code injection or masquerading, at 2024-07-04 22:35:01.443868+00:00.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The abnormally injected process then performed suspicious process injection activity and reached out to the URL `https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt` at 2024-07-04 22:35:01.343148+00:00.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
