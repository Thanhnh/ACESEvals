tasks:
- task_id: incident_38_latest_cleaned_test_set_task_8
  title: incident_38_latest_cleaned_test_set_task_8
  description: 'For the related Suspicious Application Window Discovery alert, what was the process ID and creation time (UTC) of the process that performed the discovery activity, and which executable was it?'
  inherit_shared: true
  initial_context:
    incident_context: 'In this multi-stage incident, an alert fired for unexpected behavior observed by a process ran with no command line arguments — the process `notepad.exe` (Process ID 8932, created 2024-06-26T15:49:51.3043595Z) was involved, along with the IP address `202.183.149.174`. Such unexpected behavior may result from code injected into a legitimate process, or a malicious executable masquerading as a legitimate one by name. This activity is linked, via a shared user account, to an earlier alert on the same device for Suspicious Application Window Discovery, where a known tool or technique was used to gather information about the device.'
    question: 'For the related Suspicious Application Window Discovery alert, what was the process ID and creation time (UTC) of the process that performed the discovery activity, and which executable was it?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID 4656, created at 2024-06-26T15:49:41.4025245Z, running powershell.exe (launched with -executionpolicy bypass and a base64 -encodedcommand)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID 4656, created at 2024-06-26T15:49:41.4025245Z, running powershell.exe (launched with -executionpolicy bypass and a base64 -encodedcommand)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `12185914-91dd-4fb9-94f9-3252203b0426` was associated with a process that ran with no command line arguments but exhibited unexpected behavior, suggesting code injection or a masquerading malicious executable.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From that compromised context, a suspicious application window discovery was performed: PowerShell was launched with Process ID `4656` at `2024-06-26t15:49:41.4025245z` using the command line `"powershell.exe" -executionpolicy bypass -encodedcommand  -inputformat xml -outputformat text`, which decodes to code that downloads and uses WinAPI Introspection to enumerate application windows on the device.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
