tasks:
- task_id: incident_38_latest_cleaned_test_set_task_1
  title: incident_38_latest_cleaned_test_set_task_1
  description: 'In the related ''Suspicious process injection observed'' alert, what remote IP address was involved in the suspicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a ''Suspicious process injection observed'' alert was raised where `powershell.exe` ran with an execution-policy bypass and a long base64 encoded command (Process ID 4656, created 2024-06-26T15:49:41Z), using `-inputformat xml -outputformat text`. The decoded command disabled certificate validation and downloaded a remote text file, indicating code was abnormally injected into another process. A closely related process injection alert was triggered moments earlier and shares the same compromised user account.'
    question: 'In the related ''Suspicious process injection observed'' alert, what remote IP address was involved in the suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious process injection was observed under the user account with AadUserId `12185914-91dd-4fb9-94f9-3252203b0426`, where a process abnormally injected code into another process.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same suspicious process injection activity was associated with the IP address `72.5.72.208`, likely a command and control server contacted by the injected process.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
