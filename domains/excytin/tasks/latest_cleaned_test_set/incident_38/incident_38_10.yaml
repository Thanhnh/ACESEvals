  initial_context:
    incident_context: 'During an investigation, a suspicious process injection alert was raised where a process abnormally injected code into another process, and the activity involved the URL `https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt`. Moments later, on the same device, a related alert fired for unexpected behavior observed by a process that ran with no command line arguments, which may indicate injected code in a legitimate process or a malicious executable masquerading as a legitimate one.'
    question: 'For the follow-up alert about the process running with no command line arguments, what remote IP address was involved in that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '202.183.149.174'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '202.183.149.174'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious process injection was observed on the host with AadDeviceId `39d8c57f-2d08-4888-b0cd-12cd0679337a`, where a process abnormally injected code into another process to hide malicious execution within a trusted process.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The injected process, which ran with no command line arguments, then exhibited unexpected behavior by connecting to the suspicious command and control IP address `202.183.149.174`.'
