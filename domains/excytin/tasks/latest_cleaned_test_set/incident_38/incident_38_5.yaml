tasks:
- task_id: incident_38_latest_cleaned_test_set_task_5
  title: incident_38_latest_cleaned_test_set_task_5
  description: 'Shortly after this discovery activity, a related alert for ''Suspicious process injection observed'' was triggered, where a process abnormally injected code into another process. What is the full URL that this injected/fileless activity reached out to?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an alert for ''Suspicious Application Window Discovery'' was raised, indicating a known tool or technique was used to gather information about the device or network for later attacks. The activity involved the process `powershell.exe` (Process ID 7472, created 2024-06-26T15:49:15.7860486Z), and a second PowerShell instance (Process ID 4656) launched shortly after with the `-executionpolicy bypass -encodedcommand` parameters.'
    question: 'Shortly after this discovery activity, a related alert for ''Suspicious process injection observed'' was triggered, where a process abnormally injected code into another process. What is the full URL that this injected/fileless activity reached out to?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `nathans` was used to run a known tool/technique that performed suspicious application window discovery on the device, gathering information about the target device or network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'From that same compromised context, a process abnormally injected code into another process to hide malicious execution within a trusted process.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The injected code then caused the target process to reach out to the external URL `https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt`, indicating command and control / payload retrieval activity.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
