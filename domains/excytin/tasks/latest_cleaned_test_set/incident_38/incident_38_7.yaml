tasks:
- task_id: incident_38_latest_cleaned_test_set_task_7
  title: incident_38_latest_cleaned_test_set_task_7
  description: 'Pivoting from this alert through the same compromised host and user account, another related alert in this incident references a different external IP address involved in the attacker activity. What is that IP address?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Unexpected behavior observed by a process ran with no command line arguments" was raised on host `vnevado-win11a` (AAD device ID `39d8c57f-2d08-4888-b0cd-12cd0679337a`). The process `notepad.exe` (PID 8932, created 2024-06-26T15:49:51.3043595Z) was launched with no command line arguments, which the legitimate process does not normally do — this may indicate injected code or a malicious executable masquerading as the legitimate one. The activity was associated with the account `nathans` (SID `S-1-5-21-1240151660-3534038288-105586567-4122`, AAD user ID `12185914-91dd-4fb9-94f9-3252203b0426`) and the source IP `202.183.149.174`.'
    question: 'Pivoting from this alert through the same compromised host and user account, another related alert in this incident references a different external IP address involved in the attacker activity. What is that IP address?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An alert was raised for unexpected behavior observed by a process that ran with no command line arguments, which may indicate code injection into a legitimate process or a malicious executable masquerading as a legitimate one.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The suspicious process initiated a network connection to the remote IP address `72.5.72.208`, which is the entity associated with this alert.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
