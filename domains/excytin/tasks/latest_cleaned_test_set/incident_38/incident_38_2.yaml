tasks:
- task_id: incident_38_latest_cleaned_test_set_task_2
  title: incident_38_latest_cleaned_test_set_task_2
  description: 'In the second, closely related process injection alert, what was the file name of the process that performed the code injection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Suspicious process injection observed'' alert was raised on host `vnevado-win11a` for user account `nathans` (SID S-1-5-21-1240151660-3534038288-105586567-4122, IP 72.5.72.208). The alert involved the process `notepad.exe` (Process ID 8932, created 2024-06-26T15:49:51.3043595Z) and a reference to the URL `https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt`. A second, nearly simultaneous process injection alert was also triggered as part of the same activity.'
    question: 'In the second, closely related process injection alert, what was the file name of the process that performed the code injection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious process injection was observed: the process `notepad.exe` with Process ID `8932`, created at `2024-06-26t15:49:51.3043595z`, was abnormally injected with code, so unexpected code may be running inside this trusted process.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the same injection activity, the related process file identified in the alert is `powershell.exe` (ExtractedFileName), which is the process involved in the suspicious code injection and may connect to a command and control server.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
