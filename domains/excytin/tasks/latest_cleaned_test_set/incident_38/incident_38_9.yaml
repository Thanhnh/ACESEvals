tasks:
- task_id: incident_38_latest_cleaned_test_set_task_9
  title: incident_38_latest_cleaned_test_set_task_9
  description: 'In the related alert about unexpected behavior from a process run with no command line arguments, what remote IP address was involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert for ''Suspicious process injection observed'' was triggered, where a process abnormally injected code into another process. The alert involved `powershell.exe` (Process ID 4656, created 2024-06-26T15:49:41Z) executed with `-executionpolicy bypass` and a long Base64 encoded command, which was observed reaching out to `https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt`. This activity is linked through a shared user account to another alert raised moments later titled ''Unexpected behavior observed by a process ran with no command line arguments'', which may indicate injected code in a legitimate process or a masquerading executable.'
    question: 'In the related alert about unexpected behavior from a process run with no command line arguments, what remote IP address was involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '202.183.149.174'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '202.183.149.174'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious process injection was observed under the user account with AadUserId `12185914-91dd-4fb9-94f9-3252203b0426`, where a process abnormally injected code into another process to hide malicious execution within a trusted process.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The injected process, which was run with no command line arguments, exhibited unexpected behavior and communicated with the suspicious remote IP address `202.183.149.174`, likely a command and control server.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
