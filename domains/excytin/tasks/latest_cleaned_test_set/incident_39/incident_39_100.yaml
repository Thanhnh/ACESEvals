tasks:
- task_id: incident_39_latest_cleaned_test_set_task_100
  title: incident_39_latest_cleaned_test_set_task_100
  description: 'For the alert about a file being dropped and launched from a remote location, which user account name was involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, ''Kekeo'' malware was detected on host `vnevado-win10v` (AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`). This detection may indicate malware was stopped before delivering its payload, but the machine should still be checked for signs of infection. Related alerts on the same device include a sequence of activity indicative of human-operated malicious activity, as well as an alert where a remote session dropped a file and executed it, suggesting an attacker or malware attempting to move laterally or propagate.'
    question: 'For the alert about a file being dropped and launched from a remote location, which user account name was involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lucasb'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'lucasb'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The ''Kekeo'' malware detection was triggered by the file `rubeus.exe` on the device, indicating credential theft tooling was present.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A sequence of human-operated malicious activity was observed involving the process `psexesvc.exe`, indicating remote execution and lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The remote session that dropped and launched a file from a remote location was performed under the account `lucasb`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
