tasks:
- task_id: incident_39_latest_cleaned_test_set_task_93
  title: incident_39_latest_cleaned_test_set_task_93
  description: 'Around the same time on this device, an alert was raised for a suspicious service being started, which attackers often use to maintain persistence or elevate privileges. What was the command line of that service process, and what was its process ID and creation time?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, ''Kekeo'' malware was detected on host `vnevado-win10v` (AAD Device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`), suggesting an attacker may have been attempting lateral movement to this device from another device on the network.'
    question: 'Around the same time on this device, an alert was raised for a suspicious service being started, which attackers often use to maintain persistence or elevate privileges. What was the command line of that service process, and what was its process ID and creation time?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Command line: `psexesvc.exe`, Process ID: 7668, Created Time (UTC): 2024-06-27T14:34:10.0201983Z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Command line: `psexesvc.exe`, Process ID: 7668, Created Time (UTC): 2024-06-27T14:34:10.0201983Z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The ''Kekeo'' malware was detected as the file `rubeus.exe` on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The malware was detected during lateral movement, associated with the process with ExtractedFileName `psexesvc.exe`, indicating an attacker moving laterally from another device on the network.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A suspicious service was launched on the device with Process ID `7668` at `2024-06-27t14:34:10.0201983z` using the command line `psexesvc.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
