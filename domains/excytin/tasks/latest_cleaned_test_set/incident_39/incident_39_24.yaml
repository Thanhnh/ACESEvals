tasks:
- task_id: incident_39_latest_cleaned_test_set_task_24
  title: incident_39_latest_cleaned_test_set_task_24
  description: 'In the alert reporting that multiple dual-purpose tools were dropped on the device, what is the name of the well-known credential-theft tool file that was dropped?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a lateral movement incident, an alert titled ''File dropped and launched from remote location'' was triggered, indicating a remote session dropped a file and executed it. The process involved was recorded as `5912__2024-06-27t14:32:53.2267179z__psexesvc.exe`. Shortly afterwards, related alerts on the same device flagged ''Kekeo'' malware detected during lateral movement, and another alert reported that multiple known public dual-purpose tools were dropped on the device, which attackers may use for credential theft, privilege escalation, and lateral movement.'
    question: 'In the alert reporting that multiple dual-purpose tools were dropped on the device, what is the name of the well-known credential-theft tool file that was dropped?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A remote session dropped and executed a file, with the process `psexesvc.exe` (ExtractedFileName: `psexesvc.exe`) indicating remote execution used for lateral movement at 2024-07-04 22:35:01 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'During that lateral movement, the ''Kekeo'' malware was detected on the device as the file named `rubeus.exe`, a tool used for Kerberos ticket abuse and credential theft.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Along with it, multiple dual-purpose tools were dropped on the same device, including the credential theft tool file named `mimikatz.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
