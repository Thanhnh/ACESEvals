tasks:
- task_id: incident_39_latest_cleaned_test_set_task_10
  title: incident_39_latest_cleaned_test_set_task_10
  description: 'In that second credential theft tool execution alert, a URL/remote resource entity was recorded. What is the value of that URL entity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a known credential theft tool execution was detected on 2024-07-04 22:35:00 UTC. The process `powershell.exe` was involved, and the flagged command line was `4112__2024-06-27t14:32:36.6706405z__"mimikatz.exe" privilege::debug "sekurlsa::pth /user:kyleg /ntlm:96def1a633fc6790124d5f8fe31cc72b /domain:<redacted> /run:\"powershell.exe dir \\vnevado-win10b\c$\"" exit`, indicating an attempt to perform a pass-the-hash attack using stolen credentials. Roughly three seconds later, a second malicious credential theft tool execution alert was raised as part of the same incident.'
    question: 'In that second credential theft tool execution alert, a URL/remote resource entity was recorded. What is the value of that URL entity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-dc.vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-dc.vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `tgs2z` executed a known credential theft tool, with a command line indicating intent to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The credential theft tool execution was associated with the URL `vnevado-dc.vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
