tasks:
- task_id: incident_39_latest_cleaned_test_set_task_40
  title: incident_39_latest_cleaned_test_set_task_40
  description: 'For the alert reporting the malicious credential theft tool execution, what is the security identifier (SID) of the account associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage incident, an alert titled ''File dropped and launched from remote location'' was raised, indicating a remote session dropped a file and executed it, potentially as part of lateral movement. The file involved was `psexesvc.exe` (Process ID 7668, created 2024-06-27T14:34:10Z), and the remote activity was associated with the IP address `141.216.110.153`. Shortly afterwards, a suspicious service was launched on the same device, and a known credential theft tool execution command line was detected, where the process or its command line indicated an intent to dump users'' credentials, keys and plain-text passwords.'
    question: 'For the alert reporting the malicious credential theft tool execution, what is the security identifier (SID) of the account associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-5-7-21-1843151660-3234030288-105586167-1422'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-5-7-21-1843151660-3234030288-105586167-1422'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `lucasb` was used in a remote session that dropped a file and launched it on the device, indicating lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious service was launched on the device using the process `powershell.exe` to maintain persistence or elevate privileges.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` executed a known credential theft tool to dump users'' credentials and plain-text passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
