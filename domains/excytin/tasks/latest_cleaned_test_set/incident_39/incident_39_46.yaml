tasks:
- task_id: incident_39_latest_cleaned_test_set_task_46
  title: incident_39_latest_cleaned_test_set_task_46
  description: 'For the alert about a suspicious file being registered as a service, what is the name of the file that was registered?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert for "Potential human-operated malicious activity" was raised, showing a sequence of alerts that might indicate human-operated attack behavior on a device associated with the account `kyleg`. Such activity can lead to ransomware or other payloads being deployed on target devices. Around the same time, on the same device, another alert fired indicating that a file with suspicious attributes was registered as a service, which is a common persistence technique.'
    question: 'For the alert about a suspicious file being registered as a service, what is the name of the file that was registered?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'psexesvc.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'psexesvc.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sequence of alerts indicative of human-operated malicious activity was observed on the device with HostName `vnevado-win10b`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'As part of this activity, the suspicious file `psexesvc.exe` was registered as a service on the device, indicating the attacker used PsExec for remote execution and persistence.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
