tasks:
- task_id: incident_39_latest_cleaned_test_set_task_73
  title: incident_39_latest_cleaned_test_set_task_73
  description: 'A related alert on this device flagged a sequence of events indicative of potential human-operated malicious activity. What is the security identifier (SID) of the account associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, PsExec was used on host `vnevado-win10v` (AAD device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`) to launch commands on the remote device `vnevado-win10b`, including disabling real-time monitoring and dumping Kerberos tickets with rubeus.exe. The activity originated from a PowerShell script `domaindominance27.ps1` executed with execution policy bypass (Process ID 4676).'
    question: 'A related alert on this device flagged a sequence of events indicative of potential human-operated malicious activity. What is the security identifier (SID) of the account associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1540151660-3530000288-105586595-1517'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1540151660-3530000288-105586595-1517'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'PsExec was used to launch a command on a remote device, executing the credential theft tool with ExtractedFileName `rubeus.exe` at 2024-07-04 22:35:03.229603+00:00.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'This lateral movement was part of a sequence of alerts indicating potential human-operated malicious activity, associated with the account with SID `S-1-5-21-1540151660-3530000288-105586595-1517`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
