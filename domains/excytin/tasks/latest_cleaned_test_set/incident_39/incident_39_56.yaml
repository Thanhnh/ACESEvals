tasks:
- task_id: incident_39_latest_cleaned_test_set_task_56
  title: incident_39_latest_cleaned_test_set_task_56
  description: 'For the suspected identity theft (pass-the-ticket) alert, what is the email address of the compromised user account whose Kerberos ticket was stolen and reused?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, a known credential theft tool was executed on an endpoint: the process `mimikatz.exe` (PID 4112, created 2024-06-27T14:32:36Z) ran with the command line `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:kyleg /ntlm:96def1a633fc6790124d5f8fe31cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe dir \\vnevado-win10b\c$\"" exit`, indicating an intent to dump and reuse users'' credentials. This activity later chained into further identity-based attacks across the domain, including a suspected pass-the-ticket attack in which an actor took a Kerberos ticket from VNEVADO-Win10B and replayed it on VNEVADO-Win10V to access 4 resources.'
    question: 'For the suspected identity theft (pass-the-ticket) alert, what is the email address of the compromised user account whose Kerberos ticket was stolen and reused?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lucasb@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'lucasb@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed on the device with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, indicating an attempt to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, a sign-in attempt with a deceptive (decoy) user account was detected originating from the IP address `35.202.74.47`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The actor then stole a Kerberos ticket from VNEVADO-Win10B and replayed it on VNEVADO-Win10V (pass-the-ticket) to access 4 resources, compromising the account with email `lucasb@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
