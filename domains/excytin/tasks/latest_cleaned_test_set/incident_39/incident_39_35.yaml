tasks:
- task_id: incident_39_latest_cleaned_test_set_task_35
  title: incident_39_latest_cleaned_test_set_task_35
  description: 'Which executable file was identified as the credential theft tool in that follow-up alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a sign-in attempt was detected using a deceptive user account named `kyleg` originating from IP address `35.202.74.47`. A potential attacker might be using a fake or decoy account on this device to perform activities such as lateral movement and accessing sensitive data. Roughly a second later, a related alert fired indicating that a known credential theft tool was executed, with the process or its command line showing intent to dump users'' credentials, keys and plain-text passwords.'
    question: 'Which executable file was identified as the credential theft tool in that follow-up alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in attempt with a deceptive (decoy) user account was detected, involving the account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the deceptive account sign-in, the attacker executed a known credential theft tool on the device, with the process file name `mimikatz.exe`, to dump users'' credentials, keys, and plain-text passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
