tasks:
- task_id: incident_39_latest_cleaned_test_set_task_75
  title: incident_39_latest_cleaned_test_set_task_75
  description: 'Moments later on the same device, a well-known credential theft hacktool associated with the actor Storm-0875 was detected. What is the name of the file that triggered that detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a suspicious account creation alert was raised after a PowerShell script `domaindominance27.ps1` was executed (process ID 4676, command line: `"powershell.exe" -executionpolicy bypass -file c:\users\tgs2z\downloads\domaindominance27\domaindominance27.ps1`), which then spawned `net.exe` (process ID 3624) with the command line `"net.exe" user /add bdadmin password1! /domain`, creating a new domain account that could be used for backup or persistent access.'
    question: 'Moments later on the same device, a well-known credential theft hacktool associated with the actor Storm-0875 was detected. What is the name of the file that triggered that detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious new user account was created for persistence, with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The Mimikatz credential theft tool, file named `mimikatz.exe`, was detected on the device and used to harvest credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
