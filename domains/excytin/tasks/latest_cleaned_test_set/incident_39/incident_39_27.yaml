tasks:
- task_id: incident_39_latest_cleaned_test_set_task_27
  title: incident_39_latest_cleaned_test_set_task_27
  description: 'For the alert reporting a file dropped and launched from a remote location, what was the name of the executed process, along with its process ID and creation time (UTC)?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, ''Kekeo'' malware was detected on the host `vnevado-win10v` (AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`). Malware such as this can replicate and spread from one machine to another, and the detection suggests lateral movement activity from another device on the network. A closely related alert on the same device reported that a remote session dropped a file and then executed it, indicating an attacker or malware attempting to move laterally or propagate.'
    question: 'For the alert reporting a file dropped and launched from a remote location, what was the name of the executed process, along with its process ID and creation time (UTC)?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process: psexesvc.exe, Process ID: 5912, Created Time (UTC): 2024-06-27T14:32:53.2267179Z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process: psexesvc.exe, Process ID: 5912, Created Time (UTC): 2024-06-27T14:32:53.2267179Z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The ''Kekeo'' malware was detected in the file `rubeus.exe` on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The ''Kekeo'' malware was detected during lateral movement originating from the remote IP address `141.216.110.153`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The remote session dropped and launched a file, executing the process `psexesvc.exe` with Process ID `5912` at `2024-06-27t14:32:53.2267179z`, indicating lateral movement or propagation.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
