tasks:
- task_id: incident_39_latest_cleaned_test_set_task_34
  title: incident_39_latest_cleaned_test_set_task_34
  description: 'A closely related alert on the same device reports that multiple known public dual-purpose tools were dropped. What is the file name of the Kerberos ticket abuse tool that was dropped and later used to dump tickets?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, an alert fired for "PsExec launched a command on a remote device." Investigation showed `psexec.exe` (PID 6264, 2024-06-27T14:32:52Z) executing `cmd /c "powershell -command set-mppreference -disablerealtimemonitoring 1"` against vnevado-win10b, and `psexec.exe` (PID 5612, 2024-06-27T14:33:48Z) against vnevado-dc running `net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory "s-1-5-32-544" ... ; net.exe start ntds`. A PowerShell script `c:\m365dattack\get-krbticket.ps1` (PID 6636) was also executed, and Kerberos ticket output was redirected to `adminticket.txt`.'
    question: 'A closely related alert on the same device reports that multiple known public dual-purpose tools were dropped. What is the file name of the Kerberos ticket abuse tool that was dropped and later used to dump tickets?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'PsExec was used to launch a command on a remote device with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, indicating possible lateral movement in the organization.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same device, multiple dual-purpose tools were dropped, including the file `rubeus.exe`, which can be used for credential theft and privilege escalation.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
