tasks:
- task_id: incident_39_latest_cleaned_test_set_task_92
  title: incident_39_latest_cleaned_test_set_task_92
  description: 'Following this Kerberos ticket dumping activity, a related alert reported a suspected overpass-the-hash (Kerberos) attack originating from the device VNEVADO-Win10V against the domain controller VNEVADO-DC. Which compromised user account (name) was used in that authentication attempt, and what is that account''s role?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident flagged as "Potential human-operated malicious activity", a sequence of suspicious actions was observed on the device `vnevado-win10b` (AAD device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`) involving accounts such as `fk8mq` and `kyleg` and source IP `141.216.110.153`. The activity included the execution of `psexesvc.exe` and a credential-theft tool run as `cmd /c "c:\temp\rubeus.exe dump /service:xfbzkp /user:lucasb > c:\temp\adminticket.txt"` (PID 7644), which dumped Kerberos ticket material into `adminticket.txt`. This behavior often precedes ransomware or other payload deployment.'
    question: 'Following this Kerberos ticket dumping activity, a related alert reported a suspected overpass-the-hash (Kerberos) attack originating from the device VNEVADO-Win10V against the domain controller VNEVADO-DC. Which compromised user account (name) was used in that authentication attempt, and what is that account''s role?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The account belonged to Emma Clark, who is a Helpdesk Administrator.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The account belonged to Emma Clark, who is a Helpdesk Administrator.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Potential human-operated malicious activity was observed involving the account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677`, which might lead to ransomware or other payloads being installed on target devices.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised credentials were then used in a suspected overpass-the-hash attack (Kerberos), where the account `Emma Clark` (Helpdesk Administrator) on VNEVADO-Win10V attempted to authenticate against VNEVADO-DC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
