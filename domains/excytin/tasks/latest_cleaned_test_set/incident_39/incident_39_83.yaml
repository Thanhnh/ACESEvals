tasks:
- task_id: incident_39_latest_cleaned_test_set_task_83
  title: incident_39_latest_cleaned_test_set_task_83
  description: 'This credential theft activity is linked through the same compromised identity to further alerts in the incident. What is the Microsoft Entra ID (Azure AD) user object ID of the account tied to that follow-on alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage security incident, a malicious credential theft tool execution was detected on host `vnevado-win10v` (AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`). The process `mimikatz.exe` (Process ID 4748, created 2024-06-27T14:33:38Z) was launched with the command line `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`, run in the context of the account `tgs2z` with SID `S-5-7-21-1843151660-3234030288-105586167-1422`. The command line indicated an intent to dump users'' credentials, keys and plain-text passwords.'
    question: 'This credential theft activity is linked through the same compromised identity to further alerts in the incident. What is the Microsoft Entra ID (Azure AD) user object ID of the account tied to that follow-on alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'AadUserId: 1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'AadUserId: 1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool execution command line was detected at 2024-07-04 22:35:00 UTC, indicating an attempt to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The account associated with this malicious credential theft tool execution has AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
