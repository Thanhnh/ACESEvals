tasks:
- task_id: incident_39_latest_cleaned_test_set_task_86
  title: incident_39_latest_cleaned_test_set_task_86
  description: 'Just before this credential theft tool execution, a related alert was raised for a suspicious service being launched on the device — attackers often use services for persistence or privilege escalation. Which user account name was associated with that suspicious service launch alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a known credential theft tool execution was detected on host `vnevado-win10v` (Azure AD device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`). The process `mimikatz.exe` (PID 7092, created 2024-06-27T14:32:46Z) was run with the command line `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe c:\m365dattack\get-krbticket.ps1\"" exit -wait`, under the account `tgs2z` (SID `S-5-7-21-1843151660-3234030288-105586167-1422`), which then invoked the script `get-krbticket.ps1`.'
    question: 'Just before this credential theft tool execution, a related alert was raised for a suspicious service being launched on the device — attackers often use services for persistence or privilege escalation. Which user account name was associated with that suspicious service launch alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lucasb'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'lucasb'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed via the process `powershell.exe`, with a command line indicating intent to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the credential theft activity, a suspicious service was launched on the device under the user account `lucasb`, likely for persistence or privilege escalation.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
