tasks:
- task_id: incident_39_latest_cleaned_test_set_task_7
  title: incident_39_latest_cleaned_test_set_task_7
  description: 'Shortly after the tampering attempt, an alert was raised for an anomalous chain of attempts to look up user account information on the same host. What is the name of the script file involved in that account-enumeration activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an attempt to disable the Microsoft Defender Antivirus service was detected (a possible detection-evasion technique). Around the same time on the affected endpoint, `powershell.exe` was observed executing the script `get-krbticket.ps1` (process ID 6636, command line `powershell.exe c:\m365dattack\get-krbticket.ps1`).'
    question: 'Shortly after the tampering attempt, an alert was raised for an anomalous chain of attempts to look up user account information on the same host. What is the name of the script file involved in that account-enumeration activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'domaindominance27.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'domaindominance27.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An attempt to disable the Microsoft Defender Antivirus service was detected on the host with HostName `vnevado-win10v`, indicating defense evasion activity.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that host, an anomalous chain of user account lookups was observed, performed by the file with Name `domaindominance27.ps1`, suggesting the attacker was gathering information about potential targets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
