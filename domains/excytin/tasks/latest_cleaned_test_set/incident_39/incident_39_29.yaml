tasks:
- task_id: incident_39_latest_cleaned_test_set_task_29
  title: incident_39_latest_cleaned_test_set_task_29
  description: 'For the alert reporting the successful overpass-the-hash logon with potentially stolen credentials, which IP address was recorded as involved in that authentication activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, a malicious credential theft tool execution was detected: the process `mimikatz.exe` (Process ID 4748, created 2024-06-27T14:33:38Z) was run with the command line `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`, targeting the domain controller `vnevado-dc.vnevado.alpineskihouse.co`, with the activity associated with the IP address `65.233.23.156`. Moments earlier in the same attack chain, suspicious access to the LSASS service was observed on the same device, followed by a successful logon using overpass-the-hash with potentially stolen credentials.'
    question: 'For the alert reporting the successful overpass-the-hash logon with potentially stolen credentials, which IP address was recorded as involved in that authentication activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '141.216.110.153'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '141.216.110.153'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed on the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, indicating an intent to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The credential theft tool performed suspicious access to the LSASS service, targeting the process with ExtractedFileName `lsass.exe`, to decrypt users'' clear-text passwords from memory.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Using the stolen credentials, the attacker performed a successful overpass-the-hash logon from the IP address `141.216.110.153`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
