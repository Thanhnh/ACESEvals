tasks:
- task_id: incident_39_latest_cleaned_test_set_task_12
  title: incident_39_latest_cleaned_test_set_task_12
  description: 'Moments after this activity, a related alert flagged an attempt to disable the Microsoft Defender Antivirus service (antivirus tampering). What is the name of the script file associated with that tampering alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on the domain controller `vnevado-dc`, a suspicious service launch was detected under the account `lucasb` (SID `S-1-5-21-1440151660-4837038288-105596163-1120`, AAD user ID `7fcf9695-68fc-4258-864d-e1e5b166c66f`). The activity included process 3780 running `powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" -databasepath (get-itemproperty -path registry::hklm\system\currentcontrolset\services\ntds\parameters).\"dsa database file\" -force; net.exe start ntds"` and process 3400 running `"net.exe" start ntds`, indicating attempts to maintain persistence or elevate privileges.'
    question: 'Moments after this activity, a related alert flagged an attempt to disable the Microsoft Defender Antivirus service (antivirus tampering). What is the name of the script file associated with that tampering alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-krbticket.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious service was launched on the device, starting the process `powershell.exe`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Through that PowerShell process, an attempt to disable the Microsoft Defender Antivirus service was detected, involving the file `get-krbticket.ps1`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
