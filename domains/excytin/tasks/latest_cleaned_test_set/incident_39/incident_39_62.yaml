tasks:
- task_id: incident_39_latest_cleaned_test_set_task_62
  title: incident_39_latest_cleaned_test_set_task_62
  description: 'For the alert reporting the ''Kekeo'' malware detection, can you identify the Azure AD (AAD) device ID of the affected host?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage incident, an alert titled "File dropped and launched from remote location" was raised at 2024-07-04 22:35:01 UTC, indicating that a remote session dropped a file and executed it — behavior often associated with lateral movement or malware propagation. The process involved was `5912__2024-06-27t14:32:53.2267179z__psexesvc.exe`. Moments later, a related alert flagged a sequence of events indicative of potential human-operated malicious activity on the same device, and a credential-theft tool, ''Kekeo'' malware, was detected.'
    question: 'For the alert reporting the ''Kekeo'' malware detection, can you identify the Azure AD (AAD) device ID of the affected host?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'AadDeviceId: 4d8d23e9-a77d-4e33-9435-b8c457e57ca1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'AadDeviceId: 4d8d23e9-a77d-4e33-9435-b8c457e57ca1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A remote session from IP address `141.216.110.153` dropped a file and executed it, indicating potential lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A sequence of human-operated malicious activity was observed involving the file `rubeus.exe`, a credential theft tool.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The ''Kekeo'' malware was detected on the device with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
