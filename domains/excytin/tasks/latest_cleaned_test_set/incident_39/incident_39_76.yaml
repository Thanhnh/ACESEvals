tasks:
- task_id: incident_39_latest_cleaned_test_set_task_76
  title: incident_39_latest_cleaned_test_set_task_76
  description: 'Seconds later, a related alert flagged the possible use of the Rubeus kerberoasting tool on this endpoint. Besides `fk8mq`, what other compromised account name was reported as an entity in that Rubeus alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert titled "File dropped and launched from remote location" was raised on host `vnevado-win10b` (Azure AD device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), where a remote session from IP `141.216.110.153` dropped a file and executed it — a typical sign of lateral movement. The activity was tied to the account `fk8mq` (SID `S-1-5-21-1540151660-3530000288-105586595-1517`, AAD user ID `97e6a954-b6bd-48a5-808c-bd8464cce677`), and a process with ID 2608 was created at 2024-06-27T14:33:27Z with the command line `rubeus.exe dump /service:xfbzkp /user:lucasb`.'
    question: 'Seconds later, a related alert flagged the possible use of the Rubeus kerberoasting tool on this endpoint. Besides `fk8mq`, what other compromised account name was reported as an entity in that Rubeus alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A remote session dropped and executed the file `rubeus.exe` on the endpoint, indicating possible lateral movement or malware propagation.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The dropped Rubeus tool was then used for kerberoasting activity, observed under the account with Name `tgs2z`, which requested Kerberos service tickets (SPN) to extract or reuse credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
