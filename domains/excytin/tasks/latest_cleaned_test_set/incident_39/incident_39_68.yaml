tasks:
- task_id: incident_39_latest_cleaned_test_set_task_68
  title: incident_39_latest_cleaned_test_set_task_68
  description: 'For the Suspected overpass-the-hash (Kerberos) alert at the end of this chain, what is the email address of the account that was used to attempt the authentication against VNEVADO-DC?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a ''Possible lateral movement'' alert was raised on host `vnevado-win10b` (AAD device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), where lateral movement on another device was observed in close time proximity to a suspicious network event involving IP `35.202.74.47`. Seconds later, ''Kekeo'' malware — a tool commonly abused for Kerberos ticket manipulation — was detected and found active on a related device, and the activity chain eventually led to a Suspected overpass-the-hash (Kerberos) attack where a Helpdesk Administrator account on VNEVADO-Win10V attempted to authenticate against the domain controller VNEVADO-DC.'
    question: 'For the Suspected overpass-the-hash (Kerberos) alert at the end of this chain, what is the email address of the account that was used to attempt the authentication against VNEVADO-DC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Possible lateral movement was observed on the device with AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`, indicating an attacker attempting to move across devices.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The ''Kekeo'' malware was detected and active in the context of the user account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A suspected overpass-the-hash (Kerberos) attack was then performed, where the account with Email `fk8mq@vnevado.alpineskihouse.co` (Emma Clark, Helpdesk Administrator) on VNEVADO-Win10V attempted to authenticate against VNEVADO-DC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
