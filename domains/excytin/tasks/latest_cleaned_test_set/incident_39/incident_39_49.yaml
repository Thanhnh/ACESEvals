tasks:
- task_id: incident_39_latest_cleaned_test_set_task_49
  title: incident_39_latest_cleaned_test_set_task_49
  description: 'For the alert reporting the potential human-operated malicious activity on this device, which account name was identified as being involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a chain of anomalous account lookup attempts was observed on a device, where `net.exe` was repeatedly executed within a few seconds to enumerate domain information — for example, process 2720 ran `"net.exe" user /domain` at 2024-06-27T14:32:20Z, process 6264 ran `"net.exe" group /domain`, process 6252 ran `"net.exe" group "domain admins" /domain`, and process 1700 ran `"net.exe" group "enterprise admins" /domain`. This discovery activity was followed by PsExec being used to launch commands on a remote device, and ultimately by an alert indicating a sequence of events consistent with human-operated malicious activity that could lead to ransomware deployment.'
    question: 'For the alert reporting the potential human-operated malicious activity on this device, which account name was identified as being involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `tgs2z` performed an anomalous chain of user account lookups, indicating reconnaissance for potential targets.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'PsExec was then used to launch the file `rubeus.exe` on a remote device, indicating lateral movement and credential theft activity.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A sequence of alerts indicative of potential human-operated malicious activity was observed involving the account `fk8mq`, which could lead to ransomware or other payloads being installed.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
