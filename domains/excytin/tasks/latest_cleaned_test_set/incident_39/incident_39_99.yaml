tasks:
- task_id: incident_39_latest_cleaned_test_set_task_99
  title: incident_39_latest_cleaned_test_set_task_99
  description: 'For the related alert about the sign-in attempt with the deceptive user account, what was the source IP address of the sign-in attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident on the domain controller `vnevado-dc`, a suspicious service was launched, with `services.exe` (PID 652) spawning `psexesvc.exe` (PID 7668). Attackers often use services to launch malicious commands or programs to maintain persistence or elevate privileges. This activity was part of a sequence of alerts indicative of potential human-operated malicious activity on the same device, which also included a sign-in attempt using a deceptive (fake or decoy) user account.'
    question: 'For the related alert about the sign-in attempt with the deceptive user account, what was the source IP address of the sign-in attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '35.202.74.47'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '35.202.74.47'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious service `psexesvc.exe` was launched on the device, indicating remote execution via PsExec.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The activity was associated with the user account `kyleg`, showing a sequence of alerts indicative of potential human-operated malicious activity.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A sign-in attempt with a deceptive user account was detected on this device originating from the IP address `35.202.74.47`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
