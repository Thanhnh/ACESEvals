tasks:
- task_id: incident_39_latest_cleaned_test_set_task_13
  title: incident_39_latest_cleaned_test_set_task_13
  description: 'For the suspected overpass-the-hash (Kerberos) alert in this incident, what is the display name of the compromised user account that attempted to authenticate against VNEVADO-DC?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation in the vnevado.alpineskihouse.co environment, an alert fired on 2024-07-10 for a potentially malicious URL click: the mailbox `tgs2z@vnevado.alpineskihouse.co` received a message containing the link `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/`, and the recipient clicked it. Follow-on activity from the same intrusion included SMB user and IP address reconnaissance performed from an internal workstation against the domain controller VNEVADO-DC, and shortly afterwards a suspected overpass-the-hash (Kerberos) authentication attempt was made against that same domain controller.'
    question: 'For the suspected overpass-the-hash (Kerberos) alert in this incident, what is the display name of the compromised user account that attempted to authenticate against VNEVADO-DC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Emma Clark (a Helpdesk Administrator account, used from the device VNEVADO-Win10V)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Emma Clark (a Helpdesk Administrator account, used from the device VNEVADO-Win10V)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Ethan Brooks` clicked on a potentially malicious URL, indicating the initial compromise.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'From the compromised device VNEVADO-Win10V, SMB session enumeration was performed against the domain controller host `VNEVADO-DC`, retrieving recent IP addresses of 2 accounts (user and IP address reconnaissance).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Using the harvested credentials, a suspected overpass-the-hash (Kerberos) attack was performed by the account `Emma Clark` (Helpdesk Administrator) from VNEVADO-Win10V against VNEVADO-DC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
