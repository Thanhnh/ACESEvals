tasks:
- task_id: incident_39_latest_cleaned_test_set_task_30
  title: incident_39_latest_cleaned_test_set_task_30
  description: 'Seconds later on the same device, another alert fired for a sequence of activities indicative of human-operated malicious activity that could lead to ransomware deployment. What is the security identifier (SID) of the user account associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Sign-in attempt with deceptive user account" was raised on host `vnevado-win10b` (AAD Device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`) from IP address `141.216.110.153`, involving the account named `kyleg` and a decoy account with SID `S-0-6-5`. Attackers may leverage such fake or decoy accounts for lateral movement and to access sensitive data.'
    question: 'Seconds later on the same device, another alert fired for a sequence of activities indicative of human-operated malicious activity that could lead to ransomware deployment. What is the security identifier (SID) of the user account associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1540151660-3530000288-105586595-1517'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1540151660-3530000288-105586595-1517'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in attempt was detected using a deceptive (decoy) user account with SID `S-0-6-5`, suggesting an attacker was using a fake account on the device for lateral movement or data access.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following this, a sequence of alerts indicative of potential human-operated malicious activity was observed on the same device, associated with the user account with SID `S-1-5-21-1540151660-3530000288-105586595-1517`, which could lead to ransomware or other payloads being installed.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
