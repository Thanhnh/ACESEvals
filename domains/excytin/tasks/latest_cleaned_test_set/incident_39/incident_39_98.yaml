tasks:
- task_id: incident_39_latest_cleaned_test_set_task_98
  title: incident_39_latest_cleaned_test_set_task_98
  description: 'For the related ''Suspicious service launched'' alert on this device, what is the security identifier (SID) of the user account associated with launching that service?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, multiple known public dual-purpose tools were dropped on the device `vnevado-win10v` (AAD Device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`), including `mimikatz.exe`, `psexec.exe`, and the script `get-krbticket.ps1`. Observed command lines show Mimikatz being used for pass-the-hash (e.g., process 4112 running `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:kyleg /ntlm:96def1a633fc6790124d5f8fe31cc72b /domain:vnevado.alpineskihouse.co ..."`) and a related process launching `powershell.exe c:\m365dattack\get-krbticket.ps1`. Shortly before these tools were dropped, a related alert fired for a suspicious service being started on the same device, a technique attackers use to maintain persistence or elevate privileges.'
    question: 'For the related ''Suspicious service launched'' alert on this device, what is the security identifier (SID) of the user account associated with launching that service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1440151660-4837038288-105596163-1120'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1440151660-4837038288-105596163-1120'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Multiple known dual-purpose tools were dropped on the device and executed via the process `powershell.exe`, which attackers can use for credential theft, privilege escalation, and lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Shortly after, a suspicious service was launched on the same device by the account with SID `S-1-5-21-1440151660-4837038288-105596163-1120`, likely to maintain persistence or elevate privileges.'
  scoring_aggregation:
    max:
      scores:
      - submission
