tasks:
- task_id: incident_39_latest_cleaned_test_set_task_53
  title: incident_39_latest_cleaned_test_set_task_53
  description: 'For the alert about emails containing a malicious URL that were removed after delivery, what was the sender address of the message?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, suspicious remote activity was observed on host `vnevado-win10b` (AAD device ID fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb), where the process `psexesvc.exe` (PID 5512, created 2024-06-27T14:33:27Z) ran under the `LocalSystem` account, with remote traffic associated with IP `141.216.110.153`. Pivoting from the compromised host and its user accounts, investigators found the activity chain also touched the email environment, where an alert fired for email messages containing a malicious URL that were delivered and later removed.'
    question: 'For the alert about emails containing a malicious URL that were removed after delivery, what was the sender address of the message?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'k1pt7ez@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'k1pt7ez@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The file `psexesvc.exe` was observed on the machine, indicating suspicious remote activity such as remotely initiated interactive sessions or command execution.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` dropped multiple dual-purpose tools on the device, which could be used for credential theft, privilege escalation, and lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Email messages containing a malicious URL were delivered and later removed, sent from the sender `k1pt7ez@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
