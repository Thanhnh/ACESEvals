tasks:
- task_id: incident_39_latest_cleaned_test_set_task_33
  title: incident_39_latest_cleaned_test_set_task_33
  description: 'Following this activity chain, the ''Kekeo'' malware was detected and found active in the environment. What is the Microsoft Entra (AAD) user ID of the account associated with that Kekeo malware detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an anomalous chain of account lookup attempts was detected, involving a rapid series of net.exe commands such as `"net.exe" user /domain` (PID 2720), `"net.exe" group /domain` (PID 6264), `"net.exe" group "domain admins" /domain` (PID 6252), `"net.exe" group "enterprise admins" /domain` (PID 1700), and `"net.exe" user fk8mq /domain` (PID 3560), all executed on 2024-06-27. This reconnaissance was followed by PsExec being used to launch commands on a remote device, suggesting lateral movement in the organization.'
    question: 'Following this activity chain, the ''Kekeo'' malware was detected and found active in the environment. What is the Microsoft Entra (AAD) user ID of the account associated with that Kekeo malware detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '97e6a954-b6bd-48a5-808c-bd8464cce677'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '97e6a954-b6bd-48a5-808c-bd8464cce677'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An anomalous chain of user account lookups was observed from the account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`, indicating reconnaissance of potential targets.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'PsExec was then used to launch a command on a remote device, executing the credential theft tool with file name `rubeus.exe` for lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The ''Kekeo'' malware was detected and found active in the context of the account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
