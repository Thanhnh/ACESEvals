tasks:
- task_id: incident_39_latest_cleaned_test_set_task_38
  title: incident_39_latest_cleaned_test_set_task_38
  description: 'For the alert about the potentially malicious URL click, which mailbox primary address belongs to the user who clicked the malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious service was launched on a device: the process `psexesvc.exe` (PID 7668, created 2024-06-27T14:34:10.0201983Z) was started by `services.exe` (PID 652, created 2024-06-19T12:56:00.7201251Z). Attackers often use services to launch malicious commands or programs to maintain persistence or elevate privileges. This activity was linked through the affected host to further alerts, including SID history injection, the possible use of the Rubeus kerberoasting tool, and eventually a potentially malicious URL click detected on a user''s email.'
    question: 'For the alert about the potentially malicious URL click, which mailbox primary address belongs to the user who clicked the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious service was launched on the host `vnevado-dc`, potentially used by attackers to run malicious commands for persistence or privilege elevation.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'On that device, a SID history injection was detected involving the process `powershell.exe`, used to grant an existing account elevated privileges.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The Rubeus kerberoasting tool was possibly used with the account with SID `S-5-7-21-1843151660-3234030288-105586167-1422`, requesting Kerberos tickets to harvest credentials.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'A potentially malicious URL click was detected from the mailbox `tgs2z@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
