tasks:
- task_id: incident_39_latest_cleaned_test_set_task_11
  title: incident_39_latest_cleaned_test_set_task_11
  description: 'What is the IP address associated with the sign-in attempt that used the deceptive user account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a known credential theft tool `mimikatz.exe` was executed with the command line `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit` (Process ID 4748), targeting the domain controller `vnevado-dc.vnevado.alpineskihouse.co` and associated with the IP address `65.233.23.156`. Moments earlier, on the same device, an alert was raised for a sign-in attempt using a deceptive (fake or decoy) user account, which attackers often use for lateral movement and accessing sensitive data.'
    question: 'What is the IP address associated with the sign-in attempt that used the deceptive user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '35.202.74.47'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '35.202.74.47'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed on host `vnevado-win10v`, indicating an attempt to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the credential theft, a sign-in attempt with a deceptive (decoy) user account was detected originating from IP address `35.202.74.47`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
