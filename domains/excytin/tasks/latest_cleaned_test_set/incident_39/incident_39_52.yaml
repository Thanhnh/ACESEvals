tasks:
- task_id: incident_39_latest_cleaned_test_set_task_52
  title: incident_39_latest_cleaned_test_set_task_52
  description: 'In the related suspicious account creation alert, what is the name of the process file that was used to create the new user account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, a sign-in attempt was detected using a deceptive user account named `kyleg` from IP address `35.202.74.47`. A potential attacker might be using a fake or decoy user account on this device to perform activities such as lateral movement or accessing sensitive data. Shortly afterwards, a related alert was raised for a suspicious new user account creation, which could indicate an attacker establishing secondary or backup access to the device or organization.'
    question: 'In the related suspicious account creation alert, what is the name of the process file that was used to create the new user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'net.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'net.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in attempt was detected using a deceptive (decoy) user account with SID `S-5-7-21-1843151660-3234030288-105586167-1422`, indicating a potential attacker using a fake account for lateral movement or accessing sensitive data.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the deceptive sign-in, a suspicious account creation was observed, performed via the process `net.exe`, which the attacker likely used to create a new user account for persistence and backup access to the device or organization.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
