tasks:
- task_id: incident_39_latest_cleaned_test_set_task_55
  title: incident_39_latest_cleaned_test_set_task_55
  description: 'For the alert reporting the active ''Kekeo'' malware detection, which account name was associated with that detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an account belonging to Ethan Brooks (Account Executive), with email `tgs2z@vnevado.alpineskihouse.co`, was observed on VNEVADO-Win10V enumerating SMB sessions on VNEVADO-DC and retrieving recent IP addresses of 2 accounts. Investigation of related activity on the compromised endpoint also revealed the use of the Rubeus kerberoasting tool and, shortly before that, a detection of active ''Kekeo'' credential-abuse malware.'
    question: 'For the alert reporting the active ''Kekeo'' malware detection, which account name was associated with that detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` (Ethan Brooks) on VNEVADO-Win10V performed user and IP address reconnaissance (SMB) by enumerating SMB sessions on VNEVADO-DC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On the same endpoint, the kerberoasting tool `rubeus.exe` was executed to request and harvest Kerberos service tickets for credential theft.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Following the Kerberos abuse, an active ''Kekeo'' malware detection was tied to the account named `fk8mq`, indicating the compromised account used to run the Kerberos attack tooling.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
