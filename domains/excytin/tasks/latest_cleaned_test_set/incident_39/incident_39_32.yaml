tasks:
- task_id: incident_39_latest_cleaned_test_set_task_32
  title: incident_39_latest_cleaned_test_set_task_32
  description: 'Following this activity, a ''User and IP address reconnaissance (SMB)'' alert was triggered where someone enumerated SMB sessions on the domain controller VNEVADO-DC and retrieved recent IP addresses of 2 accounts. What is the display name of the account that performed this SMB reconnaissance?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled ''File dropped and launched from remote location'' was raised, indicating that a remote session dropped a file and executed it — possible lateral movement or malware propagation. The activity involved the account `fk8mq` (SID S-0-6-5) on host `vnevado-win10b` (AAD Device ID fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb), originating from IP address 141.216.110.153, with the process `2608__2024-06-27t14:33:27.7927134z__rubeus.exe dump /service:xfbzkp /user:lucasb`. Shortly afterwards, a related alert flagged the possible use of the Rubeus kerberoasting tool on the same endpoint, and days later reconnaissance activity was detected in the environment.'
    question: 'Following this activity, a ''User and IP address reconnaissance (SMB)'' alert was triggered where someone enumerated SMB sessions on the domain controller VNEVADO-DC and retrieved recent IP addresses of 2 accounts. What is the display name of the account that performed this SMB reconnaissance?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks (an Account Executive), who ran the enumeration from the device VNEVADO-Win10V.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Ethan Brooks (an Account Executive), who ran the enumeration from the device VNEVADO-Win10V.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A remote session dropped the file `rubeus.exe` and executed it, indicating possible lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The Rubeus kerberoasting tool was used on the endpoint by the account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The account `Ethan Brooks` performed user and IP address reconnaissance (SMB) from VNEVADO-Win10V, enumerating SMB sessions on VNEVADO-DC and retrieving recent IP addresses of 2 accounts.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
