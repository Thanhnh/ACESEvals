tasks:
- task_id: incident_39_latest_cleaned_test_set_task_18
  title: incident_39_latest_cleaned_test_set_task_18
  description: 'For the alert reporting possible use of the Rubeus kerberoasting tool, what is the account name (username) associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a potentially malicious URL click was detected: a user identified as `Ethan Brooks` recently clicked on the link `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/`, which was found to be malicious. Earlier in the same incident, activity indicating use of the Rubeus tool (capable of kerberoasting, pass-the-ticket, and other Kerberos abuse techniques) was observed on an endpoint.'
    question: 'For the alert reporting possible use of the Rubeus kerberoasting tool, what is the account name (username) associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` clicked on a potentially malicious URL, indicating the initial compromise.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, activity indicating use of the Rubeus kerberoasting tool was observed, involving the account with Name `tgs2z`, which was used to request Kerberos service tickets (SPN) for credential theft or pass-the-ticket attacks.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
