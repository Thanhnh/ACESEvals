tasks:
- task_id: incident_39_latest_cleaned_test_set_task_60
  title: incident_39_latest_cleaned_test_set_task_60
  description: 'For the alert reporting the malicious credential theft tool execution on this device, what is the name of the file associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled "Suspicious file registered as a service" was raised on host `vnevado-win10b` (Azure AD device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), where a file with suspicious attributes was registered as a service, likely for persistence. The activity involved the accounts `fk8mq` (SID S-1-5-21-1540151660-3530000288-105586595-1517) and `LocalSystem`, with the IP address 141.216.110.153 observed. Shortly afterwards, the same device was flagged for having multiple dual-purpose tools dropped on it, and for the execution of a known credential theft tool whose command line indicated an intent to dump users'' credentials, keys and plain-text passwords.'
    question: 'For the alert reporting the malicious credential theft tool execution on this device, what is the name of the file associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-krbticket.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The attacker registered the suspicious file `psexesvc.exe` as a service on the device for persistence and remote execution.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Multiple dual-purpose tools were dropped on the device, including the process `powershell.exe` used to download or copy the tools.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A known credential theft tool was executed via the file `get-krbticket.ps1` to dump users'' Kerberos tickets and credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
