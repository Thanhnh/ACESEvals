tasks:
- task_id: incident_39_latest_cleaned_test_set_task_23
  title: incident_39_latest_cleaned_test_set_task_23
  description: 'For the suspicious account creation alert in this incident, what was the full command line used to create the new account, and what was the process ID?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled ''File dropped and launched from remote location'' was triggered when a remote session dropped a file and executed it, indicating possible lateral movement. The process observed had Process ID 5912, created at 2024-06-27T14:32:53.2267179Z, with the command line `psexesvc.exe`. Shortly after, related alerts on the same device flagged potential human-operated malicious activity and possible use of the Rubeus kerberoasting tool. Another related alert in the same chain reported a suspicious account creation, where a new user account was created to potentially establish backup access to the device or organization.'
    question: 'For the suspicious account creation alert in this incident, what was the full command line used to create the new account, and what was the process ID?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Command line: `"net.exe" user /add bdadmin password1! /domain`, Process ID: 3624 (created 2024-06-27T14:33:43.4299474Z)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Command line: `"net.exe" user /add bdadmin password1! /domain`, Process ID: 3624 (created 2024-06-27T14:33:43.4299474Z)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A remote session dropped a file and executed it on the device with AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`, indicating possible lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'A sequence of alerts indicative of human-operated malicious activity was observed, involving the extracted file `rubeus.exe`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The Rubeus kerberoasting tool was possibly used on the host `vnevado-win10v` to request and abuse Kerberos tickets.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'A suspicious account creation was performed with the process (Process ID `3624`, created at `2024-06-27t14:33:43.4299474z`) running the command line `"net.exe" user /add bdadmin password1! /domain` to establish backup access.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
