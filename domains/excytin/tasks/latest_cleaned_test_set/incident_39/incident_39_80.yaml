tasks:
- task_id: incident_39_latest_cleaned_test_set_task_80
  title: incident_39_latest_cleaned_test_set_task_80
  description: 'For the alert where PsExec launched a command on a remote device, what was the full command line executed, and what was the process ID?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of suspicious remote activity observed on a machine, the activity was initiated under the `LocalSystem` account. This alert flags attempts such as initiating interactive sessions, modifying files, passing WMI commands, or creating scheduled tasks from a remote machine. A related alert shows a remote session dropped a file and executed it, suggesting lateral movement, and another related alert indicates PsExec was used to launch a command on a remote device.'
    question: 'For the alert where PsExec launched a command on a remote device, what was the full command line executed, and what was the process ID?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 5924, Command line: "psexec.exe" \\vnevado-win10b -accepteula cmd /c "c:\temp\rubeus.exe dump /service:xfbzkp /user:lucasb > c:\temp\adminticket.txt" (created 2024-06-27T14:33:14.4981439Z)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 5924, Command line: "psexec.exe" \\vnevado-win10b -accepteula cmd /c "c:\temp\rubeus.exe dump /service:xfbzkp /user:lucasb > c:\temp\adminticket.txt" (created 2024-06-27T14:33:14.4981439Z)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was observed on the host with AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`, indicating an attacker initiated actions from a remote machine.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'During the remote session, a file named `rubeus.exe` was dropped and launched from a remote location, suggesting lateral movement or malware propagation.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker then used PsExec to run a command on a remote device, with Process ID `5924` at `2024-06-27t14:33:14.4981439z` and command line `"psexec.exe" \\vnevado-win10b -accepteula cmd /c "c:\temp\rubeus.exe dump /service:xfbzkp /user:lucasb > c:\temp\adminticket.txt"`, dumping Kerberos tickets for user `lucasb` to `c:\temp\adminticket.txt`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
