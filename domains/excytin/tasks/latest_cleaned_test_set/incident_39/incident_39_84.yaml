tasks:
- task_id: incident_39_latest_cleaned_test_set_task_84
  title: incident_39_latest_cleaned_test_set_task_84
  description: 'Just before these tools were dropped, an alert was raised for an attempt to disable the Microsoft Defender Antivirus service. Which user account name was associated with that Defender Antivirus tampering attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired for "Multiple dual-purpose tools were dropped" on a device, where publicly available tools such as `mimikatz.exe`, `psexec.exe`, `psexesvc.exe` and `rubeus.exe` were copied to the target machine. Related process activity included `mimikatz.exe privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit` (PID 5176) and a pass-the-hash command running `powershell.exe c:\m365dattack\get-krbticket.ps1` (PID 7092), as well as a remote execution via `psexec.exe \\vnevado-win10b -accepteula cmd /c "powershell -command set-mppreference -disablerealtimemonitoring 1"` (PID 6264), all launched around a script named `domaindominance27.ps1`.'
    question: 'Just before these tools were dropped, an alert was raised for an attempt to disable the Microsoft Defender Antivirus service. Which user account name was associated with that Defender Antivirus tampering attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Multiple dual-purpose tools were dropped on the device, executed via the process with ExtractedFileName `powershell.exe`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with Name `tgs2z` attempted to disable the Microsoft Defender Antivirus service, indicating antivirus tampering to evade detection.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
