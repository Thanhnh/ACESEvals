tasks:
- task_id: incident_39_latest_cleaned_test_set_task_69
  title: incident_39_latest_cleaned_test_set_task_69
  description: 'Following this activity chain, an attempt was made to disable the Microsoft Defender Antivirus service in order to evade detection. What is the Microsoft Entra (AAD) user ID of the account associated with that tampering alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing multi-stage incident, an alert for ''Anomalous account lookups'' was raised after a rapid chain of domain reconnaissance commands were executed, including `net.exe user /domain` (PID 2720), `net.exe group /domain` (PID 6264), `net.exe group "domain admins" /domain` (PID 6252), `net.exe group "enterprise admins" /domain` (PID 1700), and `net.exe user fk8mq /domain` (PID 3560). This activity is linked through shared entities to later stages of the attack, including lateral movement with PsExec and Kerberos ticket abuse using the Rubeus tool.'
    question: 'Following this activity chain, an attempt was made to disable the Microsoft Defender Antivirus service in order to evade detection. What is the Microsoft Entra (AAD) user ID of the account associated with that tampering alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '97e6a954-b6bd-48a5-808c-bd8464cce677'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '97e6a954-b6bd-48a5-808c-bd8464cce677'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` performed an anomalous chain of user account lookups, indicating reconnaissance of potential targets.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'PsExec was then used to launch the file `rubeus.exe` on a remote device, indicating lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The Rubeus kerberoasting tool activity was observed on the host `vnevado-win10b`, where the attacker requested Kerberos tickets for service principal names to harvest credentials.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The user with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677` attempted to disable the Microsoft Defender Antivirus service, tampering with defenses to evade detection.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
