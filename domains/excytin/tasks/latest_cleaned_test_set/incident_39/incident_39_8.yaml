tasks:
- task_id: incident_39_latest_cleaned_test_set_task_8
  title: incident_39_latest_cleaned_test_set_task_8
  description: 'In the related ''Kekeo'' malware detection alert, what is the name of the file that was identified?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on the endpoint `vnevado-win10v` (AAD Device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`), analysts observed activity indicating possible use of the Rubeus kerberoasting tool. The account `tgs2z` (SID `S-5-7-21-1843151660-3234030288-105586167-1422`) ran `powershell.exe c:\m365dattack\get-krbticket.ps1` (Process ID 6636) along with related tools such as `psexec.exe`, producing an output file `adminticket.txt`. Around the same time, a related alert reported that ''Kekeo'' malware was detected and was active on the environment.'
    question: 'In the related ''Kekeo'' malware detection alert, what is the name of the file that was identified?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The Rubeus kerberoasting tool was observed executing on the endpoint as process `rubeus.exe`, indicating attempts to request and abuse Kerberos service tickets (kerberoasting/pass-the-ticket).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The related file `rubeus.exe` was detected as ''Kekeo'' malware and was active on the machine.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
