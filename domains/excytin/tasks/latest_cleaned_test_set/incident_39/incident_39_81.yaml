tasks:
- task_id: incident_39_latest_cleaned_test_set_task_81
  title: incident_39_latest_cleaned_test_set_task_81
  description: 'Just before this account creation activity, a related alert flagged a suspicious service being launched on the same device. What is the Azure AD user ID (AadUserId) of the account involved in that ''Suspicious service launched'' alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a "Suspicious account creation" alert was raised on host `vnevado-win10v` (AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`). The account `tgs2z` (SID `S-5-7-21-1843151660-3234030288-105586167-1422`, AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`) ran `"powershell.exe" -executionpolicy bypass -file c:\users\tgs2z\downloads\domaindominance27\domaindominance27.ps1` (PID 4676), which subsequently executed `"net.exe" user /add bdadmin password1! /domain` (PID 3624), creating a new backup account potentially used by an attacker for persistence.'
    question: 'Just before this account creation activity, a related alert flagged a suspicious service being launched on the same device. What is the Azure AD user ID (AadUserId) of the account involved in that ''Suspicious service launched'' alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '7fcf9695-68fc-4258-864d-e1e5b166c66f'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '7fcf9695-68fc-4258-864d-e1e5b166c66f'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The attacker used the process `net.exe` to create a new suspicious user account on the device, establishing backup access for persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious service was launched on the device under the account with AadUserId `7fcf9695-68fc-4258-864d-e1e5b166c66f`, likely to maintain persistence or elevate privileges.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
