tasks:
- task_id: incident_39_latest_cleaned_test_set_task_44
  title: incident_39_latest_cleaned_test_set_task_44
  description: 'Moments later on the same host, an alert fired for an active ''Kekeo'' malware detection. What is the name of the executable file associated with that malware detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, an alert was raised for a successful logon using overpass-the-hash with potentially stolen credentials, where an attacker accessed a resource with credentials likely obtained by dumping a password hash from memory and then using it to obtain a Kerberos ticket. The alert involved the process `lsass.exe` (Process ID 692, created 2024-06-26T17:11:52.8381782Z), the account SID `S-2-2-78`, and the IP address `141.216.110.153`.'
    question: 'Moments later on the same host, an alert fired for an active ''Kekeo'' malware detection. What is the name of the executable file associated with that malware detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An attacker performed a successful logon using overpass-the-hash with potentially stolen credentials on host `vnevado-win10b`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that host, an active ''Kekeo'' malware detection was triggered on the process with extracted file name `rubeus.exe`, which was used to request Kerberos tickets from the stolen hash.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
