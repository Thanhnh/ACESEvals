tasks:
- task_id: incident_39_latest_cleaned_test_set_task_15
  title: incident_39_latest_cleaned_test_set_task_15
  description: 'Roughly a second after this detection, a related alert flagged suspicious access to the LSASS service on the same machine. What is the name of the script file associated with that LSASS access alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a known credential theft tool execution was detected: the process `mimikatz.exe` was launched (Process ID 5176, created 2024-06-27T14:33:32.4282796Z) with the command line `"mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit`, indicating an intent to dump users'' credentials, keys and plain-text passwords, as well as inject Kerberos tickets.'
    question: 'Roughly a second after this detection, a related alert flagged suspicious access to the LSASS service on the same machine. What is the name of the script file associated with that LSASS access alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-krbticket.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The credential theft tool `mimikatz.exe` was executed on the machine, indicating an attempt to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the credential dumping, suspicious access to the LSASS service was detected involving the file `get-krbticket.ps1`, a script used to obtain Kerberos tickets from LSASS memory for lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
