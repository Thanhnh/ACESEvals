tasks:
- task_id: incident_39_latest_cleaned_test_set_task_79
  title: incident_39_latest_cleaned_test_set_task_79
  description: 'A closely related alert shows that this same ''Kekeo'' malware was detected during lateral movement to a device on the network. What is the security identifier (SID) of the account tied to that lateral movement detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an active ''Kekeo'' malware was detected on a device, associated with the execution of `rubeus.exe` (Process ID 2608, created 2024-06-27T14:33:27.7927134Z) with the command line `rubeus.exe dump /service:xfbzkp /user:lucasb`. Because the malware was found to be active, precautionary measures and a check for residual signs of infection are needed.'
    question: 'A closely related alert shows that this same ''Kekeo'' malware was detected during lateral movement to a device on the network. What is the security identifier (SID) of the account tied to that lateral movement detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-0-6-5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An active ''Kekeo'' malware was detected running with persistence on the machine under the user account with SID `S-1-5-21-1540151660-3530000288-105586595-1517`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The ''Kekeo'' malware was then detected during lateral movement to this device, executed under the account with SID `S-0-6-5`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
