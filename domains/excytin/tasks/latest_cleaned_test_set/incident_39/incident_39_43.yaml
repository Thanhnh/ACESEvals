tasks:
- task_id: incident_39_latest_cleaned_test_set_task_43
  title: incident_39_latest_cleaned_test_set_task_43
  description: 'A related alert in this incident flagged possible lateral movement, triggered by a suspicious network event occurring in close time proximity on this device. What is the IP address associated with that lateral movement alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled "Multiple dual-purpose tools were dropped" fired on a device, where known public tools that can be abused for credential theft, privilege escalation, and lateral movement were dropped. The observed activity included `mimikatz.exe` running with `privilege::debug sekurlsa::logonpasswords` and pass-the-hash commands against the domain `vnevado.alpineskihouse.co`, a PowerShell script `get-krbticket.ps1` executed from `c:\m365dattack\`, and `psexec.exe` used to remotely disable real-time monitoring on `vnevado-win10b`.'
    question: 'A related alert in this incident flagged possible lateral movement, triggered by a suspicious network event occurring in close time proximity on this device. What is the IP address associated with that lateral movement alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '35.202.74.47'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '35.202.74.47'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Multiple dual-purpose tools were dropped on the device, including the file `psexesvc.exe`, which is the PsExec service binary commonly abused for remote execution.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious remote activity was then observed on the host with AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`, indicating that an interactive/remote session was initiated against this device.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'This activity was followed by possible lateral movement associated with the suspicious network event involving the IP address `35.202.74.47`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
