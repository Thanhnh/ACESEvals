tasks:
- task_id: incident_39_latest_cleaned_test_set_task_96
  title: incident_39_latest_cleaned_test_set_task_96
  description: 'For the later SMB user and IP address reconnaissance activity against VNEVADO-DC, which user account was identified as performing the enumeration?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a SID history injection was detected on host `vnevado-dc` involving the account `lucasb`. The attacker ran `powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" ...; net.exe start ntds"` (Process ID 3780) along with a child process `net1 stop ntds /y` (Process ID 7712) and a suspicious file `dkwj.mze`. This activity chained to further discovery alerts, including anomalous account lookups and later SMB session enumeration against the domain controller VNEVADO-DC performed from the device VNEVADO-Win10V, where recent IP addresses of 2 accounts were retrieved.'
    question: 'For the later SMB user and IP address reconnaissance activity against VNEVADO-DC, which user account was identified as performing the enumeration?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks (an Account Executive), acting from the device VNEVADO-Win10V'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Ethan Brooks (an Account Executive), acting from the device VNEVADO-Win10V'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A SID history injection was detected involving the process `net.exe`, indicating an attacker attempted to elevate privileges by modifying the SID history attribute.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'An anomalous chain of account lookups was observed from the account with SID `S-5-7-21-1843151660-3234030288-105586167-1422`, suggesting reconnaissance on potential target accounts.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The account `Ethan Brooks` on VNEVADO-Win10V enumerated SMB sessions on VNEVADO-DC, retrieving recent IP addresses of 2 accounts.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
