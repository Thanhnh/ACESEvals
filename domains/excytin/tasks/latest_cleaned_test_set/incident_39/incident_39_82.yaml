tasks:
- task_id: incident_39_latest_cleaned_test_set_task_82
  title: incident_39_latest_cleaned_test_set_task_82
  description: 'In the alert about the attempt to disable the Microsoft Defender Antivirus service, what was the account name recorded for the user involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a suspected overpass-the-hash (Kerberos) attack was detected where Emma Clark, a Helpdesk Administrator, attempted to authenticate from the host `VNEVADO-Win10V` against the domain controller `VNEVADO-DC`. Her mailbox is hosted in the `vnevado.alpineskihouse.co` domain, and her directory identifier ties this activity to earlier suspicious behavior on the environment, where an attempt was made to disable the Microsoft Defender Antivirus service, likely to evade detection.'
    question: 'In the alert about the attempt to disable the Microsoft Defender Antivirus service, what was the account name recorded for the user involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677` (Emma Clark, Helpdesk Administrator) on VNEVADO-Win10V performed a suspected overpass-the-hash attack (Kerberos) attempting to authenticate against VNEVADO-DC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The account named `fk8mq` attempted to disable the Microsoft Defender Antivirus service, indicating antivirus tampering to evade detection.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
