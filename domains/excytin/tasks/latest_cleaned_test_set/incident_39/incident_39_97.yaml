tasks:
- task_id: incident_39_latest_cleaned_test_set_task_97
  title: incident_39_latest_cleaned_test_set_task_97
  description: 'Earlier in this incident, an alert flagged possible use of the Rubeus kerberoasting tool on an endpoint. What was the short account name (SAM-style user name) associated with that Rubeus activity alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident investigation, an alert was raised for email messages containing a malicious URL `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/` that were delivered to a user mailbox and later removed. The recipient was identified as Ethan Brooks, and the message originated from the sender address `k1pt7ez@vnevado.alpineskihouse.co` with sender IP `118.254.65.186`. Correlating the compromised user''s identity across the incident timeline revealed earlier suspicious activity on an endpoint several days before the email alert.'
    question: 'Earlier in this incident, an alert flagged possible use of the Rubeus kerberoasting tool on an endpoint. What was the short account name (SAM-style user name) associated with that Rubeus activity alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` received an email containing a malicious URL, which was delivered and later removed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the initial compromise, activity indicating use of the Rubeus kerberoasting tool was observed, involving the account with Name `tgs2z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
