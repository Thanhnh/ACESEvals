tasks:
- task_id: incident_39_latest_cleaned_test_set_task_89
  title: incident_39_latest_cleaned_test_set_task_89
  description: 'Around the same time, an alert fired for a potentially malicious URL click delivered by email. Which mailbox address was the recipient of that malicious message?'
  inherit_shared: true
  initial_context:
    incident_context: 'In this multi-stage incident, a suspected identity theft (pass-the-ticket) alert was raised: an actor took Julian Burke''s (IT director, `lucasb@vnevado.alpineskihouse.co`, SID `S-1-5-21-1440151660-4837038288-105596163-1120`) Kerberos ticket from host `VNEVADO-Win10B` and used it on VNEVADO-Win10V to access 4 resources. A deceptive user account named `xfbzkp` was also used in a sign-in attempt on a device within the same attack chain.'
    question: 'Around the same time, an alert fired for a potentially malicious URL click delivered by email. Which mailbox address was the recipient of that malicious message?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An actor stole Julian Burke (IT director)''s Kerberos ticket from VNEVADO-Win10B and replayed it on VNEVADO-Win10V to access 4 resources, with the activity originating from IP address `35.202.74.47`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A sign-in attempt was detected using a deceptive (decoy) user account with SID `S-5-7-21-1843151660-3234030288-105586167-1422`, indicating an attacker attempting lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A potentially malicious URL click was detected from the mail message delivered to recipient `tgs2z@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
