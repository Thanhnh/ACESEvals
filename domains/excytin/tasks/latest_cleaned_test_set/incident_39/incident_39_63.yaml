tasks:
- task_id: incident_39_latest_cleaned_test_set_task_63
  title: incident_39_latest_cleaned_test_set_task_63
  description: 'Just before the antivirus tampering, a related alert flagged a file that was dropped and launched from a remote location by the same user, indicating possible lateral movement. What is the remote IP address associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an attempt to disable the Microsoft Defender Antivirus service was detected on an endpoint. The tampering was performed via the process `6968__2024-06-27t14:33:05.7932439z__powershell -command set-mppreference -disablerealtimemonitoring 1`, which is a common defense evasion technique. This activity was linked to a compromised user account, which was also involved in other related alerts around the same time.'
    question: 'Just before the antivirus tampering, a related alert flagged a file that was dropped and launched from a remote location by the same user, indicating possible lateral movement. What is the remote IP address associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '141.216.110.153'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '141.216.110.153'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677` attempted to disable the Microsoft Defender Antivirus service, indicating antivirus tampering to evade detection.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From that compromised context, a remote session dropped a file and executed it, originating from the remote IP address `141.216.110.153`, indicating lateral movement or malware propagation.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
