tasks:
- task_id: incident_39_latest_cleaned_test_set_task_41
  title: incident_39_latest_cleaned_test_set_task_41
  description: 'Roughly a second later, a related alert fired for the execution of a known credential theft tool intended to dump users'' credentials, keys and plain-text passwords. What is the name of the account associated with that credential theft tool execution alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on the domain controller `vnevado-dc`, a suspicious service launch was detected under the account `lucasb` (SID `S-1-5-21-1440151660-4837038288-105596163-1120`, AAD user ID `7fcf9695-68fc-4258-864d-e1e5b166c66f`). The activity included the command line `powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" -databasepath (get-itemproperty -path registry::hklm\system\currentcontrolset\services\ntds\parameters).\"dsa database file\" -force; net.exe start ntds"` (PID 3780) followed by `"net.exe" start ntds` (PID 3400), suggesting an attempt to maintain persistence or elevate privileges.'
    question: 'Roughly a second later, a related alert fired for the execution of a known credential theft tool intended to dump users'' credentials, keys and plain-text passwords. What is the name of the account associated with that credential theft tool execution alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious service was launched on the device, starting the process `powershell.exe` to run malicious commands for persistence or privilege escalation.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The PowerShell process then executed a known credential theft tool command line intended to dump credentials, keys, and plain-text passwords, run under the account with Name `tgs2z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
