tasks:
- task_id: incident_39_latest_cleaned_test_set_task_88
  title: incident_39_latest_cleaned_test_set_task_88
  description: 'In the related alert about a user accessing a link in a ZAP-quarantined email, what was the URL that the user clicked?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, ''Kekeo'' malware was detected and active on host `vnevado-win10b` (AAD Device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), where the account `fk8mq` (SID `S-1-5-21-1540151660-3530000288-105586595-1517`) ran the process `2608__2024-06-27t14:33:27.7927134z__rubeus.exe dump /service:xfbzkp /user:lucasb`. This activity is linked through related alerts, including PsExec launching commands on a remote device, to a later alert where a user clicked a link in an email that had been quarantined by zero-hour auto purge (ZAP), reported by Microsoft Defender for Office 365.'
    question: 'In the related alert about a user accessing a link in a ZAP-quarantined email, what was the URL that the user clicked?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The ''Kekeo'' malware was detected and active, with the malicious file `rubeus.exe` extracted and executed on the device at 2024-07-04 22:35:03 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` used PsExec to launch a command on a remote device, indicating lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The same compromised user then clicked on a link in an email that had been quarantined by zero-hour auto purge (ZAP), accessing the malicious URL `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/` at 2024-07-10 11:24:45 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
