tasks:
- task_id: incident_39_latest_cleaned_test_set_task_70
  title: incident_39_latest_cleaned_test_set_task_70
  description: 'Moments later, a follow-up alert reported that the same ''Kekeo'' malware was detected and was active. Which user account name was associated with that follow-up alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a detection fired for ''Kekeo'' malware on the endpoint `vnevado-win10v` (Azure AD Device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`) at 2024-07-04 22:35:03 UTC. Malware and unwanted software can perform harmful actions, replicate to other machines, and receive commands from remote attackers, so the machine should be checked for signs of infection.'
    question: 'Moments later, a follow-up alert reported that the same ''Kekeo'' malware was detected and was active. Which user account name was associated with that follow-up alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The ''Kekeo'' malware was detected on the machine as the file `rubeus.exe`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The ''Kekeo'' malware (rubeus.exe) was detected and was active under the user account `fk8mq`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
