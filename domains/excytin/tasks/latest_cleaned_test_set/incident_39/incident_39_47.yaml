tasks:
- task_id: incident_39_latest_cleaned_test_set_task_47
  title: incident_39_latest_cleaned_test_set_task_47
  description: 'For the suspected DCSync (directory services replication) alert, what is the email address of the account that issued the replication request to VNEVADO-DC?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a potentially malicious URL click was detected: the mailbox `tgs2z@vnevado.alpineskihouse.co` received a mail message containing the link `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/`, which the user clicked. Follow-on activity linked to the same compromised environment included SMB user and IP address reconnaissance against the domain controller VNEVADO-DC from the workstation VNEVADO-Win10V, and ultimately a suspected DCSync attack in which a single directory services replication request was sent to VNEVADO-DC from that same workstation.'
    question: 'For the suspected DCSync (directory services replication) alert, what is the email address of the account that issued the replication request to VNEVADO-DC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lucasb@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'lucasb@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A user with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` clicked on a potentially malicious URL delivered via email.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'From the compromised endpoint VNEVADO-Win10V, the attacker performed user and IP address reconnaissance (SMB), enumerating SMB sessions on the domain controller host `VNEVADO-DC` to retrieve recent IP addresses of accounts.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Using elevated credentials, the attacker launched a suspected DCSync attack (replication of directory services) against the domain controller, involving the account with email `lucasb@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
