tasks:
- task_id: incident_39_latest_cleaned_test_set_task_65
  title: incident_39_latest_cleaned_test_set_task_65
  description: 'On the same device, another alert flagged suspicious activity that was initiated remotely (such as interactive sessions, file modifications, WMI commands, or scheduled task creation from a remote machine). What is the name of the service executable file involved in that remote activity alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled ''Potential human-operated malicious activity'' was raised, indicating a sequence of alerts that might be indicative of human-operated malicious activity observed on a device associated with the account `kyleg`. This kind of activity could lead to ransomware or other payloads being installed on target devices.'
    question: 'On the same device, another alert flagged suspicious activity that was initiated remotely (such as interactive sessions, file modifications, WMI commands, or scheduled task creation from a remote machine). What is the name of the service executable file involved in that remote activity alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'psexesvc.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'psexesvc.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sequence of alerts indicating potential human-operated malicious activity was observed on the device with AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that device, suspicious remote activity was detected involving the file `psexesvc.exe`, indicating the attacker used PsExec to remotely execute commands on the machine.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
