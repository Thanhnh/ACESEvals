tasks:
- task_id: incident_39_latest_cleaned_test_set_task_25
  title: incident_39_latest_cleaned_test_set_task_25
  description: 'For the ''Malicious credential theft tool execution detected'' alert on this device, what was the full command line executed (including the process ID and creation time)?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Suspicious remote activity'' alert was raised on host `vnevado-win10b` (Azure AD device ID fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb), where the process `psexesvc.exe` (PID 5512, created 2024-06-27T14:33:27Z) was executed remotely from IP address `141.216.110.153`, involving accounts such as `LocalSystem` (SID S-0-6-5) and `fk8mq` (SID S-1-5-21-1540151660-3530000288-105586595-1517). Shortly before this, multiple known dual-purpose tools were dropped on the same device, and a malicious credential theft tool execution was detected.'
    question: 'For the ''Malicious credential theft tool execution detected'' alert on this device, what was the full command line executed (including the process ID and creation time)?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID 4748, created 2024-06-27T14:33:38.0249949Z, command line: `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID 4748, created 2024-06-27T14:33:38.0249949Z, command line: `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was observed involving the file `psexesvc.exe`, indicating remote execution via PsExec.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Multiple dual-purpose tools were dropped on the device with HostName `vnevado-win10v`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that host, a malicious credential theft tool was executed: process ID `4748` at `2024-06-27t14:33:38.0249949z` with command line `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`, attempting a DCSync attack to dump credentials for user `xfbzkp` in domain `vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
