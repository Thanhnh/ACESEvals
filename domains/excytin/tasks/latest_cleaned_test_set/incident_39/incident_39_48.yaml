tasks:
- task_id: incident_39_latest_cleaned_test_set_task_48
  title: incident_39_latest_cleaned_test_set_task_48
  description: 'Roughly two seconds later, a related alert reported that the ''Kekeo'' credential-abuse malware was detected on this device during lateral movement. What is the Microsoft Entra (Azure AD) user ID of the account tied to that Kekeo detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of lateral movement activity on the domain controller `vnevado-dc`, an alert titled ''File dropped and launched from remote location'' was raised at 2024-07-04 22:35:02 UTC. The remote session was associated with the account `lucasb` (SID `S-1-5-21-1440151660-4837038288-105596163-1120`), and the dropped file was executed as process ID 7668 with the command line `psexesvc.exe` (created 2024-06-27T14:34:10Z).'
    question: 'Roughly two seconds later, a related alert reported that the ''Kekeo'' credential-abuse malware was detected on this device during lateral movement. What is the Microsoft Entra (Azure AD) user ID of the account tied to that Kekeo detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '97e6a954-b6bd-48a5-808c-bd8464cce677'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '97e6a954-b6bd-48a5-808c-bd8464cce677'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A remote session dropped and launched the file `psexesvc.exe` on the device, indicating PsExec-based lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'During that lateral movement, the ''Kekeo'' malware was detected on the device, associated with the compromised account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
