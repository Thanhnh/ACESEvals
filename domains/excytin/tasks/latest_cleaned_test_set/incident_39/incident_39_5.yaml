tasks:
- task_id: incident_39_latest_cleaned_test_set_task_5
  title: incident_39_latest_cleaned_test_set_task_5
  description: 'For the alert reporting the Microsoft Defender Antivirus tampering attempt, what is the security identifier (SID) of the account associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a sign-in attempt with a deceptive (decoy) user account named `tgs2z` was detected on the device `vnevado-win10v` (Azure AD device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`). Moments later, a sequence of alerts indicative of human-operated malicious activity was observed on the same device, including an attempt to disable the Microsoft Defender Antivirus service in order to evade detection.'
    question: 'For the alert reporting the Microsoft Defender Antivirus tampering attempt, what is the security identifier (SID) of the account associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1540151660-3530000288-105586595-1517'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1540151660-3530000288-105586595-1517'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in attempt was detected using the deceptive (decoy) user account `kyleg`, indicating a potential attacker leveraging a fake account on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised identity, with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677`, was involved in a sequence of alerts indicative of potential human-operated malicious activity on the device.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The account with SID `S-1-5-21-1540151660-3530000288-105586595-1517` then attempted to disable the Microsoft Defender Antivirus service, tampering with antivirus protection to evade detection.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
