tasks:
- task_id: incident_39_latest_cleaned_test_set_task_90
  title: incident_39_latest_cleaned_test_set_task_90
  description: 'For the credential theft tool execution alert in this chain, what was the process ID, creation time, and full command line of the process that was executed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation of a multi-stage incident, a ''Possible lateral movement'' alert was raised by Microsoft Defender for Endpoint on a device with AAD Device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`, indicating an attacker may be moving laterally across devices to gather data or elevate privileges. Following this activity chain, a sign-in attempt with a deceptive (decoy) user account was detected, and shortly afterward a known credential theft tool execution command line was flagged, where the process or its command line indicated an intent to dump users'' credentials, keys and plain-text passwords.'
    question: 'For the credential theft tool execution alert in this chain, what was the process ID, creation time, and full command line of the process that was executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 6880, Created Time (UTC): 2024-06-27T14:32:37.7041174Z, Command Line: `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe dir \\vnevado-win10b\c$\"" exit`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 6880, Created Time (UTC): 2024-06-27T14:32:37.7041174Z, Command Line: `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe dir \\vnevado-win10b\c$\"" exit`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Possible lateral movement was observed involving the IP address `35.202.74.47`, suggesting an attacker attempting to move across devices.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A sign-in attempt with a deceptive (decoy) user account was detected on the device with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A malicious credential theft tool was executed on that device at `2024-06-27t14:32:37.7041174z` with Process ID `6880` and command line `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe dir \\vnevado-win10b\c$\"" exit`, performing a pass-the-hash attack to access another host.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
