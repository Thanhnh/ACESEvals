tasks:
- task_id: incident_39_latest_cleaned_test_set_task_42
  title: incident_39_latest_cleaned_test_set_task_42
  description: 'For the malicious credential theft tool execution alert, what was the process ID and the full command line of the tool that was executed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired for a successful logon using overpass-the-hash with potentially stolen credentials involving account `fk8mq` (SID S-1-5-21-1540151660-3530000288-105586595-1517) on host `vnevado-win10b` from IP 141.216.110.153, where the `lsass.exe` process (PID 692) was implicated. Seconds later, a related alert flagged suspicious access to the LSASS service on the same host, and another alert reported the execution of a known credential theft tool whose command line indicated an intent to dump users'' credentials, keys and plain-text passwords.'
    question: 'For the malicious credential theft tool execution alert, what was the process ID and the full command line of the tool that was executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 5176, Command line: `"mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit` (created 2024-06-27T14:33:32.4282796Z)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 5176, Command line: `"mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit` (created 2024-06-27T14:33:32.4282796Z)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An attacker performed a successful logon using overpass-the-hash with credentials potentially stolen from the `lsass.exe` process.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious access to the LSASS service was detected, associated with the account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`, indicating credential dumping from memory.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A known credential theft tool was executed with Process ID `5176` at `2024-06-27t14:33:32.4282796z`, using the command line `"mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit` to inject stolen Kerberos tickets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
