tasks:
- task_id: incident_39_latest_cleaned_test_set_task_45
  title: incident_39_latest_cleaned_test_set_task_45
  description: 'For the alert reporting the active ''Kekeo'' malware, which user account security identifier (SID) was associated with the detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired indicating that multiple known public dual-purpose tools were dropped on a device: `psexec.exe`, `mimikatz.exe`, and `domaindominance27.ps1`. Attackers often copy such tools to a target device to perform credential theft, privilege escalation, and lateral movement. Shortly afterwards, PsExec was observed launching a command on a remote device, and within seconds an active ''Kekeo'' malware detection was raised on the same attack chain.'
    question: 'For the alert reporting the active ''Kekeo'' malware, which user account security identifier (SID) was associated with the detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1540151660-3530000288-105586595-1517'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1540151660-3530000288-105586595-1517'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Multiple dual-purpose tools were dropped on the device, including the process with extracted file name `powershell.exe`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'PsExec was used to launch a command on a remote device, executing the process with extracted file name `rubeus.exe` for lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'An active ''Kekeo'' malware was detected running under the account with SID `S-1-5-21-1540151660-3530000288-105586595-1517`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
