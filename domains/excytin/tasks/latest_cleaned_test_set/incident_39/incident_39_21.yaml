tasks:
- task_id: incident_39_latest_cleaned_test_set_task_21
  title: incident_39_latest_cleaned_test_set_task_21
  description: 'For the SID history injection alert that was raised on this device, what is the Microsoft Entra (AAD) User ID of the account associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a known credential theft tool was detected executing on host `vnevado-win10v` (AAD Device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`). The process `mimikatz.exe` (PID 4748, created 2024-06-27T14:33:38Z) ran with the command line `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`, under the account `tgs2z` (SID `S-5-7-21-1843151660-3234030288-105586167-1422`). Seconds later, related alerts fired on the same device, including suspicious access to the LSASS service and a SID history injection, where an attacker modifies a domain user''s SID history attribute to gain elevated privileges.'
    question: 'For the SID history injection alert that was raised on this device, what is the Microsoft Entra (AAD) User ID of the account associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '7fcf9695-68fc-4258-864d-e1e5b166c66f'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '7fcf9695-68fc-4258-864d-e1e5b166c66f'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed by the account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`, indicating an intent to dump users'' credentials and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The credential theft was carried out through suspicious access to the LSASS service by the process `powershell.exe` (ExtractedFileName), used to decrypt passwords from LSASS memory.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Using the stolen credentials, a SID history injection was detected on the device, elevating privileges for the account with AadUserId `7fcf9695-68fc-4258-864d-e1e5b166c66f`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
