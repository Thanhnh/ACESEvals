tasks:
- task_id: incident_39_latest_cleaned_test_set_task_54
  title: incident_39_latest_cleaned_test_set_task_54
  description: 'Almost simultaneously, a related alert reported that a suspicious service was launched on this device, a technique often used for persistence or privilege escalation. What is the security identifier (SID) of the account tied to that suspicious service launch?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, an alert fired on the device `vnevado-win10v` (Azure AD device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`) indicating that multiple known public dual-purpose tools were dropped, including `mimikatz.exe`, `rubeus.exe` and `psexec.exe`, along with a script `domaindominance27.ps1` that was executed by the user `tgs2z` via the command line `"powershell.exe" -executionpolicy bypass -file c:\users\tgs2z\downloads\domaindominance27\domaindominance27.ps1` (Process ID 4676). Attackers commonly drop such tools to perform credential theft, privilege escalation, and lateral movement.'
    question: 'Almost simultaneously, a related alert reported that a suspicious service was launched on this device, a technique often used for persistence or privilege escalation. What is the security identifier (SID) of the account tied to that suspicious service launch?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1440151660-4837038288-105596163-1120'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1440151660-4837038288-105596163-1120'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Multiple dual-purpose tools were dropped on the device, with `powershell.exe` identified as the process used to drop or execute these tools.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious service was launched on the device by the account with SID `S-1-5-21-1440151660-4837038288-105596163-1120`, likely to maintain persistence or elevate privileges.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
