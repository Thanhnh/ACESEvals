tasks:
- task_id: incident_39_latest_cleaned_test_set_task_22
  title: incident_39_latest_cleaned_test_set_task_22
  description: 'A few seconds later, a related alert fired on the same device identifying the specific hacktool used to harvest plaintext passwords, password hashes and Kerberos tickets. What is the name of the file flagged in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a malicious credential theft tool execution command line was detected on host `vnevado-win10v` (AAD Device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`), under the account `tgs2z` (SID `S-5-7-21-1843151660-3234030288-105586167-1422`, AAD User ID `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`). The suspicious process (PID 4112, created 2024-06-27T14:32:36Z) used arguments such as `privilege::debug` and `sekurlsa::pth /user:kyleg /ntlm:96def1a633fc6790124d5f8fe31cc72b /domain:vnevado.alpineskihouse.co /run:"powershell.exe dir \\vnevado-win10b\c$"`, indicating an intent to dump users'' credentials, keys and plain-text passwords.'
    question: 'A few seconds later, a related alert fired on the same device identifying the specific hacktool used to harvest plaintext passwords, password hashes and Kerberos tickets. What is the name of the file flagged in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` executed a known credential theft tool command line intended to dump users'' credentials, keys and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The credential theft activity was carried out with the Mimikatz hacktool, identified by the file named `mimikatz.exe` on the device.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
