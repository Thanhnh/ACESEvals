tasks:
- task_id: incident_39_latest_cleaned_test_set_task_94
  title: incident_39_latest_cleaned_test_set_task_94
  description: 'For the related suspicious account creation alert, which executable (file name) was used to create the new user account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired indicating that multiple known dual-purpose tools were dropped on a device — specifically `psexec.exe`, `mimikatz.exe`, `rubeus.exe`, and a script named `domaindominance27.ps1`. Attackers often copy such tools to a target device to perform credential theft, privilege escalation, and lateral movement. Around the same time, a related alert reported a suspicious account creation, where a new user account was created, possibly to establish backup access to the device or organization.'
    question: 'For the related suspicious account creation alert, which executable (file name) was used to create the new user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'net.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'net.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A PowerShell process with Process ID `4676` was launched at `2024-06-27T14:32:08.4041849Z` with command line `"powershell.exe" -executionpolicy bypass -file c:\users\tgs2z\downloads\domaindominance27\domaindominance27.ps1`, dropping multiple dual-purpose tools on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The script then created a new suspicious user account for persistence using the process with ExtractedFileName `net.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
