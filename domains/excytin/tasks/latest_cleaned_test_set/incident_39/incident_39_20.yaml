tasks:
- task_id: incident_39_latest_cleaned_test_set_task_20
  title: incident_39_latest_cleaned_test_set_task_20
  description: 'For the earlier ''Anomalous account lookups'' alert in this incident, what is the name of the file associated with that reconnaissance activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a suspected DCSync attack (replication of directory services) was detected where the account `Julian Burke` (`lucasb@vnevado.alpineskihouse.co`), an IT director, sent a replication request from VNEVADO-Win10V to the domain controller VNEVADO-DC. Related activity on the same host included SMB session enumeration used to retrieve recent IP addresses of accounts, and an earlier alert for an anomalous chain of attempts to look up user account information, suggesting an attacker was gathering information about potential targets.'
    question: 'For the earlier ''Anomalous account lookups'' alert in this incident, what is the name of the file associated with that reconnaissance activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'domaindominance27.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'domaindominance27.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspected DCSync attack (replication of directory services) was detected against the domain controller host `VNEVADO-DC`, where a replication request was sent from VNEVADO-Win10V.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` (Ethan Brooks, Account Executive) performed user and IP address reconnaissance over SMB, enumerating SMB sessions on VNEVADO-DC to retrieve recent IP addresses of 2 accounts.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The reconnaissance continued with an anomalous chain of account lookups performed by the script file `domaindominance27.ps1`, which was used to gather information about potential target accounts.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
