tasks:
- task_id: incident_39_latest_cleaned_test_set_task_95
  title: incident_39_latest_cleaned_test_set_task_95
  description: 'For the alert where ''Kekeo'' malware was detected during lateral movement, which remote IP address was identified as involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a known credential theft tool was executed on a device — the process with ID 4748 (created 2024-06-27T14:33:38.0249949Z) ran the command line `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`, indicating an intent to dump user credentials. Shortly afterwards, multiple dual-purpose tools were found dropped on the same device, and a related alert flagged ''Kekeo'' malware being detected during lateral movement, suggesting an attacker may have been moving to this device from another machine on the network.'
    question: 'For the alert where ''Kekeo'' malware was detected during lateral movement, which remote IP address was identified as involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '141.216.110.153'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '141.216.110.153'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool execution command line was detected on host `vnevado-win10v`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Multiple dual-purpose tools were dropped on the device, including the file `rubeus.exe`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The ''Kekeo'' malware was detected during lateral movement, associated with the IP address `141.216.110.153`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
