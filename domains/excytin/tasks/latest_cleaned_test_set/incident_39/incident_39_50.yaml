tasks:
- task_id: incident_39_latest_cleaned_test_set_task_50
  title: incident_39_latest_cleaned_test_set_task_50
  description: 'What is the name of the malicious executable file detected on this device that is capable of harvesting plaintext passwords, password hashes, smartcard PINs, and Kerberos tickets?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Possible lateral movement'' alert was raised on host `vnevado-win10b` (AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), where lateral movement on another device was observed in close time proximity to a suspicious network event on this device. Shortly after, a sign-in attempt with a deceptive (decoy) user account was detected, and moments later a credential theft hacktool associated with actor Storm-0875 was detected on the same device.'
    question: 'What is the name of the malicious executable file detected on this device that is capable of harvesting plaintext passwords, password hashes, smartcard PINs, and Kerberos tickets?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious network event indicating possible lateral movement was observed involving the IP address `35.202.74.47`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A sign-in attempt with the deceptive user account named `tgs2z` was detected on the device, suggesting an attacker used a decoy account for lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The credential theft tool file `mimikatz.exe` was detected on the device, indicating the attacker attempted to harvest credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
