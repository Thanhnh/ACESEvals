tasks:
- task_id: incident_39_latest_cleaned_test_set_task_57
  title: incident_39_latest_cleaned_test_set_task_57
  description: 'For the alert reporting possible use of the Rubeus kerberoasting tool, what is the security identifier (SID) of the account associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a malicious credential theft tool execution was detected: the process `mimikatz.exe` (Process ID 4112, created 2024-06-27T14:32:36Z) ran the command line `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:kyleg /ntlm:96def1a633fc6790124d5f8fe31cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe dir \\vnevado-win10b\c$\"" exit`, indicating an intent to dump credentials and perform a pass-the-hash attack. Around the same time, other alerts on the same device chain were triggered, including PsExec launching a command on a remote device and activity indicating use of the Rubeus tool, which can perform kerberoasting and pass-the-ticket attacks.'
    question: 'For the alert reporting possible use of the Rubeus kerberoasting tool, what is the security identifier (SID) of the account associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1540151660-3530000288-105586595-1517'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1540151660-3530000288-105586595-1517'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed on the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, indicating an intent to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'PsExec was then used to launch a command on a remote device, involving the file `adminticket.txt`, suggesting lateral movement in the organization.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The Rubeus kerberoasting tool was possibly used by the account with SID `S-1-5-21-1540151660-3530000288-105586595-1517` to request and abuse Kerberos tickets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
