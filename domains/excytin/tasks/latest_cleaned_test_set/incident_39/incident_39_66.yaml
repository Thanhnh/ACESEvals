tasks:
- task_id: incident_39_latest_cleaned_test_set_task_66
  title: incident_39_latest_cleaned_test_set_task_66
  description: 'In the closely related alert where a suspicious file was registered as a service for persistence, what is the name of the account under which that service registration occurred?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled ''Multiple dual-purpose tools were dropped'' fired on host `vnevado-win10v`. Multiple known public tools that can also be used maliciously — such as `rubeus.exe`, `psexec.exe`, and the script `domaindominance27.ps1` executed via `powershell.exe` — were dropped on this device by the account `tgs2z` (SID S-5-7-21-1843151660-3234030288-105586167-1422). Such tooling is typically staged for credential theft, privilege escalation, and lateral movement, and shortly afterwards related alerts for ''Kekeo'' malware and a suspicious file being registered as a service were raised on the same device.'
    question: 'In the closely related alert where a suspicious file was registered as a service for persistence, what is the name of the account under which that service registration occurred?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'LocalSystem'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'LocalSystem'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Multiple dual-purpose tools, including the file `rubeus.exe`, were dropped on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The ''Kekeo'' malware was detected during lateral movement on the host `vnevado-win10b`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A suspicious file was registered as a service using the account `LocalSystem` for persistence.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
