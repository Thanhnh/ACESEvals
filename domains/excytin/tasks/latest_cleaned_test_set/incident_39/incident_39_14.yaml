tasks:
- task_id: incident_39_latest_cleaned_test_set_task_14
  title: incident_39_latest_cleaned_test_set_task_14
  description: 'Related to this activity, a known credential theft tool execution was detected on the same device. What was the process ID, creation time, and the full command line of that process?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a security incident, a sequence of alerts indicative of potential human-operated malicious activity was observed on device `vnevado-win10b` (AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), involving an account with SID `S-1-5-21-1540151660-3530000288-105586595-1517` (AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677`) and the IP address `141.216.110.153`. This activity could lead to ransomware or other payloads being installed on the targeted devices.'
    question: 'Related to this activity, a known credential theft tool execution was detected on the same device. What was the process ID, creation time, and the full command line of that process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 6880, Created Time (UTC): 2024-06-27T14:32:37.7041174Z, Command line: `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe dir \\vnevado-win10b\c$\"" exit`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 6880, Created Time (UTC): 2024-06-27T14:32:37.7041174Z, Command line: `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe dir \\vnevado-win10b\c$\"" exit`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A sequence of alerts indicating potential human-operated malicious activity was observed involving the account `kyleg`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A sign-in attempt with a deceptive (decoy) user account was detected, involving the account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A known credential theft tool was executed at `2024-06-27t14:32:37.7041174z` with Process ID `6880` and command line `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe dir \\vnevado-win10b\c$\"" exit`, performing a pass-the-hash attack to move laterally.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
