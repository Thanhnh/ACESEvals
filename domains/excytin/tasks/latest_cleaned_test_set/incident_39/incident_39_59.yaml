tasks:
- task_id: incident_39_latest_cleaned_test_set_task_59
  title: incident_39_latest_cleaned_test_set_task_59
  description: 'Related to this activity, there was also an alert about a sign-in attempt made with a deceptive (fake or decoy) user account on the same device. What is the SID of the account used in that sign-in attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert was raised for a successful logon using overpass-the-hash with potentially stolen credentials, where credentials appear to have been obtained from memory. The alert involved the account with SID `S-2-2-78` and the process `lsass.exe` (Process ID 692, created 2024-06-26T17:11:52.8381782Z). Shortly after, a sequence of alerts indicative of potential human-operated malicious activity was observed on the same device, which could lead to ransomware or other payloads being deployed.'
    question: 'Related to this activity, there was also an alert about a sign-in attempt made with a deceptive (fake or decoy) user account on the same device. What is the SID of the account used in that sign-in attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-5-7-21-1843151660-3234030288-105586167-1422'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-5-7-21-1843151660-3234030288-105586167-1422'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An attacker performed a successful logon using overpass-the-hash with potentially stolen credentials on the host with HostName `vnevado-win10b`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On that device, a sequence of alerts indicative of potential human-operated malicious activity was observed involving the account with Name `kyleg`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A sign-in attempt with a deceptive (fake or decoy) user account was detected on the device, involving the account with SID `S-5-7-21-1843151660-3234030288-105586167-1422`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
