tasks:
- task_id: incident_39_latest_cleaned_test_set_task_1
  title: incident_39_latest_cleaned_test_set_task_1
  description: 'For the suspected DCSync attack (replication of directory services) that followed, what is the email address of the user account that issued the replication request to VNEVADO-DC?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled "Successful logon using overpass-the-hash with potentially stolen credentials" was raised, indicating an attacker accessed a resource with credentials that might have been obtained by dumping a password hash from memory (the process `lsass.exe`, PID 692, created 2024-06-26T17:11:52.8381782Z) and then using that hash to obtain a Kerberos ticket. The activity involved the account `fk8mq` (SID S-2-2-78) on host `vnevado-win10b` (AAD Device ID fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb). This credential theft chain later led to a suspected overpass-the-hash (Kerberos) attempt against the domain controller VNEVADO-DC and, subsequently, to a suspected DCSync attack in which a directory services replication request was sent to VNEVADO-DC.'
    question: 'For the suspected DCSync attack (replication of directory services) that followed, what is the email address of the user account that issued the replication request to VNEVADO-DC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lucasb@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'lucasb@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An attacker successfully logged on using overpass-the-hash with potentially stolen credentials of the account with SID `S-1-5-21-1540151660-3530000288-105586595-1517`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspected overpass-the-hash attack (Kerberos) was detected, where Emma Clark (Helpdesk Administrator) on VNEVADO-Win10V attempted to authenticate against the domain controller host `VNEVADO-DC`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A suspected DCSync attack (replication of directory services) was detected against VNEVADO-DC, associated with the account with email `lucasb@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
