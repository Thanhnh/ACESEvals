tasks:
- task_id: incident_39_latest_cleaned_test_set_task_6
  title: incident_39_latest_cleaned_test_set_task_6
  description: 'For the alert that detected ''Kekeo'' malware during lateral movement, what is the name of the file that was flagged?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, PsExec was used to launch a remote command on `vnevado-dc` (Process ID 5612, command line: `"psexec.exe" \\vnevado-dc -accepteula cmd /c "powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" -databasepath (get-itemproperty -path registry::hklm\system\currentcontrolset\services\ntds\parameters).\"dsa database file\" -force; net.exe start ntds""`), indicating possible lateral movement. Around the same time, multiple known dual-purpose tools were dropped on the device, and shortly afterwards an alert fired for ''Kekeo'' malware being detected during lateral movement.'
    question: 'For the alert that detected ''Kekeo'' malware during lateral movement, what is the name of the file that was flagged?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `tgs2z` used PsExec to launch a command on a remote device, indicating lateral movement in the organization.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Multiple dual-purpose tools were dropped on the device, including the file `rubeus.exe`, which can be used for credential theft, privilege escalation, and lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The dropped file `rubeus.exe` was detected as the ''Kekeo'' malware during lateral movement to this device.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
