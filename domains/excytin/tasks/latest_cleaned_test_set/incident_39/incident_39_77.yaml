tasks:
- task_id: incident_39_latest_cleaned_test_set_task_77
  title: incident_39_latest_cleaned_test_set_task_77
  description: 'For the Rubeus kerberoasting activity linked to this sign-in, what is the name of the script file that was executed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a sign-in attempt was detected using a deceptive user account named `kyleg` from IP address `35.202.74.47`. A potential attacker might be using a fake or decoy account to perform lateral movement or access sensitive data. Shortly after this sign-in, activity indicating the use of the Rubeus tool (capable of kerberoasting and pass-the-ticket attacks) was observed on the same endpoint.'
    question: 'For the Rubeus kerberoasting activity linked to this sign-in, what is the name of the script file that was executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-krbticket.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in attempt was detected using the deceptive (decoy) user account with Name `tgs2z`, suggesting an attacker was using a fake account on the device for lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the deceptive account sign-in, activity indicating use of the Rubeus kerberoasting tool was observed, involving the process with ExtractedFileName `get-krbticket.ps1`, which requests Kerberos tickets for service principal names to extract or reuse credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
