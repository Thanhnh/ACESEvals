tasks:
- task_id: incident_39_latest_cleaned_test_set_task_26
  title: incident_39_latest_cleaned_test_set_task_26
  description: 'A closely related alert fired at nearly the same time for a malicious credential theft tool execution on the same device, tied to the same user account. What is the file name of the process executed in that credential theft alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an alert was raised for ''Multiple dual-purpose tools were dropped'' on a device, where `powershell.exe` was launched with the command line `"powershell.exe" -executionpolicy bypass -file c:\users\tgs2z\downloads\domaindominance27\domaindominance27.ps1` (Process ID 4676, created 2024-06-27T14:32:08.4041849Z). Files dropped on the device included `psexec.exe`, `rubeus.exe`, and the script `domaindominance27.ps1`. These public tools can be used for credential theft, privilege escalation, and lateral movement.'
    question: 'A closely related alert fired at nearly the same time for a malicious credential theft tool execution on the same device, tied to the same user account. What is the file name of the process executed in that credential theft alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Multiple dual-purpose tools were dropped on the device by the user with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Among the dropped tools, the known credential theft tool `mimikatz.exe` was executed to dump users'' credentials, keys, and plain-text passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
