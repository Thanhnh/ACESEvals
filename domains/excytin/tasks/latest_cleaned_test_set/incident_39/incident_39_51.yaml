tasks:
- task_id: incident_39_latest_cleaned_test_set_task_51
  title: incident_39_latest_cleaned_test_set_task_51
  description: 'Closely related to this activity, an alert fired for a known credential theft tool execution command line intended to dump users'' credentials, keys and plain-text passwords. What is the Microsoft Entra (Azure AD) user ID of the account tied to that credential theft tool execution alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on the domain controller `vnevado-dc`, a SID history injection was detected: the account `lucasb` (SID `S-1-5-21-1440151660-4837038288-105596163-1120`, AAD user ID `7fcf9695-68fc-4258-864d-e1e5b166c66f`) was associated with process 3780 running `powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" ... ; net.exe start ntds"`, a child process `net1 stop ntds /y` (PID 7712), and a suspicious file `dkwj.mze`. SID history is an attribute that supports migration scenarios, and attackers typically abuse it to grant an existing domain user an SID with elevated privileges for persistence and access to sensitive data.'
    question: 'Closely related to this activity, an alert fired for a known credential theft tool execution command line intended to dump users'' credentials, keys and plain-text passwords. What is the Microsoft Entra (Azure AD) user ID of the account tied to that credential theft tool execution alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A SID history injection was detected on the device, carried out through the process with file name `powershell.exe`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the privilege escalation, activity indicating use of the Rubeus kerberoasting tool was observed for the account named `tgs2z`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A known malicious credential theft tool command line was executed under the account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`, indicating an attempt to dump users'' credentials and plain-text passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
