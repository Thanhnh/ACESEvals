tasks:
- task_id: incident_55_latest_cleaned_test_set_task_56
  title: incident_55_latest_cleaned_test_set_task_56
  description: 'What is the email address of the account that performed the suspected AD FS DKM key read?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an internal phishing campaign alert, a user was observed sending phishing emails from a device to recipients inside the organization, with accounts such as `Nina Sullivan` (santiago@vnevado.alpineskihouse.co) and `Lucas Grey` (bjenkins@niseko.alpineskihouse.co) involved, along with the URL `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`. Pivoting from this activity through a series of suspicious exploration command sequences on the compromised machines, the investigation leads to a later alert where an account read the DKM key of the AD FS object with id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`.'
    question: 'What is the email address of the account that performed the suspected AD FS DKM key read?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` was observed sending internal phishing emails from the device, indicating a possible compromise used for lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'On the compromised device, a process executed a suspicious sequence of exploration commands, including `whoami.exe`, to enumerate assets of value.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'These exploration activities were performed under the account named `gsmith`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The account `gsmith@niseko.alpineskihouse.co` was then observed reading the AD FS DKM key of ADFS object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
