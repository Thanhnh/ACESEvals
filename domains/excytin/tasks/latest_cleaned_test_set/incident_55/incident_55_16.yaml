tasks:
- task_id: incident_55_latest_cleaned_test_set_task_16
  title: incident_55_latest_cleaned_test_set_task_16
  description: 'For the ''Suspicious service registration'' alert in this incident, what is the file name of the process associated with registering the system program as a service?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a ''Suspicious sequence of exploration activities'' alert was raised after a process invoked a set of Windows commands often used by attackers to identify valuable assets and plan lateral movement. The observed activity included `powershell.exe` (PID 12412) setting its location to `c:\users\bjenkins\downloads\midnight14`, followed by `whoami.exe` (PID 13812) and `whoami.exe /user` (PID 1104), under the account `bjenkins` and involving IP address `72.5.72.208`. Additionally, a renamed Windows system executable was launched on the same host, and shortly afterwards a ''Suspicious service registration'' alert fired, indicating a system program was registered as a service, which can signal an attempt to establish persistence or gain SYSTEM privileges.'
    question: 'For the ''Suspicious service registration'' alert in this incident, what is the file name of the process associated with registering the system program as a service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A process `powershell.exe` ran a suspicious sequence of Windows exploration commands, indicating reconnaissance for assets of value and lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On host `mb-adfs`, a renamed Windows system executable was launched, suggesting the attacker was attempting to evade behavior-based detections.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A system program was then registered as a service through the process `services.exe`, indicating an attempt to establish persistence or gain SYSTEM privileges.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
