tasks:
- task_id: incident_55_latest_cleaned_test_set_task_24
  title: incident_55_latest_cleaned_test_set_task_24
  description: 'For the alert about the unusual addition of credentials to the OAuth application, what is the application ID (OAuth App ID) of the affected app?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a renamed Windows system executable `iy2orr1e.rrg.exe` was launched on host `mb-adfs` under the SYSTEM account (SID S-2-2-78) with a hidden window and an encoded PowerShell command, followed shortly after by a suspicious sequence of exploration commands. The attack chain later moved into the cloud, where the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password-type credential to the application SimulandApp, which may indicate the app was compromised for phishing, data exfiltration, or gaining access to other accounts.'
    question: 'For the alert about the unusual addition of credentials to the OAuth application, what is the application ID (OAuth App ID) of the affected app?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '4d9476b8-6ae6-459b-a273-5837c15b5981'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '4d9476b8-6ae6-459b-a273-5837c15b5981'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A renamed system executable, originally `powershell.exe`, was launched on the machine to evade path- and name-based detections.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` ran a suspicious sequence of Windows exploration commands to discover assets and prepare for lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The compromised user then performed an unusual addition of a Password credential to the OAuth application with OAuthAppId `4d9476b8-6ae6-459b-a273-5837c15b5981` (SimulandApp), enabling persistent access through the app.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
