tasks:
- task_id: incident_55_latest_cleaned_test_set_task_30
  title: incident_55_latest_cleaned_test_set_task_30
  description: 'Almost simultaneously, a ''Suspicious remote activity'' alert was triggered on the same machine, flagging activity initiated from a remote system. Under which account name was that remotely initiated activity executed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled ''Suspicious sequence of exploration activities'' was raised after a process invoked a set of Windows commands (such as `whoami.exe /user`, process IDs 14260 and 1104) that attackers commonly use to identify valuable assets and plan lateral movement. The activity was tied to user `bjenkins` (AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`), the IP address `72.5.72.208`, and PowerShell executions including `"powershell.exe" c:\script\contosoadfsblatempcreds.ps1` and `"powershell.exe" -noexit -command set-location -literalpath ''c:\users\bjenkins\downloads\midnight14''`.'
    question: 'Almost simultaneously, a ''Suspicious remote activity'' alert was triggered on the same machine, flagging activity initiated from a remote system. Under which account name was that remotely initiated activity executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'LocalSystem'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'LocalSystem'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process launched `powershell.exe` to run a suspicious sequence of Windows exploration commands, used to identify valuable assets and plan lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The suspicious remote activity on the machine was initiated under the account `LocalSystem`, indicating remotely triggered execution such as interactive sessions, WMI commands, or scheduled tasks.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
