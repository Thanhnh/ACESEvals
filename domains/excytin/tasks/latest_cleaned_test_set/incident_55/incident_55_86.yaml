tasks:
- task_id: incident_55_latest_cleaned_test_set_task_86
  title: incident_55_latest_cleaned_test_set_task_86
  description: 'For the alert about emails containing a malicious URL that were removed after delivery, which recipient mailbox primary address received those messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a malicious PowerShell Cmdlet was invoked on host `mb-winclient` (AAD Device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`), where the script `contosoadfsblatempcreds.ps1` was executed via `powershell.exe` (Process ID 13968) under accounts such as `pwilson` (SID S-1-5-21-551436448-9871687716-9837441745-1903) and `bjenkins`. Follow-on activity showed that a compromised user on this device sent internal phishing emails to recipients inside the organization, and a later alert reported emails containing a malicious URL that were delivered and then removed after delivery.'
    question: 'For the alert about emails containing a malicious URL that were removed after delivery, which recipient mailbox primary address received those messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'santiago@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'santiago@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious PowerShell cmdlet associated with credential theft or code injection was invoked on the machine by the user account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account `santiago@vnevado.alpineskihouse.co` was then observed sending internal phishing emails from this device to recipients inside the organization.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Emails containing a malicious URL were delivered to and later removed from the mailbox with primary address `santiago@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
