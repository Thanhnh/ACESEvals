tasks:
- task_id: incident_55_latest_cleaned_test_set_task_20
  title: incident_55_latest_cleaned_test_set_task_20
  description: 'Shortly before this, on the same host, a related alert fired for a renamed Windows system executable being launched. Under which user account was that renamed executable launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious service registration alert was raised when a system program was registered as a service — an activity that can indicate malicious intent to establish persistence or gain system privileges. The process involved was `services.exe` with Process ID 764, created at 2024-06-20T08:30:13.7925191Z.'
    question: 'Shortly before this, on the same host, a related alert fired for a renamed Windows system executable being launched. Under which user account was that renamed executable launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'SYSTEM'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'On host `mb-adfs`, a system program was registered as a service, indicating an attempt to establish persistence or gain system privileges (alert: Suspicious service registration).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same host, a renamed Windows system executable was launched under the account `SYSTEM`, suggesting the attacker used the elevated SYSTEM context to evade path/name-based detections.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
