tasks:
- task_id: incident_55_latest_cleaned_test_set_task_34
  title: incident_55_latest_cleaned_test_set_task_34
  description: 'Following the account thread from this phishing email, another alert in the incident reported that a process scanned or dumped memory from the Local Security Authority Subsystem Service (lsass.exe) to harvest credentials. What IP address is associated with that sensitive credential memory read alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert fired for "Email messages containing malicious URL removed after delivery" — a message sent from `santiago@vnevado.alpineskihouse.co` (sender IP `119.36.50.193`) was delivered to the mailbox of Lucas Grey (`bjenkins@niseko.alpineskihouse.co`) and contained the malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` before being removed. This user account is also linked to later activity in the same incident.'
    question: 'Following the account thread from this phishing email, another alert in the incident reported that a process scanned or dumped memory from the Local Security Authority Subsystem Service (lsass.exe) to harvest credentials. What IP address is associated with that sensitive credential memory read alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` received an email message containing a malicious URL, which was delivered and later removed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, a process scanned or dumped credential memory from the Local Security Authority Subsystem Service (lsass.exe), and the sensitive credential memory read activity was associated with the IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
