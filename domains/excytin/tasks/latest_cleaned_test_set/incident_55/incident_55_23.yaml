tasks:
- task_id: incident_55_latest_cleaned_test_set_task_23
  title: incident_55_latest_cleaned_test_set_task_23
  description: 'For the alert about email messages containing a malicious URL that were removed after delivery, what is the display name of the account associated with it?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert fired for an unusual addition of credentials to an OAuth application: the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) added a Password-type credential to the application SimulandApp, from IP address `2801:e0a:1eb:dea0:642e:5bb6:d315:fbb3` on the Office 365 / Microsoft 365 cloud application (AppId 11161, OAuth app ID `4d9476b8-6ae6-459b-a273-5837c15b5981`). This pattern may indicate an attacker compromised the app to spread phishing, exfiltrate data, or gain access to other accounts and devices. Pivoting from this activity through a related alert about a malicious PowerShell Cmdlet invoked on a machine, the same account chain leads to an email-related alert where messages containing a malicious URL were delivered and later removed.'
    question: 'For the alert about email messages containing a malicious URL that were removed after delivery, what is the display name of the account associated with it?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Lucas Grey'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Lucas Grey'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A user with SID `S-1-5-21-551436448-9871687716-9837441745-1903` (Luciano Herrera, pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application SimulandApp, indicating the app may have been compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A malicious PowerShell Cmdlet, potentially associated with credential theft, exploitation, network reconnaissance or code injection, was invoked on a machine by the account with SID `S-1-5-21-561436748-3867387497-1732241745-3701`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The email account `Lucas Grey` received email messages containing a malicious URL, which were delivered and later removed.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
