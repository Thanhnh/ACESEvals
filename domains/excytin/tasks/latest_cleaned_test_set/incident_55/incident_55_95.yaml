tasks:
- task_id: incident_55_latest_cleaned_test_set_task_95
  title: incident_55_latest_cleaned_test_set_task_95
  description: 'Immediately after this activity, a related alert flagged a suspicious LDAP query indicating potential domain reconnaissance. What is the name of the script file responsible for that LDAP reconnaissance activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, an alert was raised for a malicious PowerShell Cmdlet invoked on a machine by the account `bjenkins` (SID S-1-5-21-561436748-3867387497-1732241745-3701). The activity involved PowerShell processes, including process 12412 launched with `"powershell.exe" -noexit -command set-location -literalpath ''c:\users\bjenkins\downloads\midnight14''` and process 13968 executing the script `contosoadfsblatempcreds.ps1`. Such Cmdlets may be associated with credential theft, exploitation, network reconnaissance or code injection.'
    question: 'Immediately after this activity, a related alert flagged a suspicious LDAP query indicating potential domain reconnaissance. What is the name of the script file responsible for that LDAP reconnaissance activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ldaprequest.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ldaprequest.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious PowerShell Cmdlet was invoked on the machine via the process `powershell.exe` at 2024-07-04 22:35:03 UTC, potentially associated with credential theft, exploitation, network reconnaissance, or code injection.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that, the script `ldaprequest.ps1` executed a suspicious LDAP query against the domain controller, indicating reconnaissance activity to enumerate administrative users, groups, and valuable assets in the organization.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
