tasks:
- task_id: incident_55_latest_cleaned_test_set_task_2
  title: incident_55_latest_cleaned_test_set_task_2
  description: 'An earlier related alert reported a suspicious sequence of exploration activities, where a process invoked a set of Windows commands often used to identify valuable assets and plan lateral movement. What was the command line of the process launched in that alert, along with its process ID and creation time?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of an incident, an alert titled ''Suspicious service creation'' was raised, indicating that the account `gsmith@niseko.alpineskihouse.co` created a service named DDLOXJDSQSNGMUKKFUXQ in order to execute potentially malicious commands on the host `MB-ADFS`. This activity is linked, through a shared user account SID, to earlier reconnaissance activity in the same incident.'
    question: 'An earlier related alert reported a suspicious sequence of exploration activities, where a process invoked a set of Windows commands often used to identify valuable assets and plan lateral movement. What was the command line of the process launched in that alert, along with its process ID and creation time?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Command line: `"whoami.exe"`, Process ID: 3468, Created Time (UTC): 2024-07-04T00:00:02.3476619Z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Command line: `"whoami.exe"`, Process ID: 3468, Created Time (UTC): 2024-07-04T00:00:02.3476619Z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` (gsmith) created a suspicious service named `DDLOXJDSQSNGMUKKFUXQ` to execute potentially malicious commands on the host MB-ADFS.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From that compromised context, a process ran a sequence of exploration commands, including the process with Process ID `3468` created at `2024-07-04t00:00:02.3476619z` with command line `"whoami.exe"`, used to identify assets of value and coordinate lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
