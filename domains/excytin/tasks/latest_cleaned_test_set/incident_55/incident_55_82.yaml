tasks:
- task_id: incident_55_latest_cleaned_test_set_task_82
  title: incident_55_latest_cleaned_test_set_task_82
  description: 'Shortly after this discovery activity, a related alert was raised for suspicious access to the LSASS service, where attackers attempt to decrypt user passwords from LSASS memory. What is the name of the file (module) flagged in that credential access alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a "Suspicious System Hardware Discovery" alert was raised on a device where a known tool or technique was used to gather information about the target device or network. The activity was tied to the account `pwilson` (SID `S-1-5-21-551436448-9871687716-9837441745-1903`) and involved the process `svchost.exe -k netsvcs -p -s winmgmt` (PID 2880), as well as a PowerShell execution of the script `contosoadfsblatempcreds.ps1` (PID 13968).'
    question: 'Shortly after this discovery activity, a related alert was raised for suspicious access to the LSASS service, where attackers attempt to decrypt user passwords from LSASS memory. What is the name of the file (module) flagged in that credential access alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'hid.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'hid.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `bjenkins` was used to run a known tool or technique to perform suspicious system hardware discovery on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the discovery activity, suspicious access to the LSASS service was detected involving the file `hid.dll`, indicating an attempt to dump credentials from LSASS memory.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
