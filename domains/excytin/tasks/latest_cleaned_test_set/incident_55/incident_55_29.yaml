tasks:
- task_id: incident_55_latest_cleaned_test_set_task_29
  title: incident_55_latest_cleaned_test_set_task_29
  description: 'Shortly after this remote activity, a suspicious LDAP query indicating potential Active Directory reconnaissance was detected. What is the security identifier (SID) of the account associated with that LDAP query alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a "Suspicious remote activity" alert was raised on host `mb-adfs`, where activity initiated remotely was observed. The alert involved the accounts `LocalSystem` and `gsmith` (AAD user ID `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`), and processes such as `cmd.exe` (PID 8896, command line: `cmd.exe /c "powershell.exe -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcafiazqbuageabqblafaabwb3aguacgbzaggazqbsagwalgbwahmamqa="`), a spawned `powershell.exe` (PID 6808) with the same encoded command, and `lsass.exe`.'
    question: 'Shortly after this remote activity, a suspicious LDAP query indicating potential Active Directory reconnaissance was detected. What is the security identifier (SID) of the account associated with that LDAP query alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-551436448-9871687716-9837441745-1903'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-551436448-9871687716-9837441745-1903'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was observed on the machine, where the process `powershell.exe` was initiated remotely to perform potentially malicious actions such as interactive sessions, file modification, or remote command execution.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the remote PowerShell activity, the account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` executed a suspicious LDAP query against the domain controller, indicating reconnaissance activity to enumerate administrative users, groups, and valuable assets in the organization.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
