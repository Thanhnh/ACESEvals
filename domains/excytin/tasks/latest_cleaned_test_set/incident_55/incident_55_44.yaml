tasks:
- task_id: incident_55_latest_cleaned_test_set_task_44
  title: incident_55_latest_cleaned_test_set_task_44
  description: 'For the alert about the suspicious service registration, what is the name of the process (file) involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert fired for an unusual addition of credentials to the OAuth application SimulandApp (OAuth App ID `4d9476b8-6ae6-459b-a273-5837c15b5981`) by the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) from IP address `36.193.21.220`, targeting the Office 365 / Microsoft 365 cloud application (App ID 11161). This activity is linked through a chain of related alerts on a compromised endpoint, including suspicious exploration commands and Task Scheduler abuse, ending with an alert for a system program being registered as a service to establish persistence or gain system privileges.'
    question: 'For the alert about the suspicious service registration, what is the name of the process (file) involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` (Luciano Herrera, pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application SimulandApp.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the compromised access, a suspicious sequence of exploration activities was executed through the process `powershell.exe`, running a set of Windows commands to discover valuable assets and prepare for lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'These exploration and discovery activities were observed on the host `mb-adfs`, where the involved process also abused Task Scheduler to create, modify, or delete a scheduled task in order to launch malicious code automatically and establish persistence.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'On that same host, persistence was further strengthened when the system program `services.exe` was used to register a system program as a service, indicating an attempt to maintain persistence or gain SYSTEM privileges.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
