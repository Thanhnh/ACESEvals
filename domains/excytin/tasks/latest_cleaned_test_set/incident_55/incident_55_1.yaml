tasks:
- task_id: incident_55_latest_cleaned_test_set_task_1
  title: incident_55_latest_cleaned_test_set_task_1
  description: 'For the suspected DCSync (directory services replication) alert, which user account was identified as the one that issued the replication request?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, an alert was raised for suspicious service creation: the account `gsmith@niseko.alpineskihouse.co` created a service named `DDLOXJDSQSNGMUKKFUXQ` in order to execute potentially malicious commands on the host `MB-ADFS`. Following this activity, the attacker chain continued with Impacket-based hands-on-keyboard execution and a suspicious sequence of exploration commands, ultimately leading to a suspected DCSync attack in which a replication request for directory services was sent from the device `MB-WINCLIENT` to the domain controller `MB-DC1`.'
    question: 'For the suspected DCSync (directory services replication) alert, which user account was identified as the one that issued the replication request?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera (CIO)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera (CIO)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `gsmith` created a suspicious service named `DDLOXJDSQSNGMUKKFUXQ` to execute potentially malicious commands on the host MB-ADFS.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'An ongoing hands-on-keyboard attack via the Impacket toolkit was observed, executing the process `powershell.exe` to explore network shares and move laterally.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` performed a suspicious sequence of exploration activities, running a set of Windows commands used to identify valuable assets and coordinate lateral movement.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The account `Luciano Herrera` on MB-WINCLIENT performed a suspected DCSync attack by sending a replication request to the domain controller MB-DC1.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
