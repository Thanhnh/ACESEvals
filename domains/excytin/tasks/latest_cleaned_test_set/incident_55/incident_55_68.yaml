tasks:
- task_id: incident_55_latest_cleaned_test_set_task_68
  title: incident_55_latest_cleaned_test_set_task_68
  description: 'Following this chain of activity, an alert was raised for a suspected AD FS DKM key read of the ADFS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2. Which host performed that DKM key read?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an ADFS private key extraction attempt was detected on host `mb-adfs`, where the account `gsmith` (SID `S-2-5-21-571436798-3864380397-1837441745-3206`) ran a hidden, encoded PowerShell command via the process `iy2orr1e.rrg.exe` (PID 3116) that launched a suspicious LDAP query. This activity chain continued and later a suspected DCSync attack was reported, where Luciano Herrera (CIO) on MB-WINCLIENT sent a replication request to a domain controller.'
    question: 'Following this chain of activity, an alert was raised for a suspected AD FS DKM key read of the ADFS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2. Which host performed that DKM key read?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'MB-DC1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: 'An attacker launched a suspicious hidden PowerShell process `iy2orr1e.rrg.exe` with an encoded command (Process ID `3116`, created at `2024-07-02t09:48:23.9439954z`) that issued a suspicious LDAP query, indicating an ADFS private key extraction attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: 'The same process spawned `powershell.exe`, which ran a suspicious sequence of Windows exploration commands used to identify valuable assets and prepare for lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: 'The account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` used a known tool/technique to perform suspicious system hardware discovery on the compromised device.'
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: 'Using the stolen credentials, the user Luciano Herrera (CIO) on MB-WINCLIENT sent a directory replication request to the domain controller `MB-DC1`, indicating a suspected DCSync attack.'
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: 'Finally, a suspected AD FS DKM key read was observed on the host `MB-DC1`, where the DKM key of the ADFS object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2` was read.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
