tasks:
- task_id: incident_55_latest_cleaned_test_set_task_90
  title: incident_55_latest_cleaned_test_set_task_90
  description: 'About one second before the suspicious LDAP query alert, a related alert fired for suspicious access to the LSASS service on the same activity chain, which is typically used to extract clear-text credentials from memory. What is the name of the DLL file reported as an entity in that LSASS-related alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious LDAP query alert was raised at 2024-07-04 22:35:03 UTC, indicating potential reconnaissance activity against the domain controller. The activity was tied to the account `pwilson` (SID `S-1-5-21-551436448-9871687716-9837441745-1903`, AAD User ID `2de70991-2799-4a95-b734-8e3df3a50118`), which executed the script `ldaprequest.ps1` via the command line `"powershell.exe" c:\script\ldaprequest.ps1` with Process ID 11116, created at 2024-07-02T09:47:42.68Z.'
    question: 'About one second before the suspicious LDAP query alert, a related alert fired for suspicious access to the LSASS service on the same activity chain, which is typically used to extract clear-text credentials from memory. What is the name of the DLL file reported as an entity in that LSASS-related alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'cryptdll.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'cryptdll.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious LDAP query indicating reconnaissance activity was executed from the device with IP address `72.5.72.208`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On the same device, suspicious access to the LSASS service was detected, involving the file `cryptdll.dll`, which is commonly loaded by credential dumping tools to decrypt clear-text passwords from LSASS memory.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
