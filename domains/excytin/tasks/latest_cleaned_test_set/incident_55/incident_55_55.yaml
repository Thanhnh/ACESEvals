tasks:
- task_id: incident_55_latest_cleaned_test_set_task_55
  title: incident_55_latest_cleaned_test_set_task_55
  description: 'Later in this same incident, an alert fired for emails containing a malicious URL that were delivered and then removed after delivery. What is the email address of the account associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a "Suspicious Task Scheduler activity" alert was raised on host `mb-adfs`. A process that had been involved in earlier malicious activity used `schtasks.exe` (PID 4304) to create the scheduled task `run-exportadfstokensignincert.2024-07-02_09_48_23` with the credentials of `niseko\adfsadmin`, and then ran it via `schtasks.exe /run /tn run-exportadfstokensignincert.2024-07-02_09_48_23` (PID 6892). Related PowerShell activity with encoded commands (PID 6808) was also observed. This chain later tied into credential theft activity against LSASS and, further along, to email-based threats in the same incident.'
    question: 'Later in this same incident, an alert fired for emails containing a malicious URL that were delivered and then removed after delivery. What is the email address of the account associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A process used Task Scheduler via `powershell.exe` to create, modify, or delete a scheduled task, establishing persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` was involved in a sensitive credential memory read, where lsass.exe memory was scanned or dumped to extract credentials.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The email account `bjenkins@niseko.alpineskihouse.co` received email messages containing a malicious URL that were removed after delivery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
