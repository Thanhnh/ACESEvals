tasks:
- task_id: incident_55_latest_cleaned_test_set_task_61
  title: incident_55_latest_cleaned_test_set_task_61
  description: 'For the earlier ADFS private key extraction attempt alert on 2024-07-04, what was the process ID and creation time (UTC) of the process that triggered it?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert titled "Attempt to hide use of dual-purpose tool" was raised on 2024-07-06, where a known public tool was observed running under an unexpected filename `iy2orr1e.rrg.exe` with the command line `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=` under process ID 5752. Investigation shows this same renamed tool was also involved earlier, on 2024-07-04, in an alert for an ADFS private key extraction attempt, where a suspicious LDAP query was launched that may indicate attackers trying to steal Active Directory Federation Service private keys or move laterally.'
    question: 'For the earlier ADFS private key extraction attempt alert on 2024-07-04, what was the process ID and creation time (UTC) of the process that triggered it?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
