tasks:
- task_id: incident_55_latest_cleaned_test_set_task_43
  title: incident_55_latest_cleaned_test_set_task_43
  description: 'On which machine was the dual-purpose tool observed running under an unexpected filename?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised indicating a suspected AD FS DKM key read, where the user account `gsmith@niseko.alpineskihouse.co` read the DKM key of an AD FS object (id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2). This activity is linked to earlier suspicious activity in the same incident, where a known public dual-purpose tool was observed running under an unexpected filename, likely an attempt to hide its malicious use.'
    question: 'On which machine was the dual-purpose tool observed running under an unexpected filename?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The host `mb-adfs`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The host `mb-adfs`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with AadUserId `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5` (gsmith) was detected reading the AD FS DKM key of the AD FS object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Related to this AD FS credential theft activity, a known dual-purpose public tool was observed running under an unexpected filename, an attempt to hide its malicious usage, on the host with HostName `mb-adfs`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
