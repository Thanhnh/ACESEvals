tasks:
- task_id: incident_55_latest_cleaned_test_set_task_72
  title: incident_55_latest_cleaned_test_set_task_72
  description: 'For the related alert about email messages containing the malicious URL that were removed after delivery, which user account (email address) was the recipient?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a security incident, an alert titled "Malicious URL was clicked on that device" was raised on 2024-07-10 for the host `mb-winclient` (AadDeviceId `7661dfd4-218f-4016-8a87-66d68a7f098e`), indicating a user on that endpoint clicked a malicious link. A day earlier, on 2024-07-09, a related alert reported that emails containing the same malicious URL were delivered to a mailbox and later removed (zapped) from it.'
    question: 'For the related alert about email messages containing the malicious URL that were removed after delivery, which user account (email address) was the recipient?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was clicked on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The email account `bjenkins@niseko.alpineskihouse.co` received the email message containing that malicious URL, which was removed after delivery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
