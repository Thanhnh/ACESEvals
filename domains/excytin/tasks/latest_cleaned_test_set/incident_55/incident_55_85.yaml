tasks:
- task_id: incident_55_latest_cleaned_test_set_task_85
  title: incident_55_latest_cleaned_test_set_task_85
  description: 'For that alert about the emails with a malicious URL that were removed after delivery, which mailbox address received the message?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert fired on host `mb-adfs` for a renamed system executable being launched: the process `iy2orr1e.rrg.exe` (PID 3116) ran with `-windowstyle hidden -encodedcommand ...` under the `SYSTEM` account (SID S-2-2-78), following a `powershell.exe` process (PID 6808) also launched with an encoded command. This activity chain later led to process injection and an internal phishing campaign sent from the compromised device, and eventually to an alert titled "Email messages containing malicious URL removed after delivery" (ZAP), where emails carrying a malicious URL were delivered and subsequently removed.'
    question: 'For that alert about the emails with a malicious URL that were removed after delivery, which mailbox address received the message?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'santiago@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'santiago@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A renamed Windows system executable, originally `powershell.exe`, was launched on the device to evade behavior-based detections.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The renamed process injected potentially malicious code into another process under the user account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`, indicating the account was compromised.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The compromised user account with AadUserId `28058d92-fc24-4869-9231-6546a34b00f2` was then used to launch an internal phishing campaign, sending phishing emails from this device to recipients inside the organization.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'One of the phishing emails containing a malicious URL was delivered to the mailbox of recipient `santiago@vnevado.alpineskihouse.co` and later removed.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
