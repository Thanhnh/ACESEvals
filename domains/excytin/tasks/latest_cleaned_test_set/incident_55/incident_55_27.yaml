tasks:
- task_id: incident_55_latest_cleaned_test_set_task_27
  title: incident_55_latest_cleaned_test_set_task_27
  description: 'Pivoting from the compromised user identity involved in this email alert, a related alert shows a malicious PowerShell Cmdlet — potentially tied to credential theft, exploitation, network reconnaissance or code injection — was invoked on a machine. What is the account name under which that PowerShell Cmdlet was invoked?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an email containing a malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was delivered to the mailbox `bjenkins@niseko.alpineskihouse.co` (Lucas Grey) from sender `santiago@vnevado.alpineskihouse.co` with sender IP `119.36.50.193`, and was later removed after delivery.'
    question: 'Pivoting from the compromised user identity involved in this email alert, a related alert shows a malicious PowerShell Cmdlet — potentially tied to credential theft, exploitation, network reconnaissance or code injection — was invoked on a machine. What is the account name under which that PowerShell Cmdlet was invoked?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'pwilson'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'pwilson'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` received email messages containing a malicious URL, which were later removed after delivery.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that, a malicious PowerShell Cmdlet — potentially associated with credential theft, exploitation, network reconnaissance, or code injection — was invoked on the machine under the account named `pwilson`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
