tasks:
- task_id: incident_55_latest_cleaned_test_set_task_71
  title: incident_55_latest_cleaned_test_set_task_71
  description: 'For the suspicious service creation on `MB-ADFS`, what is the email address of the account that created the service `DDLOXJDSQSNGMUKKFUXQ`?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we detected that a user named `Lucas Grey` (email `bjenkins@niseko.alpineskihouse.co`) clicked on a potentially malicious URL `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` delivered to his mailbox. Following this initial access, the attack chain progressed through process injection and a suspicious sequence of exploration activities on the compromised environment, eventually leading to a suspicious service creation alert where a service named `DDLOXJDSQSNGMUKKFUXQ` was created on the host `MB-ADFS` to execute potentially malicious commands.'
    question: 'For the suspicious service creation on `MB-ADFS`, what is the email address of the account that created the service `DDLOXJDSQSNGMUKKFUXQ`?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A user with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` clicked on a potentially malicious URL.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The process `powershell.exe` was injected with potentially malicious code, allowing the attacker to hide malicious execution within a trusted process.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` ran a suspicious sequence of windows exploration commands to discover assets and prepare for lateral movement.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The account with email `gsmith@niseko.alpineskihouse.co` created a suspicious service `DDLOXJDSQSNGMUKKFUXQ` on host MB-ADFS to execute potentially malicious commands.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
