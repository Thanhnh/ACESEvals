tasks:
- task_id: incident_55_latest_cleaned_test_set_task_39
  title: incident_55_latest_cleaned_test_set_task_39
  description: 'Following this activity, a later alert flagged an unusual addition of a Password-type credential to the OAuth application ''SimulandApp'' by the account `pwilson`. What is the display name (full name) of that user account as reported in the alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, a Suspicious System Hardware Discovery alert fired on host `mb-winclient`, where known reconnaissance tooling was used to gather information about the device. The activity involved processes such as `svchost.exe` (PID 2880, command line `svchost.exe -k netsvcs -p -s winmgmt`) and PowerShell executions including `"powershell.exe" c:\script\contosoadfsblatempcreds.ps1` (PID 13968) and `"powershell.exe" -noexit -command set-location -literalpath ''c:\users\bjenkins\downloads\midnight14''` (PID 12412), with accounts `bjenkins` and `pwilson` (AAD user ID a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0) and IP address 72.5.72.208 observed.'
    question: 'Following this activity, a later alert flagged an unusual addition of a Password-type credential to the OAuth application ''SimulandApp'' by the account `pwilson`. What is the display name (full name) of that user account as reported in the alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A known hardware discovery tool was used on the device by the account with SID `S-1-5-21-551436448-9871687716-9837441745-1903`, indicating reconnaissance activity.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account `Luciano Herrera` (pwilson@niseko.alpineskihouse.co) then performed an unusual addition of a Password-type credential to the OAuth application SimulandApp, which may be used to spread phishing, exfiltrate data, or gain access to other accounts and devices.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
