    incident_context: 'In this incident, an alert was raised stating that the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application SimulandApp (OAuth App ID `4d9476b8-6ae6-459b-a273-5837c15b5981`), from IP address `36.193.21.220` and involving the Office 365 / Microsoft 365 cloud application (App ID 11161). This activity pattern may indicate that an attacker has compromised the app and is using it to spread phishing, exfiltrate data, or gain access to other accounts and devices. Pivoting on the compromised user''s Entra ID (AAD) user ID leads to a device where a process was injected with potentially malicious code, and on that same device a later alert fired for a malicious link being opened.'
    question: 'For the related alert ''Malicious URL was clicked on that device'' that occurred on the same host, what was the full malicious URL that was clicked?'
