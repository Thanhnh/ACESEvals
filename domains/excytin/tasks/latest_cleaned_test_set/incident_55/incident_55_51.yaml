tasks:
- task_id: incident_55_latest_cleaned_test_set_task_51
  title: incident_55_latest_cleaned_test_set_task_51
  description: 'For the ''Sensitive credential memory read'' alert involving lsass.exe memory access, what is the security identifier (SID) of the account associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage attack, an ''ADFS private key extraction attempt'' alert was raised on host `mb-adfs`, where account `gsmith` (SID `S-2-5-21-571436798-3864380397-1837441745-3206`) launched a suspicious LDAP query. The activity involved a hidden PowerShell process `iy2orr1e.rrg.exe` running an encoded command (process ID 3116 created at 2024-07-02T09:48:23Z and again as process ID 8764 on 2024-07-04). Follow-on alerts show hands-on-keyboard activity via the Impacket toolkit and, moments later, a process scanning or dumping memory from the Local Security Authority Subsystem Service (lsass.exe) to extract authentication hashes or passwords.'
    question: 'For the ''Sensitive credential memory read'' alert involving lsass.exe memory access, what is the security identifier (SID) of the account associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-561436748-3867387497-1732241745-3701'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-561436748-3867387497-1732241745-3701'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An ADFS private key extraction attempt was detected via a suspicious LDAP query performed by the account with AadUserId `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'An ongoing hands-on-keyboard attack via the Impacket toolkit was observed on the device, involving the process with extracted file name `lsass.exe`.'
      checkpoint_3:
