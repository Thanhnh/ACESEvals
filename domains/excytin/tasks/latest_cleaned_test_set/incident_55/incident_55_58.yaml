tasks:
- task_id: incident_55_latest_cleaned_test_set_task_58
  title: incident_55_latest_cleaned_test_set_task_58
  description: 'For the ''Sensitive credential memory read'' alert, which user account was associated with the process that accessed lsass.exe memory?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled ''Attempt to hide use of dual-purpose tool'' was raised after a known public tool was observed running under an unexpected filename: process ID 5752, created at 2024-07-06T00:00:01.7155092Z, with command line `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`. Following the chain of related alerts on the same host, an earlier alert flagged a suspicious sequence of exploration commands, which then led to an alert for ''Sensitive credential memory read'', where a process scanned or dumped memory from the Local Security Authority Subsystem Service (lsass.exe) to extract authentication hashes or passwords.'
    question: 'For the ''Sensitive credential memory read'' alert, which user account was associated with the process that accessed lsass.exe memory?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A known dual-purpose tool was renamed to an unexpected filename on host `mb-adfs`, indicating an attempt to hide its malicious use.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On that host, a suspicious sequence of exploration/discovery commands was executed by the process `powershell.exe`, used to identify valuable assets and prepare for lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker then dumped memory from lsass.exe to steal credentials, compromising the account `bjenkins`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
