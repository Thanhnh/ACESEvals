tasks:
- task_id: incident_55_latest_cleaned_test_set_task_81
  title: incident_55_latest_cleaned_test_set_task_81
  description: 'What is the email address of the user account that created the suspicious service on MB-ADFS?'
  inherit_shared: true
  initial_context:
    incident_context: 'In this incident, an email from sender `santiago@vnevado.alpineskihouse.co` (sender IP `119.36.50.193`) containing the malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was delivered to the mailbox of Lucas Grey (`bjenkins@niseko.alpineskihouse.co`) and later removed. Follow-on activity linked to this incident included suspicious access to the LSASS service and an ongoing hands-on-keyboard attack using the Impacket toolkit, and finally a suspicious service named DDLOXJDSQSNGMUKKFUXQ was created on the host MB-ADFS to execute potentially malicious commands.'
    question: 'What is the email address of the user account that created the suspicious service on MB-ADFS?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A user with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` received an email containing a malicious URL, which was later removed after delivery.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The process `powershell.exe` was then used to suspiciously access the LSASS service in an attempt to dump credentials from memory.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Using the stolen credentials, the account with AadUserId `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5` conducted an ongoing hands-on-keyboard attack via the Impacket toolkit to move laterally across the network.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The account `gsmith@niseko.alpineskihouse.co` created the suspicious service `DDLOXJDSQSNGMUKKFUXQ` on the device MB-ADFS to execute potentially malicious commands.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
