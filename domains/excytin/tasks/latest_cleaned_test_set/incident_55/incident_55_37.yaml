tasks:
- task_id: incident_55_latest_cleaned_test_set_task_37
  title: incident_55_latest_cleaned_test_set_task_37
  description: 'Shortly before this exploration activity, a related alert fired for a malicious PowerShell Cmdlet being invoked on the machine — such Cmdlets are often tied to credential theft, exploitation, network reconnaissance or code injection. What is the name of the user account associated with that malicious PowerShell Cmdlet alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Suspicious sequence of exploration activities" was raised on 2024-07-04, indicating that a process invoked a set of Windows commands (including `whoami.exe`, launched under process IDs 8056, 1120 and 3468) typically used by attackers to identify assets of value and coordinate lateral movement. The activity involved a hidden, base64/encoded-command process `iy2orr1e.rrg.exe` and `powershell.exe`, and was associated with the user account `gsmith` (SID S-2-5-21-571436798-3864380397-1837441745-3206).'
    question: 'Shortly before this exploration activity, a related alert fired for a malicious PowerShell Cmdlet being invoked on the machine — such Cmdlets are often tied to credential theft, exploitation, network reconnaissance or code injection. What is the name of the user account associated with that malicious PowerShell Cmdlet alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'pwilson'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'pwilson'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process invoked a suspicious sequence of exploration commands using `powershell.exe`, indicating reconnaissance activity to identify valuable assets and prepare for lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The malicious PowerShell Cmdlet associated with credential theft, reconnaissance, or code injection was invoked on the machine under the user account `pwilson`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
