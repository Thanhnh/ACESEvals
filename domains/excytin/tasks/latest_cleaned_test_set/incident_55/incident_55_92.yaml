tasks:
- task_id: incident_55_latest_cleaned_test_set_task_92
  title: incident_55_latest_cleaned_test_set_task_92
  description: 'Roughly a second later, a related alert flagged suspicious Task Scheduler activity where a process previously involved in malicious activity created, modified, or deleted a scheduled task for persistence. What is the name of the executable file associated with that process?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an ongoing hands-on-keyboard attack via the Impacket toolkit was detected on a device. Impacket connects to other hosts to explore network shares and execute commands, and attackers often use it to move laterally before deploying ransomware or other payloads. The activity was associated with the accounts `LocalSystem` and `gsmith` (SID `S-2-5-21-571436798-3864380397-1837441745-3206`, AAD user ID `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`), files such as `powershell.exe` and `%comspec%`, and access to the process `lsass.exe` (PID 780, created 2024-06-20T08:30:13.8583828Z).'
    question: 'Roughly a second later, a related alert flagged suspicious Task Scheduler activity where a process previously involved in malicious activity created, modified, or deleted a scheduled task for persistence. What is the name of the executable file associated with that process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'iy2orr1e.rrg.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'iy2orr1e.rrg.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An ongoing hands-on-keyboard attack via the Impacket toolkit was detected on the host `mb-adfs`, where the attacker executed remote commands to explore network shares and move laterally.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same host, the attacker abused Task Scheduler to create, modify, or delete a scheduled task for persistence, launching the suspicious process with file name `iy2orr1e.rrg.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
