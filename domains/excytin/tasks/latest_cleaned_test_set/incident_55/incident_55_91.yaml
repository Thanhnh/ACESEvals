tasks:
- task_id: incident_55_latest_cleaned_test_set_task_91
  title: incident_55_latest_cleaned_test_set_task_91
  description: 'Seconds after this Impacket activity, a related alert fired for a renamed Windows system executable being launched. What is the security identifier (SID) of the account tied to that renamed-executable alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a hands-on-keyboard attack, a suspicious command execution via the Impacket toolkit was observed on a device on 2024-07-04. Impacket connects to other hosts to explore network shares and execute commands, and attackers often use it to move laterally before deploying ransomware or other payloads. The activity involved accounts such as `gsmith` (SID `S-2-5-21-571436798-3864380397-1837441745-3206`, AAD user ID `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`) and `LocalSystem`, along with files `powershell.exe` and `%comspec%`, and the process `lsass.exe` (Process ID 780, created 2024-06-20T08:30:13.8583828Z).'
    question: 'Seconds after this Impacket activity, a related alert fired for a renamed Windows system executable being launched. What is the security identifier (SID) of the account tied to that renamed-executable alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-2-78'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-2-78'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An Impacket-based hands-on-keyboard attack was detected on the device, where the process with Process ID `6808` executed the command line `powershell.exe -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcafiazqbuageabqblafaabwb3aguacgbzaggazqbsagwalgbwahmamqa=` at `2024-07-02t09:48:12.7628138z`, decoding to the renaming/execution of a PowerShell script (`C:\Scripts\RenamePowerShell.ps1`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following this, a renamed Windows system executable was launched on the same device to evade path- and name-based detections, and this activity was performed under the user account with SID `S-2-2-78`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
