tasks:
- task_id: incident_55_latest_cleaned_test_set_task_40
  title: incident_55_latest_cleaned_test_set_task_40
  description: 'Shortly before this exploration activity, another alert on the same host flagged suspicious access to the LSASS service for credential theft. Which library (DLL) file was reported as an entity in that LSASS credential access alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a "Suspicious sequence of exploration activities" alert fired on host `mb-adfs` for account `gsmith` (SID S-2-5-21-571436798-3864380397-1837441745-3206). A hidden PowerShell process `iy2orr1e.rrg.exe` (PID 3116) launched with an encoded command and spawned reconnaissance commands such as `whoami.exe` (PIDs 1120 and 8056), which attackers commonly use to identify valuable assets and plan lateral movement.'
    question: 'Shortly before this exploration activity, another alert on the same host flagged suspicious access to the LSASS service for credential theft. Which library (DLL) file was reported as an entity in that LSASS credential access alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'cryptdll.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'cryptdll.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process launched `powershell.exe` (ExtractedFileName: `powershell.exe`) to run a suspicious sequence of Windows exploration commands used to identify valuable assets and plan lateral movement at 2024-07-04 22:35:03 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same activity involved suspicious access to the LSASS service, loading the credential-dumping related file `cryptdll.dll` (Name: `cryptdll.dll`) to decrypt clear-text passwords from LSASS memory at 2024-07-04 22:35:02 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
