tasks:
- task_id: incident_55_latest_cleaned_test_set_task_35
  title: incident_55_latest_cleaned_test_set_task_35
  description: 'Following this activity chain on the same device, a ''Malicious URL was clicked on that device'' alert was triggered. What was the full malicious URL that was clicked?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious service registration alert was raised when a system program was registered as a service, indicating possible intent to establish persistence or gain system privileges. The process involved was `services.exe` (Process ID 764, created 2024-06-20T08:30:13.7925191Z). Follow-on activity on the same device included an ongoing hands-on-keyboard attack via the Impacket toolkit and the invocation of a malicious PowerShell cmdlet. Later, a user on that same device clicked a malicious URL.'
    question: 'Following this activity chain on the same device, a ''Malicious URL was clicked on that device'' alert was triggered. What was the full malicious URL that was clicked?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A system program was registered as a service on host `mb-adfs`, indicating an attempt to establish persistence or gain system privileges.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'An ongoing hands-on-keyboard attack via the Impacket toolkit was observed, executing the process `powershell.exe` to move laterally across the network.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'A malicious PowerShell Cmdlet was invoked on the device with AadDeviceId `7661dfd4-218f-4016-8a87-66d68a7f098e`, possibly for credential theft, network reconnaissance, or code injection.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'A malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was clicked on that device.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
