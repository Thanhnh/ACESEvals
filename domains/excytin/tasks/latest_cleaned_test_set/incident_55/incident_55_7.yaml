tasks:
- task_id: incident_55_latest_cleaned_test_set_task_7
  title: incident_55_latest_cleaned_test_set_task_7
  description: 'What was the full malicious URL that was clicked on that device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired indicating that a process was injected with potentially malicious code, hiding malicious execution inside a trusted process. The alert involved `powershell.exe` running the command line `"powershell.exe" -noexit -command set-location -literalpath ''c:\users\bjenkins\downloads\midnight14''` (Process ID 12412), a script named `contosoadfsblatempcreds.ps1`, the IP address `72.5.72.208`, and accounts including `pwilson`. A few days later, on the same device, another alert was raised reporting that a malicious URL was clicked.'
    question: 'What was the full malicious URL that was clicked on that device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process on the host `mb-winclient` was injected with potentially malicious code, indicating suspicious code running within a trusted process memory.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From that same device, a malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was clicked, likely leading to command and control communication.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
