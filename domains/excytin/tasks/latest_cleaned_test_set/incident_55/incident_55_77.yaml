tasks:
- task_id: incident_55_latest_cleaned_test_set_task_77
  title: incident_55_latest_cleaned_test_set_task_77
  description: 'A few days later, an ''Internal phishing campaign'' alert was triggered from this same device, indicating that a possibly compromised account sent phishing emails to internal recipients. What is the email address of the account that sent those phishing emails?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Suspicious access to LSASS service'' alert was raised on host `mb-winclient` (AAD Device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`), where the lsass.exe process (PID 760) was accessed and DLLs such as `cryptdll.dll`, `winscard.dll` and `hid.dll` were involved. A PowerShell process (PID 12412) was also launched from the folder `c:\users\bjenkins\downloads\midnight14`, and traffic was seen to IP `72.5.72.208`. Attackers typically perform this activity to decrypt clear-text credentials from LSASS memory and then use them for lateral movement.'
    question: 'A few days later, an ''Internal phishing campaign'' alert was triggered from this same device, indicating that a possibly compromised account sent phishing emails to internal recipients. What is the email address of the account that sent those phishing emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` was involved in suspicious access to the LSASS service, indicating credential theft for later lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the compromised account with email `bjenkins@niseko.alpineskihouse.co` was observed sending internal phishing emails to recipients inside the organization.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
