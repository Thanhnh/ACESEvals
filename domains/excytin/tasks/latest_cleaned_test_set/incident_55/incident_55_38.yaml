tasks:
- task_id: incident_55_latest_cleaned_test_set_task_38
  title: incident_55_latest_cleaned_test_set_task_38
  description: 'In the suspected DCSync (directory services replication) alert, which user account was identified as issuing the replication request from MB-WINCLIENT to MB-DC1?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, an internal phishing campaign alert was raised after a user was observed sending phishing email from a device to recipients inside the organization, suggesting an account had been compromised for lateral movement. The alert involved accounts such as `Nina Sullivan` (santiago@vnevado.alpineskihouse.co, SID S-1-5-11-7842151660-4834030208-105586563-1139) and `Lucas Grey` (bjenkins@niseko.alpineskihouse.co), along with the malicious URL `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`. Pivoting through the shared account identifiers, this activity chains to a suspicious system hardware discovery alert on a device and ultimately to a suspected DCSync attack, where a replication request was sent from MB-WINCLIENT to the domain controller MB-DC1.'
    question: 'In the suspected DCSync (directory services replication) alert, which user account was identified as issuing the replication request from MB-WINCLIENT to MB-DC1?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera (the CIO account)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera (the CIO account)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A compromised user account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` was observed sending an internal phishing campaign email to recipients inside the organization.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A user account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` ran a known tool or technique to perform suspicious system hardware discovery on the device.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The account `Luciano Herrera` (CIO) on MB-WINCLIENT then sent a replication request to MB-DC1, indicating a suspected DCSync attack (replication of directory services).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
