tasks:
- task_id: incident_55_latest_cleaned_test_set_task_73
  title: incident_55_latest_cleaned_test_set_task_73
  description: 'For the follow-up alert about the potentially malicious URL click detected on 2024-07-10, what exact URL was clicked, and how does it differ from the link seen in the removed email messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired for ''Email messages containing malicious URL removed after delivery'' — emails sent from `santiago@vnevado.alpineskihouse.co` (sender IP `119.36.50.193`) containing the malicious link `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` were delivered to recipient mailboxes and later removed on 2024-07-09. The following day, a related alert indicated that one of the recipients actually clicked on a malicious link.'
    question: 'For the follow-up alert about the potentially malicious URL click detected on 2024-07-10, what exact URL was clicked, and how does it differ from the link seen in the removed email messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The clicked URL was `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` — the same host as in the removed emails, but accessed over HTTP instead of HTTPS.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The clicked URL was `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` — the same host as in the removed emails, but accessed over HTTP instead of HTTPS.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The mailbox `bjenkins@niseko.alpineskihouse.co` received email messages containing a malicious URL, which were later removed after delivery at 2024-07-09 11:49:57 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The user then clicked on the potentially malicious URL `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` at 2024-07-10 11:24:45 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
