  description: 'For the ADFS private key extraction attempt alert at the end of this activity chain, what is the Microsoft Entra ID (AAD) user ID of the account associated with it?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a phishing email from sender `santiago@vnevado.alpineskihouse.co` (sender IP `119.36.50.193`) containing the malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was delivered to the mailbox of Lucas Grey (`bjenkins@niseko.alpineskihouse.co`) and later removed. Following the trail from this compromised account, the activity chain led through a malicious PowerShell Cmdlet invocation and suspicious remote activity on a machine, ending with an alert for a suspicious LDAP query indicating a possible Active Directory Federation Service (ADFS) private key extraction attempt.'
    question: 'For the ADFS private key extraction attempt alert at the end of this activity chain, what is the Microsoft Entra ID (AAD) user ID of the account associated with it?'
