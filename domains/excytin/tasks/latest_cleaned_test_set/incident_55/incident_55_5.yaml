tasks:
- task_id: incident_55_latest_cleaned_test_set_task_5
  title: incident_55_latest_cleaned_test_set_task_5
  description: 'Which user account was associated with the follow-up ''Sensitive credential memory read'' alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a credential theft incident, an alert for ''Suspicious access to LSASS service'' was raised, where a process loaded credential-related libraries such as `cryptdll.dll`, `hid.dll`, `winscard.dll`, and `vaultcli.dll` in an attempt to decrypt user passwords from LSASS memory. Shortly afterwards, a related alert titled ''Sensitive credential memory read'' was triggered, indicating a process scanned or dumped memory from lsass.exe to extract authentication hashes or passwords.'
    question: 'Which user account was associated with the follow-up ''Sensitive credential memory read'' alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious access to the LSASS service was detected under the account `bjenkins`, indicating an attempt to decrypt and obtain clear-text credentials from LSASS memory.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that, a sensitive credential memory read was detected for the same account `bjenkins`, where a process scanned or dumped memory from lsass.exe to extract authentication hashes or passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
