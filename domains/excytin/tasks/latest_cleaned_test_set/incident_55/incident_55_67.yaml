tasks:
- task_id: incident_55_latest_cleaned_test_set_task_67
  title: incident_55_latest_cleaned_test_set_task_67
  description: 'For that unusual OAuth credential addition activity, what is the application ID (OAuthAppId) of the affected application?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert for ''Sensitive credential memory read'' was raised after a process scanned or dumped memory from the Local Security Authority Subsystem Service (`lsass.exe`, Process ID 760, created 2024-07-02T07:28:35.8580921Z). Accessing this process memory allows an attacker to extract secrets such as authentication hashes or passwords that can later be used elsewhere in the environment. Later in the same incident chain, the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the application ''SimulandApp'', which may indicate the app was compromised for phishing, data exfiltration, or gaining access to other accounts and devices.'
    question: 'For that unusual OAuth credential addition activity, what is the application ID (OAuthAppId) of the affected application?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '4d9476b8-6ae6-459b-a273-5837c15b5981'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '4d9476b8-6ae6-459b-a273-5837c15b5981'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The process `powershell.exe` was used to scan or dump memory from the Local Security Authority Subsystem Service (lsass.exe) to extract sensitive credentials, detected at 2024-07-04 22:35:04 UTC.'
      checkpoint_2:
