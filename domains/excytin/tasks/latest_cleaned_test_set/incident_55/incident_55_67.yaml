        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` performed suspicious system hardware discovery on the device, gathering information for later attacks, at 2024-07-04 22:35:00 UTC.'
      checkpoint_3:
