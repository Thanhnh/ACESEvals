tasks:
- task_id: incident_55_latest_cleaned_test_set_task_54
  title: incident_55_latest_cleaned_test_set_task_54
  description: 'For the related alert about the malicious PowerShell Cmdlet being invoked, which user account was involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious LDAP query was detected indicating potential reconnaissance activity, where the script `ldaprequest.ps1` was executed via the command line `"powershell.exe" c:\script\ldaprequest.ps1` under process ID 11116 on 2024-07-02. LDAP queries are often used by attackers to learn the organization''s structure by querying the domain controller for administrative users, groups and interesting assets. This activity is linked through a shared IP address to another alert raised at nearly the same time, where a malicious PowerShell Cmdlet associated with credential theft, exploitation, network reconnaissance or code injection was invoked on the machine.'
    question: 'For the related alert about the malicious PowerShell Cmdlet being invoked, which user account was involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious LDAP query was executed from the IP address `72.5.72.208`, indicating potential reconnaissance activity against the domain controller.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the reconnaissance, a malicious PowerShell Cmdlet associated with credential theft or network reconnaissance was invoked on the machine by the account `bjenkins`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
