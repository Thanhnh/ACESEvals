tasks:
- task_id: incident_55_latest_cleaned_test_set_task_46
  title: incident_55_latest_cleaned_test_set_task_46
  description: 'Which host performed the suspected AD FS DKM key read?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage incident, an alert was raised on host `mb-winclient` (AAD device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`) where a process was injected with potentially malicious code. Related activity on that host included `powershell.exe` (PID 12412) setting its location to `c:\users\bjenkins\downloads\midnight14`, and `powershell.exe` (PID 13968) executing the script `c:\script\contosoadfsblatempcreds.ps1`, with accounts such as `bjenkins` and `pwilson` involved. Following this activity, a suspected DCSync attack (replication of directory services) was observed, and later an alert fired for a suspected AD FS DKM key read of the AD FS object with id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`.'
    question: 'Which host performed the suspected AD FS DKM key read?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'MB-DC1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A process was injected with potentially malicious code under the user account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account (Luciano Herrera, CIO) on MB-WINCLIENT sent a replication request to the domain controller host `MB-DC1`, indicating a suspected DCSync attack.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The host `MB-DC1` read the AD FS DKM key of the ADFS object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`, indicating a suspected AD FS DKM key read.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
