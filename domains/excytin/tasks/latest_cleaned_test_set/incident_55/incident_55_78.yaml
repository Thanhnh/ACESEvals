  title: incident_55_latest_cleaned_test_set_task_78
  description: 'For the `Attempt to hide use of dual-purpose tool` alert, what was the disguised executable''s filename, its process ID, and the command line it ran with?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, an alert for `Suspicious access to LSASS service` fired on host `mb-winclient` (AAD device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`) involving the account `bjenkins` (SID `S-1-5-21-561436748-3867387497-1732241745-3701`), the IP `72.5.72.208`, the LSASS process (PID 760) and DLLs such as `cryptdll.dll`, `hid.dll` and `winscard.dll`. A related PowerShell process (PID 12412) was also launched from `c:\users\bjenkins\downloads\midnight14`. The attack chain continued with Impacket-based hands-on-keyboard activity and, later, an alert titled `Attempt to hide use of dual-purpose tool`, where a known public tool was seen running under an unexpected filename.'
    question: 'For the `Attempt to hide use of dual-purpose tool` alert, what was the disguised executable''s filename, its process ID, and the command line it ran with?'
