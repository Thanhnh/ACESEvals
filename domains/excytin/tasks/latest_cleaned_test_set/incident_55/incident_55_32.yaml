tasks:
- task_id: incident_55_latest_cleaned_test_set_task_32
  title: incident_55_latest_cleaned_test_set_task_32
  description: 'For the suspicious service creation alert involving the service `DDLOXJDSQSNGMUKKFUXQ` on `MB-ADFS`, what is the full email address (UPN) of the account that created that service?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident in the niseko.alpineskihouse.co tenant, an alert was raised for an unusual addition of credentials to an OAuth app: the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) added a Password-type credential to the application SimulandApp (OAuth App ID `4d9476b8-6ae6-459b-a273-5837c15b5981`, Object ID `a66a4b44-d1f7-4563-95bf-a89d1b05b325`) within the Office 365 / Microsoft 365 cloud application (App ID 11161), from IP address `36.193.21.220`. This pattern may indicate an attacker compromised the app to spread phishing, exfiltrate data, or gain access to other accounts and devices. Related alerts in the same incident include a suspicious sequence of exploration activities and suspicious remote activity, which chain to a later alert where a service named `DDLOXJDSQSNGMUKKFUXQ` was created on the host `MB-ADFS` to execute potentially malicious commands.'
    question: 'For the suspicious service creation alert involving the service `DDLOXJDSQSNGMUKKFUXQ` on `MB-ADFS`, what is the full email address (UPN) of the account that created that service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` (Luciano Herrera, pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application SimulandApp.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The process `powershell.exe` was used to run a suspicious sequence of Windows exploration commands to discover valuable assets and prepare for lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The account with AadUserId `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5` was involved in suspicious remotely initiated activity on the machine.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The account with email `gsmith@niseko.alpineskihouse.co` created the suspicious service `DDLOXJDSQSNGMUKKFUXQ` to execute potentially malicious commands on the host MB-ADFS.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
