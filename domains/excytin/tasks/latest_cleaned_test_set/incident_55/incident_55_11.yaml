tasks:
- task_id: incident_55_latest_cleaned_test_set_task_11
  title: incident_55_latest_cleaned_test_set_task_11
  description: 'For the follow-up alert about the suspicious sequence of exploration activities, which user account security identifier (SID) was observed running those discovery commands?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a "Suspicious Task Scheduler activity" alert fired on host `mb-adfs`, where a process previously involved in malicious activity used `schtasks.exe` to create and run a scheduled task named `run-exportadfstokensignincert.2024-07-02_09_48_23`, executing `iy2orr1e.rrg.exe` with a hidden window and a base64 encoded command, using the credentials of `niseko\adfsadmin`. Shortly afterwards, another alert titled "Suspicious sequence of exploration activities" was raised, where a process ran a set of Windows commands typically used to identify valuable assets and prepare lateral movement.'
    question: 'For the follow-up alert about the suspicious sequence of exploration activities, which user account security identifier (SID) was observed running those discovery commands?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-551436448-9871687716-9837441745-1903'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-551436448-9871687716-9837441745-1903'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process involved in earlier malicious activity used Task Scheduler via `powershell.exe` to create, modify, or delete a scheduled task in order to launch malicious code automatically and establish persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the persistence attempt, a suspicious sequence of exploration activities (a set of Windows discovery commands) was executed under the user account with SID `S-1-5-21-551436448-9871687716-9837441745-1903`, likely to identify valuable assets and prepare for lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
