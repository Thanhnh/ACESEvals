tasks:
- task_id: incident_55_latest_cleaned_test_set_task_14
  title: incident_55_latest_cleaned_test_set_task_14
  description: 'In that related alert about the unusual credential addition to the OAuth app ''SimulandApp'', the activity was performed by the account with email `pwilson@niseko.alpineskihouse.co`. What is the display name of this user account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a multi-stage incident, an alert showed that a malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was clicked on a device. Pivoting from that device led to a ''Suspicious sequence of exploration activities'' alert, where a process ran a series of Windows discovery commands, and from the account SID involved there we reached a related identity alert about an unusual addition of a credential of type Password to the OAuth application ''SimulandApp''.'
    question: 'In that related alert about the unusual credential addition to the OAuth app ''SimulandApp'', the activity was performed by the account with email `pwilson@niseko.alpineskihouse.co`. What is the display name of this user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious URL was clicked on the device with HostName `mb-winclient`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` ran a suspicious sequence of exploration/discovery commands on that device, likely to identify valuable assets and plan lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The account `Luciano Herrera` (pwilson@niseko.alpineskihouse.co) then performed an unusual addition of a Password-type credential to the OAuth application `SimulandApp`, indicating the compromised account is being used to establish persistence and expand access.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
