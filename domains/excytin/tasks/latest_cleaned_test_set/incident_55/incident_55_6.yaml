tasks:
- task_id: incident_55_latest_cleaned_test_set_task_6
  title: incident_55_latest_cleaned_test_set_task_6
  description: 'For the alert about the suspicious LDAP query performed as part of this reconnaissance activity, what is the Azure AD (Entra ID) user ID of the account involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised indicating that the account `gsmith@niseko.alpineskihouse.co` read the DKM key of an AD FS object (id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2). Pivoting on the account''s SID, this activity is linked to a chain of reconnaissance behavior on the same machine, where a process invoked a series of Windows commands typically used to identify valuable assets and plan lateral movement, and ultimately to an alert about a suspicious LDAP query used to enumerate the domain controller for privileged users, groups and interesting assets.'
    question: 'For the alert about the suspicious LDAP query performed as part of this reconnaissance activity, what is the Azure AD (Entra ID) user ID of the account involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '2de70991-2799-4a95-b734-8e3df3a50118'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '2de70991-2799-4a95-b734-8e3df3a50118'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` (user gsmith) read the AD FS DKM key of the ADFS object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious sequence of exploration activities was performed via the process `powershell.exe`, which called a set of windows commands used to identify assets of value and coordinate lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` executed a suspicious LDAP query against the domain controller, indicating reconnaissance activity.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
