        title: Checkpoint 1
        description: 'A suspicious system hardware discovery activity was detected on the device with AadDeviceId `7661dfd4-218f-4016-8a87-66d68a7f098e`, where a known tool or technique was used to gather information about the device for later attacks.'
      checkpoint_2:
