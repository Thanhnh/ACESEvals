  initial_context:
    incident_context: 'During this multi-stage incident, a ''Suspicious System Hardware Discovery'' alert was raised on a device where PowerShell activity was observed under accounts such as `pwilson` (SID S-1-5-21-561436748-3867387497-1732241745-3701). The processes included `"powershell.exe" -noexit -command set-location -literalpath ''c:\users\bjenkins\downloads\midnight14''` (PID 12412) and `"powershell.exe" c:\script\contosoadfsblatempcreds.ps1` (PID 13968), along with `svchost.exe`, and network activity to IP `72.5.72.208`. This suggests attackers were gathering information about the target device or network for later attacks.'
    question: 'Pivoting from this device to the related alert reporting that a malicious URL was clicked on it, what is the full malicious URL that was clicked?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
