tasks:
- task_id: incident_55_latest_cleaned_test_set_task_9
  title: incident_55_latest_cleaned_test_set_task_9
  description: 'Earlier in this same incident chain, an alert fired for a process that was injected with potentially malicious code (code injected into another process to hide execution within a trusted process). Which user account name was associated with that process injection alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage intrusion, an alert was raised on the domain controller `MB-DC1` for a suspected AD FS DKM key read, where the host read the DKM key of the AD FS object with id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2. This activity is typically part of a broader attack chain that includes earlier endpoint compromise.'
    question: 'Earlier in this same incident chain, an alert fired for a process that was injected with potentially malicious code (code injected into another process to hide execution within a trusted process). Which user account name was associated with that process injection alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'pwilson'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'pwilson'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The host `MB-DC1` was observed reading the DKM key of the AD FS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2, indicating a suspected AD FS DKM key read.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` (Luciano Herrera, CIO) on MB-WINCLIENT sent a replication request to MB-DC1, indicating a suspected DCSync attack.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The account named `pwilson` was associated with a process that injected potentially malicious code into another process, hiding malicious execution within a trusted process.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
