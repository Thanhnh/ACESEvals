tasks:
- task_id: incident_55_latest_cleaned_test_set_task_19
  title: incident_55_latest_cleaned_test_set_task_19
  description: 'One of the related alerts in this incident concerns emails carrying a malicious URL that were delivered to mailboxes and later removed. From which source IP address were those malicious emails sent?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage intrusion, an alert for a "Suspicious sequence of exploration activities" was raised on host `mb-adfs` under the account `gsmith` (SID `S-2-5-21-571436798-3864380397-1837441745-3206`). The activity involved a hidden, encoded-command process `iy2orr1e.rrg.exe` (PID 3116) spawning reconnaissance commands such as `whoami.exe`, along with an encoded `powershell.exe` execution — commands attackers commonly use to identify valuable assets and prepare for lateral movement. This chain is linked to other alerts in the same incident, including credential access attempts against LSASS and email-based activity affecting the same user.'
    question: 'One of the related alerts in this incident concerns emails carrying a malicious URL that were delivered to mailboxes and later removed. From which source IP address were those malicious emails sent?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '119.36.50.193'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '119.36.50.193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A process launched `powershell.exe` to run a suspicious sequence of Windows exploration commands used to identify valuable assets and plan lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The user account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` was involved in suspicious access to the LSASS service, an attempt to dump clear-text credentials from memory.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Emails containing a malicious URL were delivered and later removed; these messages originated from the sender IP `119.36.50.193`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
