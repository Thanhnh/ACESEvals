tasks:
- task_id: incident_55_latest_cleaned_test_set_task_65
  title: incident_55_latest_cleaned_test_set_task_65
  description: 'For the alert regarding the ADFS private key extraction attempt, what is the security identifier (SID) of the account associated with the suspicious LDAP query?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert for ''Suspicious service registration'' was raised after a system program `services.exe` (Process ID 764, created 2024-06-20T08:30:13.7925191Z) was registered as a service, which can indicate malicious intent to establish persistence or gain system privileges. Around the same time on the same host, another alert fired indicating that a suspicious LDAP (Lightweight Directory Access Protocol) query was launched, suggesting attackers might be attempting to steal Active Directory Federation Service (ADFS) private keys or move laterally on the network.'
    question: 'For the alert regarding the ADFS private key extraction attempt, what is the security identifier (SID) of the account associated with the suspicious LDAP query?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-5-21-571436798-3864380397-1837441745-3206'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A system program was registered as a service on host `mb-adfs`, indicating a suspicious service registration used to establish persistence or gain system privileges.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` launched a suspicious LDAP query, attempting to extract ADFS private keys or move laterally on the network.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
