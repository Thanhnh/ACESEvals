tasks:
- task_id: incident_55_latest_cleaned_test_set_task_3
  title: incident_55_latest_cleaned_test_set_task_3
  description: 'A related alert in the same incident reports an attempt to hide the use of a dual-purpose tool by running it under an unexpected filename. Which user account name was associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, a "Suspicious Task Scheduler activity" alert fired on 2024-07-04. A process involved in earlier malicious activity launched `powershell.exe` with an encoded command (PID 6808), and then used `schtasks.exe` to create and immediately run a scheduled task named `run-exportadfstokensignincert.2024-07-02_09_48_23` (PIDs 4304 and 6892), which executed a hidden-window, encoded PowerShell payload — a likely attempt to establish persistence and automatically launch malicious code.'
    question: 'A related alert in the same incident reports an attempt to hide the use of a dual-purpose tool by running it under an unexpected filename. Which user account name was associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process with the file name `iy2orr1e.rrg.exe` used Task Scheduler to create, modify, or delete a scheduled task in an attempt to establish persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The account `gsmith` was observed running a known dual-purpose public tool under an unexpected filename, attempting to hide its malicious use.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
