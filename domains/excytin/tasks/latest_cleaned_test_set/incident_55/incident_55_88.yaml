  initial_context:
    incident_context: 'During a multi-stage incident, a ''Suspicious sequence of exploration activities'' alert was raised on host `mb-adfs` for account `gsmith` (SID S-2-5-21-571436798-3864380397-1837441745-3206). The activity included repeated `whoami.exe` executions and a hidden, encoded-command process `iy2orr1e.rrg.exe` (PID 3116). A few days later, on 2024-07-07, a related alert titled ''Internal phishing campaign'' fired, indicating that a user on this device sent phishing emails to recipients inside the organization, suggesting the account may have been compromised for lateral movement.'
    question: 'In the internal phishing campaign alert that followed this exploration activity, what malicious URL was contained in the phishing emails sent to internal recipients?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
