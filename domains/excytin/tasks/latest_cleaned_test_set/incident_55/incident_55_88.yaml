        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious sequence of exploration activities was detected, where the process `powershell.exe` ran a set of Windows commands used to discover valuable assets and prepare lateral movement, at 2024-07-04 22:35:03 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
