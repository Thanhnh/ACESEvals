        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` attempted to hide the use of a dual-purpose tool by running a known public tool under an unexpected filename.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious remote activity was observed on the machine, initiated through the process `powershell.exe`.'
      checkpoint_3:
