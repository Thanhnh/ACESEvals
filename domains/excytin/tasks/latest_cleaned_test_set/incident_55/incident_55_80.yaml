tasks:
- task_id: incident_55_latest_cleaned_test_set_task_80
  title: incident_55_latest_cleaned_test_set_task_80
  description: 'For the alert reporting the invocation of the malicious PowerShell Cmdlet, what is the Microsoft Entra (AAD) user ID of the account involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled ''Attempt to hide use of dual-purpose tool'' was raised when a known public tool was observed running under an unexpected filename. The process details were: ProcessId 5752, created at 2024-07-06T00:00:01.7155092Z, with command line `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`. Pivoting from the user account tied to this process, analysts traced related activity back to a suspicious remote session on the same machine, which led to an alert reporting that a malicious PowerShell Cmdlet — potentially associated with credential theft, exploitation, network reconnaissance, or code injection — was invoked on the machine.'
    question: 'For the alert reporting the invocation of the malicious PowerShell Cmdlet, what is the Microsoft Entra (AAD) user ID of the account involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '2de70991-2799-4a95-b734-8e3df3a50118'
  scoring:
