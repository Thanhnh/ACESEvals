tasks:
- task_id: incident_55_latest_cleaned_test_set_task_8
  title: incident_55_latest_cleaned_test_set_task_8
  description: 'One of the related alerts in this incident flagged a suspicious LDAP query indicating an attempt to extract Active Directory Federation Services (ADFS) private keys. What is the security identifier (SID) of the account associated with that ADFS private key extraction attempt alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an internal phishing campaign alert was raised after a user was observed sending phishing email from a device to recipients inside the organization, suggesting a compromised account being used for lateral movement. The alert (raised on 2024-07-07) involved accounts such as `Nina Sullivan` (santiago@vnevado.alpineskihouse.co) and `Lucas Grey` (bjenkins@niseko.alpineskihouse.co), along with the URL `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`. Following this thread of activity, other related alerts were triggered on the same environment, including credential theft attempts against LSASS and suspicious remote activity.'
    question: 'One of the related alerts in this incident flagged a suspicious LDAP query indicating an attempt to extract Active Directory Federation Services (ADFS) private keys. What is the security identifier (SID) of the account associated with that ADFS private key extraction attempt alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-5-21-571436798-3864380397-1837441745-3206'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'An internal phishing campaign was sent from this device by the user with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`, indicating the account may have been compromised for lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'On the same device, a process scanned or dumped memory from `lsass.exe` (ExtractedFileName: `lsass.exe`), a sensitive credential memory read used to harvest authentication hashes or passwords.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Using the stolen credentials, suspicious remotely initiated activity was observed on the machine under the account with SID `S-2-5-21-571436798-3864380397-1837441745-3206`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'That same account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` launched a suspicious LDAP query attempting to extract Active Directory Federation Service (ADFS) private keys for further lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
