tasks:
- task_id: incident_55_latest_cleaned_test_set_task_63
  title: incident_55_latest_cleaned_test_set_task_63
  description: 'Later in this incident, an alert was raised for a suspected AD FS DKM key read against the AD FS object with ID `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`. What is the email address of the account that performed this DKM key read?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage intrusion, a suspicious system hardware discovery activity was detected on host `mb-winclient` (AAD Device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`), where a known reconnaissance technique was used to gather information about the device. The activity involved the account `pwilson` (SID `S-1-5-21-561436748-3867387497-1732241745-3701`), source IP `72.5.72.208`, and processes such as `svchost.exe -k netsvcs -p -s winmgmt` (PID 2880) and a PowerShell execution of `c:\script\contosoadfsblatempcreds.ps1` (PID 13968). This reconnaissance was followed by a suspicious sequence of exploration commands typically used to identify valuable assets and plan lateral movement.'
    question: 'Later in this incident, an alert was raised for a suspected AD FS DKM key read against the AD FS object with ID `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`. What is the email address of the account that performed this DKM key read?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The attacker used `powershell.exe` to perform suspicious system hardware discovery on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account `gsmith` executed a suspicious sequence of exploration commands used to identify valuable assets and plan lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The account with email `gsmith@niseko.alpineskihouse.co` read the AD FS DKM key of the ADFS object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
