tasks:
- task_id: incident_55_latest_cleaned_test_set_task_99
  title: incident_55_latest_cleaned_test_set_task_99
  description: 'In the alert about suspicious access to the LSASS service, which credential-related library file was identified as being involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a suspicious service named DDLOXJDSQSNGMUKKFUXQ was created by the account `gsmith@niseko.alpineskihouse.co` on host `MB-ADFS` in order to execute potentially malicious commands. Follow-on activity on the same device included a hands-on-keyboard attack using the Impacket toolkit, and later an alert for suspicious access to the LSASS service, where attackers attempt to decrypt user passwords from LSASS memory for use in lateral movement.'
    question: 'In the alert about suspicious access to the LSASS service, which credential-related library file was identified as being involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vaultcli.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vaultcli.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` (gsmith) created a suspicious service `DDLOXJDSQSNGMUKKFUXQ` to execute potentially malicious commands on the host MB-ADFS.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'An ongoing hands-on-keyboard attack via the Impacket toolkit was observed, involving the process with extracted file name `lsass.exe`, indicating lateral movement and credential access attempts.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Suspicious access to the LSASS service was detected, with the credential-related file `vaultcli.dll` being loaded to dump clear-text passwords from LSASS memory.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
