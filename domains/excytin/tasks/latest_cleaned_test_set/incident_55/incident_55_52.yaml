tasks:
- task_id: incident_55_latest_cleaned_test_set_task_52
  title: incident_55_latest_cleaned_test_set_task_52
  description: 'For that earlier ''Sensitive credential memory read'' alert, which IP address was recorded as an entity associated with the credential dumping activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage incident, an alert titled ''A potentially malicious URL click was detected'' fired on 2024-07-10, showing that the user Lucas Grey (mailbox `bjenkins@niseko.alpineskihouse.co`) received and clicked a malicious link `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`. Pivoting on the compromised user account, an earlier alert in the same incident (2024-07-04) reported a ''Sensitive credential memory read'', where a process scanned or dumped memory from the Local Security Authority Subsystem Service (lsass.exe), potentially allowing an attacker to extract authentication hashes or passwords for offline use.'
    question: 'For that earlier ''Sensitive credential memory read'' alert, which IP address was recorded as an entity associated with the credential dumping activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` clicked on a potentially malicious URL.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, a process read/dumped sensitive credential memory from lsass.exe, with activity associated with the IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
