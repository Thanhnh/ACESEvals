tasks:
- task_id: incident_55_latest_cleaned_test_set_task_98
  title: incident_55_latest_cleaned_test_set_task_98
  description: 'Days later, the same compromised user was seen making an unusual addition of a Password credential to an OAuth application named SimulandApp. What is the OAuth application ID of that app?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious LDAP query was detected indicating potential reconnaissance activity. On the device `mb-winclient` (AAD device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`), the account `pwilson` ran `powershell.exe` with the command line `"powershell.exe" c:\script\ldaprequest.ps1` (Process ID 11116, created 2024-07-02T09:47:42Z), with the associated IP address `72.5.72.208`. LDAP queries like this are often used by attackers to map out an organization''s structure by querying the domain controller for administrative users, groups, and interesting assets.'
    question: 'Days later, the same compromised user was seen making an unusual addition of a Password credential to an OAuth application named SimulandApp. What is the OAuth application ID of that app?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '4d9476b8-6ae6-459b-a273-5837c15b5981'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '4d9476b8-6ae6-459b-a273-5837c15b5981'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious LDAP query indicating reconnaissance activity was executed by the account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` at 2024-07-04 22:35:03 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the reconnaissance, the compromised user Luciano Herrera (pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application `SimulandApp` with OAuthAppId `4d9476b8-6ae6-459b-a273-5837c15b5981` at 2024-07-10 11:24:45 UTC, which may allow the attacker to persist, spread phishing, or exfiltrate data.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
