  description: 'For the alert about emails containing a malicious URL that were removed after delivery, what was the malicious URL contained in those emails?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Suspicious System Hardware Discovery'' alert fired on host `mb-winclient` (AAD device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`), where processes such as `svchost.exe -k netsvcs -p -s winmgmt` (PID 2880) and `"powershell.exe" c:\script\contosoadfsblatempcreds.ps1` (PID 13968) were observed, involving accounts `bjenkins` and `pwilson`. Following this discovery activity, the same compromised identity was later tied to internal phishing activity, and a related alert reported that email messages containing a malicious URL were delivered to mailboxes and subsequently removed after delivery.'
    question: 'For the alert about emails containing a malicious URL that were removed after delivery, what was the malicious URL contained in those emails?'
