tasks:
- task_id: incident_55_latest_cleaned_test_set_task_12
  title: incident_55_latest_cleaned_test_set_task_12
  description: 'For the related alert about emails containing a malicious URL that were removed after delivery, which mailbox address was the recipient of those messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised for suspicious service creation, where the user `gsmith@niseko.alpineskihouse.co` created a service named DDLOXJDSQSNGMUKKFUXQ in order to execute potentially malicious commands on the host `MB-ADFS`. Pivoting from this activity, analysts traced the related activity chain and found it links to an email-based alert titled ''Email messages containing malicious URL removed after delivery'' (-V62.34.26.163), where emails with a malicious URL were delivered and later removed.'
    question: 'For the related alert about emails containing a malicious URL that were removed after delivery, which mailbox address was the recipient of those messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` (gsmith) created a suspicious service `DDLOXJDSQSNGMUKKFUXQ` to execute potentially malicious commands on host MB-ADFS.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'A process executed `whoami.exe` as part of a suspicious sequence of exploration activities used to identify assets of value and coordinate lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'These exploration commands were run under the account with SID `S-1-5-21-561436748-3867387497-1732241745-3701`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The mailbox recipient `bjenkins@niseko.alpineskihouse.co` received an email containing a malicious URL that was later removed after delivery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
