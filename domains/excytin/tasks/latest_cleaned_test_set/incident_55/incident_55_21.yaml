tasks:
- task_id: incident_55_latest_cleaned_test_set_task_21
  title: incident_55_latest_cleaned_test_set_task_21
  description: 'For the later alert in this incident where a potentially malicious URL click was detected, what is the primary email address of the mailbox belonging to the user who clicked the malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert for "Suspicious remote activity" was raised on host `mb-adfs`, where activity initiated remotely involved the account `gsmith` (SID `S-2-5-21-571436798-3864380397-1837441745-3206`) and the LocalSystem account. Observed processes included `cmd.exe /c "powershell.exe -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcafiazqbuageabqblafaabwb3aguacgbzaggazqbsagwalgbwahmamqa="` (PID 8896), the corresponding encoded `powershell.exe` command (PID 6808), and `lsass.exe` (PID 780). This activity chains onward to a process injection alert and, later in the incident, to a detection that one of your users clicked on a link found to be malicious.'
    question: 'For the later alert in this incident where a potentially malicious URL click was detected, what is the primary email address of the mailbox belonging to the user who clicked the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was observed on the machine, involving the process `powershell.exe` initiated remotely.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A process was injected with potentially malicious code under the user account with SID `S-1-5-21-561436748-3867387497-1732241745-3701`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A potentially malicious URL click was detected from the mailbox with primary address `bjenkins@niseko.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
