tasks:
- task_id: incident_55_latest_cleaned_test_set_task_41
  title: incident_55_latest_cleaned_test_set_task_41
  description: 'For the alert about the potentially malicious URL click, what is the email address of the mail message recipient who received the message containing that malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an internal phishing campaign alert was raised indicating that a user (Nina Sullivan, account `santiago@vnevado.alpineskihouse.co`, AAD User ID `28058d92-fc24-4869-9231-6546a34b00f2`) sent phishing emails from a device to recipients inside the organization, suggesting the account may have been compromised for lateral movement. A few days later, a related alert fired stating that one of the users clicked on a link that was found to be malicious.'
    question: 'For the alert about the potentially malicious URL click, what is the email address of the mail message recipient who received the message containing that malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A compromised user account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` was observed sending internal phishing emails from the device to recipients inside the organization at 2024-07-07 10:09:33 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'One of those phishing emails was delivered to the mailbox of the recipient `bjenkins@niseko.alpineskihouse.co`, who then clicked on the potentially malicious URL contained in the message at 2024-07-10 11:24:45 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
