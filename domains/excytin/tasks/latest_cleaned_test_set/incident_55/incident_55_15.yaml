tasks:
- task_id: incident_55_latest_cleaned_test_set_task_15
  title: incident_55_latest_cleaned_test_set_task_15
  description: 'Following this activity, a related alert reported an internal phishing campaign where a user sent phishing emails to recipients inside the organization from a compromised account. What is the email address of the account that sent those internal phishing emails?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert flagged that the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application SimulandApp (OAuthAppId `4d9476b8-6ae6-459b-a273-5837c15b5981`) in the Office 365 / Microsoft 365 cloud application, from IP address `36.193.21.220`. This usage pattern may indicate that an attacker has compromised the app, and is using it to spread phishing, exfiltrate data, or to gain access to other accounts and devices.'
    question: 'Following this activity, a related alert reported an internal phishing campaign where a user sent phishing emails to recipients inside the organization from a compromised account. What is the email address of the account that sent those internal phishing emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'santiago@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'santiago@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` (Luciano Herrera, pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application SimulandApp, indicating the app may have been compromised for phishing, data exfiltration, or access to other accounts and devices.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` ran a suspicious sequence of exploration activities, calling a set of Windows commands used to identify valuable assets and coordinate lateral movement after compromising the machine.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The compromised user account with email `santiago@vnevado.alpineskihouse.co` was observed sending internal phishing emails to recipients inside the organization, indicating the attacker used this account to move laterally within the organization.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
