tasks:
- task_id: incident_55_latest_cleaned_test_set_task_87
  title: incident_55_latest_cleaned_test_set_task_87
  description: 'Which user account was identified as the one issuing the directory replication request in the suspected DCSync attack?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an email containing a malicious URL `http://kn017721628.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was delivered to the mailbox `santiago@vnevado.alpineskihouse.co` and later removed. The message was sent from `4qs6v9m@vnevado.alpineskihouse.co` with sender IP `106.214.87.198`. Following this, an internal phishing campaign alert and a process injection alert were raised on related accounts, and the activity ultimately escalated to a suspected DCSync attack in which a directory services replication request was sent from the workstation MB-WINCLIENT to the domain controller MB-DC1.'
    question: 'Which user account was identified as the one issuing the directory replication request in the suspected DCSync attack?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera (the CIO account)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera (the CIO account)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `28058d92-fc24-4869-9231-6546a34b00f2` received an email containing a malicious URL, which was delivered and later removed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` was observed sending internal phishing emails to recipients inside the organization, indicating the account was compromised for lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` was involved in a process injection, where malicious code was injected into another process to hide execution within a trusted process.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The account `Luciano Herrera` (CIO) on MB-WINCLIENT performed a suspected DCSync attack, sending a directory services replication request to the domain controller MB-DC1.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
