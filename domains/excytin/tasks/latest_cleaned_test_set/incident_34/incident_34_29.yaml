tasks:
- task_id: incident_34_latest_cleaned_test_set_task_29
  title: incident_34_latest_cleaned_test_set_task_29
  description: 'Just before this persistence activity, another alert on the same device flagged a suspicious download or encoded command execution used to run a payload in memory. What is the name of the executable file that carried out that suspicious download or encoded command?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an alert fired for an uncommon file being created and added to a Run Key for persistence. The observed process (PID 10208, created 2024-06-26T13:17:18.8268389Z) ran the command line `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe`, and the activity was associated with the IP address `72.5.72.208`.'
    question: 'Just before this persistence activity, another alert on the same device flagged a suspicious download or encoded command execution used to run a payload in memory. What is the name of the executable file that carried out that suspicious download or encoded command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'On host `vnevado-win10e`, an uncommon file was created and added to a Run Key for persistence, so it will execute after a reboot.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same host, a suspicious download or encoded command execution was performed by the process `powershell.exe`, which attackers commonly use to fetch external payloads or run commands in memory to evade detection.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
