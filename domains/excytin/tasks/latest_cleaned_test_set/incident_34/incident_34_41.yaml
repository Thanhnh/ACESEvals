tasks:
- task_id: incident_34_latest_cleaned_test_set_task_41
  title: incident_34_latest_cleaned_test_set_task_41
  description: 'Which device was the manually initiated Automated investigation run against? Provide the host name.'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a suspicious PowerShell command line was observed launching `powershell.exe` with a heavily obfuscated base64 payload that dropped `winatp-intro-backdoor.exe` onto the desktop of user `samuelf` (SID S-1-5-21-1870156660-7534030218-135086563-1193) and created/ran a scheduled task named ''yrei'' for persistence. The initial infection appears to have originated from `winword.exe` opening `c:\scripts\rs4_winatp-intro-invoice.docm`. Around the same time, an analyst (u141@ash.alpineskihouse.co) manually triggered an Automated investigation to identify and review threat artifacts for possible remediation.'
    question: 'Which device was the manually initiated Automated investigation run against? Provide the host name.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10e (FQDN: vnevado-win10e.vnevado.alpineskihouse.co)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10e (FQDN: vnevado-win10e.vnevado.alpineskihouse.co)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious PowerShell command line was observed on the device with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`, indicating possible in-memory payload execution or discovery activity.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'In response, the user `u141@ash.alpineskihouse.co` manually started an Automated investigation on the affected host with HostName `vnevado-win10e` (vnevado-win10e.vnevado.alpineskihouse.co) to identify and review the threat artifacts for remediation.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
