tasks:
- task_id: incident_34_latest_cleaned_test_set_task_2
  title: incident_34_latest_cleaned_test_set_task_2
  description: 'For the earlier ''Suspicious PowerShell download or encoded command execution'' alert, which user account context was the activity performed under? Provide the account''s security identifier (SID).'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised indicating that PowerShell dropped a suspicious file named `winatp-intro-backdoor.exe` on a machine and then executed it. Just seconds before this, a related alert fired for suspicious PowerShell download or encoded command execution, where a process executed PowerShell to download a file or run an encoded command — a common technique attackers use to run payloads in memory without touching the disk.'
    question: 'For the earlier ''Suspicious PowerShell download or encoded command execution'' alert, which user account context was the activity performed under? Provide the account''s security identifier (SID).'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1870156660-7534030218-135086563-1193'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1870156660-7534030218-135086563-1193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'PowerShell (`powershell.exe`) dropped a suspicious file on the machine and executed it.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same PowerShell activity involved a download or encoded command execution, run by the user account with SID `S-1-5-21-1870156660-7534030218-135086563-1193`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
