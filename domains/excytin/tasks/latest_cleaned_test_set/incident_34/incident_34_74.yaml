tasks:
- task_id: incident_34_latest_cleaned_test_set_task_74
  title: incident_34_latest_cleaned_test_set_task_74
  description: 'A closely related alert, ''Suspicious process executed PowerShell command'', was triggered around the same time on this device. What is the security identifier (SID) of the account associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery, an alert titled ''Suspicious PowerShell download or encoded command execution'' was raised on host `vnevado-win10e` (AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`) for the user account `samuelf` (AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d`). The process (PID 8604, created 2024-06-26T12:00:39.2886108Z) ran `powershell.exe` with a hidden window and bypassed execution policy to rebuild a large base64 blob, write it to the desktop as `winatp-intro-backdoor.exe`, and then create and run a scheduled task named ''yrei'' to launch it.'
    question: 'A closely related alert, ''Suspicious process executed PowerShell command'', was triggered around the same time on this device. What is the security identifier (SID) of the account associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1870156660-7534030218-135086563-1193'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1870156660-7534030218-135086563-1193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-1870156660-7534030218-135086563-1193` executed a suspicious PowerShell command to download a file or run an encoded command, potentially bypassing security protections by running the payload in memory.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same account with SID `S-1-5-21-1870156660-7534030218-135086563-1193` was involved in a suspicious process that executed a PowerShell command, indicating the attacker continued executing commands in memory on the system.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
