tasks:
- task_id: incident_34_latest_cleaned_test_set_task_76
  title: incident_34_latest_cleaned_test_set_task_76
  description: 'The same compromised user account was also seen performing reconnaissance through a suspicious LDAP query against the domain controller. What is the Microsoft Entra (AAD) user ID of that account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving execution and discovery activity on an endpoint, an alert was raised for ''Suspicious PowerShell download or encoded command execution''. The process (PID 8604, created 2024-06-26T12:00:39Z) ran `powershell.exe` with a heavily obfuscated command that rebuilt a base64 blob into an executable named `winatp-intro-backdoor.exe`, wrote it to the user''s desktop, and then created and ran a scheduled task named ''yrei'' to launch it. This activity was tied to a specific user account SID.'
    question: 'The same compromised user account was also seen performing reconnaissance through a suspicious LDAP query against the domain controller. What is the Microsoft Entra (AAD) user ID of that account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '16320fec-8d90-403b-b7fe-78f715d4728d'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '16320fec-8d90-403b-b7fe-78f715d4728d'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process executed a suspicious PowerShell download or encoded command under the user account with Sid `S-1-5-21-1870156660-7534030218-135086563-1193`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised identity, the account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d`, then ran a suspicious LDAP query against the domain controller for reconnaissance of users, groups, and assets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
