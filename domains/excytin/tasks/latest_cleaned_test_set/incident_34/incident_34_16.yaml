tasks:
- task_id: incident_34_latest_cleaned_test_set_task_16
  title: incident_34_latest_cleaned_test_set_task_16
  description: 'For the suspicious LDAP query alert connected to this device, what is the Azure AD (Entra) user ID of the account associated with that reconnaissance activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, user u141 (u141@ash.alpineskihouse.co) manually initiated an Automated investigation on the device `vnevado-win10e.vnevado.alpineskihouse.co` (AAD Device ID `02b8f519-1123-4228-b32a-ccb78af3449f`) to automatically identify and review threat artifacts for possible remediation. Moments later, a related alert was raised on the same device for a suspicious LDAP query, which indicates potential reconnaissance activity where attackers query the domain controller for administrative users, groups and interesting assets in order to escalate privileges.'
    question: 'For the suspicious LDAP query alert connected to this device, what is the Azure AD (Entra) user ID of the account associated with that reconnaissance activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'AadUserId: 16320fec-8d90-403b-b7fe-78f715d4728d'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'AadUserId: 16320fec-8d90-403b-b7fe-78f715d4728d'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An Automated investigation was started manually by u141(u141@ash.alpineskihouse.co) on the device `vnevado-win10e.vnevado.alpineskihouse.co` with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`, which automatically identifies and reviews threat artifacts for possible remediation.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same device, a suspicious LDAP query was executed, indicating potential reconnaissance activity against the domain controller, performed by the user account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
