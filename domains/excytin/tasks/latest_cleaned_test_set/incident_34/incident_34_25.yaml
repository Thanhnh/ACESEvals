tasks:
- task_id: incident_34_latest_cleaned_test_set_task_25
  title: incident_34_latest_cleaned_test_set_task_25
  description: 'A closely related alert in this same incident reports that a suspicious process executed a PowerShell command, which attackers often use to run payloads in memory without touching disk. Which user account was associated with that PowerShell execution alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Persistence on an endpoint, a suspicious Task Scheduler activity was detected where `schtasks.exe` was launched with the command line `"schtasks.exe" /run /tn yrei` (Process ID 1616) by a process previously involved in malicious activity, suggesting an attempt to launch malicious code automatically and establish persistence.'
    question: 'A closely related alert in this same incident reports that a suspicious process executed a PowerShell command, which attackers often use to run payloads in memory without touching disk. Which user account was associated with that PowerShell execution alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious process used Task Scheduler via `powershell.exe` to create, modify, or delete a scheduled task in an attempt to establish persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The suspicious process executed PowerShell commands under the user account `samuelf`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
