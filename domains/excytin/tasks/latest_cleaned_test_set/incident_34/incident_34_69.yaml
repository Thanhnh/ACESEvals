tasks:
- task_id: incident_34_latest_cleaned_test_set_task_69
  title: incident_34_latest_cleaned_test_set_task_69
  description: 'For the follow-up alert about the suspicious PowerShell download or encoded command execution, what is the security identifier (SID) of the account under which this activity took place?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a malicious macro-enabled document `rs4_winatp-intro-invoice.docm` was opened with `winword.exe` (PID 9780), which subsequently led to `schtasks.exe` being used to create and run a scheduled task named ''yrei'' that executed the file `winatp-intro-backdoor.exe` from a user''s OneDrive desktop folder. Shortly afterwards, a suspicious PowerShell command line was observed on the same machine, followed by an alert for a suspicious PowerShell download or encoded command execution.'
    question: 'For the follow-up alert about the suspicious PowerShell download or encoded command execution, what is the security identifier (SID) of the account under which this activity took place?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1870156660-7534030218-135086563-1193'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1870156660-7534030218-135086563-1193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious PowerShell command line was observed executing the file `winatp-intro-backdoor.exe`, indicating a possible in-memory payload or backdoor installation.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The user account with SID `S-1-5-21-1870156660-7534030218-135086563-1193` executed PowerShell to download a file or run an encoded command.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
