    question: 'Almost at the same time on this same device, an alert was raised for a suspicious process executing a PowerShell command — a technique attackers often use to run payloads in memory and bypass security protections. What is the name of the user account associated with that suspicious PowerShell execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An Automated investigation was started manually by u141(u141@ash.alpineskihouse.co) on the device `vnevado-win10e.vnevado.alpineskihouse.co` with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`, which automatically identifies and reviews threat artifacts for possible remediation.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same device, a suspicious process executed a PowerShell command, potentially to run a payload in memory and bypass security protections; this activity was performed under the user account with Name `samuelf`.'
