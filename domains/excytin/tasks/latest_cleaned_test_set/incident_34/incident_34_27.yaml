tasks:
- task_id: incident_34_latest_cleaned_test_set_task_27
  title: incident_34_latest_cleaned_test_set_task_27
  description: 'Almost at the same time on this same device, an alert was raised for a suspicious process executing a PowerShell command — a technique attackers often use to run payloads in memory and bypass security protections. What is the name of the user account associated with that suspicious PowerShell execution?'
  inherit_shared: true
  initial_context:
