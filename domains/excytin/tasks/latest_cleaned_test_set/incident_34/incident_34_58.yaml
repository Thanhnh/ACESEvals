tasks:
- task_id: incident_34_latest_cleaned_test_set_task_58
  title: incident_34_latest_cleaned_test_set_task_58
  description: 'Which built-in scripting utility (executable file name) was executed on this device to download the file or run the encoded command?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage incident, an alert was raised for a suspicious download or encoded command execution on the device `vnevado-win10e` (AAD Device ID `02b8f519-1123-4228-b32a-ccb78af3449f`). The activity was associated with the user account `samuelf` (SID `S-1-5-21-1870156660-7534030218-135086563-1193`, AAD User ID `16320fec-8d90-403b-b7fe-78f715d4728d`) and involved the suspicious binary `winatp-intro-backdoor.exe`. Attackers commonly abuse built-in scripting utilities to run payloads in memory without touching disk.'
    question: 'Which built-in scripting utility (executable file name) was executed on this device to download the file or run the encoded command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'A process executed `powershell.exe` to download a file or run an encoded command, indicating a possible attempt to bypass security protections by running the payload in memory.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
