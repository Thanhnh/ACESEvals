tasks:
- task_id: incident_34_latest_cleaned_test_set_task_36
  title: incident_34_latest_cleaned_test_set_task_36
  description: 'Moments before the scheduled task was created, a Suspicious PowerShell command line alert was raised on the same device. What is the name of the executable file associated with that PowerShell alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident on the endpoint `vnevado-win10e` (AAD Device ID `02b8f519-1123-4228-b32a-ccb78af3449f`), an anomalous scheduled task named "yrei" was created via `schtasks.exe` (Process ID 1348, created 2024-06-26T12:00:40Z) under the user account `samuelf` (AAD User ID `16320fec-8d90-403b-b7fe-78f715d4728d`). PowerShell was also involved in this activity chain, and such scheduled tasks are commonly used by attackers to obtain persistence on a device.'
    question: 'Moments before the scheduled task was created, a Suspicious PowerShell command line alert was raised on the same device. What is the name of the executable file associated with that PowerShell alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An anomalous scheduled task was created by the account with SID `S-1-5-21-1870156660-7534030218-135086563-1193`, likely to establish persistence on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious PowerShell command line was observed on the machine, which executed the file `winatp-intro-backdoor.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
