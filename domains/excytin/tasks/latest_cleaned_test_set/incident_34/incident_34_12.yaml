tasks:
- task_id: incident_34_latest_cleaned_test_set_task_12
  title: incident_34_latest_cleaned_test_set_task_12
  description: 'A related alert in this same incident flagged a suspicious LDAP query indicating reconnaissance activity against the domain controller. Which process was responsible for that activity - provide the process ID, creation time, and full command line?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident involving Execution & Discovery on one endpoint, PowerShell was observed dropping and executing a suspicious file. The process (PID 8604, created 2024-06-26T12:00:39Z) ran `powershell.exe -w movedn -exec bypass -command ...` which reconstructed a large base64 blob into an executable named `winatp-intro-backdoor.exe`, wrote it to the user''s Desktop, and then created and ran a scheduled task named ''yrei'' to launch it.'
    question: 'A related alert in this same incident flagged a suspicious LDAP query indicating reconnaissance activity against the domain controller. Which process was responsible for that activity - provide the process ID, creation time, and full command line?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID 9780, created 2024-06-26T11:57:20.2959493Z, command line: `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID 9780, created 2024-06-26T11:57:20.2959493Z, command line: `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `samuelf` was compromised, and PowerShell dropped a suspicious file on the machine and executed it.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From that activity, a suspicious LDAP query was executed for reconnaissance by the process `winword.exe` running the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`, with Process ID `9780`, created at `2024-06-26t11:57:20.2959493z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
