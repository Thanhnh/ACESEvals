tasks:
- task_id: incident_34_latest_cleaned_test_set_task_59
  title: incident_34_latest_cleaned_test_set_task_59
  description: 'In the related suspicious PowerShell command line alert, what is the name of the file involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident investigation, an alert fired indicating that an uncommon file was created on a machine and then added to a Registry Run Key so it would execute after reboot — a common persistence technique. The activity on this machine was associated with the IP address `72.5.72.208`. Around the same time (about a second earlier), a related alert flagged suspicious PowerShell command line activity on the same machine, which may indicate PowerShell being used to download or execute a payload.'
    question: 'In the related suspicious PowerShell command line alert, what is the name of the file involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'On the host `vnevado-win10e`, an uncommon file was created and added to a Run registry key for persistence, so it would execute after reboot.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious PowerShell command line was observed on that same machine, indicating PowerShell was used to download or invoke a payload.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The PowerShell activity is associated with the malicious file `winatp-intro-backdoor.exe`, the backdoor executable dropped and persisted on the machine.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
