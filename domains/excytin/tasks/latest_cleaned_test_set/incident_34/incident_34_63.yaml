tasks:
- task_id: incident_34_latest_cleaned_test_set_task_63
  title: incident_34_latest_cleaned_test_set_task_63
  description: 'A related alert flagged a suspicious PowerShell command line on the same machine, where an obfuscated base64 blob was decoded and written to the user''s Desktop as the payload later executed by the scheduled task. What is the name of that dropped file?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident on endpoint `vnevado-win10e` (AAD device ID `02b8f519-1123-4228-b32a-ccb78af3449f`), a Suspicious Task Scheduler activity alert was raised: the account `samuelf` (SID `S-1-5-21-1870156660-7534030218-135086563-1193`) used `schtasks.exe` (PID 1348) to create a one-time scheduled task named `yrei`, which was then immediately triggered with `"schtasks.exe" /run /tn yrei` (PID 1616). This behavior suggests an attempt to launch malicious code automatically and establish persistence.'
    question: 'A related alert flagged a suspicious PowerShell command line on the same machine, where an obfuscated base64 blob was decoded and written to the user''s Desktop as the payload later executed by the scheduled task. What is the name of that dropped file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `samuelf` was involved in suspicious Task Scheduler activity, where a process previously linked to malicious activity created, modified, or deleted a scheduled task to establish persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The same account then executed a suspicious PowerShell command line on the machine, which was used to run a payload in memory and evade detection.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'This suspicious PowerShell activity involved the malicious file `winatp-intro-backdoor.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
