tasks:
- task_id: incident_34_latest_cleaned_test_set_task_5
  title: incident_34_latest_cleaned_test_set_task_5
  description: 'Shortly before this alert, the user u141@ash.alpineskihouse.co manually started an Automated investigation on the affected machine. What is the host name of the device that the Automated investigation was initiated on?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident, an alert fired for an uncommon file `winatp-intro-backdoor.exe` that was created and then added to a Run Key for persistence, via the command line `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe` (Process ID 10208) executed by the account `samuelf` (SID S-1-5-21-1870156660-7534030218-135086563-1193), with associated IP address 72.5.72.208.'
    question: 'Shortly before this alert, the user u141@ash.alpineskihouse.co manually started an Automated investigation on the affected machine. What is the host name of the device that the Automated investigation was initiated on?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10e (fully qualified: vnevado-win10e.vnevado.alpineskihouse.co)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10e (fully qualified: vnevado-win10e.vnevado.alpineskihouse.co)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An uncommon file was created on the host `vnevado-win10e` and added to a Registry Run Key for persistence, so it will execute after a reboot.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'An Automated investigation was manually initiated by u141(u141@ash.alpineskihouse.co) on the same host `vnevado-win10e` (vnevado-win10e.vnevado.alpineskihouse.co) to identify and review the threat artifacts for possible remediation.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
