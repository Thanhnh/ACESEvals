tasks:
- task_id: incident_34_latest_cleaned_test_set_task_14
  title: incident_34_latest_cleaned_test_set_task_14
  description: 'Roughly a second after the LDAP reconnaissance, a related alert fired for a process using PowerShell to download a file or run an encoded command. What is the name of the executable file associated with that PowerShell download/encoded command alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident involving Execution & Discovery on one endpoint, a suspicious LDAP query was executed on host `vnevado-win10e` (AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`) under the account `samuelf` (SID `S-1-5-21-1870156660-7534030218-135086563-1193`). The activity traces back to process ID 9780, `winword.exe`, launched at 2024-06-26T11:57:20Z with the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`, suggesting reconnaissance of the organization''s directory structure following a malicious document being opened.'
    question: 'Roughly a second after the LDAP reconnaissance, a related alert fired for a process using PowerShell to download a file or run an encoded command. What is the name of the executable file associated with that PowerShell download/encoded command alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious LDAP query indicating reconnaissance activity was executed by the process `winword.exe` running `c:\scripts\rs4_winatp-intro-invoice.docm`, with Process ID `9780`, created at `2024-06-26t11:57:20.2959493z`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'From that Word document process, PowerShell was launched to download a file or run an encoded command, bypassing security protections.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The PowerShell download or encoded command execution resulted in the extracted file `winatp-intro-backdoor.exe`, the backdoor payload dropped on the device.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
