tasks:
- task_id: incident_34_latest_cleaned_test_set_task_52
  title: incident_34_latest_cleaned_test_set_task_52
  description: 'On the same device, an earlier related alert flagged suspicious Task Scheduler activity used to establish persistence. What was the full command line used to create the scheduled task, and what was the process ID?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an uncommon file was observed being created on a machine and then added to a Registry Run Key for persistence, using the command `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe` (Process ID 10208, created 2024-06-26T13:17:18Z). The activity was associated with the IP address `72.5.72.208`.'
    question: 'On the same device, an earlier related alert flagged suspicious Task Scheduler activity used to establish persistence. What was the full command line used to create the scheduled task, and what was the process ID?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Command line: `"schtasks.exe" /create /sc once /tn yrei /tr "c:\users\samuelf\onedrive - (new) alpineskihouse\desktop\winatp-intro-backdoor.exe" /st 11:58 /f`, Process ID: 1348 (created 2024-06-26T12:00:40.0878355Z)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Command line: `"schtasks.exe" /create /sc once /tn yrei /tr "c:\users\samuelf\onedrive - (new) alpineskihouse\desktop\winatp-intro-backdoor.exe" /st 11:58 /f`, Process ID: 1348 (created 2024-06-26T12:00:40.0878355Z)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'On the host with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`, an uncommon file was created and added to a Run Key for persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A process on that host then used Task Scheduler to establish additional persistence: the command line `"schtasks.exe" /create /sc once /tn yrei /tr "c:\users\samuelf\onedrive - (new) alpineskihouse\desktop\winatp-intro-backdoor.exe" /st 11:58 /f` was executed at `2024-06-26t12:00:40.0878355z` with Process ID `1348`, scheduling the backdoor executable `winatp-intro-backdoor.exe` to run automatically.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
