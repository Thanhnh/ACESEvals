tasks:
- task_id: incident_34_latest_cleaned_test_set_task_30
  title: incident_34_latest_cleaned_test_set_task_30
  description: 'Just before the LDAP reconnaissance, a suspicious PowerShell command line was observed on the same machine. What is the name of the file referenced in that PowerShell alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, the user account `samuelf` (SID S-1-5-21-1870156660-7534030218-135086563-1193) on host `vnevado-win10e` opened a macro-enabled document via `winword.exe` with the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`. Shortly afterwards, a suspicious LDAP query was executed on the same host, indicating potential reconnaissance activity against the domain controller.'
    question: 'Just before the LDAP reconnaissance, a suspicious PowerShell command line was observed on the same machine. What is the name of the file referenced in that PowerShell alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious LDAP query was executed by the process `winword.exe`, indicating reconnaissance activity against the domain controller.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that, a suspicious PowerShell command line was observed on the machine, which dropped/executed the backdoor payload file `winatp-intro-backdoor.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
