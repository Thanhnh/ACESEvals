tasks:
- task_id: incident_34_latest_cleaned_test_set_task_60
  title: incident_34_latest_cleaned_test_set_task_60
  description: 'A related alert in the same incident, ''Anomaly detected in ASEP registry'', flagged a process registering a suspicious command or file in an auto-start extensibility point registry key. What IP address was involved in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'In this multi-stage incident involving Execution & Discovery on one endpoint, a PowerShell process (PID 8604, created 2024-06-26T12:00:39Z) was launched with `-w movedn -exec bypass` and used a long, concatenated Base64 blob to write a binary named `winatp-intro-backdoor.exe` to the user''s Desktop. It then used `schtasks.exe` to create a scheduled task named `yrei` pointing at that executable (PID 1348) and immediately ran it (`schtasks.exe /run /tn yrei`, PID 1616), triggering a ''Suspicious Task Scheduler activity'' alert for persistence.'
    question: 'A related alert in the same incident, ''Anomaly detected in ASEP registry'', flagged a process registering a suspicious command or file in an auto-start extensibility point registry key. What IP address was involved in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `samuelf` was involved in suspicious Task Scheduler activity, where a process linked to earlier malicious activity created, modified, or deleted a scheduled task to establish persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same activity chain included an anomaly detected in an ASEP registry key, where a suspicious command or file was registered for execution after reboot, associated with the IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
