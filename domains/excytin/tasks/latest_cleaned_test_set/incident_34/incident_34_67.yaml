tasks:
- task_id: incident_34_latest_cleaned_test_set_task_67
  title: incident_34_latest_cleaned_test_set_task_67
  description: 'Which user account name was associated with the alert where a suspicious process executed a PowerShell command?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an anomalous scheduled task was created on a device using `schtasks.exe`, which may indicate an attacker attempting to establish persistence. This activity is linked through a shared account (identified by its SID) to another alert raised about a minute earlier, where a suspicious process executed a PowerShell command — a common technique for running payloads in memory to evade detection.'
    question: 'Which user account name was associated with the alert where a suspicious process executed a PowerShell command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-1870156660-7534030218-135086563-1193` created an anomalous scheduled task on the device, likely for persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user account, named `samuelf`, had a suspicious process execute a PowerShell command to run a payload in memory and evade security protections.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
