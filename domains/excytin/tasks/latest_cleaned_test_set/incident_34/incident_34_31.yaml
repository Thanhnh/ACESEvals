tasks:
- task_id: incident_34_latest_cleaned_test_set_task_31
  title: incident_34_latest_cleaned_test_set_task_31
  description: 'A suspicious LDAP query indicating reconnaissance activity was also observed on the same device shortly before this activity. Which process (name, process ID, and command line) was responsible for that LDAP query alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident involving Execution & Discovery on one endpoint, an anomalous scheduled task was created for persistence. PowerShell (process ID 8604) was launched with an obfuscated, base64-encoded command that reassembled and wrote a binary named `winatp-intro-backdoor.exe` to the user''s desktop, and then `schtasks.exe` (process ID 1348) created and ran a task named ''yrei'' pointing to that executable in the profile of user samuelf.'
    question: 'A suspicious LDAP query indicating reconnaissance activity was also observed on the same device shortly before this activity. Which process (name, process ID, and command line) was responsible for that LDAP query alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The process was `winword.exe` with process ID 9780, created at 2024-06-26T11:57:20.2959493Z, with the command line: `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The process was `winword.exe` with process ID 9780, created at 2024-06-26T11:57:20.2959493Z, with the command line: `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An anomalous scheduled task was created on host `vnevado-win10e`, likely used by an attacker to gain persistence on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that device, a suspicious LDAP query indicating reconnaissance activity was executed by the process with Process ID `9780`, created at `2024-06-26t11:57:20.2959493z`, with command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
