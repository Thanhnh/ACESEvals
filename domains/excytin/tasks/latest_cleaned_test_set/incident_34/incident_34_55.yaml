tasks:
- task_id: incident_34_latest_cleaned_test_set_task_55
  title: incident_34_latest_cleaned_test_set_task_55
  description: 'In the related alert where PowerShell dropped and executed a suspicious file, what is the name of the file that was dropped?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an anomalous scheduled task was created using `schtasks.exe`, a technique attackers commonly use to gain persistence on a device. The same compromised account was also observed in a related alert where PowerShell dropped a suspicious file on the machine and executed it.'
    question: 'In the related alert where PowerShell dropped and executed a suspicious file, what is the name of the file that was dropped?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with Name `samuelf` created an anomalous scheduled task on the device, likely to establish persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'PowerShell then dropped and executed a suspicious file with Name `winatp-intro-backdoor.exe` on the machine.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
