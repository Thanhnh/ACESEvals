tasks:
- task_id: incident_34_latest_cleaned_test_set_task_57
  title: incident_34_latest_cleaned_test_set_task_57
  description: 'A closely related alert, ''Suspicious process executed PowerShell command'', was triggered moments earlier as part of the same incident. What is the security identifier (SID) of the user account associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident involving Execution & Discovery on one endpoint, an alert for ''Suspicious PowerShell download or encoded command execution'' was raised. The alert involved the process `winword.exe` (Process ID 9780, created 2024-06-26T11:57:20.2959493Z) running the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`. PowerShell is often used by attackers to bypass security protections by executing payloads in memory without touching the disk.'
    question: 'A closely related alert, ''Suspicious process executed PowerShell command'', was triggered moments earlier as part of the same incident. What is the security identifier (SID) of the user account associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1870156660-7534030218-135086563-1193'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1870156660-7534030218-135086563-1193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious process executed a PowerShell command under the user account with SID `S-1-5-21-1870156660-7534030218-135086563-1193`, indicating an attacker may be running payloads in memory without touching the disk.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same account with SID `S-1-5-21-1870156660-7534030218-135086563-1193` then executed PowerShell to download a file or run an encoded command, suggesting the attacker was fetching external payloads or executing obfuscated commands on the device.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
