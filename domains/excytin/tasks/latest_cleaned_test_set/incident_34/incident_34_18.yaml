tasks:
- task_id: incident_34_latest_cleaned_test_set_task_18
  title: incident_34_latest_cleaned_test_set_task_18
  description: 'Roughly two seconds after that alert, another alert on the same device reported that PowerShell dropped a suspicious file and executed it. What is the name of the file that was dropped?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on host `vnevado-win10e` (AAD Device ID `02b8f519-1123-4228-b32a-ccb78af3449f`), an alert fired for "Suspicious PowerShell download or encoded command execution" at 2024-07-04 22:35:01 UTC. The activity was associated with the account `samuelf` (SID `S-1-5-21-1870156660-7534030218-135086563-1193`, AAD User ID `16320fec-8d90-403b-b7fe-78f715d4728d`) and involved the process `powershell.exe`, which is often abused by attackers to bypass security protections by executing payloads in memory or downloading external payloads.'
    question: 'Roughly two seconds after that alert, another alert on the same device reported that PowerShell dropped a suspicious file and executed it. What is the name of the file that was dropped?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process on host `vnevado-win10e` executed PowerShell to download a file or run an encoded command, potentially bypassing security protections by running the payload in memory.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The PowerShell process then dropped and executed a suspicious file named `winatp-intro-backdoor.exe` on the machine.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
