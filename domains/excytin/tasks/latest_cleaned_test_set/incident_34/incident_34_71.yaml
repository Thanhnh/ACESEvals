tasks:
- task_id: incident_34_latest_cleaned_test_set_task_71
  title: incident_34_latest_cleaned_test_set_task_71
  description: 'A related alert in this incident flagged the creation of an anomalous scheduled task, which attackers commonly use for persistence. Which user account was associated with the creation of that scheduled task?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery on an endpoint, a suspicious PowerShell command line alert was raised. The activity chain began with `winword.exe` opening the document `c:\scripts\rs4_winatp-intro-invoice.docm` (Process ID 9780), which led to the file `winatp-intro-backdoor.exe` and the execution of `"schtasks.exe" /run /tn yrei` (Process ID 1616).'
    question: 'A related alert in this incident flagged the creation of an anomalous scheduled task, which attackers commonly use for persistence. Which user account was associated with the creation of that scheduled task?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious PowerShell command line was observed on host `vnevado-win10e`, potentially used to download payloads or execute code in memory to bypass security protections.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the PowerShell activity, an anomalous scheduled task was created by the account `samuelf` to establish persistence on the device.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
