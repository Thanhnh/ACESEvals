tasks:
- task_id: incident_34_latest_cleaned_test_set_task_10
  title: incident_34_latest_cleaned_test_set_task_10
  description: 'For the alert about the anomalous scheduled task creation, which process (process ID and executable) issued the command, and what was the name of the scheduled task it registered along with the binary it dropped?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a suspicious LDAP query indicative of domain reconnaissance was executed on a compromised endpoint. The activity on that device was traced back to the process `winword.exe` (PID 9780, created 2024-06-26T11:57:20Z) which had opened the macro-enabled document `c:\scripts\rs4_winatp-intro-invoice.docm`. Shortly afterwards, a related alert fired on the same device reporting that an anomalous scheduled task was created, a technique commonly used by attackers to gain persistence.'
    question: 'For the alert about the anomalous scheduled task creation, which process (process ID and executable) issued the command, and what was the name of the scheduled task it registered along with the binary it dropped?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The scheduled task was created by `powershell.exe`, process ID 8604 (created 2024-06-26T12:00:39.2886108Z). It ran with `-w movedn -exec bypass` and decoded a base64 blob that it wrote to the desktop as `winatp-intro-backdoor.exe`, then used `schtasks /create /sc once /tn yrei /tr $fullpath ...` (followed by `schtasks /run /tn yrei`) — i.e., the scheduled task name was `yrei` and the dropped binary was `winatp-intro-backdoor.exe`.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The scheduled task was created by `powershell.exe`, process ID 8604 (created 2024-06-26T12:00:39.2886108Z). It ran with `-w movedn -exec bypass` and decoded a base64 blob that it wrote to the desktop as `winatp-intro-backdoor.exe`, then used `schtasks /create /sc once /tn yrei /tr $fullpath ...` (followed by `schtasks /run /tn yrei`) — i.e., the scheduled task name was `yrei` and the dropped binary was `winatp-intro-backdoor.exe`.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious LDAP query indicating reconnaissance activity (enumerating domain users, groups, and assets) was executed on host `vnevado-win10e`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that host, an anomalous scheduled task was created for persistence by the process with Process ID `8604`, created at `2024-06-26t12:00:39.2886108z`, with command line `"powershell.exe" -w movedn -exec bypass -command cd /;$filebase64prefix = '''' ... $filename= ''winatp-intro-backdoor.exe''; [io.file]::writeallbytes($fullpath,$file); schtasks /create /sc once /tn yrei /tr $fullpath ...; set-scheduledtask -taskname ''yrei'' -settings $settings; schtasks /run /tn yrei`, which decoded an embedded base64 payload, wrote `winatp-intro-backdoor.exe` to the desktop, and registered and ran the scheduled task `yrei` to execute the backdoor.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
