tasks:
- task_id: incident_34_latest_cleaned_test_set_task_73
  title: incident_34_latest_cleaned_test_set_task_73
  description: 'Shortly after this PowerShell activity, a suspicious LDAP query indicating reconnaissance was detected involving the same compromised user account. What is the security identifier (SID) of that account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving execution and discovery on an endpoint, a suspicious PowerShell command line was observed (process ID 8604, created 2024-06-26T12:00:39Z). The PowerShell process assembled a large base64 blob, wrote it to the user''s desktop as `winatp-intro-backdoor.exe` (under `c:\users\samuelf\onedrive - (new) alpineskihouse\desktop\`), and then used `schtasks.exe` to create and immediately run a scheduled task named `yrei` for persistence and execution of the dropped backdoor.'
    question: 'Shortly after this PowerShell activity, a suspicious LDAP query indicating reconnaissance was detected involving the same compromised user account. What is the security identifier (SID) of that account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1870156660-7534030218-135086563-1193'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1870156660-7534030218-135086563-1193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `samuelf` executed a suspicious PowerShell command line on the machine, indicating possible payload download or in-memory execution.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that activity, the same compromised user, identified by SID `S-1-5-21-1870156660-7534030218-135086563-1193`, ran a suspicious LDAP query against the domain controller to perform reconnaissance on the organization''s users, groups, and assets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
