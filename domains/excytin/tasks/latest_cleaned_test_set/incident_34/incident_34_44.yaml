tasks:
- task_id: incident_34_latest_cleaned_test_set_task_44
  title: incident_34_latest_cleaned_test_set_task_44
  description: 'For the suspicious PowerShell download or encoded command execution alert, which parent application launched the activity, and what were its process ID, creation time, and full command line?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery on one endpoint, an anomalous scheduled task was created for persistence. The process `schtasks.exe` (Process ID 1348, created 2024-06-26T12:00:40.0878355Z) ran with the command line: `"schtasks.exe" /create /sc once /tn yrei /tr "c:\users\samuelf\onedrive - (new) alpineskihouse\desktop\winatp-intro-backdoor.exe" /st 11:58 /f`. Shortly after, a related alert fired for a suspicious PowerShell download or encoded command execution, where an attacker may have been downloading external payloads or running commands in memory.'
    question: 'For the suspicious PowerShell download or encoded command execution alert, which parent application launched the activity, and what were its process ID, creation time, and full command line?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The activity originated from Microsoft Word: Process ID 9780, created 2024-06-26T11:57:20.2959493Z, command line: `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The activity originated from Microsoft Word: Process ID 9780, created 2024-06-26T11:57:20.2959493Z, command line: `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An anomalous scheduled task was created using the process `powershell.exe`, likely to establish persistence on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious PowerShell download or encoded command execution was traced to the process with Process ID `9780`, created at `2024-06-26t11:57:20.2959493z`, with command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
