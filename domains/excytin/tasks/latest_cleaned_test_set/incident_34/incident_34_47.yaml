tasks:
- task_id: incident_34_latest_cleaned_test_set_task_47
  title: incident_34_latest_cleaned_test_set_task_47
  description: 'Following this activity, an analyst (u141@ash.alpineskihouse.co) manually triggered an Automated investigation. Which device (host name) was that investigation launched against?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident involving Execution & Discovery on one endpoint, an alert for "Suspicious PowerShell download or encoded command execution" was raised. The activity was associated with the account `samuelf` (SID `S-1-5-21-1870156660-7534030218-135086563-1193`), where `winword.exe` opened `c:\scripts\rs4_winatp-intro-invoice.docm` (PID 9780) and then `powershell.exe` (PID 8604) ran with `-exec bypass`, reconstructing a Base64 payload, writing `winatp-intro-backdoor.exe` to the desktop, and creating/running a scheduled task named ''yrei''.'
    question: 'Following this activity, an analyst (u141@ash.alpineskihouse.co) manually triggered an Automated investigation. Which device (host name) was that investigation launched against?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10e (FQDN: vnevado-win10e.vnevado.alpineskihouse.co)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10e (FQDN: vnevado-win10e.vnevado.alpineskihouse.co)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process on the device with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f` executed a suspicious PowerShell download or encoded command.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'An Automated investigation was started manually on the host `vnevado-win10e` to review the threat artifacts for possible remediation.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
