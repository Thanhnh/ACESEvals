tasks:
- task_id: incident_34_latest_cleaned_test_set_task_46
  title: incident_34_latest_cleaned_test_set_task_46
  description: 'For the suspicious LDAP query alert linked to the same user, which process image (file name) was responsible for executing the reconnaissance query?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an alert was raised on an endpoint where an uncommon file `winatp-intro-backdoor.exe` was created and then registered for persistence via the command line `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe` (Process ID 10208), with the associated IP address `72.5.72.208`. Moments later, the same compromised user account triggered another alert for a suspicious LDAP query, indicating potential reconnaissance of the domain controller for privileged users, groups and interesting assets.'
    question: 'For the suspicious LDAP query alert linked to the same user, which process image (file name) was responsible for executing the reconnaissance query?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winword.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winword.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d` had an uncommon file created on their machine and added to a Run Key for persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On the same compromised machine, a suspicious LDAP reconnaissance query was executed by the process `winword.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
