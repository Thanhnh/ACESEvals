tasks:
- task_id: incident_34_latest_cleaned_test_set_task_15
  title: incident_34_latest_cleaned_test_set_task_15
  description: 'Earlier in the same incident, an alert fired for a suspicious process executing a PowerShell command that decoded a base64 blob, wrote it to the desktop and created a scheduled task. What was the process ID of that PowerShell process and when was it created (UTC)?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert titled "An uncommon file was created and added to a Run Key" was raised: an uncommon executable was created on the machine and then registered for persistence via the command line `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe` (Process ID 10208, created 2024-06-26T13:17:18.8268389Z). The activity was also associated with the IP address `72.5.72.208`.'
    question: 'Earlier in the same incident, an alert fired for a suspicious process executing a PowerShell command that decoded a base64 blob, wrote it to the desktop and created a scheduled task. What was the process ID of that PowerShell process and when was it created (UTC)?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 8604, Created time (UTC): 2024-06-26T12:00:39.2886108Z (the command line was `"powershell.exe" -w movedn -exec bypass -command cd /;$filebase64prefix = ''''; ... [io.file]::writeallbytes($fullpath,$file); ... schtasks /run /tn yrei`, which dropped `winatp-intro-backdoor.exe`)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 8604, Created time (UTC): 2024-06-26T12:00:39.2886108Z (the command line was `"powershell.exe" -w movedn -exec bypass -command cd /;$filebase64prefix = ''''; ... [io.file]::writeallbytes($fullpath,$file); ... schtasks /run /tn yrei`, which dropped `winatp-intro-backdoor.exe`)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `samuelf` was involved in an alert where an uncommon file was created on the machine and added to a Run Key for persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same machine, a suspicious process executed a PowerShell command: Process ID `8604`, created at `2024-06-26t12:00:39.2886108z`, with command line `"powershell.exe" -w movedn -exec bypass -command cd /;$filebase64prefix = '''';... $file= [convert]::frombase64string([string]$filebase64);$filename= ''winatp-intro-backdoor.exe'';$desktop=[environment]::getfolderpath(''desktop'');$fullpath = join-path $desktop $filename;[io.file]::writeallbytes($fullpath,$file);copy $fullpath $desktop;schtasks /create /sc once /tn yrei /tr $fullpath /st (get-date).addminutes(-2).tostring(''hh:mm'') /f;$settings = new-scheduledtasksettingsset -allowstartifonbatteries -dontstopifgoingonbatteries;set-scheduledtask -taskname ''yrei'' -settings $settings;schtasks /run /tn yrei`, which decoded a base64 payload, wrote `winatp-intro-backdoor.exe` to the desktop, and created and ran a scheduled task named `yrei` for persistence.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
