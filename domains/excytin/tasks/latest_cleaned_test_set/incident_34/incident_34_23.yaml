tasks:
- task_id: incident_34_latest_cleaned_test_set_task_23
  title: incident_34_latest_cleaned_test_set_task_23
  description: 'Based on the identifiers associated with this scheduled task creation activity, what is the account name of the user under whose context the backdoor was dropped and the task was created?'
  inherit_shared: true
  initial_context:
    incident_context: 'In this multi-stage incident, an alert titled "An anomalous scheduled task was created" fired on 2024-07-04 on the host `vnevado-win10e` (Azure AD device ID `02b8f519-1123-4228-b32a-ccb78af3449f`). A PowerShell command line (process ID 8604) was executed with `-exec bypass`, which decoded a large base64 blob, wrote it to the desktop as `winatp-intro-backdoor.exe`, and then used `schtasks.exe` to create and run a scheduled task named ''yrei'' for persistence. The security identifier (SID) tied to this activity was `S-1-5-21-1870156660-7534030218-135086563-1193`, with Entra (AAD) user ID `16320fec-8d90-403b-b7fe-78f715d4728d`.'
    question: 'Based on the identifiers associated with this scheduled task creation activity, what is the account name of the user under whose context the backdoor was dropped and the task was created?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An anomalous scheduled task was created on the device, likely used by an attacker to gain persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The scheduled task creation was performed under the user account with Name `samuelf`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
