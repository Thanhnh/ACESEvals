tasks:
- task_id: incident_34_latest_cleaned_test_set_task_11
  title: incident_34_latest_cleaned_test_set_task_11
  description: 'On the same device, a related alert indicates that PowerShell dropped a suspicious file and executed it. What is the name of that dropped file?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident involving Execution & Discovery on one endpoint, an alert was raised for ''Suspicious PowerShell download or encoded command execution''. The activity originated from the process `winword.exe` running with the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm` (Process ID 9780, created 2024-06-26T11:57:20.29Z). PowerShell is often used by attackers to bypass security protection mechanisms by executing their payload in memory without leaving a trace or touching the disk.'
    question: 'On the same device, a related alert indicates that PowerShell dropped a suspicious file and executed it. What is the name of that dropped file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'On the host with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`, a process executed PowerShell to download a file or run an encoded command, bypassing security protections.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'That PowerShell activity dropped and executed a suspicious file named `winatp-intro-backdoor.exe` on the machine.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
