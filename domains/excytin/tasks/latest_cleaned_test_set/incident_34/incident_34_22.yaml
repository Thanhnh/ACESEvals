tasks:
- task_id: incident_34_latest_cleaned_test_set_task_22
  title: incident_34_latest_cleaned_test_set_task_22
  description: 'For the "Suspicious PowerShell download or encoded command execution" alert on that same host, which process initiated the activity? Provide its process ID, creation time, and full command line.'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled "Powershell dropped a suspicious file on the machine" was raised after PowerShell wrote and executed a suspicious file named `winatp-intro-backdoor.exe` on an affected endpoint. Roughly at the same time, a second alert on the same host flagged a "Suspicious PowerShell download or encoded command execution", where a process launched PowerShell to download a file or run an encoded command — a common technique to run payloads in memory and evade detection.'
    question: 'For the "Suspicious PowerShell download or encoded command execution" alert on that same host, which process initiated the activity? Provide its process ID, creation time, and full command line.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 9780, Created Time (UTC): 2024-06-26T11:57:20.2959493Z, Command line: "winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm — i.e., Microsoft Word opening the macro-enabled document rs4_winatp-intro-invoice.docm'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 9780, Created Time (UTC): 2024-06-26T11:57:20.2959493Z, Command line: "winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm — i.e., Microsoft Word opening the macro-enabled document rs4_winatp-intro-invoice.docm'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'PowerShell dropped a suspicious file on the device `vnevado-win10e` and executed it.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same host, a suspicious PowerShell download or encoded command execution was observed, originating from the process `winword.exe` running the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm` with Process ID `9780` at `2024-06-26t11:57:20.2959493z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
