tasks:
- task_id: incident_34_latest_cleaned_test_set_task_17
  title: incident_34_latest_cleaned_test_set_task_17
  description: 'Based on this alert, what is the file name of the suspicious file that PowerShell dropped and executed on the machine?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Powershell dropped a suspicious file on the machine" was raised on 2024-07-04 at 22:35 UTC. The alert indicates that `powershell.exe` dropped a suspicious file on the device `vnevado-win10e` (Azure AD device ID `02b8f519-1123-4228-b32a-ccb78af3449f`) and then executed it. The activity was carried out in the context of the user account `samuelf` (SID `S-1-5-21-1870156660-7534030218-135086563-1193`, Azure AD user ID `16320fec-8d90-403b-b7fe-78f715d4728d`).'
    question: 'Based on this alert, what is the file name of the suspicious file that PowerShell dropped and executed on the machine?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Powershell was used to drop a suspicious file on the machine and then execute it, as detected at 2024-07-04 22:35:03 UTC by the alert `Powershell dropped a suspicious file on the machine`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The suspicious file dropped and executed by Powershell is the file with Name `winatp-intro-backdoor.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
