tasks:
- task_id: incident_34_latest_cleaned_test_set_task_61
  title: incident_34_latest_cleaned_test_set_task_61
  description: 'For the suspicious PowerShell download or encoded command execution alert on this device, which user account was associated with the activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, u141(u141@ash.alpineskihouse.co) manually initiated an Automated investigation on the host `vnevado-win10e` (AAD Device ID `02b8f519-1123-4228-b32a-ccb78af3449f`) to automatically identify and review threat artifacts for possible remediation. Almost immediately afterwards, an alert fired on the same device for a suspicious PowerShell download or encoded command execution, where a process executed PowerShell to download a file or run an encoded command — a common technique attackers use to run payloads in memory without touching the disk.'
    question: 'For the suspicious PowerShell download or encoded command execution alert on this device, which user account was associated with the activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An Automated investigation was started manually by u141(u141@ash.alpineskihouse.co) on the host with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f` (vnevado-win10e.vnevado.alpineskihouse.co) to identify and review threat artifacts for possible remediation.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same device, a suspicious PowerShell download or encoded command execution was detected, executed under the account with Name `samuelf`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
