tasks:
- task_id: incident_34_latest_cleaned_test_set_task_81
  title: incident_34_latest_cleaned_test_set_task_81
  description: 'For the Suspicious Task Scheduler activity alert on the same device, what is the file name of the process used to create, modify, or delete the scheduled task?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident involving Execution & Discovery on one endpoint, an alert was raised for ''Suspicious PowerShell download or encoded command execution'', where a process executed PowerShell to download a file or run an encoded command. The related process was `winword.exe` opening a macro-enabled document, with ProcessId__CreatedTimeUtc__CommandLine: `9780__2024-06-26t11:57:20.2959493z__"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`. Shortly before this, on the same device, another alert flagged ''Suspicious Task Scheduler activity'', where a process involved in earlier malicious activity used Task Scheduler to create, modify, or delete a task to establish persistence.'
    question: 'For the Suspicious Task Scheduler activity alert on the same device, what is the file name of the process used to create, modify, or delete the scheduled task?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'schtasks.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'schtasks.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process on the device with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f` executed PowerShell to download a file or run an encoded command, indicating an attempt to fetch external payloads or run commands in memory.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same malicious activity then used the Task Scheduler process `schtasks.exe` to create, modify, or delete a scheduled task, establishing persistence by launching the malicious code automatically.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
