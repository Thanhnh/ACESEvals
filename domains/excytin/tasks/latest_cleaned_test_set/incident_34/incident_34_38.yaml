tasks:
- task_id: incident_34_latest_cleaned_test_set_task_38
  title: incident_34_latest_cleaned_test_set_task_38
  description: 'Moments later, a related alert reported that an uncommon file was created on the machine and added to a Registry Run Key for persistence. Which IP address was recorded as an entity in that persistence alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an alert for "Suspicious PowerShell download or encoded command execution" fired when `powershell.exe` (PID 8604, created 2024-06-26T12:00:39Z) was run with `-w movedn -exec bypass -command`, assembling a large base64 blob into a binary named `winatp-intro-backdoor.exe`, writing it to the user''s Desktop, and then registering and running a scheduled task named ''yrei'' for persistence.'
    question: 'Moments later, a related alert reported that an uncommon file was created on the machine and added to a Registry Run Key for persistence. Which IP address was recorded as an entity in that persistence alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `samuelf` executed a suspicious PowerShell command to download a file or run an encoded command, bypassing security protections.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'An uncommon file was then created on the device and added to a Run Registry Key for persistence, with the associated remote IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
