tasks:
- task_id: incident_34_latest_cleaned_test_set_task_7
  title: incident_34_latest_cleaned_test_set_task_7
  description: 'A closely related alert fired at nearly the same time reporting that a suspicious process executed a command that could be used to run a payload in memory without touching the disk. What is the file name of the process extracted in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an anomaly was detected in an ASEP registry key from IP address `72.5.72.208`, where a process (Process ID 10208, created 2024-06-26T13:17:18.8268389Z) ran the command `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe`, establishing persistence so the payload runs after a reboot.'
    question: 'A closely related alert fired at nearly the same time reporting that a suspicious process executed a command that could be used to run a payload in memory without touching the disk. What is the file name of the process extracted in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d` had a process register a suspicious command or file in an ASEP registry key, establishing persistence after reboot.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious process then executed the PowerShell command via the process with ExtractedFileName `powershell.exe`, likely running a payload in memory to evade detection.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
