tasks:
- task_id: incident_34_latest_cleaned_test_set_task_72
  title: incident_34_latest_cleaned_test_set_task_72
  description: 'For the alert about the uncommon file being created and added to a Run Key, which user account was involved in this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an Automated investigation was manually initiated by u141(u141@ash.alpineskihouse.co) on the host `vnevado-win10e` (AadDeviceId: 02b8f519-1123-4228-b32a-ccb78af3449f) to automatically identify and review threat artifacts for possible remediation. Around the same time, a related alert was raised indicating that an uncommon file was created on a machine and then added to a Registry Run Key, a common persistence technique used by attackers to retain access after a reboot.'
    question: 'For the alert about the uncommon file being created and added to a Run Key, which user account was involved in this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An Automated investigation was started manually on the host with HostName `vnevado-win10e`, initiated by u141(u141@ash.alpineskihouse.co) to identify and review threat artifacts for possible remediation.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that host, an uncommon file was created and added to a Run Key for persistence by the account with Name `samuelf`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
