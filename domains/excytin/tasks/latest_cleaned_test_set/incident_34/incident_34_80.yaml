tasks:
- task_id: incident_34_latest_cleaned_test_set_task_80
  title: incident_34_latest_cleaned_test_set_task_80
  description: 'For the related ASEP registry autostart anomaly alert, which IP address was recorded as an entity involved in that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident on a single endpoint, a suspicious PowerShell command line was observed: `winword.exe` opened the macro document `c:\scripts\rs4_winatp-intro-invoice.docm` (PID 9780), which spawned `powershell.exe` (PID 8604) with an obfuscated, base64-encoded payload that was written to the user''s desktop as `winatp-intro-backdoor.exe`. The PowerShell then used `schtasks.exe` to create and immediately run a scheduled task named ''yrei'' pointing at that backdoor executable. Seconds later, a related alert fired for an anomaly detected in an ASEP registry key, where a process registered a suspicious command or file that would run after a reboot to maintain access.'
    question: 'For the related ASEP registry autostart anomaly alert, which IP address was recorded as an entity involved in that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious PowerShell command line was executed by the user account with SID `S-1-5-21-1870156660-7534030218-135086563-1193`, likely used to download an external payload or run code in memory.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the PowerShell activity, a process registered a suspicious command in an ASEP registry key for persistence, and the related host communicated with the remote IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
