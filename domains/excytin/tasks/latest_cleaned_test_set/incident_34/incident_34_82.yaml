tasks:
- task_id: incident_34_latest_cleaned_test_set_task_82
  title: incident_34_latest_cleaned_test_set_task_82
  description: 'For the related suspicious PowerShell download or encoded command execution alert, what is the security identifier (SID) of the account under which this activity occurred?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery on one endpoint, an anomalous scheduled task was created for persistence: the process `schtasks.exe` (Process ID 1348, created 2024-06-26T12:00:40Z) ran the command line `"schtasks.exe" /create /sc once /tn yrei /tr "c:\users\samuelf\onedrive - (new) alpineskihouse\desktop\winatp-intro-backdoor.exe" /st 11:58 /f`. Moments later, a related alert fired for a suspicious PowerShell download or encoded command execution, where a process used PowerShell to download a file or run an encoded command to execute a payload in memory.'
    question: 'For the related suspicious PowerShell download or encoded command execution alert, what is the security identifier (SID) of the account under which this activity occurred?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1870156660-7534030218-135086563-1193'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1870156660-7534030218-135086563-1193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An anomalous scheduled task was created using the process `powershell.exe`, likely to establish persistence on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-1-5-21-1870156660-7534030218-135086563-1193` executed a suspicious PowerShell download or encoded command.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
