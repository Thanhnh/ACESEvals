tasks:
- task_id: incident_34_latest_cleaned_test_set_task_1
  title: incident_34_latest_cleaned_test_set_task_1
  description: 'For that related alert about the uncommon file being added to a Run Key, what IP address was observed as an entity in the alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a ''Suspicious Task Scheduler activity'' alert fired on an endpoint after a PowerShell process (PID 8604, launched 2024-06-26T12:00:39Z) decoded a large base64 blob, wrote `winatp-intro-backdoor.exe` to the user samuelf''s desktop, and then used `schtasks.exe` to create and immediately run a scheduled task named ''yrei'' for persistence. A related alert on the same device reported that an uncommon file was created and then added to a Registry Run Key so it would execute after reboot.'
    question: 'For that related alert about the uncommon file being added to a Run Key, what IP address was observed as an entity in the alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process previously involved in malicious activity used Task Scheduler to create, modify, or delete a scheduled task on the host with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`, likely to establish persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On the same machine, an uncommon file was created and added to a Registry Run Key for persistence, with related network activity involving the IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
