tasks:
- task_id: incident_34_latest_cleaned_test_set_task_64
  title: incident_34_latest_cleaned_test_set_task_64
  description: 'For the related alert about the uncommon file being added to a Run Key, what IP address was recorded as an entity involved in that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, PowerShell (`powershell.exe`, PID 8604) was observed executing a heavily obfuscated command line that reassembled a base64-encoded PE payload, wrote it to the desktop as `winatp-intro-backdoor.exe`, and then created and ran a scheduled task named ''yrei'' to execute it. A related alert on the same machine shows that an uncommon file was created and then added to a Registry Run Key so it would execute after reboot, a common persistence technique.'
    question: 'For the related alert about the uncommon file being added to a Run Key, what IP address was recorded as an entity involved in that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'On the host `vnevado-win10e`, PowerShell dropped a suspicious file on the machine and executed it.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The uncommon file created on that host was then added to a Registry Run Key for persistence, and the activity was associated with the remote IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
