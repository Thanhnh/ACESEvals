tasks:
- task_id: incident_34_latest_cleaned_test_set_task_56
  title: incident_34_latest_cleaned_test_set_task_56
  description: 'Around the same time, an automated investigation was manually initiated by the user u141@ash.alpineskihouse.co to review the threat artifacts. On which device (host name) was that automated investigation launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a ''Suspicious Task Scheduler activity'' alert was raised on 2024-07-04. The account `samuelf` (SID S-1-5-21-1870156660-7534030218-135086563-1193) ran an obfuscated `powershell.exe` command (PID 8604) that decoded a base64 blob, dropped `winatp-intro-backdoor.exe` to the user''s desktop, and then used `schtasks.exe` to create (PID 1348) and run (PID 1616) a scheduled task named ''yrei'' pointing at that binary — a likely persistence attempt.'
    question: 'Around the same time, an automated investigation was manually initiated by the user u141@ash.alpineskihouse.co to review the threat artifacts. On which device (host name) was that automated investigation launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10e (fully qualified: vnevado-win10e.vnevado.alpineskihouse.co)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10e (fully qualified: vnevado-win10e.vnevado.alpineskihouse.co)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A process previously involved in malicious activity used Task Scheduler to create, modify, or delete a scheduled task for persistence on host `vnevado-win10e`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'In response, an Automated investigation was manually initiated by u141(u141@ash.alpineskihouse.co) on the same host `vnevado-win10e` (vnevado-win10e.vnevado.alpineskihouse.co) to identify and review threat artifacts for possible remediation.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The end entity is the host with HostName `vnevado-win10e`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
