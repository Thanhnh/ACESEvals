tasks:
- task_id: incident_34_latest_cleaned_test_set_task_66
  title: incident_34_latest_cleaned_test_set_task_66
  description: 'A related alert shows that PowerShell dropped a suspicious file on the same machine and executed it. What is the name of the file that PowerShell dropped?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired indicating that an uncommon file was created on a machine and then added to a Registry Run Key so it would execute after a reboot — a common persistence technique. The activity was associated with the IP address `72.5.72.208` and a compromised user account.'
    question: 'A related alert shows that PowerShell dropped a suspicious file on the same machine and executed it. What is the name of the file that PowerShell dropped?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `samuelf` created an uncommon file on the machine and added it to a Run Key for persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'PowerShell dropped and executed the suspicious file `winatp-intro-backdoor.exe` on the machine.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
