tasks:
- task_id: incident_34_latest_cleaned_test_set_task_85
  title: incident_34_latest_cleaned_test_set_task_85
  description: 'What is the name of the suspicious file that PowerShell dropped and executed on the machine?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired for an anomaly detected in an ASEP (Auto-Start Extension Point) registry key, where a process registered a suspicious command or file that would run after a reboot — a common persistence technique used by attackers to avoid losing access when a machine is powered off. This activity was associated with the IP address `72.5.72.208`. Seconds later on the same host, another alert reported that PowerShell dropped a suspicious file on the machine and executed it.'
    question: 'What is the name of the suspicious file that PowerShell dropped and executed on the machine?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An anomaly was detected in the ASEP registry on host `vnevado-win10e`, where a process registered a suspicious command to run after reboot for persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same host, PowerShell dropped and executed a suspicious file named `winatp-intro-backdoor.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
