tasks:
- task_id: incident_34_latest_cleaned_test_set_task_40
  title: incident_34_latest_cleaned_test_set_task_40
  description: 'A closely related alert in this same incident reported an anomaly detected in an ASEP registry key, where a process registered a suspicious command or file that would run after a reboot. What is the IP address entity associated with that ASEP registry alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving execution and discovery on one endpoint, an alert titled ''Suspicious PowerShell download or encoded command execution'' was raised on 2024-07-04. The investigation showed that `winword.exe` (process ID 9780) opened the document `c:\scripts\rs4_winatp-intro-invoice.docm`, which then spawned `powershell.exe` (process ID 8604) running a heavily obfuscated command that reassembled a base64 blob, wrote `winatp-intro-backdoor.exe` to the user''s Desktop, and registered/ran a scheduled task named ''yrei'' for persistence.'
    question: 'A closely related alert in this same incident reported an anomaly detected in an ASEP registry key, where a process registered a suspicious command or file that would run after a reboot. What is the IP address entity associated with that ASEP registry alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d` executed a suspicious PowerShell command to download a file or run an encoded command.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following this, a process registered a suspicious command in an ASEP registry key for persistence, associated with the IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
