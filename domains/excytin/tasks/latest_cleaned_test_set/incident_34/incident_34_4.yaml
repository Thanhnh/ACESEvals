tasks:
- task_id: incident_34_latest_cleaned_test_set_task_4
  title: incident_34_latest_cleaned_test_set_task_4
  description: 'For that follow-on Task Scheduler persistence alert, which user account was involved? Provide the Microsoft Entra (Azure AD) user ID.'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery on an endpoint, a ''Suspicious PowerShell command line'' alert was raised. The activity traced back to `winword.exe` (Process ID 9780) launched with the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`, and the malicious file `winatp-intro-backdoor.exe` was observed. Roughly a second later, a related alert fired indicating that a process involved in the earlier malicious activity used Task Scheduler to create, modify, or delete a task in an attempt to establish persistence.'
    question: 'For that follow-on Task Scheduler persistence alert, which user account was involved? Provide the Microsoft Entra (Azure AD) user ID.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'AadUserId: 16320fec-8d90-403b-b7fe-78f715d4728d'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'AadUserId: 16320fec-8d90-403b-b7fe-78f715d4728d'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious PowerShell command line was executed on the machine: process ID `8604` created at `2024-06-26t12:00:39.2886108z` ran `powershell.exe -w movedn -exec bypass -command ...`, which decoded a large base64 blob into `winatp-intro-backdoor.exe` on the desktop, then used schtasks to create, configure, and run a scheduled task named `yrei`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The scheduled task activity from that PowerShell process triggered a Suspicious Task Scheduler alert, attributed to the user account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d`, indicating an attempt to establish persistence by automatically launching the backdoor.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
