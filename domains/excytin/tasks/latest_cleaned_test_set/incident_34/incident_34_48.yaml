tasks:
- task_id: incident_34_latest_cleaned_test_set_task_48
  title: incident_34_latest_cleaned_test_set_task_48
  description: 'Following this activity chain on the same host, a malicious payload was dropped and executed on the endpoint. What is the file name of that executed payload?'
  inherit_shared: true
  initial_context:
    incident_context: 'A multi-stage incident involving Execution & Discovery was reported on host `vnevado-win10e` (AAD device ID `02b8f519-1123-4228-b32a-ccb78af3449f`) for user account `samuelf` (AAD user ID `16320fec-8d90-403b-b7fe-78f715d4728d`). A suspicious PowerShell command line alert was triggered on the machine, following the launch of `winword.exe` with the macro-enabled document `c:\scripts\rs4_winatp-intro-invoice.docm` (PID 9780, 2024-06-26T11:57:20Z) and a scheduled task execution via `schtasks.exe /run /tn yrei` (PID 1616, 2024-06-26T12:00:40Z). This behavior may indicate PowerShell being abused to download external payloads or execute code in memory to avoid detection.'
    question: 'Following this activity chain on the same host, a malicious payload was dropped and executed on the endpoint. What is the file name of that executed payload?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious PowerShell command line was observed on the machine, which launched the file `winatp-intro-backdoor.exe`, indicating a potential in-memory payload execution or backdoor installation.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
