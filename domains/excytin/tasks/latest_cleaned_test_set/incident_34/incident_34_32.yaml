tasks:
- task_id: incident_34_latest_cleaned_test_set_task_32
  title: incident_34_latest_cleaned_test_set_task_32
  description: 'What is the name of the suspicious file that PowerShell dropped and executed on the machine?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident involving Execution & Discovery on an endpoint, a suspicious LDAP query was executed, indicating potential reconnaissance activity aimed at learning the organization''s structure by querying the domain controller for administrative users, groups, and interesting assets. This activity was traced back to the process `winword.exe` launched with the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm` (Process ID 9780, created at 2024-06-26T11:57:20.29Z). A related alert in the same incident shows that PowerShell dropped a suspicious file on the machine and executed it.'
    question: 'What is the name of the suspicious file that PowerShell dropped and executed on the machine?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-1870156660-7534030218-135086563-1193` executed a suspicious LDAP query against the domain controller, indicating reconnaissance activity to map out administrative users, groups, and valuable assets.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the reconnaissance, PowerShell dropped and executed a suspicious file named `winatp-intro-backdoor.exe` on the machine, establishing a backdoor.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
