tasks:
- task_id: incident_34_latest_cleaned_test_set_task_8
  title: incident_34_latest_cleaned_test_set_task_8
  description: 'Shortly before this scheduled-task alert, an analyst (u141@ash.alpineskihouse.co) manually launched an Automated investigation on the affected endpoint. What is the Azure AD (AAD) device ID of the device that investigation targeted?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an anomalous scheduled task was created on an endpoint for persistence. The account `samuelf` (SID S-1-5-21-1870156660-7534030218-135086563-1193) ran `powershell.exe` (PID 8604) with an encoded/base64 payload that wrote `winatp-intro-backdoor.exe` to the user''s desktop, then used `schtasks.exe` (PID 1348) to create and run a task named ''yrei'' pointing to that executable.'
    question: 'Shortly before this scheduled-task alert, an analyst (u141@ash.alpineskihouse.co) manually launched an Automated investigation on the affected endpoint. What is the Azure AD (AAD) device ID of the device that investigation targeted?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '02b8f519-1123-4228-b32a-ccb78af3449f (the AAD device ID of vnevado-win10e.vnevado.alpineskihouse.co)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '02b8f519-1123-4228-b32a-ccb78af3449f (the AAD device ID of vnevado-win10e.vnevado.alpineskihouse.co)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An anomalous scheduled task was created on host `vnevado-win10e`, potentially used by an attacker to gain persistence on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'In response, an Automated investigation was started manually by u141(u141@ash.alpineskihouse.co) on that same device, `vnevado-win10e.vnevado.alpineskihouse.co`, which has AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
