tasks:
- task_id: incident_34_latest_cleaned_test_set_task_42
  title: incident_34_latest_cleaned_test_set_task_42
  description: 'Following this task-scheduler activity on the same device, a related alert in this incident was triggered by a built-in Windows command-line scripting interpreter that the attacker used for further execution/discovery. What is the file name of that process?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident involving Execution & Discovery on a single endpoint, a ''Suspicious Task Scheduler activity'' alert was raised on host `vnevado-win10e` (AAD device ID `02b8f519-1123-4228-b32a-ccb78af3449f`) for the account `samuelf` (SID `S-1-5-21-1870156660-7534030218-135086563-1193`). The alert shows `schtasks.exe` being used first to create a scheduled task (PID 1348, command line: `"schtasks.exe" /create /sc once /tn yrei /tr "c:\users\samuelf\onedrive - (new) alpineskihouse\desktop\winatp-intro-backdoor.exe" /st 11:58 /f`) and then to run it (PID 1616, `"schtasks.exe" /run /tn yrei`), pointing to `winatp-intro-backdoor.exe` for persistence.'
    question: 'Following this task-scheduler activity on the same device, a related alert in this incident was triggered by a built-in Windows command-line scripting interpreter that the attacker used for further execution/discovery. What is the file name of that process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process previously involved in malicious activity leveraged Task Scheduler to create, modify, or delete a scheduled task in order to automatically launch malicious code and establish persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The suspicious Task Scheduler activity was carried out by the process with ExtractedFileName `powershell.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
