tasks:
- task_id: incident_34_latest_cleaned_test_set_task_33
  title: incident_34_latest_cleaned_test_set_task_33
  description: 'For the related alert about the uncommon file being added to a Run Key, what IP address was recorded as an entity involved in that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery on an endpoint, a suspicious PowerShell command was executed after `winword.exe` opened `c:\scripts\rs4_winatp-intro-invoice.docm` (PID 9780). The PowerShell process (PID 8604) decoded a base64 blob, wrote `winatp-intro-backdoor.exe` to the user''s Desktop, and created and ran a scheduled task named ''yrei''. Roughly at the same time, a related alert fired indicating that an uncommon file was created on this machine and then added to a Registry Run Key so it would execute after a reboot — a common persistence technique.'
    question: 'For the related alert about the uncommon file being added to a Run Key, what IP address was recorded as an entity involved in that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process executed PowerShell to download a file or run an encoded command under the user account with SID `S-1-5-21-1870156660-7534030218-135086563-1193`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same activity led to an uncommon file being created and added to a Run Key for persistence, which communicated with the remote IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
