tasks:
- task_id: incident_34_latest_cleaned_test_set_task_54
  title: incident_34_latest_cleaned_test_set_task_54
  description: 'A closely related alert reported that an anomalous scheduled task was created on the device for persistence. Which user account name was associated with the creation of that anomalous scheduled task?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Suspicious Task Scheduler activity'' alert was raised after a process involved in earlier malicious activity used Task Scheduler to run a task. The process details were `1616__2024-06-26t12:00:40.6793914z__"schtasks.exe" /run /tn yrei`, indicating a possible attempt to launch malicious code automatically and establish persistence.'
    question: 'A closely related alert reported that an anomalous scheduled task was created on the device for persistence. Which user account name was associated with the creation of that anomalous scheduled task?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process with the file name `winatp-intro-backdoor.exe` used Task Scheduler to create, modify, or delete a scheduled task, indicating an attempt to establish persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The anomalous scheduled task was created under the user account with Name `samuelf`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
