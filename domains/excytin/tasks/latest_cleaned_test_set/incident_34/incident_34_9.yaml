tasks:
- task_id: incident_34_latest_cleaned_test_set_task_9
  title: incident_34_latest_cleaned_test_set_task_9
  description: 'Around the same time, an alert was raised for suspicious Task Scheduler activity used to create, modify, or delete a task for persistence. What was the name of the process file involved in that Task Scheduler alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery on an endpoint, a suspicious LDAP query was executed indicating potential reconnaissance activity, where attackers query the domain controller for administrative users, groups and interesting assets. This activity was linked to the process `winword.exe` launched with the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm` (Process ID 9780, created 2024-06-26T11:57:20.2959493Z).'
    question: 'Around the same time, an alert was raised for suspicious Task Scheduler activity used to create, modify, or delete a task for persistence. What was the name of the process file involved in that Task Scheduler alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'schtasks.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'schtasks.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d` executed a suspicious LDAP query against the domain controller, indicating reconnaissance activity to map out administrative users, groups, and valuable assets.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the reconnaissance, the same compromised account was involved in suspicious Task Scheduler activity, where the process `schtasks.exe` was used to create, modify, or delete a scheduled task in order to automatically launch malicious code and establish persistence.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
