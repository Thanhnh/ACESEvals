tasks:
- task_id: incident_34_latest_cleaned_test_set_task_62
  title: incident_34_latest_cleaned_test_set_task_62
  description: 'A closely related alert, "Anomaly detected in ASEP registry", was raised at nearly the same time on the same machine. What is the account name of the user associated with that ASEP registry anomaly alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an alert titled "An uncommon file was created and added to a Run Key" fired on host `vnevado-win10e` (AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`). The file `winatp-intro-backdoor.exe` was created and then registered for persistence via the command line `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe` (Process ID 10208), with the associated account SID `S-1-5-21-1870156660-7534030218-135086563-1193` and remote IP `72.5.72.208`.'
    question: 'A closely related alert, "Anomaly detected in ASEP registry", was raised at nearly the same time on the same machine. What is the account name of the user associated with that ASEP registry anomaly alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An uncommon file was created on the host `vnevado-win10e` and added to a Run Key registry location for persistence after reboot.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The anomalous ASEP registry modification, where a process registered a suspicious command or file to be run after reboot, was performed under the user account `samuelf`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
