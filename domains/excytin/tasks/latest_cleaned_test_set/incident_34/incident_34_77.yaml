tasks:
- task_id: incident_34_latest_cleaned_test_set_task_77
  title: incident_34_latest_cleaned_test_set_task_77
  description: 'Shortly before this PowerShell activity, a related alert reported that a process registered a suspicious command or file in an ASEP (Auto-Start Extensibility Point) registry key so it would run after a reboot. Which IP address was observed as an entity in that ASEP registry anomaly alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Persistence on an endpoint, an alert titled "Powershell dropped a suspicious file on the machine" was raised. The process `powershell.exe` (PID 8604, created 2024-06-26T12:00:39Z) ran with `-w movedn -exec bypass -command`, rebuilt a Base64 blob of a PE file, wrote it to the user''s Desktop as `winatp-intro-backdoor.exe`, and then created and ran a scheduled task named ''yrei'' to execute it.'
    question: 'Shortly before this PowerShell activity, a related alert reported that a process registered a suspicious command or file in an ASEP (Auto-Start Extensibility Point) registry key so it would run after a reboot. Which IP address was observed as an entity in that ASEP registry anomaly alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d` was compromised, and PowerShell dropped a suspicious file on the machine and executed it.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The dropped process registered a suspicious command in an ASEP registry key for persistence and communicated with the remote IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
