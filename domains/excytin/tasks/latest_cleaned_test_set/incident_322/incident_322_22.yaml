        title: Checkpoint 1
        description: 'A risky user account with SID `S-1-5-21-1840151686-3534835288-156286563-1127` performed suspicious Azure Resource Management (ARM) activities from a risky sign-in session at 2024-08-01 13:19:20 UTC.'
