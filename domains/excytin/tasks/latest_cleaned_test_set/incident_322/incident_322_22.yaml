    incident_context: 'During an investigation, an alert titled ''Suspicious Azure Resource Management activities by a risky user'' was raised on 2024-08-01 at 13:19 UTC, where suspicious cloud Azure Resource Management (ARM) operations were performed from the IP address `253.1.244.215` by a user account that had signed in during a risky session. This alert was triggered based on a Microsoft Defender for Cloud alert combined with Microsoft Entra ID Protection risk scores. About 30 minutes later, a related alert indicated that a malicious link was clicked on a device associated with the same compromised account.'
    question: 'For the later alert where a malicious URL was clicked on the device, what was the full URL that was clicked?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
