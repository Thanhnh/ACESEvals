tasks:
- task_id: incident_322_latest_cleaned_test_set_task_38
  title: incident_322_latest_cleaned_test_set_task_38
  description: 'Beyond the PowerShell activity, the related alert activity shows that the AD database was actually extracted using a built-in Windows Active Directory management command-line utility. What is the file name of that executable?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an alert titled "Suspicious credential dump from NTDS.dit" was raised on the domain controller host `vnevado-dc`. Attackers dump NTDS.dit in order to obtain the user credentials stored on the domain controller. In this alert, an encoded PowerShell command was executed (`powershell.exe` with `-encodedcommand iabuahqazabzahuadabpagwa...`, Process ID 2556, created 2024-08-01T12:37:29.65Z) which referenced the file `c:\temp\Active Directory\ntds.dit` and uploaded it to Azure storage.'
    question: 'Beyond the PowerShell activity, the related alert activity shows that the AD database was actually extracted using a built-in Windows Active Directory management command-line utility. What is the file name of that executable?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ntdsutil.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ntdsutil.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'An attacker executed the process `ntdsutil.exe` on the domain controller at 2024-08-01 12:49:26 UTC to dump the NTDS.dit database and obtain stored user credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
