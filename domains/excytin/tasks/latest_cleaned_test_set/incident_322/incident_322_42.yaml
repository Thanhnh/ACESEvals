tasks:
- task_id: incident_322_latest_cleaned_test_set_task_42
  title: incident_322_latest_cleaned_test_set_task_42
  description: 'From which source IP address were the suspicious Azure Resource Management activities performed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a user clicked on a link in an email (`https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`) that was later quarantined by zero-hour auto purge (ZAP), as flagged by Microsoft Defender for Office 365. About 25 minutes later, the same compromised user account was seen performing suspicious Azure Resource Management (ARM) activities from a risky sign-in session, reported by Microsoft Defender for Cloud together with Microsoft Entra ID Protection risk scores.'
    question: 'From which source IP address were the suspicious Azure Resource Management activities performed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '253.1.244.215'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '253.1.244.215'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with email `alyssat@vnevado.alpineskihouse.co` clicked a link in an email that was later quarantined by zero-hour auto purge (ZAP) at 2024-08-01 12:54:55 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise of that user, suspicious Azure Resource Management activities were performed by the risky user account from the IP address `253.1.244.215` at 2024-08-01 13:19:20 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
