tasks:
- task_id: incident_322_latest_cleaned_test_set_task_2
  title: incident_322_latest_cleaned_test_set_task_2
  description: 'About 20 minutes earlier, a related alert fired for a suspicious credential dump from NTDS.dit on the domain controller targeted by these Azure resource operations. What is the name of the executable that was used to perform that credential dump?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, Microsoft Defender for Resource Manager raised an alert titled ''Azure Resource Manager operation from suspicious proxy IP address'' on 2024-08-01 13:09:13 UTC. The operation came from IP `253.1.244.215`, which is associated with proxy services such as TOR, and involved the account `alyssat@vnevado.alpineskihouse.co` (Hailey Johnson, AAD user ID 5e5dd0bd-f7ed-4583-8e9e-52f91e31a360) acting on resources in resource group `ctfcat` of subscription `7e838342-601f-4552-9baf-0dfb300cf555`, including the virtual machine, its network interface, and a shutdown schedule.'
    question: 'About 20 minutes earlier, a related alert fired for a suspicious credential dump from NTDS.dit on the domain controller targeted by these Azure resource operations. What is the name of the executable that was used to perform that credential dump?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ntdsutil.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ntdsutil.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An Azure Resource Manager operation was detected from a suspicious proxy IP address, associated with the host `vnevado-dc` (Field: HostName).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same domain controller host, a suspicious credential dump from NTDS.dit was detected, where attackers dumped the NTDS.dit database to obtain domain users'' credentials.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The credential dump was performed by the process with ExtractedFileName `ntdsutil.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
