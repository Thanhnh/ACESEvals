tasks:
- task_id: incident_322_latest_cleaned_test_set_task_5
  title: incident_322_latest_cleaned_test_set_task_5
  description: 'For the follow-up alert about suspicious Azure Resource Management activities by the risky user, what was the source IP address associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised for ''Email messages containing malicious URL removed after delivery''. The email was sent from `raphaelt@vnevado.alpineskihouse.co` (sender IP `202.205.215.225`) to the mailbox `alyssat@vnevado.alpineskihouse.co`, and contained the malicious URL `dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io`. Roughly 35 minutes later, the same compromised user account triggered another alert for suspicious Azure Resource Management (ARM) activities performed from a risky sign-in session.'
    question: 'For the follow-up alert about suspicious Azure Resource Management activities by the risky user, what was the source IP address associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '253.1.244.215'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '253.1.244.215'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'At 2024-08-01 12:44:53 UTC, the user account with AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360` received an email containing a malicious URL, which was delivered and later removed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'At 2024-08-01 13:19:20 UTC, that compromised user''s risky session was used to perform suspicious Azure Resource Management (ARM) activities originating from the IP address `253.1.244.215`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
