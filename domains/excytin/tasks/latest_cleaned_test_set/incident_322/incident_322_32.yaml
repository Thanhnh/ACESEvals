tasks:
- task_id: incident_322_latest_cleaned_test_set_task_32
  title: incident_322_latest_cleaned_test_set_task_32
  description: 'Based on the entities in this alert, what is the display name of the user account that was involved in clicking the malicious URL on that device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage security incident, an alert titled `Malicious URL was clicked on that device` was raised on 2024-08-01 at 13:49 UTC. The malicious URL `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/` was opened on the host `vnevado-win11h` (AadDeviceId `76707c40-3343-490e-9205-88fdb51aefe0`, IP `172.33.118.200`) through the browser process `msedge.exe` with ProcessId 4256, created at 2024-08-01T13:42:52.04. The activity was tied to the account with SID `S-1-5-21-1840151686-3534835288-156286563-1127` and AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`.'
    question: 'Based on the entities in this alert, what is the display name of the user account that was involved in clicking the malicious URL on that device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Hailey Johnson'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Hailey Johnson'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious URL was clicked on the device at 2024-08-01 13:49:58 UTC, and the alert ''Malicious URL was clicked on that device'' was raised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The account associated with this malicious URL click is the user with Name `Hailey Johnson`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
