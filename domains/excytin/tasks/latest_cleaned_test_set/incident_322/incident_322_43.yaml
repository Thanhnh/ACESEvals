tasks:
- task_id: incident_322_latest_cleaned_test_set_task_43
  title: incident_322_latest_cleaned_test_set_task_43
  description: 'In the proxy log alert associated with the host `vnevado-win11h.vnevado.alpineskihouse.co`, what was the malicious destination URL/domain that the host connected to?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert was raised for suspicious Azure Resource Management (ARM) activities performed by a user account that signed in to a risky session from the IP address `253.1.244.215`. Pivoting from the compromised account leads to a device on which a malicious link was clicked, and that same device also generated proxy log activity: a connection originating from `231.60.52.209` - `vnevado-win11h.vnevado.alpineskihouse.co` was flagged by the proxy as malicious.'
    question: 'In the proxy log alert associated with the host `vnevado-win11h.vnevado.alpineskihouse.co`, what was the malicious destination URL/domain that the host connected to?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'login.micro.demo.antoinetest.ovh'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'login.micro.demo.antoinetest.ovh'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with SID `S-1-5-21-1840151686-3534835288-156286563-1127` signed in to a risky session and performed suspicious Azure Resource Management (ARM) activities at 2024-08-01 13:19:20 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The device with HostName `vnevado-win11h` was involved, where a malicious URL was clicked on at 2024-08-01 13:49:58 UTC.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Proxy logs from that host (231.60.52.209 - vnevado-win11h.vnevado.alpineskihouse.co) show a connection to the malicious URL `login.micro.demo.antoinetest.ovh`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
