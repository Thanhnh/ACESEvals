tasks:
- task_id: incident_322_latest_cleaned_test_set_task_55
  title: incident_322_latest_cleaned_test_set_task_55
  description: 'In the alert reporting that a user accessed a link in an email that was subsequently quarantined by ZAP, what is the full URL that the user accessed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, Microsoft Defender for Office 365 detected that a user with mailbox `alyssat@vnevado.alpineskihouse.co` clicked on a link that was determined to be malicious. Follow-on alerts showed that emails containing this malicious link were delivered and later removed by zero-hour auto purge (ZAP), and that the user had already accessed the link before the message was quarantined.'
    question: 'In the alert reporting that a user accessed a link in an email that was subsequently quarantined by ZAP, what is the full URL that the user accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The mailbox recipient `alyssat@vnevado.alpineskihouse.co` received an email and a potentially malicious URL click was detected at 2024-08-01 12:44:53 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account `Hailey Johnson` was also affected by the campaign — emails containing the malicious URL were delivered and later removed after delivery.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The user accessed the link in the email that was subsequently quarantined by zero-hour auto purge (ZAP); the malicious URL clicked was `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
