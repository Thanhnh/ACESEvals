tasks:
- task_id: incident_322_latest_cleaned_test_set_task_31
  title: incident_322_latest_cleaned_test_set_task_31
  description: 'Which user account was identified as having clicked the link in the email that was later quarantined by ZAP?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, proxy logs flagged a connection from 231.60.52.209 (host vnevado-win11h.vnevado.alpineskihouse.co) to the malicious URL `login.micro.demo.antoinetest.ovh`, with additional traffic observed from 228.3.31.94. Follow-up telemetry showed the malicious URL was actually clicked on that device, and a related Microsoft Defender for Office 365 alert reported that a user had clicked a link in an email that was subsequently quarantined by zero-hour auto purge (ZAP).'
    question: 'Which user account was identified as having clicked the link in the email that was later quarantined by ZAP?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Hailey Johnson'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Hailey Johnson'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The host `vnevado-win11h` was seen connecting to a malicious URL (login.micro.demo.antoinetest.ovh) in the proxy logs.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On that device, a malicious URL was clicked by the user with AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The account `Hailey Johnson` accessed a link in an email that was subsequently quarantined by zero-hour auto purge (ZAP).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
