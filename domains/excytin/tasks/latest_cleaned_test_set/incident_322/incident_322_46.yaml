tasks:
- task_id: incident_322_latest_cleaned_test_set_task_46
  title: incident_322_latest_cleaned_test_set_task_46
  description: 'For the alert reporting the potentially malicious URL click, which mailbox recipient was identified as the user who clicked the malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a proxy log alert flagged a connection from IP `231.60.52.209` (and associated IP `228.3.31.94`) to the malicious URL `login.micro.demo.antoinetest.ovh`. Tracing this activity further revealed that the malicious link originated from an email campaign — emails containing the malicious URL were delivered to a mailbox and later removed, and a potentially malicious URL click was subsequently detected for that user.'
    question: 'For the alert reporting the potentially malicious URL click, which mailbox recipient was identified as the user who clicked the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious URL connection to `login.micro.demo.antoinetest.ovh` was detected in proxy logs from the host with HostName `vnevado-win11h`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The user account `Hailey Johnson` clicked on the malicious URL on that device.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'An email containing a malicious URL was delivered and later removed for the recipient `alyssat@vnevado.alpineskihouse.co`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The potentially malicious URL click was detected for the mail recipient `alyssat@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
