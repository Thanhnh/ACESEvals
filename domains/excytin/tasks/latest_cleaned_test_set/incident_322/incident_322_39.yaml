tasks:
- task_id: incident_322_latest_cleaned_test_set_task_39
  title: incident_322_latest_cleaned_test_set_task_39
  description: 'For the final alert about suspicious Azure Resource Management activities performed by a risky user, what is the Microsoft Entra (AAD) user ID of the account involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert fired for `ntdsutil.exe` collecting Active Directory information on a domain controller. The process was launched with the command line `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q` (Process ID 6748), spawned by an encoded `powershell.exe` command (Process ID 2556) that also uploaded data to an Azure storage blob. Shortly after, related cloud alerts were raised, including an Azure Resource Manager operation coming from a suspicious proxy IP address, and finally suspicious Azure Resource Management (ARM) activities performed by a user who had signed in to a risky session.'
    question: 'For the final alert about suspicious Azure Resource Management activities performed by a risky user, what is the Microsoft Entra (AAD) user ID of the account involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '5e5dd0bd-f7ed-4583-8e9e-52f91e31a360'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '5e5dd0bd-f7ed-4583-8e9e-52f91e31a360'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'On host `vnevado-dc`, Ntdsutil.exe was launched to collect Active Directory information (credential dumping from the AD DS database) at 2024-08-01 12:54:34 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the harvested credentials, an Azure Resource Manager operation was performed from a suspicious proxy/TOR IP address by the account with AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360` at 2024-08-01 13:09:13 UTC.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The same account, AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`, then performed suspicious Azure Resource Management activities from a risky sign-in session at 2024-08-01 13:19:20 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
