tasks:
- task_id: incident_322_latest_cleaned_test_set_task_3
  title: incident_322_latest_cleaned_test_set_task_3
  description: 'Shortly before this Azure Resource Manager activity, an alert fired on the same domain controller indicating Ntdsutil was used to collect Active Directory information. What was the process ID, creation time, and full command line of that Ntdsutil execution?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, Microsoft Defender for Resource Manager raised an alert titled ''Azure Resource Manager operation from suspicious proxy IP address'' on 2024-08-01 13:09:13 UTC. The operation came from IP `253.1.244.215`, associated with proxy services such as TOR, and was tied to the account `alyssat@vnevado.alpineskihouse.co` (Name: Hailey Johnson, AadUserId: 5e5dd0bd-f7ed-4583-8e9e-52f91e31a360, SID: S-1-5-21-1840151686-3534835288-156286563-1127). The targeted Azure resources were in subscription `7e838342-601f-4552-9baf-0dfb300cf555`, resource group `ctfcat`, and included the virtual machine, its network interface, and a DevTest Labs shutdown schedule.'
    question: 'Shortly before this Azure Resource Manager activity, an alert fired on the same domain controller indicating Ntdsutil was used to collect Active Directory information. What was the process ID, creation time, and full command line of that Ntdsutil execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 6748, Created Time (UTC): 2024-08-01T12:37:30.2769191Z, Command Line: "ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 6748, Created Time (UTC): 2024-08-01T12:37:30.2769191Z, Command Line: "ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An Azure Resource Manager operation was detected from a suspicious proxy IP address (such as TOR) involving the host with HostName `vnevado-dc` at 2024-08-01 13:09:13 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same host `vnevado-dc`, Ntdsutil was observed collecting Active Directory information, indicating credential/database dumping activity.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker launched the process with ProcessId `6748` at CreatedTimeUtc `2024-08-01t12:37:30.2769191z` using the command line `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q` to create a full copy of the AD DS database (NTDS.dit) in `c:\temp`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
