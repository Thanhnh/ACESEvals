tasks:
- task_id: incident_322_latest_cleaned_test_set_task_16
  title: incident_322_latest_cleaned_test_set_task_16
  description: 'A related alert, triggered shortly before this one, reported email messages containing a malicious URL that were delivered and then removed after delivery. What was the sender address of those email messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation of a multi-stage incident, Microsoft Defender for Office 365 raised an alert indicating that a user clicked on a link in an email that was later quarantined by zero-hour auto purge (ZAP). The URL clicked was `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`.'
    question: 'A related alert, triggered shortly before this one, reported email messages containing a malicious URL that were delivered and then removed after delivery. What was the sender address of those email messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'raphaelt@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-1840151686-3534835288-156286563-1127` clicked a link in an email that was later quarantined by zero-hour auto purge (ZAP).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The email containing the malicious URL was delivered and later removed after delivery; it was sent from the sender `raphaelt@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
