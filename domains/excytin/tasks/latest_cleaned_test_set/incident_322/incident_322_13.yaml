tasks:
- task_id: incident_322_latest_cleaned_test_set_task_13
  title: incident_322_latest_cleaned_test_set_task_13
  description: 'For that later ''Malicious URL was clicked on that device'' alert, what IP address was recorded for the device involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, Microsoft Defender for Resource Manager flagged an Azure Resource Manager operation coming from the suspicious proxy IP address `253.1.244.215` (often associated with anonymizing services such as TOR). The targeted Azure resources belonged to subscription `7e838342-601f-4552-9baf-0dfb300cf555`, resource group `ctfcat`, and included the virtual machine, network interface and shutdown schedule for the host `vnevado-dc`. Pivoting on the compromised user account behind this activity leads to a later alert in the same incident, raised at 2024-08-01 13:49:58 UTC, indicating that a malicious URL was clicked on a device.'
    question: 'For that later ''Malicious URL was clicked on that device'' alert, what IP address was recorded for the device involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '172.33.118.200'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '172.33.118.200'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360` performed an Azure Resource Manager operation from a suspicious proxy IP address at 2024-08-01 13:09:13 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that activity, a malicious URL was clicked on a device associated with the IP address `172.33.118.200` at 2024-08-01 13:49:58 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
