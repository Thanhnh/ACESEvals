tasks:
- task_id: incident_322_latest_cleaned_test_set_task_48
  title: incident_322_latest_cleaned_test_set_task_48
  description: 'For the alert reporting the suspicious credential dump from NTDS.dit, what is the name of the executable file associated with the process that carried out this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a potentially malicious URL click was detected after a user with the mailbox `alyssat@vnevado.alpineskihouse.co` clicked on a link found to be malicious. Follow-on alerts in the same incident chain included emails containing a malicious URL being removed after delivery, an Azure Resource Manager operation from a suspicious proxy IP address, and finally a suspicious credential dump from NTDS.dit on a domain controller, where attackers dump NTDS.dit to obtain user credentials.'
    question: 'For the alert reporting the suspicious credential dump from NTDS.dit, what is the name of the executable file associated with the process that carried out this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The mailbox recipient `alyssat@vnevado.alpineskihouse.co` received an email containing a malicious URL, and a potentially malicious URL click was detected from this user.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The emails containing the malicious URL were later removed after delivery, affecting the account with SID `S-1-5-21-1840151686-3534835288-156286563-1127`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'On host `vnevado-dc`, an Azure Resource Manager operation was performed from a suspicious proxy (TOR-associated) IP address.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'On the same domain controller, the process `powershell.exe` was used to dump credentials from NTDS.dit in order to obtain domain users'' credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
