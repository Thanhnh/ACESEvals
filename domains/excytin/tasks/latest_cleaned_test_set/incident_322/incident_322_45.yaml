tasks:
- task_id: incident_322_latest_cleaned_test_set_task_45
  title: incident_322_latest_cleaned_test_set_task_45
  description: 'For the alert reporting that a potentially malicious URL click was detected, which mailbox recipient address was involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, Microsoft Defender for Resource Manager detected an Azure Resource Manager operation coming from a suspicious proxy IP address `253.1.244.215` (often associated with anonymizing services such as TOR). The activity targeted resources under subscription `7e838342-601f-4552-9baf-0dfb300cf555`, resource group `ctfcat`, including the domain controller VM `vnevado-dc`, its network interface, and an auto-shutdown schedule. Pivoting from the user account involved in this operation, the same identity is linked to email-based alerts in this incident, including emails containing a malicious URL that were delivered and later removed, and a detection of a potentially malicious URL click.'
    question: 'For the alert reporting that a potentially malicious URL click was detected, which mailbox recipient address was involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious Azure Resource Manager operation was performed from a proxy (e.g., TOR) IP address by the account with AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'An email containing a malicious URL was delivered and later removed from the mailbox of the recipient `alyssat@vnevado.alpineskihouse.co`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The recipient `alyssat@vnevado.alpineskihouse.co` clicked on the potentially malicious URL contained in that email.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
