tasks:
- task_id: incident_322_latest_cleaned_test_set_task_33
  title: incident_322_latest_cleaned_test_set_task_33
  description: 'For the earlier alert where the user accessed a link in an email that ZAP later quarantined, what was the full URL that the user clicked?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, Microsoft Defender for Resource Manager detected an Azure Resource Manager operation coming from the suspicious proxy IP address `253.1.244.215` (often associated with anonymizing services such as TOR). The affected resources belonged to subscription `7e838342-601f-4552-9baf-0dfb300cf555`, resource group `ctfcat`, and included the virtual machine, network interface, and shutdown schedule for the host `vnevado-dc`. Investigation showed the same compromised user account was also involved in an earlier Microsoft Defender for Office 365 alert, where the user clicked a link in an email that was subsequently quarantined by zero-hour auto purge (ZAP).'
    question: 'For the earlier alert where the user accessed a link in an email that ZAP later quarantined, what was the full URL that the user clicked?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360` performed an Azure Resource Manager operation from a suspicious proxy IP address at 2024-08-01 13:09:13 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user accessed a link in an email that was subsequently quarantined by zero-hour auto purge (ZAP) at 2024-08-01 12:54:55 UTC.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The malicious link clicked by the user was the URL `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
