tasks:
- task_id: incident_322_latest_cleaned_test_set_task_37
  title: incident_322_latest_cleaned_test_set_task_37
  description: 'For the later alert reporting that a malicious URL was clicked on that device, what IP address was recorded as the entity involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a proxy log alert flagged a connection from `231.60.52.209` (host vnevado-win11h.vnevado.alpineskihouse.co) to the malicious URL `login.micro.demo.antoinetest.ovh`, with `228.3.31.94` also observed in the same alert. About an hour later, a related alert reported that a malicious URL was actually clicked on a device tied to this same host.'
    question: 'For the later alert reporting that a malicious URL was clicked on that device, what IP address was recorded as the entity involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '172.33.118.200'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '172.33.118.200'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious URL connection to `login.micro.demo.antoinetest.ovh` was detected in proxy logs originating from the host `vnevado-win11h`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The malicious URL was clicked on the device associated with the IP address `172.33.118.200`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
