tasks:
- task_id: incident_322_latest_cleaned_test_set_task_11
  title: incident_322_latest_cleaned_test_set_task_11
  description: 'Shortly after the click, a related alert was generated from proxy log analysis showing an outbound connection from the internal host 231.60.52.209 / vnevado-win11h.vnevado.alpineskihouse.co. What was the malicious destination URL (domain) recorded in those proxy logs?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a phishing-related security incident, an alert titled "A potentially malicious URL click was detected" was raised at 2024-08-01 12:44:53 UTC after a user clicked a link found to be malicious. The email message involved was delivered to the recipient `alyssat@vnevado.alpineskihouse.co`. Follow-on alerts in the same incident showed that emails containing the malicious URL were removed after delivery, and that the malicious URL was subsequently clicked on an endpoint device.'
    question: 'Shortly after the click, a related alert was generated from proxy log analysis showing an outbound connection from the internal host 231.60.52.209 / vnevado-win11h.vnevado.alpineskihouse.co. What was the malicious destination URL (domain) recorded in those proxy logs?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'login.micro.demo.antoinetest.ovh'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'login.micro.demo.antoinetest.ovh'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious URL click was detected for the mail message recipient `alyssat@vnevado.alpineskihouse.co` at 2024-08-01 12:44:53 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Emails containing the malicious URL that were delivered to the account with Email `alyssat@vnevado.alpineskihouse.co` were later removed after delivery.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The malicious URL was clicked on the device with HostName `vnevado-win11h`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Proxy logs show the connection from that device to the malicious URL with Url `login.micro.demo.antoinetest.ovh`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
