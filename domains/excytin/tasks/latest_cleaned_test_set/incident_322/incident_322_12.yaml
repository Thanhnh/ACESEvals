tasks:
- task_id: incident_322_latest_cleaned_test_set_task_12
  title: incident_322_latest_cleaned_test_set_task_12
  description: 'For the related alert about emails with a malicious URL removed after delivery, what was the malicious URL contained in those email messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert was raised indicating that a potentially malicious URL click was detected for the user `alyssat@vnevado.alpineskihouse.co`, who received a suspicious email message. Shortly afterwards, a related alert was triggered for email messages containing a malicious URL that were delivered and later removed from mailboxes.'
    question: 'For the related alert about emails with a malicious URL removed after delivery, what was the malicious URL contained in those email messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A potentially malicious URL click was detected for the mail recipient `alyssat@vnevado.alpineskihouse.co` at 2024-08-01 12:44:53 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The email messages delivered to that recipient contained the malicious URL `dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io`, which were removed after delivery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
