tasks:
- task_id: incident_322_latest_cleaned_test_set_task_28
  title: incident_322_latest_cleaned_test_set_task_28
  description: 'Earlier in the same incident, an alert was raised for emails containing a malicious URL that were delivered and then removed after delivery. Which recipient mailbox''s primary address was affected by those emails?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, Microsoft Defender for Resource Manager detected an Azure Resource Manager operation coming from the suspicious proxy IP address `253.1.244.215` (associated with proxy services such as TOR). The operation targeted resources in subscription `7e838342-601f-4552-9baf-0dfb300cf555`, resource group `ctfcat`, including the virtual machine `vnevado-dc`, its network interface, and an auto-shutdown schedule.'
    question: 'Earlier in the same incident, an alert was raised for emails containing a malicious URL that were delivered and then removed after delivery. Which recipient mailbox''s primary address was affected by those emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Hailey Johnson` performed an Azure Resource Manager operation from a suspicious proxy IP address at 2024-08-01 13:09:13 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The mailbox with primary address `alyssat@vnevado.alpineskihouse.co` received email messages containing a malicious URL, which were removed after delivery at 2024-08-01 12:44:53 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
