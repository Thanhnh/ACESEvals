tasks:
- task_id: incident_322_latest_cleaned_test_set_task_4
  title: incident_322_latest_cleaned_test_set_task_4
  description: 'For the later alert indicating that the malicious URL was clicked on the device, what was the full URL that was clicked?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised at 2024-08-01 12:44:53 UTC indicating that a potentially malicious URL click was detected for the user with mailbox `alyssat@vnevado.alpineskihouse.co`. Follow-on alerts showed that emails containing a malicious URL were delivered and later removed, and about an hour later a related alert fired showing the malicious URL was actually clicked on an endpoint device.'
    question: 'For the later alert indicating that the malicious URL was clicked on the device, what was the full URL that was clicked?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The mailbox recipient `alyssat@vnevado.alpineskihouse.co` received a phishing email and a potentially malicious URL click was detected from that account at 2024-08-01 12:44:53 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account `Hailey Johnson` was also delivered emails containing the malicious URL, which were removed after delivery at 2024-08-01 12:44:53 UTC.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On the affected device, the malicious URL `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/` was clicked at 2024-08-01 13:49:58 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
