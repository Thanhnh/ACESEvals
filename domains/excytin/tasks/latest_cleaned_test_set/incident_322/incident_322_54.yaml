tasks:
- task_id: incident_322_latest_cleaned_test_set_task_54
  title: incident_322_latest_cleaned_test_set_task_54
  description: 'For this alert about the malicious URL emails that were delivered and later removed, which mailbox address actually received these messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage phishing-related security incident, an alert titled "Email messages containing malicious URL removed after delivery" was raised on 2024-08-01 12:44:53 UTC. The emails were sent from `raphaelt@vnevado.alpineskihouse.co` with sender IP `202.205.215.225` and contained the malicious URL `dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io`. An involved account was displayed as `Hailey Johnson` with Entra ID (AAD) user ID `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360` and SID `S-1-5-21-1840151686-3534835288-156286563-1127`.'
    question: 'For this alert about the malicious URL emails that were delivered and later removed, which mailbox address actually received these messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An email containing a malicious URL was delivered to the organization and later removed by ZAP (zero-hour auto purge), triggering the alert ''Email messages containing malicious URL removed after delivery'' at 2024-08-01 12:44:53 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The mail message entity involved in this alert has Recipient `alyssat@vnevado.alpineskihouse.co`, identifying the mailbox that received the malicious URL email.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
