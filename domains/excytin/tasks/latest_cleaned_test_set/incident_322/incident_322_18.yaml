tasks:
- task_id: incident_322_latest_cleaned_test_set_task_18
  title: incident_322_latest_cleaned_test_set_task_18
  description: 'In the related alert about Active Directory information being collected, which command line executable was launched to gather the AD DS database information?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a proxy log alert flagged a connection from IP `231.60.52.209` (host vnevado-win11h.vnevado.alpineskihouse.co) to the malicious URL `login.micro.demo.antoinetest.ovh`, with another related IP `228.3.31.94` also observed. Following this chain of activity, a malicious URL was clicked on a device, a suspicious Azure Resource Manager operation was performed from a proxy IP address, and later an alert was raised for Active Directory information being collected on a domain controller.'
    question: 'In the related alert about Active Directory information being collected, which command line executable was launched to gather the AD DS database information?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ntdsutil.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ntdsutil.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious URL connection to `login.micro.demo.antoinetest.ovh` was detected in proxy logs from host `vnevado-win11h` (IP 231.60.52.209) at 2024-08-01 12:47:22 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The malicious URL was clicked on that device by the user with AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'From the compromised environment, an Azure Resource Manager operation was performed from a suspicious proxy (TOR) IP address, involving host `vnevado-dc`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'On that domain controller, the attacker launched the process with ExtractedFileName `ntdsutil.exe` to collect Active Directory information (dump the AD DS database) for credential theft and lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
