tasks:
- task_id: incident_322_latest_cleaned_test_set_task_47
  title: incident_322_latest_cleaned_test_set_task_47
  description: 'For the alert about the Azure Resource Manager operation performed from the suspicious proxy IP address, which Azure subscription ID was targeted?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a malicious URL `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/` was clicked on the device `vnevado-win11h` (AAD device ID `76707c40-3343-490e-9205-88fdb51aefe0`, IP `172.33.118.200`) via Microsoft Edge, with process ID 4256 created at 2024-08-01T13:42:52.04. Earlier the same day, Microsoft Defender for Resource Manager flagged an Azure Resource Manager operation coming from an IP address associated with proxy/anonymization services such as TOR, which is often used by threat actors to hide their true source IP. This ARM activity was linked to the same compromised user account.'
    question: 'For the alert about the Azure Resource Manager operation performed from the suspicious proxy IP address, which Azure subscription ID was targeted?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '7e838342-601f-4552-9baf-0dfb300cf555'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '7e838342-601f-4552-9baf-0dfb300cf555'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360` clicked on a malicious URL on that device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, a suspicious Azure Resource Manager operation was performed from a proxy (e.g., TOR) IP address against the Azure subscription with SubscriptionId `7e838342-601f-4552-9baf-0dfb300cf555`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
