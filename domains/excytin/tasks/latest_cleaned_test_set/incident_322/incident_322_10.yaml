tasks:
- task_id: incident_322_latest_cleaned_test_set_task_10
  title: incident_322_latest_cleaned_test_set_task_10
  description: 'In that proxy log alert about the malicious URL, besides the client address `231.60.52.209` noted in the alert description, which other IP address was recorded as an entity of the alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, Microsoft Defender for Resource Manager raised an alert for an Azure Resource Manager operation coming from an IP address associated with proxy/anonymization services such as TOR (source IP `253.1.244.215`). The targeted Azure resources belonged to subscription `7e838342-601f-4552-9baf-0dfb300cf555`, resource group `ctfcat`, and included the virtual machine, network interface and shutdown schedule for the domain controller host `vnevado-dc`. Pivoting from the compromised account involved, the activity chain also leads to endpoint-based alerts, including one where a malicious URL (`login.micro.demo.antoinetest.ovh`) was detected in proxy logs for the device `vnevado-win11h.vnevado.alpineskihouse.co`, whose connection was logged from `231.60.52.209`.'
    question: 'In that proxy log alert about the malicious URL, besides the client address `231.60.52.209` noted in the alert description, which other IP address was recorded as an entity of the alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '228.3.31.94'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '228.3.31.94'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with SID `S-1-5-21-1840151686-3534835288-156286563-1127` performed an Azure Resource Manager operation from a suspicious proxy IP address.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On the device with HostName `vnevado-win11h`, a malicious URL was clicked.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Proxy logs from that device recorded a connection to the malicious URL `login.micro.demo.antoinetest.ovh`, resolving to the malicious IP address `228.3.31.94`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
