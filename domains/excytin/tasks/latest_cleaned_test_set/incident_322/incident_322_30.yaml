tasks:
- task_id: incident_322_latest_cleaned_test_set_task_30
  title: incident_322_latest_cleaned_test_set_task_30
  description: 'Tracing this incident back to its initial access phase, an alert fired for a potentially malicious URL click. What is the email address of the user (mail recipient) who clicked on that malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a suspicious credential dump from NTDS.dit was detected on a domain controller, where `powershell.exe` ran an encoded command and then `ntdsutil.exe` (Process ID 6748) executed `"ac i ntds" ifm "create full c:\temp" q q` to extract the Active Directory database. Follow-on activity in the same incident included Azure Resource Manager operations from a suspicious proxy IP address and phishing emails containing malicious URLs that were delivered and later removed from mailboxes.'
    question: 'Tracing this incident back to its initial access phase, an alert fired for a potentially malicious URL click. What is the email address of the user (mail recipient) who clicked on that malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious credential dump from NTDS.dit was detected on the domain controller host `vnevado-dc` at 2024-08-01 12:49:26 UTC, indicating attackers harvested domain user credentials.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, an Azure Resource Manager operation was performed from a suspicious proxy (TOR) IP address by the compromised account with email `alyssat@vnevado.alpineskihouse.co` at 2024-08-01 13:09:13 UTC.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'That same account was targeted by email: a message containing a malicious URL was delivered to the recipient `alyssat@vnevado.alpineskihouse.co` and later removed after delivery at 2024-08-01 12:44:53 UTC.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The recipient `alyssat@vnevado.alpineskihouse.co` clicked the potentially malicious URL in that email, as detected at 2024-08-01 12:44:53 UTC, which enabled the compromise of the account.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
