tasks:
- task_id: incident_322_latest_cleaned_test_set_task_7
  title: incident_322_latest_cleaned_test_set_task_7
  description: 'Which user account (email address) performed the Azure Resource Manager operation that came from the suspicious proxy IP address?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled ''Ntdsutil collecting Active Directory information'' was raised after `powershell.exe` executed an encoded command that ultimately launched `ntdsutil.exe` (Process ID 6748) with the command line `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q`. This behavior suggests an attacker was gathering Active Directory database information for persistence or lateral movement. Shortly afterwards, at 2024-08-01 13:09:13 UTC, Microsoft Defender for Resource Manager detected an Azure Resource Manager operation originating from an IP address associated with proxy services such as TOR, which threat actors often use to hide their source IP.'
    question: 'Which user account (email address) performed the Azure Resource Manager operation that came from the suspicious proxy IP address?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'On host `vnevado-dc`, ntdsutil.exe was launched to collect Active Directory information (potential credential theft from the AD DS database) at 2024-08-01 12:54:34 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the domain controller compromise, a suspicious Azure Resource Manager operation was performed from a proxy/TOR-associated IP address by the account with email `alyssat@vnevado.alpineskihouse.co` at 2024-08-01 13:09:13 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
