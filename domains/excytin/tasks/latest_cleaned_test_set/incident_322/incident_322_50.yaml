tasks:
- task_id: incident_322_latest_cleaned_test_set_task_50
  title: incident_322_latest_cleaned_test_set_task_50
  description: 'For the Ntdsutil alert at the end of this attack chain, what was the process ID, creation time and full command line of the process that was launched to collect the Active Directory information?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage security incident, a malicious URL `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/` was clicked on the device `vnevado-win11h` (AAD Device ID `76707c40-3343-490e-9205-88fdb51aefe0`, IP `172.33.118.200`) via Microsoft Edge, with the process details `4256__2024-08-01t13:42:52.04__"msedge.exe" --type=utility --utility-sub-type=network.mojom.networkservice --lang=en-us --service-sandbox-type=none --field-trial-handle=1912,i,9358546549091360037,1317674413260171076,262144 --variations-seed-version --mojo-platform-channel-handle=3124 /prefetch:11`. Tracing the same compromised user account led to an Azure Resource Manager operation from a suspicious proxy IP address, and further to an alert on a domain controller where Ntdsutil was used to collect Active Directory information.'
    question: 'For the Ntdsutil alert at the end of this attack chain, what was the process ID, creation time and full command line of the process that was launched to collect the Active Directory information?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 6748, Created Time (UTC): 2024-08-01T12:37:30.2769191Z, Command line: "ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 6748, Created Time (UTC): 2024-08-01T12:37:30.2769191Z, Command line: "ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Hailey Johnson` clicked on a malicious URL on the device at 2024-08-01 13:49:58 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'An Azure Resource Manager operation was performed from a suspicious proxy IP address involving the host `vnevado-dc` at 2024-08-01 13:09:13 UTC.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that host, the attacker launched Ntdsutil to collect Active Directory information, with Process ID `6748`, created at `2024-08-01t12:37:30.2769191z`, running the command line `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
