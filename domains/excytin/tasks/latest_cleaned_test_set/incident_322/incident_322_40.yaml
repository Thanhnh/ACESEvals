tasks:
- task_id: incident_322_latest_cleaned_test_set_task_40
  title: incident_322_latest_cleaned_test_set_task_40
  description: 'For the related alert about emails containing a malicious URL that were removed after delivery, which mailbox recipient received the malicious email?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a proxy log alert flagged a connection from 231.60.52.209 (host vnevado-win11h.vnevado.alpineskihouse.co) to the malicious URL `login.micro.demo.antoinetest.ovh`. Further pivoting on this device showed that the malicious URL was actually clicked by a user, and the URL was traced back to a phishing campaign where emails containing the malicious URL were delivered and later removed from mailboxes.'
    question: 'For the related alert about emails containing a malicious URL that were removed after delivery, which mailbox recipient received the malicious email?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious URL connection to `login.micro.demo.antoinetest.ovh` was detected in the proxy logs from the host with HostName `vnevado-win11h` (231.60.52.209 - vnevado-win11h.vnevado.alpineskihouse.co).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On that device, the malicious URL was clicked by the user account with Email `alyssat@vnevado.alpineskihouse.co`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The click originated from an email message containing the malicious URL that was delivered and later removed, whose Recipient was `alyssat@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
