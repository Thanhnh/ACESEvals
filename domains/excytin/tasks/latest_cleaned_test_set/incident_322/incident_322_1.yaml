tasks:
- task_id: incident_322_latest_cleaned_test_set_task_1
  title: incident_322_latest_cleaned_test_set_task_1
  description: 'Following this chain back to the initial access stage, an alert was raised for a potentially malicious URL click. Which mailbox recipient clicked on the malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired for ''Ntdsutil collecting Active Directory information'', where `powershell.exe` executed an encoded command and subsequently `ntdsutil.exe` was launched with the command line `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q` (Process ID 6748) to dump Active Directory data. Tracing this activity across the incident leads back through a compromised account performing Azure Resource Manager operations from a suspicious proxy IP, and further back to phishing emails containing malicious URLs that were delivered to a mailbox and later removed.'
    question: 'Following this chain back to the initial access stage, an alert was raised for a potentially malicious URL click. Which mailbox recipient clicked on the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'On host `vnevado-dc`, ntdsutil.exe was used to collect Active Directory information at 2024-08-01 12:54:34 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'An Azure Resource Manager operation was performed from a suspicious proxy IP address by the account with SID `S-1-5-21-1840151686-3534835288-156286563-1127` at 2024-08-01 13:09:13 UTC.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Email messages containing a malicious URL were delivered to the recipient mailbox `alyssat@vnevado.alpineskihouse.co` and later removed at 2024-08-01 12:44:53 UTC.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'A potentially malicious URL click was detected for the same recipient `alyssat@vnevado.alpineskihouse.co` at 2024-08-01 12:44:53 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
