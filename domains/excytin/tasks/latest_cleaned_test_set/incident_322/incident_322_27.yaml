tasks:
- task_id: incident_322_latest_cleaned_test_set_task_27
  title: incident_322_latest_cleaned_test_set_task_27
  description: 'For the alert about the user clicking a link in an email that was subsequently quarantined by ZAP, what was the exact URL that the user accessed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert fired for ''Ntdsutil collecting Active Directory information'', where `powershell.exe` executed a Base64 encoded command (Process ID 2556) and then `ntdsutil.exe` was launched with the command line `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q` (Process ID 6748) to dump the Active Directory database. Pivoting from the compromised host, the same user account was later observed performing an Azure Resource Manager operation from a suspicious proxy IP address, and that user was also involved in an earlier email-based alert where a link in a message later quarantined by zero-hour auto purge (ZAP) was clicked.'
    question: 'For the alert about the user clicking a link in an email that was subsequently quarantined by ZAP, what was the exact URL that the user accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'On the host with HostName `vnevado-dc`, Ntdsutil was launched to collect Active Directory information, indicating credential access or lateral movement activity.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with Name `Hailey Johnson` performed Azure Resource Manager operations from a suspicious proxy (TOR) IP address, suggesting the account was compromised.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The same compromised user accessed a link in an email that was later quarantined by zero-hour auto purge (ZAP); the malicious URL was `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
