tasks:
- task_id: incident_322_latest_cleaned_test_set_task_36
  title: incident_322_latest_cleaned_test_set_task_36
  description: 'For the earlier alert "A potentially malicious URL click was detected", which mailbox recipient address was identified as the user who clicked the malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled "Malicious URL was clicked on that device" fired on 2024-08-01 at 13:49 UTC for host `vnevado-win11h` (AAD device ID `76707c40-3343-490e-9205-88fdb51aefe0`, IP `172.33.118.200`). The click on `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/` was made through Microsoft Edge, with process details `4256__2024-08-01t13:42:52.04__"msedge.exe" --type=utility --utility-sub-type=network.mojom.networkservice --lang=en-us ... /prefetch:11`. Earlier the same day, around 12:44 UTC, email protection alerts fired for messages containing a malicious URL that were delivered and later removed, as well as an alert stating that a potentially malicious URL click was detected.'
    question: 'For the earlier alert "A potentially malicious URL click was detected", which mailbox recipient address was identified as the user who clicked the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious URL was clicked on a device by the user account `Hailey Johnson`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'An email message containing that malicious URL was delivered to the recipient `alyssat@vnevado.alpineskihouse.co` and later removed after delivery.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A potentially malicious URL click was detected for the same mail recipient `alyssat@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
