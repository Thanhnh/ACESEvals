tasks:
- task_id: incident_322_latest_cleaned_test_set_task_34
  title: incident_322_latest_cleaned_test_set_task_34
  description: 'In that proxy-log detection of the malicious URL, besides the source address 231.60.52.209 recorded in the alert description, what other IP address entity was flagged as part of this alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, an alert for ''Suspicious credential dump from NTDS.dit'' was raised after `powershell.exe` executed a long encoded command and then launched `ntdsutil.exe` with the command line `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q` (Process ID 6748), an activity typically used by attackers to dump the domain controller credential store. The attack chain continued with Azure Resource Manager operations from a suspicious proxy IP and a malicious URL being clicked on an endpoint, which in turn triggered a proxy-log detection where the device `vnevado-win11h.vnevado.alpineskihouse.co` (source 231.60.52.209) connected to the malicious domain `login.micro.demo.antoinetest.ovh`.'
    question: 'In that proxy-log detection of the malicious URL, besides the source address 231.60.52.209 recorded in the alert description, what other IP address entity was flagged as part of this alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '228.3.31.94'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '228.3.31.94'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious credential dump from NTDS.dit was detected on the domain controller host `vnevado-dc`, where attackers extracted stored domain user credentials.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the compromised credentials, an Azure Resource Manager operation was performed from a suspicious proxy IP address by the account `Hailey Johnson`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'A malicious URL was clicked on the device with HostName `vnevado-win11h`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Proxy logs from that device revealed a malicious URL connection (login.micro.demo.antoinetest.ovh) associated with the IP address `228.3.31.94`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
