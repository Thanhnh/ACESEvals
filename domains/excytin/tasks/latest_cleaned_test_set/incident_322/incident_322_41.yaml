tasks:
- task_id: incident_322_latest_cleaned_test_set_task_41
  title: incident_322_latest_cleaned_test_set_task_41
  description: 'For the ''Suspicious credential dump from NTDS.dit'' alert in this chain, which executable was run with a Base64 `-EncodedCommand`, and what were its process ID and process creation time (UTC)?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a malicious URL `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/` was clicked on the device `vnevado-win11h` (AAD Device ID `76707c40-3343-490e-9205-88fdb51aefe0`, IP `172.33.118.200`) using Microsoft Edge (process `msedge.exe`, ProcessId__CreatedTimeUtc__CommandLine: `4256__2024-08-01t13:42:52.04__"msedge.exe" --type=utility --utility-sub-type=network.mojom.networkservice ... /prefetch:11`). Pivoting from the compromised user account, the same activity chain also included an Azure Resource Manager operation coming from a suspicious proxy IP address, and ultimately an alert on a domain controller for a suspicious credential dump from NTDS.dit.'
    question: 'For the ''Suspicious credential dump from NTDS.dit'' alert in this chain, which executable was run with a Base64 `-EncodedCommand`, and what were its process ID and process creation time (UTC)?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The executable was `powershell.exe`, launched with an `-encodedcommand` argument; Process ID: 2556, Created Time (UTC): 2024-08-01T12:37:29.6522416Z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The executable was `powershell.exe`, launched with an `-encodedcommand` argument; Process ID: 2556, Created Time (UTC): 2024-08-01T12:37:29.6522416Z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious URL was clicked on a device by the user account with AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360` at 2024-08-01 13:49:58 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'An Azure Resource Manager operation was performed from a suspicious proxy IP address, involving the host `vnevado-dc` at 2024-08-01 13:09:13 UTC.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that domain controller, a suspicious credential dump from NTDS.dit was performed by the process with ProcessId `2556`, created at `2024-08-01t12:37:29.6522416z`, running the encoded PowerShell command line `"powershell.exe" -encodedcommand ` at 2024-08-01 12:49:26 UTC, which copied the NTDS.dit database and exfiltrated it to Azure storage.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
