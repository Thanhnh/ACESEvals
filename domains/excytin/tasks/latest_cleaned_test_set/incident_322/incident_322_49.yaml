tasks:
- task_id: incident_322_latest_cleaned_test_set_task_49
  title: incident_322_latest_cleaned_test_set_task_49
  description: 'Roughly an hour later, a follow-up alert reported that a malicious URL was clicked on the device used by this same user. What IP address was recorded in that later alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert from Microsoft Defender for Office 365 fired: "User accessed a link in an email subsequently quarantined by ZAP". The user involved was Hailey Johnson (`alyssat@vnevado.alpineskihouse.co`, SID `S-1-5-21-1840151686-3534835288-156286563-1127`, AAD user ID `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`), and the link clicked was `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`.'
    question: 'Roughly an hour later, a follow-up alert reported that a malicious URL was clicked on the device used by this same user. What IP address was recorded in that later alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '172.33.118.200'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '172.33.118.200'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-1840151686-3534835288-156286563-1127` clicked on a link in an email that was later quarantined by zero-hour auto purge (ZAP) at 2024-08-01 12:54:55 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The malicious URL was clicked on the device with IP address `172.33.118.200` at 2024-08-01 13:49:58 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
