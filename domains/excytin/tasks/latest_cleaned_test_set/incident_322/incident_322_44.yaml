tasks:
- task_id: incident_322_latest_cleaned_test_set_task_44
  title: incident_322_latest_cleaned_test_set_task_44
  description: 'A closely related alert, ''Suspicious credential dump from NTDS.dit'', was triggered shortly before this activity and involved a scripting process launched with a Base64-encoded command. What was the Process ID and creation time (UTC) of that process?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage incident on the domain controller `vnevado-dc`, an alert titled ''Ntdsutil collecting Active Directory information'' was raised at 2024-08-01 12:54 UTC. The alert showed the process `ntdsutil.exe` (Process ID 6748, created 2024-08-01T12:37:30.2769191Z) running with the command line `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q`, which is a technique attackers use to gather AD data for persistence or lateral movement.'
    question: 'A closely related alert, ''Suspicious credential dump from NTDS.dit'', was triggered shortly before this activity and involved a scripting process launched with a Base64-encoded command. What was the Process ID and creation time (UTC) of that process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 2556, Created Time (UTC): 2024-08-01T12:37:29.6522416Z — corresponding to the process `"powershell.exe" -encodedcommand iabuahqazabzahuadabpagwalgblahgazqagacc...` (a long Base64-encoded PowerShell command)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 2556, Created Time (UTC): 2024-08-01T12:37:29.6522416Z — corresponding to the process `"powershell.exe" -encodedcommand iabuahqazabzahuadabpagwalgblahgazqagacc...` (a long Base64-encoded PowerShell command)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The attacker ran Ntdsutil to collect Active Directory information, using process ID `6748` created at `2024-08-01t12:37:30.2769191z` with the command line `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'This Ntdsutil activity was launched in the context of a credential dump from NTDS.dit, performed by the parent PowerShell process with process ID `2556`, created at `2024-08-01t12:37:29.6522416z`, with the command line `"powershell.exe" -encodedcommand `, which dumped NTDS.dit to obtain domain user credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
