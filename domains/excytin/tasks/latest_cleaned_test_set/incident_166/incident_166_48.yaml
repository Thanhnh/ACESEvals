tasks:
- task_id: incident_166_latest_cleaned_test_set_task_48
  title: incident_166_latest_cleaned_test_set_task_48
  description: 'Earlier in this same incident, the same user account was flagged for signing in from an anonymous IP address (such as a Tor browser or anonymizer VPN). What was the IP address used for that anonymous sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) financial fraud incident, a suspicious inbox rule that hides incoming email messages was created in a risky Azure AD session by the account `Jordan P` (`laylaw@vnevado.alpineskihouse.co`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`), with activity observed from IP address `255.246.85.58`.'
    question: 'Earlier in this same incident, the same user account was flagged for signing in from an anonymous IP address (such as a Tor browser or anonymizer VPN). What was the IP address used for that anonymous sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session by the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, indicating a possible business email compromise (BEC) financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'That same compromised session was associated with a sign-in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) with Address `95.202.65.202`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
