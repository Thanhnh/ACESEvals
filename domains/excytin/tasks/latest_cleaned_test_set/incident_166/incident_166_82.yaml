tasks:
- task_id: incident_166_latest_cleaned_test_set_task_82
  title: incident_166_latest_cleaned_test_set_task_82
  description: 'From which IP address did the suspicious SAP authentication originate?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) financial fraud investigation, a suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session originating from IP address `255.246.85.58`. Later in the same incident, the compromised user account was seen signing in to SAP, the enterprise application software, in a suspicious authentication event flagged by Microsoft Entra ID, suggesting an attacker may be searching SAP for sensitive financial information.'
    question: 'From which IP address did the suspicious SAP authentication originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with email `laylaw@vnevado.alpineskihouse.co` had a suspicious inbox rule created in a risky Azure Active Directory session, indicating a business email compromise (BEC) financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account was then used to sign in to the SAP enterprise application from the suspicious IP address `107.253.5.27`, indicating a suspicious SAP authentication.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
