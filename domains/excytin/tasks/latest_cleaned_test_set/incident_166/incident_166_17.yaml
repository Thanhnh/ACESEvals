tasks:
- task_id: incident_166_latest_cleaned_test_set_task_17
  title: incident_166_latest_cleaned_test_set_task_17
  description: 'Earlier in this same incident, a suspicious MoveToFolder inbox rule named `ITCleanup` was created that redirects incoming messages into an ''RSS Feeds'' folder. What is the primary address of the mailbox on which this rule was configured?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) related investigation, an alert was raised showing that a compromised user signed in to the SAP cloud application (AppId 100) from the IP address `107.253.5.27` in a suspicious manner, potentially to search for or modify sensitive financial information for use in later phishing or social engineering stages of the attack.'
    question: 'Earlier in this same incident, a suspicious MoveToFolder inbox rule named `ITCleanup` was created that redirects incoming messages into an ''RSS Feeds'' folder. What is the primary address of the mailbox on which this rule was configured?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Jordan P`, involved in a business email compromise-related alert, signed in to SAP in a suspicious manner, potentially to search for or modify sensitive financial information.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The mailbox with primary address `laylaw@vnevado.alpineskihouse.co`, belonging to Jordan P, had a suspicious inbox manipulation rule named `ITCleanup` created to move messages to the `RSS Feeds` folder, indicating the account is compromised.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
