  title: incident_166_latest_cleaned_test_set_task_79
  description: 'Tracing this compromised identity across the related alerts in this incident, what is the Microsoft Entra ID (Azure AD) user object identifier associated with this account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a security incident involving SAP financial process manipulation, an alert named ''Suspicious SAP authentication'' was raised. It indicates that a user account with a risky sign-in alert in Microsoft Entra ID signed in to the SAP enterprise application (Cloud App Id 100) from IP address `107.253.5.27`. The account belongs to `Jordan P` with the email `laylaw@vnevado.alpineskihouse.co` and on-premises SID `S-1-5-21-1740051960-3534030288-108486866-1602`. An attacker might have taken control of this user account to search through SAP with the intention of recording or modifying sensitive financial information.'
    question: 'Tracing this compromised identity across the related alerts in this incident, what is the Microsoft Entra ID (Azure AD) user object identifier associated with this account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` was flagged with a risky sign-in alert in Microsoft Entra ID at 2024-07-22 12:59:26 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` then performed a suspicious authentication to SAP, the enterprise application software, indicating an attacker may have taken control of the account to search for sensitive financial information.'
  scoring_aggregation:
