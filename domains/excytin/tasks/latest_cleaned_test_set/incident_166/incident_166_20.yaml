tasks:
- task_id: incident_166_latest_cleaned_test_set_task_20
  title: incident_166_latest_cleaned_test_set_task_20
  description: 'For the alert about the suspicious inbox manipulation rule, which cloud application and instance name were reported as the affected SaaS resource?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a high-severity incident (SAP financial process manipulation / attack disruption) flagged in our tenant, one alert reported a sign-in from an anonymous IP address `95.202.65.202` (e.g., Tor browser or anonymizer VPN) associated with the user account whose Entra ID (AAD) user ID is `89e933b9-5b2e-4bd6-bcdf-033db707ef82`. Shortly afterwards, a related alert fired for a suspicious inbox manipulation rule named `ITCleanup` that was created on the mailbox of the user Jordan P (laylaw@vnevado.alpineskihouse.co), moving incoming messages to the `RSS Feeds` folder — a common sign of a compromised mailbox.'
    question: 'For the alert about the suspicious inbox manipulation rule, which cloud application and instance name were reported as the affected SaaS resource?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Cloud application: Office 365, instance name: Microsoft 365'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Cloud application: Office 365, instance name: Microsoft 365'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) was detected for the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the suspicious sign-in, the compromised user Jordan P (laylaw@vnevado.alpineskihouse.co) created a suspicious inbox manipulation rule named `ITCleanup` that moves incoming messages to the `RSS Feeds` folder, indicating mailbox abuse for phishing and hiding activity.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'This suspicious inbox rule activity occurred within the cloud application `office 365__microsoft 365` (Office 365, instance Microsoft 365).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
