tasks:
- task_id: incident_166_latest_cleaned_test_set_task_43
  title: incident_166_latest_cleaned_test_set_task_43
  description: 'An earlier related alert on 2024-07-22 reported that a suspicious inbox rule hiding incoming email messages was created during a risky Azure Active Directory session for this same user. What was the source IP address associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) campaign, an alert titled "Possible BEC financial fraud" was raised on 2024-07-23, indicating suspicious events with BEC characteristics that suggest an attacker may be attempting a fraud attack against the organization. The alert involved the account `Jordan P` (email `laylaw@vnevado.alpineskihouse.co`, AAD User ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`).'
    question: 'An earlier related alert on 2024-07-22 reported that a suspicious inbox rule hiding incoming email messages was created during a risky Azure Active Directory session for this same user. What was the source IP address associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` was involved in suspicious events showing business email compromise (BEC) financial fraud characteristics.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From that compromised account, a suspicious inbox rule hiding incoming email messages was created within a risky Azure Active Directory session originating from the IP address `255.246.85.58`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
