tasks:
- task_id: incident_166_latest_cleaned_test_set_task_68
  title: incident_166_latest_cleaned_test_set_task_68
  description: 'A day earlier, a related alert showed that a user involved in this BEC activity also signed in to SAP in a suspicious manner. In that alert, what is the AppId of the cloud application entity flagged?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) related security incident, an alert titled ''Possible BEC financial fraud'' was raised on 2024-07-23, indicating that an attacker might be attempting to conduct a fraud attack against the organization. The alert involved the user account `Jordan P` (email `laylaw@vnevado.alpineskihouse.co`, AAD user ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`).'
    question: 'A day earlier, a related alert showed that a user involved in this BEC activity also signed in to SAP in a suspicious manner. In that alert, what is the AppId of the cloud application entity flagged?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The cloud application AppId is `100`.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The cloud application AppId is `100`.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious events with business email compromise (BEC) characteristics were observed for the account with email `laylaw@vnevado.alpineskihouse.co`, indicating a possible BEC financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same BEC-related user then signed in suspiciously to the SAP cloud application, identified by AppId `100`, potentially to search for or modify sensitive financial information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
