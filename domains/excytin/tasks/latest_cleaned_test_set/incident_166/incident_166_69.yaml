tasks:
- task_id: incident_166_latest_cleaned_test_set_task_69
  title: incident_166_latest_cleaned_test_set_task_69
  description: 'Following this risky sign-in, the same compromised account was seen authenticating to SAP, triggering a ''Suspicious SAP authentication'' alert. What is the source IP address recorded in that SAP authentication alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a SAP financial process manipulation incident, Microsoft Entra ID Protection flagged a risky sign-in from an anonymous IP address `95.202.65.202` (e.g., Tor browser or anonymizer VPN) belonging to a compromised user account.'
    question: 'Following this risky sign-in, the same compromised account was seen authenticating to SAP, triggering a ''Suspicious SAP authentication'' alert. What is the source IP address recorded in that SAP authentication alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) at 2024-07-22 08:45:32 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same risky user account then signed in to the SAP enterprise application from the suspicious IP address `107.253.5.27` at 2024-07-22 13:19:46 UTC, indicating a potential account takeover used to access sensitive financial information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
