tasks:
- task_id: incident_166_latest_cleaned_test_set_task_37
  title: incident_166_latest_cleaned_test_set_task_37
  description: 'Later in the same incident, an alert was raised for a suspicious SAP authentication, where a user with a risky sign-in in Microsoft Entra ID signed in to SAP. What is the AppId of the cloud application recorded in that SAP authentication alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a high-severity incident involving SAP financial process manipulation, an alert titled ''Suspicious inbox manipulation rule'' was raised on 2024-07-22, indicating that a user''s inbox rules were manipulated in a suspicious manner, possibly by an attacker who gained access to the mailbox to delete or move messages and exfiltrate data. This activity was associated with the cloud application AppId `20893` and originated from the IP address `255.246.85.58`.'
    question: 'Later in the same incident, an alert was raised for a suspicious SAP authentication, where a user with a risky sign-in in Microsoft Entra ID signed in to SAP. What is the AppId of the cloud application recorded in that SAP authentication alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'AppId: 100'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'AppId: 100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` had its inbox rules manipulated in a suspicious manner, indicating the attacker gained access to the mailbox to hide or exfiltrate messages.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user then performed a suspicious sign-in to the SAP enterprise application, identified by cloud-application AppId `100`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
