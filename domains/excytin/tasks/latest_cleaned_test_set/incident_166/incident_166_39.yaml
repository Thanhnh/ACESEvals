tasks:
- task_id: incident_166_latest_cleaned_test_set_task_39
  title: incident_166_latest_cleaned_test_set_task_39
  description: 'For the related ''BEC financial fraud'' alert, what was the source IP address associated with the risky session in which the malicious inbox rule was created?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a high-severity incident involving SAP financial process manipulation, an alert titled ''Suspicious inbox manipulation rule'' was raised for cloud application AppId `20893`, indicating that a user''s inbox rules were manipulated in a suspicious manner — possibly by an attacker who gained access to the mailbox to delete or move messages and exfiltrate data. A closely related alert, ''BEC financial fraud'', was raised moments later for the same compromised user, showing that a hiding inbox rule was created within a risky Azure Active Directory session as part of a suspected business email compromise attempt.'
    question: 'For the related ''BEC financial fraud'' alert, what was the source IP address associated with the risky session in which the malicious inbox rule was created?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` had their inbox rules manipulated in a suspicious manner, possibly by an attacker who gained access to the mailbox to delete or move messages and exfiltrate data.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session originating from the IP address `255.246.85.58`, indicating an attempted business email compromise (BEC) financial fraud.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
