tasks:
- task_id: incident_166_latest_cleaned_test_set_task_45
  title: incident_166_latest_cleaned_test_set_task_45
  description: 'For the alert about suspicious emails sent by the BEC-related compromised user, which recipient email address received those suspicious messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of this incident, a password spray attack was detected originating from the IP address `95.202.65.202` on 2024-07-23. The activity was linked to a compromised user account, which was also flagged in an earlier alert for sending suspicious emails as part of an ongoing BEC (business email compromise) fraud attempt.'
    question: 'For the alert about suspicious emails sent by the BEC-related compromised user, which recipient email address received those suspicious messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tony@avoriaz.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tony@avoriaz.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected against the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` at 2024-07-23 14:23:51 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised user account was then used in an ongoing BEC (business email compromise) fraud attempt, sending suspicious emails to the recipient `tony@avoriaz.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
