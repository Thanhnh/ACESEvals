tasks:
- task_id: incident_166_latest_cleaned_test_set_task_36
  title: incident_166_latest_cleaned_test_set_task_36
  description: 'For the suspicious SAP authentication alert that followed, what was the IP address associated with that risky sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing business email compromise (BEC) investigation, an alert fired for suspicious emails sent by the possibly compromised account `laylaw@vnevado.alpineskihouse.co` from the sender IP `255.246.85.58` to the mailbox `tony@avoriaz.alpineskihouse.co`. Later in the same incident, a user account flagged with a risky sign-in in Microsoft Entra ID authenticated to SAP, the enterprise application software, suggesting an attacker may have been searching SAP for sensitive financial information.'
    question: 'For the suspicious SAP authentication alert that followed, what was the IP address associated with that risky sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The compromised user account `Jordan P` sent suspicious emails as part of an ongoing BEC (business email compromise) fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account was then used to sign in to SAP from the suspicious IP address `107.253.5.27`, indicating an attacker may be searching SAP for sensitive financial information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
