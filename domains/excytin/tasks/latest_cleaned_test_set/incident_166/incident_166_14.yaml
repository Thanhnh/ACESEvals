tasks:
- task_id: incident_166_latest_cleaned_test_set_task_14
  title: incident_166_latest_cleaned_test_set_task_14
  description: 'A follow-up alert reported that suspicious emails were sent by the possibly compromised user account tied to this ongoing BEC fraud attempt. What is the sender email address of those suspicious messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) financial fraud incident, an alert was raised after a suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session. The activity was tied to the account named `Jordan P` (AAD User ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`) and originated from IP address `255.246.85.58`.'
    question: 'A follow-up alert reported that suspicious emails were sent by the possibly compromised user account tied to this ongoing BEC fraud attempt. What is the sender email address of those suspicious messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule that hides incoming email messages was created in a risky Azure AD session by the user account with SID `S-1-5-21-1740051960-3534030288-108486866-1602`, indicating a potential business email compromise (BEC) financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the BEC compromise, suspicious emails were sent from the compromised mailbox with sender address `laylaw@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
