tasks:
- task_id: incident_166_latest_cleaned_test_set_task_27
  title: incident_166_latest_cleaned_test_set_task_27
  description: 'For the user account that performed this sign-in from the anonymous IP address, what is its unique Microsoft Entra ID (AadUserId) identifier?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an identity protection alert titled "Anonymous IP address" was raised on 2024-07-22 at 09:11 UTC, indicating a sign-in originating from the anonymized IP address `192.238.237.190` (e.g., Tor browser or anonymizer VPN service). This anonymous sign-in is one of several related alerts tied to a compromised identity in the environment.'
    question: 'For the user account that performed this sign-in from the anonymous IP address, what is its unique Microsoft Entra ID (AadUserId) identifier?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) was detected at 2024-07-22 09:11:31 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The suspicious anonymous sign-in was associated with the user account having AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
