tasks:
- task_id: incident_166_latest_cleaned_test_set_task_25
  title: incident_166_latest_cleaned_test_set_task_25
  description: 'An earlier related alert at 2024-07-22 09:49:55 UTC shows the same user creating a MoveToFolder inbox rule named ''ITCleanup'' that moved messages to the ''RSS Feeds'' folder. From which IP address was that earlier rule-creation activity performed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the ''SAP financial process manipulation'' style compromise investigation, an alert for a ''Suspicious inbox manipulation rule'' was raised at 2024-07-22 10:00:07 UTC for the account Jordan P (laylaw@vnevado.alpineskihouse.co, AAD User ID 89e933b9-5b2e-4bd6-bcdf-033db707ef82, SID S-1-5-21-1740051960-3534030288-108486866-1602). The activity was observed from IP address 255.246.85.58 and involved a cloud application (AppId 20893). An attacker may have gained access to the user''s inbox and manipulated rules to delete or move messages in order to exfiltrate data.'
    question: 'An earlier related alert at 2024-07-22 09:49:55 UTC shows the same user creating a MoveToFolder inbox rule named ''ITCleanup'' that moved messages to the ''RSS Feeds'' folder. From which IP address was that earlier rule-creation activity performed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox manipulation rule was detected in the cloud application with AppId `20893` (Microsoft Exchange Online), indicating an attacker may have gained access to a user''s inbox to delete or move messages and exfiltrate data.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The suspicious inbox rule named `ITCleanup` (a MoveToFolder rule moving messages to the `RSS Feeds` folder) was set on the mailbox of user Jordan P (laylaw@vnevado.alpineskihouse.co) from the IP address `192.238.237.190`, indicating the account is likely compromised.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
