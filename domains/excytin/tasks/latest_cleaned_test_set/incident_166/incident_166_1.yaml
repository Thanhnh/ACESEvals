tasks:
- task_id: incident_166_latest_cleaned_test_set_task_1
  title: incident_166_latest_cleaned_test_set_task_1
  description: 'The same compromised user account was later involved in a ''Possible BEC financial fraud'' alert on 2024-07-23. What is the Microsoft Entra ID (AAD) user ID of that account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage incident, a ''Suspicious SAP authentication'' alert was raised at 2024-07-22 12:59:26 UTC, where a user account flagged with a risky sign-in in Microsoft Entra ID signed in to the SAP enterprise application (cloud application AppId `100`) from the IP address `107.253.5.27`. An attacker might have taken control of this account to search through SAP with the intention of recording or modifying sensitive financial information.'
    question: 'The same compromised user account was later involved in a ''Possible BEC financial fraud'' alert on 2024-07-23. What is the Microsoft Entra ID (AAD) user ID of that account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` was flagged with a risky sign-in in Microsoft Entra ID and then signed in to SAP, indicating a suspicious SAP authentication that could be used to access sensitive financial information.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` then exhibited business email compromise (BEC) characteristics, indicating a possible BEC financial fraud attempt against the organization.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
