tasks:
- task_id: incident_166_latest_cleaned_test_set_task_51
  title: incident_166_latest_cleaned_test_set_task_51
  description: 'What is the account name of the user associated with the ''Possible BEC financial fraud'' alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a high-severity ''SAP financial process manipulation (attack disruption)'' incident, an alert was raised for a sign-in from an anonymous IP address `95.202.65.202` (e.g., Tor browser or anonymizer VPN). This sign-in was tied to a compromised user account, which was later linked to a ''Possible BEC financial fraud'' alert where suspicious events with business email compromise characteristics were observed.'
    question: 'What is the account name of the user associated with the ''Possible BEC financial fraud'' alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Jordan P'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) was detected for the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` at 2024-07-22 08:45:32 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, suspicious business email compromise (BEC) events indicating possible financial fraud were observed for the account `Jordan P` at 2024-07-23 16:09:13 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
