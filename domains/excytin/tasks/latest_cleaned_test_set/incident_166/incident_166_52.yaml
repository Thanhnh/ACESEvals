tasks:
- task_id: incident_166_latest_cleaned_test_set_task_52
  title: incident_166_latest_cleaned_test_set_task_52
  description: 'Earlier that same day, the same compromised identity was flagged by an ''Anonymous IP address'' alert for a sign-in originating from an anonymizing service such as Tor or an anonymizer VPN. What was the source IP address of that anonymous sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a security incident in our organization, an alert for a ''Suspicious inbox manipulation rule'' was raised on 2024-07-22 at 10:00 UTC. The alert indicated that a user''s inbox rules were manipulated in a suspicious manner, possibly by an attacker who gained access to the mailbox in order to delete or move messages and exfiltrate data. The affected account belongs to `Jordan P` (email `laylaw@vnevado.alpineskihouse.co`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`), and the activity was seen from IP `255.246.85.58` against cloud application ID `20893`.'
    question: 'Earlier that same day, the same compromised identity was flagged by an ''Anonymous IP address'' alert for a sign-in originating from an anonymizing service such as Tor or an anonymizer VPN. What was the source IP address of that anonymous sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` had its inbox rules manipulated in a suspicious manner, indicating an attacker gained access to the mailbox and set rules to delete or move messages to exfiltrate data.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account was signed in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) with Address `95.202.65.202`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
