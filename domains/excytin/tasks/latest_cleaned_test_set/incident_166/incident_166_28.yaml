  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a "Password Spray" alert was raised on 2024-07-23 at 14:23:51 UTC, indicating that a password spray attack was detected against an identity in the tenant. The affected account is identified by the Microsoft Entra (AAD) User ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
    question: 'From which source IP address were the password spray sign-in attempts against this account originating?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected originating from the IP address `95.202.65.202` at 2024-07-23 14:23:51 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
