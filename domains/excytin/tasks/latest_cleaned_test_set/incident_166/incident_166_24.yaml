tasks:
- task_id: incident_166_latest_cleaned_test_set_task_24
  title: incident_166_latest_cleaned_test_set_task_24
  description: 'Earlier that same day, at around 08:45 UTC, the same compromised identity triggered an ''Anonymous IP address'' sign-in alert (e.g., Tor browser or anonymizer VPN). What was the source IP address of that anonymous sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing business email compromise (BEC) investigation, an alert was raised for "Suspicious emails sent by BEC-related user". The possibly compromised account `laylaw@vnevado.alpineskihouse.co` (display name `Jordan P`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`) sent mail from sender IP `255.246.85.58` to the mailbox `tony@avoriaz.alpineskihouse.co` at 2024-07-22 10:14 UTC.'
    question: 'Earlier that same day, at around 08:45 UTC, the same compromised identity triggered an ''Anonymous IP address'' sign-in alert (e.g., Tor browser or anonymizer VPN). What was the source IP address of that anonymous sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` sent suspicious emails as part of an ongoing BEC (business email compromise) fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account was signed into from an anonymous IP address (e.g., Tor browser or anonymizer VPN) with Address `95.202.65.202`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
