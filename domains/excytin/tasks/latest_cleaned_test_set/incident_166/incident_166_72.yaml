tasks:
- task_id: incident_166_latest_cleaned_test_set_task_72
  title: incident_166_latest_cleaned_test_set_task_72
  description: 'What is the source IP address associated with the password spray attack alert linked to this compromised account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) financial fraud incident, a suspicious inbox rule that hides incoming email messages was created in a risky Azure AD session by the user Jordan P (`laylaw@vnevado.alpineskihouse.co`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`) from IP address `255.246.85.58`. The same compromised account was later linked to another alert flagging a password spray attack.'
    question: 'What is the source IP address associated with the password spray attack alert linked to this compromised account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule that hides incoming email messages was created in a risky session by the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, indicating a possible business email compromise (BEC) financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A password spray attack was detected originating from the IP address `95.202.65.202`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
