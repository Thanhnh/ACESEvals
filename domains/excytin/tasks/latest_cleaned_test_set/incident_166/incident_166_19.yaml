tasks:
- task_id: incident_166_latest_cleaned_test_set_task_19
  title: incident_166_latest_cleaned_test_set_task_19
  description: 'Earlier in this same incident, an alert flagged suspicious emails sent by a possibly compromised account tied to an ongoing business email compromise (BEC) fraud attempt. What was the sender address of those suspicious email messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a high-severity incident involving SAP financial process manipulation (attack disruption), an alert was raised for a suspicious SAP authentication: a user account with a risky sign-in alert in Microsoft Entra ID signed in to the SAP cloud application (AppId 100) from the IP address `107.253.5.27`. An attacker might have taken control of the account to search through SAP with the intention of recording or modifying sensitive financial information.'
    question: 'Earlier in this same incident, an alert flagged suspicious emails sent by a possibly compromised account tied to an ongoing business email compromise (BEC) fraud attempt. What was the sender address of those suspicious email messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` was flagged with a risky sign-in in Microsoft Entra ID and signed in to the SAP enterprise application, indicating a possible account takeover used to search for sensitive financial information.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account was then used in an ongoing BEC (business email compromise) fraud attempt, sending suspicious emails from the sender mailbox `laylaw@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
