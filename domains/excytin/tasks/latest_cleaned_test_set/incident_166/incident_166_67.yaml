tasks:
- task_id: incident_166_latest_cleaned_test_set_task_67
  title: incident_166_latest_cleaned_test_set_task_67
  description: 'Earlier that same day, the same compromised user account triggered an ''Anonymous IP address'' sign-in alert (e.g., Tor browser or anonymizer VPN). What was the source IP address of that anonymous sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, a ''Suspicious inbox manipulation rule'' alert was raised at 2024-07-22 10:00:07 UTC for the account ''Jordan P'' (laylaw@vnevado.alpineskihouse.co, SID S-1-5-21-1740051960-3534030288-108486866-1602), where inbox rules were manipulated in a suspicious manner from IP address 255.246.85.58 using cloud application AppId 20893. An attacker might have gained access to the user''s mailbox to delete or move messages and exfiltrate data.'
    question: 'Earlier that same day, the same compromised user account triggered an ''Anonymous IP address'' sign-in alert (e.g., Tor browser or anonymizer VPN). What was the source IP address of that anonymous sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` had its inbox rules manipulated in a suspicious manner, indicating an attacker gained access to the mailbox to hide or exfiltrate messages.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Investigating the compromised account''s sign-in activity shows the same account signed in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) with Address `192.238.237.190`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
