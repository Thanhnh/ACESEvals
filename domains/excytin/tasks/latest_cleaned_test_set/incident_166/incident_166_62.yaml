tasks:
- task_id: incident_166_latest_cleaned_test_set_task_62
  title: incident_166_latest_cleaned_test_set_task_62
  description: 'What is the source IP address associated with the password spray attack alert linked to this same user account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, a sign-in from an anonymous IP address `192.238.237.190` (e.g. Tor browser, anonymizer VPNs) was detected for a user account. The same compromised account was later observed in another alert where a password spray attack was detected.'
    question: 'What is the source IP address associated with the password spray attack alert linked to this same user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from an anonymous IP address (e.g. Tor browser or anonymizer VPN) was detected for the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` at 2024-07-22 09:11:31 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that, a password spray attack was detected originating from the IP address `95.202.65.202` at 2024-07-23 14:23:51 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
