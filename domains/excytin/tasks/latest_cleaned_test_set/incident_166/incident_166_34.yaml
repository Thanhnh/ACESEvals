tasks:
- task_id: incident_166_latest_cleaned_test_set_task_34
  title: incident_166_latest_cleaned_test_set_task_34
  description: 'Earlier in this same incident, a related alert ''Suspicious SAP authentication'' was triggered for the same user based on a risky sign-in detected by Microsoft Entra ID. What was the source IP address associated with that suspicious SAP authentication?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident involving SAP financial process manipulation, an alert titled ''BEC-related user signed in to SAP'' was raised for the account `Jordan P` (email `laylaw@vnevado.alpineskihouse.co`, AAD user ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`) interacting with cloud application AppId 100. This suggests an attacker may have taken over the account to search SAP for sensitive financial information.'
    question: 'Earlier in this same incident, a related alert ''Suspicious SAP authentication'' was triggered for the same user based on a risky sign-in detected by Microsoft Entra ID. What was the source IP address associated with that suspicious SAP authentication?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, which was involved in a business email compromise-related alert, signed in to SAP in a suspicious manner at 2024-07-22 14:09:41 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user account performed a suspicious SAP authentication following a risky Microsoft Entra ID sign-in, originating from the IP address `107.253.5.27` at 2024-07-22 12:59:26 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
