tasks:
- task_id: incident_166_latest_cleaned_test_set_task_54
  title: incident_166_latest_cleaned_test_set_task_54
  description: 'Earlier in this same incident, the same compromised user account was involved in a ''BEC financial fraud'' alert, where a suspicious inbox rule that hides incoming email messages was created during a risky Azure Active Directory session. What was the source IP address associated with that inbox rule creation activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a high-severity incident involving SAP financial process manipulation, an alert titled "Suspicious SAP authentication" was raised: a user account that had a risky sign-in alert in Microsoft Entra ID signed in to the SAP enterprise application (cloud application AppId 100) from the IP address `107.253.5.27`. An attacker might have taken control of this user account to search through SAP with the intent of recording or modifying sensitive financial information.'
    question: 'Earlier in this same incident, the same compromised user account was involved in a ''BEC financial fraud'' alert, where a suspicious inbox rule that hides incoming email messages was created during a risky Azure Active Directory session. What was the source IP address associated with that inbox rule creation activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` had a risky sign-in alert in Microsoft Entra ID and signed in to SAP, potentially to search for or modify sensitive financial information.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'In the same risky session, a suspicious inbox rule that hides incoming email messages was created from IP address `255.246.85.58`, indicating a business email compromise (BEC) financial fraud attempt.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
