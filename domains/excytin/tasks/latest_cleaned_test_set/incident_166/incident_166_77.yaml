tasks:
- task_id: incident_166_latest_cleaned_test_set_task_77
  title: incident_166_latest_cleaned_test_set_task_77
  description: 'Pivoting on this compromised user account across the other alerts in the incident, what is the source IP address that the attacker used when signing in with this account?'
  inherit_shared: true
  initial_context:
    incident_context: 'A high-severity incident named "SAP financial process manipulation (attack disruption)" was raised in our environment, made up of 11 alerts from Azure Active Directory Identity Protection, Microsoft Cloud App Security and Microsoft 365 Defender. One of these alerts, "Suspicious SAP authentication", fired on 2024-07-22 when a user account flagged with a risky sign-in in Microsoft Entra ID authenticated to SAP (cloud application AppId 100). The account belongs to `Jordan P` (email `laylaw@vnevado.alpineskihouse.co`, AAD User ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`). An attacker may have taken over this account to browse SAP for sensitive financial data.'
    question: 'Pivoting on this compromised user account across the other alerts in the incident, what is the source IP address that the attacker used when signing in with this account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious SAP authentication was detected originating from the IP address `107.253.5.27`, where a user account flagged with a risky sign-in alert in Microsoft Entra ID signed in to the SAP enterprise application.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
