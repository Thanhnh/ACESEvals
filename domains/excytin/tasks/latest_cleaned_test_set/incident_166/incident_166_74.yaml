tasks:
- task_id: incident_166_latest_cleaned_test_set_task_74
  title: incident_166_latest_cleaned_test_set_task_74
  description: 'For the suspicious inbox manipulation rule alert connected to this activity, what is the email address of the mailbox on which the ''ITCleanup'' rule was created?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a Password Spray alert was raised on 2024-07-23 14:23:51 UTC, showing a password spray attack originating from IP address `95.202.65.202` and involving an account with AAD User ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`. Pivoting from this activity, an earlier related alert (2024-07-22 09:49:55 UTC) flagged a suspicious inbox manipulation rule, where a MoveToFolder rule named ''ITCleanup'' was created to silently move incoming messages into the ''RSS Feeds'' folder — a common sign of a compromised mailbox being used to spread phishing emails.'
    question: 'For the suspicious inbox manipulation rule alert connected to this activity, what is the email address of the mailbox on which the ''ITCleanup'' rule was created?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected against the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, a suspicious inbox manipulation rule named `ITCleanup` (MoveToFolder rule moving messages to the `RSS Feeds` folder) was created on the mailbox of the account with Email `laylaw@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
