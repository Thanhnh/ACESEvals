tasks:
- task_id: incident_166_latest_cleaned_test_set_task_8
  title: incident_166_latest_cleaned_test_set_task_8
  description: 'A follow-up alert the next day flagged suspicious events with business email compromise (BEC) characteristics, indicating a possible financial fraud attempt against the organization, and it involved the same account tied to the earlier inbox manipulation rule. What is the email address of the user account involved in that BEC financial fraud alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious inbox rule named ''ITCleanup'' was detected on an internal user''s mailbox in Microsoft Exchange Online (AppId 20893) / Office 365 (AppId 11161), configured to move incoming messages to the ''RSS Feeds'' folder. The activity was associated with several IP addresses including `95.202.65.202`, `192.238.237.190`, `180.144.153.174`, and `255.246.85.58`, suggesting the account may be compromised. The affected mailbox belongs to a user in the vnevado.alpineskihouse.co tenant.'
    question: 'A follow-up alert the next day flagged suspicious events with business email compromise (BEC) characteristics, indicating a possible financial fraud attempt against the organization, and it involved the same account tied to the earlier inbox manipulation rule. What is the email address of the user account involved in that BEC financial fraud alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox manipulation rule named `ITCleanup` (MoveToFolder to `RSS Feeds`) was created on the mailbox of the user with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, indicating the account may be compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account, with email `laylaw@vnevado.alpineskihouse.co`, was then observed in events with business email compromise (BEC) characteristics, indicating a possible financial fraud attempt.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
