tasks:
- task_id: incident_166_latest_cleaned_test_set_task_4
  title: incident_166_latest_cleaned_test_set_task_4
  description: 'For the ''Suspicious SAP authentication'' alert that followed this risky sign-in, what is the cloud application ID (AppId) of the cloud app recorded in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of an incident involving suspected SAP financial process manipulation, Microsoft Entra ID Protection raised an ''Anonymous IP address'' alert for a sign-in originating from the anonymizing IP address `95.202.65.202` (e.g. Tor browser or anonymizer VPN). The same compromised user account was later observed authenticating to the enterprise application software SAP, which triggered a ''Suspicious SAP authentication'' alert, indicating an attacker may have been searching for or modifying sensitive financial information.'
    question: 'For the ''Suspicious SAP authentication'' alert that followed this risky sign-in, what is the cloud application ID (AppId) of the cloud app recorded in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The cloud-application AppId is `100` (the SAP enterprise application).'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The cloud-application AppId is `100` (the SAP enterprise application).'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in from an anonymous IP address (e.g. Tor browser or anonymizer VPN), triggering a risky sign-in alert in Microsoft Entra ID.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using that same compromised, risky account, the attacker then signed in to the SAP enterprise application, identified by cloud-application AppId `100`, potentially to search, record, or modify sensitive financial information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
