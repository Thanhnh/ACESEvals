tasks:
- task_id: incident_166_latest_cleaned_test_set_task_58
  title: incident_166_latest_cleaned_test_set_task_58
  description: 'About ten minutes later, at 10:00:07 UTC on 2024-07-22, a second ''Suspicious inbox manipulation rule'' alert was raised for the same compromised identity, where inbox rules were manipulated to delete or move messages and potentially exfiltrate data. What is the security identifier (SID) of the account reported in that follow-up alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a suspected business email compromise, an alert fired on 2024-07-22 at 09:49:55 UTC for a ''Suspicious inbox manipulation rule''. A MoveToFolder rule named ''ITCleanup'' was created on the mailbox `laylaw@vnevado.alpineskihouse.co` (Jordan P) to move incoming messages into the ''RSS Feeds'' folder. The activity was seen across the cloud applications ''Microsoft Exchange Online'' and ''Office 365 / Microsoft 365'' (AppId 11161), originating from the IP addresses `95.202.65.202`, `192.238.237.190`, and `180.144.153.174`.'
    question: 'About ten minutes later, at 10:00:07 UTC on 2024-07-22, a second ''Suspicious inbox manipulation rule'' alert was raised for the same compromised identity, where inbox rules were manipulated to delete or move messages and potentially exfiltrate data. What is the security identifier (SID) of the account reported in that follow-up alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1740051960-3534030288-108486866-1602'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1740051960-3534030288-108486866-1602'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox manipulation rule named `ITCleanup` (MoveToFolder rule moving messages to the `RSS Feeds` folder) was created on the mailbox of the account with Email `laylaw@vnevado.alpineskihouse.co` (Jordan P), indicating the account may be compromised and used to spread phishing emails.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Further suspicious inbox rule manipulation — deleting or moving messages/folders to exfiltrate data — was performed by the compromised user account with Sid `S-1-5-21-1740051960-3534030288-108486866-1602`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
