tasks:
- task_id: incident_166_latest_cleaned_test_set_task_65
  title: incident_166_latest_cleaned_test_set_task_65
  description: 'For the ''Suspicious SAP authentication'' alert connected to this password spray activity, what is the cloud application ID (AppId) of the cloud app recorded in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, a Password Spray attack was detected originating from the IP address `95.202.65.202`, targeting user accounts in our Microsoft Entra ID tenant. Following this, one of the affected user accounts with a risky sign-in alert was seen signing in to SAP, the enterprise application software, triggering a ''Suspicious SAP authentication'' alert. An attacker might have taken control of the user account to search through SAP with the intention of recording or modifying sensitive financial information.'
    question: 'For the ''Suspicious SAP authentication'' alert connected to this password spray activity, what is the cloud application ID (AppId) of the cloud app recorded in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The cloud application involved in the Suspicious SAP authentication alert has AppId `100`.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The cloud application involved in the Suspicious SAP authentication alert has AppId `100`.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected targeting the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` then performed a risky sign-in to the cloud application with AppId `100` (SAP), indicating suspicious SAP authentication.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
