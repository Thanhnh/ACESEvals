tasks:
- task_id: incident_166_latest_cleaned_test_set_task_2
  title: incident_166_latest_cleaned_test_set_task_2
  description: 'The same user account triggered an earlier ''Anonymous IP address'' sign-in alert roughly 26 minutes before this one (around 2024-07-22 08:45:32 UTC). What was the source IP address used in that earlier anonymous sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of this security incident, an ''Anonymous IP address'' alert was raised at 2024-07-22 09:11:31 UTC, indicating a sign-in from the anonymous IP address `192.238.237.190` (e.g. Tor browser or anonymizer VPN). This sign-in was tied to a compromised user account in the environment.'
    question: 'The same user account triggered an earlier ''Anonymous IP address'' sign-in alert roughly 26 minutes before this one (around 2024-07-22 08:45:32 UTC). What was the source IP address used in that earlier anonymous sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from an anonymous IP address (e.g. Tor browser or anonymizer VPN) was detected for the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The anonymous sign-in activity originated from the IP address `95.202.65.202`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
