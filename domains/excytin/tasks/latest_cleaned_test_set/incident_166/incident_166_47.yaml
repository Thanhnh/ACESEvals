tasks:
- task_id: incident_166_latest_cleaned_test_set_task_47
  title: incident_166_latest_cleaned_test_set_task_47
  description: 'Later in this incident, a user tied to the business email compromise activity also signed in to SAP in a suspicious manner. What is the cloud application AppId recorded for that SAP sign-in alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of the SAP financial process manipulation incident, a suspicious inbox manipulation rule was detected on the mailbox `laylaw@vnevado.alpineskihouse.co`. The user created a MoveToFolder rule named ''ITCleanup'' to move messages into the ''RSS Feeds'' folder, which may indicate the account was compromised and is being used to spread phishing emails. The activity involved the cloud applications `microsoft exchange online` (AppId 20893) and `office 365 / microsoft 365` (AppId 11161), and originated from IP addresses such as 95.202.65.202, 192.238.237.190, 180.144.153.174 and 255.246.85.58.'
    question: 'Later in this incident, a user tied to the business email compromise activity also signed in to SAP in a suspicious manner. What is the cloud application AppId recorded for that SAP sign-in alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'AppId: 100'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'AppId: 100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Jordan P` (laylaw@vnevado.alpineskihouse.co) was compromised and a suspicious inbox manipulation rule named `ITCleanup` (MoveToFolder rule moving messages to the `RSS Feeds` folder) was created on their mailbox, indicating a business email compromise (BEC).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same BEC-related user then signed in suspiciously to the SAP cloud application with AppId `100`, suggesting the attacker used the compromised account to search SAP for sensitive financial information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
