tasks:
- task_id: incident_166_latest_cleaned_test_set_task_16
  title: incident_166_latest_cleaned_test_set_task_16
  description: 'For the follow-on ''Suspicious inbox manipulation rule'' alert linked to this same user, what is the AppId of the cloud application where the rule manipulation took place?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an ''Anonymous IP address'' alert was raised on 2024-07-22 08:45:32 UTC after a sign-in was observed from the anonymous IP `95.202.65.202` (e.g., Tor browser or anonymizer VPN). Roughly an hour later, the same compromised user account was associated with a ''Suspicious inbox manipulation rule'' alert, where inbox rules were modified in a suspicious manner — potentially to delete or move messages and exfiltrate data.'
    question: 'For the follow-on ''Suspicious inbox manipulation rule'' alert linked to this same user, what is the AppId of the cloud application where the rule manipulation took place?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '20893'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from an anonymous IP address (e.g. Tor browser or anonymizer VPN) was detected for the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` at 2024-07-22 08:45:32 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise of that account, suspicious inbox manipulation rules were created to delete or move messages, observed in the cloud application with AppId `20893` (Microsoft Exchange Online) at 2024-07-22 10:00:07 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
