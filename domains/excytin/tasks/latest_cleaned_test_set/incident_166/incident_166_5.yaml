tasks:
- task_id: incident_166_latest_cleaned_test_set_task_5
  title: incident_166_latest_cleaned_test_set_task_5
  description: 'About 25 minutes later, a follow-up alert flagged suspicious emails sent by a possibly compromised account tied to this same BEC fraud attempt. What is the sender address of those suspicious email messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) investigation, a suspicious inbox manipulation rule alert was raised at 2024-07-22 09:49:55 UTC for the user Jordan P. The user created a MoveToFolder rule named `ITCleanup` on their own inbox to move messages to a folder named `RSS Feeds`. The activity was associated with the cloud applications `microsoft exchange online` (AppId 20893) and `office 365 / microsoft 365` (AppId 11161), and originated from the IP addresses `95.202.65.202`, `192.238.237.190`, and `180.144.153.174`. This may indicate the account is compromised and the mailbox is being used to spread phishing emails.'
    question: 'About 25 minutes later, a follow-up alert flagged suspicious emails sent by a possibly compromised account tied to this same BEC fraud attempt. What is the sender address of those suspicious email messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox manipulation rule named `ITCleanup` was created on the mailbox of the account with email `laylaw@vnevado.alpineskihouse.co`, moving incoming messages to the `RSS Feeds` folder — an indication the account is compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, suspicious emails related to an ongoing BEC (business email compromise) fraud attempt were sent by the mail message sender `laylaw@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
