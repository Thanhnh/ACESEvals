tasks:
- task_id: incident_166_latest_cleaned_test_set_task_86
  title: incident_166_latest_cleaned_test_set_task_86
  description: 'Earlier in the same incident, a related compromised mailbox had a suspicious inbox manipulation rule (a MoveToFolder rule named ''ITCleanup'') created on it. What source IP address was recorded in that inbox rule alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the ''SAP financial process manipulation'' incident, an alert for suspicious SAP authentication was raised: a user account flagged with a risky sign-in in Microsoft Entra ID signed in to the SAP enterprise application (cloud application AppId `100`) from the IP address `107.253.5.27`. An attacker might have taken control of this account to search through SAP with the intention of recording or modifying sensitive financial information.'
    question: 'Earlier in the same incident, a related compromised mailbox had a suspicious inbox manipulation rule (a MoveToFolder rule named ''ITCleanup'') created on it. What source IP address was recorded in that inbox rule alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with email `laylaw@vnevado.alpineskihouse.co` was flagged for a risky sign-in in Microsoft Entra ID and signed in to SAP, indicating the account may have been compromised to search for sensitive financial information.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From the compromised account, a suspicious inbox manipulation rule named `ITCleanup` was created to move messages to the `RSS Feeds` folder, and this activity originated from the IP address `255.246.85.58`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
