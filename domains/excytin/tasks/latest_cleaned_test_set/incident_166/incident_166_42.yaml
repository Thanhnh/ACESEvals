tasks:
- task_id: incident_166_latest_cleaned_test_set_task_42
  title: incident_166_latest_cleaned_test_set_task_42
  description: 'For the suspicious SAP authentication alert, what was the source IP address associated with the risky sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a security incident, a ''Possible BEC financial fraud'' alert was raised on 2024-07-23, involving suspicious events with business email compromise characteristics against the user ''Jordan P'' (email `laylaw@vnevado.alpineskihouse.co`, AAD user ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`). An attacker might be attempting to conduct a fraud attack against the organization. Earlier in the same incident, on 2024-07-22, a related alert flagged a suspicious SAP authentication, where an account with a risky sign-in in Microsoft Entra ID signed in to the SAP enterprise application, possibly to search for or modify sensitive financial information.'
    question: 'For the suspicious SAP authentication alert, what was the source IP address associated with the risky sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` was involved in suspicious events with business email compromise (BEC) characteristics, indicating a possible financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account had a risky sign-in and authenticated to SAP from the suspicious IP address `107.253.5.27`, which was used to search for sensitive financial information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
