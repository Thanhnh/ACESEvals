tasks:
- task_id: incident_166_latest_cleaned_test_set_task_3
  title: incident_166_latest_cleaned_test_set_task_3
  description: 'Which user account was identified in the ''Possible BEC financial fraud'' alert that is linked back to the suspicious inbox rule manipulation?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise investigation, an alert for ''Suspicious inbox manipulation rule'' was raised on 2024-07-22, involving cloud application AppId `20893` and the IP address `255.246.85.58`. The alert indicated that a user''s inbox rules were manipulated in a suspicious manner, suggesting an attacker may have gained access to a mailbox and is moving or deleting messages to exfiltrate data. A day later, a related alert titled ''Possible BEC financial fraud'' was triggered, indicating an attacker might be attempting to conduct a fraud attack against the organization.'
    question: 'Which user account was identified in the ''Possible BEC financial fraud'' alert that is linked back to the suspicious inbox rule manipulation?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The account name is `Jordan P`.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The account name is `Jordan P`.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Jordan P` had inbox rules manipulated in a suspicious manner on 2024-07-22, indicating an attacker may have gained access to the mailbox and is moving or deleting messages to hide activity and exfiltrate data.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same user account `Jordan P` was then observed in suspicious events with business email compromise (BEC) characteristics on 2024-07-23, indicating a possible financial fraud attempt against the organization.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
