tasks:
- task_id: incident_166_latest_cleaned_test_set_task_59
  title: incident_166_latest_cleaned_test_set_task_59
  description: 'A follow-up alert, ''Possible BEC financial fraud'', was triggered on 2024-07-23 for the same compromised user. What is the on-premises security identifier (SID) of the account associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) investigation, an alert titled ''BEC financial fraud'' was raised on 2024-07-22, reporting that a suspicious inbox rule hiding incoming email messages was created within a risky Azure Active Directory session originating from the IP address `255.246.85.58`.'
    question: 'A follow-up alert, ''Possible BEC financial fraud'', was triggered on 2024-07-23 for the same compromised user. What is the on-premises security identifier (SID) of the account associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1740051960-3534030288-108486866-1602'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1740051960-3534030288-108486866-1602'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule that hides incoming email messages was created in a risky Azure AD session by the user with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, indicating a possible business email compromise (BEC) financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Further suspicious events with BEC characteristics were observed for the related on-premises account with SID `S-1-5-21-1740051960-3534030288-108486866-1602`, suggesting an attacker is attempting to conduct a fraud attack against the organization.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
