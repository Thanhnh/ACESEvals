tasks:
- task_id: incident_166_latest_cleaned_test_set_task_64
  title: incident_166_latest_cleaned_test_set_task_64
  description: 'For the follow-up ''Possible BEC financial fraud'' alert that is linked to this same compromised user account, what is the Microsoft Entra ID (AAD) user ID of the account involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) investigation, an alert titled ''Suspicious emails sent by BEC-related user'' fired on 2024-07-22, showing suspicious emails sent from the possibly compromised account `laylaw@vnevado.alpineskihouse.co` (sender IP `255.246.85.58`) to the mailbox `tony@avoriaz.alpineskihouse.co`. A day later, a related alert ''Possible BEC financial fraud'' was raised, indicating an attacker might be attempting a fraud attack against the organization.'
    question: 'For the follow-up ''Possible BEC financial fraud'' alert that is linked to this same compromised user account, what is the Microsoft Entra ID (AAD) user ID of the account involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` sent suspicious emails as part of an ongoing BEC (business email compromise) fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The related BEC activity escalated into possible BEC financial fraud events performed by the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
