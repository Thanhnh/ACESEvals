tasks:
- task_id: incident_166_latest_cleaned_test_set_task_13
  title: incident_166_latest_cleaned_test_set_task_13
  description: 'Earlier in this same incident, an alert was raised for a suspicious inbox manipulation rule, where an attacker likely gained access to a mailbox and manipulated rules to delete or move messages in order to exfiltrate data. From which source IP address was this suspicious inbox rule activity performed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) style incident, an alert titled ''Possible BEC financial fraud'' was raised on 2024-07-23, involving the user account `Jordan P` (email `laylaw@vnevado.alpineskihouse.co`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`). Suspicious events with BEC characteristics were observed, suggesting an attacker might be attempting to conduct a fraud attack against the organization.'
    question: 'Earlier in this same incident, an alert was raised for a suspicious inbox manipulation rule, where an attacker likely gained access to a mailbox and manipulated rules to delete or move messages in order to exfiltrate data. From which source IP address was this suspicious inbox rule activity performed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` was involved in suspicious events with business email compromise (BEC) characteristics, indicating a possible financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised mailbox was then manipulated with suspicious inbox rules to delete or move messages, and this inbox manipulation activity originated from the IP address `255.246.85.58`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
