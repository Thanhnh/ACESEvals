tasks:
- task_id: incident_166_latest_cleaned_test_set_task_23
  title: incident_166_latest_cleaned_test_set_task_23
  description: 'Approximately an hour and a half after this anonymous sign-in, an alert fired for suspicious emails sent by this BEC-related user account. What was the recipient email address of those suspicious messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) fraud attempt, an alert was raised for a sign-in from an anonymous IP address `95.202.65.202` (e.g. Tor browser or anonymizer VPN) on 2024-07-22 at 08:45 UTC. The compromised user account linked to this sign-in was later associated with additional malicious activity.'
    question: 'Approximately an hour and a half after this anonymous sign-in, an alert fired for suspicious emails sent by this BEC-related user account. What was the recipient email address of those suspicious messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tony@avoriaz.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tony@avoriaz.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in was detected from an anonymous IP address (e.g., Tor browser or anonymizer VPN) for the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, indicating the account was likely compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised user account then sent suspicious emails as part of an ongoing BEC (business email compromise) fraud attempt, with the mail message delivered to the recipient `tony@avoriaz.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
