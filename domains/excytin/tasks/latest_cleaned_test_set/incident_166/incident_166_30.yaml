tasks:
- task_id: incident_166_latest_cleaned_test_set_task_30
  title: incident_166_latest_cleaned_test_set_task_30
  description: 'For the earlier alert about the suspicious inbox manipulation rule tied to the same compromised account, what source IP address was the mailbox rule activity performed from?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a SAP financial process manipulation incident, an alert for ''Suspicious SAP authentication'' was raised: a user account with a risky sign-in alert in Microsoft Entra ID signed in to the SAP enterprise application (AppId 100) from the IP address `107.253.5.27`. An attacker might have taken control of the account to search SAP for sensitive financial information. The same compromised user account was also involved in an earlier alert on the same day, where the user''s inbox rules were manipulated in a suspicious manner, possibly to delete or move messages and exfiltrate data.'
    question: 'For the earlier alert about the suspicious inbox manipulation rule tied to the same compromised account, what source IP address was the mailbox rule activity performed from?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` was flagged with a risky sign-in in Microsoft Entra ID and signed in to the SAP enterprise application, indicating the account may have been compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the compromised account, the attacker manipulated the user''s inbox rules to delete or move messages and exfiltrate data, with the suspicious inbox manipulation activity originating from IP address `255.246.85.58`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
