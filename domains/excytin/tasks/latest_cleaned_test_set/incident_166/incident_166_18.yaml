tasks:
- task_id: incident_166_latest_cleaned_test_set_task_18
  title: incident_166_latest_cleaned_test_set_task_18
  description: 'What was the source IP address used in that anonymous sign-in associated with this user?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) financial fraud alert, suspicious events were observed involving the account `Jordan P` with email `laylaw@vnevado.alpineskihouse.co` (SID `S-1-5-21-1740051960-3534030288-108486866-1602`), suggesting an attacker might be attempting to conduct a fraud attack against the organization. Earlier in the same incident, the same compromised user was flagged by Microsoft Entra ID Protection for signing in from an anonymizing service such as a Tor browser or anonymizer VPN.'
    question: 'What was the source IP address used in that anonymous sign-in associated with this user?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious events with business email compromise (BEC) characteristics were observed for the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, indicating a possible financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account was accessed through a sign-in from an anonymous IP address (e.g. Tor browser or anonymizer VPN) with Address `95.202.65.202`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
