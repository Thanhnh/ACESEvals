tasks:
- task_id: incident_166_latest_cleaned_test_set_task_81
  title: incident_166_latest_cleaned_test_set_task_81
  description: 'Which user account''s mailbox was affected by the suspicious inbox manipulation rule activity? Provide the email address.'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a password spray attack was detected originating from the IP address `95.202.65.202`, targeting accounts in the organization. Shortly after, one of the compromised accounts was observed having its inbox rules manipulated in a suspicious manner - an attacker might have gained access to the user''s mailbox and modified rules to delete or move messages or folders in order to exfiltrate data from the organization.'
    question: 'Which user account''s mailbox was affected by the suspicious inbox manipulation rule activity? Provide the email address.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected against the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` at 2024-07-23 14:23:51 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, suspicious inbox manipulation rules were created on the mailbox of the account with email `laylaw@vnevado.alpineskihouse.co`, indicating the attacker gained access to the user''s inbox to hide or exfiltrate messages.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
