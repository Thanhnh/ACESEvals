tasks:
- task_id: incident_166_latest_cleaned_test_set_task_60
  title: incident_166_latest_cleaned_test_set_task_60
  description: 'What is the anonymous IP address from which this user signed in, as reported by the earlier sign-in alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) financial fraud investigation, an alert was raised because a suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session. The activity was associated with the account `Jordan P` (`laylaw@vnevado.alpineskihouse.co`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`) and originated from IP address `255.246.85.58`. Earlier in the same incident, the same compromised user account was seen signing in from an anonymous IP address, such as a Tor browser or anonymizer VPN.'
    question: 'What is the anonymous IP address from which this user signed in, as reported by the earlier sign-in alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule that hides incoming email messages was created in a risky Azure AD session by the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, indicating a possible business email compromise (BEC) financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Investigating that compromised account''s sign-in activity shows the risky session originated from an anonymous IP address (e.g., Tor browser or anonymizer VPN) with Address `192.238.237.190`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
