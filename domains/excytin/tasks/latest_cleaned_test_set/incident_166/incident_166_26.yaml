tasks:
- task_id: incident_166_latest_cleaned_test_set_task_26
  title: incident_166_latest_cleaned_test_set_task_26
  description: 'A closely related alert, ''Suspicious inbox manipulation rule'', was triggered at nearly the same time for this same user. What is the AppId of the cloud application associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident involving SAP financial process manipulation and business email compromise, an alert titled ''BEC financial fraud'' was raised on 2024-07-22. It reported that a suspicious inbox rule hiding incoming email messages was created in a risky Azure AD session by the user `Jordan P` (email `laylaw@vnevado.alpineskihouse.co`, AAD User ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`) from IP address `255.246.85.58`.'
    question: 'A closely related alert, ''Suspicious inbox manipulation rule'', was triggered at nearly the same time for this same user. What is the AppId of the cloud application associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The cloud application involved has AppId `20893` (Microsoft Exchange Online).'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The cloud application involved has AppId `20893` (Microsoft Exchange Online).'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` was compromised in a risky Azure Active Directory session, where a suspicious inbox rule hiding incoming email messages was created, indicating an attempted business email compromise (BEC) financial fraud.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker then performed suspicious inbox manipulation rules (deleting or moving messages/folders to exfiltrate data) through the cloud application with AppId `20893` (Microsoft Exchange Online).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
