tasks:
- task_id: incident_166_latest_cleaned_test_set_task_50
  title: incident_166_latest_cleaned_test_set_task_50
  description: 'What was the source IP address used in the suspicious SAP authentication alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) style incident, an alert titled ''Possible BEC financial fraud'' was raised on 2024-07-23 involving the user account ''Jordan P'' (email `laylaw@vnevado.alpineskihouse.co`, AAD user ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`). Suspicious events with BEC characteristics were observed, suggesting an attacker might be attempting to conduct a fraud attack against the organization. Earlier, on 2024-07-22, a related alert flagged a suspicious SAP authentication where a user account with a risky sign-in in Microsoft Entra ID signed in to the SAP enterprise application, potentially to view or modify sensitive financial information.'
    question: 'What was the source IP address used in the suspicious SAP authentication alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` was involved in suspicious events with business email compromise (BEC) characteristics, indicating a possible financial fraud attempt against the organization.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user account, flagged with a risky sign-in alert in Microsoft Entra ID, then authenticated to SAP from the suspicious IP address `107.253.5.27`, potentially to view or modify sensitive financial information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
