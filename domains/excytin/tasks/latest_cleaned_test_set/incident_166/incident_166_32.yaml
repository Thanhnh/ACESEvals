tasks:
- task_id: incident_166_latest_cleaned_test_set_task_32
  title: incident_166_latest_cleaned_test_set_task_32
  description: 'A follow-up alert shows that the same compromised user later signed in to SAP in a suspicious manner. What was the source IP address used for that SAP sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) style incident, an alert was raised for a ''Suspicious inbox manipulation rule'', where a user''s inbox rules were manipulated in a suspicious manner, potentially to delete or move messages and exfiltrate data. This activity was observed in the cloud application with AppId `20893` and originated from the IP address `255.246.85.58`.'
    question: 'A follow-up alert shows that the same compromised user later signed in to SAP in a suspicious manner. What was the source IP address used for that SAP sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An attacker gained access to a user''s mailbox and created a suspicious inbox manipulation rule for the account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` at 2024-07-22 10:00:07 UTC, likely to hide or exfiltrate messages as part of a business email compromise (BEC).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same BEC-related compromised user then signed in to SAP in a suspicious manner at 2024-07-22 14:09:41 UTC, from the source IP address `107.253.5.27`, indicating the attacker used the hijacked account to search SAP for sensitive financial information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
