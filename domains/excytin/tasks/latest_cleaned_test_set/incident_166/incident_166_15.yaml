tasks:
- task_id: incident_166_latest_cleaned_test_set_task_15
  title: incident_166_latest_cleaned_test_set_task_15
  description: 'For the follow-up alert about the BEC-related user signing in to SAP, what is the on-premises security identifier (SID) of the account involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a high-severity incident involving SAP financial process manipulation (attack disruption), an alert for ''Suspicious SAP authentication'' was raised after a user account with a risky sign-in in Microsoft Entra ID signed in to SAP. The account involved was `Jordan P` (email `laylaw@vnevado.alpineskihouse.co`, AAD User ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`), signing in from IP address `107.253.5.27` against cloud application ID `100`. Roughly 50 minutes later, a related alert fired indicating that a user involved in a business email compromise (BEC)-related alert also signed in to SAP in a suspicious manner.'
    question: 'For the follow-up alert about the BEC-related user signing in to SAP, what is the on-premises security identifier (SID) of the account involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1740051960-3534030288-108486866-1602'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1740051960-3534030288-108486866-1602'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` was flagged with a risky sign-in alert in Microsoft Entra ID and then signed in to SAP, the enterprise application software, indicating a potentially compromised account searching for sensitive financial information.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same user account with SID `S-1-5-21-1740051960-3534030288-108486866-1602`, which was involved in a business email compromise (BEC)-related alert, subsequently signed in to SAP in a suspicious manner, suggesting the attacker used the compromised account to record or modify sensitive financial information for later phishing or social engineering stages.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
