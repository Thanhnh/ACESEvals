tasks:
- task_id: incident_166_latest_cleaned_test_set_task_44
  title: incident_166_latest_cleaned_test_set_task_44
  description: 'Following this activity, the same compromised user was flagged in a BEC-related alert for signing in to SAP in a suspicious manner. What was the source IP address used for that SAP sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a high-severity incident involving SAP financial process manipulation, a sign-in was detected from an anonymous IP address `192.238.237.190` (e.g., Tor browser or anonymizer VPN), indicating a potentially compromised user account.'
    question: 'Following this activity, the same compromised user was flagged in a BEC-related alert for signing in to SAP in a suspicious manner. What was the source IP address used for that SAP sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in was detected from an anonymous IP address (e.g., Tor browser or anonymizer VPN) for the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` at 2024-07-22 09:11:31 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user, involved in a business email compromise-related alert, later signed in to SAP in a suspicious manner from the IP address `107.253.5.27` at 2024-07-22 14:09:41 UTC, potentially to search for or modify sensitive financial information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
