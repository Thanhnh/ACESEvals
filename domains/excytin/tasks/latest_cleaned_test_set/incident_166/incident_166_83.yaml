tasks:
- task_id: incident_166_latest_cleaned_test_set_task_83
  title: incident_166_latest_cleaned_test_set_task_83
  description: 'While pivoting on this compromised account''s activity in the incident, which source IP address was observed being used by the attacker in the related malicious sign-in/mailbox activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A high-severity ''BEC financial fraud'' alert was raised as part of a multi-stage incident: a suspicious inbox rule that hides incoming email messages was created during a risky Azure Active Directory session. The alert is tied to the account `Jordan P` (email `laylaw@vnevado.alpineskihouse.co`, AAD User ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`), suggesting an attacker may be attempting business email compromise (BEC), a form of financial fraud.'
    question: 'While pivoting on this compromised account''s activity in the incident, which source IP address was observed being used by the attacker in the related malicious sign-in/mailbox activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule that hides incoming email messages was created within a risky Azure Active Directory session, indicating a possible business email compromise (BEC) financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The suspicious inbox rule creation activity originated from the IP address `255.246.85.58`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
