tasks:
- task_id: incident_166_latest_cleaned_test_set_task_10
  title: incident_166_latest_cleaned_test_set_task_10
  description: 'Earlier that same day, the same compromised identity was flagged by Microsoft Entra ID Protection for signing in from an anonymizing service such as a Tor browser or anonymizer VPN. What is the anonymous IP address recorded in that sign-in alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident involving SAP financial process manipulation, an alert for ''Suspicious SAP authentication'' was triggered when the user account `Jordan P` (`laylaw@vnevado.alpineskihouse.co`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`), which had a prior risky sign-in in Microsoft Entra ID, signed in to the SAP enterprise application (AppId 100) from IP address `107.253.5.27`. An attacker might have taken control of this account to search through SAP with the intention of recording or modifying sensitive financial information.'
    question: 'Earlier that same day, the same compromised identity was flagged by Microsoft Entra ID Protection for signing in from an anonymizing service such as a Tor browser or anonymizer VPN. What is the anonymous IP address recorded in that sign-in alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` was flagged for a risky sign-in and then signed in to the SAP enterprise application, triggering the ''Suspicious SAP authentication'' alert at 2024-07-22 12:59:26 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Investigating that user''s risky sign-in activity shows the sign-in originated from an anonymous IP address (Tor/anonymizer VPN) with Address `95.202.65.202` at 2024-07-22 08:45:32 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
