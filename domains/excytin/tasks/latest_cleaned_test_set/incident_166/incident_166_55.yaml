tasks:
- task_id: incident_166_latest_cleaned_test_set_task_55
  title: incident_166_latest_cleaned_test_set_task_55
  description: 'Earlier the same day, the same compromised identity was flagged by another alert for signing in from an anonymizing service such as a Tor browser or anonymizer VPN. What was the source IP address recorded in that anonymous sign-in alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) related security incident, an alert titled "BEC-related user signed in to SAP" was raised on 2024-07-22. The account involved belonged to `Jordan P` (`laylaw@vnevado.alpineskihouse.co`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`), which signed in to SAP (cloud application AppId 100) in a suspicious manner from the IP address `107.253.5.27`. An attacker might have taken control of this user account to search through SAP with the intention of recording or modifying sensitive financial information.'
    question: 'Earlier the same day, the same compromised identity was flagged by another alert for signing in from an anonymizing service such as a Tor browser or anonymizer VPN. What was the source IP address recorded in that anonymous sign-in alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, who was involved in a business email compromise-related alert, signed in to SAP in a suspicious manner, indicating the account may have been taken over to access sensitive financial information.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user account was observed signing in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) with the address `95.202.65.202`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
