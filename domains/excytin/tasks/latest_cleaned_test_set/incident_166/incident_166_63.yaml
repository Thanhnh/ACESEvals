tasks:
- task_id: incident_166_latest_cleaned_test_set_task_63
  title: incident_166_latest_cleaned_test_set_task_63
  description: 'Earlier in this same incident, an alert reported suspicious emails being sent by the possibly compromised BEC-related user account. What is the sender email address of those suspicious messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a high-severity incident involving SAP financial process manipulation (attack disruption), an alert titled ''BEC-related user signed in to SAP'' was raised. It indicated that a user involved in a business email compromise-related alert also signed in to SAP (cloud application AppId 100) in a suspicious manner from the IP address `107.253.5.27`. An attacker might have taken control of the user account to search through SAP with the intention of recording or modifying sensitive financial information.'
    question: 'Earlier in this same incident, an alert reported suspicious emails being sent by the possibly compromised BEC-related user account. What is the sender email address of those suspicious messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Jordan P`, involved in a business email compromise-related alert, signed in to SAP in a suspicious manner, potentially to search for or modify sensitive financial information.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, suspicious emails were sent by the BEC-related compromised user account with sender address `laylaw@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
