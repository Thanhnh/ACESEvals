tasks:
- task_id: incident_166_latest_cleaned_test_set_task_71
  title: incident_166_latest_cleaned_test_set_task_71
  description: 'An earlier related alert flagged a sign-in from an anonymous IP address (e.g., Tor browser or anonymizing VPN) for this same compromised user. What is the Microsoft Entra (AAD) user ID of the account involved in that sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident investigation, a suspicious inbox rule named `ITCleanup` was found set on the mailbox of user Jordan P (`laylaw@vnevado.alpineskihouse.co`), configured to move incoming messages to the `RSS Feeds` folder. This activity, observed across Office 365 / Microsoft Exchange Online, suggests the account may be compromised and used to spread phishing emails. Sign-in activity from this account was seen from IP addresses such as `192.238.237.190` and `255.246.85.58`.'
    question: 'An earlier related alert flagged a sign-in from an anonymous IP address (e.g., Tor browser or anonymizing VPN) for this same compromised user. What is the Microsoft Entra (AAD) user ID of the account involved in that sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in was detected from an anonymous IP address (e.g., Tor browser or anonymizer VPN) for the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` at 2024-07-22 08:45:32 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the anonymous sign-in, the same compromised account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` (Jordan P, laylaw@vnevado.alpineskihouse.co) created a suspicious MoveToFolder inbox rule named `ITCleanup` that moves messages to the `RSS Feeds` folder at 2024-07-22 09:49:55 UTC, indicating the mailbox is being used to hide phishing activity.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
