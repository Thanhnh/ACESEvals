tasks:
- task_id: incident_166_latest_cleaned_test_set_task_7
  title: incident_166_latest_cleaned_test_set_task_7
  description: 'For the earlier ''Anonymous IP address'' sign-in alert linked to this password spray activity, what was the source IP address used by the attacker?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a Password Spray attack alert was raised on 2024-07-23 involving the account with AAD User ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`. Reviewing earlier activity, an affected account was also flagged on 2024-07-22 for an ''Anonymous IP address'' alert, indicating a sign-in originating from an anonymizing service such as a Tor browser or an anonymizer VPN.'
    question: 'For the earlier ''Anonymous IP address'' sign-in alert linked to this password spray activity, what was the source IP address used by the attacker?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected against the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` at 2024-07-23 14:23:51 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account was then used to sign in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) with Address `95.202.65.202`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
