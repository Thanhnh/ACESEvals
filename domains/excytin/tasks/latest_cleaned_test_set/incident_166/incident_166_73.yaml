        title: Checkpoint 2
        description: 'The suspicious inbox manipulation rule named `ITCleanup` (moving messages to the `RSS Feeds` folder) was set on the mailbox of Jordan P (laylaw@vnevado.alpineskihouse.co) from the IP address `95.202.65.202`.'
