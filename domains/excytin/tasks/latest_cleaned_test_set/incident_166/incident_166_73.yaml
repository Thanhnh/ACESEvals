        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` created a suspicious inbox rule that hides incoming email messages during a risky Azure Active Directory session, indicating a possible business email compromise (BEC) financial fraud attempt.'
      checkpoint_2:
