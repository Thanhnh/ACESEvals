tasks:
- task_id: incident_166_latest_cleaned_test_set_task_11
  title: incident_166_latest_cleaned_test_set_task_11
  description: 'Following this activity, the same compromised user account was flagged in another alert for signing in to SAP in a suspicious manner. What is the cloud application ID (AppId) recorded for the cloud application entity in that follow-up sign-in alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a SAP financial process manipulation incident, an alert titled ''BEC financial fraud'' was raised after a suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session originating from the IP address `255.246.85.58`. An attacker might be attempting to conduct business email compromise (BEC), a form of financial fraud.'
    question: 'Following this activity, the same compromised user account was flagged in another alert for signing in to SAP in a suspicious manner. What is the cloud application ID (AppId) recorded for the cloud application entity in that follow-up sign-in alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The cloud application involved in the ''BEC-related user signed in to SAP'' alert has AppId `100`.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The cloud application involved in the ''BEC-related user signed in to SAP'' alert has AppId `100`.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule that hides incoming email messages was created in a risky Azure AD session by the user account with SID `S-1-5-21-1740051960-3534030288-108486866-1602`, indicating a business email compromise (BEC) financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same BEC-related user account then signed in suspiciously to the SAP cloud application with AppId `100`, potentially to search for or modify sensitive financial information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
