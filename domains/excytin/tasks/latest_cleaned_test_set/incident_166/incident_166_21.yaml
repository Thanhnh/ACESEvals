tasks:
- task_id: incident_166_latest_cleaned_test_set_task_21
  title: incident_166_latest_cleaned_test_set_task_21
  description: 'Earlier in the same incident, an alert reported suspicious emails being sent by a possibly compromised user account tied to an ongoing BEC (business email compromise) fraud attempt. What is the IP address associated with that email-sending activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a high-severity SAP financial process manipulation incident, an alert titled ''Suspicious SAP authentication'' was raised: a user account that had a risky sign-in alert in Microsoft Entra ID signed in to the SAP enterprise application (Cloud AppId 100) from the IP address `107.253.5.27`. An attacker might have taken control of the account to search SAP with the intention of recording or modifying sensitive financial information.'
    question: 'Earlier in the same incident, an alert reported suspicious emails being sent by a possibly compromised user account tied to an ongoing BEC (business email compromise) fraud attempt. What is the IP address associated with that email-sending activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with email `laylaw@vnevado.alpineskihouse.co` was flagged with a risky sign-in in Microsoft Entra ID and signed in to SAP, suggesting the account was compromised to access sensitive financial information.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user account was then used to send suspicious emails as part of an ongoing BEC (business email compromise) fraud attempt, originating from the IP address `255.246.85.58`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
