tasks:
- task_id: incident_166_latest_cleaned_test_set_task_53
  title: incident_166_latest_cleaned_test_set_task_53
  description: 'Following the activity of this compromised user, a later alert was raised when the same BEC-related user signed in to SAP in a suspicious manner. What is the AppId of the cloud application recorded in that later alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise incident involving SAP financial process manipulation, one alert flagged a sign-in from the anonymous IP address `95.202.65.202` (e.g., Tor browser or anonymizer VPN), suggesting an attacker may have hidden their true location while accessing a user account.'
    question: 'Following the activity of this compromised user, a later alert was raised when the same BEC-related user signed in to SAP in a suspicious manner. What is the AppId of the cloud application recorded in that later alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The cloud application involved has AppId `100`.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The cloud application involved has AppId `100`.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in from an anonymous IP address (e.g. Tor browser or anonymizer VPN) at 2024-07-22 08:45:32 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user, involved in a business email compromise-related alert, then signed in suspiciously to the SAP cloud application with AppId `100` at 2024-07-22 14:09:41 UTC, potentially to search for or modify sensitive financial information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
