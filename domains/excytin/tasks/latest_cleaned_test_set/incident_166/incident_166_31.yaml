tasks:
- task_id: incident_166_latest_cleaned_test_set_task_31
  title: incident_166_latest_cleaned_test_set_task_31
  description: 'What was the anonymous IP address used to sign in to the compromised account in the earlier related alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) financial fraud incident, suspicious events were observed involving the account `Jordan P` (email: `laylaw@vnevado.alpineskihouse.co`, SID: `S-1-5-21-1740051960-3534030288-108486866-1602`), suggesting an attacker might be attempting to conduct a fraud attack against the organization. Prior to this activity, the same compromised user account was flagged by an identity protection alert for signing in from an anonymous source such as a Tor browser or anonymizer VPN.'
    question: 'What was the anonymous IP address used to sign in to the compromised account in the earlier related alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` was involved in suspicious events with business email compromise (BEC) characteristics, indicating a possible financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account was signed in from an anonymous IP address `192.238.237.190` (e.g., Tor browser or anonymizer VPN), which the attacker used to hide their true source location.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
