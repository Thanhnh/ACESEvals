tasks:
- task_id: incident_5_latest_cleaned_test_set_task_67
  title: incident_5_latest_cleaned_test_set_task_67
  description: 'A follow-up alert linked to the same compromised user account attributed this activity to the Manatee Tempest activity group. What is the IP address associated with that Manatee Tempest alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, ''CommandAndControl'' malware was detected on the device `vnevado-win10s` (AAD Device ID `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`), suggesting an attacker might be moving laterally from another device on the network. The suspicious process observed had ProcessId__CreatedTimeUtc__CommandLine of `6460__2024-06-20t09:10:51.7817908z__curl http://vectorsandarrows.com`.'
    question: 'A follow-up alert linked to the same compromised user account attributed this activity to the Manatee Tempest activity group. What is the IP address associated with that Manatee Tempest alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: '''CommandAndControl'' malware was detected during lateral movement, involving the user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Activity associated with the Manatee Tempest activity group was detected, involving the command-and-control IP address `198.43.121.209`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
