tasks:
- task_id: incident_5_latest_cleaned_test_set_task_35
  title: incident_5_latest_cleaned_test_set_task_35
  description: 'For the related alert where unknown malware was detected and was active, what is the name of the malicious file that was identified?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a human-operated ransomware incident, a ransomware payload was remotely launched on the device `vnevado-win11u` (Azure AD device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`) in the context of the account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`). Around the same time, Windows Defender detected unknown malware that was active on the environment, which may indicate the malware attempted to deliver its payload.'
    question: 'For the related alert where unknown malware was detected and was active, what is the name of the malicious file that was identified?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilib.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A ransomware payload was remotely launched from the remote IP address `99.83.111.100`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker used PSExec to move laterally from the host `vnevado-win10v` to the jump server.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Unknown malware was detected and active as the file `mimilib.dll`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
