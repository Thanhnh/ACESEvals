tasks:
- task_id: incident_5_latest_cleaned_test_set_task_99
  title: incident_5_latest_cleaned_test_set_task_99
  description: 'For that earlier alert involving the execution of the known credential theft tool, what IP address was recorded as being involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident, a contained user account belonging to `Grace Chen` (email `dp5hn@vnevado.alpineskihouse.co`, SID `S-1-5-21-1840191660-8534830288-125585561-1522`) had its attempt to create, delete, or modify files over SMB automatically blocked by attack disruption on host `vnevado-win11t`. This activity was followed by lateral movement using PSExec to the jump server `Vnevado-jump`, and the same compromised identity was also linked to an earlier alert where a known credential theft tool command line was executed to dump users'' credentials, keys and plain-text passwords.'
    question: 'For that earlier alert involving the execution of the known credential theft tool, what IP address was recorded as being involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An attempt of lateral movement using SMB remote file access was blocked on multiple devices, originating from IP address `99.83.111.100`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The user with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` used PSExec to move laterally to the jump server Vnevado-jump.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A malicious credential theft tool execution was detected, associated with IP address `107.224.99.179`, indicating an intent to dump users'' credentials, keys, and plain-text passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
