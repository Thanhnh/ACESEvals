tasks:
- task_id: incident_5_latest_cleaned_test_set_task_45
  title: incident_5_latest_cleaned_test_set_task_45
  description: 'Related to this incident, a Command and Control behavior alert was blocked on the affected device. What was the URL that the malware attempted to communicate with?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, the Mimikatz credential theft tool was detected on a device, with the file `mimilib.dll` identified as part of the hacktool. Mimikatz can harvest plaintext passwords, password hashes, smartcard PINs, and Kerberos tickets, and this activity has been associated with the Storm-0875 actor. The same compromised device chain also produced lateral movement via PSExec to a jump server and assets exhibiting ransomware-like behavior.'
    question: 'Related to this incident, a Command and Control behavior alert was blocked on the affected device. What was the URL that the malware attempted to communicate with?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://vectorsandarrows.com/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The Mimikatz credential theft tool was detected on the device with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, indicating an attacker harvesting credentials.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker performed lateral movement via PSExec to the jump server from the IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The compromised account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` was then used to spread across devices, exhibiting ransomware-like behavior.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Command and control behavior from the compromised assets was blocked when the malware attempted to communicate with the malicious URL `http://vectorsandarrows.com/`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
