tasks:
- task_id: incident_5_latest_cleaned_test_set_task_37
  title: incident_5_latest_cleaned_test_set_task_37
  description: 'For the alert reporting that file backups (snapshots and shadow copies) were deleted, which device was affected? Provide its Microsoft Entra (AAD) Device ID.'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Possible lateral movement'' alert was triggered based on a Microsoft Defender for Endpoint alert, involving suspicious network activity associated with the IP address `83.162.58.168`. Shortly afterwards, a suspicious WMI process creation was observed, and related activity indicated that all file snapshots and shadow copies were deleted via WMI or VSSAdmin - behavior commonly seen during ransomware infections.'
    question: 'For the alert reporting that file backups (snapshots and shadow copies) were deleted, which device was affected? Provide its Microsoft Entra (AAD) Device ID.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '9d4887ba-0b69-47d6-89bc-9b32787f379e'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '9d4887ba-0b69-47d6-89bc-9b32787f379e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Possible lateral movement was detected on the device with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`, indicating an attacker moving across devices to gather data or elevate privileges.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On that device, the account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` performed a suspicious WMI process creation, commonly used by malware to spawn new processes and break process trees.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Using WMI/VSSAdmin, all file snapshots and shadow copies (file backups) were then deleted on the host with AadDeviceId `9d4887ba-0b69-47d6-89bc-9b32787f379e`, behavior typical of a ransomware infection.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
