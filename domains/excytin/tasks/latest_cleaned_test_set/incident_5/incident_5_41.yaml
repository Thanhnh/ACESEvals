tasks:
- task_id: incident_5_latest_cleaned_test_set_task_41
  title: incident_5_latest_cleaned_test_set_task_41
  description: 'For the related "Suspicious remote activity" alert, what is the IP address of the remote source associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert titled "Command and Control behavior was blocked" was raised after active malware on an affected machine attempted to communicate with the remote address `http://vectorsandarrows.com/`. Because the malware was active, precautionary measures were needed to check for residual signs of infection. A related alert, "Suspicious remote activity", was raised moments later on the same machine, flagging activity that was initiated remotely such as interactive sessions, file modifications, WMI commands, or scheduled task creation.'
    question: 'For the related "Suspicious remote activity" alert, what is the IP address of the remote source associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '99.83.111.100'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '99.83.111.100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Command and control behavior was blocked when the process with Process ID `5572` ran the command line `curl http://vectorsandarrows.com` at `2024-06-20t09:32:04.8002759z`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the C2 activity, suspicious remote activity was observed on the machine originating from the remote IP address `99.83.111.100`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
