tasks:
- task_id: incident_5_latest_cleaned_test_set_task_92
  title: incident_5_latest_cleaned_test_set_task_92
  description: 'In the Manatee Tempest activity group alert connected to this host, which web domain (URL) was flagged as part of the malicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert was raised that a ransomware payload was remotely launched on a device, with the remote IP address `99.83.111.100` involved. Attackers might be attempting to encrypt content on the device, rendering it unusable to users. Investigation of the related alerts on the same host revealed activity attributed to the Manatee Tempest activity group — a Russia-based cybercriminal group known for the Dridex banking trojan, which typically relies on drive-by downloads and FakeUpdates (SocGholish) infections facilitated by the access broker Mustard Tempest, followed by the BLISTER loader delivering Cobalt Strike beacons.'
    question: 'In the Manatee Tempest activity group alert connected to this host, which web domain (URL) was flagged as part of the malicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vectorsandarrows.com'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vectorsandarrows.com'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A ransomware payload was remotely launched on the device with HostName `vnevado-win11t`, indicating attackers attempted to encrypt content on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The activity was associated with the Manatee Tempest activity group, which used a drive-by download / FakeUpdates infection chain reaching out to the malicious URL `vectorsandarrows.com`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
