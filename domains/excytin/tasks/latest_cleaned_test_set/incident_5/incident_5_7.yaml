tasks:
- task_id: incident_5_latest_cleaned_test_set_task_7
  title: incident_5_latest_cleaned_test_set_task_7
  description: 'For the alert about suspicious activity initiated remotely, what is the IP address of the remote source involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, system recovery setting tampering was observed on host `vnevado-win11t` (AAD device ID `e5799261-6720-4297-961e-bd9ca4275033`), where processes such as `vssblatemp.exe delete shadows /all` (PID 1900) and `bcdedit /set recoveryenabled no` (PID 3464) were executed to delete volume shadow copies and disable Windows recovery features. A closely related alert on the same device, triggered at nearly the same time, flagged suspicious activity that was initiated remotely, such as interactive session attempts, file modifications, WMI commands, or scheduled task creation.'
    question: 'For the alert about suspicious activity initiated remotely, what is the IP address of the remote source involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '99.83.111.100'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '99.83.111.100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` was observed tampering with system recovery settings on the device, using native Windows utilities (e.g., vssadmin, wmic shadowcopy, wbadmin, bcdedit) to delete shadow copies and disable recovery features.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Following this, suspicious activity initiated remotely was observed on the same machine, such as interactive session attempts, file modifications, WMI commands, or scheduled task creation.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'This suspicious remote activity originated from the remote IP address `99.83.111.100`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
