tasks:
- task_id: incident_5_latest_cleaned_test_set_task_29
  title: incident_5_latest_cleaned_test_set_task_29
  description: 'For the ''Possible lateral movement'' alert associated with this activity, what is the IP address recorded as the entity involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Command and Control behavior was blocked'' alert was raised on host `vnevado-win11u` (AAD Device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`), where a process with ID 5572 executed the command `curl http://vectorsandarrows.com` at 2024-06-20T09:32:04Z. Shortly afterwards, related alerts on the same device indicated system recovery setting tampering and a possible lateral movement attempt, suggesting an attacker may be moving across devices to gather data or elevate privileges.'
    question: 'For the ''Possible lateral movement'' alert associated with this activity, what is the IP address recorded as the entity involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '83.162.58.168'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '83.162.58.168'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` exhibited command and control behavior, which was blocked, indicating an active malware infection on the machine.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On the device with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`, system recovery settings were tampered with, suggesting the attacker attempted to delete shadow copies and disable recovery to prevent system restoration.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Possible lateral movement was then observed involving the IP address `83.162.58.168`, indicating the attacker attempted to move across devices to gather data or elevate privileges.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
