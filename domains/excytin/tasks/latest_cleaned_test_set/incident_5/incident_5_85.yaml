tasks:
- task_id: incident_5_latest_cleaned_test_set_task_85
  title: incident_5_latest_cleaned_test_set_task_85
  description: 'For the related suspicious WMI process creation alert, what is the name of the executable file that was spawned?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Command and Control behavior was blocked'' alert was raised after activity involving the URL `http://vectorsandarrows.com/` was observed on an affected machine. Around a second later, a related alert flagged suspicious WMI process creation on the same machine, a technique malware commonly uses to spawn new processes and break process trees.'
    question: 'For the related suspicious WMI process creation alert, what is the name of the executable file that was spawned?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vssblatemp.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vssblatemp.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Command and control behavior was blocked on the machine associated with the account `dp5hn`, indicating active malware attempting to communicate with a remote attacker.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious WMI process creation was observed, spawning the process with file name `vssblatemp.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
