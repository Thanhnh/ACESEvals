tasks:
- task_id: incident_5_latest_cleaned_test_set_task_10
  title: incident_5_latest_cleaned_test_set_task_10
  description: 'What is the IP address associated with the alert reporting the modification of the LSASS process memory?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware investigation, an alert titled ''Possible ransomware activity based on a known malicious extension'' was raised after numerous file system changes were observed on a device, with files such as `ponceau.7z.lockbit`, `syncretic.7z.lockbit`, and `unstreaming.xlsx.lockbit` being created, along with a suspicious script `get-userprttoken.ps1`. This activity involved the account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` and device with AAD Device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`. The same infrastructure was also linked to lateral movement via PSExec to a jump server, and to an alert indicating that the LSASS process memory was modified, potentially to bypass security mechanisms or steal credentials.'
    question: 'What is the IP address associated with the alert reporting the modification of the LSASS process memory?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Possible ransomware activity based on a known malicious extension was observed, associated with IP address `99.83.111.100`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Lateral movement via PSExec to the jump server was detected originating from host `vnevado-win10v`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The LSASS process memory was modified to bypass security mechanisms, associated with IP address `107.224.99.179`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
