tasks:
- task_id: incident_5_latest_cleaned_test_set_task_22
  title: incident_5_latest_cleaned_test_set_task_22
  description: 'For the alert about deleted file backups, what was the process ID, creation time, and full command line of the process that removed the shadow copies?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware incident, potentially compromised assets on host `vnevado-win11u` (AAD device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`, IP `99.83.111.100`) exhibited ransomware-like behavior, with multiple files such as `unstreaming.xlsx`, `kiters.7z`, `ponceau.7z`, `syncretic.7z` and `earlap.doc` being encrypted with the `.lockbit` extension. A closely related alert reported that all file snapshots and shadow copies were deleted via WMI or VSSAdmin, a common precursor to ransomware encryption.'
    question: 'For the alert about deleted file backups, what was the process ID, creation time, and full command line of the process that removed the shadow copies?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 7236, Created Time (UTC): 2024-06-20T09:10:51.2193152Z, Command line: `vssblatemp.exe delete shadows /all`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 7236, Created Time (UTC): 2024-06-20T09:10:51.2193152Z, Command line: `vssblatemp.exe delete shadows /all`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Potentially compromised assets are exhibiting ransomware-like behavior, associated with the user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`, which may be used by an attacker to move laterally and infect devices with ransomware.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker deleted all file snapshots and shadow copies by running the process with command line `vssblatemp.exe delete shadows /all` at `2024-06-20t09:10:51.2193152z`, with Process ID `7236`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
