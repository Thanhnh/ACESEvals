tasks:
- task_id: incident_5_latest_cleaned_test_set_task_9
  title: incident_5_latest_cleaned_test_set_task_9
  description: 'Just before this alert, a related alert flagged a possibly compromised user account dropping a ransomware-related file on several devices. What is the name of that dropped file?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a human-operated ransomware incident, an alert fired at 2024-07-04 22:35:03 UTC reporting that a ransomware payload was remotely launched on the device `vnevado-win11u` (AAD device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`). The activity was associated with the account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`) and the IP address `99.83.111.100`.'
    question: 'Just before this alert, a related alert flagged a possibly compromised user account dropping a ransomware-related file on several devices. What is the name of that dropped file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'syncretic.7z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'syncretic.7z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A ransomware payload was remotely launched on the device with HostName `vnevado-win11u`, indicating attackers attempted to encrypt content on this device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A possibly compromised user account was observed dropping the ransomware-related file `syncretic.7z` on several devices, indicating lateral movement to spread the ransomware.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
