tasks:
- task_id: incident_5_latest_cleaned_test_set_task_81
  title: incident_5_latest_cleaned_test_set_task_81
  description: 'In the related alert about suspicious access to the LSASS service, which library file (DLL) was identified as being involved in the credential access attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, ransomware behavior was detected in the file system on host `vnevado-win11u` (Azure AD device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`), indicating possible mass encryption activity. Around the same time, related alerts on the same device flagged possible attempts to access the Primary Refresh Token (PRT) and suspicious access to the LSASS service, where attackers try to decrypt clear-text credentials from memory for later lateral movement.'
    question: 'In the related alert about suspicious access to the LSASS service, which library file (DLL) was identified as being involved in the credential access attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samlib.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samlib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'Ransomware behavior was detected in the file system on host `vnevado-win11u`, indicating suspicious mass file changes.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'On that host, a possible attempt to access the Primary Refresh Token (PRT) was observed involving the process `browsercore.exe`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The PRT access attempt was associated with the account `tgs2z`, suggesting credential theft for lateral movement.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Following the credential theft attempt, suspicious access to the LSASS service was detected involving the file `samlib.dll`, which is commonly used to dump clear-text credentials from LSASS memory.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
