tasks:
- task_id: incident_5_latest_cleaned_test_set_task_86
  title: incident_5_latest_cleaned_test_set_task_86
  description: 'In the alert reporting potentially compromised assets exhibiting ransomware-like behavior, which script file was identified as being involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a ''Windows Sysinternals tool renamed'' alert was raised after mimikatz.exe was launched with pass-the-hash arguments (`"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:..\notepad.exe //vnevado-jump cmd.exe"`), spawning renamed notepad.exe processes from an earlier powershell.exe session (`"powershell.exe" -noexit -command set-location -literalpath ''c:\users\tgs2z\downloads\humw21''`), with activity observed from IP 107.224.99.179. This chain later led to PSExec lateral movement to the jump server and, ultimately, to an alert about potentially compromised assets exhibiting ransomware-like behavior across several devices.'
    question: 'In the alert reporting potentially compromised assets exhibiting ransomware-like behavior, which script file was identified as being involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-userprttoken.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-userprttoken.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `tgs2z` renamed a Windows Sysinternals tool (such as PsExec) and launched it, likely to covertly use the tool for malicious purposes.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the renamed PsExec, the attacker performed lateral movement to the jump server from the IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The potentially compromised assets then exhibited ransomware-like behavior, involving the file `get-userprttoken.ps1` used to harvest tokens and spread across devices.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
