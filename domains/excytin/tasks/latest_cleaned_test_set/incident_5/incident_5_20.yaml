tasks:
- task_id: incident_5_latest_cleaned_test_set_task_20
  title: incident_5_latest_cleaned_test_set_task_20
  description: 'For the alert where lateral movement using SMB remote file access was blocked on multiple devices, which user account (email address) was contained and blocked?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, a Windows Sysinternals tool was renamed and launched — the file `mimikatz.exe` was executed alongside `cmd.exe`, `powershell.exe`, and `notepad.exe` processes (e.g., PID 6624 running `notepad.exe \\vnevado-jump cmd.exe`), with activity involving IP address `107.224.99.179`. This activity was followed by PSExec lateral movement to the jump server `vnevado-jump`, and attack disruption subsequently blocked a contained user''s attempts to create, delete, or modify files over SMB on multiple devices.'
    question: 'For the alert where lateral movement using SMB remote file access was blocked on multiple devices, which user account (email address) was contained and blocked?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dp5hn@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` renamed a Windows Sysinternals tool and launched it, likely to covertly use the tool for malicious purposes.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker then used PSExec to move laterally to the jump server from the IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The compromised account with email `dp5hn@vnevado.alpineskihouse.co` attempted lateral movement using SMB remote file access on multiple devices, which was blocked by attack disruption.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
