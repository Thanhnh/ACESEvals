tasks:
- task_id: incident_5_latest_cleaned_test_set_task_89
  title: incident_5_latest_cleaned_test_set_task_89
  description: 'Around the same time, a related alert in this incident reported system recovery setting tampering (such as deleting volume shadow copies or disabling automatic Windows recovery). On which host was that tampering observed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''CommandAndControl'' malware detection was raised on the device `vnevado-win11t` (AAD Device ID `e5799261-6720-4297-961e-bd9ca4275033`), where the process with ID 88 executed the command line `curl http://vectorsandarrows.com` on 2024-06-20T09:29:42Z. This suggests an attacker might be attempting to move laterally to this device from another device on the network, and a compromised user account appears to link this activity to other alerts in the same incident.'
    question: 'Around the same time, a related alert in this incident reported system recovery setting tampering (such as deleting volume shadow copies or disabling automatic Windows recovery). On which host was that tampering observed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11u'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win11u'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` was involved in a ''CommandAndControl'' malware detection, indicating an attacker attempting lateral movement to this device from another device on the network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'System recovery setting tampering was observed on the host `vnevado-win11u`, where native Windows utilities (such as vssadmin, wmic shadowcopy, wbadmin, or bcdedit) were likely used to delete volume shadow copies, remove the backup catalog, or disable automatic recovery features to prevent system restoration.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
