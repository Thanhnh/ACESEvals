tasks:
- task_id: incident_5_latest_cleaned_test_set_task_1
  title: incident_5_latest_cleaned_test_set_task_1
  description: 'A related alert in this incident flagged the Mimikatz credential theft hacktool (associated with actor Storm-0875) on a device. What is the name of the file detected for that Mimikatz alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a Command and Control behavior was blocked on an affected device, involving communication with the malicious URL `http://vectorsandarrows.com/`. The malware was considered active, so precautionary measures were needed to check for residual signs of infection. Follow-on activity in the same incident included possible ransomware file changes and lateral movement via PSExec to the jump server.'
    question: 'A related alert in this incident flagged the Mimikatz credential theft hacktool (associated with actor Storm-0875) on a device. What is the name of the file detected for that Mimikatz alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilove.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilove.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` was involved in blocked command and control behavior on the compromised device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The device communicated with the remote IP address `99.83.111.100`, and possible ransomware activity based on a known malicious file extension was observed.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker used the account named `tgs2z` to perform lateral movement via PSExec to the jump server Vnevado-jump.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'On the compromised device, the Mimikatz credential theft tool was detected as the file `mimilove.exe`, used to harvest credentials such as plaintext passwords, password hashes, and Kerberos tickets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
