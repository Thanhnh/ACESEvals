tasks:
- task_id: incident_5_latest_cleaned_test_set_task_98
  title: incident_5_latest_cleaned_test_set_task_98
  description: 'Just seconds after the PRT access attempts, another alert fired on the same device indicating that a known credential theft tool command line was executed to dump users'' credentials, keys and plain-text passwords. What is the file name of the process associated with that credential theft tool execution alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this investigation, an alert titled "Possible attempt to access Primary Refresh Token (PRT)" was raised on host `vnevado-win10r` (Azure AD Device ID `9d4887ba-0b69-47d6-89bc-9b32787f379e`) for the account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`, AAD User ID `731adb71-b11c-4bbf-850b-57989b350e96`). The suspicious activity involved process ID 1792 running `"browsercore.exe"`, created at 2024-06-20T09:11:00.6379159Z. A PRT is a key artifact of Azure AD authentication that attackers may target for lateral movement or credential theft.'
    question: 'Just seconds after the PRT access attempts, another alert fired on the same device indicating that a known credential theft tool command line was executed to dump users'' credentials, keys and plain-text passwords. What is the file name of the process associated with that credential theft tool execution alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'notepad.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'notepad.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A process `browsercore.exe` was executed in a possible attempt to access the Primary Refresh Token (PRT), a key Azure AD authentication artifact used for single sign-on.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'This PRT access attempt occurred on the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On the same device, a known credential theft tool execution was detected involving the process `notepad.exe`, whose command line indicated intent to dump users'' credentials, keys, and plain-text passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
