tasks:
- task_id: incident_5_latest_cleaned_test_set_task_8
  title: incident_5_latest_cleaned_test_set_task_8
  description: 'Which device was identified in the follow-up alert as the target of the ''CommandAndControl'' malware detected during lateral movement?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired for a possible compromised user account delivering ransomware-related files. The account (SID `S-0-6-5`) was observed dropping ransomware-related files such as `characterical.zip`, `characterical.zip.lockbit`, and the script `get-userprttoken.ps1` on devices including host `vnevado-win11t` (AAD Device ID `e5799261-6720-4297-961e-bd9ca4275033`), with associated IP address `99.83.111.100`. Roughly a second later, a related alert reported that ''CommandAndControl'' malware was detected during lateral movement, suggesting the attacker was pivoting from one device to another on the network.'
    question: 'Which device was identified in the follow-up alert as the target of the ''CommandAndControl'' malware detected during lateral movement?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11u'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win11u'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` was observed dropping ransomware-related files on several devices, indicating the attacker used it to move laterally across the network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using that compromised account, the attacker moved laterally and ''CommandAndControl'' malware was detected on the device with HostName `vnevado-win11u`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
