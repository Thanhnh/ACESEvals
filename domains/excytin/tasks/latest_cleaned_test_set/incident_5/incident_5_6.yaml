tasks:
- task_id: incident_5_latest_cleaned_test_set_task_6
  title: incident_5_latest_cleaned_test_set_task_6
  description: 'In the related alert about potentially compromised assets exhibiting ransomware-like behavior, what is the name of the file involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a possible attempt to access a Primary Refresh Token (PRT) was detected on host `vnevado-win10r` (AAD Device ID `9d4887ba-0b69-47d6-89bc-9b32787f379e`), where the process `browsercore.exe` (Process ID 1792, created 2024-06-20T09:11:00.6379159Z, command line `"browsercore.exe"`) was executed. PRT abuse is commonly associated with lateral movement and credential theft. Shortly afterwards, a related alert was raised indicating that potentially compromised assets were exhibiting ransomware-like behavior across several devices.'
    question: 'In the related alert about potentially compromised assets exhibiting ransomware-like behavior, what is the name of the file involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'kiters.7z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'kiters.7z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An attacker attempted to access the Primary Refresh Token (PRT) using the account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the compromised account, the attacker moved laterally and exhibited ransomware-like behavior across several devices, involving the file `kiters.7z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
