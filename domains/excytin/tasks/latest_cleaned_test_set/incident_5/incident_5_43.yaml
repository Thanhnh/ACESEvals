tasks:
- task_id: incident_5_latest_cleaned_test_set_task_43
  title: incident_5_latest_cleaned_test_set_task_43
  description: 'For the system recovery setting tampering alert, what was the exact command line executed to disable Windows automatic recovery, and what was the process ID and creation time of that process?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a human-operated ransomware incident, a ransomware payload was remotely launched on a device from the IP address `99.83.111.100`, with attackers attempting to encrypt content and render the device unusable. Just seconds before this, an alert fired for system recovery setting tampering on the same device, where adversaries attempted to disable or delete built-in operating system recovery features to prevent restoring a corrupted system.'
    question: 'For the system recovery setting tampering alert, what was the exact command line executed to disable Windows automatic recovery, and what was the process ID and creation time of that process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Command line: `bcdedit /set recoveryenabled no`, Process ID: 4828, Created Time (UTC): 2024-06-20T09:31:59.6743318Z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Command line: `bcdedit /set recoveryenabled no`, Process ID: 4828, Created Time (UTC): 2024-06-20T09:31:59.6743318Z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A ransomware payload was remotely launched on the device by the account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'System recovery setting tampering was observed: the process with Process ID `4828`, created at `2024-06-20t09:31:59.6743318z`, ran the command line `bcdedit /set recoveryenabled no` to disable Windows automatic recovery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
