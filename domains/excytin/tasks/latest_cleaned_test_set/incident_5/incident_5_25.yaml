tasks:
- task_id: incident_5_latest_cleaned_test_set_task_25
  title: incident_5_latest_cleaned_test_set_task_25
  description: 'For the alert where the command and control behavior was blocked, what was the URL contacted by the malware?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a ransomware payload was remotely launched on a device, with the activity linked to IP address `99.83.111.100`. Attackers appeared to be attempting to encrypt content on the device, and the same compromised account was seen across related alerts. Shortly afterward, a related alert fired indicating that command and control (C2) behavior from active malware was blocked on the affected machine.'
    question: 'For the alert where the command and control behavior was blocked, what was the URL contacted by the malware?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://vectorsandarrows.com/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` was used to remotely launch a ransomware payload on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the ransomware launch, command and control behavior was blocked when the malware attempted to communicate with the malicious URL `http://vectorsandarrows.com/`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
