tasks:
- task_id: incident_5_latest_cleaned_test_set_task_72
  title: incident_5_latest_cleaned_test_set_task_72
  description: 'Roughly two seconds later, another ''Command and Control behavior was blocked'' alert was triggered, but on a different machine linked to the same compromised user account. What is the Azure AD device ID of that other machine?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a "Command and Control behavior was blocked" alert was raised at 2024-07-04 22:35:01 UTC on the host `vnevado-win10s` (Azure AD device ID `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`), where process ID 6460 executed the command line `curl http://vectorsandarrows.com`, indicating active malware attempting to reach a remote attacker-controlled server.'
    question: 'Roughly two seconds later, another ''Command and Control behavior was blocked'' alert was triggered, but on a different machine linked to the same compromised user account. What is the Azure AD device ID of that other machine?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e5799261-6720-4297-961e-bd9ca4275033'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'e5799261-6720-4297-961e-bd9ca4275033'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Command and Control behavior was blocked for the user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`, indicating an active malware attempting to communicate with a remote attacker.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same Command and Control behavior was blocked on the device with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`, which is the host where the active malware was running.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
