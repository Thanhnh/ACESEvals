tasks:
- task_id: incident_5_latest_cleaned_test_set_task_39
  title: incident_5_latest_cleaned_test_set_task_39
  description: 'For the Manatee Tempest activity group alert connected to this incident, what is the IP address involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware-related incident, an alert titled "File backups were deleted" fired on host `vnevado-win11t` (AAD Device ID `e5799261-6720-4297-961e-bd9ca4275033`), where the process `vssblatemp.exe` (PID 1900, created 2024-06-20T09:29:40.8785892Z) ran the command line `vssblatemp.exe delete shadows /all`, wiping all file snapshots and shadow copies. Roughly a second later, a related alert was raised for activity attributed to the Manatee Tempest activity group, a Russia-based cybercriminal group known for Dridex, BLISTER loader, Cobalt Strike beacons, and ransomware deployment.'
    question: 'For the Manatee Tempest activity group alert connected to this incident, what is the IP address involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` deleted all file snapshots and shadow copies via WMI or VSSAdmin, behavior commonly seen during ransomware infections.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The activity was associated with the Manatee Tempest activity group, which communicated with the IP address `198.43.121.209`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
