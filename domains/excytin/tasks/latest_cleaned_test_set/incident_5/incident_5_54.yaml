tasks:
- task_id: incident_5_latest_cleaned_test_set_task_54
  title: incident_5_latest_cleaned_test_set_task_54
  description: 'For the alert reporting that command and control behavior was blocked, what was the URL the malware attempted to communicate with?'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation of a multi-stage intrusion, analysts observed the ''Windows Sysinternals tool renamed'' alert where a renamed Sysinternals utility was launched. Related process activity showed `mimikatz.exe` executed with the command line `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:..\notepad.exe //vnevado-jump cmd.exe"` (PID 2020), followed by `notepad.exe \\vnevado-jump cmd.exe` (PID 6624) and `cmd.exe` (PID 8656). This activity chain links to lateral movement via PSExec to the jump server, assets exhibiting ransomware-like behavior, and finally to an alert where command and control behavior was blocked.'
    question: 'For the alert reporting that command and control behavior was blocked, what was the URL the malware attempted to communicate with?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://vectorsandarrows.com/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The user with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` renamed a Windows Sysinternals tool and launched it, likely to covertly use it for malicious purposes.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Using that access, the attacker performed lateral movement with PSExec to the jump server from the IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The compromised device with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033` then exhibited ransomware-like behavior, indicating the attacker was spreading across multiple devices.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Command and control behavior was blocked on the affected asset when it attempted to communicate with the malicious URL `http://vectorsandarrows.com/`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
