tasks:
- task_id: incident_5_latest_cleaned_test_set_task_26
  title: incident_5_latest_cleaned_test_set_task_26
  description: 'For the related credential theft tool detection alert in this incident, what is the name of the malicious file that was detected?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "File backups were deleted" was raised after all file snapshots and shadow copies were removed via VSSAdmin/WMI — behavior commonly seen in ransomware infections. The activity was performed on host `vnevado-win11u` (AAD device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`) by account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`), which executed process ID 1900, `vssblatemp.exe delete shadows /all`, at 2024-06-20T09:32:02Z. This activity is linked through the same user and remote sessions to lateral movement toward the jump server, and ultimately to an alert indicating that a well-known credential theft hacktool capable of harvesting plaintext passwords, hashes, smartcard PINs, and Kerberos tickets was detected.'
    question: 'For the related credential theft tool detection alert in this incident, what is the name of the malicious file that was detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A user with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` deleted all file backups (shadow copies) via WMI or VSSAdmin, a behavior common during ransomware infection.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious remote activity was initiated against the machine from the remote IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker used PSExec to move laterally to the jump server, using the account with SID `S-5-7-21-1843151660-3234030288-105586167-1422`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The credential theft tool `mimikatz.exe` was detected on the device, indicating the attacker attempted to harvest credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
