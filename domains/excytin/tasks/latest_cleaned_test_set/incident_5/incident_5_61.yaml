tasks:
- task_id: incident_5_latest_cleaned_test_set_task_61
  title: incident_5_latest_cleaned_test_set_task_61
  description: 'A related alert reported possible lateral movement, triggered by a suspicious network event on a device in close time proximity to lateral movement on another device. What is the IP address involved in that lateral movement alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, an alert flagged potentially compromised assets exhibiting ransomware-like behavior across several devices. The affected user account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`) was associated with encrypted files such as `earlap.doc.lockbit`, `kiters.7z.lockbit`, and `unstreaming.xlsx.lockbit`, suggesting LockBit ransomware activity and possible lateral movement across the network.'
    question: 'A related alert reported possible lateral movement, triggered by a suspicious network event on a device in close time proximity to lateral movement on another device. What is the IP address involved in that lateral movement alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '38.142.109.10'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '38.142.109.10'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A potentially compromised asset (host with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`) was observed exhibiting ransomware-like behavior, impacting several devices.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From that device, possible lateral movement was detected in close time proximity to a suspicious network event involving the IP address `38.142.109.10`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
