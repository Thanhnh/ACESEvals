tasks:
- task_id: incident_5_latest_cleaned_test_set_task_50
  title: incident_5_latest_cleaned_test_set_task_50
  description: 'For that earlier ''Malicious credential theft tool execution detected'' alert connected to the same host, what IP address was recorded as an entity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, an alert titled "PSExec to Vnevado-jump" flagged lateral movement to the organization''s jump server on 2024-07-10. The alert involved the account `tgs2z@vnevado.alpineskihouse.co`, the file `notepad.exe`, and the IP addresses `99.83.111.100` and `141.216.110.153`. Pivoting on the affected host reveals an earlier alert from 2024-07-04 where a known credential theft tool command line was detected, indicating an intent to dump users'' credentials, keys and plain-text passwords.'
    question: 'For that earlier ''Malicious credential theft tool execution detected'' alert connected to the same host, what IP address was recorded as an entity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Lateral movement via PSExec to the jump server was initiated from the host `vnevado-win10v`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that host, a known credential theft tool was executed to dump users'' credentials, keys, and plain-text passwords, associated with the IP address `107.224.99.179`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
