  title: incident_5_latest_cleaned_test_set_task_82
  description: 'For the alert reporting system recovery setting tampering (e.g., deletion of volume shadow copies or the Windows Backup Catalog), what is the Microsoft Entra (AAD) device ID of the affected host?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a ''Possible lateral movement'' alert was raised from Microsoft Defender for Endpoint, involving the IP address `83.162.58.168`. Lateral movement on another device was observed in close time proximity to a suspicious network event, suggesting an attacker may be moving across devices to gather data or elevate privileges. Shortly after, potentially compromised assets were seen exhibiting ransomware-like behavior across several devices, and system recovery settings were tampered with on one of the affected devices — a typical precursor to data encryption for impact.'
    question: 'For the alert reporting system recovery setting tampering (e.g., deletion of volume shadow copies or the Windows Backup Catalog), what is the Microsoft Entra (AAD) device ID of the affected host?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bc00e484-d0e5-4da4-9472-95568cccc07e'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bc00e484-d0e5-4da4-9472-95568cccc07e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Possible lateral movement was observed on host `vnevado-win11t`, where a suspicious network event coincided with lateral movement activity on another device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account `dp5hn` was identified as a potentially compromised asset exhibiting ransomware-like behavior, moving laterally across the network to infect multiple devices.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'System recovery setting tampering was detected on the device with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`, where built-in recovery features such as volume shadow copies and the backup catalog were deleted or disabled to prevent system restoration.'
  scoring_aggregation:
    max:
      scores:
