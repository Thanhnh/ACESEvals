tasks:
- task_id: incident_5_latest_cleaned_test_set_task_60
  title: incident_5_latest_cleaned_test_set_task_60
  description: 'About two seconds later, a second ''Malicious credential theft tool execution detected'' alert was raised on the same host. Apart from the credential dumping tool itself, what was the name of the other executable file referenced in that follow-up alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, at 2024-07-04 22:35:01 UTC an alert titled "Malicious credential theft tool execution detected" fired, indicating a known credential theft tool command line was observed. Two processes were captured: `3932__2024-06-20t09:00:16.5677379z__"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit` and `1044__2024-06-20t08:59:25.9440469z__"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit`, both intended to dump users'' credentials, keys and plain-text passwords.'
    question: 'About two seconds later, a second ''Malicious credential theft tool execution detected'' alert was raised on the same host. Apart from the credential dumping tool itself, what was the name of the other executable file referenced in that follow-up alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'notepad.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'notepad.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool execution command line was detected on host `vnevado-win10v`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The credential theft tool execution was associated with the process `notepad.exe` (ExtractedFileName), which was used to dump users'' credentials, keys, and plain-text passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
