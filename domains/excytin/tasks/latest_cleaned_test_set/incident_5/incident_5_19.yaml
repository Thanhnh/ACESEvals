tasks:
- task_id: incident_5_latest_cleaned_test_set_task_19
  title: incident_5_latest_cleaned_test_set_task_19
  description: 'Following this lateral movement, another alert reported that a ransomware payload was remotely launched on one of the affected devices. What is the security identifier (SID) of the user account associated with that remote payload execution?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this ransomware incident, an alert titled "Possible compromised user account delivering ransomware-related files" fired after a user account was seen dropping ransomware-related files on several devices. The dropped/encrypted files included `unstreaming.xlsx`, `unstreaming.xlsx.lockbit`, `kiters.7z`, `kiters.7z.lockbit`, `syncretic.7z`, `syncretic.7z.lockbit`, `earlap.doc`, `earlap.doc.lockbit`, `ponceau.7z.lockbit`, and a script named `get-userprttoken.ps1`. The attacker appears to have used this account to move laterally and infect as many devices as possible.'
    question: 'Following this lateral movement, another alert reported that a ransomware payload was remotely launched on one of the affected devices. What is the security identifier (SID) of the user account associated with that remote payload execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1840191660-8534830288-125585561-1522'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1840191660-8534830288-125585561-1522'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account was observed dropping ransomware-related files on the device with HostName `vnevado-win11u`, indicating lateral movement across the network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that device, a ransomware payload was remotely launched by the account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`, attempting to encrypt the device''s content.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
