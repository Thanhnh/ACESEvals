tasks:
- task_id: incident_5_latest_cleaned_test_set_task_48
  title: incident_5_latest_cleaned_test_set_task_48
  description: 'In the same attack chain, ''CommandAndControl'' malware was detected on a device during the lateral movement stage. Which user account name was associated with that malware detection alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, an alert fired for a renamed Windows Sysinternals tool being launched. The related process activity showed `mimikatz.exe` being executed with pass-the-hash commands such as `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:..\notepad.exe //vnevado-jump cmd.exe"` (PID 2020), spawning `notepad.exe` and `cmd.exe` child processes, alongside a PowerShell session (PID 8516) launched from `c:\users\tgs2z\downloads\humw21`. This activity chained into lateral movement toward the jump server and a remotely launched ransomware payload.'
    question: 'In the same attack chain, ''CommandAndControl'' malware was detected on a device during the lateral movement stage. Which user account name was associated with that malware detection alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dp5hn'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A Windows Sysinternals tool was renamed and launched on the device with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, indicating an attempt to covertly use the tool.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker then used PSExec for lateral movement to the jump server from the IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'A ransomware payload was remotely launched on the device by the account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'During this lateral movement, ''CommandAndControl'' malware was detected in association with the account named `dp5hn`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
