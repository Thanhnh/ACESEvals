tasks:
- task_id: incident_5_latest_cleaned_test_set_task_91
  title: incident_5_latest_cleaned_test_set_task_91
  description: 'In the related Manatee Tempest activity group alert, what IP address was identified as an entity involved in the activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, a Command and Control behavior was blocked on host `vnevado-win11t` (AAD Device ID `e5799261-6720-4297-961e-bd9ca4275033`), where a process with ID 88 executed the command `curl http://vectorsandarrows.com` at 2024-06-20T09:29:42Z, reaching out to the URL `http://vectorsandarrows.com/`. This activity was linked to a related alert attributed to the Manatee Tempest activity group, a Russia-based cybercriminal group known for drive-by download campaigns, BLISTER loader, and Cobalt Strike beacons.'
    question: 'In the related Manatee Tempest activity group alert, what IP address was identified as an entity involved in the activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` was involved in blocked Command and Control behavior, indicating an active malware infection on the machine.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The malware communicated with the IP address `198.43.121.209`, which is associated with the Manatee Tempest activity group.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
