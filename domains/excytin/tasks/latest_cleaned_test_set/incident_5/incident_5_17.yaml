tasks:
- task_id: incident_5_latest_cleaned_test_set_task_17
  title: incident_5_latest_cleaned_test_set_task_17
  description: 'Following this PRT access attempt, the same incident includes a detection of suspicious ''GenRansom'' malware behavior. On which device (host name) was this active malware behavior detected?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled "Possible attempt to access Primary Refresh Token (PRT)" was raised on 2024-07-04 at 22:35 UTC. The activity was tied to the account `tgs2z` (SID S-5-7-21-1843151660-3234030288-105586167-1422) signing in from IP `107.224.99.179` on the device `vnevado-win10v`, where an encoded `powershell.exe` command was executed (PID 2484) followed by `browsercore.exe` (PID 4760) — a known technique to steal the Azure AD Primary Refresh Token for lateral movement and credential theft.'
    question: 'Following this PRT access attempt, the same incident includes a detection of suspicious ''GenRansom'' malware behavior. On which device (host name) was this active malware behavior detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11t'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win11t'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A possible attempt to access the Primary Refresh Token (PRT) was detected involving the process file `browsercore.exe`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'This PRT access attempt was observed on the host `vnevado-win11t`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Suspicious ''GenRansom'' ransomware behavior was subsequently detected on the same host `vnevado-win11t`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
