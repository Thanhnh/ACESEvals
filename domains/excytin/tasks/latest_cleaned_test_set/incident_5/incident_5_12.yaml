tasks:
- task_id: incident_5_latest_cleaned_test_set_task_12
  title: incident_5_latest_cleaned_test_set_task_12
  description: 'Shortly after the credential theft tool ran, PsExec was used to launch a command on a remote device as part of lateral movement. What process was launched (process ID, creation time and command line) in that PsExec alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a known credential theft tool execution was detected on an endpoint: `mimikatz.exe` was run with the command line `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit` (process IDs 1044 at 2024-06-20T08:59:25.944Z and 3932 at 2024-06-20T09:00:16.567Z), indicating an intent to dump users'' credentials, keys and plain-text passwords. This activity is linked through a shared user account to further lateral movement activity in the same incident.'
    question: 'Shortly after the credential theft tool ran, PsExec was used to launch a command on a remote device as part of lateral movement. What process was launched (process ID, creation time and command line) in that PsExec alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID 8656, created at 2024-06-20T09:07:09.5458894Z, command line: cmd.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID 8656, created at 2024-06-20T09:07:09.5458894Z, command line: cmd.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The compromised account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` executed a known credential theft tool to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker leveraged PsExec to launch a command remotely, spawning the process `cmd.exe` with Process ID `8656` at `2024-06-20t09:07:09.5458894z` on the remote device to move laterally in the organization.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
