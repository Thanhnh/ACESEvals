tasks:
- task_id: incident_5_latest_cleaned_test_set_task_24
  title: incident_5_latest_cleaned_test_set_task_24
  description: 'For the alert about the possible attempt to access the Primary Refresh Token (PRT), which process was involved? Provide the process ID, its creation time, and the command line.'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware-related security incident, suspicious file system changes indicative of mass encryption were detected on host `vnevado-win11t` (AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`). Around the same time, a ransomware payload was remotely launched, and another related alert flagged a possible attempt to access a Primary Refresh Token (PRT), a key Azure AD authentication artifact that attackers can abuse for lateral movement or credential theft.'
    question: 'For the alert about the possible attempt to access the Primary Refresh Token (PRT), which process was involved? Provide the process ID, its creation time, and the command line.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 2676, Created Time (UTC): 2024-06-20T09:10:59.867384Z, Command Line: "browsercore.exe"'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 2676, Created Time (UTC): 2024-06-20T09:10:59.867384Z, Command Line: "browsercore.exe"'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Ransomware behavior was detected in the file system on host `vnevado-win11t`, indicating mass encryption of files.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The ransomware payload was remotely launched on the device under the account `dp5hn`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A possible attempt to access the Primary Refresh Token (PRT) was made via the process `browsercore.exe` with Process ID `2676`, created at `2024-06-20t09:10:59.867384z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
