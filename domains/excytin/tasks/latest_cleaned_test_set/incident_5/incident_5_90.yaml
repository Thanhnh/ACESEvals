tasks:
- task_id: incident_5_latest_cleaned_test_set_task_90
  title: incident_5_latest_cleaned_test_set_task_90
  description: 'For the alert where command and control behavior was blocked, what was the URL that the compromised host attempted to contact?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of suspicious remote activity on host `vnevado-win10r` (AAD device ID 9d4887ba-0b69-47d6-89bc-9b32787f379e), analysts observed a series of processes launched in rapid succession, including `bcdedit /set recoveryenabled no`, `bcdedit /set bootstatuspolicy ignoreallfailures`, `vssblatemp.exe delete shadows /all`, and `powershell -file c:\scripts\get-userprttoken.ps1`. A related alert on the same host reported that command and control behavior was blocked, indicating the malware was active and attempting to reach a remote attacker-controlled destination.'
    question: 'For the alert where command and control behavior was blocked, what was the URL that the compromised host attempted to contact?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://vectorsandarrows.com/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was initiated on the machine under the account `dp5hn`, indicating remotely triggered interactive sessions or command execution.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that activity, command and control behavior was blocked when the compromised machine attempted to communicate with the malicious URL `http://vectorsandarrows.com/`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
