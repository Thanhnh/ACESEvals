tasks:
- task_id: incident_5_latest_cleaned_test_set_task_56
  title: incident_5_latest_cleaned_test_set_task_56
  description: 'For the ''Command and Control behavior was blocked'' alert, what was the exact URL that the malware attempted to contact?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident linked to the Manatee Tempest activity group, a Russia-based cybercriminal group known for drive-by download and FakeUpdates infections leading to Cobalt Strike beacons, analysts observed on host `vnevado-win10r` (AAD Device ID `9d4887ba-0b69-47d6-89bc-9b32787f379e`) a process with ProcessId__CreatedTimeUtc__CommandLine `1332__2024-06-20t09:10:52.7298237z__curl ...` reaching out to an external IP address `198.43.121.209`. Moments before this, a separate alert fired indicating that command and control behavior was blocked on the same device.'
    question: 'For the ''Command and Control behavior was blocked'' alert, what was the exact URL that the malware attempted to contact?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://vectorsandarrows.com/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` was involved in activity attributed to the Manatee Tempest activity group at 2024-07-04 22:35:02 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Command and control behavior from that compromised account was blocked when it attempted to communicate with the malicious URL `http://vectorsandarrows.com/`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
