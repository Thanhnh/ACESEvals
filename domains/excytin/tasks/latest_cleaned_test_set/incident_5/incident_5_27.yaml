tasks:
- task_id: incident_5_latest_cleaned_test_set_task_27
  title: incident_5_latest_cleaned_test_set_task_27
  description: 'A follow-up alert in the same incident reported PsExec-based lateral movement to the jump server Vnevado-jump. Which file name was flagged as the file entity in that lateral movement alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage intrusion, a known credential theft tool execution was detected: the process `mimikatz.exe` (PID 6600, created 2024-06-20T09:05:15Z) was launched from a `cmd.exe`/`conhost.exe` session (PID 7948) on a device associated with IP `107.224.99.179`. Its command line used `privilege::debug` together with `sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co`, indicating a pass-the-hash attempt aimed at reaching the jump server `\\vnevado-jump`.'
    question: 'A follow-up alert in the same incident reported PsExec-based lateral movement to the jump server Vnevado-jump. Which file name was flagged as the file entity in that lateral movement alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'notepad.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'notepad.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed on the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, dumping users'' credentials, keys, and plain-text passwords at 2024-07-04 22:35:02 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker performed lateral movement via PSExec to the jump server (Vnevado-jump) on 2024-07-10 11:24:45 UTC, where the file `notepad.exe` was involved in the activity.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
