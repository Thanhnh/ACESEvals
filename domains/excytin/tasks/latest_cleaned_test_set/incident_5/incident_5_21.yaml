tasks:
- task_id: incident_5_latest_cleaned_test_set_task_21
  title: incident_5_latest_cleaned_test_set_task_21
  description: 'For the suspicious WMI process creation alert, what was the command line executed, and what was its process ID and creation time?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised for a possible attempt to access a Primary Refresh Token (PRT) on host `vnevado-win10s` (AAD Device ID `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`), where the process `browsercore.exe` (Process ID 2676) was executed on 2024-06-20T09:10:59Z. A PRT is a key artifact of Azure AD authentication that attackers can abuse for lateral movement or credential theft. Shortly after, a related alert was triggered for a suspicious WMI process creation on the same machine, since malware frequently uses WMI to spawn new processes and break process trees.'
    question: 'For the suspicious WMI process creation alert, what was the command line executed, and what was its process ID and creation time?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Command line: `bcdedit /set recoveryenabled no`, Process ID: 3464, Created time (UTC): 2024-06-20T09:29:37.8767978Z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Command line: `bcdedit /set recoveryenabled no`, Process ID: 3464, Created time (UTC): 2024-06-20T09:29:37.8767978Z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possible attempt to access the Primary Refresh Token (PRT) was detected for the account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`, indicating potential credential theft or lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious WMI process creation was observed on the machine, where the process with Process ID `3464` was created at `2024-06-20t09:29:37.8767978z` running the command line `bcdedit /set recoveryenabled no` to disable Windows recovery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
