tasks:
- task_id: incident_5_latest_cleaned_test_set_task_76
  title: incident_5_latest_cleaned_test_set_task_76
  description: 'In that earlier related alert about the renamed Windows Sysinternals tool, what file name was the tool launched under?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert named "PSExec to Vnevado-jump" was raised, indicating lateral movement to the organization''s jump server. The alert involved the account `tgs2z@vnevado.alpineskihouse.co`, the IP addresses `99.83.111.100` and `141.216.110.153`, and the file `notepad.exe`. Pivoting on the user account identity (AAD user ID) tied to this activity leads to an earlier alert from 2024-07-04, where a Windows Sysinternals tool was renamed and then launched — likely an attempt to covertly use the tool for malicious purposes.'
    question: 'In that earlier related alert about the renamed Windows Sysinternals tool, what file name was the tool launched under?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` performed lateral movement using PSExec to the jump server Vnevado-jump.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On the compromised host, a Windows Sysinternals tool was renamed and launched as the file `mimikatz.exe`, likely to covertly dump credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
