tasks:
- task_id: incident_5_latest_cleaned_test_set_task_32
  title: incident_5_latest_cleaned_test_set_task_32
  description: 'For the possible Primary Refresh Token (PRT) access attempt alert, which user account was identified as being involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious ''GenRansom'' malware behavior was detected as active on the host `vnevado-win11t` (AAD Device ID `e5799261-6720-4297-961e-bd9ca4275033`). Shortly before this detection, on the same device, alerts were raised for a possible attempt to access the Primary Refresh Token (PRT) — a key Azure AD authentication artifact that attackers may target for lateral movement or credential theft.'
    question: 'For the possible Primary Refresh Token (PRT) access attempt alert, which user account was identified as being involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The account name is `tgs2z`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The account name is `tgs2z`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious ''GenRansom'' malware behavior was detected as active on the host `vnevado-win11t`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On that host, a possible attempt to access the Primary Refresh Token (PRT) was detected involving the process file `browsercore.exe`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The PRT access attempt was performed under the user account `tgs2z`, indicating possible credential theft or lateral movement by this account.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
