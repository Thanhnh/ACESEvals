tasks:
- task_id: incident_5_latest_cleaned_test_set_task_11
  title: incident_5_latest_cleaned_test_set_task_11
  description: 'A related alert flagged potentially compromised assets exhibiting ransomware-like behavior across several devices. What is the name of the file associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware-related security incident, an alert for ''System recovery setting tampering'' was triggered on a device. The activity included the process `vssblatemp.exe` (Process ID 1900) executing the command `vssblatemp.exe delete shadows /all` to remove volume shadow copies, and another process (ID 3464) running `bcdedit /set recoveryenabled no` to disable Windows automatic recovery, both around 2024-06-20 09:29 UTC.'
    question: 'A related alert flagged potentially compromised assets exhibiting ransomware-like behavior across several devices. What is the name of the file associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'characterical.zip'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'System recovery setting tampering was observed on the device with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`, where built-in recovery features (such as volume shadow copies and the backup catalog) were deleted or disabled to prevent system restoration.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the tampering, the potentially compromised assets exhibited ransomware-like behavior involving the file `characterical.zip`, which was used as the attacker moved laterally to infect additional devices.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
