tasks:
- task_id: incident_5_latest_cleaned_test_set_task_40
  title: incident_5_latest_cleaned_test_set_task_40
  description: 'For the alert about the possible attempt to access the Primary Refresh Token (PRT), what is the Azure AD user ID (AadUserId) of the account involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a suspicious ''GenRansom'' malware behavior was detected as active on the host `vnevado-win11t` (AAD Device ID `e5799261-6720-4297-961e-bd9ca4275033`), indicating malware running or already persisting on the machine. Around the same time, a related alert flagged a possible attempt to access a Primary Refresh Token (PRT), a key Azure AD authentication artifact that attackers may target for lateral movement or credential theft.'
    question: 'For the alert about the possible attempt to access the Primary Refresh Token (PRT), what is the Azure AD user ID (AadUserId) of the account involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '731adb71-b11c-4bbf-850b-57989b350e96'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '731adb71-b11c-4bbf-850b-57989b350e96'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious ''GenRansom'' ransomware behavior was detected running on the host with HostName `vnevado-win11t`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that compromised device, a possible attempt to access the Primary Refresh Token (PRT) was detected for the user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`, indicating credential theft for lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
