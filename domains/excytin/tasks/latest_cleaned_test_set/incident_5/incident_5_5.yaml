tasks:
- task_id: incident_5_latest_cleaned_test_set_task_5
  title: incident_5_latest_cleaned_test_set_task_5
  description: 'Around the same time, another alert in this incident flagged the execution of a known credential theft tool whose command line indicated intent to dump users'' credentials, keys and plain-text passwords. What IP address was associated with that credential theft tool execution alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an alert titled "Potentially compromised assets exhibiting ransomware-like behavior" was raised on 2024-07-04. The alert involved the account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`, AAD user ID `731adb71-b11c-4bbf-850b-57989b350e96`) on the device `vnevado-win11t` (AAD device ID `e5799261-6720-4297-961e-bd9ca4275033`), along with the script `get-userprttoken.ps1` and files `characterical.zip` and its encrypted counterpart `characterical.zip.lockbit`. The attack chain also included lateral movement via PSExec to the jump server `Vnevado-jump`.'
    question: 'Around the same time, another alert in this incident flagged the execution of a known credential theft tool whose command line indicated intent to dump users'' credentials, keys and plain-text passwords. What IP address was associated with that credential theft tool execution alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Potentially compromised assets exhibiting ransomware-like behavior were observed originating from IP address `99.83.111.100`, indicating an attacker moving laterally to infect multiple devices.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account `tgs2z` was used to perform lateral movement via PSExec to the jump server Vnevado-jump.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A malicious credential theft tool execution was detected on the device with IP address `107.224.99.179`, indicating an attempt to dump users'' credentials, keys, and plain-text passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
