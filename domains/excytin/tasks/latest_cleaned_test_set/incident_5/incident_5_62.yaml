tasks:
- task_id: incident_5_latest_cleaned_test_set_task_62
  title: incident_5_latest_cleaned_test_set_task_62
  description: 'Approximately one second before this alert, a related alert reported that a possibly compromised user account was dropping a ransomware-related file onto several devices. What is the name of that dropped file?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a security incident, an alert titled "Potentially compromised assets exhibiting ransomware-like behavior" was raised on 2024-07-04 at 22:35 UTC. The alert flagged the user account `dp5hn` (SID S-1-5-21-1840191660-8534830288-125585561-1522), the device `vnevado-win11t`, the IP address `99.83.111.100`, and a suspicious script named `get-userprttoken.ps1`. The behavior suggests an attacker was moving laterally across the network to infect as many devices as possible with ransomware.'
    question: 'Approximately one second before this alert, a related alert reported that a possibly compromised user account was dropping a ransomware-related file onto several devices. What is the name of that dropped file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip.lockbit'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'characterical.zip.lockbit'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A potentially compromised asset, the device with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`, exhibited ransomware-like behavior and was used to move laterally and infect several devices.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A possibly compromised user account leveraged this activity to drop a ransomware-related file named `characterical.zip.lockbit` on several devices.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
