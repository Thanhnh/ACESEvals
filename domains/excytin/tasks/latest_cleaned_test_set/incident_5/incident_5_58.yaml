tasks:
- task_id: incident_5_latest_cleaned_test_set_task_58
  title: incident_5_latest_cleaned_test_set_task_58
  description: 'For the alert reporting that a ransomware payload was remotely launched on the device, which user account name was involved in launching it?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, a malicious credential theft tool execution was detected: the process `mimikatz.exe` was run twice on a compromised endpoint (PID 1044 at 2024-06-20T08:59:25Z and PID 3932 at 2024-06-20T09:00:16Z) with the command line `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit`, and the activity was associated with the IP address `107.224.99.179`. Shortly afterwards, the attacker used PsExec for lateral movement to the jump server, and a ransomware payload was remotely launched on a device in the environment.'
    question: 'For the alert reporting that a ransomware payload was remotely launched on the device, which user account name was involved in launching it?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dp5hn'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed on host `vnevado-win10v`, dumping users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker performed lateral movement via PSExec to the jump server from IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A ransomware payload was then remotely launched under the account `dp5hn`, attempting to encrypt content on the device.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
