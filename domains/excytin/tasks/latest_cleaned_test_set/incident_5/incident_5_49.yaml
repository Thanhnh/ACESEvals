tasks:
- task_id: incident_5_latest_cleaned_test_set_task_49
  title: incident_5_latest_cleaned_test_set_task_49
  description: 'Shortly after this detection, a related alert reported system recovery setting tampering (attempts to delete backups/shadow copies and disable recovery options). What is the Azure AD device ID of the device on which that tampering activity was observed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, ''CommandAndControl'' malware was detected on the device `vnevado-win10s` (Azure AD device ID `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`), where a process was launched with the command line `curl http://vectorsandarrows.com` (Process ID 6460, created 2024-06-20T09:10:51Z), suggesting an attacker may have been moving laterally to this device from another device on the network.'
    question: 'Shortly after this detection, a related alert reported system recovery setting tampering (attempts to delete backups/shadow copies and disable recovery options). What is the Azure AD device ID of the device on which that tampering activity was observed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'AadDeviceId: 9d4887ba-0b69-47d6-89bc-9b32787f379e'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'AadDeviceId: 9d4887ba-0b69-47d6-89bc-9b32787f379e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A ''CommandAndControl'' malware was detected during lateral movement, associated with the user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` at 2024-07-04 22:35:01.592226+00:00.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the lateral movement, system recovery setting tampering was observed on the device with AadDeviceId `9d4887ba-0b69-47d6-89bc-9b32787f379e` at 2024-07-04 22:35:02.226256+00:00, where the attacker attempted to delete volume shadow copies, remove the backup catalog, and disable automatic Windows recovery features to prevent system restoration.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
