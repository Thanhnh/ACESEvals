tasks:
- task_id: incident_5_latest_cleaned_test_set_task_15
  title: incident_5_latest_cleaned_test_set_task_15
  description: 'Shortly after this tampering, a related alert flagged a possible attempt to access the Primary Refresh Token (PRT) on the same device. What is the name of the executable file involved in that PRT access attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, system recovery setting tampering was observed on host `vnevado-win11t` (AAD Device ID `e5799261-6720-4297-961e-bd9ca4275033`). The attacker ran `vssblatemp.exe delete shadows /all` (PID 1900) and `bcdedit /set recoveryenabled no` (PID 3464) to remove volume shadow copies and disable Windows recovery features, likely preparing for data destruction or ransomware deployment.'
    question: 'Shortly after this tampering, a related alert flagged a possible attempt to access the Primary Refresh Token (PRT) on the same device. What is the name of the executable file involved in that PRT access attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'browsercore.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'browsercore.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` performed system recovery setting tampering on the device, attempting to delete backups and disable recovery services.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the same compromised context, a possible attempt to access the Primary Refresh Token (PRT) was detected through the process with extracted file name `browsercore.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
