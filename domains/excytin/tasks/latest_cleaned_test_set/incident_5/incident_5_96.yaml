tasks:
- task_id: incident_5_latest_cleaned_test_set_task_96
  title: incident_5_latest_cleaned_test_set_task_96
  description: 'Tracing this command-and-control activity back through the related alerts, a process was observed reaching out to an attacker-controlled web domain. What was the full command line of that process, its process ID, and when was it created?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a ''CommandAndControl'' malware detection was raised on the device `vnevado-win10r` (AAD Device ID `9d4887ba-0b69-47d6-89bc-9b32787f379e`), suggesting an attacker might be moving laterally to this device from another device on the network. The activity was associated with the account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`, AAD User ID `731adb71-b11c-4bbf-850b-57989b350e96`).'
    question: 'Tracing this command-and-control activity back through the related alerts, a process was observed reaching out to an attacker-controlled web domain. What was the full command line of that process, its process ID, and when was it created?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Command line: `curl http://vectorsandarrows.com`, Process ID: 1332, Created Time (UTC): 2024-06-20T09:10:52.7298237Z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Command line: `curl http://vectorsandarrows.com`, Process ID: 1332, Created Time (UTC): 2024-06-20T09:10:52.7298237Z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: '''CommandAndControl'' malware was detected on the device during lateral movement, indicating an attacker may be pivoting to this device from another compromised host on the network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The malicious activity was tied to a process with Process ID `1332`, created at `2024-06-20t09:10:52.7298237z`, which ran the command line `curl http://vectorsandarrows.com` to contact the attacker''s command-and-control server.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
