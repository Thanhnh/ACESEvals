tasks:
- task_id: incident_5_latest_cleaned_test_set_task_77
  title: incident_5_latest_cleaned_test_set_task_77
  description: 'Shortly after this activity, an alert was raised on the same host for a possible attempt to access the Primary Refresh Token (PRT). What is the name of the executable file involved in that PRT access attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, system recovery setting tampering was observed on a device: a process `vssblatemp.exe` (Process ID 5512, created 2024-06-20T09:10:50Z) was run with the command line `vssblatemp.exe delete shadows /all`, and another process (Process ID 8136) executed `bcdedit /set recoveryenabled no`. These actions suggest an adversary attempting to delete volume shadow copies and disable Windows recovery features, likely as a precursor to data destruction or ransomware.'
    question: 'Shortly after this activity, an alert was raised on the same host for a possible attempt to access the Primary Refresh Token (PRT). What is the name of the executable file involved in that PRT access attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'browsercore.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'browsercore.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'System recovery setting tampering was detected on the host with HostName `vnevado-win10s`, where built-in recovery features (such as volume shadow copies or the backup catalog) were disabled or deleted.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same device, a possible attempt to access the Primary Refresh Token (PRT) was detected involving the process with ExtractedFileName `browsercore.exe`, indicating potential credential theft or lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
