tasks:
- task_id: incident_5_latest_cleaned_test_set_task_100
  title: incident_5_latest_cleaned_test_set_task_100
  description: 'For the system recovery setting tampering alert linked to this incident, what was the process ID, creation time, and full command line of the process used to destroy the system''s backups?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a possible attempt to access a Primary Refresh Token (PRT) was detected on host `vnevado-win11u` (AAD Device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`), where the process `browsercore.exe` (Process ID 1640, created 2024-06-20T09:32:12.1031042Z, command line `"browsercore.exe"`) was launched. A PRT is a key artifact of Azure AD authentication that attackers may target to move laterally or steal credentials. Related to this activity, another alert on the same device reported system recovery setting tampering, where an adversary attempted to remove backups and disable recovery options.'
    question: 'For the system recovery setting tampering alert linked to this incident, what was the process ID, creation time, and full command line of the process used to destroy the system''s backups?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 7236, Created Time (UTC): 2024-06-20T09:10:51.2193152Z, Command line: `vssblatemp.exe delete shadows /all`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 7236, Created Time (UTC): 2024-06-20T09:10:51.2193152Z, Command line: `vssblatemp.exe delete shadows /all`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` was involved in a possible attempt to access the Primary Refresh Token (PRT), which attackers can use for lateral movement or credential theft.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker tampered with system recovery settings by running the process `vssblatemp.exe delete shadows /all` with Process ID `7236` at `2024-06-20t09:10:51.2193152z`, deleting all volume shadow copies to prevent system recovery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
