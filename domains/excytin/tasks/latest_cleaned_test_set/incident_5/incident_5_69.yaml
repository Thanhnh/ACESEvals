tasks:
- task_id: incident_5_latest_cleaned_test_set_task_69
  title: incident_5_latest_cleaned_test_set_task_69
  description: 'For the related credential theft tool execution alert, which IP address was recorded as an entity in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a "Suspicious remote activity" alert fired on host `vnevado-win11u` (AAD Device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`), indicating that activity was initiated remotely against this machine. On this device, several suspicious processes were observed under the account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`, including `bcdedit /set recoveryenabled no`, `bcdedit /set bootstatuspolicy ignoreallfailures`, `vssblatemp.exe delete shadows /all`, `curl http://vectorsandarrows.com`, and the script `get-userprttoken.ps1`. Shortly after, at 2024-07-04 22:35:02 UTC, a related alert was raised for the execution of a known credential theft tool whose command line indicated an intent to dump users'' credentials, keys and plain-text passwords.'
    question: 'For the related credential theft tool execution alert, which IP address was recorded as an entity in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was initiated against the machine from the remote IP address `99.83.111.100`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account `tgs2z` was used to perform lateral movement via PSExec to the jump server Vnevado-jump.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A known malicious credential theft tool was executed to dump users'' credentials, associated with the IP address `107.224.99.179`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
