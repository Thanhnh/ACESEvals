tasks:
- task_id: incident_5_latest_cleaned_test_set_task_55
  title: incident_5_latest_cleaned_test_set_task_55
  description: 'In the related alert about suspicious access to the LSASS service, which file (library) was identified as involved in that credential-theft activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware-focused incident, potentially compromised assets exhibited ransomware-like behavior on host `vnevado-win11t` (AAD device ID `e5799261-6720-4297-961e-bd9ca4275033`) involving the account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`). Files such as `get-userprttoken.ps1`, `characterical.zip`, and the encrypted `characterical.zip.lockbit` were observed. The attacker also moved laterally via PSExec to the jump server, and a related alert flagged suspicious access to the LSASS service, where attackers attempt to decrypt clear-text credentials from memory for further lateral movement.'
    question: 'In the related alert about suspicious access to the LSASS service, which file (library) was identified as involved in that credential-theft activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'hid.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'hid.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Potentially compromised assets exhibiting ransomware-like behavior were detected involving the IP address `99.83.111.100`, indicating an attacker moving laterally across the network to infect devices with ransomware.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker used PSExec to perform lateral movement to the jump server `Vnevado-jump` using the account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Suspicious access to the LSASS service was observed, involving the file `hid.dll`, used to dump credentials from LSASS memory for further lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
