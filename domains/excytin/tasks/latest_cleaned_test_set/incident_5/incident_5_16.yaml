tasks:
- task_id: incident_5_latest_cleaned_test_set_task_16
  title: incident_5_latest_cleaned_test_set_task_16
  description: 'A related alert on this host flagged a possible attempt to access the Azure AD Primary Refresh Token (PRT). Which executable (file name) was leveraged in that alert to attempt the PRT access?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident on host `vnevado-win10s` (AAD Device ID f5b847aa-8712-4bf6-b4f7-ed6cd89e1505), a suspicious WMI process creation was observed. Malware frequently uses WMI to spawn new processes, breaking process trees and further infecting a machine. On the same host, several destructive and suspicious commands were run, including `vssblatemp.exe delete shadows /all` (PID 5512), `bcdedit /set recoveryenabled no` (PID 8136), `bcdedit /set bootstatuspolicy ignoreallfailures` (PID 1868), `curl http://vectorsandarrows.com` (PID 6460), and `powershell -file c:\scripts\get-userprttoken.ps1` (PID 6168).'
    question: 'A related alert on this host flagged a possible attempt to access the Azure AD Primary Refresh Token (PRT). Which executable (file name) was leveraged in that alert to attempt the PRT access?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'browsercore.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'browsercore.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` was observed creating a suspicious process via WMI, which malware often uses to spawn new processes and break process trees.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From that activity, the process `browsercore.exe` was executed in a possible attempt to access the Primary Refresh Token (PRT) for credential theft or lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
