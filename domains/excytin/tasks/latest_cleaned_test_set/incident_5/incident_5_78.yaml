tasks:
- task_id: incident_5_latest_cleaned_test_set_task_78
  title: incident_5_latest_cleaned_test_set_task_78
  description: 'Shortly before this WMI activity, an alert for a ''Possible attempt to access Primary Refresh Token (PRT)'' was triggered on the same compromised account. What IP address was associated with that PRT access attempt alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage attack, a ''Suspicious WMI process creation'' alert was raised on an endpoint. The observed activity included destructive and reconnaissance commands such as `bcdedit /set recoveryenabled no` (PID 4828), `bcdedit /set bootstatuspolicy ignoreallfailures` (PID 7332), `vssblatemp.exe delete shadows /all` (PID 1900), and `curl http://vectorsandarrows.com` (PID 5572), all executed on 2024-06-20 around 09:32 UTC. Malware frequently uses WMI to spawn new processes, breaking process trees and further infecting a machine.'
    question: 'Shortly before this WMI activity, an alert for a ''Possible attempt to access Primary Refresh Token (PRT)'' was triggered on the same compromised account. What IP address was associated with that PRT access attempt alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious WMI process creation was observed, initiated by the user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`, at 2024-07-04 22:35:02 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The process `browsercore.exe` was used in a possible attempt to access the Primary Refresh Token (PRT), indicating credential theft activity, at 2024-07-04 22:35:00 UTC.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The PRT access attempt was associated with the IP address `107.224.99.179`, which is the source involved in the possible credential theft / lateral movement attempt.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
