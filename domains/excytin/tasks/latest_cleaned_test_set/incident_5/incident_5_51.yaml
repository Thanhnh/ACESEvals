tasks:
- task_id: incident_5_latest_cleaned_test_set_task_51
  title: incident_5_latest_cleaned_test_set_task_51
  description: 'A second, closely related alert fired one second later reporting potentially compromised assets exhibiting ransomware-like behavior. Which encrypted archive file (a LockBit-encrypted 7z file) was identified in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a ransomware incident, an alert titled ''Possible compromised user account delivering ransomware-related files'' fired on 2024-07-04, showing that user account `dp5hn` (SID S-0-6-5, AAD user ID 731adb71-b11c-4bbf-850b-57989b350e96) dropped ransomware-related files such as `unstreaming.xlsx.lockbit`, `earlap.doc.lockbit`, and an archive named `syncretic.7z` on device `vnevado-win11u` (AAD device ID bc00e484-d0e5-4da4-9472-95568cccc07e), with activity associated with IP 99.83.111.100.'
    question: 'A second, closely related alert fired one second later reporting potentially compromised assets exhibiting ransomware-like behavior. Which encrypted archive file (a LockBit-encrypted 7z file) was identified in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'kiters.7z.lockbit'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'kiters.7z.lockbit'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account was observed dropping a ransomware-related file named `syncretic.7z.lockbit` on several devices, indicating lateral movement and ransomware infection attempts.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Potentially compromised assets exhibited ransomware-like behavior, encrypting files and producing the ransomware-encrypted file `kiters.7z.lockbit` across multiple devices.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
