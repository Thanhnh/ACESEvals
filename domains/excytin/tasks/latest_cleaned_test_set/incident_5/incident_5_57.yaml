tasks:
- task_id: incident_5_latest_cleaned_test_set_task_57
  title: incident_5_latest_cleaned_test_set_task_57
  description: 'For this same tampering alert, what is the Windows security identifier (SID) of the account that carried out the recovery-disabling activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security investigation, an alert for "System recovery setting tampering" fired on the device `vnevado-win11u` (Azure AD device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`). The activity included running `bcdedit /set recoveryenabled no` (PID 4828) and `vssblatemp.exe delete shadows /all` (PID 1900) at around 2024-06-20 09:32 UTC, which suggests an adversary attempting to delete volume shadow copies and disable recovery services to prevent restoring a corrupted system — often a precursor to data destruction or ransomware encryption. The account observed performing this activity is `dp5hn`, with Azure AD user ID `731adb71-b11c-4bbf-850b-57989b350e96`.'
    question: 'For this same tampering alert, what is the Windows security identifier (SID) of the account that carried out the recovery-disabling activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1840191660-8534830288-125585561-1522'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1840191660-8534830288-125585561-1522'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'System recovery setting tampering was observed on the device, where built-in recovery features (such as volume shadow copies, backup catalog, and automatic repair) were deleted or disabled to prevent system recovery.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The activity was performed by the user account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
