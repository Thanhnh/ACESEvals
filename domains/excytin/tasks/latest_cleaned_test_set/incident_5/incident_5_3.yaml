tasks:
- task_id: incident_5_latest_cleaned_test_set_task_3
  title: incident_5_latest_cleaned_test_set_task_3
  description: 'This activity was linked to an alert associating the incident with the Manatee Tempest activity group, a Russia-based cybercriminal group known for using Cobalt Strike beacons and domain fronting for command-and-control. What IP address was flagged in that Manatee Tempest activity group alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, system recovery setting tampering was observed on a device: the process `vssblatemp.exe` (Process ID 1900) was executed with the command line `vssblatemp.exe delete shadows /all`, and shortly before that, `bcdedit /set recoveryenabled no` was run under Process ID 3464. These actions suggest an adversary attempting to delete volume shadow copies and disable Windows recovery features, typically as a precursor to ransomware deployment.'
    question: 'This activity was linked to an alert associating the incident with the Manatee Tempest activity group, a Russia-based cybercriminal group known for using Cobalt Strike beacons and domain fronting for command-and-control. What IP address was flagged in that Manatee Tempest activity group alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` was observed tampering with system recovery settings on the device, attempting to delete backups and disable recovery services.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The activity was attributed to the Manatee Tempest activity group, which communicated with the command-and-control IP address `198.43.121.209`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
