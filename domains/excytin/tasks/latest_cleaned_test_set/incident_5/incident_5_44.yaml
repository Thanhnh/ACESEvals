tasks:
- task_id: incident_5_latest_cleaned_test_set_task_44
  title: incident_5_latest_cleaned_test_set_task_44
  description: 'For the alert attributing the activity to the Manatee Tempest activity group, what is the Azure AD (AAD) device ID of the host involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Possible lateral movement'' alert was raised after suspicious network activity involving the IP address `38.142.109.10` was observed in close time proximity to lateral movement on another device. Shortly afterwards, an alert fired for a ransomware payload being remotely launched, and roughly a second later a related alert attributed the activity to the Manatee Tempest activity group, a Russia-based cybercriminal group known for Dridex, BLISTER loader, Cobalt Strike beacons, and ransomware deployment.'
    question: 'For the alert attributing the activity to the Manatee Tempest activity group, what is the Azure AD (AAD) device ID of the host involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '9d4887ba-0b69-47d6-89bc-9b32787f379e'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '9d4887ba-0b69-47d6-89bc-9b32787f379e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Lateral movement was observed on the device with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`, in close time proximity to a suspicious network event, indicating an attacker moving across devices.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A ransomware payload was remotely launched under the user account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`, attempting to encrypt content on the device.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The activity was attributed to the Manatee Tempest activity group, observed on the device with AadDeviceId `9d4887ba-0b69-47d6-89bc-9b32787f379e`, which uses Cobalt Strike beacons for lateral movement and ransomware deployment.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
