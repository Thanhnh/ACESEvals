tasks:
- task_id: incident_5_latest_cleaned_test_set_task_79
  title: incident_5_latest_cleaned_test_set_task_79
  description: 'For the alert regarding the possible attempt to access the Primary Refresh Token, which executable was launched, and what were its process ID and creation time?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident, an alert fired for potentially compromised assets exhibiting ransomware-like behavior across several devices. The associated entities included the IP address `99.83.111.100`, the account SID `S-0-6-5`, and files such as `get-userprttoken.ps1`, `characterical.zip`, and its encrypted counterpart `characterical.zip.lockbit`, suggesting an attacker was moving laterally and encrypting data. Shortly before this, a related alert flagged a possible attempt to access a Primary Refresh Token (PRT), a key Azure AD authentication artifact that attackers target for credential theft and lateral movement.'
    question: 'For the alert regarding the possible attempt to access the Primary Refresh Token, which executable was launched, and what were its process ID and creation time?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process: browsercore.exe, Process ID: 7036, Created Time (UTC): 2024-06-20T09:29:49.304018Z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process: browsercore.exe, Process ID: 7036, Created Time (UTC): 2024-06-20T09:29:49.304018Z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Potentially compromised assets on host `vnevado-win11t` exhibited ransomware-like behavior, suggesting an attacker was moving laterally across the network from this device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On the same host, a possible attempt to access the Primary Refresh Token (PRT) was detected through the process `browsercore.exe` with Process ID `7036`, created at `2024-06-20t09:29:49.304018z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
