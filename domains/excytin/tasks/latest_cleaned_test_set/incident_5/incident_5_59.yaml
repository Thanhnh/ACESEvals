tasks:
- task_id: incident_5_latest_cleaned_test_set_task_59
  title: incident_5_latest_cleaned_test_set_task_59
  description: 'Shortly after this activity, and linked through the same compromised user account, ''CommandAndControl'' malware was detected on a different device as the attacker attempted lateral movement. What is the Microsoft Entra (AAD) device ID of that device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a suspicious WMI process creation was observed on host `vnevado-win11u` (AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`), where malware frequently uses WMI to spawn new processes and break process trees. On this host, several destructive and credential-theft commands were executed, including `bcdedit /set recoveryenabled no` (PID 4828), `bcdedit /set bootstatuspolicy ignoreallfailures` (PID 7332), `vssblatemp.exe delete shadows /all` (PID 1900), `curl http://vectorsandarrows.com` (PID 5572), and `powershell -file c:\scripts\get-userprttoken.ps1` (PID 5708).'
    question: 'Shortly after this activity, and linked through the same compromised user account, ''CommandAndControl'' malware was detected on a different device as the attacker attempted lateral movement. What is the Microsoft Entra (AAD) device ID of that device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e5799261-6720-4297-961e-bd9ca4275033'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'e5799261-6720-4297-961e-bd9ca4275033'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious WMI process creation was observed, initiated by the user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The activity led to ''CommandAndControl'' malware being detected during lateral movement on the device with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
