tasks:
- task_id: incident_5_latest_cleaned_test_set_task_33
  title: incident_5_latest_cleaned_test_set_task_33
  description: 'Roughly two seconds before this file-extension alert, a closely related alert reported that a ransomware payload had been remotely launched on a device. What is the Azure AD device ID of the device named in that remote-launch alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this ransomware-related security incident, an alert titled "Possible ransomware activity based on a known malicious extension" was raised at 2024-07-04 22:35:03 UTC. On the device `vnevado-win11t` (Azure AD device ID `e5799261-6720-4297-961e-bd9ca4275033`), numerous file system changes were observed, including files such as `characterical.zip` being renamed to `characterical.zip.lockbit`, along with the presence of the script `get-userprttoken.ps1` and activity associated with the account SID `S-0-6-5`. This mass file-extension change is indicative of ransomware encrypting files.'
    question: 'Roughly two seconds before this file-extension alert, a closely related alert reported that a ransomware payload had been remotely launched on a device. What is the Azure AD device ID of the device named in that remote-launch alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'AadDeviceId: bc00e484-d0e5-4da4-9472-95568cccc07e'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'AadDeviceId: bc00e484-d0e5-4da4-9472-95568cccc07e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Possible ransomware activity based on a known malicious extension was detected involving the IP address `99.83.111.100`, where numerous file system changes appended a file extension known from past ransomware incidents.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A ransomware payload was remotely launched on the device with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`, indicating attackers attempted to encrypt content on this device.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
