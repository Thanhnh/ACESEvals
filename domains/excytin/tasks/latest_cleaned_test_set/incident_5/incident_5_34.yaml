tasks:
- task_id: incident_5_latest_cleaned_test_set_task_34
  title: incident_5_latest_cleaned_test_set_task_34
  description: 'In the related alert where PsExec was used to launch a command on a remote device, what was the process ID, creation time, and full command line of the launched process?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a Suspicious WMI process creation alert was raised on host `vnevado-win10s` (AAD Device ID `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`) under the local account `dp5hn` (AAD User ID `731adb71-b11c-4bbf-850b-57989b350e96`). Several suspicious processes were spawned around the same time, including `vssblatemp.exe delete shadows /all` (PID 5512), `bcdedit /set recoveryenabled no` (PID 8136), `curl http://vectorsandarrows.com` (PID 6460), and `powershell -file c:\scripts\get-userprttoken.ps1` (PID 6168). This activity was correlated with ransomware-like behavior and lateral movement toward the jump server `vnevado-jump`.'
    question: 'In the related alert where PsExec was used to launch a command on a remote device, what was the process ID, creation time, and full command line of the launched process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 6428, Created Time (UTC): 2024-06-20T09:07:40.2264462Z, Command line: `notepad.exe \\vnevado-jump cmd.ee`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 6428, Created Time (UTC): 2024-06-20T09:07:40.2264462Z, Command line: `notepad.exe \\vnevado-jump cmd.ee`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` was observed creating a suspicious process via WMI, a technique malware uses to break process trees and further infect the machine.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Potentially compromised assets exhibiting ransomware-like behavior were associated with the IP address `99.83.111.100`, indicating an attacker moving laterally across the network.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The account `tgs2z` was used to perform PSExec lateral movement to the jump server `Vnevado-jump`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'PsExec launched a command on the remote device with Process ID `6428` at `2024-06-20t09:07:40.2264462z`, using the command line `notepad.exe \\vnevado-jump cmd.ee`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
