tasks:
- task_id: incident_134_latest_cleaned_test_set_task_1
  title: incident_134_latest_cleaned_test_set_task_1
  description: 'For the related BEC financial fraud alert where the suspicious inbox rule was created, what IP address was associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a potentially malicious URL click was detected when user `raphaelt@vnevado.alpineskihouse.co` clicked on the link `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`, which arrived in an email sent from `alyssat@vnevado.alpineskihouse.co` (sender IP `254.241.243.229`). Shortly afterwards, a related alert was raised for BEC financial fraud, where a suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session, suggesting an attacker may be attempting business email compromise.'
    question: 'For the related BEC financial fraud alert where the suspicious inbox rule was created, what IP address was associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '237.7.81.122'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '237.7.81.122'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user with SID `S-1-5-21-1874151667-3554330288-105586563-1715` clicked on a potentially malicious URL.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, a suspicious inbox rule hiding incoming email messages was created in a risky Azure Active Directory session from the IP address `237.7.81.122`, indicating a business email compromise (BEC) financial fraud attempt.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
