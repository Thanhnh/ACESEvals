tasks:
- task_id: incident_134_latest_cleaned_test_set_task_4
  title: incident_134_latest_cleaned_test_set_task_4
  description: 'Based on the linked alerts in this incident, what is the display name of the compromised user account whose mailbox rules were manipulated?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Suspicious inbox manipulation rule" was raised on 2024-07-17. A user''s inbox rules were manipulated in a suspicious manner, indicating an attacker might have gained access to the mailbox and is manipulating rules to delete or move messages or folders to exfiltrate data from the organization. The activity was observed from IP address `237.7.81.122`, involving cloud application AppId `20893`, and tied to an account with Entra ID (AAD) user ID `e036dee7-fa23-42ef-a019-468c8d3401f1` and SID `S-1-5-21-1874151667-3554330288-105586563-1715`.'
    question: 'Based on the linked alerts in this incident, what is the display name of the compromised user account whose mailbox rules were manipulated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Nina Park'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox manipulation rule was created for the mailbox of the user account `Nina Park`, indicating an attacker may have gained access to the inbox and is manipulating rules to delete, move, or hide messages to exfiltrate data.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
