tasks:
- task_id: incident_134_latest_cleaned_test_set_task_22
  title: incident_134_latest_cleaned_test_set_task_22
  description: 'For the user account associated with the potentially malicious URL click alert, what is the on-premises security identifier (SID) of that account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a password spray attack was detected originating from the IP address `170.54.121.63`. Pivoting from the targeted user account, analysts found an earlier alert on 2024-07-17 where one of the organization''s users clicked on a link that was determined to be malicious.'
    question: 'For the user account associated with the potentially malicious URL click alert, what is the on-premises security identifier (SID) of that account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1874151667-3554330288-105586563-1715'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1874151667-3554330288-105586563-1715'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected against the account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` at 2024-07-18 14:36:59 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised user, identified by SID `S-1-5-21-1874151667-3554330288-105586563-1715`, then clicked on a potentially malicious URL detected at 2024-07-17 10:59:14 UTC.'
