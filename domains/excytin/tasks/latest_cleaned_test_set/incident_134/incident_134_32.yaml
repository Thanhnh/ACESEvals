        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-1874151667-3554330288-105586563-1715` had its inbox rules manipulated in a suspicious manner, indicating an attacker gained access to the mailbox to hide or exfiltrate messages.'
      checkpoint_2:
