tasks:
- task_id: incident_134_latest_cleaned_test_set_task_28
  title: incident_134_latest_cleaned_test_set_task_28
  description: 'Shortly before the suspicious inbox rule was created, the same compromised identity triggered another alert for signing in from an anonymizing service such as a Tor browser or anonymizer VPN. What is the source IP address recorded for that anonymous sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was raised involving business email compromise (BEC) financial fraud, where a suspicious inbox rule that hides incoming email messages was created during a risky Azure Active Directory session. The activity was tied to the account `Nina Park` (email `raphaelt@vnevado.alpineskihouse.co`, SID `S-1-5-21-1874151667-3554330288-105586563-1715`), with the rule creation observed from IP address `237.7.81.122`. An attacker might be attempting to conduct financial fraud using this compromised identity.'
    question: 'Shortly before the suspicious inbox rule was created, the same compromised identity triggered another alert for signing in from an anonymizing service such as a Tor browser or anonymizer VPN. What is the source IP address recorded for that anonymous sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule hiding incoming email messages was created in a risky Azure AD session by the user with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`, indicating a possible business email compromise (BEC) financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Investigating the risky session further, the sign-in associated with this activity originated from an anonymous IP address (e.g., Tor browser or anonymizer VPN) with Address `170.54.121.63`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
