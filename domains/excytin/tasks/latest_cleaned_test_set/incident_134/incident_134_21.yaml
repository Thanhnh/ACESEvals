tasks:
- task_id: incident_134_latest_cleaned_test_set_task_21
  title: incident_134_latest_cleaned_test_set_task_21
  description: 'Slightly earlier in the same incident, an alert was triggered for a sign-in originating from an IP address known to be malicious, involving this same user. What is the Microsoft Entra ID (Azure AD) user ID of the account associated with that malicious IP sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Account compromised following a password-spray attack" was raised for the user Nina Park (`raphaelt@vnevado.alpineskihouse.co`, SID `S-1-5-21-1874151667-3554330288-105586563-1715`), who signed in from an unusual location and browser during a password spray attack, suggesting an attacker may have compromised the account for unauthorized network access.'
    question: 'Slightly earlier in the same incident, an alert was triggered for a sign-in originating from an IP address known to be malicious, involving this same user. What is the Microsoft Entra ID (Azure AD) user ID of the account associated with that malicious IP sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'AadUserId: e036dee7-fa23-42ef-a019-468c8d3401f1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'AadUserId: e036dee7-fa23-42ef-a019-468c8d3401f1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'During a password-spray attack, a user account was signed in from an unusual location and browser originating from the IP address `170.54.121.63`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same sign-in activity came from an IP address known to be malicious, compromising the account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
