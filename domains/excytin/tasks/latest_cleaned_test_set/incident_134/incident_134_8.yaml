tasks:
- task_id: incident_134_latest_cleaned_test_set_task_8
  title: incident_134_latest_cleaned_test_set_task_8
  description: 'A few minutes before that alert, another alert fired indicating that a user had clicked on a link found to be malicious. What was the exact URL (including its scheme) recorded in that click detection alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Email messages containing malicious URL removed after delivery" was raised on 2024-07-17 at 11:04 UTC. The email was sent from `alyssat@vnevado.alpineskihouse.co` (sender IP `254.241.243.229`) to the mailbox of `raphaelt@vnevado.alpineskihouse.co`, an account belonging to Nina Park (SID `S-1-5-21-1874151667-3554330288-105586563-1715`, AAD user ID `e036dee7-fa23-42ef-a019-468c8d3401f1`).'
    question: 'A few minutes before that alert, another alert fired indicating that a user had clicked on a link found to be malicious. What was the exact URL (including its scheme) recorded in that click detection alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` received an email containing a malicious URL, which was later removed after delivery at 2024-07-17 11:04:19 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same user clicked on the potentially malicious URL `http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`, detected at 2024-07-17 10:59:14 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
