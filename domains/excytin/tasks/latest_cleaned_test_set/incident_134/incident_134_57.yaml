tasks:
- task_id: incident_134_latest_cleaned_test_set_task_57
  title: incident_134_latest_cleaned_test_set_task_57
  description: 'Following this URL click, a Password Spray attack alert was raised the next day involving the same user identity. What is the source IP address from which the password spray attack was launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a potentially malicious URL click was detected: user Raphael T (`raphaelt@vnevado.alpineskihouse.co`, SID `S-1-5-21-1874151667-3554330288-105586563-1715`) received an email from `alyssat@vnevado.alpineskihouse.co` (sender IP `254.241.243.229`) containing the link `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`, and the link was clicked on 2024-07-17.'
    question: 'Following this URL click, a Password Spray attack alert was raised the next day involving the same user identity. What is the source IP address from which the password spray attack was launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` clicked on a potentially malicious URL at 2024-07-17 10:59:14 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, a password spray attack was detected originating from the IP address `170.54.121.63` at 2024-07-18 14:36:59 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
