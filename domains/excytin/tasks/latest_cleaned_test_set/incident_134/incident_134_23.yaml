tasks:
- task_id: incident_134_latest_cleaned_test_set_task_23
  title: incident_134_latest_cleaned_test_set_task_23
  description: 'For the related password-spray compromise alert on 2024-07-18, what was the source IP address the attacker signed in from?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) financial fraud investigation, an alert was raised on 2024-07-17 for a suspicious inbox rule that hides incoming email messages, created during a risky Azure Active Directory session originating from IP address `237.7.81.122`. Follow-up analysis showed the same user account was also flagged the next day by an alert titled ''Account compromised following a password-spray attack'', where the user signed in from an unusual location and browser.'
    question: 'For the related password-spray compromise alert on 2024-07-18, what was the source IP address the attacker signed in from?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Nina Park` was compromised, and a suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session, indicating an attempted business email compromise (BEC) financial fraud.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same account was signed in from an unusual location and browser during a password-spray attack, originating from the suspicious IP address `170.54.121.63`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
