tasks:
- task_id: incident_134_latest_cleaned_test_set_task_31
  title: incident_134_latest_cleaned_test_set_task_31
  description: 'For the earlier alert regarding the suspicious inbox manipulation rule, what is the on-premises security identifier (SID) of the affected user account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage identity-based incident, a password spray attack was detected originating from the IP address `170.54.121.63` on 2024-07-18. The compromised user account involved in this activity was also linked to earlier suspicious activity on 2024-07-17, where a user''s inbox rules were manipulated in a suspicious manner — an attacker might have gained access to the mailbox and modified rules to delete or move messages in order to exfiltrate data from the organization.'
    question: 'For the earlier alert regarding the suspicious inbox manipulation rule, what is the on-premises security identifier (SID) of the affected user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1874151667-3554330288-105586563-1715'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1874151667-3554330288-105586563-1715'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected against the account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'After compromising the account, the attacker created a suspicious inbox manipulation rule on the mailbox of the user with SID `S-1-5-21-1874151667-3554330288-105586563-1715` to delete or move messages and exfiltrate data.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
