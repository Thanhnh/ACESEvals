tasks:
- task_id: incident_134_latest_cleaned_test_set_task_43
  title: incident_134_latest_cleaned_test_set_task_43
  description: 'Following this anonymous sign-in, a later alert flagged suspicious emails sent by the same possibly compromised user account as part of the ongoing BEC fraud attempt. Who was the recipient of those suspicious emails?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) related incident, an alert was raised for a sign-in from an anonymous IP address `170.54.121.63` (e.g. Tor browser or anonymizer VPN), indicating a possibly compromised user account.'
    question: 'Following this anonymous sign-in, a later alert flagged suspicious emails sent by the same possibly compromised user account as part of the ongoing BEC fraud attempt. Who was the recipient of those suspicious emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nathan@avoriaz.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Nathan@avoriaz.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from an anonymous IP address (e.g. Tor browser or anonymizer VPN) was detected for the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`, indicating the account was likely compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account was then used to send suspicious BEC-related emails, which were delivered to the mail recipient `Nathan@avoriaz.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
