tasks:
- task_id: incident_134_latest_cleaned_test_set_task_56
  title: incident_134_latest_cleaned_test_set_task_56
  description: 'A closely related alert fired at nearly the same time reporting that a user''s inbox rules were manipulated in a suspicious manner, possibly to delete or move messages and exfiltrate data. What is the AppId of the cloud application flagged in that inbox manipulation alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) financial fraud investigation, an alert was raised for a suspicious inbox rule that hides incoming email messages, created within a risky Azure Active Directory session. The alert involved the account `Nina Park` (email `raphaelt@vnevado.alpineskihouse.co`, SID `S-1-5-21-1874151667-3554330288-105586563-1715`, Entra ID `e036dee7-fa23-42ef-a019-468c8d3401f1`) and the IP address `237.7.81.122`.'
    question: 'A closely related alert fired at nearly the same time reporting that a user''s inbox rules were manipulated in a suspicious manner, possibly to delete or move messages and exfiltrate data. What is the AppId of the cloud application flagged in that inbox manipulation alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The cloud application AppId is 20893 (Microsoft Exchange Online).'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The cloud application AppId is 20893 (Microsoft Exchange Online).'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with email `raphaelt@vnevado.alpineskihouse.co` was compromised in a risky Azure Active Directory session, where a suspicious inbox rule hiding incoming email messages was created, indicating a possible business email compromise (BEC) financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The suspicious inbox manipulation rules were created through the cloud application with AppId `20893` (Microsoft Exchange Online), which the attacker used to delete or move messages and exfiltrate data from the organization.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
