tasks:
- task_id: incident_134_latest_cleaned_test_set_task_25
  title: incident_134_latest_cleaned_test_set_task_25
  description: 'Other related alerts in this incident reference the same compromised identity by its user display name rather than by its SID or AAD user ID. What is the display name of that compromised user account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, an alert titled ''Account compromised following a password-spray attack'' was raised. According to the alert, a user was signed in from an unusual location and browser from the IP address `170.54.121.63` during a password spray attack, suggesting an attacker may have compromised the user account for unauthorized access to the network. The compromised account is identified by the SID `S-1-5-21-1874151667-3554330288-105586563-1715` and the Microsoft Entra (AAD) user ID `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
    question: 'Other related alerts in this incident reference the same compromised identity by its user display name rather than by its SID or AAD user ID. What is the display name of that compromised user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Nina Park'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password-spray attack was detected, and a sign-in occurred from an unusual location and browser, indicating the account was compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised user account is `Nina Park` (Type: account, Field: Name, Value: `Nina Park`), which the attacker may have used for unauthorized access to the network.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
