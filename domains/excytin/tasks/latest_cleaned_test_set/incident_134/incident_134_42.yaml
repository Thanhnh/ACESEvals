tasks:
- task_id: incident_134_latest_cleaned_test_set_task_42
  title: incident_134_latest_cleaned_test_set_task_42
  description: 'A related earlier alert in this same incident flagged that a user''s inbox rules were manipulated in a suspicious manner, potentially to delete or move messages and exfiltrate data. What is the cloud application ID (AppId) of the cloud app associated with that inbox rule manipulation alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) fraud attempt, an alert was raised for suspicious emails sent by a possibly compromised user account. The suspicious emails originated from sender `raphaelt@vnevado.alpineskihouse.co` at sender IP `237.7.81.122` and were delivered to the mailbox `nathan@avoriaz.alpineskihouse.co`. This alert was triggered based on a previous BEC-related alert.'
    question: 'A related earlier alert in this same incident flagged that a user''s inbox rules were manipulated in a suspicious manner, potentially to delete or move messages and exfiltrate data. What is the cloud application ID (AppId) of the cloud app associated with that inbox rule manipulation alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '20893'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Nina Park` sent suspicious emails, indicating the account was likely compromised as part of an ongoing BEC (business email compromise) fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the compromised account, the attacker manipulated inbox rules in a suspicious manner (to delete or move messages and hide activity) within the cloud application with AppId `20893` (Microsoft Exchange Online).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
