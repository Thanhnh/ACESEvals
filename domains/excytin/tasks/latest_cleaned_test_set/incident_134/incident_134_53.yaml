tasks:
- task_id: incident_134_latest_cleaned_test_set_task_53
  title: incident_134_latest_cleaned_test_set_task_53
  description: 'For the follow-on BEC financial fraud alert, which IP address was recorded as the source of the risky session where the suspicious inbox rule was created?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert fired for "Email messages containing malicious URL removed after delivery" on 2024-07-17 at 11:04 UTC. The email was sent from `alyssat@vnevado.alpineskihouse.co` (sender IP `254.241.243.229`) to the mailbox `raphaelt@vnevado.alpineskihouse.co`, and it contained the malicious URL `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`. About 30 minutes later, a related "BEC financial fraud" alert was raised for the same compromised user account, indicating that a suspicious inbox rule hiding incoming email messages was created during a risky Azure Active Directory session.'
    question: 'For the follow-on BEC financial fraud alert, which IP address was recorded as the source of the risky session where the suspicious inbox rule was created?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '237.7.81.122'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '237.7.81.122'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` received an email containing a malicious URL, which was delivered and later removed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, a suspicious inbox rule hiding incoming email messages was created in a risky Azure Active Directory session from the IP address `237.7.81.122`, indicating a business email compromise (BEC) financial fraud attempt.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
