tasks:
- task_id: incident_134_latest_cleaned_test_set_task_7
  title: incident_134_latest_cleaned_test_set_task_7
  description: 'For the alert about the potentially malicious URL click, what was the sender IP address of the email message that delivered the malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) financial fraud incident, we found that a suspicious inbox rule that hides incoming email messages was created within a risky Azure Active Directory session originating from the IP address `237.7.81.122`. Earlier in the same incident, an alert was raised indicating that one of the users clicked on a link that was found to be malicious.'
    question: 'For the alert about the potentially malicious URL click, what was the sender IP address of the email message that delivered the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '254.241.243.229'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '254.241.243.229'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Nina Park` was involved in a BEC financial fraud alert, where a suspicious inbox rule hiding incoming email messages was created during a risky Azure Active Directory session.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same user clicked on a potentially malicious URL delivered in an email message that originated from the sender IP `254.241.243.229`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
