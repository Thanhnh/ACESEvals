tasks:
- task_id: incident_134_latest_cleaned_test_set_task_40
  title: incident_134_latest_cleaned_test_set_task_40
  description: 'For the follow-up alert about the account compromised after the password-spray attack, what was the source IP address associated with the suspicious sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing business email compromise (BEC) investigation, an alert was raised for suspicious emails sent by a possibly compromised user account. The messages were sent from `raphaelt@vnevado.alpineskihouse.co` (sender IP `237.7.81.122`) to the mailbox `nathan@avoriaz.alpineskihouse.co` on 2024-07-17. Pivoting on the compromised user account (AadUserId) links this activity to a later alert on 2024-07-18 titled ''Account compromised following a password-spray attack'', where the same user was signed in from an unusual location and browser.'
    question: 'For the follow-up alert about the account compromised after the password-spray attack, what was the source IP address associated with the suspicious sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` sent suspicious emails as part of an ongoing BEC (business email compromise) fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The same user account was signed in from an unusual location and browser during a password-spray attack, indicating the account was compromised.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker''s sign-in originated from the suspicious IP address `170.54.121.63`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
