tasks:
- task_id: incident_134_latest_cleaned_test_set_task_18
  title: incident_134_latest_cleaned_test_set_task_18
  description: 'In the earlier ''Password Spray'' alert that is connected to this compromise, what is the Microsoft Entra (AAD) user ID of the targeted account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised showing that an account belonging to Nina Park (`raphaelt@vnevado.alpineskihouse.co`, SID `S-1-5-21-1874151667-3554330288-105586563-1715`) was compromised following a password-spray attack, with a sign-in from an unusual location and browser. This alert was linked through a shared source IP address to an earlier ''Password Spray'' alert that detected the attack itself.'
    question: 'In the earlier ''Password Spray'' alert that is connected to this compromise, what is the Microsoft Entra (AAD) user ID of the targeted account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e036dee7-fa23-42ef-a019-468c8d3401f1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'e036dee7-fa23-42ef-a019-468c8d3401f1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was observed originating from the suspicious IP address `170.54.121.63`, which was used to sign in to a user account from an unusual location and browser.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the password spray attack, the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` was compromised, giving the attacker unauthorized access to the network.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
