tasks:
- task_id: incident_134_latest_cleaned_test_set_task_26
  title: incident_134_latest_cleaned_test_set_task_26
  description: 'For the earlier related alert about the potentially malicious link click, what is the full URL that the user clicked on?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing business email compromise (BEC) investigation, an alert titled "Suspicious emails sent by BEC-related user" was raised on 2024-07-17 at 11:55 UTC. The suspicious mail was sent from the possibly compromised account `raphaelt@vnevado.alpineskihouse.co`, originating from sender IP `237.7.81.122`, and was delivered to the mailbox `nathan@avoriaz.alpineskihouse.co`. Roughly an hour earlier, a related alert reported that a user in the environment clicked a link that was determined to be malicious.'
    question: 'For the earlier related alert about the potentially malicious link click, what is the full URL that the user clicked on?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The compromised user account with email `raphaelt@vnevado.alpineskihouse.co` sent suspicious emails as part of an ongoing BEC (business email compromise) fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A user clicked on the potentially malicious URL `http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/` that was delivered through this activity.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
