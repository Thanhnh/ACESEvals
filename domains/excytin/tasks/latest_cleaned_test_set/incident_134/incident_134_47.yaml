tasks:
- task_id: incident_134_latest_cleaned_test_set_task_47
  title: incident_134_latest_cleaned_test_set_task_47
  description: 'Following the alert-entity path from this password spray attempt, which user account was involved? Provide the Microsoft Entra ID (AAD) user object ID of that account.'
  inherit_shared: true
  initial_context:
    incident_context: 'During an identity-focused security incident, a Password Spray alert was raised on 2024-07-18 at approximately 14:36 UTC, where a password spray attack was detected originating from the source IP address `170.54.121.63` against our Microsoft Entra ID (Azure AD) tenant.'
    question: 'Following the alert-entity path from this password spray attempt, which user account was involved? Provide the Microsoft Entra ID (AAD) user object ID of that account.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e036dee7-fa23-42ef-a019-468c8d3401f1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'e036dee7-fa23-42ef-a019-468c8d3401f1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected at 2024-07-18 14:36:59 UTC, where an attacker attempted to authenticate against many accounts using common passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The targeted/compromised account in this password spray attack is the user with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
