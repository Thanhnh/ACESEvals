tasks:
- task_id: incident_134_latest_cleaned_test_set_task_39
  title: incident_134_latest_cleaned_test_set_task_39
  description: 'What is the IP address that was identified as malicious in the sign-in alert on 2024-07-18 associated with this user?'
  inherit_shared: true
  initial_context:
    incident_context: 'In this incident, an alert was raised on 2024-07-17 for ''Email messages containing malicious URL removed after delivery''. The email was sent from `alyssat@vnevado.alpineskihouse.co` (sender IP 254.241.243.229) to the mailbox of `raphaelt@vnevado.alpineskihouse.co` (account name Nina Park, SID S-1-5-21-1874151667-3554330288-105586563-1715), and contained the URL `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`. The following day, the same compromised user account was flagged in a ''Malicious IP address'' alert, indicating a sign-in from an IP address known to be malicious around the time of sign-in.'
    question: 'What is the IP address that was identified as malicious in the sign-in alert on 2024-07-18 associated with this user?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` received an email containing a malicious URL, which was delivered and later removed at 2024-07-17 11:04:19 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the phishing email, the same compromised account was used to sign in from an IP address known to be malicious, with Address `170.54.121.63`, at 2024-07-18 13:48:02 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
