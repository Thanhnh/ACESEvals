tasks:
- task_id: incident_134_latest_cleaned_test_set_task_48
  title: incident_134_latest_cleaned_test_set_task_48
  description: 'Following the pivot from this compromised cloud identity, related alerts in the same incident show activity tied to the same user''s on-premises Active Directory account. What is the security identifier (SID) of that account?'
  inherit_shared: true
  initial_context:
    incident_context: 'A high-severity security incident was reported in our environment, beginning with a ''BEC financial fraud'' alert on 2024-07-17. In that alert, a suspicious inbox rule that hides incoming email messages was created during a risky Azure Active Directory session originating from the IP address `237.7.81.122`. The activity was attributed to the account of `Nina Park` (email: `raphaelt@vnevado.alpineskihouse.co`, Azure AD User ID: `e036dee7-fa23-42ef-a019-468c8d3401f1`), suggesting an attacker may be attempting business email compromise (BEC), a form of financial fraud.'
    question: 'Following the pivot from this compromised cloud identity, related alerts in the same incident show activity tied to the same user''s on-premises Active Directory account. What is the security identifier (SID) of that account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1874151667-3554330288-105586563-1715'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1874151667-3554330288-105586563-1715'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule that hides incoming email messages was created during a risky Azure Active Directory session, indicating a possible business email compromise (BEC) financial fraud attempt at `2024-07-17 11:34:48.803827+00:00`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The account involved in creating this suspicious inbox rule has the SID `S-1-5-21-1874151667-3554330288-105586563-1715`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
