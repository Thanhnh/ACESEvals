tasks:
- task_id: incident_134_latest_cleaned_test_set_task_9
  title: incident_134_latest_cleaned_test_set_task_9
  description: 'Reviewing the same user''s earlier sign-in activity, an alert was triggered for a sign-in originating from an anonymizing service such as a Tor browser or anonymizer VPN. What was the IP address used in that sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised indicating that the account of user `Nina Park` (email `raphaelt@vnevado.alpineskihouse.co`, SID `S-1-5-21-1874151667-3554330288-105586563-1715`) was compromised following a password-spray attack, where the user was signed in from an unusual location and browser.'
    question: 'Reviewing the same user''s earlier sign-in activity, an alert was triggered for a sign-in originating from an anonymizing service such as a Tor browser or anonymizer VPN. What was the IP address used in that sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` was compromised following a password-spray attack, signing in from an unusual location and browser.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account was then used to sign in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) with Address `170.54.121.63`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
