tasks:
- task_id: incident_134_latest_cleaned_test_set_task_34
  title: incident_134_latest_cleaned_test_set_task_34
  description: 'What is the IP address flagged as malicious in the earlier sign-in alert linked to this password spray activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, a password spray attack was detected against the user account with Azure AD (Entra ID) user ID `e036dee7-fa23-42ef-a019-468c8d3401f1` on 2024-07-18 at 14:36 UTC. Roughly an hour earlier, at 13:48 UTC, a related alert was raised for a sign-in originating from an IP address known to be malicious at the time of the sign-in.'
    question: 'What is the IP address flagged as malicious in the earlier sign-in alert linked to this password spray activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected originating from the IP address `170.54.121.63`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same IP address `170.54.121.63` is known to be malicious and was observed being used for a sign-in during or around the time of the attack.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
