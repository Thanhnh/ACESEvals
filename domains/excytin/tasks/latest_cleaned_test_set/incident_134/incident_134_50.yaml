tasks:
- task_id: incident_134_latest_cleaned_test_set_task_50
  title: incident_134_latest_cleaned_test_set_task_50
  description: 'About half an hour before the inbox rule manipulation, the same user account triggered an ''Anonymous IP address'' sign-in alert (e.g., Tor browser or anonymizer VPN). What was the source IP address recorded in that sign-in alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Suspicious inbox manipulation rule'' alert was raised on 2024-07-17 at 11:34 UTC, indicating that a user''s inbox rules were manipulated in a suspicious manner — an attacker may have gained access to the mailbox and is creating rules to delete or move messages in order to exfiltrate data. The affected account belongs to Nina Park (email `raphaelt@vnevado.alpineskihouse.co`, SID `S-1-5-21-1874151667-3554330288-105586563-1715`), and the activity was associated with cloud application ID `20893` and originated from IP `237.7.81.122`.'
    question: 'About half an hour before the inbox rule manipulation, the same user account triggered an ''Anonymous IP address'' sign-in alert (e.g., Tor browser or anonymizer VPN). What was the source IP address recorded in that sign-in alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` had its inbox rules manipulated in a suspicious manner, indicating an attacker gained access to the mailbox to delete, move, or exfiltrate messages.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account was signed into from an anonymous IP address (e.g., Tor browser or anonymizer VPN) with Address `170.54.121.63`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
