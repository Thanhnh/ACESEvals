tasks:
- task_id: incident_134_latest_cleaned_test_set_task_17
  title: incident_134_latest_cleaned_test_set_task_17
  description: 'For the follow-up ''Malicious IP address'' alert on 2024-07-18 tied to this same user, what was the IP address involved in the sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an identity-focused security incident, an account with Microsoft Entra (AAD) user ID `e036dee7-fa23-42ef-a019-468c8d3401f1` triggered an ''Anonymous IP address'' alert on 2024-07-17, indicating a sign-in originating from an anonymizing service such as a Tor browser or anonymizer VPN. A day later, on 2024-07-18, the same compromised identity was flagged again, this time for signing in from an IP address known to be malicious at or around the time of the sign-in.'
    question: 'For the follow-up ''Malicious IP address'' alert on 2024-07-18 tied to this same user, what was the IP address involved in the sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` signed in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) at 2024-07-17 11:01:27 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The following day, at 2024-07-18 13:48:02 UTC, a sign-in was detected from the malicious IP address `170.54.121.63`, an IP known to be malicious during or around the time of the sign-in.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
