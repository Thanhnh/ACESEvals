tasks:
- task_id: incident_134_latest_cleaned_test_set_task_36
  title: incident_134_latest_cleaned_test_set_task_36
  description: 'Following this email alert, the same compromised user account was involved in a password spray attack detected the next day. What is the source IP address associated with that password spray alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'In this incident, an alert titled "Email messages containing malicious URL removed after delivery" was raised. The email was sent from `alyssat@vnevado.alpineskihouse.co` (sender IP `254.241.243.229`) to the mailbox of `raphaelt@vnevado.alpineskihouse.co`, and contained the malicious URL `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`. The impacted account belongs to Nina Park (SID `S-1-5-21-1874151667-3554330288-105586563-1715`).'
    question: 'Following this email alert, the same compromised user account was involved in a password spray attack detected the next day. What is the source IP address associated with that password spray alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An email containing a malicious URL was delivered to the mailbox of the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`, and was later removed after delivery.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the email compromise, a password spray attack was detected originating from the IP address `170.54.121.63`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
