tasks:
- task_id: incident_134_latest_cleaned_test_set_task_6
  title: incident_134_latest_cleaned_test_set_task_6
  description: 'For that earlier alert about the emails carrying a malicious URL that were removed after delivery, what was the originating sender IP address of those messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing business email compromise (BEC) investigation, an alert titled ''Suspicious emails sent by BEC-related user'' was raised on 2024-07-17. It showed that suspicious messages were sent from the possibly compromised account `raphaelt@vnevado.alpineskihouse.co`, originating from sender IP `237.7.81.122`, and delivered to the mailbox `nathan@avoriaz.alpineskihouse.co`. Earlier that same day, another alert in this incident reported that email messages containing a malicious URL had been delivered to users and were later removed by the system.'
    question: 'For that earlier alert about the emails carrying a malicious URL that were removed after delivery, what was the originating sender IP address of those messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '254.241.243.229'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '254.241.243.229'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account with SID `S-1-5-21-1874151667-3554330288-105586563-1715` sent suspicious emails as part of an ongoing BEC (business email compromise) fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Related to this activity, emails containing a malicious URL were delivered and later removed, and these malicious email messages originated from the sender IP address `254.241.243.229`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
