tasks:
- task_id: incident_134_latest_cleaned_test_set_task_44
  title: incident_134_latest_cleaned_test_set_task_44
  description: 'About an hour later, an alert reported that this same user account was compromised following a password-spray attack, with the user signing in from an unusual location and browser. What is the on-premises security identifier (SID) of the affected account reported in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a sign-in alert titled ''Malicious IP address'' was raised on 2024-07-18 13:48:02 UTC for the account with AAD User ID `e036dee7-fa23-42ef-a019-468c8d3401f1`, which signed in from the IP address `170.54.121.63`, an address known to be malicious around the time of the sign-in.'
    question: 'About an hour later, an alert reported that this same user account was compromised following a password-spray attack, with the user signing in from an unusual location and browser. What is the on-premises security identifier (SID) of the affected account reported in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1874151667-3554330288-105586563-1715'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1874151667-3554330288-105586563-1715'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in was detected from an IP address known to be malicious for the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following a password-spray attack, the account with SID `S-1-5-21-1874151667-3554330288-105586563-1715` was compromised, signing in from an unusual location and browser.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
