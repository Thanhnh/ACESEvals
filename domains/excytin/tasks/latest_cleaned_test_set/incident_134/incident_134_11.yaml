tasks:
- task_id: incident_134_latest_cleaned_test_set_task_11
  title: incident_134_latest_cleaned_test_set_task_11
  description: 'For the follow-up alert about suspicious emails linked to the BEC fraud attempt, what was the sender email address of the messages that were sent?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised for a ''Suspicious inbox manipulation rule'' on the cloud application with AppId `20893`, indicating that a user''s inbox rules were manipulated in a suspicious manner, possibly by an attacker who gained access to the mailbox in order to delete or move messages and exfiltrate data. About 20 minutes later, a related alert fired for suspicious emails sent by a possibly compromised user account tied to an ongoing BEC (business email compromise) fraud attempt.'
    question: 'For the follow-up alert about suspicious emails linked to the BEC fraud attempt, what was the sender email address of the messages that were sent?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'raphaelt@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with SID `S-1-5-21-1874151667-3554330288-105586563-1715` had its inbox rules manipulated in a suspicious manner, indicating the attacker gained access to the mailbox and is hiding or exfiltrating messages.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the inbox manipulation, the compromised user sent suspicious emails as part of an ongoing BEC (business email compromise) fraud attempt, from the sender mail address `raphaelt@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
