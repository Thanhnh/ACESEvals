tasks:
- task_id: incident_134_latest_cleaned_test_set_task_20
  title: incident_134_latest_cleaned_test_set_task_20
  description: 'For the follow-up ''Anonymous IP address'' sign-in alert linked to this same user, what is the IP address the sign-in originated from?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled ''A potentially malicious URL click was detected'' was raised on 2024-07-17 at 10:59 UTC. The email was sent from `alyssat@vnevado.alpineskihouse.co` (sender IP `254.241.243.229`) to the mailbox of `raphaelt@vnevado.alpineskihouse.co` (account name Nina Park, SID `S-1-5-21-1874151667-3554330288-105586563-1715`), and it contained the malicious link `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`. About two minutes later, a related alert fired for the same compromised user account, indicating a sign-in from an anonymous IP address such as a Tor browser or anonymizer VPN.'
    question: 'For the follow-up ''Anonymous IP address'' sign-in alert linked to this same user, what is the IP address the sign-in originated from?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` clicked on a potentially malicious URL at 2024-07-17 10:59:14 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Shortly after, at 2024-07-17 11:01:27 UTC, a sign-in was detected from the anonymous IP address `170.54.121.63` (e.g., Tor browser or anonymizer VPN), indicating the compromised account was accessed by the attacker.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
