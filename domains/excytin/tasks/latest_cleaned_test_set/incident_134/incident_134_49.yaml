tasks:
- task_id: incident_134_latest_cleaned_test_set_task_49
  title: incident_134_latest_cleaned_test_set_task_49
  description: 'For the related alert about email messages containing a malicious URL that were removed after delivery, what was the sender address of those emails?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an ''Anonymous IP address'' alert was raised at 2024-07-17 11:01:27 UTC for a sign-in originating from the IP address `170.54.121.63`, indicating the use of an anonymizing service such as a Tor browser or anonymizer VPN. Minutes later, a related alert fired reporting that emails containing a malicious URL had been delivered to mailboxes and were subsequently removed (zapped).'
    question: 'For the related alert about email messages containing a malicious URL that were removed after delivery, what was the sender address of those emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from an anonymous IP address (e.g. Tor browser or anonymizer VPN) was detected for the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` at 2024-07-17 11:01:27 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the risky sign-in, email messages containing a malicious URL were delivered and later removed, sent from the mail message sender `alyssat@vnevado.alpineskihouse.co` at 2024-07-17 11:04:19 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
