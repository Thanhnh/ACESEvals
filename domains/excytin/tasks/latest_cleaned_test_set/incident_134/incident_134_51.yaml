tasks:
- task_id: incident_134_latest_cleaned_test_set_task_51
  title: incident_134_latest_cleaned_test_set_task_51
  description: 'For the earlier alert about the potentially malicious URL click, which user account (display name) was identified as having clicked the malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an ''Anonymous IP address'' alert was raised on 2024-07-17 at 11:01 UTC, indicating a sign-in originating from the anonymous IP address `170.54.121.63` (e.g., Tor browser or anonymizer VPN). Just minutes earlier, at 10:59 UTC, another related alert fired reporting that a user in the organization had clicked on a link found to be malicious.'
    question: 'For the earlier alert about the potentially malicious URL click, which user account (display name) was identified as having clicked the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Nina Park'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) was detected for the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` at 2024-07-17 11:01:27 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Related to this compromised activity, a potentially malicious URL click was detected at 2024-07-17 10:59:14 UTC for the account with Name `Nina Park`, indicating this user clicked on a link found to be malicious.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
