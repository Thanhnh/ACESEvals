tasks:
- task_id: incident_134_latest_cleaned_test_set_task_52
  title: incident_134_latest_cleaned_test_set_task_52
  description: 'Shortly before those suspicious emails were sent, the same compromised account was flagged for signing in from an anonymous IP address (e.g., Tor or an anonymizer VPN). What is the IP address associated with that anonymous sign-in alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing BEC (business email compromise) investigation, an alert was raised for suspicious emails sent by a possibly compromised user account. The account belonged to Nina Park (`raphaelt@vnevado.alpineskihouse.co`, SID `S-1-5-21-1874151667-3554330288-105586563-1715`), and a message was sent from IP `237.7.81.122` to the mailbox `nathan@avoriaz.alpineskihouse.co`.'
    question: 'Shortly before those suspicious emails were sent, the same compromised account was flagged for signing in from an anonymous IP address (e.g., Tor or an anonymizer VPN). What is the IP address associated with that anonymous sign-in alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` sent suspicious emails related to an ongoing BEC (business email compromise) fraud attempt at 2024-07-17 11:55:04 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account was signed in from an anonymous IP address `170.54.121.63` (e.g., Tor browser or anonymizer VPN) at 2024-07-17 11:01:27 UTC, indicating the attacker hid their source IP while accessing the account.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
