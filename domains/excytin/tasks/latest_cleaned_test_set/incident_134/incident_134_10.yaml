tasks:
- task_id: incident_134_latest_cleaned_test_set_task_10
  title: incident_134_latest_cleaned_test_set_task_10
  description: 'Which user account was involved in this anonymous IP sign-in? Provide the account''s Microsoft Entra (AAD) user object ID.'
  inherit_shared: true
  initial_context:
    incident_context: 'During an identity-focused security investigation, Microsoft Entra ID Protection raised an ''Anonymous IP address'' alert, indicating a sign-in originating from an anonymizing service such as a Tor browser or an anonymizer VPN. The sign-in was traced back to the source IP address `170.54.121.63`.'
    question: 'Which user account was involved in this anonymous IP sign-in? Provide the account''s Microsoft Entra (AAD) user object ID.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The compromised/impacted account has the AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The compromised/impacted account has the AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in was detected originating from an anonymous IP address (such as a Tor browser or anonymizer VPN) at 2024-07-17 11:01:27 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The anonymous sign-in attempt was associated with the user account having AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
