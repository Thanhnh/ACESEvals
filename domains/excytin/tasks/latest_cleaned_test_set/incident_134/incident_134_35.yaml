tasks:
- task_id: incident_134_latest_cleaned_test_set_task_35
  title: incident_134_latest_cleaned_test_set_task_35
  description: 'Based on the related BEC financial fraud alert, what is the email address of the compromised user account that created the suspicious inbox rule?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised for a sign-in originating from the IP address `170.54.121.63`, which is known to be malicious. This sign-in was tied to a user account that was also involved in a related alert, where a suspicious inbox rule that hides incoming email messages was created within a risky Azure Active Directory session — a common indicator of business email compromise (BEC) financial fraud.'
    question: 'Based on the related BEC financial fraud alert, what is the email address of the compromised user account that created the suspicious inbox rule?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'raphaelt@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in was detected from an IP address known to be malicious for the account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'In that risky session, a suspicious inbox rule hiding incoming email messages was created for the account with email `raphaelt@vnevado.alpineskihouse.co`, indicating a possible business email compromise (BEC) financial fraud attempt.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
