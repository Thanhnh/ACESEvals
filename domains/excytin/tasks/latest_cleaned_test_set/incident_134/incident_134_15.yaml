tasks:
- task_id: incident_134_latest_cleaned_test_set_task_15
  title: incident_134_latest_cleaned_test_set_task_15
  description: 'For that follow-up alert about the suspicious inbox manipulation rule, which cloud application ID (AppId) was recorded as the application involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Email messages containing malicious URL removed after delivery" was raised on 2024-07-17. The email was sent from `alyssat@vnevado.alpineskihouse.co` (sender IP `254.241.243.229`) to the mailbox `raphaelt@vnevado.alpineskihouse.co`, and it contained the malicious URL `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`. About 30 minutes later, a related alert fired indicating that a user''s inbox rules were manipulated in a suspicious manner, suggesting an attacker gained access to the mailbox and was creating rules to delete or move messages in order to exfiltrate data.'
    question: 'For that follow-up alert about the suspicious inbox manipulation rule, which cloud application ID (AppId) was recorded as the application involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The cloud application involved has AppId `20893`.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The cloud application involved has AppId `20893`.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-1874151667-3554330288-105586563-1715` received an email containing a malicious URL, which was delivered and later removed at 2024-07-17 11:04:19 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, suspicious inbox manipulation rules were created in the cloud application with AppId `20893`, indicating the attacker gained access to the user''s mailbox and set rules to delete or move messages to exfiltrate data.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
