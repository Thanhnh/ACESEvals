tasks:
- task_id: incident_134_latest_cleaned_test_set_task_45
  title: incident_134_latest_cleaned_test_set_task_45
  description: 'A related alert flagged suspicious emails sent by a possibly compromised user account tied to this ongoing BEC fraud attempt. What is the sender address of those suspicious email messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing business email compromise (BEC) investigation, an alert was raised for an account compromised following a password-spray attack, where a user signed in from an unusual location and browser from the IP address `170.54.121.63`. An attacker might have compromised the user account for unauthorized access to the network.'
    question: 'A related alert flagged suspicious emails sent by a possibly compromised user account tied to this ongoing BEC fraud attempt. What is the sender address of those suspicious email messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'raphaelt@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with email `raphaelt@vnevado.alpineskihouse.co` was compromised following a password-spray attack, with a sign-in from an unusual location and browser.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account was then used to send suspicious emails related to an ongoing BEC (business email compromise) fraud attempt, with mail message sender `raphaelt@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
