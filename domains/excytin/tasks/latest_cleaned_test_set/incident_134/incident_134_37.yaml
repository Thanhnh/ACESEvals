tasks:
- task_id: incident_134_latest_cleaned_test_set_task_37
  title: incident_134_latest_cleaned_test_set_task_37
  description: 'A password spray attack alert was later linked to this same user account. What is the source IP address from which the password spray attack was launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) financial fraud investigation, a suspicious inbox rule that hides incoming email messages was created in a risky Azure AD session by the account `Nina Park` (email `raphaelt@vnevado.alpineskihouse.co`, SID `S-1-5-21-1874151667-3554330288-105586563-1715`) from IP address `237.7.81.122`. Follow-up investigation on the same compromised user account revealed additional malicious sign-in activity the following day.'
    question: 'A password spray attack alert was later linked to this same user account. What is the source IP address from which the password spray attack was launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule that hides incoming email messages was created in a risky Azure AD session by the account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`, indicating a business email compromise (BEC) financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised identity context was associated with a password spray attack originating from the IP address `170.54.121.63`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
