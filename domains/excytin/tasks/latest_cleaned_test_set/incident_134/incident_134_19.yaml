tasks:
- task_id: incident_134_latest_cleaned_test_set_task_19
  title: incident_134_latest_cleaned_test_set_task_19
  description: 'For the related ''Suspicious inbox manipulation rule'' alert, what is the application ID (AppId) of the cloud application in which the suspicious rule manipulation took place?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an identity protection alert fired for a sign-in originating from the IP address `170.54.121.63`, which is known to be malicious. Pivoting on the compromised user account associated with that sign-in revealed an earlier related alert, ''Suspicious inbox manipulation rule'', where a user''s inbox rules were manipulated in a suspicious manner — potentially by an attacker who gained access to the mailbox to delete or move messages and exfiltrate data.'
    question: 'For the related ''Suspicious inbox manipulation rule'' alert, what is the application ID (AppId) of the cloud application in which the suspicious rule manipulation took place?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The cloud application involved has AppId `20893` (Microsoft Exchange Online).'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The cloud application involved has AppId `20893` (Microsoft Exchange Online).'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in was detected from an IP address known to be malicious for the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, suspicious inbox manipulation rules were created within the cloud application with AppId `20893`, indicating the attacker was moving or deleting messages to hide activity and exfiltrate data.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
