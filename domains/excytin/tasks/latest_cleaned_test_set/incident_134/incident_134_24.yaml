tasks:
- task_id: incident_134_latest_cleaned_test_set_task_24
  title: incident_134_latest_cleaned_test_set_task_24
  description: 'For that follow-up ''Malicious IP address'' sign-in alert on 2024-07-18, what was the malicious IP address used for the sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing business email compromise (BEC) investigation, an alert titled ''Suspicious emails sent by BEC-related user'' was raised on 2024-07-17. The possibly compromised account belonged to Nina Park (`raphaelt@vnevado.alpineskihouse.co`, SID S-1-5-21-1874151667-3554330288-105586563-1715), which sent mail from sender IP `237.7.81.122` to the mailbox `nathan@avoriaz.alpineskihouse.co`. Pivoting on the same user''s Entra ID (AAD) user ID, a follow-up alert the next day flagged a sign-in from an IP address known to be malicious.'
    question: 'For that follow-up ''Malicious IP address'' sign-in alert on 2024-07-18, what was the malicious IP address used for the sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` sent suspicious emails related to an ongoing BEC (business email compromise) fraud attempt at 2024-07-17 11:55:04 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account was then signed in from a known malicious IP address `170.54.121.63` at 2024-07-18 13:48:02 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
