tasks:
- task_id: incident_134_latest_cleaned_test_set_task_13
  title: incident_134_latest_cleaned_test_set_task_13
  description: 'For that follow-on BEC-related alert about suspicious emails being sent, which mailbox (primary address) was identified as the one involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a potentially malicious URL click was detected: an email sent from `alyssat@vnevado.alpineskihouse.co` (sender IP `254.241.243.229`) to the mailbox of `raphaelt@vnevado.alpineskihouse.co` contained the link `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`, which the recipient clicked. About an hour later, a related alert fired for suspicious emails sent by a possibly compromised user account tied to an ongoing BEC (business email compromise) fraud attempt.'
    question: 'For that follow-on BEC-related alert about suspicious emails being sent, which mailbox (primary address) was identified as the one involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'nathan@avoriaz.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'nathan@avoriaz.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with email `raphaelt@vnevado.alpineskihouse.co` clicked on a potentially malicious URL, indicating the account may have been compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, suspicious emails related to an ongoing BEC (business email compromise) fraud attempt were sent from the mailbox with primary address `nathan@avoriaz.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
