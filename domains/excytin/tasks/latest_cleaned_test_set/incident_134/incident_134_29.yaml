tasks:
- task_id: incident_134_latest_cleaned_test_set_task_29
  title: incident_134_latest_cleaned_test_set_task_29
  description: 'In the follow-up alert about suspicious emails sent by the BEC-related user, what is the primary address of the mailbox involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) financial fraud incident, a suspicious inbox rule that hides incoming email messages was created in a risky Azure AD session. The activity was associated with the account `Nina Park` (email `raphaelt@vnevado.alpineskihouse.co`, SID `S-1-5-21-1874151667-3554330288-105586563-1715`, AAD user ID `e036dee7-fa23-42ef-a019-468c8d3401f1`) and originated from IP address `237.7.81.122`. About 20 minutes later, a follow-up alert was raised for suspicious emails sent by this BEC-related compromised user.'
    question: 'In the follow-up alert about suspicious emails sent by the BEC-related user, what is the primary address of the mailbox involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'nathan@avoriaz.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'nathan@avoriaz.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule that hides incoming email messages was created in a risky Azure AD session originating from IP address `237.7.81.122`, indicating a business email compromise (BEC) financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that BEC-related activity, suspicious emails were sent from the possibly compromised mailbox with primary address `nathan@avoriaz.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
