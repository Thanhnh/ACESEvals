tasks:
- task_id: incident_134_latest_cleaned_test_set_task_55
  title: incident_134_latest_cleaned_test_set_task_55
  description: 'For the related alert about suspicious emails sent by a BEC-related user, what is the primary address of the mailbox that sent those suspicious emails?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a Password Spray attack was detected originating from the IP address `170.54.121.63`, which targeted user accounts in our organization. Pivoting on the compromised account involved in this attack revealed additional related activity, including an earlier alert for suspicious emails sent by a user tied to an ongoing BEC (business email compromise) fraud attempt.'
    question: 'For the related alert about suspicious emails sent by a BEC-related user, what is the primary address of the mailbox that sent those suspicious emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'nathan@avoriaz.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'nathan@avoriaz.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected targeting the account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, suspicious emails related to an ongoing BEC (business email compromise) fraud attempt were sent from the mailbox with primary address `nathan@avoriaz.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
