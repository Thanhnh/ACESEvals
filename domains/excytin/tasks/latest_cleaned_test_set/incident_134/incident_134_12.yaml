tasks:
- task_id: incident_134_latest_cleaned_test_set_task_12
  title: incident_134_latest_cleaned_test_set_task_12
  description: 'What is the malicious IP address from which the sign-in associated with this compromised account was observed on 2024-07-18?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Suspicious inbox manipulation rule'' alert was raised on 2024-07-17, where the mailbox of user Nina Park (`raphaelt@vnevado.alpineskihouse.co`, SID `S-1-5-21-1874151667-3554330288-105586563-1715`) had inbox rules manipulated from IP address `237.7.81.122` via cloud application ID 20893. This could indicate an attacker gained access to the mailbox and is moving or deleting messages to exfiltrate data. The following day, a related ''Malicious IP address'' alert was triggered for the same compromised account, indicating a sign-in from an IP address known to be malicious.'
    question: 'What is the malicious IP address from which the sign-in associated with this compromised account was observed on 2024-07-18?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` had inbox rules manipulated in a suspicious manner, indicating the attacker gained access to the mailbox and set rules to delete or move messages for data exfiltration.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account was then observed signing in from a known malicious IP address `170.54.121.63`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
