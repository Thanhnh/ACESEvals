tasks:
- task_id: incident_134_latest_cleaned_test_set_task_27
  title: incident_134_latest_cleaned_test_set_task_27
  description: 'For the alert about suspicious emails sent by the BEC-related user, what is the primary address of the mailbox involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing business email compromise (BEC) investigation, an alert was raised for a sign-in originating from the IP address `170.54.121.63`, which is known to be malicious. The same compromised user account was also flagged in an earlier alert for sending suspicious emails as part of the BEC fraud attempt.'
    question: 'For the alert about suspicious emails sent by the BEC-related user, what is the primary address of the mailbox involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'nathan@avoriaz.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'nathan@avoriaz.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in was detected from a known malicious IP address for the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account was then used to send suspicious emails as part of an ongoing BEC (business email compromise) fraud attempt from the mailbox with primary address `nathan@avoriaz.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
