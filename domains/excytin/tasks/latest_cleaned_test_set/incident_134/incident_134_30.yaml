tasks:
- task_id: incident_134_latest_cleaned_test_set_task_30
  title: incident_134_latest_cleaned_test_set_task_30
  description: 'Which user account was identified as compromised in the follow-up alert? Provide the account display name.'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, a password spray attack was detected at 2024-07-18 14:36:59 UTC, involving a user account with Azure AD user ID `e036dee7-fa23-42ef-a019-468c8d3401f1` and originating IP address `170.54.121.63`. Shortly afterwards, at 14:54:18 UTC, a follow-up alert was raised indicating that an account was compromised following the password-spray attack, where a user signed in from an unusual location and browser.'
    question: 'Which user account was identified as compromised in the follow-up alert? Provide the account display name.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Nina Park'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected originating from IP address `170.54.121.63`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the password-spray attack, the account `Nina Park` was compromised, signing in from an unusual location and browser.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
