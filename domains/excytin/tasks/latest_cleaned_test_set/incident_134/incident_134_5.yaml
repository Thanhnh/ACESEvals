tasks:
- task_id: incident_134_latest_cleaned_test_set_task_5
  title: incident_134_latest_cleaned_test_set_task_5
  description: 'For the BEC financial fraud alert where the hidden-email inbox rule was created, what was the IP address associated with that risky session?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage identity attack, a Password Spray attack was detected on 2024-07-18 originating from the source IP address `170.54.121.63`, targeting Azure Active Directory accounts in the organization. One of the impacted user accounts was later associated with additional malicious activity — on 2024-07-17 an alert fired for ''BEC financial fraud'', where a suspicious inbox rule that hides incoming email messages was created during a risky Azure Active Directory session, indicating a possible business email compromise attempt.'
    question: 'For the BEC financial fraud alert where the hidden-email inbox rule was created, what was the IP address associated with that risky session?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '237.7.81.122'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '237.7.81.122'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected against the account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, a suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session, indicating a business email compromise (BEC) financial fraud attempt originating from IP address `237.7.81.122`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
