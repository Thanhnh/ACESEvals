tasks:
- task_id: incident_134_latest_cleaned_test_set_task_38
  title: incident_134_latest_cleaned_test_set_task_38
  description: 'For the suspicious inbox manipulation rule alert that followed the malicious URL click, what was the IP address from which the inbox rule manipulation was performed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, a potentially malicious URL click was detected: an email sent from `alyssat@vnevado.alpineskihouse.co` (sender IP `254.241.243.229`) to the mailbox `raphaelt@vnevado.alpineskihouse.co` contained the link `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`, which the recipient clicked. About 35 minutes later, a follow-up alert showed that the same user''s inbox rules were manipulated in a suspicious manner, suggesting an attacker gained access to the mailbox to delete or move messages and exfiltrate data.'
    question: 'For the suspicious inbox manipulation rule alert that followed the malicious URL click, what was the IP address from which the inbox rule manipulation was performed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '237.7.81.122'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '237.7.81.122'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Nina Park` clicked on a potentially malicious URL that was detected in a delivered email.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise of that mailbox, a suspicious inbox manipulation rule was created to delete or move messages and hide the attacker''s activity, originating from the IP address `237.7.81.122`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
