tasks:
- task_id: incident_5_latest_cleaned_train_set_task_21
  title: incident_5_latest_cleaned_train_set_task_21
  description: 'A related alert shows that attack disruption automatically blocked a contained user''s attempts to create, delete, or modify files over SMB on multiple devices. What is the display name of the account that was contained and blocked in that lateral movement attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of Manatee Tempest activity group, an alert flagged suspicious activity on host `vnevado-win10s` (AAD device ID `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`) where the account `dp5hn` ran the command `curl http://vectorsandarrows.com` (process ID 6460) contacting the domain `vectorsandarrows.com` resolving to IP `198.43.121.209`. This group is known for using drive-by downloads and Cobalt Strike beacons for lateral movement and ransomware deployment.'
    question: 'A related alert shows that attack disruption automatically blocked a contained user''s attempts to create, delete, or modify files over SMB on multiple devices. What is the display name of the account that was contained and blocked in that lateral movement attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Grace Chen'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Grace Chen'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` was compromised and showed activity associated with the Manatee Tempest activity group.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The account `Grace Chen` attempted lateral movement using SMB remote file access, which was blocked on multiple devices by attack disruption.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
