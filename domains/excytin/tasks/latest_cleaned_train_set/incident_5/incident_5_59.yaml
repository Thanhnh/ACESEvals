tasks:
- task_id: incident_5_latest_cleaned_train_set_task_59
  title: incident_5_latest_cleaned_train_set_task_59
  description: 'For the alert about suspicious access to the LSASS service, which file (DLL) was identified as an entity involved in that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, ransomware behavior was detected in the file system on host `vnevado-win11t` (AAD device ID `e5799261-6720-4297-961e-bd9ca4275033`), indicating possible mass encryption of files. Around the same time on this device, related alerts were raised for possible attempts to access the Primary Refresh Token (PRT) and for suspicious access to the LSASS service, where attackers try to decrypt users'' clear-text credentials from LSASS memory for later lateral movement.'
    question: 'For the alert about suspicious access to the LSASS service, which file (DLL) was identified as an entity involved in that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'hid.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'hid.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'Ransomware behavior was detected in the file system on the host with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`, indicating possible mass encryption of files.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same host, a possible attempt to access the Primary Refresh Token (PRT) was detected involving the process `browsercore.exe`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The PRT access attempt was associated with the account named `tgs2z`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Following the credential theft attempts, suspicious access to the LSASS service was observed involving the file `hid.dll`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
