tasks:
- task_id: incident_5_latest_cleaned_train_set_task_80
  title: incident_5_latest_cleaned_train_set_task_80
  description: 'For the credential theft tool execution alert that fired seconds after the ransomware payload launch, what IP address was associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage human-operated ransomware incident, a ransomware payload was remotely launched on device `vnevado-win11t` (AAD Device ID `e5799261-6720-4297-961e-bd9ca4275033`) under the account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`). Roughly a second later, another alert fired for a known credential theft tool execution, where the process or its command line indicated an intent to dump users'' credentials, keys and plain-text passwords.'
    question: 'For the credential theft tool execution alert that fired seconds after the ransomware payload launch, what IP address was associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A ransomware payload was remotely launched on the device associated with IP address `99.83.111.100`, attempting to encrypt content and render it unusable.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker used PSExec to move laterally to the jump server Vnevado-jump using the account with SID `S-5-7-21-1843151660-3234030288-105586167-1422`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A known malicious credential theft tool was executed on the device with IP address `107.224.99.179`, indicating an intent to dump users'' credentials, keys, and plain-text passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
