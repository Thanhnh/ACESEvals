tasks:
- task_id: incident_5_latest_cleaned_train_set_task_45
  title: incident_5_latest_cleaned_train_set_task_45
  description: 'A related alert on the same device flagged possible ransomware activity based on a known malicious extension. Besides the ZIP archive noted above, another compressed archive - a 7-Zip file - was also affected. What is the full resulting file name of that encrypted 7-Zip archive?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident where potentially compromised assets on the device `vnevado-win11t` (AAD Device ID `e5799261-6720-4297-961e-bd9ca4275033`) exhibited ransomware-like behavior, files such as `characterical.zip` were observed being renamed to `characterical.zip.lockbit`, suggesting an attacker was moving laterally and mass-encrypting files across the network.'
    question: 'A related alert on the same device flagged possible ransomware activity based on a known malicious extension. Besides the ZIP archive noted above, another compressed archive - a 7-Zip file - was also affected. What is the full resulting file name of that encrypted 7-Zip archive?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ponceau.7z.lockbit'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ponceau.7z.lockbit'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` was identified as a potentially compromised asset exhibiting ransomware-like behavior, likely being used by an attacker to move laterally and infect devices across the network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using that compromised account, mass file encryption activity was observed on the device, producing files with a known ransomware extension, such as the file `ponceau.7z.lockbit`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
