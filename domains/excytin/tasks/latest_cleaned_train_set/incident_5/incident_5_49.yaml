tasks:
- task_id: incident_5_latest_cleaned_train_set_task_49
  title: incident_5_latest_cleaned_train_set_task_49
  description: 'A related alert flagged a possible attempt to access a Primary Refresh Token (PRT) at nearly the same time. What is the IP address associated with that PRT access attempt alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage attack, an alert was raised for potentially compromised assets exhibiting ransomware-like behavior across several devices. The activity, associated with the account SID `S-0-6-5`, involved encrypted files such as `kiters.7z.lockbit`, `syncretic.7z.lockbit`, and `unstreaming.xlsx.lockbit`, as well as a suspicious script named `get-userprttoken.ps1`. The attacker appears to have moved laterally, including a PSExec-based jump to the server Vnevado-jump.'
    question: 'A related alert flagged a possible attempt to access a Primary Refresh Token (PRT) at nearly the same time. What is the IP address associated with that PRT access attempt alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Potentially compromised assets exhibiting ransomware-like behavior were detected involving the IP address `99.83.111.100`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker used the account `tgs2z` to perform PSExec lateral movement to the jump server Vnevado-jump.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A possible attempt to access the Primary Refresh Token (PRT) was detected from the IP address `107.224.99.179`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
