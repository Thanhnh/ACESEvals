tasks:
- task_id: incident_5_latest_cleaned_train_set_task_3
  title: incident_5_latest_cleaned_train_set_task_3
  description: 'For the alert reporting possible ransomware activity based on a known malicious extension, what is the full name of one of the affected files (including the appended ransomware extension)?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of activity attributed to the Manatee Tempest activity group — a Russia-based cybercriminal group known for the Dridex banking trojan and for using SocGholish/FakeUpdates access from Mustard Tempest to deploy Cobalt Strike and ransomware — analysts observed a process (PID 5572, created 2024-06-20T09:32:04Z) running the command line `curl http://vectorsandarrows.com`, reaching out to the domain `vectorsandarrows.com` resolving to IP `198.43.121.209`. Shortly afterwards, on the same device, numerous file system changes were detected where files were renamed with an extension known from past ransomware incidents, suggesting mass encryption of files.'
    question: 'For the alert reporting possible ransomware activity based on a known malicious extension, what is the full name of one of the affected files (including the appended ransomware extension)?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'unstreaming.xlsx.lockbit'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'unstreaming.xlsx.lockbit'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The Manatee Tempest activity group was detected operating on the host `vnevado-win11u`, using drive-by download and loader malware to gain access and deploy Cobalt Strike beacons for lateral movement and ransomware deployment.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that host, numerous file system changes were observed consistent with mass encryption by ransomware, producing the file `unstreaming.xlsx.lockbit`, which carries the known malicious LockBit ransomware extension.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
