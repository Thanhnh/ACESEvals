tasks:
- task_id: incident_5_latest_cleaned_train_set_task_22
  title: incident_5_latest_cleaned_train_set_task_22
  description: 'For the system recovery setting tampering alert, what was the exact command line executed to disable Windows automatic recovery, and what was its process ID and creation time?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident investigation, command and control behavior was blocked on host `vnevado-win11u` (AAD Device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`), where a process with ID 5572 created at 2024-06-20T09:32:04.80 ran the command line `curl http://vectorsandarrows.com` reaching out to the URL `http://vectorsandarrows.com/`. Shortly after, another alert on the same device reported system recovery setting tampering, where adversaries attempt to disable built-in operating system recovery features to prevent recovery of a corrupted system.'
    question: 'For the system recovery setting tampering alert, what was the exact command line executed to disable Windows automatic recovery, and what was its process ID and creation time?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Command line: `bcdedit /set recoveryenabled no`, Process ID: 4312, Created Time (UTC): 2024-06-20T09:10:48.0676225Z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Command line: `bcdedit /set recoveryenabled no`, Process ID: 4312, Created Time (UTC): 2024-06-20T09:10:48.0676225Z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` was involved in blocked command and control (C2) behavior from active malware on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the C2 activity, system recovery setting tampering was observed on the device: the attacker ran the process with command line `bcdedit /set recoveryenabled no` at `2024-06-20t09:10:48.0676225z`, with Process ID `4312`, to disable Windows automatic recovery and prevent restoration of the corrupted system.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
