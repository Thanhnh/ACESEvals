tasks:
- task_id: incident_5_latest_cleaned_train_set_task_48
  title: incident_5_latest_cleaned_train_set_task_48
  description: 'Moments later, a related alert reported that all file snapshots and shadow copies were deleted via WMI or VSSAdmin. Which user account, identified by its security identifier (SID), was associated with that backup deletion activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a "Suspicious WMI process creation" alert fired on a machine, where malware often uses WMI to spawn new processes and break process trees. The observed processes included `curl http://vectorsandarrows.com` (PID 5572), `bcdedit /set recoveryenabled no` (PID 4828), `bcdedit /set bootstatuspolicy ignoreallfailures` (PID 7332), and `powershell -file c:\scripts\get-userprttoken.ps1` (PID 5708) — behavior consistent with pre-ransomware staging.'
    question: 'Moments later, a related alert reported that all file snapshots and shadow copies were deleted via WMI or VSSAdmin. Which user account, identified by its security identifier (SID), was associated with that backup deletion activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1840191660-8534830288-125585561-1522'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1840191660-8534830288-125585561-1522'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious WMI process creation was observed on the machine, performed by the account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` then deleted all file snapshots and shadow copies via WMI or VSSAdmin, behavior commonly associated with ransomware infection.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
