tasks:
- task_id: incident_5_latest_cleaned_train_set_task_50
  title: incident_5_latest_cleaned_train_set_task_50
  description: 'For the alert about the possible Primary Refresh Token access attempt, which executable was run and what was its process ID and creation time?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, ''CommandAndControl'' malware was detected on host `vnevado-win10s` (AAD Device ID `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`) during lateral movement, where a process with ID 6460 executed the command `curl http://vectorsandarrows.com` at 2024-06-20T09:10:51Z. A related alert on the same device flagged a possible attempt to access the Primary Refresh Token (PRT), a key Azure AD authentication artifact that attackers target for lateral movement or credential theft.'
    question: 'For the alert about the possible Primary Refresh Token access attempt, which executable was run and what was its process ID and creation time?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The process was `browsercore.exe` with Process ID 7036, created at 2024-06-20T09:29:49.304018Z.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The process was `browsercore.exe` with Process ID 7036, created at 2024-06-20T09:29:49.304018Z.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` was involved in a ''CommandAndControl'' malware detection on the device, indicating an attacker attempting lateral movement from another device on the network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A possible attempt to access the Primary Refresh Token (PRT) was detected through the process `browsercore.exe` with Process ID `7036`, created at `2024-06-20t09:29:49.304018z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
