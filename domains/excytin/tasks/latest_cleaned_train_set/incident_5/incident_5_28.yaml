tasks:
- task_id: incident_5_latest_cleaned_train_set_task_28
  title: incident_5_latest_cleaned_train_set_task_28
  description: 'For the alert about deleted file backups on that same host, what was the command line executed and its process ID?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident investigation, a Command and Control behavior was blocked on an affected machine after a process (Process ID 1332, created 2024-06-20T09:10:52.7298237Z) executed the command `curl http://vectorsandarrows.com` reaching out to the URL `http://vectorsandarrows.com/`. Moments earlier, on the same device, another alert fired indicating that all file snapshots and shadow copies had been deleted via WMI or VSSAdmin, activity commonly associated with ransomware or wiper infections.'
    question: 'For the alert about deleted file backups on that same host, what was the command line executed and its process ID?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Command line: `vssblatemp.exe delete shadows /all`, Process ID: 7236 (created 2024-06-20T09:10:51.2193152Z)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Command line: `vssblatemp.exe delete shadows /all`, Process ID: 7236 (created 2024-06-20T09:10:51.2193152Z)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Command and control behavior was detected and blocked on the host with AadDeviceId `9d4887ba-0b69-47d6-89bc-9b32787f379e`, indicating an active malware infection communicating with a remote attacker.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that compromised host, the attacker deleted all file backups (shadow copies), a common ransomware precursor, by running the process with command line `vssblatemp.exe delete shadows /all` at `2024-06-20t09:10:51.2193152z` with Process ID `7236`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
