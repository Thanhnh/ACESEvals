tasks:
- task_id: incident_5_latest_cleaned_train_set_task_15
  title: incident_5_latest_cleaned_train_set_task_15
  description: 'For the alert where ''CommandAndControl'' malware was detected during lateral movement, which user account name was associated with that detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a known credential theft tool execution was detected: the process `mimikatz.exe` (PID 6600) was run with the command line `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:..\notepad.exe \\vnevado-jump cmd.exe"`, spawning `notepad.exe`, `cmd.exe` and `conhost.exe`. This activity chained into lateral movement via PSExec to the jump server and suspicious remote activity, and eventually a related alert reported that ''CommandAndControl'' malware was detected on a device during lateral movement.'
    question: 'For the alert where ''CommandAndControl'' malware was detected during lateral movement, which user account name was associated with that detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dp5hn'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed on the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, dumping users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker performed lateral movement via PSExec to the jump server from the IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Suspicious remote activity was then observed, initiated by the account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Finally, ''CommandAndControl'' malware was detected during the lateral movement, associated with the account named `dp5hn`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
