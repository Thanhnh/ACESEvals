tasks:
- task_id: incident_5_latest_cleaned_train_set_task_38
  title: incident_5_latest_cleaned_train_set_task_38
  description: 'Shortly after this tampering, a ransomware payload was remotely launched on the same device. What is the remote IP address associated with that ransomware payload launch alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident on the device `vnevado-win10r` (AAD device ID `9d4887ba-0b69-47d6-89bc-9b32787f379e`), system recovery setting tampering was observed. The process `vssblatemp.exe` (PID 7236) was run with the command line `vssblatemp.exe delete shadows /all` and `bcdedit /set recoveryenabled no` was executed (PID 4312), indicating an attempt to delete volume shadow copies and turn off recovery services before a destructive action.'
    question: 'Shortly after this tampering, a ransomware payload was remotely launched on the same device. What is the remote IP address associated with that ransomware payload launch alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '99.83.111.100'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '99.83.111.100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` performed system recovery setting tampering on the device, attempting to delete backups and disable recovery services to prevent system restoration.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the tampering, a ransomware payload was remotely launched on the device from the remote IP address `99.83.111.100`, indicating the attacker was encrypting content on the device from that source.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
