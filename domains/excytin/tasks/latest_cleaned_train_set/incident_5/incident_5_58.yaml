tasks:
- task_id: incident_5_latest_cleaned_train_set_task_58
  title: incident_5_latest_cleaned_train_set_task_58
  description: 'In the related Manatee Tempest activity group alert, what is the IP address associated with the observed malicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, system recovery setting tampering was observed on host `vnevado-win11t` (AAD device ID e5799261-6720-4297-961e-bd9ca4275033). Processes such as `vssblatemp.exe delete shadows /all` (PID 1900) and `bcdedit /set recoveryenabled no` (PID 3464) were executed, suggesting adversaries were attempting to delete volume shadow copies and disable recovery services ahead of a possible ransomware deployment. A closely related alert on the same device attributes this activity to the Manatee Tempest activity group, a Russia-based cybercriminal group known for using BLISTER loader and Cobalt Strike beacons for lateral movement and ransomware deployment.'
    question: 'In the related Manatee Tempest activity group alert, what is the IP address associated with the observed malicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` was observed tampering with system recovery settings on the device, attempting to delete volume shadow copies, the backup catalog, and disable automatic Windows recovery features to prevent system restoration.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'This destructive activity was attributed to the Manatee Tempest activity group, which was observed communicating with the command-and-control IP address `198.43.121.209`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
