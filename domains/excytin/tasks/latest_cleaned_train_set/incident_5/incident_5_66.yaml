tasks:
- task_id: incident_5_latest_cleaned_train_set_task_66
  title: incident_5_latest_cleaned_train_set_task_66
  description: 'For the alert reporting the deletion of file backups, what was the process ID, creation time, and full command line of the process that deleted the shadow copies?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a human-operated ransomware incident, a ransomware payload was remotely launched on a device associated with the IP address `99.83.111.100`. Shortly before this, a related alert fired indicating that all file snapshots and shadow copies had been deleted via WMI or VSSAdmin, a technique commonly seen during ransomware infections.'
    question: 'For the alert reporting the deletion of file backups, what was the process ID, creation time, and full command line of the process that deleted the shadow copies?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 1900, Created Time (UTC): 2024-06-20T09:29:40.8785892Z, Command line: `vssblatemp.exe delete shadows /all`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 1900, Created Time (UTC): 2024-06-20T09:29:40.8785892Z, Command line: `vssblatemp.exe delete shadows /all`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A ransomware payload was remotely launched on the device with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that device, the ransomware deleted all file backups by launching the process `vssblatemp.exe delete shadows /all` with Process ID `1900` at `2024-06-20t09:29:40.8785892z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
