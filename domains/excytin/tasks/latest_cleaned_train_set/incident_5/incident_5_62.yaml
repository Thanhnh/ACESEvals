tasks:
- task_id: incident_5_latest_cleaned_train_set_task_62
  title: incident_5_latest_cleaned_train_set_task_62
  description: 'For the earlier alert about the malicious credential theft tool execution, what IP address was recorded as an entity in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an attempt by the contained user `Grace Chen` (dp5hn@vnevado.alpineskihouse.co, SID S-1-5-21-1840191660-8534830288-125585561-1522) to create, delete, or modify files over SMB from host `vnevado-win11t` was automatically blocked by attack disruption, indicating possible lateral movement. This activity chains through a PSExec lateral movement to the jump server and links back to an earlier alert where a known credential theft tool command line was detected, indicating an intent to dump users'' credentials, keys, and plain-text passwords.'
    question: 'For the earlier alert about the malicious credential theft tool execution, what IP address was recorded as an entity in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Attack disruption blocked a contained user''s lateral movement attempts using SMB remote file access on multiple devices, originating from IP address `99.83.111.100`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker then used PSExec to move laterally to the jump server Vnevado-jump, using the account with SID `S-5-7-21-1843151660-3234030288-105586167-1422`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A known malicious credential theft tool was executed to dump users'' credentials, keys, and plain-text passwords, associated with the IP address `107.224.99.179`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
