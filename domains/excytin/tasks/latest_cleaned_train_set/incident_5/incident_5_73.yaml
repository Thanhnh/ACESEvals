tasks:
- task_id: incident_5_latest_cleaned_train_set_task_73
  title: incident_5_latest_cleaned_train_set_task_73
  description: 'In the related Manatee Tempest activity group alert, which URL/domain was flagged as part of the attacker''s activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, ''CommandAndControl'' malware was detected on the device `vnevado-win11u` (AAD Device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`), suggesting an attacker might be attempting to move laterally to this device from another device on the network. A closely related alert, raised about the same time, attributed the activity to the Manatee Tempest activity group, a Russia-based cybercriminal group known for using drive-by downloads and FakeUpdates/SocGholish infections for initial access, followed by BLISTER loader and Cobalt Strike beacons.'
    question: 'In the related Manatee Tempest activity group alert, which URL/domain was flagged as part of the attacker''s activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vectorsandarrows.com'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vectorsandarrows.com'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: '''CommandAndControl'' malware was detected during lateral movement on a device associated with the user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same activity was attributed to the Manatee Tempest activity group, which used the malicious URL `vectorsandarrows.com` for command-and-control communication.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
