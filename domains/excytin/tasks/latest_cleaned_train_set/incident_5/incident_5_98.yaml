tasks:
- task_id: incident_5_latest_cleaned_train_set_task_98
  title: incident_5_latest_cleaned_train_set_task_98
  description: 'In the related ''Suspicious remote activity'' alert, a command was executed to tamper with the system''s recovery options. What was the full command line, its process ID, and creation time?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware-related incident, potentially compromised assets exhibited ransomware-like behavior on host `vnevado-win11t` (AAD device ID `e5799261-6720-4297-961e-bd9ca4275033`), where files such as `get-userprttoken.ps1` and `characterical.zip` were observed, with the latter later appearing as `characterical.zip.lockbit`. A related alert on the same machine flagged suspicious activity that was initiated remotely, which can include interactive sessions, file modifications, WMI commands, or scheduled tasks executed from a remote machine.'
    question: 'In the related ''Suspicious remote activity'' alert, a command was executed to tamper with the system''s recovery options. What was the full command line, its process ID, and creation time?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Command line: `bcdedit /set recoveryenabled no`, Process ID: 8136, Created Time (UTC): 2024-06-20T09:10:48.0438707Z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Command line: `bcdedit /set recoveryenabled no`, Process ID: 8136, Created Time (UTC): 2024-06-20T09:10:48.0438707Z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A potentially compromised account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` exhibited ransomware-like behavior, impacting several devices, likely being used by an attacker to move laterally across the network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious remote activity was then observed on the affected machine, where the attacker remotely executed the process `bcdedit /set recoveryenabled no` with Process ID `8136` at `2024-06-20t09:10:48.0438707z` to disable Windows recovery, a typical ransomware pre-encryption step.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
