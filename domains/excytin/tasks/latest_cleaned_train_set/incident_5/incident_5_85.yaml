tasks:
- task_id: incident_5_latest_cleaned_train_set_task_85
  title: incident_5_latest_cleaned_train_set_task_85
  description: 'In the related ransomware activity alert, what is the name of the file involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a Command and Control behavior alert was blocked on a device where a process (Process ID 88, created 2024-06-20T09:29:42.39Z) executed the command line `curl http://vectorsandarrows.com`, contacting the URL `http://vectorsandarrows.com/`. This activity was linked, through the same user account SID, to a subsequent alert reporting possible ransomware activity based on a known malicious file extension, where numerous file system changes suggested mass encryption of files.'
    question: 'In the related ransomware activity alert, what is the name of the file involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'characterical.zip'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` exhibited command and control behavior that was blocked, indicating an active malware infection on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the malware activity, numerous file system changes were observed on the device, including the file `characterical.zip` with a known malicious ransomware extension, indicating possible mass encryption of files by ransomware.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
