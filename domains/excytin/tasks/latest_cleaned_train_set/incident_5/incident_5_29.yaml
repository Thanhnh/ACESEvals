tasks:
- task_id: incident_5_latest_cleaned_train_set_task_29
  title: incident_5_latest_cleaned_train_set_task_29
  description: 'Immediately before this PRT access activity, a closely related alert flagged suspicious access to the LSASS service on the same device. What is the name of the file (library) reported as an entity in that LSASS-related alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Possible attempt to access Primary Refresh Token (PRT)'' alert was raised on host `vnevado-win10s` (AAD Device ID `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`) for account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`, AAD User ID `731adb71-b11c-4bbf-850b-57989b350e96`). The activity involved the process `browsercore.exe` (Process ID 2676, created 2024-06-20T09:10:59.867384Z). A PRT is a key Azure AD authentication artifact, and attackers may try to access it for lateral movement or credential theft.'
    question: 'Immediately before this PRT access activity, a closely related alert flagged suspicious access to the LSASS service on the same device. What is the name of the file (library) reported as an entity in that LSASS-related alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samlib.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samlib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A process `browsercore.exe` was used in a possible attempt to access the Primary Refresh Token (PRT).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` was involved in the possible attempt to access the Primary Refresh Token (PRT).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Suspicious access to the LSASS service was detected involving the file `samlib.dll`, indicating credential theft attempts.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
