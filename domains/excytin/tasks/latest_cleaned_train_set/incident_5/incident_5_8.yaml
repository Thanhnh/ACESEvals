tasks:
- task_id: incident_5_latest_cleaned_train_set_task_8
  title: incident_5_latest_cleaned_train_set_task_8
  description: 'For the alert where Command and Control behavior was blocked, what is the Microsoft Entra (AAD) device ID of the affected host?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware incident, suspicious file system changes indicative of mass file encryption were detected on the host `vnevado-win11t` (AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`). Further investigation showed a possibly compromised user account dropping ransomware-related files on several devices, and on one of those other devices a Command and Control behavior was blocked.'
    question: 'For the alert where Command and Control behavior was blocked, what is the Microsoft Entra (AAD) device ID of the affected host?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'f5b847aa-8712-4bf6-b4f7-ed6cd89e1505'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'f5b847aa-8712-4bf6-b4f7-ed6cd89e1505'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Ransomware behavior was detected in the file system on host `vnevado-win11t`, indicating possible mass encryption of files.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A possibly compromised user account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` was observed dropping ransomware-related files on several devices to move laterally across the network.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Command and Control behavior was blocked on the device with AadDeviceId `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`, showing the active malware was communicating with remote attackers.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
