tasks:
- task_id: incident_5_latest_cleaned_train_set_task_63
  title: incident_5_latest_cleaned_train_set_task_63
  description: 'For that earlier related credential theft tool execution alert, what was the process ID of the mimikatz.exe process and what NTLM hash value was supplied in its command line?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a malicious credential theft tool execution was detected: the process `mimikatz.exe` (Process ID 4464, created at 2024-06-20T09:03:04.6442161Z) was run with the command line `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm: /domain:vnevado.alpineskihouse.co /run:..\notepad.exe //vnevado-jumpv cmd.exe"`, indicating an intent to perform a pass-the-hash attack. This execution was linked, via a shared user account SID, to another credential theft tool execution alert raised about two minutes earlier at 2024-07-04 22:35:02 UTC.'
    question: 'For that earlier related credential theft tool execution alert, what was the process ID of the mimikatz.exe process and what NTLM hash value was supplied in its command line?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 6600 (created 2024-06-20T09:05:15.5627318Z), NTLM hash: 96def1a633fc6790124d5f8fe21cc72b'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 6600 (created 2024-06-20T09:05:15.5627318Z), NTLM hash: 96def1a633fc6790124d5f8fe21cc72b'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` was detected executing a known credential theft tool at `2024-07-04 22:35:03.869406+00:00`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'This account launched the credential theft tool process with Process ID `6600` at `2024-06-20t09:05:15.5627318z`, using the command line `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:..\notepad.exe \\vnevado-jump cmd.exe"`, indicating an attempt to dump credentials and perform a pass-the-hash attack.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
