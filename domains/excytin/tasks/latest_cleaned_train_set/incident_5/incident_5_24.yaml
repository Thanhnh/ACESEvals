tasks:
- task_id: incident_5_latest_cleaned_train_set_task_24
  title: incident_5_latest_cleaned_train_set_task_24
  description: 'In the related ''Active unknown malware was detected'' alert at the end of this attack chain, what is the name of the malicious file that was identified?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Command and Control behavior was blocked'' alert was raised after activity to the URL `http://vectorsandarrows.com/` was observed. Malware is considered active if it is found running on the machine or it already has persistence mechanisms in place, so precautionary measures should be taken to check for residual signs of infection. Following the chain of related alerts, this activity is linked to a compromised user account dropping ransomware-related files, lateral movement via PSExec to the jump server, and finally to an ''Active unknown malware was detected'' alert.'
    question: 'In the related ''Active unknown malware was detected'' alert at the end of this attack chain, what is the name of the malicious file that was identified?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` exhibited command and control behavior, which was blocked, indicating the account was likely compromised by active malware.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account was observed communicating from IP address `99.83.111.100` while dropping ransomware-related files on several devices, suggesting the attacker used it to move laterally across the network.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'From there, the attacker performed lateral movement using PSExec from the host with HostName `vnevado-win10v` to the jump server.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'On that host, active unknown malware was detected as the file with Name `mimikatz.exe`, a credential-dumping tool used to harvest credentials for further compromise.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
