tasks:
- task_id: incident_5_latest_cleaned_train_set_task_99
  title: incident_5_latest_cleaned_train_set_task_99
  description: 'Around the same time, a related alert flagged activity attributed to the Manatee Tempest activity group, a Russia-based cybercriminal group known for Cobalt Strike and ransomware deployment. What IP address was identified as an entity in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "File backups were deleted" was raised on host `vnevado-win11t` (AAD Device ID `e5799261-6720-4297-961e-bd9ca4275033`), where the process `vssblatemp.exe` (PID 1900, created 2024-06-20T09:29:40.8785892Z) was executed with the command line `vssblatemp.exe delete shadows /all`, deleting all file snapshots and shadow copies — behavior commonly seen during ransomware infections.'
    question: 'Around the same time, a related alert flagged activity attributed to the Manatee Tempest activity group, a Russia-based cybercriminal group known for Cobalt Strike and ransomware deployment. What IP address was identified as an entity in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` deleted all file snapshots and shadow copies via WMI or VSSAdmin, a common ransomware behavior indicating file backups were destroyed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Activity associated with the Manatee Tempest activity group was observed communicating with the IP address `198.43.121.209`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
