  initial_context:
    incident_context: 'During this incident, a ''Command and Control behavior was blocked'' alert fired on host `vnevado-win10r` (AAD device ID `9d4887ba-0b69-47d6-89bc-9b32787f379e`), where a process with ID 1332 executed the command line `curl http://vectorsandarrows.com` at 2024-06-20T09:10:52Z. Shortly before this, related alerts flagged suspicious remote activity on another machine and a ''Possible lateral movement'' alert indicating an attacker may be moving across devices to gather data or elevate privileges.'
    question: 'For the ''Possible lateral movement'' alert that was triggered based on a Microsoft Defender for Endpoint detection, what IP address was involved in the suspicious network event?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '83.162.58.168'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '83.162.58.168'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A Command and Control behavior was blocked for the account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious remote activity was observed on the host `vnevado-win11t`, indicating attempts to initiate sessions or commands from a remote machine.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Possible lateral movement was detected in close time proximity to a suspicious network event involving the IP address `83.162.58.168`.'
