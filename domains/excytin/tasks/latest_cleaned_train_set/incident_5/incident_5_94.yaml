tasks:
- task_id: incident_5_latest_cleaned_train_set_task_94
  title: incident_5_latest_cleaned_train_set_task_94
  description: 'Closely related to this activity, another alert fired indicating that a Windows Sysinternals tool was renamed and then launched, likely to covertly use the tool for malicious purposes. What is the IP address associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Possible compromised user account delivering ransomware-related files" was raised: the user account `dp5hn` (AAD user ID `731adb71-b11c-4bbf-850b-57989b350e96`) was observed dropping ransomware-related files such as `syncretic.7z.lockbit`, `kiters.7z.lockbit` and `ponceau.7z.lockbit`, along with a script named `get-userprttoken.ps1`, on devices including the one with AAD device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`. The attacker appears to have used this account to move laterally across the network, including PsExec activity to the jump server Vnevado-jump.'
    question: 'Closely related to this activity, another alert fired indicating that a Windows Sysinternals tool was renamed and then launched, likely to covertly use the tool for malicious purposes. What is the IP address associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account was observed delivering ransomware-related files across several devices, associated with the source IP address `99.83.111.100`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account with Name `tgs2z` was then used to run PSExec for lateral movement to the jump server `Vnevado-jump`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that host, a Windows Sysinternals tool was renamed and launched to covertly perform malicious actions, with the activity tied to the IP address `107.224.99.179`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
