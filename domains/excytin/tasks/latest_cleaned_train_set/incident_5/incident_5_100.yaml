tasks:
- task_id: incident_5_latest_cleaned_train_set_task_100
  title: incident_5_latest_cleaned_train_set_task_100
  description: 'For the alert about the malicious credential theft tool execution, what is the IP address associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware-related incident, a possibly compromised user account `dp5hn` (SID S-1-5-21-1840191660-8534830288-125585561-1522) was observed dropping ransomware-related files such as `ponceau.7z.lockbit`, `kiters.7z.lockbit`, `earlap.doc.lockbit` and `syncretic.7z.lockbit` on several devices. The attack chain also included lateral movement via PSExec to the Vnevado-jump server, and a related alert where a known credential theft tool command line was detected attempting to dump users'' credentials, keys and plain-text passwords.'
    question: 'For the alert about the malicious credential theft tool execution, what is the IP address associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account was observed dropping ransomware-related files on several devices, with activity originating from IP address `99.83.111.100`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the compromised credentials, the attacker performed lateral movement via PSExec to the jump server `Vnevado-jump` with the account named `tgs2z`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that host, a known malicious credential theft tool was executed to dump users'' credentials, keys, and plain-text passwords, associated with IP address `107.224.99.179`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
