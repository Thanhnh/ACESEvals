tasks:
- task_id: incident_5_latest_cleaned_train_set_task_19
  title: incident_5_latest_cleaned_train_set_task_19
  description: 'For the related alert about the remotely launched ransomware payload, what is the IP address recorded as an entity in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident investigation, a ''CommandAndControl'' malware detection was raised on the device `vnevado-win10s` (AAD Device ID `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`), suggesting an attacker may have moved laterally to this device from another machine on the network. The alert included a suspicious process (Process ID 6460, created 2024-06-20T09:10:51.78Z) running the command line `curl http://vectorsandarrows.com`. Moments later, a related alert reported that a ransomware payload was remotely launched, indicating attackers may be attempting to encrypt content on the device.'
    question: 'For the related alert about the remotely launched ransomware payload, what is the IP address recorded as an entity in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '99.83.111.100'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '99.83.111.100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` was involved in ''CommandAndControl'' malware activity detected during lateral movement to this device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using that compromised access, a ransomware payload was remotely launched on the device from the remote IP address `99.83.111.100`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
