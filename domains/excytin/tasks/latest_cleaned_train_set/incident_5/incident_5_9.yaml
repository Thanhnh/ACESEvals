tasks:
- task_id: incident_5_latest_cleaned_train_set_task_9
  title: incident_5_latest_cleaned_train_set_task_9
  description: 'A closely related alert in this same incident reported potentially compromised assets exhibiting ransomware-like behavior. What is the name of the file identified in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a Suspicious WMI process creation alert fired on host `vnevado-win10r` (AAD device ID `9d4887ba-0b69-47d6-89bc-9b32787f379e`). The observed process activity included `bcdedit /set recoveryenabled no` (PID 4312), `bcdedit /set bootstatuspolicy ignoreallfailures` (PID 7092), `vssblatemp.exe delete shadows /all` (PID 7236), `curl http://vectorsandarrows.com` (PID 1332), and `powershell -file c:\scripts\get-userprttoken.ps1` (PID 2820), all around 2024-06-20 09:10 UTC.'
    question: 'A closely related alert in this same incident reported potentially compromised assets exhibiting ransomware-like behavior. What is the name of the file identified in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'earlap.doc'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'earlap.doc'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious WMI process creation was observed, initiated by the account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account was involved in ransomware-like behavior across multiple assets, associated with the file `earlap.doc`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
