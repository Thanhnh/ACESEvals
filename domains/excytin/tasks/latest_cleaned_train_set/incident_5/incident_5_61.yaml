tasks:
- task_id: incident_5_latest_cleaned_train_set_task_61
  title: incident_5_latest_cleaned_train_set_task_61
  description: 'For the alert reporting the Mimikatz credential theft tool, what is the name of the file that was detected?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a Manatee Tempest activity group incident, analysts observed suspicious traffic to the domain `vectorsandarrows.com` associated with IP address `198.43.121.209`. Following the trail, the compromised account was used for suspicious remote activity and lateral movement via PSExec to the jump server, and a related alert flagged the presence of the Mimikatz credential theft tool on one of the affected devices.'
    question: 'For the alert reporting the Mimikatz credential theft tool, what is the name of the file that was detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilib.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` was compromised as part of the Manatee Tempest activity group campaign.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious remote activity was initiated from the IP address `99.83.111.100` against the compromised device.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker used PSExec to move laterally to the jump server from the host `vnevado-win10v`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'On that host, the Mimikatz credential theft tool was detected through the file `mimilib.dll`, indicating an attempt to harvest credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
