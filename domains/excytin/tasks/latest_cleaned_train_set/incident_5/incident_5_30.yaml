tasks:
- task_id: incident_5_latest_cleaned_train_set_task_30
  title: incident_5_latest_cleaned_train_set_task_30
  description: 'A related alert on this same device reported detection of the Mimikatz credential theft hacktool (associated with actor Storm-0875). What is the name of the malicious library file flagged by that Mimikatz detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a "Suspicious remote activity" alert was raised on host `vnevado-win11t` (Azure AD device ID `e5799261-6720-4297-961e-bd9ca4275033`) for the account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`). The observed activity included ransomware-style preparation commands such as `bcdedit /set recoveryenabled no`, `bcdedit /set bootstatuspolicy ignoreallfailures`, `vssblatemp.exe delete shadows /all`, a `curl http://vectorsandarrows.com` request, and execution of the script `get-userprttoken.ps1`. This activity was followed by lateral movement via PsExec to the jump server.'
    question: 'A related alert on this same device reported detection of the Mimikatz credential theft hacktool (associated with actor Storm-0875). What is the name of the malicious library file flagged by that Mimikatz detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilib.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was initiated from the remote IP address `99.83.111.100` against the machine.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker used PSExec to move laterally to the jump server, the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that device, the Mimikatz credential theft tool was detected through the file `mimilib.dll`, indicating an attempt to harvest credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
