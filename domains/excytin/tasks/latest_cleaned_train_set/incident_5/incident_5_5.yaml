tasks:
- task_id: incident_5_latest_cleaned_train_set_task_5
  title: incident_5_latest_cleaned_train_set_task_5
  description: 'Following this lateral movement activity, a ransomware payload was remotely launched and ransomware behavior was subsequently detected in the file system on a device. What is the host name of the device where the ransomware file system behavior was detected?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing multi-stage incident, an alert titled ''Lateral movement using SMB remote file access blocked on multiple devices'' was raised at 2024-07-10. A contained user account, Grace Chen (`dp5hn@vnevado.alpineskihouse.co`), attempted to create, delete, or modify files over the SMB protocol from the device `vnevado-win11t` (AAD device ID `e5799261-6720-4297-961e-bd9ca4275033`), and the activity was automatically blocked by attack disruption.'
    question: 'Following this lateral movement activity, a ransomware payload was remotely launched and ransomware behavior was subsequently detected in the file system on a device. What is the host name of the device where the ransomware file system behavior was detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11u'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win11u'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Attack disruption blocked a contained user''s attempt to create, delete, or modify files over SMB from the IP address `99.83.111.100`, indicating lateral movement attempts across multiple devices.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A ransomware payload was remotely launched on the device with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Ransomware behavior, such as mass encryption of files, was then detected in the file system on the host `vnevado-win11u`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
