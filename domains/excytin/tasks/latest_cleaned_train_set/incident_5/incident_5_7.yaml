tasks:
- task_id: incident_5_latest_cleaned_train_set_task_7
  title: incident_5_latest_cleaned_train_set_task_7
  description: 'A nearly simultaneous alert of the same type was triggered by the same compromised account on another device, involving a different archive file that was dropped. What is the name of that archive file?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident investigation, an alert titled ''Possible compromised user account delivering ransomware-related files'' was raised on the host `vnevado-win11t` (AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`), where the files `characterical.zip` and `characterical.zip.lockbit` were observed being dropped. This suggests an attacker compromised a user account to move laterally across the network and infect as many devices with ransomware as possible.'
    question: 'A nearly simultaneous alert of the same type was triggered by the same compromised account on another device, involving a different archive file that was dropped. What is the name of that archive file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ponceau.7z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ponceau.7z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account was observed dropping a ransomware-related file named `get-userprttoken.ps1` on several devices, indicating lateral movement across the network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user account also delivered another ransomware-related file named `ponceau.7z` to devices in the network.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
