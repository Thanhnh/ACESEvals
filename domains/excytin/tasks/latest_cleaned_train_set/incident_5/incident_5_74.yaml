tasks:
- task_id: incident_5_latest_cleaned_train_set_task_74
  title: incident_5_latest_cleaned_train_set_task_74
  description: 'Can you identify the Microsoft Entra (Azure AD) device ID of the host where the ransomware behavior in the file system was detected?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, ''CommandAndControl'' malware was detected on a device during lateral movement, involving the account `dp5hn` (SID: S-1-5-21-1840191660-8534830288-125585561-1522, AAD User ID: 731adb71-b11c-4bbf-850b-57989b350e96) and a suspicious process running the command line `curl http://vectorsandarrows.com` (Process ID 88, created at 2024-06-20T09:29:42Z). Around the same time, another alert flagged suspicious file system changes indicating possible ransomware activity with mass encryption of files.'
    question: 'Can you identify the Microsoft Entra (Azure AD) device ID of the host where the ransomware behavior in the file system was detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e5799261-6720-4297-961e-bd9ca4275033'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'e5799261-6720-4297-961e-bd9ca4275033'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: '''CommandAndControl'' malware was detected during lateral movement on the device with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`, indicating an attacker might be moving laterally to this device from another device on the network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On the same device, with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`, ransomware behavior was detected in the file system, with suspicious file system changes indicating possible mass encryption of files.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
