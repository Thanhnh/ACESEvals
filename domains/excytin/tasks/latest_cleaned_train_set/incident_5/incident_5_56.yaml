tasks:
- task_id: incident_5_latest_cleaned_train_set_task_56
  title: incident_5_latest_cleaned_train_set_task_56
  description: 'Related to this incident, an alert was raised for ransomware behavior detected in the file system, indicating possible mass encryption of files. On which machine (host name) was this ransomware behavior observed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, command and control behavior was blocked on host `vnevado-win10s` (AAD device ID `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`), where a process with ID 6460 ran the command line `curl http://vectorsandarrows.com` at 2024-06-20T09:10:51.78Z. The same compromised user account was subsequently linked to suspicious WMI process creation and further malicious activity elsewhere in the environment.'
    question: 'Related to this incident, an alert was raised for ransomware behavior detected in the file system, indicating possible mass encryption of files. On which machine (host name) was this ransomware behavior observed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11t'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win11t'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Command and control behavior was blocked for the user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious WMI process creation was observed on the device with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`, indicating malware spawning new processes to further infect the machine.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Ransomware behavior, indicative of mass file encryption, was detected in the file system of the host `vnevado-win11t`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
