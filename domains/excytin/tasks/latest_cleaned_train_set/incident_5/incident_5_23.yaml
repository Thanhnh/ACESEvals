tasks:
- task_id: incident_5_latest_cleaned_train_set_task_23
  title: incident_5_latest_cleaned_train_set_task_23
  description: 'A closely related alert flagged potentially compromised assets exhibiting ransomware-like behavior across several devices. What is the name of the file involved in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware-related security incident, an alert was raised showing that all file snapshots and shadow copies were deleted on host `vnevado-win11t` (AAD device ID `e5799261-6720-4297-961e-bd9ca4275033`). The process `vssblatemp.exe` (Process ID 1900, created 2024-06-20T09:29:40.8785892Z) was executed with the command line `vssblatemp.exe delete shadows /all`, behavior commonly seen during ransomware infections.'
    question: 'A closely related alert flagged potentially compromised assets exhibiting ransomware-like behavior across several devices. What is the name of the file involved in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'kiters.7z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'kiters.7z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` deleted all file backups (shadow copies/snapshots) via WMI or VSSAdmin, a behavior common during ransomware infection.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the backup deletion, the potentially compromised assets exhibited ransomware-like behavior across several devices, involving the file named `kiters.7z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
