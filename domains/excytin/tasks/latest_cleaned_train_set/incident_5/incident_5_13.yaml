tasks:
- task_id: incident_5_latest_cleaned_train_set_task_13
  title: incident_5_latest_cleaned_train_set_task_13
  description: 'For the related alert reporting ransomware behavior detected in the file system, what is the Microsoft Entra (AAD) device ID of the affected host?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a malicious credential theft tool execution was detected: the process `mimikatz.exe` (Process ID 6600, created 2024-06-20T09:05:15.56Z) ran the command line `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:..\notepad.exe \\vnevado-jump cmd.exe"`, spawning `notepad.exe` and `cmd.exe` in a pass-the-hash attempt. This activity was followed by lateral movement via PSExec to the jump server and, ultimately, alerts about assets exhibiting ransomware-like behavior.'
    question: 'For the related alert reporting ransomware behavior detected in the file system, what is the Microsoft Entra (AAD) device ID of the affected host?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bc00e484-d0e5-4da4-9472-95568cccc07e'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bc00e484-d0e5-4da4-9472-95568cccc07e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed under the user account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`, dumping credentials and passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker performed lateral movement via PSExec to the jump server from IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The compromised assets, including host `vnevado-win11u`, began exhibiting ransomware-like behavior while spreading across the network.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Ransomware behavior was detected in the file system, with mass encryption of files on the device with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
