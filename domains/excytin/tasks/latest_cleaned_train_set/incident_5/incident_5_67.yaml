tasks:
- task_id: incident_5_latest_cleaned_train_set_task_67
  title: incident_5_latest_cleaned_train_set_task_67
  description: 'This chain of activity is linked, through a lateral movement alert involving PSExec to the jump server, to another alert reporting that a Windows Sysinternals tool was renamed and then launched. What IP address is associated with that renamed Sysinternals tool alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on host `vnevado-win10r` (AAD Device ID `9d4887ba-0b69-47d6-89bc-9b32787f379e`), an alert for ''Suspicious remote activity'' was raised, flagging activity initiated remotely against this machine. The associated process activity included `vssblatemp.exe delete shadows /all` (PID 7236), `bcdedit /set recoveryenabled no` (PID 4312), `bcdedit /set bootstatuspolicy ignoreallfailures` (PID 7092), `curl http://vectorsandarrows.com` (PID 1332), and `powershell -file c:\scripts\get-userprttoken.ps1` (PID 2820), executed under the account SID `S-1-5-21-1840191660-8534830288-125585561-1522`.'
    question: 'This chain of activity is linked, through a lateral movement alert involving PSExec to the jump server, to another alert reporting that a Windows Sysinternals tool was renamed and then launched. What IP address is associated with that renamed Sysinternals tool alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was initiated against the machine from the remote IP address `99.83.111.100`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker then used PSExec to move laterally to the jump server Vnevado-jump using the account with SID `S-5-7-21-1843151660-3234030288-105586167-1422`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A renamed Windows Sysinternals tool was launched on the machine, with the associated remote IP address `107.224.99.179`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
