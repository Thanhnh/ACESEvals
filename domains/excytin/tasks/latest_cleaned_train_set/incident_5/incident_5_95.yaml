tasks:
- task_id: incident_5_latest_cleaned_train_set_task_95
  title: incident_5_latest_cleaned_train_set_task_95
  description: 'For the alert attributing this activity to the Manatee Tempest activity group, what IP address was identified as an associated entity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage intrusion, an alert for ''Suspicious access to LSASS service'' was raised after mimikatz.exe was run on an endpoint (e.g., `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit` with PID 3932, and pass-the-hash commands targeting user fk8mq in domain vnevado.alpineskihouse.co spawning notepad.exe and cmd.exe against vnevado-jump). The activity involved lsass.exe and modules such as samlib.dll, winscard.dll, and cryptdll.dll. The stolen credentials were then used for PSExec lateral movement to the jump server and SMB remote file access attempts that were blocked by attack disruption. These activities were ultimately attributed to the Manatee Tempest activity group.'
    question: 'For the alert attributing this activity to the Manatee Tempest activity group, what IP address was identified as an associated entity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `tgs2z` was used to suspiciously access the LSASS service memory in an attempt to dump clear-text credentials.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker performed lateral movement with PSExec to the jump server at IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The contained user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` attempted lateral movement using SMB remote file access, which was blocked on multiple devices by attack disruption.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The activity was attributed to the Manatee Tempest activity group, which communicated with the command-and-control IP address `198.43.121.209`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
