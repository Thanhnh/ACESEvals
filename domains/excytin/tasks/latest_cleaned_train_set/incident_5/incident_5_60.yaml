tasks:
- task_id: incident_5_latest_cleaned_train_set_task_60
  title: incident_5_latest_cleaned_train_set_task_60
  description: 'Around the same time on this same device, a credential theft hacktool was detected. What is the name of the malicious file associated with that hacktool detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a possible attempt to access a Primary Refresh Token (PRT) was detected on host `vnevado-win10s` (AAD device ID `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`) involving account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`). The activity was tied to process ID 2676 running `"browsercore.exe"`, created at 2024-06-20T09:10:59.867384Z. A PRT is a key artifact of Azure AD authentication that attackers may try to steal to move laterally or perform credential theft.'
    question: 'Around the same time on this same device, a credential theft hacktool was detected. What is the name of the malicious file associated with that hacktool detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilib.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A process `browsercore.exe` was used in a possible attempt to access the Primary Refresh Token (PRT) on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The PRT access attempt occurred on the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that same device, the Mimikatz credential theft tool was detected through the file `mimilib.dll`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
