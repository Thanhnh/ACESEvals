tasks:
- task_id: incident_5_latest_cleaned_train_set_task_77
  title: incident_5_latest_cleaned_train_set_task_77
  description: 'In the related Mimikatz credential theft tool detection, what is the name of the file associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, system recovery setting tampering was observed on host `vnevado-win10s` (AAD device ID f5b847aa-8712-4bf6-b4f7-ed6cd89e1505), where the account `dp5hn` (SID S-1-5-21-1840191660-8534830288-125585561-1522) ran `vssblatemp.exe delete shadows /all` (PID 5512) and `bcdedit /set recoveryenabled no` (PID 8136). This activity is linked through suspicious remote activity and PSExec lateral movement to the jump server, and eventually to the detection of the Mimikatz credential theft tool, which can harvest plaintext passwords, password hashes, smartcard PINs, and Kerberos tickets.'
    question: 'In the related Mimikatz credential theft tool detection, what is the name of the file associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimidrv.sys'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimidrv.sys'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` tampered with system recovery settings on the device, attempting to delete backups and disable recovery services.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious remote activity was initiated against the machine from the IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker used PSExec to move laterally to the jump server, the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'On that host, the Mimikatz credential theft tool was detected through its driver file `mimidrv.sys`, indicating an attempt to harvest credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
