tasks:
- task_id: incident_5_latest_cleaned_train_set_task_39
  title: incident_5_latest_cleaned_train_set_task_39
  description: 'In the follow-up alert about potentially compromised assets exhibiting ransomware-like behavior, what is the name of the file (archive) that was involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Suspicious hands on keyboard user behavior'' alert was raised on a device after an anomalous process was executed with the command line `curl http://vectorsandarrows.com` (Process ID 88, created at 2024-06-20T09:29:42Z). This indicated a change in typical user behavior, possibly signaling a human-operated attack. Moments later, a related alert fired for potentially compromised assets exhibiting ransomware-like behavior across several devices.'
    question: 'In the follow-up alert about potentially compromised assets exhibiting ransomware-like behavior, what is the name of the file (archive) that was involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'characterical.zip'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `dp5hn` exhibited suspicious hands-on-keyboard behavior on the device, indicating a possible compromise and human-operated attack.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised assets exhibited ransomware-like behavior involving the file `characterical.zip`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
