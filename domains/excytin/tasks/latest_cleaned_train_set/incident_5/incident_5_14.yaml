tasks:
- task_id: incident_5_latest_cleaned_train_set_task_14
  title: incident_5_latest_cleaned_train_set_task_14
  description: 'For the related alert about deleted file backups (all snapshots and shadow copies removed via WMI/VSSAdmin), what is the Azure AD device ID (AadDeviceId) of the affected device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a human-operated ransomware incident, a ransomware payload was remotely launched on the device `vnevado-win11u` (Azure AD device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`), which was communicating with the IP address `99.83.111.100`. The attackers appeared to be attempting to encrypt content on the environment''s devices, rendering it unusable to users. Just moments before this, a related alert fired indicating that all file snapshots and shadow copies were deleted via WMI or VSSAdmin, a technique commonly seen during ransomware infections.'
    question: 'For the related alert about deleted file backups (all snapshots and shadow copies removed via WMI/VSSAdmin), what is the Azure AD device ID (AadDeviceId) of the affected device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '9d4887ba-0b69-47d6-89bc-9b32787f379e — note this is a different device from `vnevado-win11u`, indicating the ransomware activity spread across multiple endpoints.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '9d4887ba-0b69-47d6-89bc-9b32787f379e — note this is a different device from `vnevado-win11u`, indicating the ransomware activity spread across multiple endpoints.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A ransomware payload was remotely launched under the compromised account with Name `dp5hn`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'As part of the same ransomware activity, all file backups (shadow copies and snapshots) were deleted via WMI/VSSAdmin on the device with AadDeviceId `9d4887ba-0b69-47d6-89bc-9b32787f379e`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
