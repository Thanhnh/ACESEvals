tasks:
- task_id: incident_5_latest_cleaned_train_set_task_87
  title: incident_5_latest_cleaned_train_set_task_87
  description: 'For the ''CommandAndControl'' malware alert associated with lateral movement on the same device, what was the process ID, creation time, and full command line of the process that triggered it?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a possible attempt to access a Primary Refresh Token (PRT) was detected on a device, where the process `browsercore.exe` (Process ID 7036, created 2024-06-20T09:29:49.304018Z, command line `"browsercore.exe"`) was executed. A PRT is a key artifact of Azure AD authentication that attackers can attempt to access to move laterally within an organization or perform credential theft. Roughly a second later, on the same device, a ''CommandAndControl'' malware alert was raised indicating an attacker might be attempting to move laterally to this device from another device on the network.'
    question: 'For the ''CommandAndControl'' malware alert associated with lateral movement on the same device, what was the process ID, creation time, and full command line of the process that triggered it?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 88, Created Time (UTC): 2024-06-20T09:29:42.3927529Z, Command line: `curl http://vectorsandarrows.com`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 88, Created Time (UTC): 2024-06-20T09:29:42.3927529Z, Command line: `curl http://vectorsandarrows.com`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possible attempt to access the Primary Refresh Token (PRT) was detected on the host with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker moved laterally and ''CommandAndControl'' malware was executed via the process with command line `curl http://vectorsandarrows.com`, Process ID `88`, created at `2024-06-20t09:29:42.3927529z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
