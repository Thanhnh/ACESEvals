tasks:
- task_id: incident_5_latest_cleaned_train_set_task_93
  title: incident_5_latest_cleaned_train_set_task_93
  description: 'For the related ''CommandAndControl'' malware detection during lateral movement, which device (hostname) was the malware detected on?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled ''Possible ransomware activity based on a known malicious extension'' fired on the device `vnevado-win11u` (AAD Device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`). Numerous file system changes were observed, including files such as `earlap.doc`, `kiters.7z`, `ponceau.7z`, `syncretic.7z` and `unstreaming.xlsx`, with encrypted copies like `earlap.doc.lockbit` and `kiters.7z.lockbit` being created by an account with SID `S-0-6-5`. Shortly after, a related alert reported that ''CommandAndControl'' malware was detected during lateral movement, suggesting an attacker was moving between devices on the network.'
    question: 'For the related ''CommandAndControl'' malware detection during lateral movement, which device (hostname) was the malware detected on?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10r'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10r'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` performed numerous file system changes appending a known ransomware file extension, indicating possible mass encryption by ransomware.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The ransomware activity was followed by ''CommandAndControl'' malware being detected during lateral movement on the host `vnevado-win10r`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
