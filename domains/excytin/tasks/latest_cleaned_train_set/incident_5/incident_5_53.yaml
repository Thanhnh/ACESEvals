tasks:
- task_id: incident_5_latest_cleaned_train_set_task_53
  title: incident_5_latest_cleaned_train_set_task_53
  description: 'What is the AAD Device ID of the device where the ''CommandAndControl'' malware was detected during lateral movement?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware incident, a possibly compromised user account (SID `S-0-6-5`) was observed dropping ransomware-related files such as `ponceau.7z.lockbit`, `unstreaming.xlsx.lockbit`, and `kiters.7z.lockbit`, along with a credential-theft script `get-userprttoken.ps1`, on several devices, including the device with AAD Device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`, and communication was seen with IP `99.83.111.100`. Roughly one second later, a related alert reported that ''CommandAndControl'' malware was detected on a device during lateral movement, suggesting the attacker was moving from one device to another across the network.'
    question: 'What is the AAD Device ID of the device where the ''CommandAndControl'' malware was detected during lateral movement?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'f5b847aa-8712-4bf6-b4f7-ed6cd89e1505'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'f5b847aa-8712-4bf6-b4f7-ed6cd89e1505'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` was observed dropping ransomware-related files on several devices, indicating the attacker used this account to move laterally across the network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using that compromised account, the attacker moved laterally to the device with AadDeviceId `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`, where ''CommandAndControl'' malware was detected.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
