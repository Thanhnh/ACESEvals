tasks:
- task_id: incident_5_latest_cleaned_train_set_task_97
  title: incident_5_latest_cleaned_train_set_task_97
  description: 'For the alert about the malicious credential theft tool execution, what IP address was identified as being involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware-related incident, a possibly compromised user account (SID `S-1-5-21-1840191660-8534830288-125585561-1522`) was observed dropping ransomware-related files such as `ponceau.7z.lockbit`, `syncretic.7z.lockbit`, and `earlap.doc.lockbit` across several devices, including the device with AAD Device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`. Investigation of this activity later revealed lateral movement via PSExec to a jump server, and on a related host a known credential theft tool was executed with a command line indicating intent to dump users'' credentials, keys, and plain-text passwords.'
    question: 'For the alert about the malicious credential theft tool execution, what IP address was identified as being involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account was observed dropping ransomware-related files on several devices, with activity originating from IP address `99.83.111.100`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker used PSExec to move laterally to the jump server from the device with HostName `vnevado-win10v`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that device, a known credential theft tool was executed to dump users'' credentials and plain-text passwords, associated with IP address `107.224.99.179`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
