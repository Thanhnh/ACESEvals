tasks:
- task_id: incident_5_latest_cleaned_train_set_task_69
  title: incident_5_latest_cleaned_train_set_task_69
  description: 'In the alert reporting the Mimikatz credential theft tool detection, what is the name of the malicious file that was identified?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a command and control connection to the URL `http://vectorsandarrows.com/` was blocked on a compromised device. Follow-on activity on the same environment included possible ransomware file-encryption behavior and lateral movement via PSExec to a jump server. Investigation also revealed that the Mimikatz credential theft tool was detected on one of the affected devices, where it could be used to harvest plaintext passwords, password hashes, smartcard PINs, and Kerberos tickets.'
    question: 'In the alert reporting the Mimikatz credential theft tool detection, what is the name of the malicious file that was identified?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilib.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'Command and Control behavior was blocked for activity associated with the account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Possible ransomware activity based on a known malicious file extension was observed, involving the IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Lateral movement via PSExec to the jump server was performed from the host `vnevado-win10v`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The Mimikatz credential theft tool was detected on the device, identified by the file `mimilib.dll`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
