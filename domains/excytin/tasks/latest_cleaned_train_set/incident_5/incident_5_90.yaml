tasks:
- task_id: incident_5_latest_cleaned_train_set_task_90
  title: incident_5_latest_cleaned_train_set_task_90
  description: 'For the Mimikatz credential theft detection associated with this incident, what is the name of the malicious file identified?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, system recovery setting tampering was observed on host `vnevado-win11u` where the account `dp5hn` (SID S-1-5-21-1840191660-8534830288-125585561-1522) ran `vssblatemp.exe delete shadows /all` (PID 1900) and `bcdedit /set recoveryenabled no` (PID 4828). Following this activity, suspicious remote activity and lateral movement via PSExec to the jump server were detected, and around the same time the Mimikatz credential theft tool was detected on a device in the environment.'
    question: 'For the Mimikatz credential theft detection associated with this incident, what is the name of the malicious file identified?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilib.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` tampered with system recovery settings on the device, attempting to delete backups and disable recovery services.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious remote activity was initiated against the machine from the remote IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker used PSExec to move laterally to the jump server, the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'On that device, the Mimikatz credential theft tool was detected through the file `mimilib.dll`, used to harvest plaintext passwords, hashes, and Kerberos tickets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
