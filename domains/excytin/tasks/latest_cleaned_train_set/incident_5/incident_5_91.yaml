tasks:
- task_id: incident_5_latest_cleaned_train_set_task_91
  title: incident_5_latest_cleaned_train_set_task_91
  description: 'For the alert about possible ransomware activity based on a known malicious extension, what is the name of the file flagged in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, an alert fired for a possible attempt to access a Primary Refresh Token (PRT) — a key Azure AD authentication artifact that attackers steal to move laterally or perform credential theft. The activity involved the source IP address `107.224.99.179`, an encoded `powershell.exe` command (Process ID 2484, created 2024-06-20T08:51:01Z), and the launch of `browsercore.exe` (Process ID 4760). Following this credential access activity, lateral movement via PSExec to the jump server was observed, and shortly afterward another device reported numerous file system changes appending a file extension known from past ransomware incidents, suggesting mass encryption of files.'
    question: 'For the alert about possible ransomware activity based on a known malicious extension, what is the name of the file flagged in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'characterical.zip'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A possible attempt to access the Primary Refresh Token (PRT) was detected on the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker used PSExec to move laterally to the jump server from the IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Possible ransomware activity was detected, involving mass file changes with a known malicious extension, such as the file `characterical.zip`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
