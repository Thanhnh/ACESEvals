tasks:
- task_id: incident_5_latest_cleaned_train_set_task_36
  title: incident_5_latest_cleaned_train_set_task_36
  description: 'A related alert in this incident flagged suspicious WMI process creation on a machine, where malware often uses WMI to spawn new processes and break process trees. What is the name of the account associated with that WMI process creation alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, an alert fired for a renamed Windows Sysinternals tool being launched. Investigation showed `mimikatz.exe` was executed with the command line `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:..\notepad.exe //vnevado-jump cmd.exe"` (PID 2020), spawning renamed `notepad.exe` processes used to reach `\\vnevado-jump cmd.exe`, alongside PowerShell (PID 8516) launched from `c:\users\tgs2z\downloads\humw21`. This activity chained into PSExec lateral movement to the jump server and blocked SMB file access on multiple devices.'
    question: 'A related alert in this incident flagged suspicious WMI process creation on a machine, where malware often uses WMI to spawn new processes and break process trees. What is the name of the account associated with that WMI process creation alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dp5hn'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` renamed a Windows Sysinternals tool and launched it, likely to covertly use the tool for malicious purposes.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker then used PSExec for lateral movement to the jump server from IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Lateral movement using SMB remote file access was blocked on multiple devices, including the host `vnevado-win11t`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'On that host, a suspicious WMI process creation was observed, performed by the account named `dp5hn`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
