tasks:
- task_id: incident_5_latest_cleaned_train_set_task_82
  title: incident_5_latest_cleaned_train_set_task_82
  description: 'For the alert where ''CommandAndControl'' malware was detected during lateral movement, what is the Microsoft Entra (AAD) user ID of the account associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage intrusion, the Mimikatz credential theft tool was detected on a device, with the file `mimilib.dll` observed on the compromised host. The attacker then leveraged PSExec for lateral movement to the jump server ''Vnevado-jump'', triggered suspicious remote activity alerts, and ultimately ''CommandAndControl'' malware was detected on a device during lateral movement.'
    question: 'For the alert where ''CommandAndControl'' malware was detected during lateral movement, what is the Microsoft Entra (AAD) user ID of the account associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '731adb71-b11c-4bbf-850b-57989b350e96'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '731adb71-b11c-4bbf-850b-57989b350e96'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The Mimikatz credential theft tool was detected on the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, harvesting credentials from the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker performed lateral movement via PSExec to the jump server from the IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Suspicious remote activity was then observed, initiated by the compromised account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: '''CommandAndControl'' malware was detected during lateral movement, associated with the same account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
