tasks:
- task_id: incident_5_latest_cleaned_train_set_task_88
  title: incident_5_latest_cleaned_train_set_task_88
  description: 'For the alert about deleted file backups on the same device, what was the command line executed and the process ID of the process that removed the shadow copies?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised for a possible attempt to access a Primary Refresh Token (PRT) — a key artifact of Azure AD authentication used to enable single sign-on. The activity involved the process `browsercore.exe` with process ID 7036, created at 2024-06-20T09:29:49.304018Z. Shortly after, on the same device, another alert fired indicating that all file snapshots and shadow copies were deleted, a behavior commonly seen during ransomware infections.'
    question: 'For the alert about deleted file backups on the same device, what was the command line executed and the process ID of the process that removed the shadow copies?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Command line: `vssblatemp.exe delete shadows /all`, Process ID: 1900 (created 2024-06-20T09:29:40.8785892Z)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Command line: `vssblatemp.exe delete shadows /all`, Process ID: 1900 (created 2024-06-20T09:29:40.8785892Z)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An attempt to access the Primary Refresh Token (PRT) was detected on the host with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that device, the attacker deleted all file backups by running the process `vssblatemp.exe delete shadows /all` with Process ID `1900` at `2024-06-20t09:29:40.8785892z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
