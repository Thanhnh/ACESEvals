tasks:
- task_id: incident_5_latest_cleaned_train_set_task_1
  title: incident_5_latest_cleaned_train_set_task_1
  description: 'The related alert attributing this activity to the Manatee Tempest activity group includes a network indicator. What is the IP address associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, the Mimikatz credential theft hacktool was detected on a device, with files such as `mimikatz.exe`, `mimidrv.sys`, and `mimispool.dll` dropped, and processes launched with command lines like `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit` (PID 1044) and `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:..\notepad.exe \\vnevado-jump cmd.exe"` (PID 6600). This activity is linked through the compromised user account to lateral movement via PSExec to the jump server, ransomware-like behavior on multiple assets, and finally to an alert attributing the activity to a known threat actor group.'
    question: 'The related alert attributing this activity to the Manatee Tempest activity group includes a network indicator. What is the IP address associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The Mimikatz credential theft tool was detected running in the context of the user account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`, indicating the attacker was harvesting credentials from the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker performed lateral movement via PSExec to the jump server from the IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The compromised assets then exhibited ransomware-like behavior, with the attacker operating under the account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` to spread across the network.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'This activity was attributed to the Manatee Tempest activity group, which used the command-and-control IP address `198.43.121.209`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
