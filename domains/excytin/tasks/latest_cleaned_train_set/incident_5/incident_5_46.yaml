tasks:
- task_id: incident_5_latest_cleaned_train_set_task_46
  title: incident_5_latest_cleaned_train_set_task_46
  description: 'For the related ''Command and Control behavior was blocked'' alert, what was the URL that the malware attempted to contact?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, an alert fired indicating that all file snapshots and shadow copies were deleted on host `vnevado-win11u` (AAD device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`) via the process `vssblatemp.exe` with command line `vssblatemp.exe delete shadows /all` (Process ID 1900, created 2024-06-20T09:32:02Z). This behavior is common during ransomware infections. Approximately one second later, a related alert reported that command and control behavior was blocked on the same environment.'
    question: 'For the related ''Command and Control behavior was blocked'' alert, what was the URL that the malware attempted to contact?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://vectorsandarrows.com/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` deleted all file snapshots and shadow copies via WMI or VSSAdmin, a common ransomware behavior indicating file backups were deleted.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the backup deletion, command and control behavior was blocked on the same device, where the active malware attempted to communicate with the malicious URL `http://vectorsandarrows.com/`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
