tasks:
- task_id: incident_5_latest_cleaned_train_set_task_64
  title: incident_5_latest_cleaned_train_set_task_64
  description: 'A closely related alert shows that a ransomware payload was remotely launched on a device. What is the IP address of the remote source associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, potentially compromised assets were observed exhibiting ransomware-like behavior across several devices. The activity involved the account with SID `S-0-6-5` and files such as `get-userprttoken.ps1`, `characterical.zip`, and the encrypted `characterical.zip.lockbit`, suggesting an attacker was moving laterally across the network to infect as many devices as possible with ransomware.'
    question: 'A closely related alert shows that a ransomware payload was remotely launched on a device. What is the IP address of the remote source associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '99.83.111.100'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '99.83.111.100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Potentially compromised assets exhibiting ransomware-like behavior were detected, with the attacker moving laterally across the network from IP address `99.83.111.100`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A ransomware payload was remotely launched on the device from the same IP address `99.83.111.100`, attempting to encrypt content and render the device unusable.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
