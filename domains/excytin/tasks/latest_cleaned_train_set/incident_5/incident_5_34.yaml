tasks:
- task_id: incident_5_latest_cleaned_train_set_task_34
  title: incident_5_latest_cleaned_train_set_task_34
  description: 'For the Manatee Tempest activity group alert associated with this incident, what was the domain/URL observed in the alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, an alert titled ''Potentially compromised assets exhibiting ransomware-like behavior'' was triggered on host `vnevado-win11u` (AAD device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`), involving IP `99.83.111.100`, account SID `S-0-6-5`, and files such as `syncretic.7z`, `kiters.7z`, `unstreaming.xlsx`, `get-userprttoken.ps1`, along with encrypted versions like `kiters.7z.lockbit` and `unstreaming.xlsx.lockbit`. Almost simultaneously, another alert was raised for activity attributed to the Manatee Tempest activity group, a Russia-based cybercriminal group known for drive-by download and FakeUpdates (SocGholish) infections used to obtain initial access, followed by BLISTER loader and Cobalt Strike beacons for lateral movement and ransomware deployment.'
    question: 'For the Manatee Tempest activity group alert associated with this incident, what was the domain/URL observed in the alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vectorsandarrows.com'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vectorsandarrows.com'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` was identified as a potentially compromised asset exhibiting ransomware-like behavior, possibly being used by an attacker to move laterally and spread ransomware across devices.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Activity associated with the Manatee Tempest activity group was detected involving the malicious URL `vectorsandarrows.com`, likely used for drive-by download / FakeUpdates infection leading to Cobalt Strike and ransomware deployment.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
