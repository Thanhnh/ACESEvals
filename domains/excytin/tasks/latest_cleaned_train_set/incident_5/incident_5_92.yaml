tasks:
- task_id: incident_5_latest_cleaned_train_set_task_92
  title: incident_5_latest_cleaned_train_set_task_92
  description: 'A related alert flagged that a Windows Sysinternals tool had been renamed and then launched on the affected machine, likely to covertly use it for malicious purposes. What remote IP address is associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage intrusion, a "Suspicious remote activity" alert was raised on a device (AAD Device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`), indicating that an interactive session and commands were initiated remotely. The observed activity included destructive and reconnaissance commands such as `bcdedit /set recoveryenabled no` (PID 4828), `bcdedit /set bootstatuspolicy ignoreallfailures` (PID 7332), `vssblatemp.exe delete shadows /all` (PID 1900), `curl http://vectorsandarrows.com` (PID 5572), and `powershell -file c:\scripts\get-userprttoken.ps1` (PID 5708), executed under the account SID `S-1-5-21-1840191660-8534830288-125585561-1522`. The attacker later moved laterally via PSExec to a jump server.'
    question: 'A related alert flagged that a Windows Sysinternals tool had been renamed and then launched on the affected machine, likely to covertly use it for malicious purposes. What remote IP address is associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was initiated from the IP address `99.83.111.100`, indicating an attempt to remotely start interactive sessions or execute commands on the machine.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Lateral movement using PSExec to the jump server was observed originating from the host `vnevado-win10v`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A renamed Windows Sysinternals tool was launched, with associated remote activity from the IP address `107.224.99.179`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
