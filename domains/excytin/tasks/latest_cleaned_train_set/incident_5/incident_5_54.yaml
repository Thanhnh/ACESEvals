tasks:
- task_id: incident_5_latest_cleaned_train_set_task_54
  title: incident_5_latest_cleaned_train_set_task_54
  description: 'Following this activity, an alert for ransomware behavior detected in the file system was triggered on a different machine involved in this incident. What is the Azure AD device ID (AadDeviceId) of that machine?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware-related security incident, an alert was raised indicating that all file snapshots and shadow copies were deleted. On host `vnevado-win10r` (AadDeviceId `9d4887ba-0b69-47d6-89bc-9b32787f379e`), process ID 7236 was created at 2024-06-20T09:10:51.2193152Z with the command line `vssblatemp.exe delete shadows /all`. This behavior is common during ransomware infections, and the incident also included alerts about suspicious activity initiated remotely from another machine.'
    question: 'Following this activity, an alert for ransomware behavior detected in the file system was triggered on a different machine involved in this incident. What is the Azure AD device ID (AadDeviceId) of that machine?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bc00e484-d0e5-4da4-9472-95568cccc07e'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bc00e484-d0e5-4da4-9472-95568cccc07e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` deleted all file backups (shadow copies) via WMI or VSSAdmin, a common precursor to ransomware encryption.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious remote activity was observed on the device with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`, indicating remotely initiated commands such as WMI execution or file modification.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Ransomware behavior was then detected in the file system of the same device with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`, indicating mass encryption of files.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
