tasks:
- task_id: incident_5_latest_cleaned_train_set_task_42
  title: incident_5_latest_cleaned_train_set_task_42
  description: 'In the related alert about the renamed Windows Sysinternals tool, what was the name of the file involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident investigation, a malicious credential theft tool execution was detected. The process `conhost.exe` was launched with command line `conhost.exe 0xffffffff -forcev1` (Process ID 7948, created 2024-06-20T08:59:42.8455252Z). Either the process itself or its command line indicated an intent to dump users'' credentials, keys, plain-text passwords and more. On the same host, another alert was raised indicating that a Windows Sysinternals tool was renamed and then launched, which might have been an attempt to covertly use the tool for malicious purposes.'
    question: 'In the related alert about the renamed Windows Sysinternals tool, what was the name of the file involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool execution command line was detected on host `vnevado-win10v`, indicating an intent to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The credential theft activity involved a renamed Windows Sysinternals tool, executed as the file `mimikatz.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
