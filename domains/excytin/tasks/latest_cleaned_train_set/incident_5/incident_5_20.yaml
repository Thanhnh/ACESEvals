tasks:
- task_id: incident_5_latest_cleaned_train_set_task_20
  title: incident_5_latest_cleaned_train_set_task_20
  description: 'Later in this same attack chain, an alert was raised indicating that all file snapshots and shadow copies were deleted via WMI or VSSAdmin, behavior commonly seen during ransomware infections. What is the security identifier (SID) of the account associated with that backup deletion alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, the Mimikatz credential theft tool was detected on a device in our environment, with the malicious file `mimilib.dll` identified on the host. Mimikatz can harvest plaintext passwords, password hashes, smartcard PINs, and Kerberos tickets, suggesting an attacker was attempting to impersonate valid users and move across the network. This activity was linked to a chain of follow-on alerts, including lateral movement to a jump server via PSExec and suspicious remote activity on another machine.'
    question: 'Later in this same attack chain, an alert was raised indicating that all file snapshots and shadow copies were deleted via WMI or VSSAdmin, behavior commonly seen during ransomware infections. What is the security identifier (SID) of the account associated with that backup deletion alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1840191660-8534830288-125585561-1522'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1840191660-8534830288-125585561-1522'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The Mimikatz credential theft tool was detected on the device with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, indicating the attacker attempted to harvest credentials (plaintext passwords, hashes, Kerberos tickets) from this host.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker performed lateral movement via PSExec to the jump server from the IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Suspicious remote activity (remotely initiated interactive sessions, WMI commands, and scheduled tasks) was then observed being executed by the compromised account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Finally, the same account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` deleted all file snapshots and shadow copies via WMI/VSSAdmin, a behavior commonly associated with ransomware deployment.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
