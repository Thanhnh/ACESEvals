tasks:
- task_id: incident_5_latest_cleaned_train_set_task_32
  title: incident_5_latest_cleaned_train_set_task_32
  description: 'What is the Azure AD Device ID of the other device where the ransomware payload was remotely launched in this same incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a human-operated ransomware incident, an alert was raised indicating that a ransomware payload was remotely launched on the device `vnevado-win11t` (Azure AD Device ID `e5799261-6720-4297-961e-bd9ca4275033`), suggesting attackers were attempting to encrypt content and render the device unusable. Investigation shows the same account was involved in launching a ransomware payload remotely on another device roughly at the same time.'
    question: 'What is the Azure AD Device ID of the other device where the ransomware payload was remotely launched in this same incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bc00e484-d0e5-4da4-9472-95568cccc07e'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bc00e484-d0e5-4da4-9472-95568cccc07e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A ransomware payload was remotely launched using the compromised account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The ransomware payload was remotely launched on the device with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`, where attackers might be attempting to encrypt content and render it unusable to users.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
