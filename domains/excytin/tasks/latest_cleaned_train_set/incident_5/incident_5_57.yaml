tasks:
- task_id: incident_5_latest_cleaned_train_set_task_57
  title: incident_5_latest_cleaned_train_set_task_57
  description: 'Around the same time on the same machine, another alert reported that command and control behavior was blocked. What was the command-and-control URL that the malware attempted to contact?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert for suspicious remote activity was raised on a machine. The activity included the process `vssblatemp.exe` (PID 5512) running `vssblatemp.exe delete shadows /all`, `bcdedit /set recoveryenabled no` (PID 8136), `bcdedit /set bootstatuspolicy ignoreallfailures` (PID 1868), and `powershell -file c:\scripts\get-userprttoken.ps1` (PID 6168), with remote IP `99.83.111.100` and account SID `S-0-6-5` involved.'
    question: 'Around the same time on the same machine, another alert reported that command and control behavior was blocked. What was the command-and-control URL that the malware attempted to contact?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://vectorsandarrows.com/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was observed on the host `vnevado-win10s`, indicating an attacker initiated actions (such as interactive sessions, file modifications, WMI commands, or scheduled tasks) remotely against this machine.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From that compromised host, command and control behavior was detected and blocked when the malware attempted to communicate with the malicious URL `http://vectorsandarrows.com/`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
