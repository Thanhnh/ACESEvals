tasks:
- task_id: incident_5_latest_cleaned_train_set_task_4
  title: incident_5_latest_cleaned_train_set_task_4
  description: 'Shortly after this tampering, a related alert fired indicating that a ransomware payload was remotely launched on the same device. What is the remote IP address associated with that ransomware payload launch?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, system recovery setting tampering was observed on the device `vnevado-win10s` (AAD device ID `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`). Two processes were involved: process ID 5512 running `vssblatemp.exe delete shadows /all` and process ID 8136 running `bcdedit /set recoveryenabled no`, both created around 2024-06-20T09:10 UTC. These actions suggest an adversary was deleting volume shadow copies and disabling Windows recovery features, commonly a precursor to data encryption for impact.'
    question: 'Shortly after this tampering, a related alert fired indicating that a ransomware payload was remotely launched on the same device. What is the remote IP address associated with that ransomware payload launch?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '99.83.111.100'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '99.83.111.100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` performed system recovery setting tampering on the device, attempting to delete backups and disable recovery services.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A ransomware payload was then remotely launched on the device from the remote IP address `99.83.111.100`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
