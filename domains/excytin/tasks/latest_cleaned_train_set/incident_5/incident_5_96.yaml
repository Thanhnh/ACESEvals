tasks:
- task_id: incident_5_latest_cleaned_train_set_task_96
  title: incident_5_latest_cleaned_train_set_task_96
  description: 'For the related alert about the remotely launched ransomware payload, what is the Azure AD (Entra) device ID of the device where the payload was launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, suspicious remote activity was observed on host `vnevado-win10r` (AAD device ID `9d4887ba-0b69-47d6-89bc-9b32787f379e`), where an attacker ran commands such as `bcdedit /set recoveryenabled no`, `bcdedit /set bootstatuspolicy ignoreallfailures`, `vssblatemp.exe delete shadows /all`, `curl http://vectorsandarrows.com`, and `powershell -file c:\scripts\get-userprttoken.ps1`. A related alert shortly afterwards reported that a ransomware payload was remotely launched on a device, potentially encrypting its content and rendering it unusable.'
    question: 'For the related alert about the remotely launched ransomware payload, what is the Azure AD (Entra) device ID of the device where the payload was launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bc00e484-d0e5-4da4-9472-95568cccc07e'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bc00e484-d0e5-4da4-9472-95568cccc07e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` performed suspicious remote activity, initiating actions such as interactive sessions, file modifications, WMI commands, or scheduled tasks from a remote machine.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using that remote access, a ransomware payload was remotely launched on the device with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`, attempting to encrypt content on the device.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
