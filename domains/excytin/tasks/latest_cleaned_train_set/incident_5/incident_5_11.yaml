tasks:
- task_id: incident_5_latest_cleaned_train_set_task_11
  title: incident_5_latest_cleaned_train_set_task_11
  description: 'Around the same time, an alert for suspicious remote activity was raised on the same machine, indicating activity initiated from a remote source. What was the source IP address associated with that suspicious remote activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a possible attempt to access a Primary Refresh Token (PRT) was detected on host `vnevado-win11t` (Azure AD device ID `e5799261-6720-4297-961e-bd9ca4275033`), where the process `browsercore.exe` was launched with process ID 7036 at 2024-06-20T09:29:49.304018Z. A PRT is a key artifact of Azure AD authentication that attackers may target to move laterally or steal credentials.'
    question: 'Around the same time, an alert for suspicious remote activity was raised on the same machine, indicating activity initiated from a remote source. What was the source IP address associated with that suspicious remote activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '99.83.111.100'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '99.83.111.100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` was involved in a possible attempt to access the Primary Refresh Token (PRT), a key Azure AD authentication artifact that attackers can steal for lateral movement or credential theft.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious remote activity was then observed originating from the remote IP address `99.83.111.100`, indicating the attacker initiated remote actions (such as interactive sessions, file modifications, WMI commands, or scheduled tasks) against the machine.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
