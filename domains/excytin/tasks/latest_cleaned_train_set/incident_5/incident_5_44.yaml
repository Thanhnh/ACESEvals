tasks:
- task_id: incident_5_latest_cleaned_train_set_task_44
  title: incident_5_latest_cleaned_train_set_task_44
  description: 'For the suspicious remote activity alert, what was the process ID, creation time, and full command line of the process that was executed to inhibit system recovery?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware incident, files such as `characterical.zip` were encrypted and renamed with a known malicious extension (e.g., `characterical.zip.lockbit`), and a credential-related script named `get-userprttoken.ps1` was also observed on the device. Immediately before this mass file encryption activity, another alert fired for suspicious activity initiated remotely on the same machine, which can include interactive session attempts, file modifications, WMI commands, and scheduled task creation.'
    question: 'For the suspicious remote activity alert, what was the process ID, creation time, and full command line of the process that was executed to inhibit system recovery?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 1900, Created Time (UTC): 2024-06-20T09:29:40.8785892Z, Command line: `vssblatemp.exe delete shadows /all`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 1900, Created Time (UTC): 2024-06-20T09:29:40.8785892Z, Command line: `vssblatemp.exe delete shadows /all`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `dp5hn` was observed making numerous file system changes that appended a known ransomware file extension, indicating possible mass encryption activity.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From that compromised account''s device, suspicious remotely initiated activity was detected, where the process with Process ID `1900` was created at `2024-06-20t09:29:40.8785892z` running the command line `vssblatemp.exe delete shadows /all` to delete volume shadow copies and prevent file recovery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
