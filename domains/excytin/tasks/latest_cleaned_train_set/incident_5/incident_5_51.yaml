tasks:
- task_id: incident_5_latest_cleaned_train_set_task_51
  title: incident_5_latest_cleaned_train_set_task_51
  description: 'Around the same time, another alert in this incident flagged potentially compromised assets exhibiting ransomware-like behavior across several devices. What is the name of the file identified in that ransomware-related alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled "Possible attempt to access Primary Refresh Token (PRT)" was raised on the host `vnevado-win10s` (AAD Device ID `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`). The alert was triggered by the process `browsercore.exe` (Process ID 2676, created 2024-06-20T09:10:59.867384Z, command line `"browsercore.exe"`). A PRT is a key artifact of Entra ID/Azure AD authentication that attackers may try to steal to move laterally or perform credential theft.'
    question: 'Around the same time, another alert in this incident flagged potentially compromised assets exhibiting ransomware-like behavior across several devices. What is the name of the file identified in that ransomware-related alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'unstreaming.xlsx'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'unstreaming.xlsx'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An attacker used the account `dp5hn` in a possible attempt to access the Primary Refresh Token (PRT) on the device, aiming to steal credentials and move laterally across the organization.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the compromised assets, the attacker exhibited ransomware-like behavior across several devices, impacting the file `unstreaming.xlsx`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
