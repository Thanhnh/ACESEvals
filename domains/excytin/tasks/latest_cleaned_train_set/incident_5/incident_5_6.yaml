tasks:
- task_id: incident_5_latest_cleaned_train_set_task_6
  title: incident_5_latest_cleaned_train_set_task_6
  description: 'Shortly after the suspicious remote activity, another alert in the same incident reported that the LSASS process memory was modified, likely as a credential access attempt. Which IP address is associated with that LSASS memory modification alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, an alert for ''Suspicious remote activity'' was raised on a compromised machine, flagging activity that appeared to be initiated remotely. Observed processes included `vssblatemp.exe delete shadows /all` (PID 1900), `bcdedit /set recoveryenabled no` (PID 4828), `bcdedit /set bootstatuspolicy ignoreallfailures` (PID 7332), `curl http://vectorsandarrows.com` (PID 5572), and `powershell -file c:\scripts\get-userprttoken.ps1` (PID 5708), all executed around 2024-06-20 09:32 UTC under the account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` (AAD user ID `731adb71-b11c-4bbf-850b-57989b350e96`). This activity is also linked to lateral movement via PSExec to the jump server Vnevado-jump.'
    question: 'Shortly after the suspicious remote activity, another alert in the same incident reported that the LSASS process memory was modified, likely as a credential access attempt. Which IP address is associated with that LSASS memory modification alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was observed originating from the remote IP address `99.83.111.100`, indicating an attempt to initiate interactive sessions or commands from a remote machine.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account `tgs2z` was used to perform PSExec lateral movement to the jump server (Vnevado-jump).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The LSASS process memory was modified on the compromised machine, with the associated activity linked to the IP address `107.224.99.179`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
