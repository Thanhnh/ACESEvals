tasks:
- task_id: incident_5_latest_cleaned_train_set_task_81
  title: incident_5_latest_cleaned_train_set_task_81
  description: 'For the alert reporting the remotely launched ransomware payload, which user account name was identified as being involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert fired for "PsExec launched a command on a remote device", indicating an attacker may be using PsExec to run commands remotely and move laterally within the organization. The alert involved the IP address `107.224.99.179` and processes such as `cmd.exe` (PID 8656, created 2024-06-20T09:07:09Z) and `notepad.exe` (PIDs 6428 and 6624, with command lines like `notepad.exe \\vnevado-jump cmd.exe`). Shortly afterwards, related activity showed lateral movement to the jump server and, seconds later, a ransomware payload was remotely launched on a device, where attackers may attempt to encrypt content and render it unusable.'
    question: 'For the alert reporting the remotely launched ransomware payload, which user account name was identified as being involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The account name is `dp5hn`.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The account name is `dp5hn`.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` used PsExec to launch a command on a remote device, indicating lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The lateral movement via PSExec was directed to the jump server, originating from the IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Using this remote access, a ransomware payload was remotely launched on the device by the account named `dp5hn`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
