      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Suspicious remote activity on the machine was initiated by the account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
