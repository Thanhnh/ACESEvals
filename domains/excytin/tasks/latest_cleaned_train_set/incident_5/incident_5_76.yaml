  description: 'For the related ''Suspicious remote activity'' alert, what is the Microsoft Entra ID (AAD) user ID of the account involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert fired indicating PsExec was used to launch a command on a remote device. The observed processes included `cmd.exe` (PID 8656) and `notepad.exe` (PIDs 6428 and 6624) with command lines referencing `\\vnevado-jump cmd.exe`, and the activity was associated with the IP address `107.224.99.179`. This lateral movement to the jump server was followed by a related alert for suspicious remote activity on the targeted machine, flagging attempts to initiate interactive sessions, modify files, pass WMI commands, or create scheduled tasks from a remote machine.'
    question: 'For the related ''Suspicious remote activity'' alert, what is the Microsoft Entra ID (AAD) user ID of the account involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '731adb71-b11c-4bbf-850b-57989b350e96'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '731adb71-b11c-4bbf-850b-57989b350e96'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'PsExec was used on host `vnevado-win10v` to launch a command on a remote device, indicating lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
