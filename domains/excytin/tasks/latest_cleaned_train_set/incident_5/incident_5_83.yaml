tasks:
- task_id: incident_5_latest_cleaned_train_set_task_83
  title: incident_5_latest_cleaned_train_set_task_83
  description: 'Roughly one second earlier, a related alert attributed the activity to the Manatee Tempest activity group, a Russia-based cybercriminal group known for Cobalt Strike and ransomware deployment. What IP address was flagged as an entity in that Manatee Tempest activity group alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a "Suspicious remote activity" alert was raised on an endpoint at 2024-07-04 22:35:01 UTC. The activity included shadow copy deletion and recovery tampering commands such as `vssblatemp.exe delete shadows /all` (PID 1900), `bcdedit /set recoveryenabled no` (PID 4828), and `bcdedit /set bootstatuspolicy ignoreallfailures` (PID 7332), along with the execution of `powershell -file c:\scripts\get-userprttoken.ps1` (PID 5708) under the account SID `S-0-6-5`, with remote activity observed from address `99.83.111.100`.'
    question: 'Roughly one second earlier, a related alert attributed the activity to the Manatee Tempest activity group, a Russia-based cybercriminal group known for Cobalt Strike and ransomware deployment. What IP address was flagged as an entity in that Manatee Tempest activity group alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious remote activity was observed involving the account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`, indicating attempts to initiate interactive sessions or run commands from a remote machine.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The activity was associated with the Manatee Tempest activity group, which communicated with the IP address `198.43.121.209`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
