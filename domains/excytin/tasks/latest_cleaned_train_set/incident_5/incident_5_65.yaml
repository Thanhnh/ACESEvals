tasks:
- task_id: incident_5_latest_cleaned_train_set_task_65
  title: incident_5_latest_cleaned_train_set_task_65
  description: 'Moments after this PRT access attempt, another related alert fired on the same activity chain reporting that a known credential theft tool execution command line was detected. What is the file name of the process associated with that credential theft tool execution alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Possible attempt to access Primary Refresh Token (PRT)" was raised on host `vnevado-win11t` (AAD Device ID `e5799261-6720-4297-961e-bd9ca4275033`) for the account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`). The activity involved the process `browsercore.exe` (PID 7036, created 2024-06-20T09:29:49.304018Z). A PRT is a key artifact of Entra ID authentication that attackers may steal to move laterally or perform credential theft.'
    question: 'Moments after this PRT access attempt, another related alert fired on the same activity chain reporting that a known credential theft tool execution command line was detected. What is the file name of the process associated with that credential theft tool execution alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'cmd.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'cmd.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A possible attempt to access the Primary Refresh Token (PRT) was detected involving the process `browsercore.exe`, which is commonly abused by attackers to request PRT-derived tokens for lateral movement or credential theft.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The PRT access attempt was associated with the user account `tgs2z`, indicating the account''s token was targeted for credential theft.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Following the PRT access attempt, a known credential theft tool execution was detected through the process `cmd.exe`, whose command line indicated an intent to dump users'' credentials, keys, and plain-text passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
