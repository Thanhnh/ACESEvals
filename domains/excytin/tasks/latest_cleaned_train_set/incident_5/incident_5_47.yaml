tasks:
- task_id: incident_5_latest_cleaned_train_set_task_47
  title: incident_5_latest_cleaned_train_set_task_47
  description: 'For the alert where ''CommandAndControl'' malware was detected during lateral movement, what is the security identifier (SID) of the account associated with that detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, a known credential theft tool was executed on an endpoint: the file `mimikatz.exe` ran twice with the command line `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit` (process IDs 1044 and 3932, created on 2024-06-20). This activity chained into lateral movement via PSExec to the jump server, ransomware-like mass file extension changes, and finally the detection of ''CommandAndControl'' malware on a device that an attacker appeared to be moving laterally into.'
    question: 'For the alert where ''CommandAndControl'' malware was detected during lateral movement, what is the security identifier (SID) of the account associated with that detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1840191660-8534830288-125585561-1522'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1840191660-8534830288-125585561-1522'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed, dumping credentials for the account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker performed lateral movement via PSExec to the jump server from IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Possible ransomware activity based on a known malicious file extension was observed for the account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: '''CommandAndControl'' malware was detected during lateral movement to this device, associated with the account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
