tasks:
- task_id: incident_5_latest_cleaned_train_set_task_41
  title: incident_5_latest_cleaned_train_set_task_41
  description: 'In the alert about the renamed Windows Sysinternals tool, what file name was the tool renamed to when it was launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a human-operated ransomware incident, a ransomware payload was remotely launched on the device `vnevado-win11u` (AAD device ID `bc00e484-d0e5-4da4-9472-95568cccc07e`) using the compromised account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`). The attack chain also included lateral movement via PSExec to the jump server `Vnevado-jump`, and around the same time a Windows Sysinternals tool was found renamed and then launched, likely to covertly use it for malicious purposes.'
    question: 'In the alert about the renamed Windows Sysinternals tool, what file name was the tool renamed to when it was launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A ransomware payload was remotely launched on the device from the remote IP address `99.83.111.100`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker used PSExec to move laterally to the jump server host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that host, a Windows Sysinternals tool was renamed and launched as the file `mimikatz.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
