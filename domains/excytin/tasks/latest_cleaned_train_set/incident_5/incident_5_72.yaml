tasks:
- task_id: incident_5_latest_cleaned_train_set_task_72
  title: incident_5_latest_cleaned_train_set_task_72
  description: 'For the follow-up alert about possible ransomware activity based on a known malicious file extension, which user account was involved in that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware incident, suspicious file system changes indicative of mass encryption were detected on the host `vnevado-win11t` (AAD Device ID `e5799261-6720-4297-961e-bd9ca4275033`). Shortly afterwards, a related alert fired reporting numerous file system changes involving a file extension known from past ransomware incidents, suggesting mass encryption of files.'
    question: 'For the follow-up alert about possible ransomware activity based on a known malicious file extension, which user account was involved in that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The account named `dp5hn`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The account named `dp5hn`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Ransomware behavior was detected in the file system on host `vnevado-win11t`, indicating mass encryption of files.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The mass file changes appended a file extension known from past ransomware incidents, and this activity was performed by the account with Name `dp5hn`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
