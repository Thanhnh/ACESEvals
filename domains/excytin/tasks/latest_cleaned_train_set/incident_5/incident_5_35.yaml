tasks:
- task_id: incident_5_latest_cleaned_train_set_task_35
  title: incident_5_latest_cleaned_train_set_task_35
  description: 'A related alert in this incident reported active unknown malware running on the affected machine. What is the name of the malicious file detected in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'In this multi-stage ransomware incident, a suspicious ''GenRansom'' behavior was detected on the host `vnevado-win11t` (AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`). Follow-on activity included a ransomware payload being remotely launched and lateral movement via PSExec to the jump server, all tied back to the same compromised environment.'
    question: 'A related alert in this incident reported active unknown malware running on the affected machine. What is the name of the malicious file detected in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious ''GenRansom'' ransomware behavior was detected on the host `vnevado-win11t`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'A ransomware payload was remotely launched on the device from the remote IP address `99.83.111.100`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker used PSExec to move laterally to the jump server `Vnevado-jump` using the compromised account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Active unknown malware was detected on the device — the credential theft tool file `mimikatz.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
