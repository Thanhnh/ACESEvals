tasks:
- task_id: incident_5_latest_cleaned_train_set_task_78
  title: incident_5_latest_cleaned_train_set_task_78
  description: 'For the alert reporting that unknown malware was detected and was active, what is the name of the malicious file involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'In an incident attributed to the Manatee Tempest activity group — a Russia-based cybercriminal group known for the Dridex banking trojan, drive-by download/FakeUpdates infections, BLISTER loader, and Cobalt Strike beacons — analysts observed activity involving the URL `vectorsandarrows.com` and the IP address `198.43.121.209`. Following this, related alerts showed potentially compromised assets exhibiting ransomware-like behavior and lateral movement via PSExec to the jump server `Vnevado-jump`. Around the same time, Windows Defender reported that unknown malware was detected and was active on an affected device.'
    question: 'For the alert reporting that unknown malware was detected and was active, what is the name of the malicious file involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilib.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The host with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e` was compromised by the Manatee Tempest activity group, likely through a drive-by download/FakeUpdates infection.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Potentially compromised assets exhibiting ransomware-like behavior were observed involving the IP address `99.83.111.100`, indicating lateral movement across the network.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker used PSExec to move laterally to the jump server host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Unknown malware was detected and was active on the compromised assets, identified as the credential-theft file `mimilib.dll`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
