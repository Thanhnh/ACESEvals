tasks:
- task_id: incident_322_latest_cleaned_train_set_task_19
  title: incident_322_latest_cleaned_train_set_task_19
  description: 'In the related alert about the credential dump from NTDS.dit, what was the name of the executable used to perform the dump?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired for ''Suspicious Azure Resource Management activities by a risky user''. The activity was attributed to the account named `Hailey Johnson` (email `alyssat@vnevado.alpineskihouse.co`, SID `S-1-5-21-1840151686-3534835288-156286563-1127`, AAD user ID `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`) signing in from IP address `253.1.244.215`. Following the chain, this activity links to an Azure Resource Manager operation from a suspicious proxy IP address, and further to an on-premises alert about attackers dumping NTDS.dit to obtain domain user credentials from the domain controller.'
    question: 'In the related alert about the credential dump from NTDS.dit, what was the name of the executable used to perform the dump?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ntdsutil.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ntdsutil.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with SID `S-1-5-21-1840151686-3534835288-156286563-1127` signed in to a risky session and performed suspicious Azure Resource Management (ARM) activities at 2024-08-01 13:19:20 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The related Azure Resource Manager operation was performed from a suspicious proxy (TOR) IP address, and the activity was traced to the host `vnevado-dc` at 2024-08-01 13:09:13 UTC.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that same host, a suspicious credential dump from NTDS.dit was detected at 2024-08-01 12:49:26 UTC, where the attacker used the process with extracted file name `ntdsutil.exe` to dump the domain controller''s credential database.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
