tasks:
- task_id: incident_322_latest_cleaned_train_set_task_3
  title: incident_322_latest_cleaned_train_set_task_3
  description: 'For the Ntdsutil alert in this incident, what was the process ID, creation time, and full command line of the process that was launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised for email messages containing a malicious URL that were delivered and later removed. The email was sent from `raphaelt@vnevado.alpineskihouse.co` (sender IP `202.205.215.225`) to the mailbox `alyssat@vnevado.alpineskihouse.co`, and contained the URL `dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io`. Pivoting from the compromised account, related activity was observed including an Azure Resource Manager operation from a suspicious proxy IP address, and on an affected domain controller an alert fired for Ntdsutil collecting Active Directory information — a technique attackers use to gather AD data for persistence or lateral movement.'
    question: 'For the Ntdsutil alert in this incident, what was the process ID, creation time, and full command line of the process that was launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 6748, Created Time (UTC): 2024-08-01T12:37:30.2769191Z, Command line: "ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 6748, Created Time (UTC): 2024-08-01T12:37:30.2769191Z, Command line: "ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The email account `Hailey Johnson` received an email containing a malicious URL, which was delivered and later removed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'An Azure Resource Manager operation was performed from a suspicious proxy IP address, involving the host `vnevado-dc`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that host, the attacker launched Ntdsutil to collect Active Directory information with the command line `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q` at `2024-08-01t12:37:30.2769191z`, with Process ID `6748`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
