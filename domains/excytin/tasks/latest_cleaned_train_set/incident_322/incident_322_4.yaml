tasks:
- task_id: incident_322_latest_cleaned_train_set_task_4
  title: incident_322_latest_cleaned_train_set_task_4
  description: 'In that proxy log alert, apart from the connection source address 231.60.52.209, what other IP address was captured as an entity of the alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident at vnevado.alpineskihouse.co, an alert titled "Email messages containing malicious URL removed after delivery" was raised on 2024-08-01. The email was sent by `raphaelt@vnevado.alpineskihouse.co` from sender IP `202.205.215.225` to the mailbox `alyssat@vnevado.alpineskihouse.co`, and it contained the malicious URL `dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io`. Following this, the malicious URL was clicked on an endpoint, and a subsequent alert, "Malicious Url detected in Proxy logs", reported a connection from `231.60.52.209` - vnevado-win11h.vnevado.alpineskihouse.co to login.micro.demo.antoinetest.ovh seen on the proxy.'
    question: 'In that proxy log alert, apart from the connection source address 231.60.52.209, what other IP address was captured as an entity of the alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '228.3.31.94'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '228.3.31.94'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The email account `alyssat@vnevado.alpineskihouse.co` received an email containing a malicious URL, which was later removed after delivery.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The malicious URL was clicked on the device with HostName `vnevado-win11h`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The click generated a connection to the malicious URL `login.micro.demo.antoinetest.ovh` that was detected in the proxy logs, associated with the IP address `228.3.31.94`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
