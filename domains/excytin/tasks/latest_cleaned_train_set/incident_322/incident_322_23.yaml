tasks:
- task_id: incident_322_latest_cleaned_train_set_task_23
  title: incident_322_latest_cleaned_train_set_task_23
  description: 'A related alert on the same host shows Ntdsutil being used to collect Active Directory information. What was the process ID and the exact command line used in that Ntdsutil execution, and when was that process created?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage intrusion, an alert for ''Suspicious credential dump from NTDS.dit'' fired on host `vnevado-dc` at 2024-08-01 12:49 UTC. The alert involved `powershell.exe` running a long base64 -encodedcommand that referenced creating a full copy of the AD database into a temporary folder and then uploading it. Attackers dump NTDS.dit in order to obtain user credentials stored on the domain controller.'
    question: 'A related alert on the same host shows Ntdsutil being used to collect Active Directory information. What was the process ID and the exact command line used in that Ntdsutil execution, and when was that process created?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 6748, Command line: "ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q, Created time (UTC): 2024-08-01T12:37:30.2769191Z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 6748, Command line: "ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q, Created time (UTC): 2024-08-01T12:37:30.2769191Z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious credential dump from NTDS.dit was detected, executed via the process `powershell.exe` at 2024-08-01 12:49:26 UTC, indicating the attacker attempted to obtain domain user credentials stored on the domain controller.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the credential dump, the attacker launched Ntdsutil to collect Active Directory information with the command line `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q`, with Process ID `6748` created at `2024-08-01t12:37:30.2769191z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
