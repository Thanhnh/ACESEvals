tasks:
- task_id: incident_322_latest_cleaned_train_set_task_12
  title: incident_322_latest_cleaned_train_set_task_12
  description: 'Pivoting on these account identifiers across the other alerts in this incident, what is the display name of the compromised user account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Suspicious Azure Resource Management activities by a risky user" was raised on 2024-08-01 at 13:19:20 UTC. It indicated that suspicious cloud Azure Resource Management (ARM) operations were performed from IP address `253.1.244.215` by an account that had signed into a risky session. The account was identified by the on-premises SID `S-1-5-21-1840151686-3534835288-156286563-1127` and the Microsoft Entra ID (AAD) user ID `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`.'
    question: 'Pivoting on these account identifiers across the other alerts in this incident, what is the display name of the compromised user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Hailey Johnson'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Hailey Johnson'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account signed in to a risky session and performed suspicious Azure Resource Management (ARM) activities, triggering the alert ''Suspicious Azure Resource Management activities by a risky user'' at 2024-08-01 13:19:20 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The account involved in these suspicious Azure Resource Management activities is the user with Name `Hailey Johnson`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
