tasks:
- task_id: incident_322_latest_cleaned_train_set_task_7
  title: incident_322_latest_cleaned_train_set_task_7
  description: 'For the follow-on alert about the Azure Resource Manager operation performed from the suspicious proxy IP address, which Azure resource group was targeted?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an alert from Microsoft Defender for Office 365 showed that a user clicked on the link `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/` contained in an email that was later quarantined by zero-hour auto purge (ZAP). Shortly afterwards, Microsoft Defender for Resource Manager detected an Azure Resource Manager operation coming from an IP address associated with proxy services such as TOR, which threat actors often use to hide their source IP.'
    question: 'For the follow-on alert about the Azure Resource Manager operation performed from the suspicious proxy IP address, which Azure resource group was targeted?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The Azure resource group `ctfcat`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The Azure resource group `ctfcat`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Hailey Johnson` clicked on a link in an email that was later quarantined by zero-hour auto purge (ZAP).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, a suspicious Azure Resource Manager operation was performed from a proxy (e.g., TOR) IP address against the Azure resource group `ctfcat`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
