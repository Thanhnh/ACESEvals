tasks:
- task_id: incident_322_latest_cleaned_train_set_task_16
  title: incident_322_latest_cleaned_train_set_task_16
  description: 'For the suspicious NTDS.dit credential dump alert, which process executable was involved, what was its process ID, and what notable command-line switch was used to obfuscate the payload?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled "Email messages containing malicious URL removed after delivery" was raised on 2024-08-01 12:44:53 UTC. The email was sent from `raphaelt@vnevado.alpineskihouse.co` (sender IP `202.205.215.225`) to the mailbox `alyssat@vnevado.alpineskihouse.co`, and contained the malicious URL `dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io`. Following this, the attack progressed on a domain controller where an alert for a suspicious credential dump from NTDS.dit was triggered at 12:49:26 UTC.'
    question: 'For the suspicious NTDS.dit credential dump alert, which process executable was involved, what was its process ID, and what notable command-line switch was used to obfuscate the payload?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The process was `powershell.exe` with Process ID 2556 (created at 2024-08-01T12:37:29.6522416Z), launched with the `-encodedcommand` switch containing a long Base64-encoded PowerShell payload.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The process was `powershell.exe` with Process ID 2556 (created at 2024-08-01T12:37:29.6522416Z), launched with the `-encodedcommand` switch containing a long Base64-encoded PowerShell payload.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Hailey Johnson` received an email containing a malicious URL, which was later removed after delivery.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'An Azure Resource Manager operation was performed from a suspicious proxy (TOR-associated) IP address on the host `vnevado-dc`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that host, a suspicious credential dump from NTDS.dit was performed by the process with Process ID `2556`, created at `2024-08-01t12:37:29.6522416z`, running the encoded PowerShell command line `"powershell.exe" -encodedcommand `, which used ntdsutil to create an IFM copy of the AD database, downloaded Rubeus, and exfiltrated the ntds.dit file to an Azure storage blob.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
