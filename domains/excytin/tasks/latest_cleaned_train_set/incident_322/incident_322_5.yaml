tasks:
- task_id: incident_322_latest_cleaned_train_set_task_5
  title: incident_322_latest_cleaned_train_set_task_5
  description: 'For the alert about Ntdsutil collecting Active Directory information, what was the process ID, creation time, and full command line of the launched process?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a user clicked on a link in an email (`https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`) that was later quarantined by zero-hour auto purge (ZAP), as reported by Microsoft Defender for Office 365. Following this, the attacker''s activity spread further, including an Azure Resource Manager operation from a suspicious proxy IP address and activity on a domain controller where Ntdsutil was observed collecting Active Directory information.'
    question: 'For the alert about Ntdsutil collecting Active Directory information, what was the process ID, creation time, and full command line of the launched process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 6748, Created Time (UTC): 2024-08-01T12:37:30.2769191Z, Command Line: `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 6748, Created Time (UTC): 2024-08-01T12:37:30.2769191Z, Command Line: `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Hailey Johnson` clicked on a link in an email that was later quarantined by zero-hour auto purge (ZAP).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'An Azure Resource Manager operation was performed from a suspicious proxy IP address on host `vnevado-dc`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that host, the attacker launched ntdsutil to collect Active Directory information with the command line `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q` at `2024-08-01t12:37:30.2769191z`, with Process ID `6748`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
