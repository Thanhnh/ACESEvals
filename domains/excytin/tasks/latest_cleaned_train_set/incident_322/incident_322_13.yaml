tasks:
- task_id: incident_322_latest_cleaned_train_set_task_13
  title: incident_322_latest_cleaned_train_set_task_13
  description: 'For the alert about suspicious Azure Resource Management activities by the risky user, what was the source IP address from which those activities were performed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a potentially malicious URL click was detected after a phishing email was delivered to the recipient `alyssat@vnevado.alpineskihouse.co`. The related email messages containing the malicious URL were later removed after delivery, and the affected user account was subsequently observed performing suspicious Azure Resource Management (ARM) activities from a risky sign-in session, as flagged by Microsoft Defender for Cloud and Microsoft Entra ID Protection risk scores.'
    question: 'For the alert about suspicious Azure Resource Management activities by the risky user, what was the source IP address from which those activities were performed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '253.1.244.215'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '253.1.244.215'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A potentially malicious URL click was detected in an email delivered to the recipient `alyssat@vnevado.alpineskihouse.co` at 2024-08-01 12:44:53 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Emails containing the malicious URL were also delivered to the account `Hailey Johnson` and later removed after delivery.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Following the compromise, suspicious Azure Resource Management activities were performed by a risky user from the IP address `253.1.244.215` at 2024-08-01 13:19:20 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
