tasks:
- task_id: incident_322_latest_cleaned_train_set_task_21
  title: incident_322_latest_cleaned_train_set_task_21
  description: 'For that Azure Resource Manager operation performed from the suspicious proxy IP address, what is the full ResourceId of the Azure resource that was targeted?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident at vnevado.alpineskihouse.co, an alert fired for "Email messages containing malicious URL removed after delivery". The email was sent from `raphaelt@vnevado.alpineskihouse.co` (sender IP `202.205.215.225`) to the mailbox `alyssat@vnevado.alpineskihouse.co`, and contained the malicious URL `dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io`. Roughly 25 minutes later, the same compromised identity was linked to a Microsoft Defender for Resource Manager alert, where an Azure Resource Manager operation was performed from an IP address associated with proxy/anonymization services such as TOR.'
    question: 'For that Azure Resource Manager operation performed from the suspicious proxy IP address, what is the full ResourceId of the Azure resource that was targeted?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.network/networkinterfaces/vnevado-dc-nic'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.network/networkinterfaces/vnevado-dc-nic'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The email account `alyssat@vnevado.alpineskihouse.co` received an email containing a malicious URL, which was delivered and later removed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, a suspicious Azure Resource Manager operation was performed from a proxy (e.g., TOR) IP address, targeting the Azure resource with ResourceId `/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.network/networkinterfaces/vnevado-dc-nic`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
