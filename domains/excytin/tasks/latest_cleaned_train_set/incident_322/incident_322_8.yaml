tasks:
- task_id: incident_322_latest_cleaned_train_set_task_8
  title: incident_322_latest_cleaned_train_set_task_8
  description: 'For that Ntdsutil-related endpoint alert, what was the process ID and creation time (UTC) of the process that executed the encoded command?'
  inherit_shared: true
  initial_context:
    incident_context: 'In this incident, an alert titled ''Suspicious Azure Resource Management activities by a risky user'' was raised on 2024-08-01 13:19:20 UTC. It involved the account `Hailey Johnson` (email `alyssat@vnevado.alpineskihouse.co`, SID `S-1-5-21-1840151686-3534835288-156286563-1127`, AAD user ID `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`) signing in from IP address `253.1.244.215`. Pivoting on that same source IP leads to another alert, ''Azure Resource Manager operation from suspicious proxy IP address'', which in turn shares an affected host with an earlier endpoint alert, ''Ntdsutil collecting Active Directory information'', where a script interpreter was used to run an obfuscated command against Active Directory.'
    question: 'For that Ntdsutil-related endpoint alert, what was the process ID and creation time (UTC) of the process that executed the encoded command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 2556, Created Time (UTC): 2024-08-01T12:37:29.6522416Z (this was `powershell.exe` executed with the `-encodedcommand` parameter containing a Base64-encoded script)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 2556, Created Time (UTC): 2024-08-01T12:37:29.6522416Z (this was `powershell.exe` executed with the `-encodedcommand` parameter containing a Base64-encoded script)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A risky user performed suspicious Azure Resource Management (ARM) activities originating from the IP address `253.1.244.215`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The same Azure Resource Manager operations were traced to a suspicious proxy (TOR-like) IP address, associated with activity on the host `vnevado-dc`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that host, the attacker launched an encoded PowerShell command to collect Active Directory information via Ntdsutil, with Process ID `2556`, created at `2024-08-01t12:37:29.6522416z`, command line `"powershell.exe" -encodedcommand `.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
