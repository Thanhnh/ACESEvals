tasks:
- task_id: incident_322_latest_cleaned_train_set_task_1
  title: incident_322_latest_cleaned_train_set_task_1
  description: 'Within that Azure subscription, what is the name of the resource group that contained the resources (such as the network interface and the VM auto-shutdown schedule) manipulated during this suspicious operation?'
  inherit_shared: true
  initial_context:
    incident_context: 'Microsoft Defender for Resource Manager raised an alert titled "Azure Resource Manager operation from suspicious proxy IP address" on 2024-08-01 at 13:09 UTC, indicating that a resource management operation was performed from IP address `253.1.244.215`, which is associated with anonymizing proxy services such as TOR. While this behavior can be legitimate, it is often seen when threat actors try to hide their source IP. The activity was tied to the account of Hailey Johnson (`alyssat@vnevado.alpineskihouse.co`, AAD user ID `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`, SID `S-1-5-21-1840151686-3534835288-156286563-1127`) and involved resources associated with the host `vnevado-dc` under Azure subscription `7e838342-601f-4552-9baf-0dfb300cf555`.'
    question: 'Within that Azure subscription, what is the name of the resource group that contained the resources (such as the network interface and the VM auto-shutdown schedule) manipulated during this suspicious operation?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ctfcat'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ctfcat'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'At 2024-08-01 13:09:13 UTC, Microsoft Defender for Resource Manager detected an Azure Resource Manager operation originating from an IP address associated with anonymizing proxy services such as TOR, indicating a threat actor attempting to hide their source IP.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The suspicious resource management operation was performed against Azure resources belonging to the resource group with ResourceGroup `ctfcat`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
