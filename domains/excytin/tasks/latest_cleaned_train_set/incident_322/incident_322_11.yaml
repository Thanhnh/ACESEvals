tasks:
- task_id: incident_322_latest_cleaned_train_set_task_11
  title: incident_322_latest_cleaned_train_set_task_11
  description: 'For the alert reporting the potentially malicious URL click, what is the email address of the recipient who received and clicked the malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we found that a user clicked on the link `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/` contained in an email that was later quarantined by zero-hour auto purge (ZAP), based on a Microsoft Defender for Office 365 alert. Related alerts show emails containing this malicious URL were delivered and then removed after delivery, and a potentially malicious URL click was detected for one of our users.'
    question: 'For the alert reporting the potentially malicious URL click, what is the email address of the recipient who received and clicked the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Hailey Johnson` clicked on a link in an email that was later quarantined by zero-hour auto purge (ZAP).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'An email containing a malicious URL was delivered to the recipient mailbox `alyssat@vnevado.alpineskihouse.co` and later removed after delivery.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A potentially malicious URL click was detected for the recipient `alyssat@vnevado.alpineskihouse.co`, who clicked the malicious link in the delivered email.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
