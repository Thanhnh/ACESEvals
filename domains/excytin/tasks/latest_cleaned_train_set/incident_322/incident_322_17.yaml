tasks:
- task_id: incident_322_latest_cleaned_train_set_task_17
  title: incident_322_latest_cleaned_train_set_task_17
  description: 'For the follow-up alert where the malicious URL was clicked on a device, what is the IP address associated with that device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage incident at vnevado.alpineskihouse.co, an alert titled "Email messages containing malicious URL removed after delivery" was raised on 2024-08-01 12:44:53 UTC. The email was sent from `raphaelt@vnevado.alpineskihouse.co` (sender IP `202.205.215.225`) to the mailbox `alyssat@vnevado.alpineskihouse.co`, and it contained the malicious URL `dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io`. Roughly an hour later, at 2024-08-01 13:49:58 UTC, a follow-up alert reported that this malicious URL was actually clicked on a device.'
    question: 'For the follow-up alert where the malicious URL was clicked on a device, what is the IP address associated with that device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '172.33.118.200'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '172.33.118.200'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The email account `alyssat@vnevado.alpineskihouse.co` received an email containing a malicious URL, which was delivered and later removed at 2024-08-01 12:44:53 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The malicious URL was then clicked on a device with IP address `172.33.118.200` at 2024-08-01 13:49:58 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
