tasks:
- task_id: incident_322_latest_cleaned_train_set_task_20
  title: incident_322_latest_cleaned_train_set_task_20
  description: 'In the follow-up alert where the user clicked the link before ZAP quarantined the email, what was the full URL that was accessed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired for ''Email messages containing malicious URL removed after delivery'' - emails were delivered and later removed. The message was sent from `raphaelt@vnevado.alpineskihouse.co` (sender IP `202.205.215.225`) to the mailbox of recipient `alyssat@vnevado.alpineskihouse.co`. About ten minutes later, a follow-up alert showed that a user had already accessed a link in an email that was subsequently quarantined by zero-hour auto purge (ZAP), based on a Microsoft Defender for Office 365 alert.'
    question: 'In the follow-up alert where the user clicked the link before ZAP quarantined the email, what was the full URL that was accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-1840151686-3534835288-156286563-1127` received an email containing a malicious URL, which was later removed after delivery at 2024-08-01 12:44:53 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same user then clicked on the link in that email, accessing the malicious URL `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`, which was subsequently quarantined by zero-hour auto purge (ZAP) at 2024-08-01 12:54:55 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
