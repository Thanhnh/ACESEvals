tasks:
- task_id: incident_322_latest_cleaned_train_set_task_9
  title: incident_322_latest_cleaned_train_set_task_9
  description: 'Immediately preceding this Ntdsutil activity on the same host, a related process was launched using a Base64 `-encodedcommand` payload. What is the process ID and creation time (UTC) of that encoded-command process?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, the tool `ntdsutil.exe` was observed on host `vnevado-dc` running with the command line `"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q` under process ID 6748 at 2024-08-01T12:37:30.2769191Z. This behavior suggests an attacker was using Ntdsutil to collect Active Directory information for persistence or lateral movement.'
    question: 'Immediately preceding this Ntdsutil activity on the same host, a related process was launched using a Base64 `-encodedcommand` payload. What is the process ID and creation time (UTC) of that encoded-command process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 2556, Created Time (UTC): 2024-08-01T12:37:29.6522416Z (a `powershell.exe` process launched with the `-encodedcommand` parameter)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 2556, Created Time (UTC): 2024-08-01T12:37:29.6522416Z (a `powershell.exe` process launched with the `-encodedcommand` parameter)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An alert for "Ntdsutil collecting Active Directory information" was raised at 2024-08-01 12:54:34 UTC, indicating that Ntdsutil was used to dump the Active Directory database (ntds.dit).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The activity was traced to a process entity with Field `ProcessId__CreatedTimeUtc__CommandLine` and Value `2556__2024-08-01t12:37:29.6522416z__"powershell.exe" -encodedcommand iabuahqazabzahuadabpagwalgblahgazqagaccayqbjacaaaqagag4adabkahmajwagaccaaqbmag0ajwagaccaywbyaguayqb0aguaiabmahuababsacaaywa6afwadablag0acaanacaacqagaheaowa...` — a PowerShell process (Process ID `2556`, created at `2024-08-01t12:37:29.6522416z`) launched with a Base64-encoded command to hide its intent.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Decoding the encoded command reveals it ran `ntdsutil.exe "ac i ntds" ifm "create full c:\temp" q q` to create a full copy of the AD database, then downloaded additional tooling and used the Az.Storage/Az.Accounts modules to upload the resulting `ntds.dit` file (disguised as `Image003.jpg`) to an Azure storage container, indicating credential theft and exfiltration.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
