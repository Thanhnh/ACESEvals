  title: incident_322_latest_cleaned_train_set_task_15
  description: 'For the related alert on suspicious Azure Resource Management activities by a risky user, what IP address was the activity performed from?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert was raised for a malicious URL `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/` that was clicked on the device `vnevado-win11h` (AAD Device ID `76707c40-3343-490e-9205-88fdb51aefe0`, IP `172.33.118.200`). The click was observed through Microsoft Edge, with process details `4256__2024-08-01t13:42:52.04__"msedge.exe" --type=utility --utility-sub-type=network.mojom.networkservice --lang=en-us --service-sandbox-type=none --field-trial-handle=1912,i,9358546549091360037,1317674413260171076,262144 --variations-seed-version --mojo-platform-channel-handle=3124 /prefetch:11`. Pivoting on the user account (SID) tied to this device activity leads to an earlier alert about suspicious Azure Resource Management (ARM) activities performed by that same user from a risky sign-in session.'
    question: 'For the related alert on suspicious Azure Resource Management activities by a risky user, what IP address was the activity performed from?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '253.1.244.215'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
