        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-1840151686-3534835288-156286563-1127` clicked on a malicious URL on the device at 2024-08-01 13:49:58 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious Azure Resource Management activities were performed by this risky user account from the IP address `253.1.244.215` at 2024-08-01 13:19:20 UTC.'
