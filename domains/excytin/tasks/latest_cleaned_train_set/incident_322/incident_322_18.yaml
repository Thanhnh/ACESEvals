tasks:
- task_id: incident_322_latest_cleaned_train_set_task_18
  title: incident_322_latest_cleaned_train_set_task_18
  description: 'What is the URL of the link that the user clicked in the email that was subsequently quarantined by ZAP?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised for ''Suspicious Azure Resource Management activities by a risky user'' at 2024-08-01 13:19:20 UTC, where suspicious cloud ARM activities were performed by a user account that signed in to a risky session from the IP address `253.1.244.215`. Earlier in the same incident, at 2024-08-01 12:54:55 UTC, the same user account was seen clicking on a link in an email that was later quarantined by zero-hour auto purge (ZAP), as reported by Microsoft Defender for Office 365.'
    question: 'What is the URL of the link that the user clicked in the email that was subsequently quarantined by ZAP?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Hailey Johnson` signed in to a risky session and performed suspicious Azure Resource Management (ARM) activities, flagged at 2024-08-01 13:19:20 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Investigating this risky user''s activity shows that earlier, at 2024-08-01 12:54:55 UTC, the user clicked a link in an email that was later quarantined by zero-hour auto purge (ZAP).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The malicious link accessed by the user was the URL `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`.'
