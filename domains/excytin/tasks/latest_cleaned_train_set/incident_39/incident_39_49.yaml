tasks:
- task_id: incident_39_latest_cleaned_train_set_task_49
  title: incident_39_latest_cleaned_train_set_task_49
  description: 'What is the email address of the account associated with the suspected overpass-the-hash (Kerberos) alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a script `domaindominance27.ps1` was executed via `powershell.exe` (Process ID 4676, command line: `"powershell.exe" -executionpolicy bypass -file c:\users\tgs2z\downloads\domaindominance27\domaindominance27.ps1`) under the account `tgs2z` on host `vnevado-win10v` (AAD Device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`). This activity dropped multiple dual-purpose tools, including `psexec.exe` and `mimikatz.exe`, which attackers commonly use for credential theft, privilege escalation, and lateral movement. Following this, ''Kekeo'' malware was detected on the same device, and shortly after, a suspected overpass-the-hash (Kerberos) attack was raised where a Helpdesk Administrator on VNEVADO-Win10V attempted to authenticate against VNEVADO-DC.'
    question: 'What is the email address of the account associated with the suspected overpass-the-hash (Kerberos) alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Multiple dual-purpose tools were dropped on the device, including the file `rubeus.exe`, which can be used for credential theft and privilege escalation.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The ''Kekeo'' malware was detected during lateral movement, associated with the account with SID `S-1-5-21-1540151660-3530000288-105586595-1517`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A suspected overpass-the-hash (Kerberos) attack was performed by the compromised account with email `fk8mq@vnevado.alpineskihouse.co` (Emma Clark, Helpdesk Administrator) on VNEVADO-Win10V against VNEVADO-DC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
