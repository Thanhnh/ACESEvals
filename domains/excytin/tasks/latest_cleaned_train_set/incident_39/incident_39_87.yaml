tasks:
- task_id: incident_39_latest_cleaned_train_set_task_87
  title: incident_39_latest_cleaned_train_set_task_87
  description: 'In the alert about the malicious credential theft tool execution, which remote host/URL was referenced as the target of the credential dumping activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a ''Possible lateral movement'' alert was raised on host `vnevado-win10b` (AAD Device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), indicating an attacker may be moving across devices to gather data or elevate privileges. Following this, a sign-in attempt with a deceptive (decoy) user account was detected, and shortly afterwards a known credential theft tool execution command line was detected, whose process or command line showed intent to dump users'' credentials, keys and plain-text passwords.'
    question: 'In the alert about the malicious credential theft tool execution, which remote host/URL was referenced as the target of the credential dumping activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-dc.vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-dc.vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Possible lateral movement was observed involving a suspicious network event with IP address `35.202.74.47`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A sign-in attempt with a deceptive user account was detected for the account with SID `S-5-7-21-1843151660-3234030288-105586167-1422`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A malicious credential theft tool execution was detected, targeting the domain controller at URL `vnevado-dc.vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
