tasks:
- task_id: incident_39_latest_cleaned_train_set_task_42
  title: incident_39_latest_cleaned_train_set_task_42
  description: 'In the related ''Suspicious service launched'' alert, what is the name of the parent process file responsible for starting the suspicious service?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident, alerts flagged possible use of the Rubeus kerberoasting tool on host `vnevado-win10v` (AAD device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`). The activity involved account `tgs2z` running `powershell.exe c:\m365dattack\get-krbticket.ps1` (PID 6636) and `psexec.exe` (PID 5924) with the command line `"psexec.exe" \\vnevado-win10b -accepteula cmd /c "c:\temp\rubeus.exe dump /service:xfbzkp /user:lucasb > c:\temp\adminticket.txt"`. Shortly after, a related alert reported that a suspicious service was started on a device, a technique attackers use to launch malicious commands and maintain persistence or elevate privileges.'
    question: 'In the related ''Suspicious service launched'' alert, what is the name of the parent process file responsible for starting the suspicious service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The Rubeus kerberoasting tool was used on the endpoint, producing an output file `adminticket.txt` containing the harvested Kerberos ticket.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The Rubeus activity was observed on the host with AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that same device, a suspicious service was launched via the process `services.exe`, which attackers use to run malicious commands for persistence or privilege escalation.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
