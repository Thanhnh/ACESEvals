tasks:
- task_id: incident_39_latest_cleaned_train_set_task_94
  title: incident_39_latest_cleaned_train_set_task_94
  description: 'For the alert reporting the active ''Kekeo'' malware detection, which user account security identifier (SID) was associated with it?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled "File dropped and launched from remote location" was raised on host `vnevado-dc`, where a remote session dropped and executed `psexesvc.exe` (Process ID 7668, created 2024-06-27T14:34:10Z) under the account `lucasb` (SID `S-1-5-21-1440151660-4837038288-105596163-1120`, AAD User ID `7fcf9695-68fc-4258-864d-e1e5b166c66f`). This activity was followed by a sequence of alerts indicative of potential human-operated malicious activity on the same device, ultimately leading to a detection of active ''Kekeo'' malware.'
    question: 'For the alert reporting the active ''Kekeo'' malware detection, which user account security identifier (SID) was associated with it?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1540151660-3530000288-105586595-1517'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1540151660-3530000288-105586595-1517'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A remote session from IP address `141.216.110.153` dropped a file on the device and executed it, indicating possible lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The dropped payload was launched as a credential theft tool: process ID `2608` created at `2024-06-27t14:33:27.7927134z` with command line `rubeus.exe dump /service:xfbzkp /user:lucasb`, part of a sequence of alerts indicating potential human-operated malicious activity.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'This activity was associated with an active ''Kekeo'' malware detection on the account with SID `S-1-5-21-1540151660-3530000288-105586595-1517`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
