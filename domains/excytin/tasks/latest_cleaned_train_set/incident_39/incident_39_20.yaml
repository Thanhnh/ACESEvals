tasks:
- task_id: incident_39_latest_cleaned_train_set_task_20
  title: incident_39_latest_cleaned_train_set_task_20
  description: 'For the Microsoft Defender Antivirus tampering alert linked to this attack chain, what is the account name (username) recorded on that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a "Suspected identity theft (pass-the-ticket)" alert was raised: an actor stole the Kerberos ticket of Julian Burke (IT director), whose account details include SID `S-1-5-21-1440151660-4837038288-105596163-1120`, Azure AD user ID `7fcf9695-68fc-4258-864d-e1e5b166c66f` and email `lucasb@vnevado.alpineskihouse.co`, from the host `VNEVADO-Win10B` and reused it on another workstation to access 4 resources. Pivoting from that workstation, a "Suspected overpass-the-hash attack (Kerberos)" alert shows a Helpdesk Administrator account attempting to authenticate against VNEVADO-DC, and that same user identity is also tied to an earlier defense evasion attempt where the Microsoft Defender Antivirus service was tampered with to evade detection.'
    question: 'For the Microsoft Defender Antivirus tampering alert linked to this attack chain, what is the account name (username) recorded on that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspected identity theft (pass-the-ticket) attack was detected on host `VNEVADO-DC`, where Julian Burke''s Kerberos ticket was stolen from VNEVADO-Win10B and reused on VNEVADO-Win10V to access 4 resources.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspected overpass-the-hash (Kerberos) attack followed, in which the account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677` (Emma Clark, Helpdesk Administrator) on VNEVADO-Win10V attempted to authenticate against VNEVADO-DC.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Using the compromised access, the account with Name `fk8mq` attempted to disable the Microsoft Defender Antivirus service, indicating antivirus tampering to evade detection.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
