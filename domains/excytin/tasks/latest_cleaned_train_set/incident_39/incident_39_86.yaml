tasks:
- task_id: incident_39_latest_cleaned_train_set_task_86
  title: incident_39_latest_cleaned_train_set_task_86
  description: 'For the Microsoft Defender Antivirus tampering alert on this device, what is the name of the file associated with that tampering attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on the device `vnevado-win10b` (Azure AD device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), an alert was raised for a suspicious file registered as a service, an action often used by attackers to gain persistence. The activity was associated with the user account `fk8mq` (SID `S-1-5-21-1540151660-3530000288-105586595-1517`, AAD user ID `97e6a954-b6bd-48a5-808c-bd8464cce677`), the `LocalSystem` account (SID `S-0-6-5`), and the IP address `141.216.110.153`. Around the same time, multiple known dual-purpose tools were dropped on the same device, and an attempt to disable the Microsoft Defender Antivirus service was detected, suggesting the attacker was trying to evade detection.'
    question: 'For the Microsoft Defender Antivirus tampering alert on this device, what is the name of the file associated with that tampering attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-krbticket.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The attacker registered the suspicious file `psexesvc.exe` as a service on the device for persistence and remote execution.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` dropped multiple dual-purpose tools on the device, which could be used for credential theft, privilege escalation, and lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The file `get-krbticket.ps1` was involved in an attempt to disable the Microsoft Defender Antivirus service, indicating antivirus tampering to evade detection.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
