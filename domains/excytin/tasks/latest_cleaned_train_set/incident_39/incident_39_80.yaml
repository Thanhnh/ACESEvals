tasks:
- task_id: incident_39_latest_cleaned_train_set_task_80
  title: incident_39_latest_cleaned_train_set_task_80
  description: 'For the closely related alert where a file was dropped and launched from a remote location, what is the IP address associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage intrusion, a ''Possible lateral movement'' alert was raised at 2024-07-04 22:35:01 UTC after suspicious network activity involving the IP address `35.202.74.47` was observed on a device, in close time proximity to lateral movement seen on another device. Pivoting from the affected device, an almost simultaneous alert titled ''File dropped and launched from remote location'' was raised, indicating that a remote session dropped a file and executed it in an attempt to move laterally or propagate.'
    question: 'For the closely related alert where a file was dropped and launched from a remote location, what is the IP address associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '141.216.110.153'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '141.216.110.153'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Possible lateral movement was observed on the device with AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`, indicating an attacker may be moving across devices to gather data or elevate privileges.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A remote session originating from the IP address `141.216.110.153` dropped a file and executed it on the device, showing the attacker''s lateral movement or propagation attempt.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
