tasks:
- task_id: incident_39_latest_cleaned_train_set_task_74
  title: incident_39_latest_cleaned_train_set_task_74
  description: 'For the alert about the malicious credential theft tool execution, what is the name of the account associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a suspected DCSync attack (replication of directory services) was detected, where Julian Burke (IT director, `lucasb@vnevado.alpineskihouse.co`) on VNEVADO-Win10V sent a replication request to VNEVADO-DC. Tracing this activity back further, a suspicious service was launched on a device, which in turn led to the detection of a known credential theft tool execution whose command line indicated an intent to dump users'' credentials, keys, and plain-text passwords.'
    question: 'For the alert about the malicious credential theft tool execution, what is the name of the account associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspected DCSync attack (replication of directory services) was detected, where the account with AadUserId `7fcf9695-68fc-4258-864d-e1e5b166c66f` (Julian Burke, IT director) on VNEVADO-Win10V sent a replication request to VNEVADO-DC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On the compromised device, a suspicious service was launched using the process `powershell.exe`, which attackers commonly use to run malicious commands and maintain persistence or elevate privileges.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'That activity led to the execution of a known credential theft tool, detected under the account named `tgs2z`, indicating an attempt to dump users'' credentials, keys, and plain-text passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
