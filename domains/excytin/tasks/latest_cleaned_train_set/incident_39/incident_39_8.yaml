tasks:
- task_id: incident_39_latest_cleaned_train_set_task_8
  title: incident_39_latest_cleaned_train_set_task_8
  description: 'In the related alert reporting that multiple dual-purpose tools were dropped on this device, what is the name of the dropped PowerShell script file?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert for a ''Suspicious service launched'' was raised, showing that `services.exe` (Process ID 652, created 2024-06-19T12:56:00.7201251Z) started a suspicious service with `psexesvc.exe` (Process ID 7668, created 2024-06-27T14:34:10.0201983Z). Attackers commonly use services in this way to launch malicious commands or programs in order to maintain persistence or elevate privileges. Related alerts on the same device include a SID history injection and an alert indicating that multiple known public dual-purpose tools were dropped, which could be used for credential theft, privilege escalation, and lateral movement.'
    question: 'In the related alert reporting that multiple dual-purpose tools were dropped on this device, what is the name of the dropped PowerShell script file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'domaindominance27.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'domaindominance27.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious service was launched on the host `vnevado-dc`, indicating attackers using services to run malicious commands for persistence or privilege escalation.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On that device, a SID history injection was detected involving the process `powershell.exe`, used to grant an existing domain user elevated privileges.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Multiple dual-purpose tools were dropped on the device, including the file `domaindominance27.ps1`, which can be used for credential theft, privilege escalation, and lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
