tasks:
- task_id: incident_39_latest_cleaned_train_set_task_19
  title: incident_39_latest_cleaned_train_set_task_19
  description: 'For the suspected pass-the-ticket (identity theft) alert in this incident, what is the security identifier (SID) of the account whose Kerberos ticket was stolen and reused?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert from Microsoft Defender for Office 365 showed that a user clicked on a link, `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/`, inside an email that had already been quarantined by zero-hour auto purge (ZAP). Follow-on activity from this compromise included reconnaissance of SMB sessions against the domain controller VNEVADO-DC, and later a suspected identity theft where an actor stole a Kerberos ticket from one workstation and replayed it on another to access several resources.'
    question: 'For the suspected pass-the-ticket (identity theft) alert in this incident, what is the security identifier (SID) of the account whose Kerberos ticket was stolen and reused?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1440151660-4837038288-105596163-1120 (Julian Burke, IT director)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1440151660-4837038288-105596163-1120 (Julian Burke, IT director)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The user with email `tgs2z@vnevado.alpineskihouse.co` clicked on a link in an email that had been quarantined by zero-hour auto purge (ZAP).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'From the compromised endpoint, user and IP address reconnaissance over SMB was performed against the domain controller host `VNEVADO-DC`, enumerating SMB sessions and retrieving recent IP addresses of 2 accounts.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker then stole a Kerberos ticket belonging to the IT director account with SID `S-1-5-21-1440151660-4837038288-105596163-1120` from VNEVADO-Win10B and replayed it (pass-the-ticket) on VNEVADO-Win10V to access 4 resources.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
