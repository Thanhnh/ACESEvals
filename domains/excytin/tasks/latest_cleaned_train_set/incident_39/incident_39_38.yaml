tasks:
- task_id: incident_39_latest_cleaned_train_set_task_38
  title: incident_39_latest_cleaned_train_set_task_38
  description: 'A related alert, ''Malicious credential theft tool execution detected'', was triggered at nearly the same time. What is the Microsoft Entra ID (Azure AD) user ID of the account associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert for "Suspicious access to LSASS service" was raised, indicating an attempt to decrypt user passwords from the LSASS service''s memory. The alert involved `lsass.exe` (Process ID 636) and multiple executions of `mimikatz.exe`, including Process ID 5196 with the command line `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit`, and Process ID 7092 running a pass-the-hash command that launched `powershell.exe c:\m365dattack\get-krbticket.ps1` for user `fk8mq` in domain `vnevado.alpineskihouse.co`.'
    question: 'A related alert, ''Malicious credential theft tool execution detected'', was triggered at nearly the same time. What is the Microsoft Entra ID (Azure AD) user ID of the account associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` was used to suspiciously access the LSASS service in order to decrypt and obtain clear-text user passwords from its memory.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user, identified by AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`, executed a known malicious credential theft tool whose command line indicated an intent to dump credentials, keys, and plain-text passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
