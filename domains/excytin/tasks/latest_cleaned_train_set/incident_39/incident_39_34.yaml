tasks:
- task_id: incident_39_latest_cleaned_train_set_task_34
  title: incident_39_latest_cleaned_train_set_task_34
  description: 'For the related credential theft detection linked to this reconnaissance activity, what is the name of the malicious file that was detected on the device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised showing that Ethan Brooks (Account Executive), with email `tgs2z@vnevado.alpineskihouse.co`, performed SMB session enumeration from the device `VNEVADO-Win10V` against the domain controller `VNEVADO-DC`, retrieving recent IP addresses of 2 accounts. This user and IP address reconnaissance activity is linked to earlier credential theft activity in the same incident, where a well-known credential harvesting hacktool associated with the Storm-0875 actor was detected on a device.'
    question: 'For the related credential theft detection linked to this reconnaissance activity, what is the name of the malicious file that was detected on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` (Ethan Brooks) performed user and IP address reconnaissance (SMB) from VNEVADO-Win10V, enumerating SMB sessions on VNEVADO-DC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The credential theft tool file `mimikatz.exe` was then detected on the device, indicating the attacker attempted to harvest credentials such as plaintext passwords, hashes, and Kerberos tickets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
