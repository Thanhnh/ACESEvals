tasks:
- task_id: incident_39_latest_cleaned_train_set_task_23
  title: incident_39_latest_cleaned_train_set_task_23
  description: 'In the related alert regarding the anomalous chain of user account lookups, what was the name of the file involved in that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspected overpass-the-hash (Kerberos) attack was detected where the account `Emma Clark` (email `fk8mq@vnevado.alpineskihouse.co`, SID `S-1-5-21-1540151660-3530000288-105586595-1517`) attempted to authenticate against VNEVADO-DC. This activity is linked through a shared compromised device and user account to further reconnaissance activity, including an alert about an anomalous chain of attempts to look up user account information, suggesting an attacker gathering information about potential targets.'
    question: 'In the related alert regarding the anomalous chain of user account lookups, what was the name of the file involved in that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'domaindominance27.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'domaindominance27.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspected overpass-the-hash attack (Kerberos) was detected, where Emma Clark (Helpdesk Administrator) on VNEVADO-Win10V attempted to authenticate against the domain controller host `VNEVADO-DC`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'From the same source device, user and IP address reconnaissance (SMB) was performed against VNEVADO-DC by the account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` (Ethan Brooks, Account Executive), enumerating SMB sessions and retrieving recent IP addresses of 2 accounts.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The reconnaissance continued with an anomalous chain of user account lookups, which was carried out by the malicious script file `domaindominance27.ps1`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
