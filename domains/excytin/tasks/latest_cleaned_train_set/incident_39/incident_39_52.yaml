tasks:
- task_id: incident_39_latest_cleaned_train_set_task_52
  title: incident_39_latest_cleaned_train_set_task_52
  description: 'An earlier related alert flagged suspicious activity initiated remotely on a machine, such as attempts to start interactive sessions, modify files, pass WMI commands, or create scheduled tasks. What is the security identifier (SID) of the account involved in that suspicious remote activity alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspected overpass-the-hash (Kerberos) attack was detected in which the account `Emma Clark` (Helpdesk Administrator, email `fk8mq@vnevado.alpineskihouse.co`) on host `VNEVADO-Win10V` attempted to authenticate against the domain controller `VNEVADO-DC`.'
    question: 'An earlier related alert flagged suspicious activity initiated remotely on a machine, such as attempts to start interactive sessions, modify files, pass WMI commands, or create scheduled tasks. What is the security identifier (SID) of the account involved in that suspicious remote activity alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-0-6-5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspected overpass-the-hash attack (Kerberos) was detected, where the account `Emma Clark` (Helpdesk Administrator) with SID `S-1-5-21-1540151660-3530000288-105586595-1517` on VNEVADO-Win10V attempted to authenticate against VNEVADO-DC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, suspicious remote activity was then observed on the machine, initiated remotely by the account with SID `S-0-6-5`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
