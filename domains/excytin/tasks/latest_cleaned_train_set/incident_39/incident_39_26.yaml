tasks:
- task_id: incident_39_latest_cleaned_train_set_task_26
  title: incident_39_latest_cleaned_train_set_task_26
  description: 'Seconds after this activity, a related alert fired on the same device reporting an attempt to disable the Microsoft Defender Antivirus service (antivirus tampering, a defense evasion technique). Which user account name was associated with that tampering attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a "Possible lateral movement" alert was raised by Microsoft Defender for Endpoint after lateral movement on another device was observed in close time proximity to a suspicious network event involving the IP address `35.202.74.47`. This could indicate an attacker attempting to move across devices to gather data or elevate privileges.'
    question: 'Seconds after this activity, a related alert fired on the same device reporting an attempt to disable the Microsoft Defender Antivirus service (antivirus tampering, a defense evasion technique). Which user account name was associated with that tampering attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Possible lateral movement was observed on host `vnevado-win10b`, suggesting an attacker is moving across devices to gather data or elevate privileges.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Shortly after, an attempt to disable the Microsoft Defender Antivirus service (antivirus tampering) was made by the account with Name `fk8mq`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
