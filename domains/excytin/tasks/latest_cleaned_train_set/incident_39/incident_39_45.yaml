tasks:
- task_id: incident_39_latest_cleaned_train_set_task_45
  title: incident_39_latest_cleaned_train_set_task_45
  description: 'Which user account (display name) was responsible for issuing the directory replication request to VNEVADO-DC in the suspected DCSync alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage intrusion, a sequence of alerts indicative of potential human-operated malicious activity was observed on the device `vnevado-win10b` (AAD Device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), involving the accounts `fk8mq` and `kyleg` (SID `S-0-6-5`). This type of activity often precedes ransomware or other payload deployment, and the attacker was seen dropping and executing files over a remote session to move laterally. Later in the same incident, a suspected DCSync attack (replication of directory services) was detected, where a single directory replication request was sent from the host VNEVADO-Win10V to the domain controller VNEVADO-DC.'
    question: 'Which user account (display name) was responsible for issuing the directory replication request to VNEVADO-DC in the suspected DCSync alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Julian Burke (the IT director account)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Julian Burke (the IT director account)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A sequence of alerts indicative of human-operated malicious activity was observed originating from the IP address `141.216.110.153`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'During a remote session from that address, the account with SID `S-1-5-21-1440151660-4837038288-105596163-1120` dropped a file and launched it from a remote location, indicating lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The compromised account `Julian Burke` (IT director) on VNEVADO-Win10V then performed a suspected DCSync attack, sending a directory services replication request to VNEVADO-DC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
