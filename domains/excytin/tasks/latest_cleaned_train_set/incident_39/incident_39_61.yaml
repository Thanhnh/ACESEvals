tasks:
- task_id: incident_39_latest_cleaned_train_set_task_61
  title: incident_39_latest_cleaned_train_set_task_61
  description: 'For the ''Kekeo'' malware detection during lateral movement on that same device, what is the name of the file that was flagged?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired for a suspicious file registered as a service: the file `psexesvc.exe` was registered as a service under the `LocalSystem` account, suggesting an attacker may be establishing persistence. Shortly afterward, on the same device, a related alert reported that ''Kekeo'' malware was detected during lateral movement, indicating an attacker might be attempting to move laterally to this device from another device on the network.'
    question: 'For the ''Kekeo'' malware detection during lateral movement on that same device, what is the name of the file that was flagged?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious file was registered as a service for persistence on the host with AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same device, ''Kekeo'' malware was detected during lateral movement, involving the file named `rubeus.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
