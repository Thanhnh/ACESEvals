tasks:
- task_id: incident_39_latest_cleaned_train_set_task_98
  title: incident_39_latest_cleaned_train_set_task_98
  description: 'For the Rubeus kerberoasting alert, what was the process ID, creation time, and full command line of the process that triggered it?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an alert titled "Suspicious sequence of exploration activities" fired after a PowerShell script (`powershell.exe -executionpolicy bypass -file c:\users\tgs2z\downloads\domaindominance27\domaindominance27.ps1`, PID 4676) spawned a rapid series of reconnaissance commands, including `whoami.exe` (PID 6512), `net.exe user /domain`, `net.exe group "domain admins" /domain`, `net.exe group "enterprise admins" /domain`, and even created a new domain account with `net.exe user /add bdadmin password1! /domain`. Shortly afterwards, a related alert was raised for possible use of the Rubeus kerberoasting tool on the same endpoint.'
    question: 'For the Rubeus kerberoasting alert, what was the process ID, creation time, and full command line of the process that triggered it?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 6636, Created Time (UTC): 2024-06-27T14:32:46.5860644Z, Command line: `powershell.exe c:\m365dattack\get-krbticket.ps1`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 6636, Created Time (UTC): 2024-06-27T14:32:46.5860644Z, Command line: `powershell.exe c:\m365dattack\get-krbticket.ps1`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `tgs2z` ran a suspicious sequence of exploration/discovery windows commands, indicating reconnaissance for valuable assets and lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From that same compromised context, a Rubeus kerberoasting activity was observed: process ID `6636` created at `2024-06-27t14:32:46.5860644z` executed the command line `powershell.exe c:\m365dattack\get-krbticket.ps1` to request Kerberos service tickets for credential theft.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
