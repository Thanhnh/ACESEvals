tasks:
- task_id: incident_39_latest_cleaned_train_set_task_29
  title: incident_39_latest_cleaned_train_set_task_29
  description: 'For the nearly simultaneous alert about a potentially malicious URL click, what was the full URL that the user clicked on?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an alert titled ''User and IP address reconnaissance (SMB)'' was raised after the user Ethan Brooks (Account Executive), working from the host `VNEVADO-Win10V`, enumerated SMB sessions on the domain controller `VNEVADO-DC` and retrieved recent IP addresses of 2 accounts. Almost simultaneously, another alert fired indicating that one of the users clicked on a link that was found to be malicious.'
    question: 'For the nearly simultaneous alert about a potentially malicious URL click, what was the full URL that the user clicked on?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` (Ethan Brooks) on VNEVADO-Win10V performed user and IP address reconnaissance (SMB) by enumerating SMB sessions on VNEVADO-DC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same user then clicked on a potentially malicious URL `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
