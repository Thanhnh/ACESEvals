tasks:
- task_id: incident_39_latest_cleaned_train_set_task_58
  title: incident_39_latest_cleaned_train_set_task_58
  description: 'A related alert reported a successful logon using overpass-the-hash with potentially stolen credentials on the same device. Which file was flagged in that alert as the source from which the credential material (password hash) was likely harvested?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, activity indicating use of the Rubeus tool was observed on an endpoint. The process `psexesvc.exe` (PID 5512) was seen, followed by `cmd /c "c:\temp\rubeus.exe dump /service:xfbzkp /user:lucasb > c:\temp\adminticket.txt"` (PID 7644) and `rubeus.exe dump /service:xfbzkp /user:lucasb` (PID 2608). Rubeus can perform kerberoasting, pass-the-ticket, and other attacks abusing Kerberos authentication.'
    question: 'A related alert reported a successful logon using overpass-the-hash with potentially stolen credentials on the same device. Which file was flagged in that alert as the source from which the credential material (password hash) was likely harvested?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lsass.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'lsass.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The Rubeus kerberoasting tool was used on the host with AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`, requesting Kerberos tickets for service principal names.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker performed a successful overpass-the-hash logon, with the password hash obtained from memory via the process file `lsass.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
