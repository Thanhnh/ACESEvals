tasks:
- task_id: incident_39_latest_cleaned_train_set_task_68
  title: incident_39_latest_cleaned_train_set_task_68
  description: 'For the sign-in attempt involving the deceptive user account, what source IP address was recorded?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious service was started on a device, where `psexesvc.exe` was launched by `services.exe` (parent process ID 684, created 2024-06-26T17:11:52). The psexesvc.exe processes were created with process IDs 5912 and 5512 on 2024-06-27. Attackers often use services like this to launch malicious commands, maintain persistence, or elevate privileges. On the same device, a nearly simultaneous alert reported a sign-in attempt using a deceptive (fake or decoy) user account, which attackers commonly leverage for lateral movement and access to sensitive data.'
    question: 'For the sign-in attempt involving the deceptive user account, what source IP address was recorded?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '141.216.110.153'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '141.216.110.153'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious service was launched on the device with AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`, likely used by the attacker to run malicious commands and maintain persistence or elevate privileges.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From that same device, a sign-in attempt using a deceptive (decoy) user account was detected originating from the IP address `141.216.110.153`, indicating potential lateral movement by the attacker.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
