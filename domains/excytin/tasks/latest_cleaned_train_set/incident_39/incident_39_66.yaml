tasks:
- task_id: incident_39_latest_cleaned_train_set_task_66
  title: incident_39_latest_cleaned_train_set_task_66
  description: 'For that earlier alert about potential human-operated malicious activity, what is the security identifier (SID) of the account associated with it?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage intrusion in the vnevado.alpineskihouse.co environment, an alert titled "User and IP address reconnaissance (SMB)" was raised: the account `Ethan Brooks` (Account Executive, email `tgs2z@vnevado.alpineskihouse.co`) working from a compromised workstation enumerated SMB sessions on the domain controller VNEVADO-DC and retrieved recent IP addresses for 2 accounts. This reconnaissance is linked, through the affected device and subsequent Kerberos overpass-the-hash activity, to an earlier alert reporting a sequence of events indicative of human-operated malicious activity that could lead to ransomware or other payloads being deployed.'
    question: 'For that earlier alert about potential human-operated malicious activity, what is the security identifier (SID) of the account associated with it?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-0-6-5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'On host `VNEVADO-Win10V`, an SMB session enumeration (user and IP address reconnaissance) was performed against VNEVADO-DC, retrieving recent IP addresses of 2 accounts.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'From that same host, the account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677` (Emma Clark, Helpdesk Administrator) was used in a suspected overpass-the-hash (Kerberos) attack to authenticate against VNEVADO-DC.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'This sequence escalated into potential human-operated malicious activity on the device, associated with the account with SID `S-0-6-5`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
