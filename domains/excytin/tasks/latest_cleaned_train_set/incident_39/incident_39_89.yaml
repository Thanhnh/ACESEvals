tasks:
- task_id: incident_39_latest_cleaned_train_set_task_89
  title: incident_39_latest_cleaned_train_set_task_89
  description: 'For the alert reporting possible use of the Rubeus kerberoasting tool, which account name was involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a known credential theft tool execution was detected on an endpoint: the process `mimikatz.exe` (Process ID 4748, created 2024-06-27T14:33:38Z) was run with the command line `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`. Following this, PsExec was used to launch a command on a remote device, and around the same time activity indicating use of the Rubeus tool (capable of kerberoasting and pass-the-ticket attacks) was observed on the endpoint.'
    question: 'For the alert reporting possible use of the Rubeus kerberoasting tool, which account name was involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed on the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, indicating an intent to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'PsExec was then used to launch a command on a remote device, involving the extracted file `adminticket.txt`, suggesting lateral movement using stolen ticket material.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The activity was associated with the account `fk8mq`, which showed possible use of the Rubeus kerberoasting tool to request and abuse Kerberos tickets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
