tasks:
- task_id: incident_39_latest_cleaned_train_set_task_64
  title: incident_39_latest_cleaned_train_set_task_64
  description: 'For the related alert about email messages containing a malicious URL that were removed after delivery, what was the recipient''s email address?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled "Suspicious process stopping services" fired on host `vnevado-dc` in the context of account `lucasb` (SID S-1-5-21-1440151660-4837038288-105596163-1120). The activity involved PowerShell (PID 3780) running the command `powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" -databasepath (get-itemproperty -path registry::hklm\system\currentcontrolset\services\ntds\parameters).\"dsa database file\" -force; net.exe start ntds"`, which spawned `net.exe` (PID 6428) to stop the NTDS service. This activity chains to further alerts in the same incident, including one where emails containing a malicious URL were delivered and later removed.'
    question: 'For the related alert about email messages containing a malicious URL that were removed after delivery, what was the recipient''s email address?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious process `powershell.exe` stopped services running on the device, likely to avoid detection or prepare for data encryption/destruction.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` ran a suspicious sequence of Windows exploration commands used to identify valuable assets and coordinate lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The mailbox recipient `tgs2z@vnevado.alpineskihouse.co` received email messages containing a malicious URL that were removed after delivery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
