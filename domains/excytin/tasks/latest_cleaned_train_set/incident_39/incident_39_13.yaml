tasks:
- task_id: incident_39_latest_cleaned_train_set_task_13
  title: incident_39_latest_cleaned_train_set_task_13
  description: 'In the closely related credential theft tool execution alert triggered by the same account, what was the name of the script file involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled ''Malicious credential theft tool execution detected'' was raised after a known credential theft tool command line was observed: process ID 5196 created at 2024-06-27T14:32:35.4061023Z running `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit`. This activity is tied to a compromised user account that also triggered a nearly simultaneous credential theft tool detection.'
    question: 'In the closely related credential theft tool execution alert triggered by the same account, what was the name of the script file involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-krbticket.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool execution command line was detected in the context of the user account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The credential theft activity involved the execution of the file `get-krbticket.ps1`, a script used to dump Kerberos tickets and users'' credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
