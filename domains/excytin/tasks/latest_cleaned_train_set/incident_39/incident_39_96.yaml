tasks:
- task_id: incident_39_latest_cleaned_train_set_task_96
  title: incident_39_latest_cleaned_train_set_task_96
  description: 'For the related ''Sign-in attempt with deceptive user account'' alert, what was the IP address involved in that sign-in attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, the ''Kekeo'' malware was detected and found active in the environment. Related telemetry showed the account `fk8mq` (SID `S-1-5-21-1540151660-3530000288-105586595-1517`) associated with the execution of `rubeus.exe` using the command line `rubeus.exe dump /service:xfbzkp /user:lucasb` (Process ID 2608, created 2024-06-27T14:33:27Z). Around the same time, on the same affected device, another alert fired for a sign-in attempt made with a deceptive (fake or decoy) user account, which attackers often use for lateral movement or accessing sensitive data.'
    question: 'For the related ''Sign-in attempt with deceptive user account'' alert, what was the IP address involved in that sign-in attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '141.216.110.153'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '141.216.110.153'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The ''Kekeo'' malware was detected and was active on the host with HostName `vnevado-win10b`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same device, a sign-in attempt was detected using a deceptive (fake or decoy) user account, originating from the IP address `141.216.110.153`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
