tasks:
- task_id: incident_39_latest_cleaned_train_set_task_14
  title: incident_39_latest_cleaned_train_set_task_14
  description: 'A closely related alert on the same device reported that a suspicious service was launched, a technique often used for persistence or privilege escalation. Which process was responsible for launching that service, and what were its process ID and creation time?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled ''File dropped and launched from remote location'' fired on host `vnevado-win10b` (AAD Device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), where a remote session from IP `141.216.110.153` dropped and executed `psexesvc.exe` (process IDs 5512 and 5912) under the account `fk8mq` (SID `S-1-5-21-1540151660-3530000288-105586595-1517`). This behavior suggests an attacker or malware attempting to move laterally or propagate.'
    question: 'A closely related alert on the same device reported that a suspicious service was launched, a technique often used for persistence or privilege escalation. Which process was responsible for launching that service, and what were its process ID and creation time?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The service was launched by `services.exe`, with Process ID 652, created at 2024-06-19T12:56:00.7201251Z.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The service was launched by `services.exe`, with Process ID 652, created at 2024-06-19T12:56:00.7201251Z.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A remote session dropped and executed the file `psexesvc.exe` on the device, indicating a lateral movement attempt using PsExec.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The dropped PsExec service binary caused a suspicious service to be launched via the process `services.exe` with Process ID `652` at `2024-06-19t12:56:00.7201251z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
