tasks:
- task_id: incident_39_latest_cleaned_train_set_task_51
  title: incident_39_latest_cleaned_train_set_task_51
  description: 'In the related PsExec lateral movement alert, what is the name of the file referenced by the process involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a known credential theft tool was executed: the process `mimikatz.exe` ran with process ID 5196 using the command line `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit`, indicating an intent to dump users'' credentials, keys and plain-text passwords. The same compromised user account (identified by its Azure AD user ID) is also linked to a subsequent alert where PsExec was used to launch a command on a remote device, suggesting lateral movement in the organization.'
    question: 'In the related PsExec lateral movement alert, what is the name of the file referenced by the process involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'adminticket.txt'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'adminticket.txt'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` executed a known credential theft tool, indicating an intent to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, PsExec was leveraged to launch a command on a remote device for lateral movement, involving the file `adminticket.txt`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
