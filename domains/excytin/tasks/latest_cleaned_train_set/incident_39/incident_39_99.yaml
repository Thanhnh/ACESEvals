tasks:
- task_id: incident_39_latest_cleaned_train_set_task_99
  title: incident_39_latest_cleaned_train_set_task_99
  description: 'One of the related alerts flagged a sign-in attempt made with a deceptive (fake or decoy) user account that an attacker may be leveraging for lateral movement. What is the name of that deceptive account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage identity attack, an alert was raised for a suspected DCSync attack (replication of directory services), where Julian Burke (IT director), with SID `S-1-5-21-1440151660-4837038288-105596163-1120` and email `lucasb@vnevado.alpineskihouse.co`, sent a replication request from the workstation `VNEVADO-Win10V` to the domain controller `VNEVADO-DC`. Pivoting from this activity, related reconnaissance and sign-in alerts were also observed on the same endpoints.'
    question: 'One of the related alerts flagged a sign-in attempt made with a deceptive (fake or decoy) user account that an attacker may be leveraging for lateral movement. What is the name of that deceptive account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspected DCSync attack (replication of directory services) was detected originating from the host with HostName `VNEVADO-Win10V`, which sent a replication request to VNEVADO-DC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'From that same device, user and IP address reconnaissance (SMB) was performed by the account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` (Ethan Brooks), enumerating SMB sessions on VNEVADO-DC to retrieve recent IP addresses of 2 accounts.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A sign-in attempt with a deceptive (decoy) user account was detected on the device, using the account with Name `tgs2z`, suggesting the attacker attempted to use this fake account for lateral movement and access to sensitive data.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
