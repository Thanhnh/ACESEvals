tasks:
- task_id: incident_39_latest_cleaned_train_set_task_31
  title: incident_39_latest_cleaned_train_set_task_31
  description: 'Following this credential theft activity, a related alert was raised for a sign-in attempt using a deceptive (decoy) user account at 2024-07-04 22:35:02 UTC. What was the source IP address associated with that sign-in attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, the Mimikatz credential theft tool was detected on a device in the vnevado.alpineskihouse.co domain. The tool was executed multiple times, including `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit` (PID 5196), several pass-the-hash attempts such as `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe dir \\vnevado-win10b\c$\"" exit`, a Kerberos ticket injection using `kerberos::ptt c:\m365dattack\admin-tickets`, execution of `get-krbticket.ps1` via powershell.exe, and a DCSync attempt with `lsadump::dcsync`. These actions indicate an attacker harvesting credentials to impersonate valid users on the network.'
    question: 'Following this credential theft activity, a related alert was raised for a sign-in attempt using a deceptive (decoy) user account at 2024-07-04 22:35:02 UTC. What was the source IP address associated with that sign-in attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '141.216.110.153'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '141.216.110.153'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The Mimikatz credential theft tool was detected on the device under the account with SID `S-5-7-21-1843151660-3234030288-105586167-1422`, indicating an attacker was harvesting credentials such as plaintext passwords, hashes, and Kerberos tickets.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, a sign-in attempt was detected with the deceptive (decoy) user account `kyleg`, suggesting the attacker was attempting lateral movement or access to sensitive data.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The deceptive account sign-in attempt originated from the IP address `141.216.110.153`, which is the attacker''s source address.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
