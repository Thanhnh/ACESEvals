    incident_context: 'During this multi-stage lateral movement incident, an alert titled "File dropped and launched from remote location" was raised on 2024-07-04 at 22:35:00 UTC, indicating that a remote session dropped a file and executed it. The activity was tied to the account `fk8mq` (SID `S-1-5-21-1540151660-3530000288-105586595-1517`, AAD user ID `97e6a954-b6bd-48a5-808c-bd8464cce677`) on the host `vnevado-win10b` (AAD device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), with the credential-theft tool executed as `rubeus.exe dump /service:xfbzkp /user:lucasb` (PID 2608), and a connection from IP address `141.216.110.153`.'
    question: 'Seconds later, a related alert reported that PsExec was used to launch a command on a remote device. Which account security identifier (SID) was reported in that PsExec alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-5-7-21-1843151660-3234030288-105586167-1422'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
