      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` used PsExec to launch a command on a remote device, continuing the lateral movement in the organization.'
