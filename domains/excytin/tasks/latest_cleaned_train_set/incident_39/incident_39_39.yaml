tasks:
- task_id: incident_39_latest_cleaned_train_set_task_39
  title: incident_39_latest_cleaned_train_set_task_39
  description: 'For the alert covering the SMB session enumeration performed against VNEVADO-DC, what is the email address of the user account tied to that reconnaissance activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A multi-stage incident began with an alert for "Potential human-operated malicious activity" observed on device `vnevado-win10b` (AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), involving the account `fk8mq` (SID `S-0-6-5`) and the IP address `141.216.110.153`. This sequence of alerts may lead to ransomware or other payloads being installed on target devices. Following this activity, the attack progressed to identity-based techniques against the domain controller VNEVADO-DC, including a suspected overpass-the-hash (Kerberos) attempt and reconnaissance activity in which SMB sessions on VNEVADO-DC were enumerated to retrieve recent IP addresses of two accounts.'
    question: 'For the alert covering the SMB session enumeration performed against VNEVADO-DC, what is the email address of the user account tied to that reconnaissance activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A sequence of alerts indicative of human-operated malicious activity was observed involving the user account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677`, which might lead to ransomware or other payloads being installed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'From the compromised device VNEVADO-Win10V, a suspected overpass-the-hash (Kerberos) attack was performed by Emma Clark (Helpdesk Administrator) attempting to authenticate against the domain controller host `VNEVADO-DC`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On the same domain controller, Ethan Brooks (Account Executive) enumerated SMB sessions and retrieved recent IP addresses of 2 accounts, exposing the account with email `tgs2z@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
