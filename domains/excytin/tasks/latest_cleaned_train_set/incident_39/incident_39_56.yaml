tasks:
- task_id: incident_39_latest_cleaned_train_set_task_56
  title: incident_39_latest_cleaned_train_set_task_56
  description: 'For the alert about a process suspiciously stopping services on the device, what is the file name of the process that stopped the services?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a sign-in attempt with a deceptive user account was detected on host `vnevado-win10b` (AAD Device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`) involving the account `kyleg` (SID `S-0-6-5`). This activity appears to be part of a broader attack chain that also included a remote session dropping and launching a file, as well as a process suspiciously stopping services on the device — a technique attackers use to avoid detection, prevent malware removal, and block recovery, often alongside data encryption or destruction.'
    question: 'For the alert about a process suspiciously stopping services on the device, what is the file name of the process that stopped the services?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in attempt with a deceptive (decoy) user account was detected originating from the IP address `141.216.110.153`, indicating a potential attacker attempting lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the compromised account with Name `lucasb`, a remote session dropped a file and executed it, showing the attacker attempting to move laterally or propagate.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The dropped payload led to execution of the process with ExtractedFileName `powershell.exe`, which suspiciously stopped services on the device to evade detection and prevent recovery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
