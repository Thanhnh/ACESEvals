tasks:
- task_id: incident_39_latest_cleaned_train_set_task_24
  title: incident_39_latest_cleaned_train_set_task_24
  description: 'Shortly after this remote execution, a related alert was triggered for a process suspiciously stopping services on the same device, under the same user account. What was the full command line of that process and its process ID?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised for a file dropped and launched from a remote location: the file `psexesvc.exe` (Process ID 7668, created 2024-06-27T14:34:10.0201983Z) was dropped by a remote session originating from IP address `141.216.110.153` and then executed, which may indicate an attacker or malware attempting to move laterally or propagate.'
    question: 'Shortly after this remote execution, a related alert was triggered for a process suspiciously stopping services on the same device, under the same user account. What was the full command line of that process and its process ID?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Command line: `"net.exe" stop ntds /y`, Process ID: 6428 (created 2024-06-27T14:34:10.8607851Z)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Command line: `"net.exe" stop ntds /y`, Process ID: 6428 (created 2024-06-27T14:34:10.8607851Z)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-1440151660-4837038288-105596163-1120` used a remote session to drop a file and execute it on the device, indicating lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker then ran the command `"net.exe" stop ntds /y` with Process ID `6428` at `2024-06-27t14:34:10.8607851z` to suspiciously stop the NTDS service and evade detection or hinder recovery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
