tasks:
- task_id: incident_39_latest_cleaned_train_set_task_35
  title: incident_39_latest_cleaned_train_set_task_35
  description: 'Following this activity, a SID history injection was detected on the same device at nearly the same time, where an attacker may have modified the SID history of a user to obtain elevated privileges. What is the name of the file associated with that SID history injection alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Suspicious remote activity'' alert was raised on host `vnevado-win10b` (AAD device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), where activity initiated remotely was observed. The alert involved the process `psexesvc.exe` (Process ID 5512, created 2024-06-27T14:33:27Z) running under the `LocalSystem` account (SID `S-0-6-5`), as well as the user account `fk8mq` (SID `S-1-5-21-1540151660-3530000288-105586595-1517`, AAD user ID `97e6a954-b6bd-48a5-808c-bd8464cce677`). This chain also included a remote session that dropped and executed a file, suggesting lateral movement or malware propagation.'
    question: 'Following this activity, a SID history injection was detected on the same device at nearly the same time, where an attacker may have modified the SID history of a user to obtain elevated privileges. What is the name of the file associated with that SID history injection alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dkwj.mze'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dkwj.mze'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was observed involving the process `psexesvc.exe`, indicating a remote session was initiated on the machine.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-1-5-21-1440151660-4837038288-105596163-1120` used the remote session to drop and launch a file from a remote location, attempting lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A SID history injection was then detected on the device, associated with the file `dkwj.mze`, indicating the attacker attempted to elevate privileges and establish persistence.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
