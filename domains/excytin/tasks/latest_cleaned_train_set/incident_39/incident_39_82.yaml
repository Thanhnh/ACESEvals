tasks:
- task_id: incident_39_latest_cleaned_train_set_task_82
  title: incident_39_latest_cleaned_train_set_task_82
  description: 'A related alert on the same device shows SMB session enumeration against the domain controller VNEVADO-DC, retrieving recent IP addresses of accounts. What is the email address of the account that performed this user and IP address reconnaissance?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, the Mimikatz credential theft tool was detected on host `vnevado-win10v` (AAD device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`). Multiple `mimikatz.exe` processes were observed, including pass-the-hash commands such as `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe c:\m365dattack\get-krbticket.ps1\"" exit -wait` (PID 7092) and a Kerberos ticket pass-the-ticket command (PID 5176), indicating an attacker harvesting credentials and impersonating valid users.'
    question: 'A related alert on the same device shows SMB session enumeration against the domain controller VNEVADO-DC, retrieving recent IP addresses of accounts. What is the email address of the account that performed this user and IP address reconnaissance?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The Mimikatz credential theft tool was detected running under the account with SID `S-5-7-21-1843151660-3234030288-105586167-1422`, indicating an attempt to harvest credentials such as plaintext passwords, hashes, and Kerberos tickets.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the stolen credentials, the attacker performed user and IP address reconnaissance (SMB) from VNEVADO-Win10V against VNEVADO-DC, enumerating SMB sessions and exposing the account with email `tgs2z@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
