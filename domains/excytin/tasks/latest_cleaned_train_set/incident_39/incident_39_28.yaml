tasks:
- task_id: incident_39_latest_cleaned_train_set_task_28
  title: incident_39_latest_cleaned_train_set_task_28
  description: 'In that closely related alert about dual-purpose tools being dropped on the device, what is the name of the PowerShell script file involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert for "Suspicious remote activity" fired on host `vnevado-win10b` (AAD device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`) at 2024-07-04 22:35:03 UTC. The activity was initiated remotely from IP `141.216.110.153` and involved the process `psexesvc.exe` (PID 5512) running under the `LocalSystem` account, with the user account `fk8mq` (SID S-1-5-21-1540151660-3530000288-105586595-1517) also observed. Roughly one second earlier, a related alert on the same device reported that multiple known public dual-purpose tools — which attackers often use for credential theft, privilege escalation, and lateral movement — had been dropped.'
    question: 'In that closely related alert about dual-purpose tools being dropped on the device, what is the name of the PowerShell script file involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-krbticket.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was observed on the machine, involving the file `psexesvc.exe`, indicating a remote PsExec service was used to initiate commands on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the remote access, multiple dual-purpose tools were dropped on the device, including the file `get-krbticket.ps1`, a known public script that can be used for Kerberos ticket harvesting and credential theft.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
