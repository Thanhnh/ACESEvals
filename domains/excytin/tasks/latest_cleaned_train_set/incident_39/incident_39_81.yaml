tasks:
- task_id: incident_39_latest_cleaned_train_set_task_81
  title: incident_39_latest_cleaned_train_set_task_81
  description: 'In the subsequent ''Anomalous account lookups'' alert linked to the same account, which script file was involved in the account enumeration activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a known credential theft tool execution was detected: `mimikatz.exe` was run with the command line `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe c:\m365dattack\get-krbticket.ps1\"" exit -wait` (Process ID 7092), which launched PowerShell to run the script `get-krbticket.ps1`. Seconds later, on the same compromised account (linked by the account SID), another alert fired for an anomalous chain of attempts to look up user account information, suggesting the attacker was enumerating potential targets.'
    question: 'In the subsequent ''Anomalous account lookups'' alert linked to the same account, which script file was involved in the account enumeration activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'domaindominance27.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'domaindominance27.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` executed a known credential theft tool, attempting to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the credential theft, an anomalous chain of account lookups was performed using the script file `domaindominance27.ps1`, indicating the attacker was gathering information about potential targets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
