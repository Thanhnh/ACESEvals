tasks:
- task_id: incident_39_latest_cleaned_train_set_task_30
  title: incident_39_latest_cleaned_train_set_task_30
  description: 'Following this Rubeus/Kerberos ticket activity, an alert was raised for a suspected overpass-the-hash (Kerberos) attack where a Helpdesk Administrator account on VNEVADO-Win10V attempted to authenticate against VNEVADO-DC. What is the email address of the account used in that authentication attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, PsExec was used to launch commands on remote devices from a compromised machine (AAD device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`). Observed command lines include `"psexec.exe" \\vnevado-win10b -accepteula cmd /c "powershell -command set-mppreference -disablerealtimemonitoring 1"`, `"psexec.exe" \\vnevado-win10b -accepteula cmd /c "c:\temp\rubeus.exe dump /service:xfbzkp /user:lucasb > c:\temp\adminticket.txt"`, and `"psexec.exe" \\vnevado-dc -accepteula cmd /c "powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory ...""`, along with scripts such as `domaindominance27.ps1` and `get-krbticket.ps1`. This Kerberos ticket abuse activity later escalated into a credential-based authentication attack against the domain controller.'
    question: 'Following this Rubeus/Kerberos ticket activity, an alert was raised for a suspected overpass-the-hash (Kerberos) attack where a Helpdesk Administrator account on VNEVADO-Win10V attempted to authenticate against VNEVADO-DC. What is the email address of the account used in that authentication attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'PsExec was used to launch a command on a remote device, extracting/writing the file `adminticket.txt` (process entity ExtractedFileName: `adminticket.txt`), indicating lateral movement using a stolen Kerberos ticket.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The Rubeus kerberoasting tool was observed running under the account with SID `S-1-5-21-1540151660-3530000288-105586595-1517`, used to request and harvest Kerberos service tickets.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The harvested credentials were then used in a suspected overpass-the-hash (Kerberos) attack from VNEVADO-Win10V against VNEVADO-DC by the account with Email `fk8mq@vnevado.alpineskihouse.co` (Emma Clark, Helpdesk Administrator).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
