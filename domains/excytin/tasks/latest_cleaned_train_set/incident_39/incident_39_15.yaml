tasks:
- task_id: incident_39_latest_cleaned_train_set_task_15
  title: incident_39_latest_cleaned_train_set_task_15
  description: 'Just moments before the LSASS access alert, a related alert fired on the same device for a suspicious service being launched, a technique often used for persistence or privilege escalation. Which user account name was associated with that suspicious service launch alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on host `vnevado-win10v` (AAD Device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`), an alert was raised for suspicious access to the LSASS service (process `636__2024-06-26t10:41:49.7079347z__lsass.exe`). Attackers commonly read LSASS memory to recover clear-text or hashed credentials for lateral movement. On this device, `mimikatz.exe` was executed multiple times with pass-the-hash commands such as `"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe c:\m365dattack\get-krbticket.ps1\"" exit -wait`, and accounts such as `kyleg`, `fk8mq` and `tgs2z` were referenced.'
    question: 'Just moments before the LSASS access alert, a related alert fired on the same device for a suspicious service being launched, a technique often used for persistence or privilege escalation. Which user account name was associated with that suspicious service launch alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lucasb'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'lucasb'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious access to the LSASS service was detected, performed by the process `powershell.exe` (ExtractedFileName: `powershell.exe`), indicating an attempt to dump credentials from LSASS memory.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the credential theft attempt, a suspicious service was launched on the same device under the account with Name `lucasb`, likely to maintain persistence or elevate privileges.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
