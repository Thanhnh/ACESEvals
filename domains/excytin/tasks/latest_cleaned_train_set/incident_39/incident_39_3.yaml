tasks:
- task_id: incident_39_latest_cleaned_train_set_task_3
  title: incident_39_latest_cleaned_train_set_task_3
  description: 'For the second credential theft tool execution on the same device, what was the process ID and full command line used, and which domain and user account were targeted?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a malicious credential theft tool execution was detected on an endpoint: the process `mimikatz.exe` (Process ID 5196, created 2024-06-27T14:32:35.4061023Z) was launched with the command line `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit`, indicating an intent to dump users'' credentials from memory. A second, nearly identical credential theft alert was raised on the same device shortly afterwards.'
    question: 'For the second credential theft tool execution on the same device, what was the process ID and full command line used, and which domain and user account were targeted?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID 4748 (created 2024-06-27T14:33:38.0249949Z) ran `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`, targeting the domain vnevado.alpineskihouse.co and the user account xfbzkp via a DCSync attack.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID 4748 (created 2024-06-27T14:33:38.0249949Z) ran `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`, targeting the domain vnevado.alpineskihouse.co and the user account xfbzkp via a DCSync attack.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool execution was detected on the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that host, the attacker ran the credential theft tool Mimikatz with the command line `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`, with Process ID `4748` at `2024-06-27t14:33:38.0249949z`, attempting to dump credentials via a DCSync attack.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
