tasks:
- task_id: incident_39_latest_cleaned_train_set_task_84
  title: incident_39_latest_cleaned_train_set_task_84
  description: 'For the alert reporting the active ''Kekeo'' malware detection, what is the Microsoft Entra ID (AAD) user ID of the associated account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert was raised for email messages containing a malicious URL that were delivered and later removed. The email was sent from `k1pt7ez@vnevado.alpineskihouse.co` (sender IP `118.254.65.186`) to the mailbox of Ethan Brooks (`tgs2z@vnevado.alpineskihouse.co`) and contained the URL `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/`. Pivoting on the affected user account, the investigation also surfaces earlier activity on a device where multiple dual-purpose tools were dropped, followed by a detection of the ''Kekeo'' malware that was active on that device.'
    question: 'For the alert reporting the active ''Kekeo'' malware detection, what is the Microsoft Entra ID (AAD) user ID of the associated account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '97e6a954-b6bd-48a5-808c-bd8464cce677'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '97e6a954-b6bd-48a5-808c-bd8464cce677'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` received email messages containing a malicious URL, which were removed after delivery.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Multiple dual-purpose tools were dropped on the device, including the file named `rubeus.exe`, which can be used for credential theft and lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The ''Kekeo'' malware was detected and was active under the user account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
