tasks:
- task_id: incident_39_latest_cleaned_train_set_task_91
  title: incident_39_latest_cleaned_train_set_task_91
  description: 'In the related alert about anomalous account lookups, what was the name of the script file involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, activity indicating use of the Rubeus tool was observed on an endpoint. PowerShell was used to run `c:\m365dattack\get-krbticket.ps1` (PID 6636), and psexec.exe was then used to run `"psexec.exe" \\vnevado-win10b -accepteula cmd /c "c:\temp\rubeus.exe dump /service:xfbzkp /user:lucasb > c:\temp\adminticket.txt"` (PID 5924). This tool can perform kerberoasting, pass-the-ticket, and other Kerberos-based attack techniques. The activity was linked, through a shared account SID, to another alert raised at nearly the same time for an anomalous chain of attempts to look up user account information, suggesting an attacker gathering information about potential targets.'
    question: 'In the related alert about anomalous account lookups, what was the name of the script file involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'domaindominance27.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'domaindominance27.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` was observed using the Rubeus kerberoasting tool to request and harvest Kerberos service tickets for credential theft.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using that access, the attacker executed the script file `domaindominance27.ps1`, which performed an anomalous chain of user account lookups to enumerate potential targets in the domain.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
