tasks:
- task_id: incident_39_latest_cleaned_train_set_task_11
  title: incident_39_latest_cleaned_train_set_task_11
  description: 'Following this activity, a related alert was triggered for a sign-in attempt using a deceptive (decoy) user account on the same device. What is the security identifier (SID) of the account used in that sign-in attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious account creation alert was raised: a PowerShell process (PID 4676) ran with the command line `"powershell.exe" -executionpolicy bypass -file c:\users\tgs2z\downloads\domaindominance27\domaindominance27.ps1`, which subsequently spawned `net.exe` (PID 3624) with the command line `"net.exe" user /add bdadmin password1! /domain`. Creating a new user account this way can establish secondary or backup access, suggesting an attacker attempting to maintain persistence in the organization.'
    question: 'Following this activity, a related alert was triggered for a sign-in attempt using a deceptive (decoy) user account on the same device. What is the security identifier (SID) of the account used in that sign-in attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-0-6-5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious new user account was created on host `vnevado-win10v`, likely to establish backup/persistent access to the device or organization.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A sign-in attempt with the deceptive user account `kyleg` was detected on that device, suggesting an attacker used a fake or decoy account for lateral movement or data access.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The deceptive account used in the sign-in attempt corresponds to the account with SID `S-0-6-5`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
