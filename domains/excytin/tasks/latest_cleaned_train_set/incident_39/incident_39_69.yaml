tasks:
- task_id: incident_39_latest_cleaned_train_set_task_69
  title: incident_39_latest_cleaned_train_set_task_69
  description: 'For the ''Malicious credential theft tool execution detected'' alert in this incident, which account security identifier (SID) was reported as involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'On the domain controller `vnevado-dc`, a SID history injection was detected: the account `lucasb` (AAD user ID `7fcf9695-68fc-4258-864d-e1e5b166c66f`) ran process ID 3780 with the command line `powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" -databasepath (get-itemproperty -path registry::hklm\system\currentcontrolset\services\ntds\parameters).\"dsa database file\" -force; net.exe start ntds"`. SID history is an attribute supporting migration scenarios, and attackers commonly abuse it to grant an existing domain user an SID with elevated privileges for persistence and access to sensitive data. Shortly afterwards, related detections in this incident flagged the Mimikatz credential theft hacktool and a known credential theft tool execution command line intended to dump users'' credentials, keys, and plain-text passwords.'
    question: 'For the ''Malicious credential theft tool execution detected'' alert in this incident, which account security identifier (SID) was reported as involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-5-7-21-1843151660-3234030288-105586167-1422'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-5-7-21-1843151660-3234030288-105586167-1422'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A SID history injection was detected, carried out via the process `powershell.exe`, where the attacker modified the SID history attribute of a domain user to gain elevated privileges.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The Mimikatz credential theft tool, process `mimikatz.exe`, was detected running on the device to harvest plaintext passwords, hashes, and Kerberos tickets.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The malicious credential theft tool execution was performed under the account with SID `S-5-7-21-1843151660-3234030288-105586167-1422`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
