tasks:
- task_id: incident_39_latest_cleaned_train_set_task_27
  title: incident_39_latest_cleaned_train_set_task_27
  description: 'In the related possible lateral movement alert, which IP address was involved in the suspicious network event?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a sign-in attempt with a deceptive user account was detected: the account `kyleg` (SID `S-0-6-5`) was used from the IP address `141.216.110.153`. A potential attacker might be leveraging this fake or decoy account for activities such as lateral movement and accessing sensitive data. Closely related in time on the same device, another alert was raised for possible lateral movement, indicating an attacker may be moving across devices to gather data or elevate privileges.'
    question: 'In the related possible lateral movement alert, which IP address was involved in the suspicious network event?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '35.202.74.47'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '35.202.74.47'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in attempt with a deceptive (decoy) user account was detected on the host `vnevado-win10b`, suggesting an attacker is using a fake account for lateral movement or data access.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that activity, possible lateral movement was observed involving the IP address `35.202.74.47`, indicating the attacker attempted to move across devices from this network endpoint.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
