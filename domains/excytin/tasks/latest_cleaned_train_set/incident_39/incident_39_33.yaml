tasks:
- task_id: incident_39_latest_cleaned_train_set_task_33
  title: incident_39_latest_cleaned_train_set_task_33
  description: 'A second, nearly simultaneous alert for malicious credential theft tool execution was raised on the same compromised account. What was the name of the file (process) that was executed in that related alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a known credential theft tool execution was detected. The process (ProcessId 5176, created 2024-06-27T14:33:32.4282796Z) ran the command line `"mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit`, indicating an intent to dump users'' credentials, keys and plain-text passwords, as well as to inject Kerberos tickets.'
    question: 'A second, nearly simultaneous alert for malicious credential theft tool execution was raised on the same compromised account. What was the name of the file (process) that was executed in that related alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `tgs2z` was detected executing a known credential theft tool intended to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The credential theft tool execution was carried out through the process with file name `powershell.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
