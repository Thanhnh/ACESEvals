tasks:
- task_id: incident_39_latest_cleaned_train_set_task_93
  title: incident_39_latest_cleaned_train_set_task_93
  description: 'Just seconds before this SID history injection, a related alert flagged a suspicious new user account being created on the same device, likely for backup access. What is the Microsoft Entra ID (Azure AD) user ID of that newly created account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage attack on the domain controller `vnevado-dc`, a SID history injection was detected. The account `lucasb` (SID `S-1-5-21-1440151660-4837038288-105596163-1120`) was observed running the process `3780__2024-06-27t14:34:10.5477279z__powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" -databasepath (get-itemproperty -path registry::hklm\system\currentcontrolset\services\ntds\parameters).\"dsa database file\" -force; net.exe start ntds"`. SID history is an attribute that supports migration scenarios, and attackers typically abuse it to grant an existing domain user an SID with elevated privileges for persistence and access to sensitive resources.'
    question: 'Just seconds before this SID history injection, a related alert flagged a suspicious new user account being created on the same device, likely for backup access. What is the Microsoft Entra ID (Azure AD) user ID of that newly created account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A SID history injection was detected on the device, carried out through the process `powershell.exe`, which modified the SID history attribute to gain elevated privileges.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using those elevated privileges, a new suspicious user account was created for persistence, identified by AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
