tasks:
- task_id: incident_39_latest_cleaned_train_set_task_76
  title: incident_39_latest_cleaned_train_set_task_76
  description: 'For the alert about the suspicious file registered as a service, what is the security identifier (SID) of the account associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a known credential theft tool was executed on an endpoint: the process `mimikatz.exe` (Process ID 4748, created 2024-06-27T14:33:38Z) ran the command line `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`, indicating an attempt to dump user credentials. On the same device, multiple dual-purpose tools were dropped, and a related alert shows a suspicious file being registered as a service, likely for persistence.'
    question: 'For the alert about the suspicious file registered as a service, what is the security identifier (SID) of the account associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-0-6-5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed on the host `vnevado-win10v`, with a command line indicating intent to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same device, multiple dual-purpose tools were dropped, including the file `psexesvc.exe`, which attackers commonly use for lateral movement and remote execution.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The suspicious file was then registered as a service for persistence by the account with SID `S-0-6-5`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
