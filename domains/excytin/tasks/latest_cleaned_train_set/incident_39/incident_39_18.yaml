tasks:
- task_id: incident_39_latest_cleaned_train_set_task_18
  title: incident_39_latest_cleaned_train_set_task_18
  description: 'For the ''Suspicious service launched'' alert in this attack chain, what was the process ID and the full command line of the process that was started?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a sequence of alerts indicative of potential human-operated malicious activity was observed on the device `vnevado-win10b` (AAD device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), involving the accounts `fk8mq` (SID S-1-5-21-1540151660-3530000288-105586595-1517) and `kyleg`. This kind of activity often precedes ransomware or other payloads being installed on target devices. Moments earlier in the same attack chain, a remote session dropped and executed a file, and before that a suspicious service was started on the device, a technique attackers commonly use to maintain persistence or elevate privileges.'
    question: 'For the ''Suspicious service launched'' alert in this attack chain, what was the process ID and the full command line of the process that was started?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 3780 (created 2024-06-27T14:34:10.5477279Z), Command line: `powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" -databasepath (get-itemproperty -path registry::hklm\system\currentcontrolset\services\ntds\parameters).\"dsa database file\" -force; net.exe start ntds"`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 3780 (created 2024-06-27T14:34:10.5477279Z), Command line: `powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" -databasepath (get-itemproperty -path registry::hklm\system\currentcontrolset\services\ntds\parameters).\"dsa database file\" -force; net.exe start ntds"`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Potential human-operated malicious activity was observed originating from the IP address `141.216.110.153`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'From that remote session, a file was dropped and launched on the host `vnevado-dc`, indicating lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On that host, a suspicious service was launched: the process with Process ID `3780`, created at `2024-06-27t14:34:10.5477279z`, ran the command line `powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" -databasepath (get-itemproperty -path registry::hklm\system\currentcontrolset\services\ntds\parameters).\"dsa database file\" -force; net.exe start ntds"`, stopping the NTDS service to inject SID history for privilege escalation and persistence.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
