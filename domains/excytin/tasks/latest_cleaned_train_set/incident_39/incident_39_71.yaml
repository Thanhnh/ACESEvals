tasks:
- task_id: incident_39_latest_cleaned_train_set_task_71
  title: incident_39_latest_cleaned_train_set_task_71
  description: 'Shortly after this credential theft activity on the same device, an alert fired for a suspicious new user account being created for persistence. What was the full command line used to create that account, and what was its process ID?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a known credential theft tool was executed on a device: the process `mimikatz.exe` ran with process ID 4748 at 2024-06-27T14:33:38Z using the command line `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`, indicating an intent to dump user credentials from the domain.'
    question: 'Shortly after this credential theft activity on the same device, an alert fired for a suspicious new user account being created for persistence. What was the full command line used to create that account, and what was its process ID?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 3624, Command line: `"net.exe" user /add bdadmin password1! /domain` (created at 2024-06-27T14:33:43.4299474Z)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 3624, Command line: `"net.exe" user /add bdadmin password1! /domain` (created at 2024-06-27T14:33:43.4299474Z)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed on the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, indicating an intent to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the credential theft, a suspicious account creation was performed via the process with Process ID `3624` at `2024-06-27t14:33:43.4299474z`, running the command line `"net.exe" user /add bdadmin password1! /domain` to establish backup access to the domain.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
