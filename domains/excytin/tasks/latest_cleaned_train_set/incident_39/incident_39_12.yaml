tasks:
- task_id: incident_39_latest_cleaned_train_set_task_12
  title: incident_39_latest_cleaned_train_set_task_12
  description: 'Following this Kekeo/Rubeus credential dumping activity, the targeted user account was involved in related alerts in the cloud. What is the Microsoft Entra ID (Azure AD) user ID of that account?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident, an active ''Kekeo'' malware detection was raised on the host `vnevado-win10b` (AAD device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`). The alert involved the credential-theft tool `rubeus.exe` running as process ID 2608 with the command line `rubeus.exe dump /service:xfbzkp /user:lucasb`, executed under the local account `fk8mq` (SID `S-1-5-21-1540151660-3530000288-105586595-1517`). Because the malware was active, follow-on activity linked to the targeted user account was also flagged elsewhere in the incident.'
    question: 'Following this Kekeo/Rubeus credential dumping activity, the targeted user account was involved in related alerts in the cloud. What is the Microsoft Entra ID (Azure AD) user ID of that account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '97e6a954-b6bd-48a5-808c-bd8464cce677'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '97e6a954-b6bd-48a5-808c-bd8464cce677'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'An active ''Kekeo'' malware was detected running on the machine, associated with the user account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677`.'
