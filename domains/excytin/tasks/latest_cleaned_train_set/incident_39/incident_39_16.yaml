tasks:
- task_id: incident_39_latest_cleaned_train_set_task_16
  title: incident_39_latest_cleaned_train_set_task_16
  description: 'For the related ''Sign-in attempt with deceptive user account'' alert, what is the security identifier (SID) of the account involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a known credential theft tool was executed: the file `mimikatz.exe` ran with process ID 5176 and the command line `"mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit`, indicating an intent to dump or pass users'' credentials and Kerberos tickets. Around the same time on the same device, an alert was raised for a sign-in attempt using a deceptive (decoy) user account, which attackers commonly leverage for lateral movement and access to sensitive data.'
    question: 'For the related ''Sign-in attempt with deceptive user account'' alert, what is the security identifier (SID) of the account involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-0-6-5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A known credential theft tool was executed on host `vnevado-win10v`, with a command line indicating intent to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the credential theft, a sign-in attempt was detected using the deceptive user account named `kyleg` on that device.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The same deceptive sign-in attempt is associated with the account SID `S-0-6-5`, which the attacker may use for lateral movement and accessing sensitive data.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
