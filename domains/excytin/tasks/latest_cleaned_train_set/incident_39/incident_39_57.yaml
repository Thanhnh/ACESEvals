tasks:
- task_id: incident_39_latest_cleaned_train_set_task_57
  title: incident_39_latest_cleaned_train_set_task_57
  description: 'For the related alert about emails with a malicious URL that were delivered and then removed, what was the sender IP address of those messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an alert titled ''User and IP address reconnaissance (SMB)'' was raised: the account of Ethan Brooks (Account Executive) on host `VNEVADO-Win10V` enumerated SMB sessions on the domain controller `VNEVADO-DC`, retrieving recent IP addresses of 2 accounts. Around the same time, a related alert fired for email messages containing a malicious URL that were delivered to a mailbox and later removed.'
    question: 'For the related alert about emails with a malicious URL that were delivered and then removed, what was the sender IP address of those messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '118.254.65.186'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '118.254.65.186'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with email `tgs2z@vnevado.alpineskihouse.co` was involved in user and IP address reconnaissance (SMB), enumerating SMB sessions on VNEVADO-DC from VNEVADO-Win10V.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Related to this activity, email messages containing a malicious URL were delivered and later removed, sent from the sender IP address `118.254.65.186`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
