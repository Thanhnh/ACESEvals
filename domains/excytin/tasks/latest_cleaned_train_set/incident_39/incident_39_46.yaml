tasks:
- task_id: incident_39_latest_cleaned_train_set_task_46
  title: incident_39_latest_cleaned_train_set_task_46
  description: 'For the related ''Suspicious service launched'' alert on this device, what was the process ID, creation time, and command line of the service process involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a known credential theft tool execution was detected: the process `mimikatz.exe` (Process ID 4748, created 2024-06-27T14:33:38.0249949Z) was run with the command line `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`, targeting `vnevado-dc.vnevado.alpineskihouse.co` and associated with IP address `65.233.23.156`. This activity is linked through shared entities to other alerts on the same device, including dropped dual-purpose tools, ''Kekeo'' malware detection, and a suspicious service launch used for persistence or privilege escalation.'
    question: 'For the related ''Suspicious service launched'' alert on this device, what was the process ID, creation time, and command line of the service process involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 684, Created Time (UTC): 2024-06-26T17:11:52.8075185Z, Command line: services.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 684, Created Time (UTC): 2024-06-26T17:11:52.8075185Z, Command line: services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` executed a known malicious credential theft tool, indicating intent to dump users'' credentials, keys, and plain-text passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Multiple dual-purpose tools were dropped on the device, including the file `rubeus.exe`, which can be used for credential theft, privilege escalation, and lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The ''Kekeo'' malware was detected and was active on the host with AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'A suspicious service was launched on that device via the process `services.exe` with Process ID `684`, created at `2024-06-26t17:11:52.8075185z`, likely used to maintain persistence or elevate privileges.'
