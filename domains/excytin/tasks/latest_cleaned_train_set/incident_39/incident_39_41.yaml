tasks:
- task_id: incident_39_latest_cleaned_train_set_task_41
  title: incident_39_latest_cleaned_train_set_task_41
  description: 'Following this activity, an alert was raised for User and IP address reconnaissance (SMB), where SMB sessions were enumerated on VNEVADO-DC to retrieve recent IP addresses of accounts. What is the email address of the compromised account associated with that reconnaissance alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, the ''Kekeo'' malware was detected and found active on host `vnevado-win10b` (AAD Device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), where the account `fk8mq` ran a credential-theft tool with the command line `2608__2024-06-27t14:33:27.7927134z__rubeus.exe dump /service:xfbzkp /user:lucasb`. The activity later expanded to Kerberos abuse and domain reconnaissance against the domain controller VNEVADO-DC.'
    question: 'Following this activity, an alert was raised for User and IP address reconnaissance (SMB), where SMB sessions were enumerated on VNEVADO-DC to retrieve recent IP addresses of accounts. What is the email address of the compromised account associated with that reconnaissance alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The ''Kekeo'' malware was detected and was active on the device associated with the user account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the Kekeo tool, a suspected overpass-the-hash attack (Kerberos) was performed by Emma Clark (Helpdesk Administrator) from VNEVADO-Win10V against the domain controller host `VNEVADO-DC`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'From the same compromised host, user and IP address reconnaissance (SMB) was performed against VNEVADO-DC, enumerating SMB sessions and retrieving recent IP addresses of accounts, including the account with email `tgs2z@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
