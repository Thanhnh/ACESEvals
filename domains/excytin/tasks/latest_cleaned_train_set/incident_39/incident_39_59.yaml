tasks:
- task_id: incident_39_latest_cleaned_train_set_task_59
  title: incident_39_latest_cleaned_train_set_task_59
  description: 'Around the same time on this same host, a ''Kekeo'' malware detection was raised. What is the name of the file that triggered that malware detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a suspicious service was launched on host `vnevado-dc` by the account `lucasb` (SID S-1-5-21-1440151660-4837038288-105596163-1120, AAD user ID 7fcf9695-68fc-4258-864d-e1e5b166c66f). The activity included process 3780 running `powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" -databasepath (get-itemproperty -path registry::hklm\system\currentcontrolset\services\ntds\parameters).\"dsa database file\" -force; net.exe start ntds"` and process 3400 running `"net.exe" start ntds`, followed by an anomalous chain of user account lookups on the same device.'
    question: 'Around the same time on this same host, a ''Kekeo'' malware detection was raised. What is the name of the file that triggered that malware detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious service was launched using the process `net.exe`, indicating an attacker may be using services to run malicious commands for persistence or privilege escalation.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On the host `vnevado-win10v`, an anomalous chain of account lookups was observed, suggesting the attacker was gathering information about potential target accounts.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The ''Kekeo'' malware was detected on the device in the file `rubeus.exe`, a known Kerberos ticket abuse tool used for credential theft and lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
