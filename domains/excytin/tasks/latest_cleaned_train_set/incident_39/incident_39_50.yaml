tasks:
- task_id: incident_39_latest_cleaned_train_set_task_50
  title: incident_39_latest_cleaned_train_set_task_50
  description: 'A related alert in this incident reported a successful logon using overpass-the-hash with potentially stolen credentials. Which file (process image) was identified as the source from which the credentials were likely harvested in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a sign-in attempt with a deceptive user account was detected on host `vnevado-win10v` (AAD device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`), involving accounts such as `tgs2z` (SID `S-5-7-21-1843151660-3234030288-105586167-1422`) and `kyleg`, with sign-in activity from IP address `35.202.74.47`. This activity was followed within seconds by a sequence of alerts indicative of potential human-operated malicious activity on the same device.'
    question: 'A related alert in this incident reported a successful logon using overpass-the-hash with potentially stolen credentials. Which file (process image) was identified as the source from which the credentials were likely harvested in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lsass.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'lsass.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in attempt was detected using a deceptive (decoy) user account named `kyleg`, suggesting an attacker was probing the device with a fake account.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A sequence of alerts indicative of potential human-operated malicious activity was observed involving the user with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677`, which could lead to ransomware or other payloads being deployed.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A successful logon using overpass-the-hash with potentially stolen credentials was detected, where the password hash was obtained from the memory of the process file `lsass.exe` and used to obtain a Kerberos ticket for authenticating to network resources.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
