tasks:
- task_id: incident_39_latest_cleaned_train_set_task_63
  title: incident_39_latest_cleaned_train_set_task_63
  description: 'A nearly simultaneous sign-in attempt with the same deceptive user account was detected about one second earlier on this device. What is the security identifier (SID) of the deceptive user account that was used in that sign-in attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04 at approximately 22:35:02 UTC, an alert titled "Sign-in attempt with deceptive user account" was raised on the device `vnevado-win10b` (AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), involving the local system context account with SID `S-0-6-5` and the IP address `141.216.110.153`. The alert indicates a potential attacker might be using a fake or decoy user account on this device to perform activities such as lateral movement or access to sensitive data.'
    question: 'A nearly simultaneous sign-in attempt with the same deceptive user account was detected about one second earlier on this device. What is the security identifier (SID) of the deceptive user account that was used in that sign-in attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-5-7-21-1843151660-3234030288-105586167-1422'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-5-7-21-1843151660-3234030288-105586167-1422'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in attempt with a deceptive (decoy) user account named `kyleg` was detected on the device at 2024-07-04 22:35:02 UTC, indicating a potential attacker using a fake account for lateral movement or data access.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same deceptive sign-in activity was associated with the account identified by SID `S-5-7-21-1843151660-3234030288-105586167-1422`, confirming the decoy account used in the attack attempt.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
