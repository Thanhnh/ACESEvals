tasks:
- task_id: incident_39_latest_cleaned_train_set_task_90
  title: incident_39_latest_cleaned_train_set_task_90
  description: 'Linked to this incident, a later alert on 2024-07-10 reported that a user clicked on a link found to be malicious. What is the display name of the user account associated with that potentially malicious URL click?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, Microsoft Defender flagged an attempt to disable the Microsoft Defender Antivirus service (antivirus tampering) as a possible detection-evasion technique. The activity was tied to the account `tgs2z` on host `vnevado-win10v` (AAD device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`), where `powershell.exe` was observed executing the script `get-krbticket.ps1` with the command line `powershell.exe c:\m365dattack\get-krbticket.ps1` (Process ID 6636, created 2024-06-27T14:32:46Z).'
    question: 'Linked to this incident, a later alert on 2024-07-10 reported that a user clicked on a link found to be malicious. What is the display name of the user account associated with that potentially malicious URL click?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Ethan Brooks'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` attempted to disable the Microsoft Defender Antivirus service, indicating antivirus tampering for defense evasion.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The user account `Ethan Brooks` clicked on a potentially malicious URL that was detected in the environment.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
