tasks:
- task_id: incident_39_latest_cleaned_train_set_task_44
  title: incident_39_latest_cleaned_train_set_task_44
  description: 'In the closely related alert where a suspicious file was registered as a service for persistence, which account name was observed performing the service registration?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert titled "File dropped and launched from remote location" fired on host `vnevado-dc`, indicating that a remote session dropped a file and executed it — a possible sign of lateral movement or malware propagation. The alert involved the process `psexesvc.exe` (Process ID 7668, created 2024-06-27T14:34:10.0201983Z, command line `psexesvc.exe`) and the account `lucasb` (SID `S-1-5-21-1440151660-4837038288-105596163-1120`, Azure AD User ID `7fcf9695-68fc-4258-864d-e1e5b166c66f`). This activity was linked through a shared remote IP address to another alert raised at nearly the same time.'
    question: 'In the closely related alert where a suspicious file was registered as a service for persistence, which account name was observed performing the service registration?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A remote session from IP address `141.216.110.153` dropped a file and executed it, indicating possible lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The account `fk8mq` registered the suspicious file as a service for persistence.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
