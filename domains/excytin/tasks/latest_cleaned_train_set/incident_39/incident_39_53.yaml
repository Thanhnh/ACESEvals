tasks:
- task_id: incident_39_latest_cleaned_train_set_task_53
  title: incident_39_latest_cleaned_train_set_task_53
  description: 'Tracing this activity chain further, one of the related alerts shows a user clicked on a link inside an email that had been quarantined by zero-hour auto purge (ZAP). What was the full URL that the user accessed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage incident, a sequence of alerts indicative of potential human-operated malicious activity was observed on a device (AAD Device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`). The activity included the execution of `powershell -command set-mppreference -disablerealtimemonitoring 1` (PID 6968), credential theft with `cmd /c "c:\temp\rubeus.exe dump /service:xfbzkp /user:lucasb > c:\temp\adminticket.txt"` (PID 7644), and lateral movement via PsExec launching commands on a remote device, involving account `fk8mq` (AAD User ID 97e6a954-b6bd-48a5-808c-bd8464cce677) and IP address 141.216.110.153.'
    question: 'Tracing this activity chain further, one of the related alerts shows a user clicked on a link inside an email that had been quarantined by zero-hour auto purge (ZAP). What was the full URL that the user accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A sequence of human-operated malicious activity was detected on the device, involving the credential theft tool process `rubeus.exe` (ExtractedFileName: `rubeus.exe`) at 2024-07-04 22:35:03 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` used PsExec to launch a command on a remote device, indicating lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'That same user later clicked a link in an email that had been quarantined by zero-hour auto purge (ZAP), accessing the malicious URL `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/` at 2024-07-10 11:24:45 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
