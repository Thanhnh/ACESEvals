tasks:
- task_id: incident_39_latest_cleaned_train_set_task_75
  title: incident_39_latest_cleaned_train_set_task_75
  description: 'For the alert reporting the malicious credential theft tool execution, what is the Microsoft Entra ID (AAD) user identifier of the account associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a lateral movement incident, an alert titled "File dropped and launched from remote location" was raised after a remote session dropped and executed a file. The process involved was recorded as `7668__2024-06-27t14:34:10.0201983z__psexesvc.exe`. Follow-on alerts on the same device included a process suspiciously stopping services, multiple dual-purpose tools being dropped, and finally the detection of a known credential theft tool execution command line intended to dump users'' credentials, keys and plain-text passwords.'
    question: 'For the alert reporting the malicious credential theft tool execution, what is the Microsoft Entra ID (AAD) user identifier of the account associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `lucasb` was used in a remote session that dropped a file and launched it on the device, indicating lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'On that device, the process `powershell.exe` was used to suspiciously stop running services, likely to evade detection and prevent recovery.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` dropped multiple dual-purpose tools on the device for credential theft, privilege escalation, and lateral movement.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The same compromised user, identified by AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`, executed a known malicious credential theft tool to dump users'' credentials and plain-text passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
