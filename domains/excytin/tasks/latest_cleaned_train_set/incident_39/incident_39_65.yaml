tasks:
- task_id: incident_39_latest_cleaned_train_set_task_65
  title: incident_39_latest_cleaned_train_set_task_65
  description: 'A related alert on the same device flagged an anomalous chain of user account lookups, suggesting the attacker was enumerating potential targets. What was the process ID, creation time, and full command line of the process responsible for that account enumeration?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage intrusion, an alert titled ''Multiple dual-purpose tools were dropped'' fired on a device, showing that publicly available tools that can be abused for credential theft, privilege escalation, and lateral movement were staged there. Observed activity included `powershell.exe` running `c:\users\tgs2z\downloads\domaindominance27\domaindominance27.ps1` (PID 4676), `mimikatz.exe` executed with `privilege::debug sekurlsa::logonpasswords exit` (PID 5196) and pass-the-hash commands against domain vnevado.alpineskihouse.co, plus `get-krbticket.ps1` and `rubeus.exe`.'
    question: 'A related alert on the same device flagged an anomalous chain of user account lookups, suggesting the attacker was enumerating potential targets. What was the process ID, creation time, and full command line of the process responsible for that account enumeration?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 6264, Created Time (UTC): 2024-06-27T14:32:22.2653632Z, Command line: "net.exe" group /domain'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 6264, Created Time (UTC): 2024-06-27T14:32:22.2653632Z, Command line: "net.exe" group /domain'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Multiple dual-purpose tools were dropped on the device, including the file `domaindominance27.ps1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The dropped tooling led to an anomalous chain of account lookups, executed by the process with Process ID `6264` created at `2024-06-27t14:32:22.2653632z` with command line `"net.exe" group /domain`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
