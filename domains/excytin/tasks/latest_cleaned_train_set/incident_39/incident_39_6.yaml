tasks:
- task_id: incident_39_latest_cleaned_train_set_task_6
  title: incident_39_latest_cleaned_train_set_task_6
  description: 'For the related "Suspicious service launched" alert, which service executable was started, and what were its process ID and creation time?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert fired for "PsExec launched a command on a remote device" on the host with AAD device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`. The activity was tied to the account `tgs2z` (SID `S-5-7-21-1843151660-3234030288-105586167-1422`) and included processes such as `powershell.exe -executionpolicy bypass -file c:\users\tgs2z\downloads\domaindominance27\domaindominance27.ps1`, `powershell.exe c:\m365dattack\get-krbticket.ps1`, and remote commands like `"psexec.exe" \\vnevado-win10b -accepteula cmd /c "powershell -command set-mppreference -disablerealtimemonitoring 1"` and `"psexec.exe" \\vnevado-win10b -accepteula cmd /c "c:\temp\rubeus.exe dump /service:xfbzkp /user:lucasb > c:\temp\adminticket.txt"`. Shortly before these events, related alerts for SID history injection and a suspicious service launch were also raised on the affected devices.'
    question: 'For the related "Suspicious service launched" alert, which service executable was started, and what were its process ID and creation time?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The service executable was `psexesvc.exe`, with Process ID 7668, created at 2024-06-27T14:34:10.0201983Z.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The service executable was `psexesvc.exe`, with Process ID 7668, created at 2024-06-27T14:34:10.0201983Z.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'PsExec was used to launch a command on a remote device, executing the process `net.exe` remotely to move laterally in the organization.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A SID history injection was detected on the host `vnevado-dc`, where an attacker modified the SID history attribute to gain elevated privileges.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A suspicious service was launched on the device with Process ID `7668` at `2024-06-27t14:34:10.0201983z` running the command line `psexesvc.exe`, the PsExec service used to maintain persistence and execute remote commands.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
