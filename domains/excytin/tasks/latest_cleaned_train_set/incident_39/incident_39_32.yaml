tasks:
- task_id: incident_39_latest_cleaned_train_set_task_32
  title: incident_39_latest_cleaned_train_set_task_32
  description: 'For that suspected overpass-the-hash (Kerberos) alert, what is the email address (UPN) of the account used in the authentication attempt against VNEVADO-DC?'
  inherit_shared: true
  initial_context:
    incident_context: 'A high-priority incident flagged "Potential human-operated malicious activity" on the device `vnevado-win10b` (AAD Device ID `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`), where a sequence of alerts indicative of hands-on-keyboard attacker activity was observed involving the account `kyleg` and the source IP address `141.216.110.153`. Such activity often precedes ransomware or other payload deployment. Pivoting from this device, the investigation surfaced a related identity-based alert: a suspected overpass-the-hash attack (Kerberos) in which a Helpdesk Administrator account on VNEVADO-Win10V attempted to authenticate against the domain controller VNEVADO-DC.'
    question: 'For that suspected overpass-the-hash (Kerberos) alert, what is the email address (UPN) of the account used in the authentication attempt against VNEVADO-DC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A sequence of alerts indicative of human-operated malicious activity was observed involving the account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677`, which might lead to ransomware or other payloads being installed on target devices.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that activity, a suspected overpass-the-hash attack (Kerberos) was detected, where Emma Clark (Helpdesk Administrator) on device VNEVADO-Win10V attempted to authenticate against the domain controller VNEVADO-DC.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The compromised account involved in this Kerberos overpass-the-hash attempt is identified by the email `fk8mq@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
