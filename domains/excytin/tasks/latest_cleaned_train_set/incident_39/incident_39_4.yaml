tasks:
- task_id: incident_39_latest_cleaned_train_set_task_4
  title: incident_39_latest_cleaned_train_set_task_4
  description: 'Which user account was targeted in the SID history injection alert associated with this device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a suspicious service was launched on a device: the process `psexesvc.exe` (Process ID 7668, created 2024-06-27T14:34:10.0201983Z) was started by `services.exe` (Process ID 652, created 2024-06-19T12:56:00.7201251Z). Attackers often abuse services to launch malicious commands or programs in order to maintain persistence or elevate privileges. Almost at the same time, a SID history injection was detected on the same device, where attackers typically modify the SID history attribute of an existing domain user to an SID with elevated privileges.'
    question: 'Which user account was targeted in the SID history injection alert associated with this device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lucasb'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'lucasb'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious service was launched on the host `vnevado-dc`, potentially used by attackers to run malicious commands for persistence or privilege elevation.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A SID history injection was detected involving the account `lucasb`, where the SID history attribute was modified to grant elevated privileges.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
