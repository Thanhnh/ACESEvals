  description: 'For the identity behind this PsExec-based lateral movement activity, what is the Microsoft Entra ID (Azure AD) user object ID recorded for that account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a lateral movement incident, an alert fired for "PsExec launched a command on a remote device" on the device with AAD Device ID `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`. The activity was performed under the local account named `tgs2z`, which first ran `powershell.exe -executionpolicy bypass -file c:\users\tgs2z\downloads\domaindominance27\domaindominance27.ps1` (PID 4676) and then used psexec.exe to disable real-time monitoring on `vnevado-win10b`, dump Kerberos tickets with `rubeus.exe`, and stop/start the NTDS service on `vnevado-dc` while injecting SID history.'
    question: 'For the identity behind this PsExec-based lateral movement activity, what is the Microsoft Entra ID (Azure AD) user object ID recorded for that account?'
