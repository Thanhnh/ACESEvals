tasks:
- task_id: incident_39_latest_cleaned_train_set_task_55
  title: incident_39_latest_cleaned_train_set_task_55
  description: 'For the SID history injection alert that followed, what is the name of the file associated with that detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'In this multi-stage incident, an attacker successfully logged on using an overpass-the-hash attack with potentially stolen credentials, involving the account `fk8mq` (SID S-1-5-21-1540151660-3530000288-105586595-1517) on host `vnevado-win10b`, where the process `lsass.exe` (PID 692) was accessed. Shortly afterwards, a remote session dropped a file and executed it, and then a SID history injection was detected on a device — SID history is an attribute supporting migration scenarios that attackers modify to grant an existing domain user an SID with elevated privileges.'
    question: 'For the SID history injection alert that followed, what is the name of the file associated with that detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dkwj.mze'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dkwj.mze'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An attacker performed a successful logon using overpass-the-hash with potentially stolen credentials from the IP address `141.216.110.153`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'From that remote session, a file was dropped and launched on the host `vnevado-dc`, indicating lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A SID history injection was detected on the device, associated with the dropped file named `dkwj.mze`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
