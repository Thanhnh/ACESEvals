tasks:
- task_id: incident_39_latest_cleaned_train_set_task_40
  title: incident_39_latest_cleaned_train_set_task_40
  description: 'For the related credential theft tool execution alert triggered under the same user account, what was the process ID and the exact command line used to dump plain-text credentials from memory?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a malicious credential theft tool execution was detected on an endpoint: the process `mimikatz.exe` (Process ID 5176, created 2024-06-27T14:33:32.4282796Z) was launched with the command line `"mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit`, indicating a Kerberos ticket pass-the-ticket attempt. A related alert of the same type was raised under the same user account (SID) at nearly the same time.'
    question: 'For the related credential theft tool execution alert triggered under the same user account, what was the process ID and the exact command line used to dump plain-text credentials from memory?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 5196, Command line: `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit` (created 2024-06-27T14:32:35.4061023Z)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 5196, Command line: `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit` (created 2024-06-27T14:32:35.4061023Z)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` was detected executing a known credential theft tool.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'That account launched the credential theft tool mimikatz with the command line `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit` at `2024-06-27t14:32:35.4061023z`, with Process ID `5196`, in order to dump users'' credentials and plain-text passwords.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
