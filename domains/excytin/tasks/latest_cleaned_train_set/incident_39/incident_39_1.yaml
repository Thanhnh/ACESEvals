tasks:
- task_id: incident_39_latest_cleaned_train_set_task_1
  title: incident_39_latest_cleaned_train_set_task_1
  description: 'A closely related alert, ''Malicious credential theft tool execution detected'', fired seconds earlier for another credential theft command that targeted the domain controller''s directory replication rather than LSASS memory. What was the process ID, creation time, and full command line of that execution, and which account was targeted?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of this intrusion, a ''Suspicious access to LSASS service'' alert fired after `mimikatz.exe` was repeatedly executed on the compromised host in the vnevado.alpineskihouse.co domain. The observed command lines included `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit` (PID 5196), and several pass-the-hash runs such as PID 4112 (`sekurlsa::pth /user:kyleg /ntlm:96def1a633fc6790124d5f8fe31cc72b ... /run:"powershell.exe dir \\vnevado-win10b\c$"`), PID 6880 and PID 7092, the latter launching `powershell.exe c:\m365dattack\get-krbticket.ps1`. These processes accessed `lsass.exe` (PID 636) to dump credentials.'
    question: 'A closely related alert, ''Malicious credential theft tool execution detected'', fired seconds earlier for another credential theft command that targeted the domain controller''s directory replication rather than LSASS memory. What was the process ID, creation time, and full command line of that execution, and which account was targeted?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID 4748, created 2024-06-27T14:33:38.0249949Z, command line: `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit` — the targeted account was `xfbzkp`.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID 4748, created 2024-06-27T14:33:38.0249949Z, command line: `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit` — the targeted account was `xfbzkp`.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` performed suspicious access to the LSASS service in an attempt to dump clear-text credentials from memory.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using those credentials, the attacker executed the known credential theft tool Mimikatz with the command line `"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit` at `2024-06-27t14:33:38.0249949z`, with Process ID `4748`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
