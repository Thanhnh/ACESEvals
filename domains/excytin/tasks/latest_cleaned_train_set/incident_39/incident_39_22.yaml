tasks:
- task_id: incident_39_latest_cleaned_train_set_task_22
  title: incident_39_latest_cleaned_train_set_task_22
  description: 'In that final credential theft tool execution alert, what network target (URL/FQDN) was referenced by the malicious command line?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage intrusion, the account `lucasb` (SID `S-1-5-21-1440151660-4837038288-105596163-1120`, AAD user ID `7fcf9695-68fc-4258-864d-e1e5b166c66f`) triggered a ''Suspicious service launched'' alert. The activity involved PowerShell stopping and restarting the NTDS service while injecting SID history for an account (process 3780, command line: `powershell.exe -command "net.exe stop ntds /y; add-addbsidhistory -samaccountname bdadmin -sidhistory \"s-1-5-32-544\" ... ; net.exe start ntds"`, followed by process 3400 running `"net.exe" start ntds`). Shortly afterwards, the Mimikatz credential theft hacktool was detected, and moments later an alert fired for ''Malicious credential theft tool execution detected'', where the process or its command line indicated intent to dump users'' credentials, keys and plain-text passwords.'
    question: 'In that final credential theft tool execution alert, what network target (URL/FQDN) was referenced by the malicious command line?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-dc.vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-dc.vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious service was started on the device, launching the process `powershell.exe` (ExtractedFileName: `powershell.exe`), which attackers commonly use for persistence or privilege escalation.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The Mimikatz credential theft tool was then detected on the host with HostName `vnevado-win10v`, indicating an attempt to harvest plaintext passwords, hashes, and Kerberos tickets.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A malicious credential theft tool execution command line was detected targeting the domain controller at URL `vnevado-dc.vnevado.alpineskihouse.co`, showing intent to dump credentials from that host.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
