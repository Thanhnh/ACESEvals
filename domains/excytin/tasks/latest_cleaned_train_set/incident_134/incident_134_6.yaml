tasks:
- task_id: incident_134_latest_cleaned_train_set_task_6
  title: incident_134_latest_cleaned_train_set_task_6
  description: 'Roughly a day earlier, on 2024-07-17, the same compromised user account was also flagged for signing in from an anonymous IP address (such as a Tor browser or anonymizer VPN). What was the IP address recorded in that ''Anonymous IP address'' alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an identity-focused security incident, Microsoft Entra ID Protection raised a ''Malicious IP address'' alert on 2024-07-18 13:48 UTC, indicating a sign-in from an IP address known to be malicious for the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
    question: 'Roughly a day earlier, on 2024-07-17, the same compromised user account was also flagged for signing in from an anonymous IP address (such as a Tor browser or anonymizer VPN). What was the IP address recorded in that ''Anonymous IP address'' alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from an IP address known to be malicious was detected for the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` at 2024-07-18 13:48:02 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account was also involved in an earlier ''Anonymous IP address'' alert at 2024-07-17 11:01:27 UTC, where the sign-in originated from the anonymous IP address `170.54.121.63` (e.g., Tor browser or anonymizer VPN).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
