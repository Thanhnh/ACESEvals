tasks:
- task_id: incident_134_latest_cleaned_train_set_task_3
  title: incident_134_latest_cleaned_train_set_task_3
  description: 'A related alert in this incident involves the mailbox that was targeted by these suspicious messages. What is the primary address of that mailbox?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing BEC (business email compromise) investigation, an alert titled "Suspicious emails sent by BEC-related user" was triggered on 2024-07-17. The alert indicates that suspicious emails were sent from the possibly compromised account `raphaelt@vnevado.alpineskihouse.co` (display name `Nina Park`, SID `S-1-5-21-1874151667-3554330288-105586563-1715`, Entra ID `e036dee7-fa23-42ef-a019-468c8d3401f1`), with the messages originating from sender IP address `237.7.81.122`.'
    question: 'A related alert in this incident involves the mailbox that was targeted by these suspicious messages. What is the primary address of that mailbox?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'nathan@avoriaz.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'nathan@avoriaz.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious emails related to an ongoing BEC (business email compromise) fraud attempt were sent from the possibly compromised mailbox with primary address `nathan@avoriaz.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
