tasks:
- task_id: incident_134_latest_cleaned_train_set_task_14
  title: incident_134_latest_cleaned_train_set_task_14
  description: 'This compromise is linked to an earlier ''BEC financial fraud'' alert, where a suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session. What was the source IP address associated with that inbox rule creation activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage identity attack, an alert was raised for ''Account compromised following a password-spray attack'', where a user was signed in from an unusual location and browser from the IP address `170.54.121.63`. An attacker might have compromised the user account for unauthorized access to the network.'
    question: 'This compromise is linked to an earlier ''BEC financial fraud'' alert, where a suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session. What was the source IP address associated with that inbox rule creation activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '237.7.81.122'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '237.7.81.122'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Nina Park` was compromised following a password-spray attack, with a sign-in from an unusual location and browser.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the compromised account, the attacker created a suspicious inbox rule that hides incoming email messages during a risky Azure Active Directory session, indicating business email compromise (BEC) financial fraud, originating from IP address `237.7.81.122`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
