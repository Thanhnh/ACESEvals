tasks:
- task_id: incident_134_latest_cleaned_train_set_task_13
  title: incident_134_latest_cleaned_train_set_task_13
  description: 'For the earlier ''BEC financial fraud'' alert where the hidden-message inbox rule was created, what is the security identifier (SID) of the account involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing business email compromise (BEC) investigation, an alert was raised for suspicious emails sent by a possibly compromised user account. The emails were sent from `raphaelt@vnevado.alpineskihouse.co` (sender IP `237.7.81.122`) to the mailbox `nathan@avoriaz.alpineskihouse.co`. This alert was triggered based on a previous BEC-related alert, in which a suspicious inbox rule that hides incoming email messages was created within a risky Azure Active Directory session, indicating an attempt at financial fraud.'
    question: 'For the earlier ''BEC financial fraud'' alert where the hidden-message inbox rule was created, what is the security identifier (SID) of the account involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1874151667-3554330288-105586563-1715'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1874151667-3554330288-105586563-1715'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session by the user account with SID `S-1-5-21-1874151667-3554330288-105586563-1715`, indicating a BEC (business email compromise) financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same possibly compromised user account with SID `S-1-5-21-1874151667-3554330288-105586563-1715` then sent suspicious emails, continuing the ongoing BEC fraud attempt.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
