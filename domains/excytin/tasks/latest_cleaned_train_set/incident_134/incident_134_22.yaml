tasks:
- task_id: incident_134_latest_cleaned_train_set_task_22
  title: incident_134_latest_cleaned_train_set_task_22
  description: 'For the follow-up alert about the account compromised following the password-spray attack, what was the source IP address of the suspicious sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a potentially malicious URL click was detected on 2024-07-17. The email delivering the link was sent from `alyssat@vnevado.alpineskihouse.co` (sender IP `254.241.243.229`) to the mailbox of `raphaelt@vnevado.alpineskihouse.co`, and contained the link `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`. The following day, a related alert reported that a user account was compromised after being signed in from an unusual location and browser during a password-spray attack.'
    question: 'For the follow-up alert about the account compromised following the password-spray attack, what was the source IP address of the suspicious sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-1874151667-3554330288-105586563-1715` clicked on a potentially malicious URL delivered to them.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following a password-spray attack, the compromised account was signed in from an unusual location and browser originating from IP address `170.54.121.63`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
