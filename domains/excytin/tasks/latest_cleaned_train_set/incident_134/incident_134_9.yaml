tasks:
- task_id: incident_134_latest_cleaned_train_set_task_9
  title: incident_134_latest_cleaned_train_set_task_9
  description: 'The affected user account was also involved in a later alert on 2024-07-18 indicating the account was compromised following a password-spray attack, where the sign-in came from an unusual location and browser. What is the source IP address associated with that compromising sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert for a ''Suspicious inbox manipulation rule'' was raised on 2024-07-17, where a user''s inbox rules were manipulated in a suspicious manner from the IP address `237.7.81.122` within the cloud application with AppId `20893`. An attacker might have gained access to the user''s mailbox and is manipulating rules to delete or move messages in order to exfiltrate data from the organization.'
    question: 'The affected user account was also involved in a later alert on 2024-07-18 indicating the account was compromised following a password-spray attack, where the sign-in came from an unusual location and browser. What is the source IP address associated with that compromising sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Nina Park` had inbox rules manipulated in a suspicious manner, indicating an attacker may have gained access to the mailbox to hide or exfiltrate messages.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following a password-spray attack, the compromised account was signed in from an unusual location and browser originating from the IP address `170.54.121.63`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
