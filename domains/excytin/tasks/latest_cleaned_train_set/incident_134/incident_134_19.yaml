tasks:
- task_id: incident_134_latest_cleaned_train_set_task_19
  title: incident_134_latest_cleaned_train_set_task_19
  description: 'For the Password Spray alert that is linked to this activity, what is the Microsoft Entra (AAD) user ID of the targeted account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this investigation, Microsoft Entra ID Protection raised an ''Anonymous IP address'' alert on 2024-07-17, flagging a sign-in originating from the anonymous IP address `170.54.121.63` (e.g., Tor browser or anonymizer VPN). Pivoting on the related sign-in infrastructure led to another alert raised the following day, on 2024-07-18, reporting a password spray attack against the tenant.'
    question: 'For the Password Spray alert that is linked to this activity, what is the Microsoft Entra (AAD) user ID of the targeted account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e036dee7-fa23-42ef-a019-468c8d3401f1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'e036dee7-fa23-42ef-a019-468c8d3401f1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in was detected from an anonymous IP address `170.54.121.63` (e.g. Tor browser or anonymizer VPN) at 2024-07-17 11:01:27 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the anonymous sign-in activity, a password spray attack was detected targeting the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` at 2024-07-18 14:36:59 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
