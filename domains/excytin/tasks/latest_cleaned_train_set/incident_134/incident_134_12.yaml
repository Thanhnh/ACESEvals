tasks:
- task_id: incident_134_latest_cleaned_train_set_task_12
  title: incident_134_latest_cleaned_train_set_task_12
  description: 'For the Password Spray alert that is linked to this same compromised account, what source IP address was recorded as conducting the attack?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing business email compromise (BEC) investigation, an alert fired for "Suspicious emails sent by BEC-related user": the possibly compromised account of Nina Park (`raphaelt@vnevado.alpineskihouse.co`, SID `S-1-5-21-1874151667-3554330288-105586563-1715`) sent suspicious mail from sender IP `237.7.81.122` to the mailbox `nathan@avoriaz.alpineskihouse.co`. About a day later, on 2024-07-18, a related alert in the same incident reported a Password Spray attack tied back to the same compromised identity.'
    question: 'For the Password Spray alert that is linked to this same compromised account, what source IP address was recorded as conducting the attack?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` sent suspicious emails as part of an ongoing BEC (business email compromise) fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the account compromise activity, a password spray attack was detected originating from the IP address `170.54.121.63`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
