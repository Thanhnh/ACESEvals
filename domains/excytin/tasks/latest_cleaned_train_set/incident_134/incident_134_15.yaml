tasks:
- task_id: incident_134_latest_cleaned_train_set_task_15
  title: incident_134_latest_cleaned_train_set_task_15
  description: 'Roughly a day before this sign-in, a related alert reported that a user clicked on a potentially malicious URL. Which mailbox address sent the email message that delivered that malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Account compromised following a password-spray attack" was raised on 2024-07-18. A user was signed in from an unusual location and browser, originating from the IP address `170.54.121.63`, suggesting an attacker may have compromised the account to gain unauthorized access to the network.'
    question: 'Roughly a day before this sign-in, a related alert reported that a user clicked on a potentially malicious URL. Which mailbox address sent the email message that delivered that malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` was compromised following a password-spray attack, with a sign-in from an unusual location and browser.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the compromised account, a potentially malicious URL click was detected, originating from a phishing email sent by the sender `alyssat@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
