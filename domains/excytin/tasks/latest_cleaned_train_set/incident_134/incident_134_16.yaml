tasks:
- task_id: incident_134_latest_cleaned_train_set_task_16
  title: incident_134_latest_cleaned_train_set_task_16
  description: 'For the follow-up alert about the suspicious inbox manipulation rule, which IP address was recorded as performing the mailbox rule changes?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an identity-based attack investigation, an ''Anonymous IP address'' alert was raised at 2024-07-17 11:01:27 UTC for a sign-in originating from the anonymizing IP `170.54.121.63` (e.g. Tor browser or anonymizer VPN). About 30 minutes later, the same compromised user account triggered a ''Suspicious inbox manipulation rule'' alert, indicating an attacker gained access to the mailbox and created rules to delete or move messages in order to exfiltrate data.'
    question: 'For the follow-up alert about the suspicious inbox manipulation rule, which IP address was recorded as performing the mailbox rule changes?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '237.7.81.122'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '237.7.81.122'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) was detected for the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` at `2024-07-17 11:01:27.633644+00:00`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise of that account, a suspicious inbox manipulation rule was created to delete or move messages, originating from the IP address `237.7.81.122` at `2024-07-17 11:34:48.784934+00:00`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
