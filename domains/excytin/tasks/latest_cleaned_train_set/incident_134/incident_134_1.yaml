tasks:
- task_id: incident_134_latest_cleaned_train_set_task_1
  title: incident_134_latest_cleaned_train_set_task_1
  description: 'A follow-up alert flagged suspicious emails being sent by the possibly compromised user account tied to this BEC fraud attempt. What IP address was associated with that follow-up alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing business email compromise (BEC) investigation, an alert was raised for email messages containing a malicious URL `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/` that were delivered and later removed. The message was sent from `alyssat@vnevado.alpineskihouse.co` (sender IP `254.241.243.229`) to the mailbox `raphaelt@vnevado.alpineskihouse.co`.'
    question: 'A follow-up alert flagged suspicious emails being sent by the possibly compromised user account tied to this BEC fraud attempt. What IP address was associated with that follow-up alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '237.7.81.122'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '237.7.81.122'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The email account `raphaelt@vnevado.alpineskihouse.co` received an email containing a malicious URL, which was later removed after delivery at 2024-07-17 11:04:19 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account was then used to send suspicious BEC-related emails, originating from the IP address `237.7.81.122` at 2024-07-17 11:55:04 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
