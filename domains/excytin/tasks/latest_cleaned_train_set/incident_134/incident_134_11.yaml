tasks:
- task_id: incident_134_latest_cleaned_train_set_task_11
  title: incident_134_latest_cleaned_train_set_task_11
  description: 'For the related alert about email messages containing a malicious URL that were removed after delivery, which mailbox (primary address) received those emails?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a sign-in was detected from the IP address `170.54.121.63`, which is known to be malicious. This sign-in activity was linked to a compromised user account that was also involved in other alerts in the same incident, including one where emails containing a malicious URL were delivered and later removed from a mailbox.'
    question: 'For the related alert about email messages containing a malicious URL that were removed after delivery, which mailbox (primary address) received those emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'raphaelt@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from a known malicious IP address was detected for the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The mailbox with primary address `raphaelt@vnevado.alpineskihouse.co` received email messages containing a malicious URL, which were removed after delivery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
