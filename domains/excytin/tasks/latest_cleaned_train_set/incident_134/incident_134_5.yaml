tasks:
- task_id: incident_134_latest_cleaned_train_set_task_5
  title: incident_134_latest_cleaned_train_set_task_5
  description: 'In the follow-up alert about emails containing a malicious URL being removed after delivery, what exact URL was flagged in those messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we detected that one of your users clicked on a potentially malicious link `http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/` that was delivered to their mailbox. About five minutes later, a related alert was raised indicating that email messages containing a malicious URL were delivered and later removed from the mailbox (ZAP - zero-hour auto purge).'
    question: 'In the follow-up alert about emails containing a malicious URL being removed after delivery, what exact URL was flagged in those messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/ (the same host as the clicked link, but using the HTTPS scheme)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/ (the same host as the clicked link, but using the HTTPS scheme)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user with mailbox `raphaelt@vnevado.alpineskihouse.co` clicked on a potentially malicious URL.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The email messages containing the malicious URL `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/` were delivered and later removed.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
