tasks:
- task_id: incident_134_latest_cleaned_train_set_task_20
  title: incident_134_latest_cleaned_train_set_task_20
  description: 'Which user account (display name) is associated with the alert about the emails containing a malicious URL that were removed after delivery?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a password spray attack was detected originating from the IP address `170.54.121.63`, targeting user accounts in the environment. Investigation of the same incident also surfaced an earlier alert, raised on 2024-07-17, for email messages containing a malicious URL that were delivered to a mailbox and later removed by the system.'
    question: 'Which user account (display name) is associated with the alert about the emails containing a malicious URL that were removed after delivery?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Nina Park'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected against the account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The email account `Nina Park` received emails containing a malicious URL, which were delivered and later removed.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
