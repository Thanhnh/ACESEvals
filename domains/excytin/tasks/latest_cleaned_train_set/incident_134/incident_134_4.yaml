tasks:
- task_id: incident_134_latest_cleaned_train_set_task_4
  title: incident_134_latest_cleaned_train_set_task_4
  description: 'A related alert the following day indicates that an account was compromised following a password-spray attack, where a user signed in from an unusual location and browser. What is the email address of the user account that was compromised in that password-spray alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing identity-based investigation, an alert was raised for a sign-in from an anonymous IP address (e.g. Tor browser or anonymizer VPN) on 2024-07-17. The sign-in was associated with the AAD user ID `e036dee7-fa23-42ef-a019-468c8d3401f1` and originated from the IP address `170.54.121.63`.'
    question: 'A related alert the following day indicates that an account was compromised following a password-spray attack, where a user signed in from an unusual location and browser. What is the email address of the user account that was compromised in that password-spray alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'raphaelt@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in was detected from an anonymous IP address `170.54.121.63` (e.g., Tor browser or anonymizer VPN) at 2024-07-17 11:01:27 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following a password-spray attack, the account with email `raphaelt@vnevado.alpineskihouse.co` was compromised, signing in from an unusual location and browser at 2024-07-18 14:54:18 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
