tasks:
- task_id: incident_134_latest_cleaned_train_set_task_7
  title: incident_134_latest_cleaned_train_set_task_7
  description: 'For the follow-up alert about the account compromised after the password-spray attack, what was the IP address from which the suspicious sign-in originated?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised for ''Email messages containing malicious URL removed after delivery'' - an email sent from `alyssat@vnevado.alpineskihouse.co` (sender IP `254.241.243.229`) to the mailbox of `raphaelt@vnevado.alpineskihouse.co` contained the malicious URL `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`. The message was delivered and later removed. Roughly a day later, a related alert fired indicating that an account tied to this activity was compromised following a password-spray attack, where the user signed in from an unusual location and browser.'
    question: 'For the follow-up alert about the account compromised after the password-spray attack, what was the IP address from which the suspicious sign-in originated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The email account `Nina Park` received an email containing a malicious URL, which was delivered and later removed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following a password-spray attack, the account was compromised with a sign-in from an unusual location and browser originating from IP address `170.54.121.63`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
