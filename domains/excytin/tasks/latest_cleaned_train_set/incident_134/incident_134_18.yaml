tasks:
- task_id: incident_134_latest_cleaned_train_set_task_18
  title: incident_134_latest_cleaned_train_set_task_18
  description: 'Just minutes before this email alert, the same compromised user account triggered an identity alert for signing in from an anonymous IP address (e.g. Tor browser or anonymizer VPN). What was the source IP address of that anonymous sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired for ''Email messages containing malicious URL removed after delivery'' — an email sent from `alyssat@vnevado.alpineskihouse.co` (sender IP `254.241.243.229`) was delivered to the mailbox `raphaelt@vnevado.alpineskihouse.co` (account name Nina Park, SID S-1-5-21-1874151667-3554330288-105586563-1715) and contained the malicious URL `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/` before being removed.'
    question: 'Just minutes before this email alert, the same compromised user account triggered an identity alert for signing in from an anonymous IP address (e.g. Tor browser or anonymizer VPN). What was the source IP address of that anonymous sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` received an email containing a malicious URL, which was later removed after delivery.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that, a sign-in was detected from the anonymous IP address `170.54.121.63` (e.g., Tor browser or anonymizer VPN), indicating the compromised account was accessed while hiding the true source.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
