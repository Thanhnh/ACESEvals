tasks:
- task_id: incident_134_latest_cleaned_train_set_task_17
  title: incident_134_latest_cleaned_train_set_task_17
  description: 'For the related alert about emails with a malicious URL that were delivered and then removed after delivery, which mailbox address was the recipient of those messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) financial fraud incident, analysts found that a suspicious inbox rule designed to hide incoming email messages was created during a risky Azure Active Directory session originating from IP address `237.7.81.122`. Shortly before this, an alert fired for emails containing a malicious URL that were delivered and later removed from a mailbox.'
    question: 'For the related alert about emails with a malicious URL that were delivered and then removed after delivery, which mailbox address was the recipient of those messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'raphaelt@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule that hides incoming email messages was created in a risky Azure AD session by the user with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`, indicating a possible business email compromise (BEC) financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Related to this compromise, emails containing a malicious URL were delivered and later removed from the mailbox of the recipient `raphaelt@vnevado.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
