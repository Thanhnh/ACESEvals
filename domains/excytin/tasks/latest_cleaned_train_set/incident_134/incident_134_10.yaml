tasks:
- task_id: incident_134_latest_cleaned_train_set_task_10
  title: incident_134_latest_cleaned_train_set_task_10
  description: 'For the subsequent ''Malicious IP address'' sign-in alert tied to this same user account, what was the malicious source IP address of the sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a potentially malicious URL click was detected on 2024-07-17 — the user Nina Park (`raphaelt@vnevado.alpineskihouse.co`, SID `S-1-5-21-1874151667-3554330288-105586563-1715`) clicked on `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`, delivered in a message sent from `alyssat@vnevado.alpineskihouse.co` (sender IP `254.241.243.229`) to her mailbox. The following day, the same user account was involved in a sign-in alert flagged as originating from an IP address known to be malicious.'
    question: 'For the subsequent ''Malicious IP address'' sign-in alert tied to this same user account, what was the malicious source IP address of the sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` clicked on a potentially malicious URL on 2024-07-17 10:59:14 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the credential compromise, a sign-in for that user was observed on 2024-07-18 13:48:02 UTC originating from the known malicious IP address `170.54.121.63`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
