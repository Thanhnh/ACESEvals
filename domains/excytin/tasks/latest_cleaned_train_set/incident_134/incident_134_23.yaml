tasks:
- task_id: incident_134_latest_cleaned_train_set_task_23
  title: incident_134_latest_cleaned_train_set_task_23
  description: 'Which user account was the suspicious inbox rule associated with the BEC financial fraud alert created for? Provide the account name.'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise investigation, an ''Anonymous IP address'' alert was triggered for a sign-in originating from the IP address `170.54.121.63` (e.g. Tor browser or anonymizer VPN). Shortly afterwards, a related alert fired indicating that a suspicious inbox rule hiding incoming email messages was created within the same risky Azure Active Directory session, a common technique used to conduct BEC financial fraud.'
    question: 'Which user account was the suspicious inbox rule associated with the BEC financial fraud alert created for? Provide the account name.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Nina Park'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) was detected for the account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` at 2024-07-17 11:01:27 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Within the same risky Azure Active Directory session, a suspicious inbox rule that hides incoming email messages was created for the account `Nina Park` at 2024-07-17 11:34:48 UTC, indicating a possible business email compromise (BEC) financial fraud attempt.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
