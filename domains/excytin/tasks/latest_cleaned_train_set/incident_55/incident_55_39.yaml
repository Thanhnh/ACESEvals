tasks:
- task_id: incident_55_latest_cleaned_train_set_task_39
  title: incident_55_latest_cleaned_train_set_task_39
  description: 'Almost simultaneously on the same host, another alert was raised for suspicious access to the LSASS service, a technique used to extract clear-text credentials from memory. Which library (DLL) file was flagged as an entity in that LSASS access alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired indicating that a malicious PowerShell Cmdlet was invoked on a machine — the process `powershell.exe` (PID 13968, created 2024-07-02T09:47:59Z) executed the script `c:\script\contosoadfsblatempcreds.ps1` under the user account `pwilson` (SID S-1-5-21-551436448-9871687716-9837441745-1903). Such Cmdlets are often associated with credential theft, exploitation, network reconnaissance or code injection.'
    question: 'Almost simultaneously on the same host, another alert was raised for suspicious access to the LSASS service, a technique used to extract clear-text credentials from memory. Which library (DLL) file was flagged as an entity in that LSASS access alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vaultcli.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vaultcli.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious PowerShell Cmdlet, potentially associated with credential theft or code injection, was invoked on the host with HostName `mb-winclient`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that machine, a suspicious access to the LSASS service was observed involving the credential-related file `vaultcli.dll`, indicating an attempt to dump clear-text credentials from LSASS memory.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
