tasks:
- task_id: incident_55_latest_cleaned_train_set_task_77
  title: incident_55_latest_cleaned_train_set_task_77
  description: 'For the alert reporting the potentially malicious URL click by the affected user, what was the full URL that was clicked?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious service registration alert was raised when a system program was registered as a service, indicating possible intent to establish persistence or gain system privileges. The process involved was `services.exe` with ProcessId__CreatedTimeUtc__CommandLine value `764__2024-06-20t08:30:13.7925191z__services.exe`. This activity was linked through a shared host to a suspicious sequence of Windows exploration commands and to suspicious access to the LSASS service, where an attacker may have attempted to extract clear-text credentials. The compromised user account from the LSASS alert was later associated with another alert, in which a potentially malicious link was clicked.'
    question: 'For the alert reporting the potentially malicious URL click by the affected user, what was the full URL that was clicked?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A system program was registered as a service on host `mb-adfs`, indicating an attempt to establish persistence or gain SYSTEM privileges.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The process `powershell.exe` executed a suspicious sequence of Windows exploration commands used to identify valuable assets and prepare for lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` was involved in suspicious access to the LSASS service to dump credentials for lateral movement.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'A potentially malicious URL click was detected to the URL `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
