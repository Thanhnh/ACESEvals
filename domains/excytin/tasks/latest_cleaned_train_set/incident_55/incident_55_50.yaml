tasks:
- task_id: incident_55_latest_cleaned_train_set_task_50
  title: incident_55_latest_cleaned_train_set_task_50
  description: 'Following this activity, a suspected DCSync attack (directory services replication request) was detected coming from the same device `mb-winclient` toward the domain controller MB-DC1. What is the display name of the user account that issued that replication request?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on the endpoint `mb-winclient` (Azure AD device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`), an alert fired for a suspicious sequence of exploration activities: a process spawned a set of Windows discovery commands, including `whoami.exe /user` (PID 14260) and `powershell.exe c:\script\contosoadfsblatempcreds.ps1` (PID 13968), launched under service host `svchost.exe -k netsvcs -p -s winmgmt`. Local accounts such as `pwilson` and `bjenkins` (SID S-1-5-21-561436748-3867387497-1732241745-3701) were observed on this device. Such commands are typically used by attackers to identify valuable assets and prepare for lateral movement.'
    question: 'Following this activity, a suspected DCSync attack (directory services replication request) was detected coming from the same device `mb-winclient` toward the domain controller MB-DC1. What is the display name of the user account that issued that replication request?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera (the CIO account)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera (the CIO account)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process executed a suspicious sequence of Windows exploration commands under the account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118`, indicating reconnaissance for valuable assets and lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user, account Name `Luciano Herrera` (CIO), then performed a suspected DCSync attack, sending 1 directory services replication request from MB-WINCLIENT to the domain controller MB-DC1.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
