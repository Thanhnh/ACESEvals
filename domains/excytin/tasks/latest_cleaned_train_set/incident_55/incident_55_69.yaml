tasks:
- task_id: incident_55_latest_cleaned_train_set_task_69
  title: incident_55_latest_cleaned_train_set_task_69
  description: 'Later in this same incident, the attack progressed into the cloud identity plane, where a user performed an unusual addition of a Password credential to an OAuth application. What is the OAuth object ID of the application that received the new credential?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage intrusion, an ongoing hands-on-keyboard attack via the Impacket toolkit was detected on host `mb-adfs`. The activity involved processes such as `lsass.exe` (PID 780) and an encoded PowerShell command (`powershell.exe -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcafiazqbuageabqblafaabwb3aguacgbzaggazqbsagwalgbwahmamqa=`, PID 6808), executed under accounts including `gsmith` and `LocalSystem`. Impacket connects to other hosts to explore network shares and execute commands, and is commonly used by attackers to move laterally before deploying ransomware or other payloads.'
    question: 'Later in this same incident, the attack progressed into the cloud identity plane, where a user performed an unusual addition of a Password credential to an OAuth application. What is the OAuth object ID of the application that received the new credential?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'a66a4b44-d1f7-4563-95bf-a89d1b05b325'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'a66a4b44-d1f7-4563-95bf-a89d1b05b325'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An Impacket-based hands-on-keyboard attack was detected on the device, where the attacker executed commands via the process `powershell.exe` to move laterally across the network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` was involved in a process injection, where potentially malicious code was injected into another process to hide execution within a trusted process.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The compromised user then performed an unusual addition of a Password credential to the OAuth application with OAuthObjectId `a66a4b44-d1f7-4563-95bf-a89d1b05b325` (SimulandApp), which could be used for persistence, phishing, or data exfiltration.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
