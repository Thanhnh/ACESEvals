  title: incident_55_latest_cleaned_train_set_task_51
  description: 'For the related ''Suspicious remote activity'' alert on that same host, what is the security identifier (SID) of the account associated with the remotely initiated activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Suspicious service registration'' alert was raised after the system program `services.exe` (Process ID 764, created 2024-06-20T08:30:13.7925191Z) was registered as a service, which can indicate malicious intent to establish persistence or gain system privileges. Around the same time on the same machine, a related ''Suspicious remote activity'' alert flagged activity initiated remotely, such as attempts to start interactive sessions, modify files, pass WMI commands, or create scheduled tasks from a remote machine.'
    question: 'For the related ''Suspicious remote activity'' alert on that same host, what is the security identifier (SID) of the account associated with the remotely initiated activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-5-21-571436798-3864380397-1837441745-3206'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A system program was registered as a service on host `mb-adfs`, indicating an attempt to establish persistence or gain SYSTEM privileges.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` was observed initiating suspicious remote activity on the machine, such as remote interactive sessions, file modifications, WMI commands, or scheduled task creation.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
