tasks:
- task_id: incident_55_latest_cleaned_train_set_task_44
  title: incident_55_latest_cleaned_train_set_task_44
  description: 'For the related alert where a potentially malicious URL click was detected, what is the display name of the user account that clicked the malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired for an unusual addition of credentials (type Password) to the OAuth application SimulandApp (OAuthAppId `4d9476b8-6ae6-459b-a273-5837c15b5981`, ObjectId `a66a4b44-d1f7-4563-95bf-a89d1b05b325`) within the Office 365 / Microsoft 365 cloud application (AppId 11161). The activity was performed by the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) from IP address `36.193.21.220`. This pattern may indicate that an attacker has compromised the app and is using it to spread phishing, exfiltrate data, or gain access to other accounts and devices. Pivoting from this account, related alerts include a malicious PowerShell Cmdlet invoked on a machine and, later on 2024-07-10, a detection of a potentially malicious URL click.'
    question: 'For the related alert where a potentially malicious URL click was detected, what is the display name of the user account that clicked the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Lucas Grey'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Lucas Grey'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` (Luciano Herrera, pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application SimulandApp.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` invoked a malicious PowerShell Cmdlet on the machine, potentially associated with credential theft, exploitation, network reconnaissance or code injection.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The user account `Lucas Grey` clicked on a potentially malicious URL that was detected in the environment.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
