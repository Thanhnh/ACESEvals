tasks:
- task_id: incident_55_latest_cleaned_train_set_task_5
  title: incident_55_latest_cleaned_train_set_task_5
  description: 'For the suspicious LDAP query alert, what was the process ID, creation time, and full command line of the process that executed the LDAP reconnaissance?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an internal phishing campaign alert on 2024-07-07, a user was observed sending phishing emails from a device to recipients inside the organization, suggesting a compromised account being used for lateral movement. The accounts involved included `Nina Sullivan` (santiago@vnevado.alpineskihouse.co, SID S-1-5-11-7842151660-4834030208-105586563-1139) and `Lucas Grey` (bjenkins@niseko.alpineskihouse.co), and the phishing message pointed to the URL `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`. Tracing this activity back through a suspicious system hardware discovery alert on the same device leads to an earlier reconnaissance alert where a suspicious LDAP query was executed against the domain controller.'
    question: 'For the suspicious LDAP query alert, what was the process ID, creation time, and full command line of the process that executed the LDAP reconnaissance?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 11116, Created Time (UTC): 2024-07-02T09:47:42.6848617Z, Command line: "powershell.exe" c:\script\ldaprequest.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 11116, Created Time (UTC): 2024-07-02T09:47:42.6848617Z, Command line: "powershell.exe" c:\script\ldaprequest.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` was observed sending internal phishing emails, indicating the account was likely compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On the device with HostName `mb-winclient`, suspicious system hardware discovery activity was detected, showing the attacker was gathering information about the target device.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The reconnaissance continued with a suspicious LDAP query executed by the process with Process ID `11116`, created at `2024-07-02t09:47:42.6848617z`, using the command line `"powershell.exe" c:\script\ldaprequest.ps1`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
