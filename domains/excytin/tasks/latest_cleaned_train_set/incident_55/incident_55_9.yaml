tasks:
- task_id: incident_55_latest_cleaned_train_set_task_9
  title: incident_55_latest_cleaned_train_set_task_9
  description: 'For the alert about the unusual addition of credentials to the OAuth application, which cloud application (including its instance name) was recorded as the entity where this activity took place?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage intrusion, a suspected AD FS DKM key read was detected on the domain controller `MB-DC1`, which read the DKM key of the AD FS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2. This activity was closely followed by suspicious directory replication requests toward the same domain controller, and the compromised identity involved (Luciano Herrera, CIO) was also seen performing cloud-side activity — specifically an unusual addition of a Password-type credential to the OAuth application ''SimulandApp''.'
    question: 'For the alert about the unusual addition of credentials to the OAuth application, which cloud application (including its instance name) was recorded as the entity where this activity took place?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Cloud application: Office 365, Instance name: Microsoft 365 (`office 365__microsoft 365`)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Cloud application: Office 365, Instance name: Microsoft 365 (`office 365__microsoft 365`)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The host `MB-DC1` was observed reading the AD FS DKM key of ADFS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2, indicating credential theft from the domain controller.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account `Luciano Herrera` on MB-WINCLIENT sent a replication request to MB-DC1, indicating a suspected DCSync attack (replication of directory services).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Using the compromised account `Luciano Herrera` (pwilson@niseko.alpineskihouse.co), the attacker performed an unusual addition of a Password credential to the OAuth application SimulandApp within the cloud application `office 365__microsoft 365`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
