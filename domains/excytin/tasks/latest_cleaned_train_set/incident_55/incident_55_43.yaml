tasks:
- task_id: incident_55_latest_cleaned_train_set_task_43
  title: incident_55_latest_cleaned_train_set_task_43
  description: 'Earlier in this same incident, on 2024-07-04, an alert fired for a suspicious sequence of exploration activities in which a process invoked a set of Windows commands typically used to identify valuable assets and prepare lateral movement. What is the account name (username) associated with that exploration activity alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'A potentially malicious URL click was detected on 2024-07-10, where a user displayed as `Lucas Grey` received a phishing email and clicked on the link `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`, which was found to be malicious.'
    question: 'Earlier in this same incident, on 2024-07-04, an alert fired for a suspicious sequence of exploration activities in which a process invoked a set of Windows commands typically used to identify valuable assets and prepare lateral movement. What is the account name (username) associated with that exploration activity alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` clicked on a potentially malicious URL, indicating the initial compromise.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, a suspicious sequence of exploration activities (a process invoking a set of Windows discovery commands used to identify valuable assets and plan lateral movement) was performed under the account named `bjenkins`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
