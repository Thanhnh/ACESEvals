tasks:
- task_id: incident_55_latest_cleaned_train_set_task_80
  title: incident_55_latest_cleaned_train_set_task_80
  description: 'Almost simultaneously, another alert on the same device flagged an ongoing hands-on-keyboard attack using the Impacket toolkit for remote command execution and lateral movement. What was the name of the file executed in that Impacket-related alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an alert for a ''Suspicious sequence of exploration activities'' was raised on host `mb-winclient`, involving accounts `bjenkins` and `pwilson`. The activity included the execution of `whoami.exe /user` (Process ID 14260), along with `svchost.exe` and a script named `contosoadfsblatempcreds.ps1`, indicating an attacker enumerating assets of value before lateral movement.'
    question: 'Almost simultaneously, another alert on the same device flagged an ongoing hands-on-keyboard attack using the Impacket toolkit for remote command execution and lateral movement. What was the name of the file executed in that Impacket-related alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process `powershell.exe` executed a suspicious sequence of exploration activities, running a set of Windows commands used to identify valuable assets and coordinate lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'An ongoing hands-on-keyboard attack was observed on the device, where the file `powershell.exe` was used to execute commands via the Impacket toolkit to connect to other hosts, explore network shares, and move laterally across the network.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
