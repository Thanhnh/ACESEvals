tasks:
- task_id: incident_55_latest_cleaned_train_set_task_46
  title: incident_55_latest_cleaned_train_set_task_46
  description: 'What is the full malicious URL that was clicked on that device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, on host `mb-adfs` under the account `gsmith` (SID S-2-5-21-571436798-3864380397-1837441745-3206), a suspicious sequence of exploration activities was detected: a PowerShell process (PID 6808) ran an encoded command, followed by `whoami.exe` (PID 1120), and a hidden-window process `iy2orr1e.rrg.exe` (PID 3116) executing another encoded command. These commands are typically used by attackers to identify assets of value and coordinate lateral movement after compromising a machine. Investigation later linked this device, via credential theft activity targeting the LSASS service, to another alert reporting that a malicious URL was clicked on the same device.'
    question: 'What is the full malicious URL that was clicked on that device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A process launched `powershell.exe` to run a suspicious sequence of Windows exploration commands used to identify valuable assets and prepare for lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On the same compromised device, with AadDeviceId `7661dfd4-218f-4016-8a87-66d68a7f098e`, suspicious access to the LSASS service was detected, indicating credential theft attempts.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'From that device, a malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was clicked.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
