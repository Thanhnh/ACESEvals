  title: incident_55_latest_cleaned_train_set_task_74
  description: 'For that final alert regarding the credential addition to the SimulandApp OAuth application, what is the OAuth object ID of the application involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident at vnevado.alpineskihouse.co, an email containing the malicious URL `http://kn017721628.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was delivered to the mailbox `santiago@vnevado.alpineskihouse.co` from the internal sender `4qs6v9m@vnevado.alpineskihouse.co` (sender IP 106.214.87.198) and later removed. Following the chain of compromised accounts, the investigation eventually surfaced an alert about an unusual addition of a Password credential to the OAuth application SimulandApp, performed by the user Luciano Herrera (pwilson@niseko.alpineskihouse.co).'
    question: 'For that final alert regarding the credential addition to the SimulandApp OAuth application, what is the OAuth object ID of the application involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'a66a4b44-d1f7-4563-95bf-a89d1b05b325'
