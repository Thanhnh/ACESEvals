tasks:
- task_id: incident_55_latest_cleaned_train_set_task_63
  title: incident_55_latest_cleaned_train_set_task_63
  description: 'For the alert reporting the malicious PowerShell Cmdlet invocation, what is the Microsoft Entra (AAD) user ID of the account associated with that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled "Sensitive credential memory read" was raised on 2024-07-04 at 22:35:04 UTC, indicating that a process scanned or dumped memory from the Local Security Authority Subsystem Service (`lsass.exe`, Process ID 760, created 2024-07-02T07:28:35.85Z). Accessing this process memory allows an attacker to extract secrets such as authentication hashes or passwords. Roughly a second earlier, a closely related alert fired reporting that a malicious PowerShell Cmdlet — potentially associated with credential theft, exploitation, network reconnaissance, or code injection — was invoked on the machine.'
    question: 'For the alert reporting the malicious PowerShell Cmdlet invocation, what is the Microsoft Entra (AAD) user ID of the account associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '2de70991-2799-4a95-b734-8e3df3a50118'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '2de70991-2799-4a95-b734-8e3df3a50118'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process scanned or dumped credential memory from lsass.exe on the machine associated with IP address `72.5.72.208`, allowing the attacker to extract authentication hashes or passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same machine, a malicious PowerShell Cmdlet associated with credential theft was invoked by the user account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
