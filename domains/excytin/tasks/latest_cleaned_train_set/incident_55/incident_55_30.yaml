tasks:
- task_id: incident_55_latest_cleaned_train_set_task_30
  title: incident_55_latest_cleaned_train_set_task_30
  description: 'For that earlier alert about the malicious PowerShell Cmdlet invocation, what was the name of the script file involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert was raised on 2024-07-10 indicating that the domain controller `MB-DC1` read the DKM key of an AD FS object (id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2), a technique commonly associated with AD FS token-signing certificate theft. Pivoting on the user account involved in the related directory replication (DCSync) activity leads back to an earlier alert on 2024-07-04, where a malicious PowerShell Cmdlet — potentially associated with credential theft, exploitation, network reconnaissance or code injection — was invoked on a machine.'
    question: 'For that earlier alert about the malicious PowerShell Cmdlet invocation, what was the name of the script file involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'contosoadfsblatempcreds.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'contosoadfsblatempcreds.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The host `MB-DC1` was observed reading the DKM key of the AD FS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2, indicating a suspected AD FS DKM key read.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` (Luciano Herrera, CIO) on MB-WINCLIENT sent a replication request to MB-DC1, indicating a suspected DCSync attack.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A malicious PowerShell cmdlet associated with credential theft was invoked on the machine via the script file `contosoadfsblatempcreds.ps1`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
