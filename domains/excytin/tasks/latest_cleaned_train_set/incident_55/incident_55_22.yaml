tasks:
- task_id: incident_55_latest_cleaned_train_set_task_22
  title: incident_55_latest_cleaned_train_set_task_22
  description: 'For the alert about the suspected AD FS DKM key read, which account performed the read? Provide the email address of that account.'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired showing that the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application SimulandApp (OAuth App ID `4d9476b8-6ae6-459b-a273-5837c15b5981`), from IP address `2801:e0a:1eb:dea0:642e:5bb6:d315:fbb3` in the Office 365 / Microsoft 365 cloud application. This pattern may indicate that an attacker compromised the app to spread phishing, exfiltrate data, or gain access to other accounts and devices. Pivoting through related activity, the same attack chain includes suspicious system hardware discovery, hands-on-keyboard activity via the Impacket toolkit, and finally an alert reporting that the Distributed Key Manager (DKM) key of the AD FS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2 was read.'
    question: 'For the alert about the suspected AD FS DKM key read, which account performed the read? Provide the email address of that account.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` (Luciano Herrera, pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application SimulandApp.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The process `powershell.exe` was used on the device to perform suspicious system hardware discovery, gathering information about the target device or network.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` executed commands via the Impacket toolkit, indicating an ongoing hands-on-keyboard attack and lateral movement across the network.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The account with email `gsmith@niseko.alpineskihouse.co` read the AD FS DKM key of the ADFS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
