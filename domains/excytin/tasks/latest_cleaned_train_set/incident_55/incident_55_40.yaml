tasks:
- task_id: incident_55_latest_cleaned_train_set_task_40
  title: incident_55_latest_cleaned_train_set_task_40
  description: 'For the ''Suspicious service registration'' alert on that same host, which process (command line) was responsible, and what were its process ID and creation time?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled ''Suspicious sequence of exploration activities'' was raised after a process invoked a set of Windows commands that attackers commonly use to identify valuable assets and plan lateral movement. The activity was tied to the account `gsmith` (SID `S-2-5-21-571436798-3864380397-1837441745-3206`) and involved processes such as `iy2orr1e.rrg.exe` launched with hidden window style and encoded PowerShell commands, followed by executions of `whoami.exe`. On the same endpoint, moments later, another alert fired indicating that a system program was registered as a service, which can indicate an attempt to establish persistence or gain SYSTEM privileges.'
    question: 'For the ''Suspicious service registration'' alert on that same host, which process (command line) was responsible, and what were its process ID and creation time?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The process was `services.exe`, with Process ID 764, created at 2024-06-20T08:30:13.7925191Z.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The process was `services.exe`, with Process ID 764, created at 2024-06-20T08:30:13.7925191Z.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process on host `mb-adfs` executed a suspicious sequence of Windows exploration commands, likely used to identify valuable assets and prepare for lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same host, a system program was registered as a service through the process `services.exe` with Process ID `764` created at `2024-06-20t08:30:13.7925191z`, indicating an attempt to establish persistence or gain system privileges.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
