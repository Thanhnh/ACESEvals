tasks:
- task_id: incident_55_latest_cleaned_train_set_task_33
  title: incident_55_latest_cleaned_train_set_task_33
  description: 'For the final alert in this chain, what is the display name of the user account that performed the unusual addition of the Password credential to the OAuth application `SimulandApp`?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert for `Suspicious access to LSASS service` was raised, where the process `lsass.exe` (Process ID 760, created 2024-07-02T07:28:35.8580921Z) was accessed along with sensitive modules such as `cryptdll.dll`, `hid.dll`, `winscard.dll`, and `vaultcli.dll`. Attackers typically perform this to decrypt clear-text credentials from LSASS memory and reuse them for lateral movement. This activity chained onward to cloud identity abuse, ending with an alert titled `Unusual addition of credentials to an OAuth app`, where a credential of type Password was added to the application `SimulandApp`.'
    question: 'For the final alert in this chain, what is the display name of the user account that performed the unusual addition of the Password credential to the OAuth application `SimulandApp`?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera (account name), whose sign-in identity is pwilson@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera (account name), whose sign-in identity is pwilson@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `bjenkins` was involved in suspicious access to the LSASS service, indicating an attempt to dump credentials from memory for later lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised user with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` invoked a malicious PowerShell Cmdlet on the machine, associated with credential theft, network reconnaissance, or code injection.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Using the stolen credentials, the account `Luciano Herrera` (pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application `SimulandApp`, which may allow the attacker to persist, spread phishing, or exfiltrate data.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
