tasks:
- task_id: incident_55_latest_cleaned_train_set_task_62
  title: incident_55_latest_cleaned_train_set_task_62
  description: 'Related to this chain of activity, another alert was raised for an attempt to hide the use of a dual-purpose tool by running it under an unexpected filename. Which user account name was involved in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a malicious PowerShell Cmdlet was invoked on a machine (AAD device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`) under the account `bjenkins`, running `"powershell.exe" -noexit -command set-location -literalpath ''c:\users\bjenkins\downloads\midnight14''` (PID 12412) and later `"powershell.exe" c:\script\contosoadfsblatempcreds.ps1` (PID 13968), with activity associated with IP `72.5.72.208`. The same activity chain also included an ongoing hands-on-keyboard attack via the Impacket toolkit on this device.'
    question: 'Related to this chain of activity, another alert was raised for an attempt to hide the use of a dual-purpose tool by running it under an unexpected filename. Which user account name was involved in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious PowerShell Cmdlet was invoked on the machine via the process with ExtractedFileName `powershell.exe`, potentially used for credential theft, reconnaissance, or code injection.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'An ongoing hands-on-keyboard attack via the Impacket toolkit was observed, executed under the account with AadUserId `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`, indicating lateral movement across the network.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The same actor attempted to hide the use of a dual-purpose tool by renaming it, associated with the account Name `gsmith`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
