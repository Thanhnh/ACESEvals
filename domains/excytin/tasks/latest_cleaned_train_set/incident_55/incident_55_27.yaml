tasks:
- task_id: incident_55_latest_cleaned_train_set_task_27
  title: incident_55_latest_cleaned_train_set_task_27
  description: 'For the suspicious service creation on MB-ADFS, what is the full email address of the account that created the service?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious service registration alert was raised when the system program `services.exe` (Process ID 764, created 2024-06-20T08:30:13.7925191Z) was registered as a service, potentially indicating an attempt to establish persistence or gain SYSTEM privileges. Pivoting from the affected host, analysts also found evidence of an ongoing hands-on-keyboard attack using the Impacket toolkit for lateral movement, and later a suspicious service named DDLOXJDSQSNGMUKKFUXQ was created on the device MB-ADFS to execute potentially malicious commands.'
    question: 'For the suspicious service creation on MB-ADFS, what is the full email address of the account that created the service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A system program was registered as a service on host `mb-adfs`, indicating an attempt to establish persistence or gain SYSTEM privileges.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'An ongoing hands-on-keyboard attack via the Impacket toolkit was observed being executed by the account with Name `gsmith`, suggesting lateral movement across the network.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The same actor created the suspicious service `DDLOXJDSQSNGMUKKFUXQ` on MB-ADFS to execute potentially malicious commands, tied to the account with Email `gsmith@niseko.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
