tasks:
- task_id: incident_55_latest_cleaned_train_set_task_59
  title: incident_55_latest_cleaned_train_set_task_59
  description: 'Just before this LSASS access, a related alert titled `Suspicious System Hardware Discovery` was triggered, indicating a known tool or technique was used to gather information about the device. What is the Microsoft Entra (AAD) user ID of the account associated with that discovery alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert for `Suspicious access to LSASS service` was raised, in which the process `lsass.exe` (Process ID 760, created 2024-07-02T07:28:35.8580921Z) was accessed and modules such as `cryptdll.dll`, `hid.dll`, `winscard.dll`, and `vaultcli.dll` were involved. Attackers typically perform this to decrypt user passwords from LSASS memory and later reuse the stolen credentials for lateral movement.'
    question: 'Just before this LSASS access, a related alert titled `Suspicious System Hardware Discovery` was triggered, indicating a known tool or technique was used to gather information about the device. What is the Microsoft Entra (AAD) user ID of the account associated with that discovery alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '2de70991-2799-4a95-b734-8e3df3a50118'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '2de70991-2799-4a95-b734-8e3df3a50118'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` performed suspicious access to the LSASS service, likely attempting to dump credentials from memory for later lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user, identified by AadUserId `2de70991-2799-4a95-b734-8e3df3a50118`, then used a known tool or technique to perform suspicious system hardware discovery on the device, gathering information for later attacks.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
