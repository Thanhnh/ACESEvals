tasks:
- task_id: incident_55_latest_cleaned_train_set_task_13
  title: incident_55_latest_cleaned_train_set_task_13
  description: 'For the ''Attempt to hide use of dual-purpose tool'' alert, which user account was associated with running the renamed dual-purpose tool?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was clicked on a device. Pivoting on that device led to a chain of earlier alerts, including a malicious PowerShell cmdlet invocation, a renamed system executable that was launched, and finally an alert titled ''Attempt to hide use of dual-purpose tool'', where a known public tool that can also be used maliciously was observed running under an unexpected filename.'
    question: 'For the ''Attempt to hide use of dual-purpose tool'' alert, which user account was associated with running the renamed dual-purpose tool?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious URL was clicked on the device with AadDeviceId `7661dfd4-218f-4016-8a87-66d68a7f098e`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'On that device, a malicious PowerShell Cmdlet was invoked via the process `powershell.exe`, potentially associated with credential theft, exploitation, network reconnaissance, or code injection.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'A renamed system executable was launched: Process ID `3116` at `2024-07-02t09:48:23.9439954z` with command line `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`, indicating an attempt to evade path/name-based detection.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'This attempt to hide the use of a dual-purpose tool under an unexpected filename was performed by the account with Name `gsmith`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
