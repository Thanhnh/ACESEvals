tasks:
- task_id: incident_55_latest_cleaned_train_set_task_2
  title: incident_55_latest_cleaned_train_set_task_2
  description: 'Shortly after this credential-access activity, a related alert fired for a suspicious sequence of exploration activities where a process ran a set of Windows discovery commands. What is the security identifier (SID) of the account associated with that exploration activity alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert for suspicious access to the LSASS service was raised: attackers commonly decrypt user passwords from LSASS memory to obtain clear-text credentials for later lateral movement. The activity involved the process `lsass.exe` (PID 760, created 2024-07-02T07:28:35.858Z) and modules such as `vaultcli.dll`, `cryptdll.dll`, `winscard.dll` and `hid.dll`, alongside a PowerShell process (PID 12412) executing `"powershell.exe" -noexit -command set-location -literalpath ''c:\users\bjenkins\downloads\midnight14''` on the device with AAD device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`, with traffic seen to IP `72.5.72.208`.'
    question: 'Shortly after this credential-access activity, a related alert fired for a suspicious sequence of exploration activities where a process ran a set of Windows discovery commands. What is the security identifier (SID) of the account associated with that exploration activity alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-5-21-571436798-3864380397-1837441745-3206'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The process `powershell.exe` was used to suspiciously access the LSASS service in order to dump credentials from memory.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the credential access, the account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` performed a suspicious sequence of exploration activities by running a set of windows commands to discover assets and prepare for lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
