tasks:
- task_id: incident_55_latest_cleaned_train_set_task_67
  title: incident_55_latest_cleaned_train_set_task_67
  description: 'For the alert about emails containing a malicious URL that were delivered and later removed, which recipient mailbox address received those messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert was raised on 2024-07-10 for an unusual addition of credentials (type Password) to the OAuth application SimulandApp (OAuth App ID `4d9476b8-6ae6-459b-a273-5837c15b5981`) by the user Luciano Herrera (`pwilson@niseko.alpineskihouse.co`) from IP `2801:e0a:1eb:dea0:642e:5bb6:d315:fbb3` within the Office 365 / Microsoft 365 cloud application. This pattern may indicate a compromised app being used to spread phishing or exfiltrate data. Follow-on activity in the same incident chain included code injection on an endpoint, an internal phishing campaign, and a Microsoft Defender for Office 365 alert titled ''Email messages containing malicious URL removed after delivery'' (V62.34.26.163) on 2024-07-07.'
    question: 'For the alert about emails containing a malicious URL that were delivered and later removed, which recipient mailbox address received those messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'santiago@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'santiago@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` (Luciano Herrera, pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application SimulandApp, indicating the app may have been compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` was involved in a process injection, where a process injected potentially malicious code into another process to hide execution within a trusted process.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The compromised account with SID `S-1-5-11-7842151660-4834030208-105586563-1139` was observed sending internal phishing emails from the device to recipients inside the organization, indicating lateral movement.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The phishing email containing a malicious URL was delivered to the mailbox recipient `santiago@vnevado.alpineskihouse.co` and was later removed after delivery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
