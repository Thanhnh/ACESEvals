tasks:
- task_id: incident_55_latest_cleaned_train_set_task_95
  title: incident_55_latest_cleaned_train_set_task_95
  description: 'Following this activity, a related alert was triggered for a suspicious LDAP query indicating reconnaissance against the domain controller. What IP address was recorded as the entity associated with that suspicious LDAP query alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an ''ADFS private key extraction attempt'' alert was raised on host `mb-adfs` involving the account `gsmith` (SID S-2-5-21-571436798-3864380397-1837441745-3206). The suspicious activity was tied to the process `iy2orr1e.rrg.exe`, which ran hidden with an encoded PowerShell command (process IDs 3116 and 8764). The same process chain was also observed abusing Task Scheduler to establish persistence.'
    question: 'Following this activity, a related alert was triggered for a suspicious LDAP query indicating reconnaissance against the domain controller. What IP address was recorded as the entity associated with that suspicious LDAP query alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An ADFS private key extraction attempt was detected involving the suspicious process file `iy2orr1e.rrg.exe`, which launched a suspicious LDAP query.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The same attack chain involved suspicious Task Scheduler activity performed by the process `powershell.exe` to establish persistence.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The reconnaissance continued with a suspicious LDAP query executed from the device with IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
