tasks:
- task_id: incident_55_latest_cleaned_train_set_task_99
  title: incident_55_latest_cleaned_train_set_task_99
  description: 'For the final alert regarding the suspected AD FS DKM key read, what is the full email address of the account that performed the read?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this security incident, an alert titled "Email messages containing malicious URL removed after delivery" was raised. The email was delivered to the mailbox `santiago@vnevado.alpineskihouse.co` from the sender `4qs6v9m@vnevado.alpineskihouse.co` (sender IP `106.214.87.198`) and contained the malicious URL `http://kn017721628.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`. This mail-based activity is linked through shared accounts to later stages of the attack, including internal phishing, LSASS credential memory reads, Impacket-based lateral movement, and finally an alert for a suspected AD FS DKM key read on ADFS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2.'
    question: 'For the final alert regarding the suspected AD FS DKM key read, what is the full email address of the account that performed the read?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `santiago@vnevado.alpineskihouse.co` received an email containing a malicious URL, which was removed after delivery on 2024-07-07.'
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised user with SID `S-1-5-21-561436748-3867387497-1732241745-3701` was observed sending internal phishing emails to other recipients inside the organization.'
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: 'On the affected device, a process scanned or dumped memory from `lsass.exe` (ExtractedFileName: `lsass.exe`), allowing the attacker to extract credentials such as authentication hashes or passwords.'
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: 'Using the stolen credentials, the account `gsmith` executed commands via the Impacket toolkit, indicating an ongoing hands-on-keyboard attack and lateral movement across the network.'
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: 'Finally, the account `gsmith@niseko.alpineskihouse.co` read the AD FS DKM key of ADFS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2, enabling forging of SAML tokens.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
