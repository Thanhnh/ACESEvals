tasks:
- task_id: incident_55_latest_cleaned_train_set_task_25
  title: incident_55_latest_cleaned_train_set_task_25
  description: 'Following this activity, a related alert was raised for a suspected AD FS DKM key read on the same environment. What is the email address of the user account that performed this DKM key read?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on the host `mb-adfs`, an ongoing hands-on-keyboard attack via the Impacket toolkit was detected. The activity was executed under the `LocalSystem` account and involved `powershell.exe` (process ID 6808, created 2024-07-02T09:48:12.7628138Z) running an encoded command, as well as access to `lsass.exe` (process ID 780). Impacket is commonly used by attackers to connect to other hosts, explore network shares, and execute commands for lateral movement, often preceding ransomware or other payload deployment.'
    question: 'Following this activity, a related alert was raised for a suspected AD FS DKM key read on the same environment. What is the email address of the user account that performed this DKM key read?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `gsmith` executed commands via the Impacket toolkit on the device, indicating an ongoing hands-on-keyboard attack with lateral movement across the network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same user, with email `gsmith@niseko.alpineskihouse.co`, then read the AD FS DKM key of the ADFS object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
