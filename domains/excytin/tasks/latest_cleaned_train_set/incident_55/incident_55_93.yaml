tasks:
- task_id: incident_55_latest_cleaned_train_set_task_93
  title: incident_55_latest_cleaned_train_set_task_93
  description: 'For the suspected DCSync attack, which user account (display name) was used to send the replication request to MB-DC1?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled "Attempt to hide use of dual-purpose tool" was raised on host `mb-adfs` for the account `gsmith` (SID `S-2-5-21-571436798-3864380397-1837441745-3206`). A known public tool was observed running under an unexpected filename, `iy2orr1e.rrg.exe`, with process ID 3116 and a hidden-window, base64 encoded PowerShell command line. Following this, the attack chain continued with suspicious remote activity and a suspicious LDAP query indicating directory reconnaissance, and ultimately a suspected DCSync attack (replication of directory services) was detected, where a single replication request was sent from the workstation MB-WINCLIENT to the domain controller MB-DC1.'
    question: 'For the suspected DCSync attack, which user account (display name) was used to send the replication request to MB-DC1?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera (the CIO account)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera (the CIO account)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A user with AadUserId `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5` attempted to hide the use of a dual-purpose public tool by running it under an unexpected filename.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious remote activity was observed involving the process `powershell.exe`, indicating remotely initiated commands on the machine.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'A user with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` executed a suspicious LDAP query against the domain controller for reconnaissance of users, groups, and assets.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The account `Luciano Herrera` (CIO) on MB-WINCLIENT performed a suspected DCSync attack by sending a directory replication request to MB-DC1.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
