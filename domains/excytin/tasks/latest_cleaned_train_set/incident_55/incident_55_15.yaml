tasks:
- task_id: incident_55_latest_cleaned_train_set_task_15
  title: incident_55_latest_cleaned_train_set_task_15
  description: 'A related alert in this incident flagged a suspected AD FS DKM key read for the AD FS object with id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`. What is the name of the host that performed this DKM key read?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert titled "Unusual addition of credentials to an OAuth app" was raised: the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the application SimulandApp (OAuth App ID `4d9476b8-6ae6-459b-a273-5837c15b5981`, OAuth Object ID `a66a4b44-d1f7-4563-95bf-a89d1b05b325`) within the Office 365 / Microsoft 365 cloud application (App ID 11161), from the IP address `2801:e0a:1eb:dea0:642e:5bb6:d315:fbb3`. This usage pattern may indicate that an attacker compromised the app and is using it to spread phishing, exfiltrate data, or gain access to other accounts and devices. This activity is linked, through the same compromised user account, to further on-premises activity including replication requests to a domain controller.'
    question: 'A related alert in this incident flagged a suspected AD FS DKM key read for the AD FS object with id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`. What is the name of the host that performed this DKM key read?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'MB-DC1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The compromised user account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` (Luciano Herrera, pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application `SimulandApp`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The same user, Luciano Herrera (CIO), from the device `MB-WINCLIENT` sent a directory replication request to the domain controller `MB-DC1`, indicating a suspected DCSync attack.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On the domain controller host `MB-DC1`, a suspected AD FS DKM key read was detected, where the DKM key of the AD FS object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2` was read.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
