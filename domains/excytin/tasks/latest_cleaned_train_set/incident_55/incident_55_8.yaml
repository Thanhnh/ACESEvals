tasks:
- task_id: incident_55_latest_cleaned_train_set_task_8
  title: incident_55_latest_cleaned_train_set_task_8
  description: 'A few days later, a related alert reported an internal phishing campaign originating from the same compromised device, where a user sent phishing emails to recipients inside the organization. What is the email address of the account that sent those internal phishing messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert fired for a process being injected with potentially malicious code on host `mb-winclient` (AAD device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`). The activity involved `powershell.exe` launched with the command line `"powershell.exe" -noexit -command set-location -literalpath ''c:\users\bjenkins\downloads\midnight14''` (PID 12412, created 2024-07-02T09:47:16Z), the script `contosoadfsblatempcreds.ps1`, the local accounts `bjenkins` and `pwilson`, and the IP address `72.5.72.208`. Code injection like this is often used to hide malicious execution inside a trusted process, which may then connect to a command-and-control server.'
    question: 'A few days later, a related alert reported an internal phishing campaign originating from the same compromised device, where a user sent phishing emails to recipients inside the organization. What is the email address of the account that sent those internal phishing messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'santiago@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'santiago@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process was injected with potentially malicious code under the user account with SID `S-1-5-21-561436748-3867387497-1732241745-3701`, indicating the account was likely compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account, with email `santiago@vnevado.alpineskihouse.co`, was then observed sending internal phishing emails to recipients inside the organization as part of lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
