tasks:
- task_id: incident_55_latest_cleaned_train_set_task_76
  title: incident_55_latest_cleaned_train_set_task_76
  description: 'Pivoting from this activity through the shared compromised account, the same account was also linked to endpoint activity where code was injected into another process and, shortly after, credential theft was attempted against the LSASS service. What is the name of the file involved in that suspicious access to the LSASS service?'
  inherit_shared: true
  initial_context:
    incident_context: 'In this multi-stage incident, an alert was raised for an unusual addition of credentials to an OAuth app: the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) added a Password-type credential to the application SimulandApp, from IP address `2801:e0a:1eb:dea0:642e:5bb6:d315:fbb3`, targeting the Office 365 / Microsoft 365 cloud application (AppId 11161, OAuth AppId 4d9476b8-6ae6-459b-a273-5837c15b5981). This pattern may indicate an attacker compromised the app to spread phishing, exfiltrate data, or gain access to other accounts and devices.'
    question: 'Pivoting from this activity through the shared compromised account, the same account was also linked to endpoint activity where code was injected into another process and, shortly after, credential theft was attempted against the LSASS service. What is the name of the file involved in that suspicious access to the LSASS service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'hid.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'hid.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` (Luciano Herrera, pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application SimulandApp, suggesting the app may have been compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The account `bjenkins` was involved in a process injection, where a process injected potentially malicious code into another process to hide malicious execution within a trusted process.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The injected process performed suspicious access to the LSASS service to dump credentials, involving the file `hid.dll`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
