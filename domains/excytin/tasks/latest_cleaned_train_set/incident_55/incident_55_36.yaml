tasks:
- task_id: incident_55_latest_cleaned_train_set_task_36
  title: incident_55_latest_cleaned_train_set_task_36
  description: 'For the related suspicious LDAP query alert, which user account name was involved in performing this reconnaissance activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing hands-on-keyboard attack via the Impacket toolkit on host `mb-adfs`, several suspicious processes were observed, including `powershell.exe` executed with an encoded command (Process ID 6808) under accounts such as `LocalSystem` and `gsmith`, along with access to `lsass.exe`. Seconds later, a related alert fired for a suspicious LDAP query, indicating potential reconnaissance activity against the domain controller to enumerate administrative users, groups, and valuable assets.'
    question: 'For the related suspicious LDAP query alert, which user account name was involved in performing this reconnaissance activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'pwilson'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'pwilson'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An ongoing hands-on-keyboard attack via the Impacket toolkit was detected, where the attacker executed commands through the process `powershell.exe` (Type: process, Field: ExtractedFileName, Value: `powershell.exe`) to move laterally across the network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following this lateral movement, a suspicious LDAP query was executed against the domain controller for reconnaissance of blatempistrative users, groups, and assets, performed by the account `pwilson` (Type: account, Field: Name, Value: `pwilson`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
