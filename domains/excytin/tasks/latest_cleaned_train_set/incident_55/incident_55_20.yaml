tasks:
- task_id: incident_55_latest_cleaned_train_set_task_20
  title: incident_55_latest_cleaned_train_set_task_20
  description: 'For the ''Attempt to hide use of dual-purpose tool'' alert, what was the process ID, creation time, and full command line of the renamed tool that was executed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an email was delivered to the mailbox `santiago@vnevado.alpineskihouse.co` from sender `4qs6v9m@vnevado.alpineskihouse.co` (sender IP `106.214.87.198`) containing the malicious URL `http://kn017721628.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`; the message was later removed after delivery. Following the chain of related alerts (internal phishing campaign, a malicious PowerShell cmdlet invocation, and an ongoing hands-on-keyboard attack via the Impacket toolkit), analysts arrived at an alert titled ''Attempt to hide use of dual-purpose tool'', where a known public tool was observed running under an unexpected filename to conceal its malicious use.'
    question: 'For the ''Attempt to hide use of dual-purpose tool'' alert, what was the process ID, creation time, and full command line of the renamed tool that was executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 5752, Created Time (UTC): 2024-07-06T00:00:01.7155092Z, Command line: `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 5752, Created Time (UTC): 2024-07-06T00:00:01.7155092Z, Command line: `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: 'The email account `Nina Sullivan` received an email containing a malicious URL, which was removed after delivery.'
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: 'The user account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` was compromised and observed sending internal phishing emails to recipients inside the organization.'
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: 'A malicious PowerShell Cmdlet was invoked on the machine via the process `powershell.exe`, potentially associated with credential theft, network reconnaissance, or code injection.'
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: 'An ongoing hands-on-keyboard attack via the Impacket toolkit was observed on the host `mb-adfs`, indicating lateral movement across the network.'
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: 'The attacker attempted to hide the use of a dual-purpose tool by running it under an unexpected filename, with Process ID `5752` at `2024-07-06t00:00:01.7155092z` using the command line `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`, which decodes to a script exporting ADFS token signing certificates.'
