tasks:
- task_id: incident_55_latest_cleaned_train_set_task_4
  title: incident_55_latest_cleaned_train_set_task_4
  description: 'Shortly before these exploration activities, a related alert fired for a suspicious LDAP query indicating an attempted extraction of Active Directory Federation Services (ADFS) private keys. Which user account name was associated with that ADFS private key extraction attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Suspicious sequence of exploration activities'' alert was raised on host `mb-winclient` at 2024-07-04 22:35:03 UTC. A process (`svchost.exe -k netsvcs -p -s winmgmt`, PID 2880) was linked to a series of discovery commands, including `"powershell.exe" -noexit -command set-location -literalpath ''c:\users\bjenkins\downloads\midnight14''` (PID 12412) and multiple executions of `"whoami.exe" /user` (PIDs 14260 and 1104), run under the account `bjenkins` (SID S-1-5-21-561436748-3867387497-1732241745-3701) with remote IP 72.5.72.208 observed.'
    question: 'Shortly before these exploration activities, a related alert fired for a suspicious LDAP query indicating an attempted extraction of Active Directory Federation Services (ADFS) private keys. Which user account name was associated with that ADFS private key extraction attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious sequence of exploration activities was detected, where the process `powershell.exe` executed a set of Windows reconnaissance commands used to identify assets of value and coordinate lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'These exploration activities were performed under the user account `gsmith`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The same account `gsmith` then launched a suspicious LDAP query attempting to extract Active Directory Federation Service (ADFS) private keys, indicating credential theft and lateral movement attempts.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
