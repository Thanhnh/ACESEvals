tasks:
- task_id: incident_55_latest_cleaned_train_set_task_48
  title: incident_55_latest_cleaned_train_set_task_48
  description: 'For the related suspicious LDAP query alert, what was the IP address associated with the reconnaissance activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised showing that the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application SimulandApp (OAuth App ID `4d9476b8-6ae6-459b-a273-5837c15b5981`), associated with the Office 365 / Microsoft 365 cloud application, from IP address `2801:e0a:1eb:dea0:642e:5bb6:d315:fbb3`. This usage pattern may indicate that an attacker has compromised the app and is using it to spread phishing, exfiltrate data, or gain access to other accounts and devices. Pivoting on the account involved, this activity links back to earlier reconnaissance activity in the same incident, where a suspicious LDAP query was executed against the domain controller, a technique attackers use to map out administrative users, groups, and valuable assets.'
    question: 'For the related suspicious LDAP query alert, what was the IP address associated with the reconnaissance activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` (Luciano Herrera, pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application SimulandApp, indicating the app may have been compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From the compromised access, a suspicious LDAP reconnaissance query was executed against the domain controller from the device with IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
