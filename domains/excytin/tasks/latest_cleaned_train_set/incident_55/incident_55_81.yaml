tasks:
- task_id: incident_55_latest_cleaned_train_set_task_81
  title: incident_55_latest_cleaned_train_set_task_81
  description: 'For the ''Suspicious sequence of exploration activities'' alert, which user account (provide the security identifier, SID) was associated with running those exploration commands?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage security incident, a malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was clicked on a device in the environment. Pivoting from that device, analysts found earlier reconnaissance activity, including a suspicious LDAP query and a related alert titled ''Suspicious sequence of exploration activities'', where a process invoked a set of Windows commands typically used to identify valuable assets and plan lateral movement.'
    question: 'For the ''Suspicious sequence of exploration activities'' alert, which user account (provide the security identifier, SID) was associated with running those exploration commands?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-5-21-571436798-3864380397-1837441745-3206'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious URL was clicked on the device with HostName `mb-winclient`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On that device, a suspicious LDAP query was executed by the process `powershell.exe`, indicating reconnaissance against the domain controller.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` performed a suspicious sequence of exploration activities, running a set of Windows commands used to identify valuable assets and coordinate lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
