tasks:
- task_id: incident_55_latest_cleaned_train_set_task_29
  title: incident_55_latest_cleaned_train_set_task_29
  description: 'This incident is also linked to an earlier ''Suspicious System Hardware Discovery'' alert, where a known tool or technique was used to gather information about the device. What is the security identifier (SID) of the account associated with that hardware discovery activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'In this incident, an email containing a malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was delivered to the mailbox of Lucas Grey (`bjenkins@niseko.alpineskihouse.co`) from sender `santiago@vnevado.alpineskihouse.co` (sender IP `119.36.50.193`) and was later removed after delivery.'
    question: 'This incident is also linked to an earlier ''Suspicious System Hardware Discovery'' alert, where a known tool or technique was used to gather information about the device. What is the security identifier (SID) of the account associated with that hardware discovery activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-551436448-9871687716-9837441745-1903'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-551436448-9871687716-9837441745-1903'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` received email messages containing a malicious URL, which were delivered and later removed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised environment then showed suspicious system hardware discovery activity, where a known tool or technique was used to gather information about the device, performed by the account with SID `S-1-5-21-551436448-9871687716-9837441745-1903`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
