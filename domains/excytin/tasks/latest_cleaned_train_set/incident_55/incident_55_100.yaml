tasks:
- task_id: incident_55_latest_cleaned_train_set_task_100
  title: incident_55_latest_cleaned_train_set_task_100
  description: 'In the follow-up alert about the suspicious sequence of exploration activities, what was the file name of the reconnaissance command executable that was run?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Attempt to hide use of dual-purpose tool" was raised on host `mb-adfs` at 2024-07-04 22:35:01 UTC. A known public tool was observed running under an unexpected filename, `iy2orr1e.rrg.exe` (Process ID 3116, created 2024-07-02T09:48:23Z), launched with a hidden window and an encoded PowerShell command, under the account `gsmith` (SID S-2-5-21-571436798-3864380397-1837441745-3206). Roughly two seconds later, another alert fired on the same host reporting a suspicious sequence of exploration activities, where a process invoked a set of Windows commands typically used by attackers to identify valuable assets and plan lateral movement.'
    question: 'In the follow-up alert about the suspicious sequence of exploration activities, what was the file name of the reconnaissance command executable that was run?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'whoami.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'whoami.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A known dual-purpose tool was observed running under an unexpected filename on host `mb-adfs`, indicating an attempt to hide its malicious use.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same host, a process executed a suspicious sequence of exploration commands, including the discovery tool with the extracted file name `whoami.exe`, likely to identify valuable assets and prepare for lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
