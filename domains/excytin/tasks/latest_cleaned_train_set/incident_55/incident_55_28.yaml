tasks:
- task_id: incident_55_latest_cleaned_train_set_task_28
  title: incident_55_latest_cleaned_train_set_task_28
  description: 'For that earlier code-injection alert connected to this same user identity, what is the name of the file (script) associated with the alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a multi-stage intrusion in our environment, an alert was raised for a suspected DCSync attack (replication of directory services): the account `Luciano Herrera` (CIO), with email `pwilson@niseko.alpineskihouse.co`, sent a replication request from the host `MB-WINCLIENT` to the domain controller `MB-DC1`. This activity is linked, through the same compromised user identity, to earlier suspicious activity in the incident where a process injected code into another process — a technique often used to hide malicious execution within a trusted process.'
    question: 'For that earlier code-injection alert connected to this same user identity, what is the name of the file (script) associated with the alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'contosoadfsblatempcreds.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'contosoadfsblatempcreds.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` (Luciano Herrera, CIO) on MB-WINCLIENT sent a replication request to MB-DC1, indicating a suspected DCSync attack (replication of directory services).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the credential theft, a process on the compromised host was injected with potentially malicious code, and the injected process executed the file `contosoadfsblatempcreds.ps1`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
