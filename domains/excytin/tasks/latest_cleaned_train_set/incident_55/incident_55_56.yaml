tasks:
- task_id: incident_55_latest_cleaned_train_set_task_56
  title: incident_55_latest_cleaned_train_set_task_56
  description: 'Later in this same incident chain, an alert was raised for an unusual addition of a Password credential to the OAuth application ''SimulandApp'' by user Luciano Herrera (pwilson@niseko.alpineskihouse.co). What is the OAuth object ID of that application?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an internal phishing campaign alert, a user was observed sending phishing emails from a device to recipients inside the organization, suggesting an account compromise used for lateral movement. The accounts involved include `Nina Sullivan` (santiago@vnevado.alpineskihouse.co, SID S-1-5-11-7842151660-4834030208-105586563-1139, AAD user ID 28058d92-fc24-4869-9231-6546a34b00f2) and `Lucas Grey` (bjenkins@niseko.alpineskihouse.co), and the phishing message referenced the URL `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`. This activity is connected through shared account identifiers to other alerts, including suspicious system hardware discovery on a device and later cloud application abuse.'
    question: 'Later in this same incident chain, an alert was raised for an unusual addition of a Password credential to the OAuth application ''SimulandApp'' by user Luciano Herrera (pwilson@niseko.alpineskihouse.co). What is the OAuth object ID of that application?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'a66a4b44-d1f7-4563-95bf-a89d1b05b325'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'a66a4b44-d1f7-4563-95bf-a89d1b05b325'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` was observed sending internal phishing emails from this device, suggesting the account was compromised for lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised user, identified by AadUserId `2de70991-2799-4a95-b734-8e3df3a50118`, ran known tools/techniques to perform suspicious system hardware discovery on the device.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker then performed an unusual addition of a Password credential to the OAuth application SimulandApp with OAuthObjectId `a66a4b44-d1f7-4563-95bf-a89d1b05b325`, enabling persistence, phishing spread, or data exfiltration.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
