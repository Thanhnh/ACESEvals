tasks:
- task_id: incident_55_latest_cleaned_train_set_task_31
  title: incident_55_latest_cleaned_train_set_task_31
  description: 'Following this activity, a later alert flagged an attempt to hide the use of a dual-purpose tool that was running under an unexpected filename. What was that renamed executable''s file name, its process ID, and the full command line it executed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a "Suspicious sequence of exploration activities" alert fired on host `mb-winclient` (AAD device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`), where a process launched a set of Windows reconnaissance commands. Observed activity included `"powershell.exe" -noexit -command set-location -literalpath ''c:\users\bjenkins\downloads\midnight14''` (PID 12412), followed by `"whoami.exe"` (PID 13812) and `"whoami.exe" /user` (PID 1104), all associated with the account SID `S-1-5-21-551436448-9871687716-9837441745-1903` and remote IP `72.5.72.208`.'
    question: 'Following this activity, a later alert flagged an attempt to hide the use of a dual-purpose tool that was running under an unexpected filename. What was that renamed executable''s file name, its process ID, and the full command line it executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'File name: `iy2orr1e.rrg.exe`, Process ID: 5752 (created 2024-07-06T00:00:01.7155092Z), Command line: `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'File name: `iy2orr1e.rrg.exe`, Process ID: 5752 (created 2024-07-06T00:00:01.7155092Z), Command line: `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious sequence of exploration/discovery commands was executed via the process `powershell.exe` at 2024-07-04 22:35:03 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'These exploration activities were performed under the user account `gsmith`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker then attempted to hide the use of a dual-purpose tool by renaming it, launching Process ID `5752` at `2024-07-06t00:00:01.7155092z` with the command line `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`, which decodes to a script path used for signing/token operations.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
