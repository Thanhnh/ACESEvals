tasks:
- task_id: incident_55_latest_cleaned_train_set_task_38
  title: incident_55_latest_cleaned_train_set_task_38
  description: 'Which user account (provide the email address) was reported as reading the AD FS DKM key in that later alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised showing that the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password-type credential to the OAuth application SimulandApp (OAuth App ID `4d9476b8-6ae6-459b-a273-5837c15b5981`, Object ID `a66a4b44-d1f7-4563-95bf-a89d1b05b325`) within the Office 365 / Microsoft 365 cloud application (App ID 11161), from IP address `36.193.21.220`. This usage pattern may indicate that an attacker has compromised the app and is using it to spread phishing, exfiltrate data, or gain access to other accounts and devices. Pivoting from this activity through related endpoint alerts (suspicious system hardware discovery and suspicious remote activity), the investigation leads to a later alert reporting a suspected AD FS DKM key read of the ADFS object with ID `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`.'
    question: 'Which user account (provide the email address) was reported as reading the AD FS DKM key in that later alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` (Luciano Herrera, pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application SimulandApp.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'On the compromised device, the process `powershell.exe` was used to perform suspicious system hardware discovery, gathering information about the target device or network.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` was observed conducting suspicious remote activity on the machine, such as initiating remote interactive sessions, WMI commands, or scheduled tasks.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'The account `gsmith@niseko.alpineskihouse.co` read the AD FS DKM key of the ADFS object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`, indicating an attempt to forge SAML tokens.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
