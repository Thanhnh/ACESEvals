tasks:
- task_id: incident_55_latest_cleaned_train_set_task_16
  title: incident_55_latest_cleaned_train_set_task_16
  description: 'A few days later, a suspicious service named DDLOXJDSQSNGMUKKFUXQ was created on the same host to execute potentially malicious commands. What is the email address of the account that created this service?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident investigation, an ''ADFS private key extraction attempt'' alert fired on host `mb-adfs`, where a suspicious LDAP query was launched. The process `iy2orr1e.rrg.exe` (PID 3116, created 2024-07-02T09:48:23Z, and again PID 8764 on 2024-07-04) ran with `-windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`, suggesting an attempt to steal Active Directory Federation Service private keys or move laterally.'
    question: 'A few days later, a suspicious service named DDLOXJDSQSNGMUKKFUXQ was created on the same host to execute potentially malicious commands. What is the email address of the account that created this service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An ADFS private key extraction attempt was detected via a suspicious LDAP query, associated with the account with AadUserId `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account then created a suspicious service `DDLOXJDSQSNGMUKKFUXQ` on host MB-ADFS to execute potentially malicious commands, performed by the user with Email `gsmith@niseko.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
