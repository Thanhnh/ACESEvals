tasks:
- task_id: incident_55_latest_cleaned_train_set_task_58
  title: incident_55_latest_cleaned_train_set_task_58
  description: 'For the alert about the renamed system executable being launched, which account name was the process running under?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised for email messages containing a malicious URL that were delivered and later removed. The email was sent from `santiago@vnevado.alpineskihouse.co` (sender IP `119.36.50.193`) to the mailbox `bjenkins@niseko.alpineskihouse.co` belonging to Lucas Grey, and contained the URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`. Pivoting from this user''s identity, related endpoint activity was found, including suspicious system hardware discovery and, moments later, an alert for a renamed Windows system executable being launched — a technique attackers use to evade path- and name-based detections.'
    question: 'For the alert about the renamed system executable being launched, which account name was the process running under?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'SYSTEM'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` received an email containing a malicious URL, which was removed after delivery.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On the affected device, the process `powershell.exe` was used to perform suspicious system hardware discovery, gathering information about the target device or network.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A renamed Windows system executable was then launched under the account `SYSTEM`, indicating an attempt to evade behavior-based detection while running malicious code.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
