tasks:
- task_id: incident_55_latest_cleaned_train_set_task_89
  title: incident_55_latest_cleaned_train_set_task_89
  description: 'A related alert in this incident reports emails containing a malicious URL that were delivered and later removed. What is the email address of the affected recipient mailbox?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious sequence of exploration activities was detected on a device (AAD Device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`) where `svchost.exe` spawned a series of reconnaissance commands, including `"powershell.exe" -noexit -command set-location -literalpath ''c:\users\bjenkins\downloads\midnight14''`, `"whoami.exe" /user` (PID 1104), and `"powershell.exe" c:\script\contosoadfsblatempcreds.ps1` (PID 13968). The user accounts `pwilson` and `bjenkins` were observed in this activity.'
    question: 'A related alert in this incident reports emails containing a malicious URL that were delivered and later removed. What is the email address of the affected recipient mailbox?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` ran a suspicious sequence of Windows exploration commands, likely to identify valuable assets and prepare for lateral movement, at 2024-07-04 22:35:03 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Later, on 2024-07-09 11:49:57 UTC, the email account `bjenkins@niseko.alpineskihouse.co` received email messages containing a malicious URL, which were removed after delivery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
