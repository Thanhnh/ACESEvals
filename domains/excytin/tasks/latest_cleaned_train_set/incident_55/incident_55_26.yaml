tasks:
- task_id: incident_55_latest_cleaned_train_set_task_26
  title: incident_55_latest_cleaned_train_set_task_26
  description: 'In the earlier ''Suspicious sequence of exploration activities'' alert reached by pivoting on the shared Azure AD user ID, what was the local account name tied to the activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert was raised for email messages containing a malicious URL (`https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`) that were delivered to a mailbox and later removed. The message originated from `santiago@vnevado.alpineskihouse.co` with sender IP `119.36.50.193` and was addressed to a recipient in the `niseko.alpineskihouse.co` domain, whose mailbox is registered to a user displayed as Lucas Grey. Pivoting on that user''s Azure AD user ID links this email alert to an earlier alert titled ''Suspicious sequence of exploration activities'', in which a process invoked a set of Windows commands typically used by attackers to identify valuable assets and plan lateral movement.'
    question: 'In the earlier ''Suspicious sequence of exploration activities'' alert reached by pivoting on the shared Azure AD user ID, what was the local account name tied to the activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` received email messages containing a malicious URL, which were delivered and later removed at 2024-07-09 11:49:57 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, a suspicious sequence of exploration activities was observed, where a process ran a set of Windows discovery commands used to identify valuable assets and coordinate lateral movement, performed under the account with Name `bjenkins`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
