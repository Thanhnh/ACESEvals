tasks:
- task_id: incident_55_latest_cleaned_train_set_task_52
  title: incident_55_latest_cleaned_train_set_task_52
  description: 'For the alert about emails containing a malicious URL that were removed after delivery, what was the malicious URL contained in those emails?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Sensitive credential memory read'' alert was raised on host `mb-winclient` (AadDeviceId `7661dfd4-218f-4016-8a87-66d68a7f098e`), where a PowerShell process (PID 12412, command line `"powershell.exe" -noexit -command set-location -literalpath ''c:\users\bjenkins\downloads\midnight14''`) accessed the memory of `lsass.exe` (PID 760) under the account `bjenkins`, with associated IP `72.5.72.208`. Following this credential theft, the compromised account was used to send internal phishing emails, and a related alert reported that email messages containing a malicious URL were delivered and later removed from mailboxes.'
    question: 'For the alert about emails containing a malicious URL that were removed after delivery, what was the malicious URL contained in those emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://kn017721628.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://kn017721628.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A process scanned or dumped memory from lsass.exe on the account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`, allowing the attacker to steal credentials.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account `santiago@vnevado.alpineskihouse.co` was then observed sending internal phishing emails to recipients inside the organization.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Those phishing emails contained the malicious URL `http://kn017721628.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`, which was delivered and later removed from mailboxes.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
