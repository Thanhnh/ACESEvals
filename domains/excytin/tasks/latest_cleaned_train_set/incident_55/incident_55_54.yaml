tasks:
- task_id: incident_55_latest_cleaned_train_set_task_54
  title: incident_55_latest_cleaned_train_set_task_54
  description: 'Which host performed the suspected AD FS DKM key read?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a suspicious LDAP query was executed on host `mb-winclient` (AAD Device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`) by account `pwilson`, where `powershell.exe` ran the script `c:\script\ldaprequest.ps1` (Process ID 11116) with associated IP address `72.5.72.208`. This reconnaissance was followed by a suspected DCSync attack where a replication request was sent from MB-WINCLIENT to a domain controller, and shortly afterwards an alert fired for a suspected AD FS DKM key read of the ADFS object with id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`.'
    question: 'Which host performed the suspected AD FS DKM key read?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'MB-DC1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious LDAP query was executed for reconnaissance by the account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the gathered directory information, that user (Luciano Herrera, CIO) on MB-WINCLIENT sent a replication request in a suspected DCSync attack targeting the domain controller with HostName `MB-DC1`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The same host, HostName `MB-DC1`, then read the AD FS DKM key of the ADFS object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`, indicating further credential theft activity on that host.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
