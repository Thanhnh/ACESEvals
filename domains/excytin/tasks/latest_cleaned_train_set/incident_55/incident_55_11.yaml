tasks:
- task_id: incident_55_latest_cleaned_train_set_task_11
  title: incident_55_latest_cleaned_train_set_task_11
  description: 'Roughly a second later, a related alert reported suspicious access to the LSASS service on the same host, indicating a credential theft attempt. Which library (DLL) file was recorded as an entity in that LSASS access alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert titled "System executable renamed and launched" fired on host `mb-adfs`. A renamed Windows executable, `iy2orr1e.rrg.exe`, was launched under the SYSTEM account (SID `S-2-2-78`) with a hidden window and an encoded PowerShell command (Process ID 3116, created 2024-07-02T09:48:23.94Z), following an earlier encoded PowerShell execution (Process ID 6808, created 2024-07-02T09:48:12.76Z). Renaming system executables is a common defense evasion technique used by attackers to bypass detections that rely on default file names and paths.'
    question: 'Roughly a second later, a related alert reported suspicious access to the LSASS service on the same host, indicating a credential theft attempt. Which library (DLL) file was recorded as an entity in that LSASS access alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vaultcli.dll'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vaultcli.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A Windows system executable was renamed and launched - the extracted file name was `powershell.exe`, indicating the attacker disguised PowerShell under a different file name to evade path/name-based detections.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that, suspicious access to the LSASS service was detected involving the credential-related file `vaultcli.dll`, indicating the attacker attempted to dump LSASS memory to obtain clear-text credentials for lateral movement.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
