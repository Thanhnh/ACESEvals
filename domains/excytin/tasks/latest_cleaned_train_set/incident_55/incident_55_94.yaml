tasks:
- task_id: incident_55_latest_cleaned_train_set_task_94
  title: incident_55_latest_cleaned_train_set_task_94
  description: 'Shortly after this execution, a suspicious LDAP query was detected indicating potential domain reconnaissance activity. What is the Microsoft Entra (AAD) user ID of the account associated with that LDAP query alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, on host `mb-adfs`, a renamed Windows system executable `iy2orr1e.rrg.exe` (process ID 3116) was launched with hidden window style and an encoded PowerShell command, running under the SYSTEM account (SID S-2-2-78). This followed an earlier encoded PowerShell execution (process ID 6808).'
    question: 'Shortly after this execution, a suspicious LDAP query was detected indicating potential domain reconnaissance activity. What is the Microsoft Entra (AAD) user ID of the account associated with that LDAP query alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '2de70991-2799-4a95-b734-8e3df3a50118'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '2de70991-2799-4a95-b734-8e3df3a50118'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A renamed Windows system executable, originally `powershell.exe`, was launched on the device to evade path/filename-based detections.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that, a suspicious LDAP query was executed for reconnaissance of the domain, performed by the user account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
