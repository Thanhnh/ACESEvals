tasks:
- task_id: incident_55_latest_cleaned_train_set_task_97
  title: incident_55_latest_cleaned_train_set_task_97
  description: 'For the related alert reporting that a malicious URL was clicked on the affected device, what was the full URL that was clicked?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired showing that the account `gsmith@niseko.alpineskihouse.co` created a suspicious service named DDLOXJDSQSNGMUKKFUXQ on the host `MB-ADFS` in order to execute potentially malicious commands. This activity is linked through shared accounts, processes, and devices to other alerts in the same incident, including credential theft attempts against the LSASS service, a suspicious sequence of Windows discovery commands, and a malicious URL that was clicked on one of the affected devices.'
    question: 'For the related alert reporting that a malicious URL was clicked on the affected device, what was the full URL that was clicked?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `gsmith` created a suspicious service named `DDLOXJDSQSNGMUKKFUXQ` on the host MB-ADFS in order to execute potentially malicious commands.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'A process `powershell.exe` was used to run a suspicious sequence of Windows exploration commands to identify valuable assets and prepare for lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'On the device with AadDeviceId `7661dfd4-218f-4016-8a87-66d68a7f098e`, there was suspicious access to the LSASS service, indicating credential theft attempts.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'From that same device, a malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was clicked.'
