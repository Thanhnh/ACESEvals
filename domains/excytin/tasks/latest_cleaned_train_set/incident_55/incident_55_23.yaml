tasks:
- task_id: incident_55_latest_cleaned_train_set_task_23
  title: incident_55_latest_cleaned_train_set_task_23
  description: 'For the related alert about emails with a malicious URL that were delivered and later removed, what is the email address of the recipient who received these messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious LDAP query was detected when `powershell.exe` executed the script `ldaprequest.ps1` (command line: `"powershell.exe" c:\script\ldaprequest.ps1`, Process ID 11116). This reconnaissance activity was followed by a suspicious sequence of exploration commands run under the same compromised user account on the same device. Later in the same incident, emails containing a malicious URL were delivered and subsequently removed from a mailbox.'
    question: 'For the related alert about emails with a malicious URL that were delivered and later removed, what is the email address of the recipient who received these messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious LDAP query indicating reconnaissance activity was executed on the host with AadDeviceId `7661dfd4-218f-4016-8a87-66d68a7f098e`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On that host, the account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` ran a suspicious sequence of exploration activities (windows commands used to identify assets of value and coordinate lateral movement).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Emails containing a malicious URL were delivered and later removed for the recipient mailbox `bjenkins@niseko.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
