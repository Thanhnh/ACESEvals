tasks:
- task_id: incident_55_latest_cleaned_train_set_task_88
  title: incident_55_latest_cleaned_train_set_task_88
  description: 'For the final alert in this chain regarding the unusual addition of credentials to an OAuth app, what is the OAuth object ID of the application that received the new credential?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Attempt to hide use of dual-purpose tool" was raised on host `mb-adfs`, where a known public tool was observed running under an unexpected filename `iy2orr1e.rrg.exe` (Process ID 3116, launched with `-windowstyle hidden -encodedcommand ...`) by the account `gsmith` (SID S-2-5-21-571436798-3864380397-1837441745-3206). Following this activity, the attack chain progressed through suspicious remote activity and a suspicious LDAP query, and ultimately led to an alert on 2024-07-07 where the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the application SimulandApp.'
    question: 'For the final alert in this chain regarding the unusual addition of credentials to an OAuth app, what is the OAuth object ID of the application that received the new credential?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'a66a4b44-d1f7-4563-95bf-a89d1b05b325'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'a66a4b44-d1f7-4563-95bf-a89d1b05b325'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `gsmith` attempted to hide the use of a dual-purpose tool by running a known public tool under an unexpected filename.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious remote activity was observed on the machine involving the process `powershell.exe`, indicating remotely initiated commands.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'A suspicious LDAP reconnaissance query was executed by the user with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118`, querying the domain controller for privileged users, groups, and assets.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Using the gathered access, an unusual addition of credentials (a Password credential) was made to the OAuth application `SimulandApp` with OAuthObjectId `a66a4b44-d1f7-4563-95bf-a89d1b05b325` by the user Luciano Herrera (pwilson@niseko.alpineskihouse.co), suggesting the app was compromised for persistence, phishing, or data exfiltration.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
