tasks:
- task_id: incident_55_latest_cleaned_train_set_task_55
  title: incident_55_latest_cleaned_train_set_task_55
  description: 'For the alert reporting the suspected AD FS DKM key read, which host performed the read of the AD FS DKM key?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert titled "Attempt to hide use of dual-purpose tool" was raised after a known public tool was observed running under an unexpected filename. The process details were: ProcessId 5752, created at 2024-07-06T00:00:01.7155092Z, with command line `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`, suggesting an attempt to hide malicious tool usage. Later in the same attack chain, a related alert flagged a suspected AD FS DKM key read of the ADFS object with id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2.'
    question: 'For the alert reporting the suspected AD FS DKM key read, which host performed the read of the AD FS DKM key?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'MB-DC1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: 'On host `mb-adfs`, a known dual-purpose public tool was observed running under an unexpected filename, indicating an attempt to hide its malicious use.'
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: 'The renamed system executable was identified as `powershell.exe`, which was launched from a non-default path/name to evade detection.'
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: 'Using that process, the account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` executed a suspicious LDAP query to enumerate the domain for privileged users, groups, and assets.'
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: 'With the reconnaissance data, the attacker performed a suspected DCSync attack, sending a directory replication request from MB-WINCLIENT to the domain controller `MB-DC1`.'
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: 'Finally, the AD FS DKM key of the ADFS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2 was read on the same domain controller `MB-DC1`, enabling token-signing certificate theft (Golden SAML).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
