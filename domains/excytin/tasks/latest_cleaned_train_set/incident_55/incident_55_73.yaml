tasks:
- task_id: incident_55_latest_cleaned_train_set_task_73
  title: incident_55_latest_cleaned_train_set_task_73
  description: 'Several days later, on 2024-07-10, a related alert reported that a user clicked on a potentially malicious URL. What is the primary email address of the mailbox belonging to the user who clicked that link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a ''Sensitive credential memory read'' alert was raised on host `mb-winclient` (AAD device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`), where a PowerShell process (`powershell.exe`, PID 12412) scanned or dumped memory from the Local Security Authority Subsystem Service (`lsass.exe`, PID 760, created 2024-07-02T07:28:35Z). The activity was also associated with the IP address `72.5.72.208`. Accessing LSASS memory allows an attacker to extract secrets such as authentication hashes or passwords.'
    question: 'Several days later, on 2024-07-10, a related alert reported that a user clicked on a potentially malicious URL. What is the primary email address of the mailbox belonging to the user who clicked that link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process read or dumped memory from lsass.exe under the account with SID `S-1-5-21-561436748-3867387497-1732241745-3701`, allowing the attacker to extract credentials such as authentication hashes or passwords.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The user of the mailbox with primary address `bjenkins@niseko.alpineskihouse.co` clicked on a potentially malicious URL delivered by email.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
