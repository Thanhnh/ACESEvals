tasks:
- task_id: incident_55_latest_cleaned_train_set_task_32
  title: incident_55_latest_cleaned_train_set_task_32
  description: 'For the ''Malicious URL was clicked on that device'' alert linked to this same host, what is the full malicious URL that was clicked?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a ''Suspicious remote activity'' alert was raised on host `mb-adfs`, where the account `gsmith` (SID S-2-5-21-571436798-3864380397-1837441745-3206) was associated with `cmd.exe` spawning an encoded PowerShell command: `cmd.exe /c "powershell.exe -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcafiazqbuageabqblafaabwb3aguacgbzaggazqbsagwalgbwahmamqa="` (PID 8896). Moments later, a related alert showed a process being injected with potentially malicious code on the same device, and days later that same device reported a user clicking a malicious link.'
    question: 'For the ''Malicious URL was clicked on that device'' alert linked to this same host, what is the full malicious URL that was clicked?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was observed involving the process `powershell.exe`, which was initiated remotely on the machine.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The PowerShell process injected potentially malicious code into another process on the host `mb-winclient`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'From that same device, a malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was clicked.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
