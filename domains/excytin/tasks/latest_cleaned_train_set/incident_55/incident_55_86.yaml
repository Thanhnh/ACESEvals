tasks:
- task_id: incident_55_latest_cleaned_train_set_task_86
  title: incident_55_latest_cleaned_train_set_task_86
  description: 'For the later ''Suspicious service creation'' alert on MB-ADFS, what is the full email address of the account that created the suspicious service?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert for ''Suspicious access to LSASS service'' was triggered on host `mb-winclient` (AAD Device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`), involving the account `bjenkins` (SID S-1-5-21-561436748-3867387497-1732241745-3701), the process `760__2024-07-02t07:28:35.8580921z__lsass.exe`, DLLs such as `hid.dll`, `vaultcli.dll`, `cryptdll.dll` and `winscard.dll`, and the IP address `72.5.72.208`. Attackers often decrypt user passwords from LSASS memory and reuse those credentials for lateral movement. Follow-on activity in this incident included an ongoing hands-on-keyboard attack via the Impacket toolkit and, later, the creation of a suspicious service named DDLOXJDSQSNGMUKKFUXQ on the host MB-ADFS to execute potentially malicious commands.'
    question: 'For the later ''Suspicious service creation'' alert on MB-ADFS, what is the full email address of the account that created the suspicious service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious access to the LSASS service was performed by the process `powershell.exe`, likely to dump credentials from memory.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The stolen credentials were used by the account `gsmith` to run an ongoing hands-on-keyboard attack via the Impacket toolkit for lateral movement.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The same user, with email `gsmith@niseko.alpineskihouse.co`, created the suspicious service `DDLOXJDSQSNGMUKKFUXQ` on host MB-ADFS to execute potentially malicious commands.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
