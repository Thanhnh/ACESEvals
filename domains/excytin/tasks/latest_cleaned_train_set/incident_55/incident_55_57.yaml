tasks:
- task_id: incident_55_latest_cleaned_train_set_task_57
  title: incident_55_latest_cleaned_train_set_task_57
  description: 'Related to this incident, an earlier alert flagged an attempt to hide the use of a known dual-purpose tool by renaming it. What was the process ID, creation time, and command line of the renamed tool''s process?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised for suspicious service creation: the account `gsmith@niseko.alpineskihouse.co` created a service named DDLOXJDSQSNGMUKKFUXQ in order to execute potentially malicious commands on the host `MB-ADFS`. This activity is linked through a shared account SID to other earlier suspicious activity in the same environment.'
    question: 'Related to this incident, an earlier alert flagged an attempt to hide the use of a known dual-purpose tool by renaming it. What was the process ID, creation time, and command line of the renamed tool''s process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 5752, Created Time (UTC): 2024-07-06T00:00:01.7155092Z, Command Line: `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 5752, Created Time (UTC): 2024-07-06T00:00:01.7155092Z, Command Line: `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` (gsmith) created a suspicious service named `DDLOXJDSQSNGMUKKFUXQ` to execute potentially malicious commands on host `MB-ADFS`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A known dual-purpose tool was renamed and executed under the unexpected filename with Process ID `5752` at `2024-07-06t00:00:01.7155092z`, using the command line `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`, which decodes to a hidden PowerShell script `C:\Scripts\ExportADFSTokenSigningCert.ps1`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
