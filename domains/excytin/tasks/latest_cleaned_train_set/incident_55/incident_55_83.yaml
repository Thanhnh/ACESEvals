tasks:
- task_id: incident_55_latest_cleaned_train_set_task_83
  title: incident_55_latest_cleaned_train_set_task_83
  description: 'A few days earlier, on 2024-07-04, a related alert in the same incident reported that a malicious PowerShell Cmdlet — potentially associated with credential theft, exploitation, network reconnaissance, or code injection — was invoked on a machine. Which user account name was associated with that PowerShell activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert was raised for an unusual addition of credentials to an OAuth application named SimulandApp (OAuthAppId `4d9476b8-6ae6-459b-a273-5837c15b5981`, OAuthObjectId `a66a4b44-d1f7-4563-95bf-a89d1b05b325`). The activity was performed on 2024-07-07 by the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) from IP address `36.193.21.220`, targeting the Office 365 / Microsoft 365 cloud application (AppId 11161). A credential of type Password was added, which may indicate an attacker has compromised the app to spread phishing, exfiltrate data, or gain access to other accounts and devices.'
    question: 'A few days earlier, on 2024-07-04, a related alert in the same incident reported that a malicious PowerShell Cmdlet — potentially associated with credential theft, exploitation, network reconnaissance, or code injection — was invoked on a machine. Which user account name was associated with that PowerShell activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` (Luciano Herrera, pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application `SimulandApp`, indicating the app may be compromised and used for phishing, data exfiltration, or gaining access to other accounts and devices.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using this access, a malicious PowerShell Cmdlet associated with credential theft, exploitation, network reconnaissance, or code injection was invoked on the machine under the account with Name `bjenkins`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
