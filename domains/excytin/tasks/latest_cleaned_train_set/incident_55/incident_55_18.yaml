tasks:
- task_id: incident_55_latest_cleaned_train_set_task_18
  title: incident_55_latest_cleaned_train_set_task_18
  description: 'The attack chain later escalated to a suspected DCSync attack, where a replication request was sent from the device MB-WINCLIENT to the domain controller MB-DC1. Which user account (display name) was identified as the source of that replication request?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, a suspicious sequence of exploration activities was detected on host `mb-adfs` under the account `gsmith` (SID S-2-5-21-571436798-3864380397-1837441745-3206). A hidden process `iy2orr1e.rrg.exe` was launched with an encoded PowerShell command (process ID 3116 at 2024-07-02T09:48:23Z, and again as process ID 8764 on 2024-07-04), followed by repeated executions of `whoami.exe` — commands typically used by attackers to identify assets of value and prepare for lateral movement.'
    question: 'The attack chain later escalated to a suspected DCSync attack, where a replication request was sent from the device MB-WINCLIENT to the domain controller MB-DC1. Which user account (display name) was identified as the source of that replication request?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera (CIO)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera (CIO)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A process launched `powershell.exe` to run a suspicious sequence of windows exploration commands used to identify valuable assets and plan lateral movement.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The user account with SID `S-1-5-21-551436448-9871687716-9837441745-1903` was involved in a process injection, where potentially malicious code was injected into another process to hide execution within a trusted process.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The compromised account `Luciano Herrera` (CIO) on host MB-WINCLIENT performed a suspected DCSync attack by sending a directory services replication request to the domain controller MB-DC1.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
