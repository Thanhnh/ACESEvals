tasks:
- task_id: incident_55_latest_cleaned_train_set_task_24
  title: incident_55_latest_cleaned_train_set_task_24
  description: 'Almost at the same time on the same device, a related alert was triggered for a renamed Windows system executable being launched. Under which account name was that renamed system executable launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled ''Attempt to hide use of dual-purpose tool'' was raised for the account `gsmith` (SID `S-2-5-21-571436798-3864380397-1837441745-3206`, AAD User ID `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`). A known public tool, which could also be used for malicious reasons, was observed under an unexpected filename, possibly an attempt to hide its malicious use.'
    question: 'Almost at the same time on the same device, a related alert was triggered for a renamed Windows system executable being launched. Under which account name was that renamed system executable launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'SYSTEM'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'On host `mb-adfs`, a known dual-purpose public tool was observed running under an unexpected filename, indicating an attempt to hide its malicious use.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same host, a renamed Windows system executable was launched under the account with Name `SYSTEM`, showing the attacker used the renamed binary with SYSTEM-level privileges to evade path/filename-based detections.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
