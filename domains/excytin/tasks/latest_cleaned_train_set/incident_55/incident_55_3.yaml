tasks:
- task_id: incident_55_latest_cleaned_train_set_task_3
  title: incident_55_latest_cleaned_train_set_task_3
  description: 'For the alert reporting the ongoing hands-on-keyboard attack via the Impacket toolkit, what is the name of the file (executable) involved in that suspicious command execution?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert for "Suspicious remote activity" was raised on a device at 2024-07-04 22:35:02 UTC, where the process `cmd.exe` was observed being initiated remotely. This type of activity can indicate attempts to start interactive sessions, modify files, pass WMI commands, or create scheduled tasks from a remote machine. Roughly a second earlier, a related alert on the same device flagged an ongoing hands-on-keyboard attack in which a command was executed via the Impacket toolkit, a tool commonly used by attackers to connect to other hosts, explore network shares, and move laterally before deploying ransomware or other payloads.'
    question: 'For the alert reporting the ongoing hands-on-keyboard attack via the Impacket toolkit, what is the name of the file (executable) involved in that suspicious command execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was observed on the machine, initiated under the account `LocalSystem`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'An ongoing hands-on-keyboard attack via the Impacket toolkit was detected, executing commands through the file `powershell.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
