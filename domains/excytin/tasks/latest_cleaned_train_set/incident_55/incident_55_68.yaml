tasks:
- task_id: incident_55_latest_cleaned_train_set_task_68
  title: incident_55_latest_cleaned_train_set_task_68
  description: 'Earlier in this same incident, an alert flagged suspicious Task Scheduler activity where a process previously involved in malicious activity was used to create, modify, or delete a scheduled task for persistence. What is the file name of the process that performed that Task Scheduler activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Attempt to hide use of dual-purpose tool" was raised after a known public tool was observed running under an unexpected filename. The activity was tied to the account `gsmith` (SID `S-2-5-21-571436798-3864380397-1837441745-3206`, Entra ID `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`), and involved process ID 5752 created at 2024-07-06T00:00:01.7155092Z with the command line `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`.'
    question: 'Earlier in this same incident, an alert flagged suspicious Task Scheduler activity where a process previously involved in malicious activity was used to create, modify, or delete a scheduled task for persistence. What is the file name of the process that performed that Task Scheduler activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'On the host with HostName `mb-adfs`, a known public dual-purpose tool was observed running under an unexpected filename, indicating an attempt to hide its malicious use.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'From that same host, the malicious activity continued with a process using Task Scheduler to create, modify, or delete a scheduled task for persistence — the process involved was `powershell.exe` (ExtractedFileName: `powershell.exe`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
