tasks:
- task_id: incident_55_latest_cleaned_train_set_task_35
  title: incident_55_latest_cleaned_train_set_task_35
  description: 'In the suspicious service registration alert that followed on the same host, what is the name of the executable file associated with the process that performed the service registration?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired for a renamed Windows system executable being launched: the process `iy2orr1e.rrg.exe` (PID 3116) was started with `-windowstyle hidden -encodedcommand ...` under the SYSTEM account (SID S-2-2-78), alongside a `powershell.exe` process (PID 6808) also using encoded commands. Attackers rename system executables to evade behavior-based detections that rely on default paths and file names. Seconds later, on the same host, another alert was raised for a suspicious service registration, where a system program was registered as a service, indicating possible persistence or privilege escalation.'
    question: 'In the suspicious service registration alert that followed on the same host, what is the name of the executable file associated with the process that performed the service registration?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A renamed Windows system executable was launched on the host with HostName `mb-adfs`, indicating an attempt to evade path/file-name based detections.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that, a system program was registered as a service via the process with ExtractedFileName `services.exe`, suggesting the attacker established persistence or attempted to gain SYSTEM privileges.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
