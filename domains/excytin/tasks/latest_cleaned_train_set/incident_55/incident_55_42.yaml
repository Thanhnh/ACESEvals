tasks:
- task_id: incident_55_latest_cleaned_train_set_task_42
  title: incident_55_latest_cleaned_train_set_task_42
  description: 'Can you identify the full malicious URL that was clicked on the affected device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed suspicious Task Scheduler activity on host `mb-adfs`. A PowerShell process (PID 6808, created 2024-07-02T09:48:12Z) ran an encoded command, and a renamed binary `iy2orr1e.rrg.exe` was used with `schtasks.exe` (PID 4304) to create and then run (PID 6892) a scheduled task named `run-exportadfstokensignincert.2024-07-02_09_48_23` under the account `niseko\adfsadmin`. Following this, credential dumping was detected against lsass.exe on the same device, and later a user on that same device clicked a malicious link.'
    question: 'Can you identify the full malicious URL that was clicked on the affected device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A process named `powershell.exe` was used to create, modify, or delete a scheduled task via Task Scheduler, indicating an attempt to launch malicious code automatically and establish persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On the device with AadDeviceId `7661dfd4-218f-4016-8a87-66d68a7f098e`, a process scanned or dumped memory from the Local Security Authority Subsystem Service (lsass.exe) to extract sensitive credentials.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'From that same device, a malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was clicked.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
