tasks:
- task_id: incident_55_latest_cleaned_train_set_task_14
  title: incident_55_latest_cleaned_train_set_task_14
  description: 'For the alert about the renamed system executable being launched, which account context was the renamed executable running under?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident, a suspected DCSync attack was detected where the account of Luciano Herrera (CIO), with email `pwilson@niseko.alpineskihouse.co`, on host `MB-WINCLIENT` sent a replication request to the domain controller `MB-DC1`. Investigating further back in the same incident, discovery tooling was run on a device and shortly afterwards an alert fired for a renamed Windows system executable being launched — a technique attackers use to evade behavior-based detections that rely on default paths and file names.'
    question: 'For the alert about the renamed system executable being launched, which account context was the renamed executable running under?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'SYSTEM'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` (Luciano Herrera, CIO) on MB-WINCLIENT performed a suspected DCSync attack, sending a replication request to MB-DC1.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On the same device, the process `powershell.exe` was used to perform suspicious system hardware discovery, gathering information about the target device or network.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'A renamed Windows system executable was then launched under the account Name `SYSTEM`, indicating the attacker attempted to evade path/file-name based detections while running with high privileges.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
