tasks:
- task_id: incident_55_latest_cleaned_train_set_task_41
  title: incident_55_latest_cleaned_train_set_task_41
  description: 'Around the same time, the same user account was also involved in an alert about an unusual addition of a Password credential to an OAuth application named SimulandApp. What is the cloud application ID (AppId) of the application involved in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspected DCSync attack (replication of directory services) was detected in which Luciano Herrera (CIO), working from the host `MB-WINCLIENT`, sent a directory replication request to the domain controller `MB-DC1`. This behavior is typically associated with credential theft from Active Directory.'
    question: 'Around the same time, the same user account was also involved in an alert about an unusual addition of a Password credential to an OAuth application named SimulandApp. What is the cloud application ID (AppId) of the application involved in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '11161'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '11161'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `Luciano Herrera` (CIO), on host MB-WINCLIENT, sent a replication request to MB-DC1, indicating a suspected DCSync attack.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user `Luciano Herrera` (pwilson@niseko.alpineskihouse.co) then performed an unusual addition of a Password-type credential to the OAuth application `SimulandApp`, identified by cloud-application AppId `11161`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
