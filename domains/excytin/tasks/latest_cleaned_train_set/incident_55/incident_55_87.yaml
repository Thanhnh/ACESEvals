tasks:
- task_id: incident_55_latest_cleaned_train_set_task_87
  title: incident_55_latest_cleaned_train_set_task_87
  description: 'For the alert about hiding the use of a dual-purpose tool, what was the process ID, creation time, and full command line of the renamed tool that was executed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage intrusion, the domain controller `MB-DC1` was observed reading the DKM key of an AD FS object (id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2), a technique associated with token-signing certificate theft. This activity was linked to other alerts in the same incident, including a DCSync replication request, code injection into a trusted process, Impacket-based hands-on-keyboard activity, and finally an alert titled ''Attempt to hide use of dual-purpose tool'', where a known public tool was observed running under an unexpected filename to conceal its use.'
    question: 'For the alert about hiding the use of a dual-purpose tool, what was the process ID, creation time, and full command line of the renamed tool that was executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 5752, Created Time (UTC): 2024-07-06T00:00:01.7155092Z, Command line: `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 5752, Created Time (UTC): 2024-07-06T00:00:01.7155092Z, Command line: `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: 'The domain controller host `MB-DC1` was observed reading the AD FS DKM key of ADFS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2, indicating a suspected AD FS DKM key read.'
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: 'From that host, a suspected DCSync attack (replication of directory services) was detected, where the account Luciano Herrera (CIO) with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` on MB-WINCLIENT sent a replication request to MB-DC1.'
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: 'Related to this compromise, a process `powershell.exe` was injected with potentially malicious code, allowing the attacker to run suspicious code within a trusted process.'
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: 'The attacker continued an ongoing hands-on-keyboard attack via the Impacket toolkit using the account with AadUserId `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5` to move laterally and execute commands remotely.'
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: 'The attacker then attempted to hide the use of a dual-purpose tool by renaming it: the process with Process ID `5752`, created at `2024-07-06t00:00:01.7155092z`, ran the command line `"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`, a renamed PowerShell-like binary executing a hidden, base64-encoded command.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
