tasks:
- task_id: incident_55_latest_cleaned_train_set_task_37
  title: incident_55_latest_cleaned_train_set_task_37
  description: 'Pivoting on the same compromised user account, an earlier alert in this incident reported that a process was injected with potentially malicious code. What is the name of the file associated with that code injection alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert was raised for an unusual addition of credentials to an OAuth application: the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) added a credential of type Password to the application SimulandApp (OAuthAppId `4d9476b8-6ae6-459b-a273-5837c15b5981`, OAuthObjectId `a66a4b44-d1f7-4563-95bf-a89d1b05b325`) within the Office 365 / Microsoft 365 cloud application (AppId 11161), from IP address `2801:e0a:1eb:dea0:642e:5bb6:d315:fbb3`. This pattern may indicate that an attacker has compromised the app and is using it to spread phishing, exfiltrate data, or gain access to other accounts and devices.'
    question: 'Pivoting on the same compromised user account, an earlier alert in this incident reported that a process was injected with potentially malicious code. What is the name of the file associated with that code injection alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'contosoadfsblatempcreds.ps1'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'contosoadfsblatempcreds.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` (Luciano Herrera, pwilson@niseko.alpineskihouse.co) performed an unusual addition of a Password credential to the OAuth application `SimulandApp`, suggesting the app was compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following this activity, a process on the compromised environment injected potentially malicious code into another process, and the injected code was associated with the file `contosoadfsblatempcreds.ps1`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
