tasks:
- task_id: incident_55_latest_cleaned_train_set_task_64
  title: incident_55_latest_cleaned_train_set_task_64
  description: 'Later in the same incident, a suspected DCSync attack (a directory services replication request sent from MB-WINCLIENT to MB-DC1) was detected. What is the email address of the user account that was used to make that replication request?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a Suspicious System Hardware Discovery alert fired on host `mb-winclient` (AAD device ID `7661dfd4-218f-4016-8a87-66d68a7f098e`), where a known tool or technique was used to gather information about the device, likely in preparation for later attacks. The activity involved `powershell.exe` (PID 12412, command line: `"powershell.exe" -noexit -command set-location -literalpath ''c:\users\bjenkins\downloads\midnight14''`) and `svchost.exe` (PID 2880, `svchost.exe -k netsvcs -p -s winmgmt`), executed under an account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` and AAD user ID `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`, with the IP address `72.5.72.208` observed.'
    question: 'Later in the same incident, a suspected DCSync attack (a directory services replication request sent from MB-WINCLIENT to MB-DC1) was detected. What is the email address of the user account that was used to make that replication request?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'pwilson@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'pwilson@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` performed suspicious system hardware discovery on the device, using a known tool or technique to gather information for later attacks.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The compromised account then escalated activity, and a suspected DCSync attack (replication of directory services) was detected, where a replication request was sent from MB-WINCLIENT to the domain controller MB-DC1, involving the account with email `pwilson@niseko.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
