tasks:
- task_id: incident_55_latest_cleaned_train_set_task_92
  title: incident_55_latest_cleaned_train_set_task_92
  description: 'Roughly two seconds later, a related alert flagged a suspicious sequence of exploration activities, where a process invoked a set of Windows commands typically used to identify valuable assets and prepare for lateral movement. What is the security identifier (SID) of the account associated with that follow-on alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "System executable renamed and launched" was raised: a Windows executable file that had been renamed was launched under the built-in `SYSTEM` account (SID `S-2-2-78`). Attackers often rename system executables to change the default path or file name in order to evade behavior-based detections while running malicious code or connecting to attacker-controlled network addresses.'
    question: 'Roughly two seconds later, a related alert flagged a suspicious sequence of exploration activities, where a process invoked a set of Windows commands typically used to identify valuable assets and prepare for lateral movement. What is the security identifier (SID) of the account associated with that follow-on alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-5-21-571436798-3864380397-1837441745-3206'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A renamed Windows system executable `iy2orr1e.rrg.exe` was launched on the machine, indicating an attempt to evade path- and name-based detections.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that, the process ran a suspicious sequence of Windows exploration commands under the account with SID `S-2-5-21-571436798-3864380397-1837441745-3206`, likely for discovery and lateral movement preparation.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
