tasks:
- task_id: incident_166_latest_cleaned_train_set_task_17
  title: incident_166_latest_cleaned_train_set_task_17
  description: 'Which user account, identified by their email address, was associated with the BEC financial fraud alert involving the suspicious hidden-email inbox rule?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a high-severity incident involving SAP financial process manipulation (attack disruption), one of the earliest alerts flagged a sign-in from the anonymous IP address `95.202.65.202` (e.g. Tor browser or anonymizer VPN) at 2024-07-22 08:45 UTC. Later in the same incident, a suspicious inbox rule that hides incoming email messages was created within a risky Azure Active Directory session, which was flagged as possible business email compromise (BEC) financial fraud.'
    question: 'Which user account, identified by their email address, was associated with the BEC financial fraud alert involving the suspicious hidden-email inbox rule?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in was detected from an anonymous IP address (e.g., Tor browser or anonymizer VPN) for the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` at 2024-07-22 08:45:32 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Within the same risky Azure Active Directory session, a suspicious inbox rule that hides incoming email messages was created, indicating an attempted business email compromise (BEC) financial fraud by the account with Email `laylaw@vnevado.alpineskihouse.co` at 2024-07-22 10:00:07 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
