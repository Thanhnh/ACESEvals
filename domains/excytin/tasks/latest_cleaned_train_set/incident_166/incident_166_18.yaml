tasks:
- task_id: incident_166_latest_cleaned_train_set_task_18
  title: incident_166_latest_cleaned_train_set_task_18
  description: 'A day earlier, a related alert flagged a suspicious MoveToFolder inbox rule named ''ITCleanup'' created on this same user''s mailbox to move messages into the ''RSS Feeds'' folder. What source IP address was associated with the creation of that inbox manipulation rule?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled ''Possible BEC financial fraud'' was raised on 2024-07-23, indicating suspicious events with business email compromise characteristics that may signal an attempted fraud attack against the organization. The alert involved the account `Jordan P` (`laylaw@vnevado.alpineskihouse.co`, AAD User ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`).'
    question: 'A day earlier, a related alert flagged a suspicious MoveToFolder inbox rule named ''ITCleanup'' created on this same user''s mailbox to move messages into the ''RSS Feeds'' folder. What source IP address was associated with the creation of that inbox manipulation rule?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `laylaw@vnevado.alpineskihouse.co` was involved in suspicious events with business email compromise (BEC) characteristics, indicating a possible financial fraud attempt.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised mailbox of Jordan P (laylaw@vnevado.alpineskihouse.co) had a suspicious inbox manipulation rule named `ITCleanup` created to move messages to the `RSS Feeds` folder, and this activity originated from the IP address `192.238.237.190`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
