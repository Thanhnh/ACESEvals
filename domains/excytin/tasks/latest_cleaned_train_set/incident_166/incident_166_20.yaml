tasks:
- task_id: incident_166_latest_cleaned_train_set_task_20
  title: incident_166_latest_cleaned_train_set_task_20
  description: 'Earlier that same day, an ''Anonymous IP address'' sign-in alert (sign-in from Tor or an anonymizer VPN) was triggered from a shared IP address linked to this activity. What is the Microsoft Entra ID (Azure AD) user object ID of the account that performed that anonymous sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of the SAP financial process manipulation incident, a suspicious inbox manipulation rule alert was raised at 2024-07-22 09:49:55 UTC. The rule, a MoveToFolder rule named `ITCleanup` moving messages to the `RSS Feeds` folder, was created on the mailbox `laylaw@vnevado.alpineskihouse.co` belonging to the user Jordan P (SID `S-1-5-21-1740051960-3534030288-108486866-1602`). The activity was seen against the Office 365 / Microsoft 365 cloud application (AppIds 20893 and 11161) and was associated with IP addresses such as `95.202.65.202`, `255.246.85.58`, and `180.144.153.174`, suggesting the account may be compromised.'
    question: 'Earlier that same day, an ''Anonymous IP address'' sign-in alert (sign-in from Tor or an anonymizer VPN) was triggered from a shared IP address linked to this activity. What is the Microsoft Entra ID (Azure AD) user object ID of the account that performed that anonymous sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'AadUserId: 89e933b9-5b2e-4bd6-bcdf-033db707ef82'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'AadUserId: 89e933b9-5b2e-4bd6-bcdf-033db707ef82'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox manipulation rule named `ITCleanup` (MoveToFolder to `RSS Feeds`) was created on the mailbox of Jordan P (laylaw@vnevado.alpineskihouse.co) from the IP address `192.238.237.190`, indicating a possible account compromise.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same activity was associated with a sign-in from an anonymous IP address (e.g., Tor browser or anonymizer VPN), which was performed by the compromised user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
