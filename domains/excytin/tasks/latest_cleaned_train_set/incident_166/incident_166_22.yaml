tasks:
- task_id: incident_166_latest_cleaned_train_set_task_22
  title: incident_166_latest_cleaned_train_set_task_22
  description: 'For the suspicious SAP authentication alert that followed, what is the cloud application ID (AppId) of the application that the risky account signed in to?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing business email compromise (BEC) fraud investigation, an alert was raised for suspicious emails sent by a possibly compromised user account. The mail messages were sent from `laylaw@vnevado.alpineskihouse.co` with sender IP `255.246.85.58` to the mailbox `tony@avoriaz.alpineskihouse.co`. Later in the same incident, a user account with a risky sign-in alert in Microsoft Entra ID authenticated to SAP, the enterprise application software, potentially to record or modify sensitive financial information.'
    question: 'For the suspicious SAP authentication alert that followed, what is the cloud application ID (AppId) of the application that the risky account signed in to?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The cloud-application AppId is `100` (the SAP enterprise application).'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The cloud-application AppId is `100` (the SAP enterprise application).'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account `Jordan P`, related to an ongoing BEC (business email compromise) fraud attempt, sent suspicious emails on 2024-07-22 10:14:23 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user, flagged with a risky sign-in alert in Microsoft Entra ID, then authenticated to the SAP enterprise application (cloud-application AppId `100`) at 2024-07-22 13:19:46 UTC, suggesting the attacker used the account to search for or modify sensitive financial information in SAP.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
