tasks:
- task_id: incident_166_latest_cleaned_train_set_task_34
  title: incident_166_latest_cleaned_train_set_task_34
  description: 'An earlier related alert on 2024-07-22 flagged suspicious emails sent by a possibly compromised user account tied to this same BEC fraud attempt. What was the sender''s mailbox address for those suspicious emails?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) fraud attempt, an alert titled "Possible BEC financial fraud" was raised on 2024-07-23, indicating an attacker might be attempting to conduct a fraud attack against the organization. The alert involved a user account displayed as `Jordan P`, with AAD User ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82` and SID `S-1-5-21-1740051960-3534030288-108486866-1602`.'
    question: 'An earlier related alert on 2024-07-22 flagged suspicious emails sent by a possibly compromised user account tied to this same BEC fraud attempt. What was the sender''s mailbox address for those suspicious emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious events with business email compromise (BEC) characteristics were observed involving the account `Jordan P`, indicating a possible financial fraud attempt against the organization.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the BEC-related activity, suspicious emails were sent from the possibly compromised mailbox with sender address `laylaw@vnevado.alpineskihouse.co`, continuing the ongoing BEC fraud attempt.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
