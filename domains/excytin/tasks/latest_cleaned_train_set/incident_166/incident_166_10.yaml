tasks:
- task_id: incident_166_latest_cleaned_train_set_task_10
  title: incident_166_latest_cleaned_train_set_task_10
  description: 'For the follow-up alert about suspicious emails sent by the BEC-related user account, which recipient email address received the suspicious message?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a high-severity business email compromise (BEC) related incident, an alert was raised for a suspicious inbox manipulation rule on the cloud application with AppId `20893` (Microsoft Exchange Online), where a user''s inbox rules were manipulated in a way that suggests an attacker gained access to the mailbox to delete or move messages and exfiltrate data. Shortly afterwards, a follow-on alert fired for suspicious emails being sent by the same possibly compromised, BEC-related user account.'
    question: 'For the follow-up alert about suspicious emails sent by the BEC-related user account, which recipient email address received the suspicious message?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tony@avoriaz.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tony@avoriaz.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with email `laylaw@vnevado.alpineskihouse.co` had its inbox rules manipulated in a suspicious manner, indicating the mailbox was likely compromised by an attacker attempting to hide or exfiltrate messages.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the compromised mailbox, suspicious BEC-related emails were sent out, and the mail message was delivered to the recipient `tony@avoriaz.alpineskihouse.co`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
