tasks:
- task_id: incident_166_latest_cleaned_train_set_task_13
  title: incident_166_latest_cleaned_train_set_task_13
  description: 'What is the display name of the user account involved in the ''Possible BEC financial fraud'' alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, a password spray attack was detected originating from the IP address `95.202.65.202`. The compromised account from that attack was later linked to a subsequent alert titled ''Possible BEC financial fraud'', where suspicious events with business email compromise characteristics were observed, suggesting an attacker might be attempting to conduct a fraud attack against the organization.'
    question: 'What is the display name of the user account involved in the ''Possible BEC financial fraud'' alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Jordan P'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected targeting the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` at 2024-07-23 14:23:51 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, suspicious business email compromise (BEC) events indicating possible financial fraud were observed on the account named `Jordan P` at 2024-07-23 16:09:13 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
