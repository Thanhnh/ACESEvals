tasks:
- task_id: incident_166_latest_cleaned_train_set_task_2
  title: incident_166_latest_cleaned_train_set_task_2
  description: 'For the BEC financial fraud alert triggered by the suspicious inbox rule, what is the display name of the user account associated with it?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a Password Spray attack was detected originating from the IP address `95.202.65.202` on 2024-07-23. Pivoting on the compromised identity involved in that sign-in activity, we found an earlier related alert from 2024-07-22 for BEC financial fraud, where a suspicious inbox rule that hides incoming email messages was created during a risky Azure Active Directory session — a typical business email compromise (BEC) technique.'
    question: 'For the BEC financial fraud alert triggered by the suspicious inbox rule, what is the display name of the user account associated with it?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Jordan P'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A password spray attack was detected against the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the compromise, a suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session, indicating a business email compromise (BEC) financial fraud attempt by the account named `Jordan P`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
