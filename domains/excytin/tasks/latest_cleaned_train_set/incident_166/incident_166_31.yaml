tasks:
- task_id: incident_166_latest_cleaned_train_set_task_31
  title: incident_166_latest_cleaned_train_set_task_31
  description: 'A related alert in this incident, triggered about a day later, detected a password spray attack against the same compromised identity. What source IP address was the password spray attack launched from?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a high-severity incident involving SAP financial process manipulation, an alert for ''Suspicious SAP authentication'' was raised. The account ''Jordan P'' (laylaw@vnevado.alpineskihouse.co, SID S-1-5-21-1740051960-3534030288-108486866-1602) signed in to the SAP enterprise application (AppId 100) from IP 107.253.5.27 after being flagged for a risky sign-in in Microsoft Entra ID.'
    question: 'A related alert in this incident, triggered about a day later, detected a password spray attack against the same compromised identity. What source IP address was the password spray attack launched from?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` had a risky sign-in and authenticated to SAP suspiciously at 2024-07-22 12:59:26 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following this, a password spray attack was detected originating from the IP address `95.202.65.202` at 2024-07-23 14:23:51 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
