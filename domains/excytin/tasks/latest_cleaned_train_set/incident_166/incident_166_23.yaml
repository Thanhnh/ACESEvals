tasks:
- task_id: incident_166_latest_cleaned_train_set_task_23
  title: incident_166_latest_cleaned_train_set_task_23
  description: 'For the ''Suspicious SAP authentication'' alert that followed the risky sign-in, what is the security identifier (SID) of the compromised user account that signed in to SAP?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a multi-stage incident involving SAP financial process manipulation, an ''Anonymous IP address'' alert was raised at 2024-07-22 09:11:31 UTC for a sign-in originating from the IP address `192.238.237.190`, indicating the use of an anonymizing service such as Tor or an anonymizer VPN. Following this risky sign-in, a related alert titled ''Suspicious SAP authentication'' was raised, where a user account with a risky sign-in in Microsoft Entra ID authenticated to the SAP enterprise application, potentially to view or modify sensitive financial data.'
    question: 'For the ''Suspicious SAP authentication'' alert that followed the risky sign-in, what is the security identifier (SID) of the compromised user account that signed in to SAP?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1740051960-3534030288-108486866-1602'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1740051960-3534030288-108486866-1602'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) at 2024-07-22 09:11:31 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user, identified by SID `S-1-5-21-1740051960-3534030288-108486866-1602`, then performed a suspicious SAP authentication at 2024-07-22 12:59:26 UTC, potentially to search for or modify sensitive financial information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
