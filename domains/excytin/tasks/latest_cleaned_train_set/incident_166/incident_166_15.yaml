tasks:
- task_id: incident_166_latest_cleaned_train_set_task_15
  title: incident_166_latest_cleaned_train_set_task_15
  description: 'About an hour later, another alert fired indicating that a user involved in a business email compromise (BEC)-related alert also signed in to SAP in a suspicious manner. What is the email address of the account flagged in that BEC-related SAP sign-in alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the SAP-related security incident, an alert titled "Suspicious SAP authentication" was raised on 2024-07-22 at 12:59 UTC. A user account with a risky sign-in in Microsoft Entra ID (AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`) signed in to the SAP enterprise application (AppId 100) from the IP address `107.253.5.27`. An attacker might have taken control of this account to search through SAP with the intention of recording or modifying sensitive financial information.'
    question: 'About an hour later, another alert fired indicating that a user involved in a business email compromise (BEC)-related alert also signed in to SAP in a suspicious manner. What is the email address of the account flagged in that BEC-related SAP sign-in alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` had a risky sign-in alert in Microsoft Entra ID and then signed in to SAP, indicating a suspicious SAP authentication.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account, with email `laylaw@vnevado.alpineskihouse.co`, was involved in a business email compromise-related alert and signed in to SAP in a suspicious manner, potentially to record or modify sensitive financial information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
