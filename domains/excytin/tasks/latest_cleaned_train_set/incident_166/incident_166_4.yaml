tasks:
- task_id: incident_166_latest_cleaned_train_set_task_4
  title: incident_166_latest_cleaned_train_set_task_4
  description: 'For the ''BEC financial fraud'' alert that followed, what is the on-premises security identifier (SID) of the compromised user account associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an ''Anonymous IP address'' alert was raised on 2024-07-22 09:11:31 UTC, indicating a sign-in from the anonymous IP address `192.238.237.190` (e.g. Tor browser or anonymizer VPN). Roughly 50 minutes later, a related alert titled ''BEC financial fraud'' fired, reporting that a suspicious inbox rule hiding incoming email messages was created in a risky Azure Active Directory session — a possible business email compromise attempt.'
    question: 'For the ''BEC financial fraud'' alert that followed, what is the on-premises security identifier (SID) of the compromised user account associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1740051960-3534030288-108486866-1602'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1740051960-3534030288-108486866-1602'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from an anonymous IP address (e.g. Tor browser or anonymizer VPN) was detected for the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` at 2024-07-22 09:11:31 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following that risky sign-in session, a suspicious inbox rule that hides incoming email messages was created, indicating possible business email compromise (BEC) financial fraud, by the account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` at 2024-07-22 10:00:07 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
