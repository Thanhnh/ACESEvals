tasks:
- task_id: incident_166_latest_cleaned_train_set_task_8
  title: incident_166_latest_cleaned_train_set_task_8
  description: 'This compromised account is also linked to another alert in the same incident that is tied to a different cloud application than Office 365 or Exchange Online. What is the AppId of that cloud application?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, a suspicious inbox manipulation rule was detected on the mailbox `laylaw@vnevado.alpineskihouse.co` belonging to user `Jordan P` (AAD User ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`). The user created a MoveToFolder rule named ITCleanup to move messages to the RSS Feeds folder, activity that was seen from several IP addresses including `255.246.85.58`, `95.202.65.202`, `180.144.153.174` and `192.238.237.190`, and which involved the cloud applications `office 365__microsoft 365` (AppId 20893) and `microsoft exchange online`. This behavior suggests the account is compromised and may be used to spread phishing emails and gain access to other accounts.'
    question: 'This compromised account is also linked to another alert in the same incident that is tied to a different cloud application than Office 365 or Exchange Online. What is the AppId of that cloud application?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '11161 (the cloud application referenced in the related alert)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '11161 (the cloud application referenced in the related alert)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'At 2024-07-22 09:49:55 UTC, a suspicious inbox manipulation rule was detected on the mailbox of the user Jordan P (laylaw@vnevado.alpineskihouse.co), where a MoveToFolder rule named `ITCleanup` was created to move incoming messages to the `RSS Feeds` folder, indicating the account may be compromised and used to spread phishing emails.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'This suspicious inbox rule activity was performed within the cloud application (Microsoft Exchange Online / Office 365) identified by the entity Type: cloud-application, Field: AppId, Value: `11161`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
