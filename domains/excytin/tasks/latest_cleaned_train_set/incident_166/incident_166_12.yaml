tasks:
- task_id: incident_166_latest_cleaned_train_set_task_12
  title: incident_166_latest_cleaned_train_set_task_12
  description: 'Roughly 15 minutes before this email alert, a related alert was raised for a user''s inbox rules being manipulated in a suspicious manner (possibly to delete or move messages and exfiltrate data). What is the AppId of the cloud application associated with that inbox manipulation rule alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) investigation, an alert fired for suspicious emails sent by a possibly compromised user account. The messages were sent from `laylaw@vnevado.alpineskihouse.co` to the mailbox `tony@avoriaz.alpineskihouse.co`, originating from sender IP `255.246.85.58`.'
    question: 'Roughly 15 minutes before this email alert, a related alert was raised for a user''s inbox rules being manipulated in a suspicious manner (possibly to delete or move messages and exfiltrate data). What is the AppId of the cloud application associated with that inbox manipulation rule alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '20893'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious emails were sent by a possibly compromised user account involved in an ongoing BEC fraud attempt, originating from the IP address `255.246.85.58`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised activity continued in the cloud application with AppId `20893`, where a suspicious inbox manipulation rule was created to delete or move messages and exfiltrate data.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
