tasks:
- task_id: incident_166_latest_cleaned_train_set_task_21
  title: incident_166_latest_cleaned_train_set_task_21
  description: 'Earlier that same day, a related alert reported that a suspicious inbox rule hiding incoming email messages was created within a risky Azure Active Directory session, indicating possible business email compromise (BEC) financial fraud. What was the source IP address recorded in that BEC financial fraud alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of an SAP financial process manipulation incident, an alert titled "BEC-related user signed in to SAP" was raised on 2024-07-22 at 14:09 UTC. The sign-in was observed from IP address `107.253.5.27` against the cloud application with AppId `100`. This indicates an attacker might have taken control of a user account to search through SAP with the intention of recording or modifying sensitive financial information, which could be used in later phishing or social engineering stages.'
    question: 'Earlier that same day, a related alert reported that a suspicious inbox rule hiding incoming email messages was created within a risky Azure Active Directory session, indicating possible business email compromise (BEC) financial fraud. What was the source IP address recorded in that BEC financial fraud alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account `Jordan P`, who was involved in a business email compromise-related alert, signed in to SAP in a suspicious manner, possibly to search for or modify sensitive financial information.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised account activity was linked to a BEC financial fraud alert, where a suspicious inbox rule hiding incoming email messages was created in a risky Azure Active Directory session originating from the IP address `255.246.85.58`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
