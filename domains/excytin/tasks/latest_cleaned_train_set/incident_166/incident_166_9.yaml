tasks:
- task_id: incident_166_latest_cleaned_train_set_task_9
  title: incident_166_latest_cleaned_train_set_task_9
  description: 'What is the IP address associated with the second ''Anonymous IP address'' sign-in alert linked to the same user account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a security incident, an ''Anonymous IP address'' alert was raised at 2024-07-22 08:45:32 UTC for a sign-in originating from the anonymizing IP address `95.202.65.202` (e.g. Tor browser or anonymizer VPN). The same compromised user account was subsequently seen signing in again from another anonymizing source about 26 minutes later, triggering a second ''Anonymous IP address'' alert at 2024-07-22 09:11:31 UTC.'
    question: 'What is the IP address associated with the second ''Anonymous IP address'' sign-in alert linked to the same user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in from an anonymous IP address (e.g. Tor browser or anonymizer VPN) at 2024-07-22 08:45:32 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same anonymous sign-in activity was traced back to the source IP address `192.238.237.190` at 2024-07-22 09:11:31 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
