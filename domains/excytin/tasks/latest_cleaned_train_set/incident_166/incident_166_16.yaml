tasks:
- task_id: incident_166_latest_cleaned_train_set_task_16
  title: incident_166_latest_cleaned_train_set_task_16
  description: 'Which user account was involved in this anonymous IP sign-in? Provide the Microsoft Entra ID (Azure AD) user object identifier of that account.'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a security incident, Azure Active Directory Identity Protection raised an "Anonymous IP address" alert on 2024-07-22 at 08:45:32 UTC, indicating a sign-in originating from the anonymous IP address `95.202.65.202` (e.g., Tor browser or an anonymizing VPN service).'
    question: 'Which user account was involved in this anonymous IP sign-in? Provide the Microsoft Entra ID (Azure AD) user object identifier of that account.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The compromised/affected account''s AadUserId is `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The compromised/affected account''s AadUserId is `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) was detected at 2024-07-22 08:45:32 UTC for the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
