tasks:
- task_id: incident_166_latest_cleaned_train_set_task_6
  title: incident_166_latest_cleaned_train_set_task_6
  description: 'Earlier in this incident, the same compromised user account triggered an identity protection alert for signing in from an anonymous IP address (e.g. Tor or an anonymizer VPN). What was the source IP address of that anonymous sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a business email compromise (BEC) investigation, an alert was raised for ''Suspicious emails sent by BEC-related user''. The possibly compromised account belonged to Jordan P (`laylaw@vnevado.alpineskihouse.co`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`), which sent suspicious mail from IP `255.246.85.58` to the mailbox `tony@avoriaz.alpineskihouse.co`.'
    question: 'Earlier in this incident, the same compromised user account triggered an identity protection alert for signing in from an anonymous IP address (e.g. Tor or an anonymizer VPN). What was the source IP address of that anonymous sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A possibly compromised user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` sent suspicious emails as part of an ongoing BEC (business email compromise) fraud attempt at 2024-07-22 10:14:23 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Investigation of that compromised account''s sign-in activity revealed a sign-in from an anonymous IP address (e.g., Tor browser or anonymizer VPN) with the address `192.238.237.190` at 2024-07-22 09:11:31 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
