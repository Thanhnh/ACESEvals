tasks:
- task_id: incident_166_latest_cleaned_train_set_task_14
  title: incident_166_latest_cleaned_train_set_task_14
  description: 'Which compromised user account, identified by their email address, was involved in the possible BEC financial fraud alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a high-severity SAP financial process manipulation incident, Azure Active Directory Identity Protection flagged a sign-in from the anonymous IP address `192.238.237.190` (e.g. Tor browser or anonymizer VPN) on 2024-07-22. Roughly a day later, another alert in the same incident reported suspicious events with business email compromise (BEC) characteristics, indicating an attacker might be attempting a fraud attack against the organization.'
    question: 'Which compromised user account, identified by their email address, was involved in the possible BEC financial fraud alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in was detected from an anonymous IP address (e.g., Tor browser or anonymizer VPN) for the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` at 2024-07-22 09:11:31 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the anonymous sign-in, suspicious events with business email compromise (BEC) characteristics indicating possible financial fraud were observed for the compromised account with Email `laylaw@vnevado.alpineskihouse.co` at 2024-07-23 16:09:13 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
