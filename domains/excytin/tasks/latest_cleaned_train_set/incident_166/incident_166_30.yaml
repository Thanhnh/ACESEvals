tasks:
- task_id: incident_166_latest_cleaned_train_set_task_30
  title: incident_166_latest_cleaned_train_set_task_30
  description: 'About an hour earlier, a related alert named ''Suspicious SAP authentication'' was raised in Microsoft Entra ID for a risky sign-in to the same enterprise application. What is the cloud application ID (AppId) recorded in that earlier alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the SAP financial process manipulation incident, an alert titled ''BEC-related user signed in to SAP'' was raised for the account `Jordan P` (email `laylaw@vnevado.alpineskihouse.co`, AAD user ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`) signing in from IP address `107.253.5.27`. This indicates an attacker may have taken control of a user account to search through SAP for sensitive financial information.'
    question: 'About an hour earlier, a related alert named ''Suspicious SAP authentication'' was raised in Microsoft Entra ID for a risky sign-in to the same enterprise application. What is the cloud application ID (AppId) recorded in that earlier alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The cloud application involved has AppId `100`.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The cloud application involved has AppId `100`.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with email `laylaw@vnevado.alpineskihouse.co`, previously involved in a business email compromise (BEC)-related alert, signed in to SAP in a suspicious manner, suggesting the account may have been taken over by an attacker seeking sensitive financial information.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The suspicious sign-in activity from this risky user account was traced to the SAP enterprise cloud application with AppId `100`, which the attacker accessed to potentially record or modify sensitive financial information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
