tasks:
- task_id: incident_166_latest_cleaned_train_set_task_25
  title: incident_166_latest_cleaned_train_set_task_25
  description: 'A few hours later in the same incident, another alert was triggered for a suspicious SAP authentication, where a risky user account signed in to the SAP enterprise application. What is the AppId of the cloud application reported in that SAP authentication alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a security incident involving SAP financial process manipulation, an alert was raised for a suspicious inbox manipulation rule, where a user''s inbox rules were altered in a suspicious manner. This activity was observed on the cloud application with AppId `20893` and originated from the IP address `255.246.85.58`, suggesting an attacker may have gained access to the mailbox to move or delete messages and exfiltrate data.'
    question: 'A few hours later in the same incident, another alert was triggered for a suspicious SAP authentication, where a risky user account signed in to the SAP enterprise application. What is the AppId of the cloud application reported in that SAP authentication alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '100'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` had its inbox rules manipulated in a suspicious manner, indicating the attacker gained access to the mailbox.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user account, flagged with a risky sign-in in Microsoft Entra ID, then authenticated to the SAP enterprise application, identified as cloud-application with AppId `100`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
