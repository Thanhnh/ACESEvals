tasks:
- task_id: incident_166_latest_cleaned_train_set_task_28
  title: incident_166_latest_cleaned_train_set_task_28
  description: 'Later in the same incident, an alert was raised for a suspicious SAP authentication, where a user with a risky sign-in signed in to the enterprise application software. What is the cloud application ID (AppId) associated with the application accessed in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a business email compromise (BEC) financial fraud incident, an alert was raised because a suspicious inbox rule that hides incoming email messages was created within a risky Azure Active Directory session originating from the IP address `255.246.85.58`. An attacker might be attempting to conduct financial fraud.'
    question: 'Later in the same incident, an alert was raised for a suspicious SAP authentication, where a user with a risky sign-in signed in to the enterprise application software. What is the cloud application ID (AppId) associated with the application accessed in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'AppId: 100 (the SAP cloud application)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'AppId: 100 (the SAP cloud application)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule that hides incoming email messages was created in a risky Azure AD session by the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, indicating possible business email compromise (BEC) financial fraud.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised user account then signed in to the SAP enterprise application, the cloud application with AppId `100`, generating a suspicious SAP authentication alert.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
