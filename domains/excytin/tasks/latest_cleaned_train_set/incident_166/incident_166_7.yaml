tasks:
- task_id: incident_166_latest_cleaned_train_set_task_7
  title: incident_166_latest_cleaned_train_set_task_7
  description: 'This activity is linked to a later alert about possible BEC financial fraud, where suspicious events with business email compromise characteristics were observed. What is the display name of the user account associated with that possible BEC financial fraud alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of an incident involving SAP financial process manipulation, an alert titled ''BEC-related user signed in to SAP'' was raised. It indicated that a user involved in a business email compromise-related alert also signed in to SAP in a suspicious manner from the IP address `107.253.5.27` using the cloud application with AppId `100`. An attacker might have taken control of a user account to search through SAP with the intention of recording or modifying sensitive financial information.'
    question: 'This activity is linked to a later alert about possible BEC financial fraud, where suspicious events with business email compromise characteristics were observed. What is the display name of the user account associated with that possible BEC financial fraud alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Jordan P'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with email `laylaw@vnevado.alpineskihouse.co`, which was involved in a business email compromise-related alert, signed in to SAP in a suspicious manner, possibly to search for or modify sensitive financial information.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following this activity, suspicious events with business email compromise (BEC) characteristics indicating possible financial fraud were observed on the account with Name `Jordan P`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
