tasks:
- task_id: incident_166_latest_cleaned_train_set_task_32
  title: incident_166_latest_cleaned_train_set_task_32
  description: 'An earlier ''Suspicious SAP authentication'' alert, triggered about 20 minutes before this one on the same SAP cloud application, involved a different compromised user. What is the display name of that user account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of an SAP financial process manipulation incident, an alert titled ''Suspicious SAP authentication'' was raised on 2024-07-22 at 13:19:46 UTC. It involved the account `laylaw@vnevado.alpineskihouse.co` (AAD User ID `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, SID `S-1-5-21-1740051960-3534030288-108486866-1602`) signing in to SAP from IP address `107.253.5.27` after a risky sign-in was flagged in Microsoft Entra ID. An attacker might have taken control of the account to search SAP for sensitive financial information.'
    question: 'An earlier ''Suspicious SAP authentication'' alert, triggered about 20 minutes before this one on the same SAP cloud application, involved a different compromised user. What is the display name of that user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Jordan P'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious SAP authentication was detected involving the cloud application with AppId `100`, where a risky sign-in was used to access SAP.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The user account `Jordan P` was identified as the risky user who signed in to SAP in this suspicious authentication.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
