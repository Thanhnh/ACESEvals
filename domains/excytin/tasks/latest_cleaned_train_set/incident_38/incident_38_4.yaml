tasks:
- task_id: incident_38_latest_cleaned_train_set_task_4
  title: incident_38_latest_cleaned_train_set_task_4
  description: 'In that follow-up alert about the process running with no command line arguments, what IP address was identified as an entity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a Suspicious Application Window Discovery alert flagged a known tool or technique used to gather information on a device. The activity involved `powershell.exe` (PID 7472, created 2024-06-26T15:49:15.786Z) and a second PowerShell process (PID 4656, created 2024-06-26T15:49:41.402Z) launched with `-executionpolicy bypass -encodedcommand ...`, whose decoded payload downloads content over HTTPS. Roughly a second later, a related alert fired for unexpected behavior observed by a process that ran with no command line arguments, which may indicate injected code or a malicious executable masquerading as a legitimate one.'
    question: 'In that follow-up alert about the process running with no command line arguments, what IP address was identified as an entity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '202.183.149.174'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '202.183.149.174'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `nathans` was used to run a known tool or technique to perform suspicious application window discovery on the device, gathering information about the target device or network.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the discovery activity, a process running with no command line arguments exhibited unexpected behavior — likely due to injected code or a masquerading malicious executable — and communicated with the IP address `202.183.149.174`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
