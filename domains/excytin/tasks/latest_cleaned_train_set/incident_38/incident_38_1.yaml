  initial_context:
    incident_context: 'During an investigation of a multi-stage incident, a "Suspicious Application Window Discovery" alert was raised on 2024-07-04 for the device `vnevado-win11a` (AAD Device ID `39d8c57f-2d08-4888-b0cd-12cd0679337a`). The alert involved the user account `nathans` (AAD User ID `12185914-91dd-4fb9-94f9-3252203b0426`), the remote IP address `72.5.72.208`, and the execution of `powershell.exe` (PID 7472, and PID 4656 launched with `-executionpolicy bypass -encodedcommand ...`). A known tool or technique was used to gather information about the target device or network for later attacks.'
    question: 'For the user account involved in this discovery activity, what is the on-premises Windows security identifier (SID) recorded in the alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1240151660-3534038288-105586567-4122'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1240151660-3534038288-105586567-4122'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A known reconnaissance tool or technique was used on the device to perform Suspicious Application Window Discovery at `2024-07-04 22:35:00.593840+00:00`, indicating an attacker gathering information about the target device or network for later attacks.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'This discovery activity was carried out under the user context of the account with SID `S-1-5-21-1240151660-3534038288-105586567-4122`.'
