tasks:
- task_id: incident_38_latest_cleaned_train_set_task_3
  title: incident_38_latest_cleaned_train_set_task_3
  description: 'Roughly a second before this alert, a related ''Suspicious process injection observed'' alert fired, where a process abnormally injected code into another process, which then reached out to an external web resource. What is the full URL that was contacted in that injection alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert was raised for "Unexpected behavior observed by a process ran with no command line arguments" on 2024-07-04 at 22:35:01 UTC, where the legitimate process by that name does not normally exhibit such behavior. This activity was associated with the IP address `202.183.149.174`. Such unexpected behavior may result from extraneous code injected into a legitimate process, or from a malicious executable masquerading as a legitimate one by name.'
    question: 'Roughly a second before this alert, a related ''Suspicious process injection observed'' alert fired, where a process abnormally injected code into another process, which then reached out to an external web resource. What is the full URL that was contacted in that injection alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process named `notepad.exe` ran with no command line arguments and exhibited unexpected behavior, indicating that malicious code was likely injected into the legitimate process or that a malicious executable was masquerading under that name.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The abnormally injected process then performed suspicious network activity, connecting out to the URL `https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt`, consistent with command and control communication from the injected code.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
