tasks:
- task_id: incident_34_latest_cleaned_train_set_task_26
  title: incident_34_latest_cleaned_train_set_task_26
  description: 'For the follow-up alert about PowerShell dropping and executing a suspicious file on that machine, what is the name of the dropped file?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert fired on host `vnevado-win10e` (AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`) for user account `samuelf` (SID `S-1-5-21-1870156660-7534030218-135086563-1193`), indicating that a suspicious process executed a `powershell.exe` command. PowerShell is often abused by attackers to bypass security protections by running payloads in memory without touching disk. Seconds later, a related alert reported that PowerShell dropped a suspicious file onto the same machine and executed it.'
    question: 'For the follow-up alert about PowerShell dropping and executing a suspicious file on that machine, what is the name of the dropped file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious process `winatp-intro-backdoor.exe` executed a PowerShell command on the machine at 2024-07-04 22:35:00 UTC (alert: ''Suspicious process executed PowerShell command''), indicating an attempt to run payloads in memory and bypass security protections.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'PowerShell then dropped and executed a suspicious file with Name `winatp-intro-backdoor.exe` on the machine at 2024-07-04 22:35:03 UTC (alert: ''Powershell dropped a suspicious file on the machine''), confirming the backdoor file as the dropped malicious artifact.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
