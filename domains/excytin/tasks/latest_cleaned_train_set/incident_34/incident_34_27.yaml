tasks:
- task_id: incident_34_latest_cleaned_train_set_task_27
  title: incident_34_latest_cleaned_train_set_task_27
  description: 'For the related ''Anomaly detected in ASEP registry'' alert, what IP address was recorded as an entity involved in that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an anomalous scheduled task was created on a device: a `powershell.exe` process (PID 8604) ran a heavily obfuscated command that reassembled a base64 blob, wrote `winatp-intro-backdoor.exe` to the user''s desktop, and then launched `schtasks.exe` (PID 1348) to register a scheduled task named ''yrei'' pointing to that backdoor. Roughly at the same time, a related alert fired for an anomaly detected in the ASEP registry, where a process registered a suspicious command or file in an autostart extensibility point registry key so it would run after a reboot.'
    question: 'For the related ''Anomaly detected in ASEP registry'' alert, what IP address was recorded as an entity involved in that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An anomalous scheduled task was created for persistence on the device with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On the same device, a process registered a suspicious command or file in an ASEP registry key to run after reboot, with associated IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
