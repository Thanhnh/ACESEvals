tasks:
- task_id: incident_34_latest_cleaned_train_set_task_5
  title: incident_34_latest_cleaned_train_set_task_5
  description: 'For the alert about the anomalous scheduled task creation, what was the process ID of the process that created the task, and what full command line (including the task name and the full path of the executable it was set to run) was used?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident involving execution and persistence activity, an alert for "Suspicious PowerShell download or encoded command execution" fired on host `vnevado-win10e`. A `powershell.exe` process (PID 8604, created 2024-06-26T12:00:39Z) was run with an execution-bypass policy and a large base64 blob that was decoded and written to disk as `winatp-intro-backdoor.exe` on the user''s Desktop. Shortly afterwards, a related alert reported that an anomalous scheduled task was created on the same device, which an attacker may use to obtain persistence.'
    question: 'For the alert about the anomalous scheduled task creation, what was the process ID of the process that created the task, and what full command line (including the task name and the full path of the executable it was set to run) was used?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID 1348 (created 2024-06-26T12:00:40.0878355Z), command line: `"schtasks.exe" /create /sc once /tn yrei /tr "c:\users\samuelf\onedrive - (new) alpineskihouse\desktop\winatp-intro-backdoor.exe" /st 11:58 /f`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID 1348 (created 2024-06-26T12:00:40.0878355Z), command line: `"schtasks.exe" /create /sc once /tn yrei /tr "c:\users\samuelf\onedrive - (new) alpineskihouse\desktop\winatp-intro-backdoor.exe" /st 11:58 /f`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'On host `vnevado-win10e`, a process executed PowerShell to download a file or run an encoded command, indicating an attempt to fetch an external payload or run commands in memory.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On the same device, an anomalous scheduled task was created for persistence: the process with Process ID `1348` ran the command line `"schtasks.exe" /create /sc once /tn yrei /tr "c:\users\samuelf\onedrive - (new) alpineskihouse\desktop\winatp-intro-backdoor.exe" /st 11:58 /f` at `2024-06-26t12:00:40.0878355z`, scheduling the backdoor executable to launch.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
