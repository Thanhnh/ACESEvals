tasks:
- task_id: incident_34_latest_cleaned_train_set_task_21
  title: incident_34_latest_cleaned_train_set_task_21
  description: 'For the follow-on ASEP registry persistence alert, what IP address was recorded as an entity in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery on an endpoint, an alert fired for a suspicious process executing a PowerShell command. The process (PID 8604, created 2024-06-26T12:00:39Z) ran `powershell.exe` with a hidden window and bypassed execution policy, reassembling a large base64 blob into a binary named `winatp-intro-backdoor.exe` on the user''s Desktop, then creating and running a scheduled task named ''yrei'' to launch it. Moments later, a related alert was raised: ''Anomaly detected in ASEP registry'', indicating a process registered a suspicious command or file in an ASEP (Auto-Start Extensibility Point) registry key so it would run after reboot — a common persistence technique.'
    question: 'For the follow-on ASEP registry persistence alert, what IP address was recorded as an entity in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious process executed a PowerShell command on host `vnevado-win10e`, potentially executing a payload in memory to bypass security protections.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the PowerShell execution, a process registered a suspicious command in an ASEP registry key for persistence, associated with the IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
