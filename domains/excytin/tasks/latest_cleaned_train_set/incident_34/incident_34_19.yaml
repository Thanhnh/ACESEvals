tasks:
- task_id: incident_34_latest_cleaned_train_set_task_19
  title: incident_34_latest_cleaned_train_set_task_19
  description: 'Related to this incident, a suspicious PowerShell command line activity was also observed on the same machine around the same time. What is the name of the executable file involved in that PowerShell alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, an alert was raised for an anomaly detected in an ASEP registry key, where a process registered a suspicious command or file that would be run after a reboot — a common persistence technique used by attackers to avoid losing access when a machine is turned off. This activity was associated with the IP address `72.5.72.208`.'
    question: 'Related to this incident, a suspicious PowerShell command line activity was also observed on the same machine around the same time. What is the name of the executable file involved in that PowerShell alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-1870156660-7534030218-135086563-1193` was used to register a suspicious command in an ASEP registry key, establishing persistence after reboot.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Under that account, a suspicious PowerShell command line was executed on the machine, which dropped and ran the malicious payload file `winatp-intro-backdoor.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
