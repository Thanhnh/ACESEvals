tasks:
- task_id: incident_34_latest_cleaned_train_set_task_6
  title: incident_34_latest_cleaned_train_set_task_6
  description: 'Shortly before this PowerShell activity was flagged, an Automated investigation was manually initiated by u141(u141@ash.alpineskihouse.co) on the affected machine. What is the host name of the device that this Automated investigation targeted?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery, an alert titled "Suspicious process executed PowerShell command" was raised. The activity was attributed to the account `samuelf` (SID `S-1-5-21-1870156660-7534030218-135086563-1193`, AAD User ID `16320fec-8d90-403b-b7fe-78f715d4728d`), where `powershell.exe` (Process ID 8604) was launched with a heavily obfuscated command line that reassembled a base64 blob, wrote it to disk as `winatp-intro-backdoor.exe` on the user''s desktop, and then created and ran a scheduled task named ''yrei'' for persistence.'
    question: 'Shortly before this PowerShell activity was flagged, an Automated investigation was manually initiated by u141(u141@ash.alpineskihouse.co) on the affected machine. What is the host name of the device that this Automated investigation targeted?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10e (fully qualified: vnevado-win10e.vnevado.alpineskihouse.co)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10e (fully qualified: vnevado-win10e.vnevado.alpineskihouse.co)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious process executed a PowerShell command on the host with HostName `vnevado-win10e`, likely to run a payload in memory and bypass security protections.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'In response, the user u141 (u141@ash.alpineskihouse.co) manually started an Automated investigation on the same host, HostName `vnevado-win10e` (vnevado-win10e.vnevado.alpineskihouse.co), to identify and review the threat artifacts for possible remediation.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
