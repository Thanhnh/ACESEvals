tasks:
- task_id: incident_34_latest_cleaned_train_set_task_2
  title: incident_34_latest_cleaned_train_set_task_2
  description: 'For the related alert about the anomalous scheduled task creation, which executable (file name) was used to create the scheduled task?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident involving Execution & Discovery on one endpoint, an alert for ''Suspicious PowerShell download or encoded command execution'' was raised after the process `winword.exe` (Process ID 9780, created 2024-06-26T11:57:20.2959493Z) launched the macro-enabled document with the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`. PowerShell is often used by attackers to bypass security protections by executing payloads in memory without touching the disk. Just before this alert, another alert fired on the same device and under the same user account (SID), reporting that an anomalous scheduled task was created — a common technique for gaining persistence.'
    question: 'For the related alert about the anomalous scheduled task creation, which executable (file name) was used to create the scheduled task?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'schtasks.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'schtasks.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-1870156660-7534030218-135086563-1193` executed a suspicious PowerShell command to download a file or run an encoded command.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker then created an anomalous scheduled task for persistence using the process `schtasks.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
