tasks:
- task_id: incident_34_latest_cleaned_train_set_task_30
  title: incident_34_latest_cleaned_train_set_task_30
  description: 'Shortly after this registry modification, another persistence attempt was flagged on the same device where an anomalous scheduled task was created. What was the name of the executable file used to create that scheduled task?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, an anomaly was detected in an ASEP registry key: a process (PID 10208, created 2024-06-26T13:17:18.8268389Z) ran the command `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe`, with associated IP address `72.5.72.208`. This registry entry would cause the referenced executable to run after a reboot, indicating an attempt at persistence.'
    question: 'Shortly after this registry modification, another persistence attempt was flagged on the same device where an anomalous scheduled task was created. What was the name of the executable file used to create that scheduled task?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An anomaly was detected in the ASEP registry on host `vnevado-win10e`, where a process registered a suspicious command or file in an auto-start extensibility point registry key to persist after reboot.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same host, an anomalous scheduled task was created for persistence using the process `powershell.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
