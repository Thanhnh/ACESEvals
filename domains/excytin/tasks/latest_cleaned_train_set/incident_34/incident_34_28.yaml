tasks:
- task_id: incident_34_latest_cleaned_train_set_task_28
  title: incident_34_latest_cleaned_train_set_task_28
  description: 'Roughly one second earlier, a related alert titled ''Suspicious PowerShell command line'' was triggered on the same machine. What is the name of the file referenced in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this incident, an alert for "Suspicious PowerShell download or encoded command execution" was raised on host `vnevado-win10e` (AAD device ID `02b8f519-1123-4228-b32a-ccb78af3449f`) for the account `samuelf` (SID `S-1-5-21-1870156660-7534030218-135086563-1193`). A process executed PowerShell to download a file or run an encoded command, a technique attackers commonly use to bypass security protections by running payloads in memory.'
    question: 'Roughly one second earlier, a related alert titled ''Suspicious PowerShell command line'' was triggered on the same machine. What is the name of the file referenced in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process executed `powershell.exe` to download a file or run an encoded command, indicating suspicious PowerShell download or encoded command execution.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The suspicious PowerShell command line activity resulted in the file `winatp-intro-backdoor.exe` being dropped/executed on the device.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
