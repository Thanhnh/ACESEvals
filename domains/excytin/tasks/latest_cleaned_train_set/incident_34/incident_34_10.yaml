tasks:
- task_id: incident_34_latest_cleaned_train_set_task_10
  title: incident_34_latest_cleaned_train_set_task_10
  description: 'A closely related alert, ''Suspicious Task Scheduler activity'', was raised moments later where a process previously involved in malicious activity used Task Scheduler again. What was the process ID, creation time, and full command line of that follow-up schtasks.exe execution?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on host `vnevado-win10e`, an alert fired for an anomalous scheduled task being created, which attackers often use to gain persistence on a device. The activity was tied to the account `samuelf` (SID S-1-5-21-1870156660-7534030218-135086563-1193), where `powershell.exe` decoded and wrote a binary named `winatp-intro-backdoor.exe` to the user''s desktop and then invoked `"schtasks.exe" /create /sc once /tn yrei /tr "c:\users\samuelf\onedrive - (new) alpineskihouse\desktop\winatp-intro-backdoor.exe" /st 11:58 /f` (PID 1348, created 2024-06-26T12:00:40.0878355Z).'
    question: 'A closely related alert, ''Suspicious Task Scheduler activity'', was raised moments later where a process previously involved in malicious activity used Task Scheduler again. What was the process ID, creation time, and full command line of that follow-up schtasks.exe execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 1616, Created time (UTC): 2024-06-26T12:00:40.6793914Z, Command line: `"schtasks.exe" /run /tn yrei`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 1616, Created time (UTC): 2024-06-26T12:00:40.6793914Z, Command line: `"schtasks.exe" /run /tn yrei`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An anomalous scheduled task was created on the device using the process `schtasks.exe`, likely for attacker persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A process previously involved in malicious activity used Task Scheduler again — running `"schtasks.exe" /run /tn yrei` with Process ID `1616` at `2024-06-26t12:00:40.6793914z` — to launch the malicious task and establish persistence.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
