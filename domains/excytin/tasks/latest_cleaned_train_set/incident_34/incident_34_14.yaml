tasks:
- task_id: incident_34_latest_cleaned_train_set_task_14
  title: incident_34_latest_cleaned_train_set_task_14
  description: 'A related alert in the same incident flagged a suspicious LDAP query indicating reconnaissance activity. Which process (file name, process ID, and full command line) was responsible for that LDAP reconnaissance activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery on an endpoint, an anomaly was detected in the ASEP registry: a process ran `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe` (Process ID 10208), registering `winatp-intro-backdoor.exe` for persistence after reboot. The activity was also associated with the IP address `72.5.72.208`.'
    question: 'A related alert in the same incident flagged a suspicious LDAP query indicating reconnaissance activity. Which process (file name, process ID, and full command line) was responsible for that LDAP reconnaissance activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The process was `winword.exe` with Process ID 9780, created at 2024-06-26T11:57:20.2959493Z, with command line: `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The process was `winword.exe` with Process ID 9780, created at 2024-06-26T11:57:20.2959493Z, with command line: `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d` had a process register a suspicious command in an ASEP registry key for persistence after reboot.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same compromised context then executed a suspicious LDAP reconnaissance query, originating from the process `winword.exe` running the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm` with Process ID `9780`, created at `2024-06-26t11:57:20.2959493z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
