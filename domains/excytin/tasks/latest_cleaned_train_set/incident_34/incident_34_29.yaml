tasks:
- task_id: incident_34_latest_cleaned_train_set_task_29
  title: incident_34_latest_cleaned_train_set_task_29
  description: 'For the follow-up ''Suspicious LDAP query'' alert on that same device, which process image (file name) was responsible for issuing the suspicious LDAP query?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident on an endpoint, a "Suspicious Task Scheduler activity" alert fired after a PowerShell command line (PID 8604) decoded a base64 blob, wrote `winatp-intro-backdoor.exe` to the desktop of user samuelf, and then used `schtasks.exe` to create and immediately run a scheduled task named "yrei" for persistence. Shortly afterwards, on the same device, a "Suspicious LDAP query" alert was raised, indicating potential Active Directory reconnaissance where an attacker queries the domain controller for administrative users, groups and interesting assets.'
    question: 'For the follow-up ''Suspicious LDAP query'' alert on that same device, which process image (file name) was responsible for issuing the suspicious LDAP query?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winword.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winword.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process on the device with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f` used Task Scheduler to create, modify, or delete a scheduled task in an attempt to establish persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The process `winword.exe` on that device executed a suspicious LDAP query against the domain controller, indicating reconnaissance activity to discover administrative users, groups, and assets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
