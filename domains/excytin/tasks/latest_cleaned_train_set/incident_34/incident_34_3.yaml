tasks:
- task_id: incident_34_latest_cleaned_train_set_task_3
  title: incident_34_latest_cleaned_train_set_task_3
  description: 'For the follow-up Task Scheduler alert, what was the process ID, creation time, and full command line of the process that triggered the scheduled task?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident on host `vnevado-win10e` (AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`), the account `samuelf` (SID `S-1-5-21-1870156660-7534030218-135086563-1193`) was seen running a suspicious PowerShell command (`powershell.exe`, PID 8604) that decoded a base64 blob, wrote `winatp-intro-backdoor.exe` to the desktop, and then registered a scheduled task named `yrei` for persistence. A follow-up alert for ''Suspicious Task Scheduler activity'' was raised about a second later.'
    question: 'For the follow-up Task Scheduler alert, what was the process ID, creation time, and full command line of the process that triggered the scheduled task?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 1616, Created Time (UTC): 2024-06-26T12:00:40.6793914Z, Command line: "schtasks.exe" /run /tn yrei'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 1616, Created Time (UTC): 2024-06-26T12:00:40.6793914Z, Command line: "schtasks.exe" /run /tn yrei'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious process executed a PowerShell command under the user account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d`, likely to run a payload in memory and evade detection.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same activity chain then abused Task Scheduler for persistence: the process with Process ID `1616` ran the command line `"schtasks.exe" /run /tn yrei` at `2024-06-26t12:00:40.6793914z`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
