tasks:
- task_id: incident_34_latest_cleaned_train_set_task_4
  title: incident_34_latest_cleaned_train_set_task_4
  description: 'Around the same time, an alert fired for a suspicious process that executed a PowerShell command in an attempt to run a payload in memory. What is the file name of that suspicious process?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery on one endpoint, a suspicious LDAP query was executed, indicating potential reconnaissance activity against the domain controller. The activity chain on the affected device involved `winword.exe` being launched with the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm` (Process ID 9780, created at 2024-06-26T11:57:20.2959493Z), suggesting a malicious macro-enabled document was opened.'
    question: 'Around the same time, an alert fired for a suspicious process that executed a PowerShell command in an attempt to run a payload in memory. What is the file name of that suspicious process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `samuelf` executed a suspicious LDAP query against the domain controller, indicating reconnaissance of the organization''s users, groups, and assets.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following this activity, a suspicious process with file name `winatp-intro-backdoor.exe` was observed executing PowerShell commands, likely to run a payload in memory and bypass security protections.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
