tasks:
- task_id: incident_34_latest_cleaned_train_set_task_32
  title: incident_34_latest_cleaned_train_set_task_32
  description: 'For the alert about the anomaly detected in the ASEP registry key, what IP address was observed as an entity involved in that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident, a suspicious LDAP query indicating reconnaissance activity was detected after `winword.exe` was launched with the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm` (Process ID 9780, created 2024-06-26T11:57:20.2959493Z). This LDAP activity is linked to a related alert where a process registered a suspicious command or file in an ASEP (Auto-Start Extensibility Point) registry key, so it would run after a reboot — a common persistence technique.'
    question: 'For the alert about the anomaly detected in the ASEP registry key, what IP address was observed as an entity involved in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `samuelf` executed a suspicious LDAP query against the domain controller, indicating reconnaissance activity to map out the organization''s users, groups, and assets.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Following the reconnaissance, an anomaly was detected in an ASEP registry key, where a process registered a suspicious command or file for persistence after reboot, associated with the IP address `72.5.72.208`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
