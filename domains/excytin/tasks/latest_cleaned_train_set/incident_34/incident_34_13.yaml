tasks:
- task_id: incident_34_latest_cleaned_train_set_task_13
  title: incident_34_latest_cleaned_train_set_task_13
  description: 'Shortly before the LDAP reconnaissance, an alert fired for a process that used PowerShell to download a file or run an encoded command. What is the name of the executable file associated with that PowerShell download/encoded command execution alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a multi-stage incident involving Execution & Discovery on an endpoint, a suspicious LDAP query was executed indicating potential reconnaissance activity against the domain controller. This activity was linked to earlier execution on the device, where the process `winword.exe` was launched with the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm` (Process ID 9780, created 2024-06-26T11:57:20Z).'
    question: 'Shortly before the LDAP reconnaissance, an alert fired for a process that used PowerShell to download a file or run an encoded command. What is the name of the executable file associated with that PowerShell download/encoded command execution alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The account `samuelf` executed a suspicious LDAP query against the domain controller, indicating reconnaissance of the organization''s users, groups, and assets.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Using the same context, a process executed PowerShell to download a file or run an encoded command, resulting in the extracted file `winatp-intro-backdoor.exe`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
