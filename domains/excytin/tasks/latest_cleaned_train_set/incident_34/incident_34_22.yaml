tasks:
- task_id: incident_34_latest_cleaned_train_set_task_22
  title: incident_34_latest_cleaned_train_set_task_22
  description: 'For the alert about the anomalous scheduled task creation, which executable was used to spawn the task-creating process, and what were its process ID and creation time?'
  inherit_shared: true
  initial_context:
    incident_context: 'During this multi-stage incident, an alert fired for an uncommon file that was created on the device and then registered under a Run Key so it would execute after a reboot. The observed command line was `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe` (Process ID 10208, created 2024-06-26T13:17:18.8268389Z), and the activity was associated with the IP address `72.5.72.208`. A related alert on the same device reported that an anomalous scheduled task was created, which an attacker may use to obtain persistence.'
    question: 'For the alert about the anomalous scheduled task creation, which executable was used to spawn the task-creating process, and what were its process ID and creation time?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The task was created by `powershell.exe` (launched with a large base64-encoded payload that wrote winatp-intro-backdoor.exe to the desktop and used schtasks to create/run the task), Process ID 8604, created at 2024-06-26T12:00:39.2886108Z.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The task was created by `powershell.exe` (launched with a large base64-encoded payload that wrote winatp-intro-backdoor.exe to the desktop and used schtasks to create/run the task), Process ID 8604, created at 2024-06-26T12:00:39.2886108Z.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d` was involved in an alert where an uncommon file was created on the machine and then added to a Registry Run Key for persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On the same device, an anomalous scheduled task was created by the process with Process ID `8604`, created at `2024-06-26t12:00:39.2886108z`, running the command line `"powershell.exe" -w movedn -exec bypass -command cd /;$filebase64prefix = '''';... $filename= ''winatp-intro-backdoor.exe'';$desktop=[environment]::getfolderpath(''desktop'');$fullpath = join-path $desktop $filename;[io.file]::writeallbytes($fullpath,$file);copy $fullpath $desktop;schtasks /create /sc once /tn yrei /tr $fullpath /st (get-date).addminutes(-2).tostring(''hh:mm'') /f;$settings = new-scheduledtasksettingsset -allowstartifonbatteries -dontstopifgoingonbatteries;set-scheduledtask -taskname ''yrei'' -settings $settings;schtasks /run /tn yrei`, which decoded a base64 payload into `winatp-intro-backdoor.exe` on the desktop and registered/ran it as the scheduled task `yrei` for persistence.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
