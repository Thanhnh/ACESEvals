tasks:
- task_id: incident_34_latest_cleaned_train_set_task_7
  title: incident_34_latest_cleaned_train_set_task_7
  description: 'For the machine involved in this persistence alert, what is its Microsoft Entra ID (Azure AD) device identifier?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery on an endpoint, an alert titled "An uncommon file was created and added to a Run Key" was raised. On host `vnevado-win10e`, the account `samuelf` (SID `S-1-5-21-1870156660-7534030218-135086563-1193`, Entra ID user ID `16320fec-8d90-403b-b7fe-78f715d4728d`) was seen with IP `72.5.72.208`, and the process (PID 10208, created 2024-06-26T13:17:18Z) ran the command line `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe`, establishing persistence for the uncommon file `winatp-intro-backdoor.exe`.'
    question: 'For the machine involved in this persistence alert, what is its Microsoft Entra ID (Azure AD) device identifier?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The Azure AD Device ID of host `vnevado-win10e` is `02b8f519-1123-4228-b32a-ccb78af3449f`.'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The Azure AD Device ID of host `vnevado-win10e` is `02b8f519-1123-4228-b32a-ccb78af3449f`.'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An uncommon file was created on the machine and then added to a Registry Run Key for persistence, so it will execute after a reboot.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'This suspicious file creation and Run Key persistence activity was observed on the host with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
