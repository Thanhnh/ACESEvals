tasks:
- task_id: incident_34_latest_cleaned_train_set_task_8
  title: incident_34_latest_cleaned_train_set_task_8
  description: 'For the related ''Suspicious LDAP query'' alert, which process initiated the activity — provide the process ID, its creation time, and the full command line?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery on an endpoint, an alert fired for ''Suspicious process executed PowerShell command''. The PowerShell process (PID 8604, created 2024-06-26T12:00:39Z) was launched with `-w movedn -exec bypass` and built a large base64 blob that was decoded and written to the user''s desktop as `winatp-intro-backdoor.exe`, then persisted via a scheduled task named ''yrei''. A related alert in the same incident, ''Suspicious LDAP query'', indicates reconnaissance activity against the domain controller to enumerate administrative users, groups and interesting assets.'
    question: 'For the related ''Suspicious LDAP query'' alert, which process initiated the activity — provide the process ID, its creation time, and the full command line?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 9780, Created Time (UTC): 2024-06-26T11:57:20.2959493Z, Command Line: "winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 9780, Created Time (UTC): 2024-06-26T11:57:20.2959493Z, Command Line: "winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious process executed a PowerShell command under the user account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The same activity chain generated a suspicious LDAP query used for domain reconnaissance.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The LDAP reconnaissance was traced back to the process `winword.exe` with Process ID `9780`, created at `2024-06-26t11:57:20.2959493z`, running the command line `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
