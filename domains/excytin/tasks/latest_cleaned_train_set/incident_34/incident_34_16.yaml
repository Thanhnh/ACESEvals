tasks:
- task_id: incident_34_latest_cleaned_train_set_task_16
  title: incident_34_latest_cleaned_train_set_task_16
  description: 'For the related alert about the suspicious download or encoded command execution, what is the name of the executable file of the process that performed this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled ''Anomaly detected in ASEP registry'' was raised after a process registered a suspicious command in an auto-start extensibility point registry key. The command line observed was `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe` (Process ID 10208, created 2024-06-26T13:17:18.8268389Z), and the activity was associated with the IP address `72.5.72.208`. Seconds later, a related alert fired for a process that executed a download or an encoded command in order to run a payload in memory without touching disk.'
    question: 'For the related alert about the suspicious download or encoded command execution, what is the name of the executable file of the process that performed this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process registered a suspicious command in an ASEP registry key for persistence, associated with the user account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same activity chain involved a suspicious download or encoded command execution performed by the process `powershell.exe` (ExtractedFileName: `powershell.exe`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
