tasks:
- task_id: incident_34_latest_cleaned_train_set_task_34
  title: incident_34_latest_cleaned_train_set_task_34
  description: 'Roughly one second before this ASEP registry alert, an analyst (u141@ash.alpineskihouse.co) manually triggered an Automated investigation on the affected machine. What is the host name of the device on which that Automated investigation was started?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident involving execution and persistence activity, an alert titled "Anomaly detected in ASEP registry" fired at 2024-07-04 22:35:01 UTC. The account `samuelf` (SID `S-1-5-21-1870156660-7534030218-135086563-1193`, Entra ID `16320fec-8d90-403b-b7fe-78f715d4728d`) was associated with process ID 10208 running the command line `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe`, which sets the backdoor `winatp-intro-backdoor.exe` to run after a reboot. The IP address `72.5.72.208` was also seen in this activity.'
    question: 'Roughly one second before this ASEP registry alert, an analyst (u141@ash.alpineskihouse.co) manually triggered an Automated investigation on the affected machine. What is the host name of the device on which that Automated investigation was started?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10e (fully qualified: vnevado-win10e.vnevado.alpineskihouse.co)'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10e (fully qualified: vnevado-win10e.vnevado.alpineskihouse.co)'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process registered a suspicious command or file in an ASEP registry key (persistence via run-after-reboot) on the device with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'In response, the user u141 (u141@ash.alpineskihouse.co) manually started an Automated investigation to identify and review the threat artifacts on the affected host with HostName `vnevado-win10e` (vnevado-win10e.vnevado.alpineskihouse.co).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
