tasks:
- task_id: incident_34_latest_cleaned_train_set_task_25
  title: incident_34_latest_cleaned_train_set_task_25
  description: 'Shortly after this Task Scheduler activity, a related alert reported that PowerShell dropped a suspicious file on the machine and executed it. What is the name of that dropped file?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery on an endpoint, an alert for ''Suspicious Task Scheduler activity'' was raised when `schtasks.exe` (Process ID 1616) was launched with the command line `"schtasks.exe" /run /tn yrei`, indicating a process involved in earlier malicious activity used Task Scheduler to run a task and potentially establish persistence.'
    question: 'Shortly after this Task Scheduler activity, a related alert reported that PowerShell dropped a suspicious file on the machine and executed it. What is the name of that dropped file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process previously involved in malicious activity used Task Scheduler via `powershell.exe` to create, modify, or delete a scheduled task, establishing persistence (Type: process, Field: ExtractedFileName, Value: `powershell.exe`) at 2024-07-04 22:35:01.761898+00:00.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'That same PowerShell process then dropped and executed a suspicious file named `winatp-intro-backdoor.exe` on the machine (Type: file, Field: Name, Value: `winatp-intro-backdoor.exe`) at 2024-07-04 22:35:03.736539+00:00.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
