tasks:
- task_id: incident_34_latest_cleaned_train_set_task_18
  title: incident_34_latest_cleaned_train_set_task_18
  description: 'Moments later on the same host, another persistence attempt was flagged involving suspicious Task Scheduler activity used to create, modify, or delete a scheduled task. What is the name of the executable file that performed this scheduled task activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an anomaly was detected in an ASEP registry key on an endpoint, where a process (PID 10208, created 2024-06-26T13:17:18.8268389Z) ran the command `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe`, associated with IP address `72.5.72.208`. This registry modification would cause the referenced file to run after a reboot, a common persistence technique.'
    question: 'Moments later on the same host, another persistence attempt was flagged involving suspicious Task Scheduler activity used to create, modify, or delete a scheduled task. What is the name of the executable file that performed this scheduled task activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'schtasks.exe'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'schtasks.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'On host `vnevado-win10e`, a process registered a suspicious command or file in an ASEP registry key to persist after reboot.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The process `schtasks.exe` was then used to create, modify, or delete a scheduled task, establishing persistence and automatically launching malicious code.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
