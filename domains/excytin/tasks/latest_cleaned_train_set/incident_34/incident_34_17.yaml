tasks:
- task_id: incident_34_latest_cleaned_train_set_task_17
  title: incident_34_latest_cleaned_train_set_task_17
  description: 'Shortly before this PowerShell activity was flagged, an analyst (u141@ash.alpineskihouse.co) manually kicked off an Automated investigation to review threat artifacts for possible remediation. Which device was that Automated investigation started on?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a multi-stage incident involving Execution & Discovery, the account `samuelf` (SID `S-1-5-21-1870156660-7534030218-135086563-1193`, Entra ID `16320fec-8d90-403b-b7fe-78f715d4728d`) was observed running `powershell.exe` (Process ID 8604, created 2024-06-26T12:00:39Z) with a window-hidden, execution-policy-bypass command line that reassembled a large base64 blob, wrote it to the desktop as `winatp-intro-backdoor.exe`, and then created and ran a scheduled task named ''yrei'' to launch it. This behavior was flagged as ''Suspicious PowerShell download or encoded command execution'', since attackers often use PowerShell to execute payloads in memory or pull down external files.'
    question: 'Shortly before this PowerShell activity was flagged, an analyst (u141@ash.alpineskihouse.co) manually kicked off an Automated investigation to review threat artifacts for possible remediation. Which device was that Automated investigation started on?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'The Automated investigation was manually started on the host `vnevado-win10e` (FQDN: vnevado-win10e.vnevado.alpineskihouse.co).'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'The Automated investigation was manually started on the host `vnevado-win10e` (FQDN: vnevado-win10e.vnevado.alpineskihouse.co).'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process on host `vnevado-win10e` executed PowerShell to download a file or run an encoded command, indicating a possible attempt to bypass security protections and retrieve external payloads.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'In response, user `u141(u141@ash.alpineskihouse.co)` manually initiated an Automated investigation on the same host `vnevado-win10e` (vnevado-win10e.vnevado.alpineskihouse.co) to identify and review threat artifacts for possible remediation.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
