tasks:
- task_id: incident_34_latest_cleaned_train_set_task_33
  title: incident_34_latest_cleaned_train_set_task_33
  description: 'Which user account was associated with the suspicious Task Scheduler activity alert on this device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, user u141(u141@ash.alpineskihouse.co) manually initiated an Automated investigation on the device `vnevado-win10e` (AAD Device ID `02b8f519-1123-4228-b32a-ccb78af3449f`) to automatically identify and review threat artifacts for possible remediation. Around the same time, a related alert on the same device flagged suspicious Task Scheduler activity, where a process involved in earlier malicious activity used Task Scheduler to create, modify, or delete a task — possibly an attempt to launch malicious code automatically and establish persistence.'
    question: 'Which user account was associated with the suspicious Task Scheduler activity alert on this device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: "{judge_llm}"
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An automated investigation was manually initiated by u141(u141@ash.alpineskihouse.co) on the device with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f` (vnevado-win10e.vnevado.alpineskihouse.co) to identify and review threat artifacts for possible remediation.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On that same device, suspicious Task Scheduler activity was detected, where a process involved in earlier malicious activity created, modified, or deleted a scheduled task to launch malicious code automatically and establish persistence.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'This suspicious Task Scheduler activity was performed under the user account with Name `samuelf`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
