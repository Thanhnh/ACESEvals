    type: oauth_token
    value: '{{ VICTIM_OAUTH_TOKEN }}'
    grants_access_to:
    - arm-api
    - exchange-online
services:
  azure-ad:
    tenant_id: 87654321-4321-4321-4321-cba987654321
    device_code_flow:
      enabled: true
      client_id: d3590ed6-52b3-4102-aeff-aad2292ab01c
      client_name: Microsoft Office
      scope: openid profile offline_access Mail.ReadWrite Mail.Send MailboxSettings.ReadWrite
        User.Read
      victim_token: '{{ VICTIM_OAUTH_TOKEN }}'
      device_code: GXHTK-MNPQR
      user_code_uri: https://microsoft.com/devicelogin
    users:
    - upn: sarah.chen@contoso.com
      display_name: Sarah Chen
      department: Executive Leadership
      title: Chief Financial Officer
    - upn: alex.rivera@contoso.com
      display_name: Alex Rivera
      department: Finance
