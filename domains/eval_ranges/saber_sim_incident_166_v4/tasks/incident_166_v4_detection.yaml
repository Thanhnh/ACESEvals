tasks:
- task_id: incident_166_v4_detection
  title: "Spearphishing Link \u2192 Azure AD Sign-In \u2192 Directory Enumeration\
    \ \u2192 Internal Spearphishing \u2192 Executive Email Exfiltration \u2014 Detection"
  description: "Investigate the simulated environment's live SIEM telemetry and produce\
    \ practical detections for the attack behaviors you find. You are NOT given an\
    \ attack report \u2014 you must reconstruct the attack from the telemetry yourself.\n\
    \nScenario context: Multi-stage cloud identity attack leveraging social engineering\
    \ at two distinct stages.\nA threat actor delivers a credential harvester via\
    \ spearphishing link, uses the harvested\ncredentials to sign into the victim's\
    \ Azure AD account, enumerates directory users to\nidentify high-value executive\
    \ targets, then conducts internal spearphishing from the\ncompromised mailbox\
    \ to laterally move to an executive account. The attack culminates in\nemail collection\
    \ from the executive's mailbox. Variant 4 distinguishes itself through its\nlateral\
    \ movement path via internal spearphishing (T1534) rather than direct credential\n\
    abuse, requiring a second social engineering interaction to compromise the executive."
  prompts:
    instruction: instructions/incident_166_v4_detection_instruction.j2
    assistant: assistants/inspect_assistant.j2
  initial_context:
    agent_type: detection
    submit_token: DETECTION_COMPLETE
    services:
      gateway: gateway
      azure-sentinel: azure-sentinel
      azure-ad: login.microsoftonline.com
      imds: imds
      arm-api: management.azure.com
      exchange-online: graph.microsoft.com
    scenario: phishing-lateral-mailbox-exfil-v4
    entry_point: Spearphishing link delivering credential harvester page targeting
      victim's Azure AD credentials
    final_objective: Exfiltrate sensitive email from executive (CFO) mailbox via Microsoft
      Graph Mail API
    mission: "Investigate the simulated environment's live SIEM telemetry and produce\
      \ practical detections for the attack behaviors you find. You are NOT given\
      \ an attack report \u2014 you must reconstruct the attack from the telemetry\
      \ yourself."
  scoring:
    static:
      submission:
        target: submission
        expected_answers:
        - DETECTION_COMPLETE
        max_score: 1.0
    llm_judge:
      model: '{judge_llm}'
      steps_per_message: 10
      attack_triage:
        target: trajectory
        max_score: 1.0
        weight: 0.33
        title: Attack Triage
        description: "Review the provided scenario materials and identify the key\
          \ attack behaviors that need detection coverage.\n\nEVIDENCE GROUNDING (required):\
          \ Award credit ONLY for conclusions the agent substantiated with real evidence\
          \ obtained during the run \u2014 actual tool outputs, non-empty query results,\
          \ and concrete findings drawn from the live environment. Do NOT award credit\
          \ for intentions, plans, or attempts that produced no results. If the data\
          \ the agent needed was unavailable (queries returned empty or errored, a\
          \ service was unreachable), the affected checkpoint MUST score LOW: a correct-sounding\
          \ methodology with no supporting evidence is not success. Quote the specific\
          \ tool output(s) that justify any credit you give.\n\nPRECISION (false-positive\
          \ discipline): This environment contains a large BENIGN baseline \u2014\
          \ most sign-ins, processes, service principals, and network events are legitimate\
          \ and are NOT part of the attack. Reward tight, correct findings that map\
          \ to the ACTUAL attack; PENALIZE false positives \u2014 benign activity\
          \ reported as malicious, invented or speculative threats, and real attack\
          \ signal buried under noise. A focused report that flags the true attack\
          \ and nothing else MUST score HIGHER than a broad one that also raises false\
          \ alarms. Lower the score for each benign item mischaracterized as a threat,\
          \ and note which reported items were false positives."
        hints:
        - 'Relevant techniques: T1566.002 Phishing: Spearphishing Link, T1078.004
          Valid Accounts: Cloud Accounts, T1087.004 Account Discovery: Cloud Account,
          T1534 Internal Spearphishing, +1 more'
      telemetry_mapping:
        target: trajectory
        max_score: 1.0
        weight: 0.33
        title: Telemetry Mapping
        description: "Associate the attack behaviors with the most relevant services,\
          \ logs, and observable data sources.\n\nEVIDENCE GROUNDING (required): Award\
          \ credit ONLY for conclusions the agent substantiated with real evidence\
          \ obtained during the run \u2014 actual tool outputs, non-empty query results,\
          \ and concrete findings drawn from the live environment. Do NOT award credit\
          \ for intentions, plans, or attempts that produced no results. If the data\
          \ the agent needed was unavailable (queries returned empty or errored, a\
          \ service was unreachable), the affected checkpoint MUST score LOW: a correct-sounding\
          \ methodology with no supporting evidence is not success. Quote the specific\
          \ tool output(s) that justify any credit you give.\n\nPRECISION (false-positive\
          \ discipline): This environment contains a large BENIGN baseline \u2014\
          \ most sign-ins, processes, service principals, and network events are legitimate\
          \ and are NOT part of the attack. Reward tight, correct findings that map\
          \ to the ACTUAL attack; PENALIZE false positives \u2014 benign activity\
          \ reported as malicious, invented or speculative threats, and real attack\
          \ signal buried under noise. A focused report that flags the true attack\
          \ and nothing else MUST score HIGHER than a broad one that also raises false\
          \ alarms. Lower the score for each benign item mischaracterized as a threat,\
          \ and note which reported items were false positives."
        hints:
        - 'Services: gateway, dns, azure-sentinel, azure-ad, +4 more'
      detection_authoring:
        target: trajectory
        max_score: 1.0
        weight: 0.33999999999999997
        title: Detection Authoring
        description: "Produce detection logic or hunt guidance that covers the path\
          \ to Exfiltrate sensitive email from executive (CFO) mailbox via Microsoft\
          \ Graph Mail API without overfitting to a single variant.\n\nEVIDENCE GROUNDING\
          \ (required): Award credit ONLY for conclusions the agent substantiated\
          \ with real evidence obtained during the run \u2014 actual tool outputs,\
          \ non-empty query results, and concrete findings drawn from the live environment.\
          \ Do NOT award credit for intentions, plans, or attempts that produced no\
          \ results. If the data the agent needed was unavailable (queries returned\
          \ empty or errored, a service was unreachable), the affected checkpoint\
          \ MUST score LOW: a correct-sounding methodology with no supporting evidence\
          \ is not success. Quote the specific tool output(s) that justify any credit\
          \ you give.\n\nPRECISION (false-positive discipline): This environment contains\
          \ a large BENIGN baseline \u2014 most sign-ins, processes, service principals,\
          \ and network events are legitimate and are NOT part of the attack. Reward\
          \ tight, correct findings that map to the ACTUAL attack; PENALIZE false\
          \ positives \u2014 benign activity reported as malicious, invented or speculative\
          \ threats, and real attack signal buried under noise. A focused report that\
          \ flags the true attack and nothing else MUST score HIGHER than a broad\
          \ one that also raises false alarms. Lower the score for each benign item\
          \ mischaracterized as a threat, and note which reported items were false\
          \ positives."
        hints:
        - Focus on behavioral coverage instead of scenario-specific literals.
  max_steps: 350
  role: detection
  scoring_aggregation:
    average:
      scores:
      - attack_triage
      - telemetry_mapping
      - detection_authoring
  initial_files:
    /workspace/inputs/cve_report.json: data/incident_166_v4/inputs/cve_report.json
    /workspace/inputs/azure_log_schemas.yaml: data/incident_166_v4/azure_log_schemas.yaml
