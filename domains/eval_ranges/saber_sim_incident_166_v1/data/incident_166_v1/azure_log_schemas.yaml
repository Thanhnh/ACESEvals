threat_intel_indicators:
  description: |
    Threat intelligence indicators (IOCs) from Microsoft Defender Threat
    Intelligence and connected TI feeds. Each row is a STIX indicator with
    an observable (IP, domain, URL, file hash) plus confidence, validity
    window, and MITRE-tagged metadata. Used by detection/threat-intel agents
    to correlate environment telemetry against known-bad indicators.

  example: |
    {
      "Id": "TWljcm9zb2Z0IERlZmVuZGVyIFRocmVhdCBJbnRlbGxpZ2VuY2U=---indicator--00000000-0000-0000-6d40-0f39fab5a4d0",
      "ObservableKey": "network-traffic:src_ref.value",
      "ObservableValue": "198.51.100.247",
      "Pattern": "[network-traffic:src_ref.value = '198.51.100.247']",
      "Type": "ThreatIntelIndicators",
      "Confidence": 100,
      "IsActive": true,
      "IsDeleted": false,
      "Revoked": false,
      "ValidFrom": "2026-06-18T18:54:44.8308243Z",
      "ValidUntil": "2026-06-18T23:53:13.8428619Z",
      "Created": "2026-05-28T16:55:22.5639243Z",
      "Modified": "2026-06-18T18:54:44.8308243Z",
      "Tags": "honeypot,p:default,ic:100,vic:100",
      "AdditionalFields": "{\"TLPLevel\":\"Green\"}",
      "Data": "{\"pattern\":\"[network-traffic:src_ref.value = '198.51.100.247']\",\"indicator_types\":[\"Botnet\"],\"confidence\":100,\"type\":\"indicator\"}",
      "SourceSystem": "Microsoft Defender Threat Intelligence",
      "LastUpdateMethod": "BasicMDTIConnector",
      "TenantId": "87654321-4321-4321-4321-cba987654321",
      "AzureTenantId": "87654321-4321-4321-4321-cba987654321",
      "WorkspaceId": "87654321-4321-4321-4321-cba987654321",
      "TimeGenerated": "2026-06-18T19:15:09.1780000Z"
    }

  fields:
    - name: Id
      type: string
      description: "Unique indicator identifier (connector-prefixed STIX id)"
    - name: ObservableKey
      type: string
      description: "STIX observable path"
      values:
        - "network-traffic:src_ref.value"
        - "domain-name:value"
        - "url:value"
        - "file:hashes.MD5"
        - "file:hashes.'SHA-256'"
        - "file:hashes.'SHA-1'"
        - "email-addr:value"
    - name: ObservableValue
      type: string
      description: "The IOC value (IP, domain, URL, hash, email)"
    - name: Pattern
      type: string
      description: "STIX pattern expression"
    - name: Type
      type: string
      description: "Always 'ThreatIntelIndicators'"
    - name: Confidence
      type: integer
      description: "Confidence score 0-100"
    - name: IsActive
      type: boolean
    - name: IsDeleted
      type: boolean
    - name: Revoked
      type: boolean
    - name: ValidFrom
      type: datetime
    - name: ValidUntil
      type: datetime
    - name: Created
      type: datetime
    - name: Modified
      type: datetime
    - name: Tags
      type: string
      description: "Comma-separated tags including MITRE technique attack-patterns"
    - name: AdditionalFields
      type: object
      description: "JSON string with TLPLevel etc."
    - name: Data
      type: object
      description: "Full STIX indicator JSON"
    - name: SourceSystem
      type: string
    - name: LastUpdateMethod
      type: string
    - name: TenantId
      type: string
    - name: AzureTenantId
      type: string
    - name: WorkspaceId
      type: string
    - name: TimeGenerated
      type: datetime

