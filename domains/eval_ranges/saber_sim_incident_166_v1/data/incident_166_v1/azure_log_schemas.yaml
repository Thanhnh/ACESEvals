adfs_audit_log:
  description: |
    AD Federation Services audit events covering authentication,
    token issuance, federation metadata access, and DKM key operations.
    Critical for detecting Golden SAML attack chains (T1606.002).

  example: |
    {
      "Timestamp": "2024-06-27T14:32:06.000Z",
      "EventID": 501,
      "Level": "Information",
      "Source": "AD FS Auditing",
      "Activity": "Token issuance success",
      "Message": "A token was successfully issued for relying party https://graph.microsoft.com",
      "UserPrincipalName": "taylor.ramsey@contoso.com",
      "ClientIP": "10.0.0.50",
      "RelyingParty": "https://graph.microsoft.com",
      "TokenType": "SAML2.0",
      "ClaimTypes": ["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/upn"],
      "AuthenticationMethod": "urn:oasis:names:tc:SAML:2.0:ac:classes:PasswordProtectedTransport",
      "CorrelationId": "00000000-0000-0000-bee2-6747bdfce306"
    }

  fields:
    - name: Timestamp
      type: datetime
      description: "UTC timestamp of the ADFS event"

    - name: EventID
      type: integer
      description: "Windows Event ID"
      values:
        299: "Federation metadata request"
        403: "Token validation failure"
        411: "Security token validation failure"
        501: "Token issuance success"
        510: "Token issuance failure"
        1007: "Certificate validation error"
        4662: "LDAP read on DKM container (Directory Service Access)"

    - name: Level
      type: string
      values: ["Information", "Warning", "Error"]

    - name: Source
      type: string
      description: "Event source"
      values: ["AD FS Auditing", "AD FS", "Directory Service"]

    - name: Activity
      type: string
      description: "Human-readable activity description"

    - name: Message
      type: string
      description: "Full event message"

    - name: UserPrincipalName
      type: string
      description: "UPN of the user involved"

    - name: ClientIP
      type: string
      description: "Client IP address"

    - name: RelyingParty
      type: string
      description: "Target relying party trust URI"

    - name: TokenType
      type: string
      values: ["SAML1.1", "SAML2.0", "JWT"]

    - name: AuthenticationMethod
      type: string
      description: "SAML authentication context class"

    - name: CorrelationId
      type: guid
      description: "Correlation GUID for multi-event flows"

  detection_patterns:
    - name: "DKM Key Access"
      description: "ADFS Distributed Key Management container read — potential Golden SAML preparation"
      indicators:
        - "EventID == 4662"
        - "Message contains 'CryptoPolicy' or 'DKM'"

    - name: "Token Forging Anomaly"
      description: "Token issued outside normal ADFS flow"
      indicators:
        - "EventID == 501"
        - "ClientIP is external or unexpected"
        - "AuthenticationMethod mismatch with policy"

    - name: "Federation Metadata Reconnaissance"
      description: "Unusual federation metadata access"
      indicators:
        - "EventID == 299"
        - "ClientIP is not a known federation partner"

