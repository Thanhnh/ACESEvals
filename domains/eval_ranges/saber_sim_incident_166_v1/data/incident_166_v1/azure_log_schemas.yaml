lateral_movement_events:
  description: |
    Custom log schema for lateral movement events generated by the
    lateral-movement-coordinator mock service. Captures PsExec, WMI,
    SMB, RDP, and Impacket movement across hosts.

  example: |
    {
      "Timestamp": "2024-06-27T14:35:00.000Z",
      "MovementType": "psexec",
      "SourceHost": "vnevado-win10v",
      "TargetHost": "vnevado-win10b",
      "SourceUser": "kyleg",
      "Command": "cmd.exe /c whoami",
      "SourceEvents": 2,
      "TargetEvents": 2,
      "TargetPid": 9012,
      "Status": "success"
    }

  fields:
    - name: Timestamp
      type: datetime
      description: "UTC timestamp of the lateral movement event"

    - name: MovementType
      type: string
      description: "Type of lateral movement technique used"
      values: ["psexec", "wmi", "smb_copy", "rdp", "impacket"]

    - name: SourceHost
      type: string
      description: "Hostname of the source machine"

    - name: TargetHost
      type: string
      description: "Hostname of the target machine"

    - name: SourceUser
      type: string
      description: "User account performing the lateral movement"

    - name: Command
      type: string
      description: "Command executed on the target (for psexec/wmi)"

    - name: Status
      type: string
      values: ["success", "failed", "partial"]

  detection_patterns:
    - name: "Cross-Host Lateral Movement"
      description: "Movement between two different hosts"
      indicators:
        - "SourceHost != TargetHost"
        - "MovementType in ('psexec', 'wmi', 'impacket')"

