# Azure Log Schemas Reference
# Based on official Microsoft Azure documentation
# Use these schemas to generate realistic detection logs

# ============================================
# KEY VAULT AUDIT LOG (AuditEvent)
# Source: https://learn.microsoft.com/en-us/azure/key-vault/general/logging
# ============================================
key_vault_audit_event:
  example: |
    {
      "time": "2024-12-16T10:30:45.1234567Z",
      "resourceId": "/SUBSCRIPTIONS/00000000-0000-0000-baf9-d9af542441b0/RESOURCEGROUPS/PRODUCTION-RG/PROVIDERS/MICROSOFT.KEYVAULT/VAULTS/PROD-SECRETS-KV",
      "operationName": "SecretGet",
      "operationVersion": "7.4",
      "category": "AuditEvent",
      "resultType": "Success",
      "resultSignature": "OK",
      "resultDescription": "",
      "durationMs": 78,
      "callerIpAddress": "172.30.0.100",
      "correlationId": "00000000-0000-0000-bee2-6747bdfce306",
      "identity": {
        "claim": {
          "http://schemas.microsoft.com/identity/claims/objectidentifier": "00000000-0000-0000-4629-592fe47ff156",
          "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/upn": "user@contoso.com",
          "appid": "00000000-0000-0000-9620-c3d50095e00e"
        }
      },
      "properties": {
        "clientInfo": "azsdk-python-keyvault/4.7.0",
        "requestUri": "https://prod-secrets-kv.vault.azure.net/secrets/db-password?api-version=7.4",
        "id": "https://prod-secrets-kv.vault.azure.net/secrets/db-password",
        "httpStatusCode": 200,
        "isAccessPolicyMatch": true
      }
    }

  fields:
    - name: time
      type: datetime
      description: "UTC timestamp in ISO 8601 format with nanoseconds"
      format: "YYYY-MM-DDTHH:MM:SS.fffffffZ"

    - name: resourceId
      type: string
      description: "Azure Resource Manager resource ID (UPPERCASE)"
      format: "/SUBSCRIPTIONS/{subscriptionId}/RESOURCEGROUPS/{resourceGroup}/PROVIDERS/MICROSOFT.KEYVAULT/VAULTS/{vaultName}"

    - name: operationName
      type: string
      description: "Operation in ObjectVerb format"
      values:
        - SecretGet
        - SecretSet
        - SecretDelete
        - SecretList
        - SecretListVersions
        - KeySign
        - KeyDecrypt
        - KeyEncrypt
        - KeyGet
        - KeyCreate
        - VaultGet
        - VaultPut
        - VaultDelete

    - name: operationVersion
      type: string
      description: "API version used"
      example: "7.4"

    - name: category
      type: string
      description: "Always 'AuditEvent' for Key Vault"
      value: "AuditEvent"

    - name: resultType
      type: string
      values: ["Success", "Failure"]

    - name: resultSignature
      type: string
      description: "HTTP status text"
      values: ["OK", "Not Found", "Unauthorized", "Forbidden"]

    - name: durationMs
      type: integer
      description: "Request duration in milliseconds"

    - name: callerIpAddress
      type: string
      description: "Client IP address"

    - name: correlationId
      type: guid
      description: "GUID for correlating logs across services"

    - name: identity.claim
      type: object
      description: "Claims from the authentication token"
      fields:
        - "http://schemas.microsoft.com/identity/claims/objectidentifier"
        - "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/upn"
        - "appid"

    - name: properties
      type: object
      fields:
        - clientInfo: "SDK/client identifier string"
        - requestUri: "Full request URI"
        - id: "Resource URI accessed"
        - httpStatusCode: "HTTP response code"
        - isAccessPolicyMatch: "Whether access policy matched"

# ============================================
# STORAGE BLOB LOG (StorageBlobLogs)
# Source: https://learn.microsoft.com/en-us/azure/storage/blobs/monitor-blob-storage-reference
# ============================================
storage_blob_log:
  example: |
    {
      "time": "2024-12-16T10:30:45.1234567Z",
      "resourceId": "/subscriptions/00000000-0000-0000-baf9-d9af542441b0/resourceGroups/production-rg/providers/Microsoft.Storage/storageAccounts/proddata001/blobServices/default",
      "category": "StorageRead",
      "operationName": "GetBlob",
      "operationVersion": "2021-06-08",
      "schemaVersion": "1.0",
      "statusCode": 200,
      "statusText": "Success",
      "durationMs": 5,
      "callerIpAddress": "172.30.0.100:54321",
      "correlationId": "00000000-0000-0000-bee2-6747bdfce306",
      "location": "eastus",
      "uri": "https://proddata001.blob.core.windows.net/uploads/customer-data.csv",
      "protocol": "HTTPS",
      "identity": {
        "type": "SAS",
        "tokenHash": "key1(SHA256hash),SasSignature(SHA256hash)",
        "requester": {
          "appId": "00000000-0000-0000-9620-c3d50095e00e",
          "objectId": "00000000-0000-0000-1498-2b249422673c",
          "tenantId": "87654321-4321-4321-4321-cba987654321"
        }
      },
      "properties": {
        "accountName": "proddata001",
        "requestUrl": "https://proddata001.blob.core.windows.net/uploads/customer-data.csv?sv=2021-06-08&st=2024-12-01&se=2025-01-01&sr=c&sp=rl&sig=xxx",
        "userAgentHeader": "azsdk-python-storage-blob/12.19.0 Python/3.11.0",
        "clientRequestId": "00000000-0000-0000-3aea-6073c901b345",
        "etag": "0x8DC123456789ABC",
        "serverLatencyMs": 3,
        "serviceType": "blob",
        "requestHeaderSize": 512,
        "responseHeaderSize": 256,
        "responseBodySize": 1048576,
        "objectKey": "/proddata001/uploads/customer-data.csv",
        "tlsVersion": "TLS 1.2"
      }
    }

  fields:
    - name: category
      type: string
      values: ["StorageRead", "StorageWrite", "StorageDelete"]

    - name: operationName
      type: string
      description: "REST operation name"
      values:
        - GetBlob
        - PutBlob
        - DeleteBlob
        - ListBlobs
        - GetContainerProperties
        - ListContainers
        - CopyBlob
        - GetBlobProperties
        - SetBlobMetadata

    - name: statusCode
      type: integer
      description: "HTTP status code"

    - name: statusText
      type: string
      values: ["Success", "AnonymousSuccess", "SASSuccess", "ThrottlingError", "AuthorizationError"]

    - name: identity.type
      type: string
      values: ["OAuth", "SAS", "AccountKey", "Anonymous"]

    - name: identity.tokenHash
      type: string
      description: "SHA-256 hash of the authentication token/key"

