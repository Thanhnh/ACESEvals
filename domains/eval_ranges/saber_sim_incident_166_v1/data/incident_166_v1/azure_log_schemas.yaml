      "resultSignature": "Succeeded.OK",
      "durationMs": 150,
      "callerIpAddress": "172.30.0.100",
      "correlationId": "00000000-0000-0000-bee2-6747bdfce306",
      "identity": {
        "authorization": {
          "scope": "/subscriptions/00000000-0000-0000-baf9-d9af542441b0/resourceGroups/production-rg/providers/Microsoft.Storage/storageAccounts/proddata001",
          "action": "Microsoft.Storage/storageAccounts/listKeys/action",
          "evidence": {
            "role": "Owner",
            "roleDefinitionId": "8e3af657a8ff443ca75c2fe8c4bcb635"
          }
        },
        "claims": {
          "aud": "https://management.azure.com/",
          "iss": "https://sts.windows.net/87654321-4321-4321-4321-cba987654321/",
          "iat": "1702725600",
          "nbf": "1702725600",
          "exp": "1702729200",
          "appid": "00000000-0000-0000-9620-c3d50095e00e",
