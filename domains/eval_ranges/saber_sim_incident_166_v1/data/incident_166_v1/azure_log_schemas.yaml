      type: string
      values: ["Administrative", "Security", "ServiceHealth", "Alert", "Policy"]

    - name: level
      type: string
      values: ["Critical", "Error", "Warning", "Informational"]

# ============================================
# IMDS ACCESS (Custom - No standard log)
# Note: Real Azure doesn't have external IMDS logs
# This is for simulation purposes
# ============================================
imds_access_log:
  description: |
    Azure IMDS doesn't produce external audit logs in real Azure.
    However, for threat hunting simulation, we generate synthetic logs
    that would be useful for detecting credential theft.

  example: |
    {
      "time": "2024-12-16T10:30:45.1234567Z",
      "resourceId": "/SUBSCRIPTIONS/00000000-0000-0000-baf9-d9af542441b0/RESOURCEGROUPS/PRODUCTION-RG/PROVIDERS/MICROSOFT.COMPUTE/VIRTUALMACHINES/WEBAPP-VM-001",
      "operationName": "IMDS.GetToken",
      "category": "InstanceMetadata",
      "resultType": "Success",
      "callerIpAddress": "10.0.0.4",
      "correlationId": "00000000-0000-0000-bee2-6747bdfce306",
      "properties": {
        "endpoint": "/metadata/identity/oauth2/token",
        "resource": "https://management.azure.com/",
        "vmName": "webapp-vm-001",
        "clientId": "00000000-0000-0000-9620-c3d50095e00e",
        "userAgent": "azsdk-python-identity/1.14.0"
      }
    }

