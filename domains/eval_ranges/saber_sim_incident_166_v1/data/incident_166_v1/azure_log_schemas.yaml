# ============================================
activity_log:
  example: |
    {
      "time": "2024-12-16T10:30:45.1234567Z",
      "resourceId": "/subscriptions/00000000-0000-0000-baf9-d9af542441b0/resourceGroups/production-rg/providers/Microsoft.Storage/storageAccounts/proddata001",
