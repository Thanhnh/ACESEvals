    Follows the audit.k8s.io/v1 Event schema.

  example: |
    {
      "apiVersion": "audit.k8s.io/v1",
      "kind": "Event",
      "level": "RequestResponse",
      "timestamp": "2024-01-15T10:30:45.123456Z",
      "verb": "create",
      "user": {
        "username": "system:serviceaccount:production:hr-app-sa",
        "uid": "sa-uid-12345",
        "groups": ["system:serviceaccounts", "system:serviceaccounts:production"]
      },
      "sourceIPs": ["10.244.0.15"],
      "userAgent": "python-requests/2.28.0",
      "objectRef": {
        "apiVersion": "v1",
        "kind": "Secret",
        "namespace": "production",
        "name": "keyvault-credentials",
        "uid": "87654321-abcd-1234-efgh-567890ijklmn"
      },
      "requestReceivedTimestamp": "2024-01-15T10:30:45.111111Z",
      "stageTimestamp": "2024-01-15T10:30:45.123456Z",
      "stage": "ResponseComplete",
      "requestObject": {
        "apiVersion": "v1",
        "kind": "Secret",
        "metadata": {"name": "keyvault-credentials", "namespace": "production"},
        "type": "Opaque",
        "data": {}
      },
      "responseObject": {
        "apiVersion": "v1",
        "kind": "Secret",
        "metadata": {
          "name": "keyvault-credentials",
          "namespace": "production",
