# ============================================
# APP SERVICE HTTP LOGS (AppServiceHTTPLogs)
# Source: https://learn.microsoft.com/en-us/azure/app-service/troubleshoot-diagnostic-logs
# ============================================
app_service_http_logs:
  example: |
    {
      "TimeGenerated": "2024-12-16T10:30:45.1234567Z",
      "CIp": "198.51.100.106",
      "CsMethod": "POST",
      "CsUriStem": "/_next/rsc",
      "CsUriQuery": "",
      "CsHost": "prod-webapp.azurewebsites.net",
      "ScStatus": 200,
      "ScBytes": 1234,
      "CsBytes": 567,
      "TimeTaken": 150,
      "Result": "Success",
      "UserAgent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
      "Cookie": "-",
      "Referer": "-",
      "ComputerName": "RD00155D123456",
      "SPort": "443",
      "Protocol": "HTTP/1.1",
      "_ResourceId": "/SUBSCRIPTIONS/00000000-0000-0000-baf9-d9af542441b0/RESOURCEGROUPS/PRODUCTION-RG/PROVIDERS/MICROSOFT.WEB/SITES/PROD-WEBAPP"
    }

  fields:
    - name: time
      type: datetime
      description: "UTC timestamp in ISO 8601 format"
      format: "YYYY-MM-DDTHH:MM:SS.fffffffZ"

    - name: resourceId
      type: string
      description: "Azure Resource Manager resource ID (UPPERCASE)"
      format: "/SUBSCRIPTIONS/{subscriptionId}/RESOURCEGROUPS/{resourceGroup}/PROVIDERS/MICROSOFT.WEB/SITES/{siteName}"

    - name: category
      type: string
      description: "Log category"
      value: "AppServiceHTTPLogs"

    - name: operationName
      type: string
      description: "Operation name"
      value: "Microsoft.Web/sites/log"

    - name: CIp
      type: string
      description: "Client IP address"

    - name: CsMethod
      type: string
      description: "HTTP method"
      values: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS", "HEAD"]

    - name: CsUriStem
      type: string
      description: "Request URI path"
      suspicious_patterns:
        - "/_next/rsc"
        - "/.env"
        - "/api/debug"
        - "/scm/"
        - "/admin/"
        - "/.git/"

    - name: CsHost
      type: string
      description: "Host header value"

    - name: ScStatus
      type: integer
      description: "HTTP status code"

    - name: TimeTaken
      type: integer
      description: "Request time in milliseconds"

    - name: UserAgent
      type: string
      description: "User-Agent header"
      suspicious_patterns:
        - "curl/"
        - "python-requests"
        - "wget"
        - "nuclei"
        - "nikto"

    - name: Result
      type: string
      description: "Request result"
      values: ["Success", "Failure"]

  detection_patterns:
    - name: "React2Shell RCE Attempt"
      description: "Potential React Server Components RCE (CVE-2025-55182)"
      indicators:
        - "CsUriStem contains '/_next/rsc'"
        - "CsMethod = 'POST'"
        - "Large CsBytes (payload injection)"

    - name: "Environment Exposure"
      description: "Access to sensitive environment endpoints"
      indicators:
        - "CsUriStem contains '.env' or 'debug/env'"
        - "ScStatus = 200"

    - name: "Kudu/SCM Access"
      description: "Access to App Service management endpoints"
      indicators:
        - "CsUriStem contains '/scm/'"
        - "CsHost contains '.scm.'"

# ============================================
# LOG ANALYTICS QUERY LOGS (LAQueryLogs)
# Source: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/query-audit
# ============================================
la_query_logs:
  description: |
    Logs of queries executed against Log Analytics workspace.
    Used for auditing who queried what data and when.

  example: |
    {
      "time": "2024-12-16T10:30:45.1234567Z",
      "category": "LAQueryLogs",
      "operationName": "Query",
      "resultType": "Success",
      "correlationId": "00000000-0000-0000-bee2-6747bdfce306",
      "properties": {
        "queryText": "AuditEvent | where operationName contains 'listKeys' | summarize count() by callerIpAddress",
        "timespan": "PT24H",
        "resultCount": 5,
        "durationMs": 250,
        "workspaceId": "00000000-0000-0000-baf9-d9af542441b0",
        "queryId": "q-a1b2c3d4-e5f6-7890",
        "errorMessage": null
      }
    }

  fields:
    - name: time
      type: datetime
      description: "UTC timestamp in ISO 8601 format"
      format: "YYYY-MM-DDTHH:MM:SS.fffffffZ"

    - name: category
      type: string
      description: "Always 'LAQueryLogs' for query audit"
      value: "LAQueryLogs"

    - name: operationName
      type: string
      description: "Always 'Query' for query operations"
      value: "Query"

    - name: resultType
      type: string
      description: "Query execution result"
      values: ["Success", "Failed", "PartialSuccess"]

    - name: correlationId
      type: guid
      description: "GUID for correlating operations"

    - name: properties.queryText
      type: string
      description: "KQL query text executed"

    - name: properties.timespan
      type: string
      description: "Query time range (ISO 8601 duration)"
      examples: ["PT1H", "PT24H", "P7D"]

    - name: properties.resultCount
      type: integer
      description: "Number of rows returned"

    - name: properties.durationMs
      type: integer
      description: "Query execution time in milliseconds"

    - name: properties.workspaceId
      type: guid
      description: "Log Analytics workspace ID"

    - name: properties.errorMessage
      type: string
      description: "Error message if query failed (null on success)"

  detection_patterns:
    - name: "Excessive Query Activity"
      description: "Unusual volume of queries from single source"
      indicators:
        - "High query count in short time period"
        - "Multiple failed queries (reconnaissance)"

    - name: "Sensitive Data Query"
      description: "Queries accessing sensitive log categories"
      indicators:
        - "queryText contains 'SignInLogs' or 'AuditEvent'"
        - "Large result counts (data exfiltration)"

# ============================================
# AZURE FRONT DOOR ACCESS LOG (FrontDoorAccessLog)
# Source: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-diagnostics
# ============================================
front_door_access_log:
  table: "FrontDoorAccessLog"
  description: |
    Azure Front Door access logs capture all HTTP requests processed by Front Door.
    Used for monitoring traffic patterns, debugging routing issues, and correlating with WAF logs.

  example: |
    {
      "time": "2026-01-13T10:30:00.0000000Z",
      "resourceId": "/SUBSCRIPTIONS/00000000-0000-0000-baf9-d9af542441b0/RESOURCEGROUPS/PRODUCTION-RG/PROVIDERS/MICROSOFT.CDN/PROFILES/PROD-FRONTDOOR",
      "category": "FrontDoorAccessLog",
      "operationName": "Microsoft.Cdn/Profiles/FrontDoorAccessLog/Write",
      "properties": {
        "trackingReference": "0WE123abc456DEF789ghi",
        "httpMethod": "POST",
        "httpVersion": "HTTP/1.1",
        "requestUri": "https://prod-webapp.azurefd.net:443/_next/rsc",
        "hostName": "prod-webapp.azurefd.net",
        "requestBytes": 256,
        "responseBytes": 1024,
        "userAgent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
        "referrer": "",
        "clientIp": "198.51.100.106",
        "socketIp": "198.51.100.106",
        "clientPort": 54321,
        "timeTaken": 0.045,
        "timeToFirstByte": 0.023,
        "requestProtocol": "HTTPS",
        "securityProtocol": "TLSv1.2",
        "securityCipher": "ECDHE-RSA-AES256-GCM-SHA384",
        "sni": "prod-webapp.azurefd.net",
        "endpoint": "prod-webapp.azurefd.net",
        "httpStatusCode": 200,
        "pop": "EUS",
        "cacheStatus": "MISS",
        "routeName": "default-route",
        "matchedRulesSetName": "",
        "originUrl": "http://172.30.20.10:8080/_next/rsc",
        "originIp": "172.30.20.10",
        "originName": "app-service-origin",
        "errorInfo": "NoError",
        "result": ""
      }
    }

  fields:
    - name: time
      type: datetime
      description: "UTC timestamp when Front Door edge delivered content"
      format: "YYYY-MM-DDTHH:MM:SS.fffffffZ"

    - name: resourceId
      type: string
      description: "Azure Resource Manager resource ID"
      format: "/SUBSCRIPTIONS/{id}/RESOURCEGROUPS/{rg}/PROVIDERS/MICROSOFT.CDN/PROFILES/{profile}"

    - name: category
      type: string
      value: "FrontDoorAccessLog"

    - name: operationName
      type: string
      value: "Microsoft.Cdn/Profiles/FrontDoorAccessLog/Write"

    - name: properties.trackingReference
      type: string
      description: "Unique reference string (sent in X-Azure-Ref header)"

    - name: properties.httpMethod
      type: string
      values: ["GET", "POST", "PUT", "DELETE", "HEAD", "OPTIONS", "PATCH"]

    - name: properties.httpVersion
      type: string
      values: ["HTTP/1.0", "HTTP/1.1", "HTTP/2.0"]

    - name: properties.requestUri
      type: string
      description: "Full URI including scheme, port, domain, path, query string"

    - name: properties.hostName
      type: string
      description: "Host name from request"

    - name: properties.clientIp
      type: string
      description: "Client IP (from X-Forwarded-For if present)"

    - name: properties.socketIp
      type: string
      description: "IP of direct connection to Azure Front Door"

    - name: properties.httpStatusCode
      type: integer
      description: "HTTP status code (0 = timeout, 499 = client closed)"

    - name: properties.timeTaken
      type: float
      description: "Duration in seconds from request received to last response byte"

    - name: properties.timeToFirstByte
      type: float
      description: "Duration in seconds to first response byte"

    - name: properties.requestProtocol
      type: string
      values: ["HTTP", "HTTPS", "WS", "WSS"]

    - name: properties.securityProtocol
      type: string
      values: ["SSLv3", "TLSv1", "TLSv1.1", "TLSv1.2", "TLSv1.3", null]

    - name: properties.pop
      type: string
      description: "Point of Presence that served the request"

    - name: properties.cacheStatus
      type: string
      values: ["HIT", "MISS", "REMOTE_HIT", "PARTIAL_HIT", "CACHE_NOCONFIG", "PRIVATE_NOSTORE", "N/A"]

    - name: properties.originUrl
      type: string
      description: "Full URL sent to origin (N/A if cached)"

    - name: properties.originIp
      type: string
      description: "Origin IP (N/A if cached)"

    - name: properties.errorInfo
      type: string
      values:
        - "NoError"
        - "CertificateError"
        - "CertificateNameCheckFailed"
        - "ClientDisconnected"
        - "ClientGeoBlocked"
        - "DNSFailure"
        - "DNSTimeout"
        - "OriginConnectionAborted"
        - "OriginConnectionError"
        - "OriginConnectionRefused"
        - "OriginError"
        - "OriginTimeout"
        - "SSLHandshakeError"
        - "SSLInvalidRootCA"
        - "UnspecifiedError"

  detection_patterns:
    - name: "Suspicious RSC Endpoint Access"
      description: "Access to React Server Components endpoint"
      indicators:
        - "requestUri contains '/_next/rsc'"
        - "httpMethod = 'POST'"

    - name: "High Error Rate from Origin"
      description: "Backend connectivity issues"
      indicators:
        - "errorInfo != 'NoError'"
        - "httpStatusCode >= 500"

# ============================================
# AZURE FRONT DOOR WAF LOG (FrontDoorWebApplicationFirewallLog)
# Source: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-monitor
# ============================================
front_door_waf_log:
  description: |
    Azure Front Door WAF logs capture requests that match WAF rules.
    Critical for detecting and investigating web application attacks.
    Use trackingReference to correlate with FrontDoorAccessLog.

  example: |
    {
      "time": "2026-01-13T10:30:00.0000000Z",
      "resourceId": "/SUBSCRIPTIONS/00000000-0000-0000-baf9-d9af542441b0/RESOURCEGROUPS/PRODUCTION-RG/PROVIDERS/MICROSOFT.CDN/PROFILES/PROD-FRONTDOOR",
      "category": "FrontDoorWebApplicationFirewallLog",
      "operationName": "Microsoft.Network/FrontDoorWebApplicationFirewallLog/Write",
      "properties": {
        "trackingReference": "0WE123abc456DEF789ghi",
        "clientIP": "198.51.100.106",
        "clientPort": "54321",
        "socketIP": "198.51.100.106",
        "requestUri": "https://prod-webapp.azurefd.net:443/_next/rsc",
        "ruleName": "CUSTOM-001-PrototypePollution",
        "policy": "React2ShellWAFPolicy",
        "policyMode": "detection",
        "action": "Log",
        "host": "prod-webapp.azurefd.net",
        "details": {
          "matches": [
            {
              "matchVariableName": "RequestBody",
              "matchVariableValue": "__proto__"
            }
          ]
        }
      }
    }

  fields:
    - name: time
      type: datetime
      description: "UTC timestamp of WAF evaluation"
      format: "YYYY-MM-DDTHH:MM:SS.fffffffZ"

    - name: resourceId
      type: string
      description: "Azure Resource Manager resource ID"

    - name: category
      type: string
      value: "FrontDoorWebApplicationFirewallLog"

    - name: operationName
      type: string
      value: "Microsoft.Network/FrontDoorWebApplicationFirewallLog/Write"

    - name: properties.trackingReference
      type: string
      description: "Links to corresponding FrontDoorAccessLog entry"

    - name: properties.clientIP
      type: string
      description: "Client IP (from X-Forwarded-For if present)"

    - name: properties.clientPort
      type: string
      description: "Client port number"

    - name: properties.socketIP
      type: string
      description: "Source IP seen by WAF (TCP session)"

    - name: properties.requestUri
      type: string
      description: "Full request URI"

    - name: properties.ruleName
      type: string
      description: "WAF rule name (e.g., Microsoft_DefaultRuleSet-1.1-SQLI-942100)"

    - name: properties.policy
      type: string
      description: "WAF policy name"

    - name: properties.policyMode
      type: string
      values: ["prevention", "detection"]

    - name: properties.action
      type: string
      values:
        - "Allow"
        - "Block"
        - "Log"
        - "AnomalyScoring"
        - "JSChallengeIssued"
        - "JSChallengePass"
        - "JSChallengeValid"
        - "JSChallengeBlock"

    - name: properties.host
      type: string
      description: "Host header value"

    - name: properties.details
      type: object
      fields:
        - matches: "Array of matched patterns"

    - name: properties.details.matches[].matchVariableName
      type: string
      description: "HTTP parameter matched (max 100 chars)"
      examples:
        - "RequestBody"
        - "RequestUri"
        - "QueryString"
        - "RequestHeaders"
        - "UserAgent"
        - "QueryParamValue:q"

    - name: properties.details.matches[].matchVariableValue
      type: string
      description: "Value that triggered the match (max 100 chars)"

  detection_patterns:
    - name: "Prototype Pollution Attempt"
      description: "CVE-2025-55182 React2Shell attack"
      indicators:
        - "matchVariableValue contains '__proto__' or 'constructor'"
        - "requestUri contains '/_next/rsc'"

    - name: "SQL Injection Attack"
      description: "SQL injection attempt detected by WAF"
      indicators:
        - "ruleName contains '942' (OWASP SQLI rules)"
        - "action = 'Block'"

    - name: "Scanner Activity"
      description: "Automated scanning tools detected"
      indicators:
        - "ruleName contains '920' (Scanner detection rules)"
        - "Multiple WAF matches from same clientIP"

    - name: "Attack Chain Correlation"
      description: "Correlate WAF detection with post-exploitation"
      kql_query: |
        let waf_events = AzureDiagnostics
        | where Category == "FrontDoorWebApplicationFirewallLog"
        | where action_s in ("Block", "Log")
        | project trackingReference_s, clientIP_s, ruleName_s;
        let access_events = AzureDiagnostics
        | where Category == "FrontDoorAccessLog"
        | project trackingReference_s, httpStatusCode_d, originUrl_s;
        waf_events
        | join kind=inner access_events on trackingReference_s

# ============================================
# AKS AUDIT LOG (AKSAudit)
# Source: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/aksaudit
# ============================================
aks_audit_log:
  description: |
    Contains all Kubernetes API Server audit logs including get and list verbs.
    Captures control plane operations on the AKS cluster.

  example: |
    {
      "TimeGenerated": "2025-10-31T14:30:45.123Z",
      "AuditId": "00000000-0000-0000-bee2-6747bdfce306",
      "Level": "RequestResponse",
      "Stage": "ResponseComplete",
      "Verb": "get",
      "RequestUri": "/api/v1/namespaces/default/pods/nginx-deployment-66b6c48dd5-abc12",
      "User": {
        "username": "admin",
        "uid": "admin-user-123",
        "groups": ["system:masters"]
      },
      "SourceIps": ["192.168.1.100", "10.0.0.50"],
      "UserAgent": "kubectl/v1.24.0",
      "ObjectRef": {
        "apiVersion": "v1",
        "kind": "Pod",
        "namespace": "default",
        "name": "nginx-deployment-66b6c48dd5-abc12",
        "uid": "00000000-0000-0000-502b-16624e4c1cb1"
      },
      "ResponseStatus": {
        "code": 200,
        "message": "OK"
      },
      "RequestReceivedTime": "2025-10-31T14:30:45.123Z",
      "StageReceivedTime": "2025-10-31T14:30:45.456Z",
      "Annotations": {
        "authorization.k8s.io/decision": "allow",
        "authorization.k8s.io/reason": ""
      }
    }

  fields:
    - name: TimeGenerated
      type: datetime
      description: "Event generation time"

    - name: AuditId
      type: string
      description: "Unique audit ID generated for each request"

    - name: Level
      type: string
      values: ["None", "Metadata", "Request", "RequestResponse"]
      description: "Audit level of the event"

    - name: Stage
      type: string
      values: ["RequestReceived", "ResponseStarted", "ResponseComplete", "Panic"]
      description: "Request handling stage"

    - name: Verb
      type: string
      description: "Kubernetes verb (lowercase HTTP method)"
      values: ["get", "list", "create", "update", "patch", "delete", "watch"]

    - name: RequestUri
      type: string
      description: "URI as sent by client to server"

    - name: User
      type: object
      description: "Authenticated user metadata"
      fields:
        - username: "string"
        - uid: "string"
        - groups: "array of strings"

    - name: SourceIps
      type: array
      description: "Source IP addresses including intermediate proxies"

    - name: UserAgent
      type: string
      description: "User agent from originating client"

    - name: ObjectRef
      type: object
      description: "Kubernetes object reference"
      fields:
        - apiVersion: "string"
        - kind: "string (Pod, Deployment, Secret, etc.)"
        - namespace: "string"
        - name: "string"
        - uid: "string"

    - name: ResponseStatus
      type: object
      fields:
        - code: "integer (HTTP status code)"
        - message: "string"

    - name: Annotations
      type: object
      description: "Key-value map for additional context"

# ============================================
# KUBERNETES API AUDIT LOG (audit.k8s.io/v1)
# Source: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
# ============================================
kubernetes_api_audit_log:
  description: |
