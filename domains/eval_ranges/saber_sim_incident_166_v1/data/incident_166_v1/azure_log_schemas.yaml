# ============================================
# NETWORK SECURITY GROUP FLOW LOGS (AzureNetworkAnalytics_CL)
# Source: https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-overview
# ============================================
nsg_flow_log:
  description: |
    Network Security Group (NSG) flow logs capture information about IP traffic.
    Used for network forensics and threat detection.

  example: |
    {
      "time": "2024-01-15T10:30:45.123Z",
      "systemId": "00000000-0000-0000-baf9-d9af542441b0",
      "macAddress": "00155D123456",
      "category": "NetworkSecurityGroupFlowEvent",
      "resourceId": "/SUBSCRIPTIONS/00000000-0000-0000-baf9-d9af542441b0/RESOURCEGROUPS/PRODUCTION-RG/PROVIDERS/MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/PROD-NSG",
      "operationName": "NetworkSecurityGroupFlowEvents",
      "properties": {
        "Version": 2,
        "flows": [
          {
            "rule": "AllowVNetInBound",
            "flows": [
              {
                "mac": "00155D123456",
                "flowTuples": [
                  "1702725045,172.30.10.20,172.30.20.10,443,8080,T,I,A,C,10,5120,5,2048"
                ]
              }
            ]
          }
        ]
      }
    }

  fields:
    - name: flowTuples
      type: string
      description: "Comma-separated flow data"
      format: "timestamp,srcIP,dstIP,srcPort,dstPort,protocol,direction,decision,flowState,packets,bytes,packetsFromDst,bytesFromDst"

    - name: rule
      type: string
      description: "NSG rule name that allowed/denied the flow"

    - name: direction
      type: string
      values: ["I (Inbound)", "O (Outbound)"]

    - name: decision
      type: string
      values: ["A (Allow)", "D (Deny)"]

# ============================================
# KUBERNETES POD LOGS (Container Logs)
# For aks_pod mock service
# ============================================
aks_pod_http_log:
  description: |
    HTTP access logs from containers running in AKS pods.
    Custom format for tracking web application activity.

  example: |
    {
      "timestamp": "2024-12-16T10:30:45.123Z",
      "pod": "hr-app-pod",
      "namespace": "production",
      "container": "hr-app",
      "method": "POST",
      "path": "/api/document/preview",
      "status_code": 200,
      "client_ip": "198.51.100.106",
      "user_agent": "curl/7.68.0",
      "request_id": "req-a1b2c3d4",
      "duration_ms": 125,
      "request_body_size": 256,
      "response_body_size": 1024
    }

  fields:
    - name: timestamp
      type: datetime
      format: "YYYY-MM-DDTHH:MM:SS.fffZ"

    - name: pod
      type: string
      description: "Pod name"

    - name: namespace
      type: string
      description: "Kubernetes namespace"

    - name: method
      type: string
      values: ["GET", "POST", "PUT", "DELETE", "PATCH"]

    - name: path
      type: string
      description: "HTTP request path"
      suspicious_patterns:
        - "/api/document/preview (SSRF vulnerability)"
        - "/exec (RCE endpoint)"
        - "/admin/* (admin endpoints)"

    - name: status_code
      type: integer
      description: "HTTP response status"

