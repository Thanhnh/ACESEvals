    - name: kind
      type: string
      value: "Event"

    - name: level
      type: string
      values: ["None", "Metadata", "Request", "RequestResponse"]

    - name: timestamp
      type: datetime
      format: "RFC3339 with nanoseconds"

    - name: verb
      type: string
      description: "HTTP verb or Kubernetes operation"
      values: ["get", "list", "create", "update", "patch", "delete", "watch", "deletecollection"]

    - name: user.username
      type: string
      description: "Username authenticated by the API server"

    - name: user.groups
      type: array
      description: "Groups the user is a member of"

    - name: sourceIPs
      type: array
      description: "Source IP addresses"

    - name: objectRef
      type: object
      description: "Target Kubernetes resource"

    - name: stage
      type: string
      values: ["RequestReceived", "ResponseStarted", "ResponseComplete", "Panic"]

