placeholder_definitions:
  STORAGE_KEY_PROD:
    type: static
    value: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
  STORAGE_KEY_PROD_2:
    type: base64
    length: 64
  STORAGE_KEY_ANALYTICS_1:
    type: base64
    length: 64
  STORAGE_KEY_ANALYTICS_2:
    type: base64
    length: 64
  DB_PASSWORD_POSTGRES:
    type: password
    length: 24
  DB_PASSWORD_MSSQL:
    type: password
    length: 24
  OPENAI_API_KEY:
    type: random_hex
    length: 48
  WEBAPP_API_KEY:
    type: api_key
    prefix: wak_
    length: 32
  APP_API_KEY:
    type: api_key
    prefix: app_
    length: 32
  FUNC_API_KEY:
    type: api_key
    prefix: func_
    length: 32
  APP_CLIENT_ID:
    type: uuid
  STORAGE_CONNECTION_STRING:
    type: connection_string
    format: DefaultEndpointsProtocol=https;AccountName=proddata001;AccountKey={{ STORAGE_KEY_PROD
      }};EndpointSuffix=core.windows.net
  APP_DATABASE_URL:
    type: connection_string
    format: postgresql://dbadmin:{{ DB_PASSWORD_POSTGRES }}@prod-db.postgres.database.azure.com:5432/appdb
  FUNC_DATABASE_CONNECTION:
    type: connection_string
    format: Server=prod-db.database.windows.net;Database=CustomerDB;User=sa;Password={{
      DB_PASSWORD_MSSQL }}
