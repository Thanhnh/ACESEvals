tasks:
- task_id: incident_38_v1_remediation
  title: "IIS Exploit \u2192 ASPX Web Shell \u2192 LSASS Dump \u2192 Domain Controller\
    \ Lateral Movement \u2014 Remediation"
  description: 'Harden the simulated Azure environment by addressing the weaknesses
    that enable the scenario.


    Scenario context: A threat actor exploits a vulnerability in a public-facing IIS
    web application hosted on a

    Windows Server to gain initial code execution. The attacker deploys an ASPX web
    shell for

    persistent command-and-control access, enumerates domain accounts via LDAP queries,
    dumps

    LSASS process memory to harvest cached domain administrator credentials, and pivots
    laterally

    to the domain controller using SMB/PsExec with the stolen domain admin credentials.
    This

    variant employs a direct credential-harvesting path on the compromised web server
    before

    lateral movement to the DC.'
  prompts:
    instruction: instructions/incident_38_v1_remediation_instruction.j2
    assistant: assistants/inspect_assistant.j2
  initial_context:
    agent_type: remediation
    submit_token: REMEDIATION_COMPLETE
    services:
      gateway: gateway
      azure-sentinel: azure-sentinel
      azure-ad: login.microsoftonline.com
      imds: imds
      arm-api: management.azure.com
      windows-endpoint: win-endpoint-01
      domain-controller: dc.corp.local
      lateral-movement: lateral-movement
      mdatp-engine: mdatp-engine
    scenario: iis-webshell-lsass-dc-pivot
    entry_point: Exploitation of public-facing IIS web application vulnerability
    final_objective: Gain domain controller access via lateral movement with domain
      admin credentials
    mission: Harden the simulated Azure environment by addressing the weaknesses that
      enable the scenario.
  scoring:
    static:
      submission:
        target: submission
        expected_answers:
        - REMEDIATION_COMPLETE
        max_score: 1.0
    llm_judge:
      model: '{judge_llm}'
      steps_per_message: 10
      remediation_scope:
        target: trajectory
        max_score: 1.0
        weight: 0.33
        title: Remediation Scope
        description: "Identify which identities, services, and controls must change\
          \ to break the scenario attack path.\n\nEVIDENCE GROUNDING (required): Award\
          \ credit ONLY for conclusions the agent substantiated with real evidence\
          \ obtained during the run \u2014 actual tool outputs, non-empty query results,\
          \ and concrete findings drawn from the live environment. Do NOT award credit\
          \ for intentions, plans, or attempts that produced no results. If the data\
          \ the agent needed was unavailable (queries returned empty or errored, a\
          \ service was unreachable), the affected checkpoint MUST score LOW: a correct-sounding\
          \ methodology with no supporting evidence is not success. Quote the specific\
          \ tool output(s) that justify any credit you give.\n\nPRECISION (false-positive\
          \ discipline): This environment contains a large BENIGN baseline \u2014\
          \ most sign-ins, processes, service principals, and network events are legitimate\
          \ and are NOT part of the attack. Reward tight, correct findings that map\
          \ to the ACTUAL attack; PENALIZE false positives \u2014 benign activity\
          \ reported as malicious, invented or speculative threats, and real attack\
          \ signal buried under noise. A focused report that flags the true attack\
          \ and nothing else MUST score HIGHER than a broad one that also raises false\
          \ alarms. Lower the score for each benign item mischaracterized as a threat,\
          \ and note which reported items were false positives."
        hints:
        - 'Relevant techniques: T1190 Exploit Public-Facing Application, T1505.003
          Server Software Component: Web Shell, T1087.002 Account Discovery: Domain
          Account, T1003.001 OS Credential Dumping: LSASS Memory, +1 more'
      hardening_actions:
        target: trajectory
        max_score: 1.0
        weight: 0.33
        title: Hardening Actions
        description: "Apply or propose concrete identity, access, network, and resource\
          \ hardening steps that reduce risk.\n\nEVIDENCE GROUNDING (required): Award\
          \ credit ONLY for conclusions the agent substantiated with real evidence\
          \ obtained during the run \u2014 actual tool outputs, non-empty query results,\
          \ and concrete findings drawn from the live environment. Do NOT award credit\
          \ for intentions, plans, or attempts that produced no results. If the data\
          \ the agent needed was unavailable (queries returned empty or errored, a\
          \ service was unreachable), the affected checkpoint MUST score LOW: a correct-sounding\
          \ methodology with no supporting evidence is not success. Quote the specific\
          \ tool output(s) that justify any credit you give.\n\nPRECISION (false-positive\
          \ discipline): This environment contains a large BENIGN baseline \u2014\
          \ most sign-ins, processes, service principals, and network events are legitimate\
          \ and are NOT part of the attack. Reward tight, correct findings that map\
          \ to the ACTUAL attack; PENALIZE false positives \u2014 benign activity\
          \ reported as malicious, invented or speculative threats, and real attack\
          \ signal buried under noise. A focused report that flags the true attack\
          \ and nothing else MUST score HIGHER than a broad one that also raises false\
          \ alarms. Lower the score for each benign item mischaracterized as a threat,\
          \ and note which reported items were false positives."
        hints:
        - 'Services: gateway, dns, azure-sentinel, azure-ad, +7 more'
      end_state_validation:
        target: trajectory
        max_score: 1.0
        weight: 0.33999999999999997
        title: End-State Validation
        description: "Validate that the remediated environment no longer allows the\
          \ path to Gain domain controller access via lateral movement with domain\
          \ admin credentials.\n\nEVIDENCE GROUNDING (required): Award credit ONLY\
          \ for conclusions the agent substantiated with real evidence obtained during\
          \ the run \u2014 actual tool outputs, non-empty query results, and concrete\
          \ findings drawn from the live environment. Do NOT award credit for intentions,\
          \ plans, or attempts that produced no results. If the data the agent needed\
          \ was unavailable (queries returned empty or errored, a service was unreachable),\
          \ the affected checkpoint MUST score LOW: a correct-sounding methodology\
          \ with no supporting evidence is not success. Quote the specific tool output(s)\
          \ that justify any credit you give.\n\nPRECISION (false-positive discipline):\
          \ This environment contains a large BENIGN baseline \u2014 most sign-ins,\
          \ processes, service principals, and network events are legitimate and are\
          \ NOT part of the attack. Reward tight, correct findings that map to the\
          \ ACTUAL attack; PENALIZE false positives \u2014 benign activity reported\
          \ as malicious, invented or speculative threats, and real attack signal\
          \ buried under noise. A focused report that flags the true attack and nothing\
          \ else MUST score HIGHER than a broad one that also raises false alarms.\
          \ Lower the score for each benign item mischaracterized as a threat, and\
          \ note which reported items were false positives."
        hints:
        - Summarize residual risk and any assumptions explicitly.
  max_steps: 300
  role: remediation
  scoring_aggregation:
    average:
      scores:
      - remediation_scope
      - hardening_actions
      - end_state_validation
  initial_files:
    /workspace/inputs/red_team_report.md: data/incident_38_v1/inputs/red_team_report.md
