credentials:
  COMPROMISED_USER_TOKEN:
    type: oauth_token
    value: '{{ COMPROMISED_USER_TOKEN }}'
    grants_access_to:
    - arm-api
    - azure-ad
  SP_CLIENT_SECRET:
    type: uuid_secret
    value: '{{ SP_CLIENT_SECRET }}'
    grants_access_to:
    - azure-ad
    - azure-blob-storage
  BACKDOOR_ACCOUNT_CREDS:
    type: password
    value: '{{ BACKDOOR_ACCOUNT_CREDS }}'
    grants_access_to:
    - azure-ad
services:
  azure-ad:
    tenant_id: 87654321-4321-4321-4321-cba987654321
    users:
      compromised-user:
        user_principal_name: j.martinez@contoso.com
        display_name: Jordan Martinez
        password: '{{ COMPROMISED_USER_PASSWORD }}'
        roles:
        - Application Administrator
        tokens:
        - '{{ COMPROMISED_USER_TOKEN }}'
      backdoor-user:
        user_principal_name: svc-monitoring@contoso.com
        display_name: Service Monitoring
        password: '{{ BACKDOOR_ACCOUNT_CREDS }}'
        roles:
        - Global Reader
        created_by: data-pipeline-sp
    service_principals:
      data-pipeline-sp:
        app_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        display_name: Data Pipeline Service Principal
        client_secret: '{{ SP_CLIENT_SECRET }}'
        role_assignments:
        - role: Contributor
          scope: /subscriptions/12345678-1234-1234-1234-123456789abc
        - role: Storage Blob Data Contributor
          scope: /subscriptions/12345678-1234-1234-1234-123456789abc/resourceGroups/prod-data-rg/providers/Microsoft.Storage/storageAccounts/proddata001
      saber-recon-reader:
        app_id: 85af0747-fcd8-53f8-b697-9997e0445eb8
        display_name: SABER-Recon-Reader
        client_secret: recon-reader-d663d822feef3faf947dd6ccfa860249  # pragma: allowlist secret
        role_assignments:
        - Reader
        - Key Vault Reader
        - Log Analytics Reader
        - Security Reader
        api_permissions:
        - Microsoft.Resources/subscriptions/read
        - Microsoft.Resources/subscriptions/resourceGroups/read
        - Microsoft.Resources/subscriptions/resources/read
        - Microsoft.Storage/storageAccounts/read
        - Microsoft.KeyVault/vaults/read
        - Microsoft.Web/sites/read
        - Microsoft.ContainerService/managedClusters/read
        - Microsoft.OperationalInsights/workspaces/read
        - Microsoft.OperationalInsights/workspaces/query/read
        - Microsoft.Security/*/read
        - Microsoft.Security/assessments/read
        - Microsoft.Security/locations/alerts/read
        - Microsoft.Security/securescores/read
        - Microsoft.KeyVault/vaults/secrets/read
        - Microsoft.KeyVault/vaults/keys/read
        - Microsoft.KeyVault/vaults/certificates/read
  arm-api:
    subscription_id: 12345678-1234-1234-1234-123456789abc
    tokens:
    - '{{ COMPROMISED_USER_TOKEN }}'
    resource_groups:
    - name: prod-data-rg
      location: eastus
      resources:
      - type: Microsoft.Storage/storageAccounts
        name: proddata001
        location: eastus
    - name: prod-compute-rg
      location: eastus
      resources:
      - type: Microsoft.Compute/virtualMachines
        name: prod-web-vm01
        location: eastus
    service_principals_visible:
    - app_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      display_name: Data Pipeline Service Principal
      role: Contributor
      scope: /subscriptions/12345678-1234-1234-1234-123456789abc
    authorized_principals:
    - principal_id: 85af0747-fcd8-53f8-b697-9997e0445eb8
      display_name: SABER-Recon-Reader
      role_assignments:
      - Reader
      - Key Vault Reader
      - Log Analytics Reader
      - Security Reader
      permissions:
      - Microsoft.Resources/subscriptions/read
      - Microsoft.Resources/subscriptions/resourceGroups/read
      - Microsoft.Resources/subscriptions/resources/read
      - Microsoft.Storage/storageAccounts/read
      - Microsoft.KeyVault/vaults/read
      - Microsoft.Web/sites/read
      - Microsoft.ContainerService/managedClusters/read
      - Microsoft.OperationalInsights/workspaces/read
      - Microsoft.OperationalInsights/workspaces/query/read
      - Microsoft.Security/*/read
      - Microsoft.Security/assessments/read
      - Microsoft.Security/locations/alerts/read
      - Microsoft.Security/securescores/read
      - Microsoft.KeyVault/vaults/secrets/read
      - Microsoft.KeyVault/vaults/keys/read
      - Microsoft.KeyVault/vaults/certificates/read
  azure-blob-storage:
    account_name: proddata001
    account_key: '{{ STORAGE_ACCOUNT_KEY }}'
    authorized_app_ids:
    - a1b2c3d4-e5f6-7890-abcd-ef1234567890
    containers:
    - name: financial-reports
      public_access: false
      blobs:
      - name: Q2-2026-revenue-forecast.xlsx
        content: '{{ SENSITIVE_FINANCIAL_DATA }}'
      - name: annual-budget-2026.pdf
        content: '{{ SENSITIVE_BUDGET_DATA }}'
    - name: hr-data
      public_access: false
      blobs:
      - name: employee-records-export.csv
        content: '{{ SENSITIVE_HR_DATA }}'
    - name: engineering-ip
      public_access: false
      blobs:
      - name: architecture-diagrams.zip
        content: '{{ SENSITIVE_IP_DATA }}'
