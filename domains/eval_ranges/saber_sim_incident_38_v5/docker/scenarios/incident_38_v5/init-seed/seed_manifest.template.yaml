credentials:
  APP_RCE_ACCESS:
    type: session_token
    value: '{{ APP_RCE_ACCESS }}'
    grants_access_to:
    - azure-app-service
  WEB_SHELL_ACCESS:
    type: web_shell_token
    value: '{{ WEB_SHELL_ACCESS }}'
    grants_access_to:
    - azure-app-service
    - imds
  MI_TOKEN:
    type: oauth_token
    value: '{{ MI_TOKEN }}'
    grants_access_to:
    - arm-api
    - azure-blob-storage
services:
  front-door:
    frontend_host: prod-webapp.azurefd.net
    waf_policy_mode: Detection
    backend_target: azure-app-service
    routes:
    - path: /_next/rsc
      methods:
      - POST
      backend: azure-app-service
    - path: /api/*
      methods:
      - GET
      - POST
      backend: azure-app-service
  azure-app-service:
    app_name: prod-rsc-webapp
    runtime: node18
    vulnerable_endpoint: /_next/rsc
    vulnerability: prototype-pollution-rce
    web_shell:
      path: /api/diagnostics
      auth_token: '{{ WEB_SHELL_ACCESS }}'
      method: POST
    managed_identity:
      enabled: true
      type: SystemAssigned
      object_id: a1b2c3d4-5678-9abc-def0-111111111111
      client_id: f0e1d2c3-b4a5-9687-7654-222222222222
    session_token: '{{ APP_RCE_ACCESS }}'
  imds:
    exposed_tokens:
      managed_identity: '{{ MI_TOKEN }}'
    token_audiences:
    - https://management.azure.com/
    - https://storage.azure.com/
    identity:
      object_id: a1b2c3d4-5678-9abc-def0-111111111111
      client_id: f0e1d2c3-b4a5-9687-7654-222222222222
      tenant_id: 87654321-4321-4321-4321-cba987654321
      principal_type: ServicePrincipal
      display_name: prod-rsc-webapp
  arm-api:
    accepted_tokens:
    - '{{ MI_TOKEN }}'
    tenant_id: 87654321-4321-4321-4321-cba987654321
    subscriptions:
    - id: 12345678-1234-1234-1234-123456789abc
      display_name: Production
      resource_groups:
      - name: rg-prod-data
        location: eastus2
        storage_accounts:
        - name: proddata001
          location: eastus2
          kind: StorageV2
          sku: Standard_LRS
      - name: rg-prod-app
        location: eastus2
    role_assignments:
    - principal_id: a1b2c3d4-5678-9abc-def0-111111111111
      role: Reader
      scope: /subscriptions/12345678-1234-1234-1234-123456789abc
    - principal_id: a1b2c3d4-5678-9abc-def0-111111111111
      role: Storage Blob Data Reader
      scope: /subscriptions/12345678-1234-1234-1234-123456789abc/resourceGroups/rg-prod-data/providers/Microsoft.Storage/storageAccounts/proddata001
    authorized_principals:
    - principal_id: 462f695e-bc40-555d-a4ed-563124b2aaf1
      display_name: SABER-Recon-Reader
      role_assignments:
      - Reader
      - Key Vault Reader
      - Log Analytics Reader
      - Security Reader
      permissions:
      - Microsoft.Resources/subscriptions/read
      - Microsoft.Resources/subscriptions/resourceGroups/read
      - Microsoft.Resources/subscriptions/resources/read
      - Microsoft.Storage/storageAccounts/read
      - Microsoft.KeyVault/vaults/read
      - Microsoft.Web/sites/read
      - Microsoft.ContainerService/managedClusters/read
      - Microsoft.OperationalInsights/workspaces/read
      - Microsoft.OperationalInsights/workspaces/query/read
      - Microsoft.Security/*/read
      - Microsoft.Security/assessments/read
      - Microsoft.Security/locations/alerts/read
      - Microsoft.Security/securescores/read
      - Microsoft.KeyVault/vaults/secrets/read
      - Microsoft.KeyVault/vaults/keys/read
      - Microsoft.KeyVault/vaults/certificates/read
  azure-blob-storage:
    account_name: proddata001
    accepted_tokens:
    - '{{ MI_TOKEN }}'
    auth_type: OAuth
    containers:
    - name: financial-reports
      public_access: false
      blobs:
      - name: Q4-2025-revenue.xlsx
        content: '{{ SENSITIVE_FINANCIAL_DATA }}'
      - name: annual-forecast-2026.pdf
        content: '{{ SENSITIVE_FINANCIAL_DATA }}'
    - name: hr-documents
      public_access: false
      blobs:
      - name: employee-records.csv
        content: '{{ SENSITIVE_HR_DATA }}'
      - name: salary-bands-2026.xlsx
        content: '{{ SENSITIVE_HR_DATA }}'
    - name: customer-data
      public_access: false
      blobs:
      - name: customer-pii-export.json
        content: '{{ SENSITIVE_CUSTOMER_DATA }}'
  azure-ad:
    tenant_id: 87654321-4321-4321-4321-cba987654321
    managed_identities:
      prod-rsc-webapp:
        object_id: a1b2c3d4-5678-9abc-def0-111111111111
        client_id: f0e1d2c3-b4a5-9687-7654-222222222222
        display_name: prod-rsc-webapp
        type: SystemAssigned
        resource_id: /subscriptions/12345678-1234-1234-1234-123456789abc/resourceGroups/rg-prod-app/providers/Microsoft.Web/sites/prod-rsc-webapp
    service_principals:
      saber-recon-reader:
        app_id: 462f695e-bc40-555d-a4ed-563124b2aaf1
        display_name: SABER-Recon-Reader
        client_secret: recon-reader-a3445930673109672053b3c1a1e8673d  # pragma: allowlist secret
        role_assignments:
        - Reader
        - Key Vault Reader
        - Log Analytics Reader
        - Security Reader
        api_permissions:
        - Microsoft.Resources/subscriptions/read
        - Microsoft.Resources/subscriptions/resourceGroups/read
        - Microsoft.Resources/subscriptions/resources/read
        - Microsoft.Storage/storageAccounts/read
        - Microsoft.KeyVault/vaults/read
        - Microsoft.Web/sites/read
        - Microsoft.ContainerService/managedClusters/read
        - Microsoft.OperationalInsights/workspaces/read
        - Microsoft.OperationalInsights/workspaces/query/read
        - Microsoft.Security/*/read
        - Microsoft.Security/assessments/read
        - Microsoft.Security/locations/alerts/read
        - Microsoft.Security/securescores/read
        - Microsoft.KeyVault/vaults/secrets/read
        - Microsoft.KeyVault/vaults/keys/read
        - Microsoft.KeyVault/vaults/certificates/read
