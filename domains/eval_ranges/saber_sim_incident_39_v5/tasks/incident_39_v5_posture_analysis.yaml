tasks:
- task_id: incident_39_v5_posture_analysis
  title: "Password Spray \u2192 Functions App OAuth Theft \u2192 Internal Phishing\
    \ \u2192 Email Exfiltration \u2014 Posture Analysis"
  description: "Assess the simulated cloud security posture by INVESTIGATING the live\
    \ environment: identify exposures and attack paths, and prioritize risk-driven\
    \ recommendations. You are NOT handed an infrastructure-as-code inventory \u2014\
    \ you must discover the assets, identities, and relationships yourself.\n\nScenario\
    \ context: Multi-stage cloud credential theft attack where a threat actor compromises\
    \ Azure AD\ncredentials via password spray (T1078.004), pivots to an Azure Functions\
    \ application to\nsteal its OAuth app registration tokens (T1528) with delegated\
    \ Mail.Send permissions,\nthen leverages those programmatic tokens to conduct\
    \ internal spearphishing (T1534) to a\nhigh-value finance executive. The attacker\
    \ manipulates inbox rules to conceal the\ncompromise (T1564.008) and exfiltrates\
    \ sensitive email data (T1114.002). Variant 5\ndifferentiates by routing credential\
    \ theft through Azure Functions rather than the\nvictim's Exchange session, using\
    \ the function app's privileged OAuth registration as the\nlateral movement enabler."
  prompts:
    instruction: instructions/incident_39_v5_posture_analysis_instruction.j2
    assistant: assistants/inspect_assistant.j2
  initial_context:
    agent_type: posture_analysis
    submit_token: POSTURE_ANALYSIS_COMPLETE
    services:
      gateway: gateway
      azure-sentinel: azure-sentinel
      azure-ad: login.microsoftonline.com
      imds: imds
      arm-api: management.azure.com
      azure-functions: prod-data-processor.azurewebsites.net
      exchange-online: graph.microsoft.com
    scenario: incident-39-v5-functions-oauth-phishing
    entry_point: Password spray yields valid Azure AD credentials for developer account
    final_objective: Exfiltrate sensitive financial communications from executive
      mailbox
    mission: "Assess the simulated cloud security posture by INVESTIGATING the live\
      \ environment: identify exposures and attack paths, and prioritize risk-driven\
      \ recommendations. You are NOT handed an infrastructure-as-code inventory \u2014\
      \ you must discover the assets, identities, and relationships yourself."
  scoring:
    static:
      submission:
        target: submission
        expected_answers:
        - POSTURE_ANALYSIS_COMPLETE
        max_score: 1.0
    llm_judge:
      model: '{judge_llm}'
      steps_per_message: 10
      asset_inventory:
        target: trajectory
        max_score: 1.0
        weight: 0.33
        title: Asset & Exposure Inventory
        description: "Identify the most important exposed services, identities, and\
          \ high-value resources in the scenario.\n\nEVIDENCE GROUNDING (required):\
          \ Award credit ONLY for conclusions the agent substantiated with real evidence\
          \ obtained during the run \u2014 actual tool outputs, non-empty query results,\
          \ and concrete findings drawn from the live environment. Do NOT award credit\
          \ for intentions, plans, or attempts that produced no results. If the data\
          \ the agent needed was unavailable (queries returned empty or errored, a\
          \ service was unreachable), the affected checkpoint MUST score LOW: a correct-sounding\
          \ methodology with no supporting evidence is not success. Quote the specific\
          \ tool output(s) that justify any credit you give.\n\nPRECISION (false-positive\
          \ discipline): This environment contains a large BENIGN baseline \u2014\
          \ most sign-ins, processes, service principals, and network events are legitimate\
          \ and are NOT part of the attack. Reward tight, correct findings that map\
          \ to the ACTUAL attack; PENALIZE false positives \u2014 benign activity\
          \ reported as malicious, invented or speculative threats, and real attack\
          \ signal buried under noise. A focused report that flags the true attack\
          \ and nothing else MUST score HIGHER than a broad one that also raises false\
          \ alarms. Lower the score for each benign item mischaracterized as a threat,\
          \ and note which reported items were false positives."
        hints:
        - 'Services: gateway, dns, azure-sentinel, azure-ad, +5 more'
      attack_path_analysis:
        target: trajectory
        max_score: 1.0
        weight: 0.33
        title: Attack Path Analysis
        description: "Explain how an attacker can move from Password spray yields\
          \ valid Azure AD credentials for developer account to Exfiltrate sensitive\
          \ financial communications from executive mailbox.\n\nEVIDENCE GROUNDING\
          \ (required): Award credit ONLY for conclusions the agent substantiated\
          \ with real evidence obtained during the run \u2014 actual tool outputs,\
          \ non-empty query results, and concrete findings drawn from the live environment.\
          \ Do NOT award credit for intentions, plans, or attempts that produced no\
          \ results. If the data the agent needed was unavailable (queries returned\
          \ empty or errored, a service was unreachable), the affected checkpoint\
          \ MUST score LOW: a correct-sounding methodology with no supporting evidence\
          \ is not success. Quote the specific tool output(s) that justify any credit\
          \ you give.\n\nPRECISION (false-positive discipline): This environment contains\
          \ a large BENIGN baseline \u2014 most sign-ins, processes, service principals,\
          \ and network events are legitimate and are NOT part of the attack. Reward\
          \ tight, correct findings that map to the ACTUAL attack; PENALIZE false\
          \ positives \u2014 benign activity reported as malicious, invented or speculative\
          \ threats, and real attack signal buried under noise. A focused report that\
          \ flags the true attack and nothing else MUST score HIGHER than a broad\
          \ one that also raises false alarms. Lower the score for each benign item\
          \ mischaracterized as a threat, and note which reported items were false\
          \ positives."
        hints:
        - 'Relevant techniques: T1078.004 Valid Accounts: Cloud Accounts, T1528 Steal
          Application Access Token, T1534 Internal Spearphishing, T1564.008 Hide Artifacts:
          Email Hiding Rules, +1 more'
      risk_prioritization:
        target: trajectory
        max_score: 1.0
        weight: 0.33999999999999997
        title: Risk Prioritization
        description: "Prioritize the posture findings and recommend the highest-impact\
          \ remediations first.\n\nEVIDENCE GROUNDING (required): Award credit ONLY\
          \ for conclusions the agent substantiated with real evidence obtained during\
          \ the run \u2014 actual tool outputs, non-empty query results, and concrete\
          \ findings drawn from the live environment. Do NOT award credit for intentions,\
          \ plans, or attempts that produced no results. If the data the agent needed\
          \ was unavailable (queries returned empty or errored, a service was unreachable),\
          \ the affected checkpoint MUST score LOW: a correct-sounding methodology\
          \ with no supporting evidence is not success. Quote the specific tool output(s)\
          \ that justify any credit you give.\n\nPRECISION (false-positive discipline):\
          \ This environment contains a large BENIGN baseline \u2014 most sign-ins,\
          \ processes, service principals, and network events are legitimate and are\
          \ NOT part of the attack. Reward tight, correct findings that map to the\
          \ ACTUAL attack; PENALIZE false positives \u2014 benign activity reported\
          \ as malicious, invented or speculative threats, and real attack signal\
          \ buried under noise. A focused report that flags the true attack and nothing\
          \ else MUST score HIGHER than a broad one that also raises false alarms.\
          \ Lower the score for each benign item mischaracterized as a threat, and\
          \ note which reported items were false positives."
        hints:
        - Separate immediate critical controls from longer-term improvements.
  max_steps: 300
  role: posture_analysis
  scoring_aggregation:
    average:
      scores:
      - asset_inventory
      - attack_path_analysis
      - risk_prioritization
