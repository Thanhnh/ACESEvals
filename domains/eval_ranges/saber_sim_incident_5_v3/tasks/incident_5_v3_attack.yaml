          signals:
          - table: DeviceProcessEvents
            surface: defender
            marker_col: ProcessCommandLine
            marker_sub: wmic
        - id: T1003.006
          signals:
          - table: SecurityEvent
            surface: sentinel
            marker_col: EventID
            marker_sub: '4662'
          - table: IdentityDirectoryEvents
            surface: defender
            marker_col: ActionType
