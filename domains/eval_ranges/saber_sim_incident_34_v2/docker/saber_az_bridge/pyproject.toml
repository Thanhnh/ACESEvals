[project]
name = "saber-az-bridge"
version = "0.1.0"
description = "SABER-Sim mock Azure CLI bridge"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.28.0",
  "PyYAML>=6.0",
  "jmespath>=1.0.1",
]

[project.scripts]
az = "saber_az_bridge.cli:main"
saber-az-bridge = "saber_az_bridge.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
