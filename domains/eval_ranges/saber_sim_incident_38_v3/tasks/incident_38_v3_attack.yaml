        max_score: 1.0
        weight: 0.14
        title: 'Initial Access: Exploit Public-Facing Application'
        description: "Exploit IIS deserialization vulnerability and deploy ASPX web\
          \ shell\n\nEVIDENCE GROUNDING (required): Award credit ONLY for conclusions\
